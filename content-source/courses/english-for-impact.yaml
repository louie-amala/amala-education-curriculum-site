# English for Impact (A1/A2) — standalone emerging-English course.
# Source: "Amala_English for Impact A1-A2 Course Guide by The Language Learning Lab (April 25, 2026).pdf"
# (68pp, by Nina / The Language Learning Lab). Parts 1–2 (philosophy, learner model, 5-unit design,
# phonics/grammar progressions, per-unit plans) are extracted here; Part 3 "Instructional Resources
# and Tools" is largely marked IN DEVELOPMENT in the source and is not yet modelled as materials.
#
# The source is a CEFR language course and does NOT cite Amala competency codes. The throughline
# anchor (FLC3 Influential communication) and the per-objective competencyEvidence are AUTHORED by
# mapping the course's voice/communication aims onto the framework — see sourceIssues. Competency
# codes and titles verified against framework/competencies.yaml.
#
# Authored as a STANDALONE course (programmes: []). Its use within the Learning Bridge programme
# (as the "English Language Development" component) is to be worked out separately — see sourceIssues.
id: english-for-impact
slug: english-for-impact
access: public
title: English for Impact
strapline: "Building voice, communication, and confidence at the A1/A2 level."
programmes: []            # standalone for now; Learning Bridge placement TBD (see sourceIssues)
testimonial: null

purpose: >-
  English for Impact supports older multilingual learners (ages 14–25) to develop English rapidly and
  meaningfully, from a beginner A1 start toward a strong A2+ level — a foundation for further academic
  pathways such as the Global Secondary Diploma, which requires B1. The course is built on the belief
  that learners already bring rich knowledge, life experience, and linguistic resources, and that
  language is learned best when it is purposeful and connected to real life. Across five spiralling
  units — My Voice, My Story, Our Stories, Our World, Our Impact — learners move from introducing
  themselves to persuading an audience, each unit culminating in an authentic project with a real
  purpose and audience. Translanguaging, a strength-based and growth-oriented stance, and
  trauma-sensitive practice run throughout, so learners build not only language but confidence, agency,
  and voice.

# Narrative spine: agency for positive change → FLC3 Influential communication → the five units.
throughline:
  anchorCompetency: FLC3
  fromAgency: >-
    Agency for positive change is the ability and will to make informed, intentional, and impactful
    decisions that improve one's own life and contribute to positive change in the community. Voice is
    its precondition: a learner can only participate, connect, and influence once they can make
    themselves understood. English for Impact treats a new language not as a set of rules to master but
    as a tool for being heard — and Influential communication (FLC3), the ability to express ideas
    clearly and move an audience, is the competency that turns emerging language into real
    participation. Every unit ends by putting the learner in front of an audience, so growing English
    proficiency is, from the first hour, growing capacity to act and be heard.
  toObjectives: >-
    The five units sequence a widening circle of communication — self, story, other people, the wider
    world, and a call to act — so learners both develop and demonstrate FLC3 at a rising level. They
    move from introducing themselves (A1-) to telling a personal story (A1), interviewing and
    representing another person (A1+→A2-), reporting on real-world events (A2), and finally persuading
    an audience to act on an issue they care about (A2+). Influential communication is foregrounded in
    every unit's authentic project; the supporting competencies — self-awareness, understanding others,
    and fostering connection — are what give that communication something worth saying.
  develops: >-
    Learners develop FLC3 along a deliberate spiral. Each unit adds range (new phonics, grammar,
    vocabulary, and text types) in the service of a wider communicative purpose, and revisits earlier
    language so control deepens over time. Because learners draw on their full linguistic repertoire
    through translanguaging — thinking and drafting in their Home Language(s) before moving into
    English — they can communicate higher-level ideas than their English alone would allow, and the
    balance shifts toward English as they progress, especially in final products and presentations.
  demonstrates: >-
    Learners demonstrate FLC3 through five authentic projects, each shared with a real audience: a
    personal identity artifact (My Name, My Voice), a personal narrative (Author's Reading), a
    magazine-style peer biography (Our Stories magazine), a news article (Our World newspaper), and a
    persuasive speech (Our Impact showcase). Each project is assessed against Can-Do-aligned criteria
    and a growth tracker, so the evidence shows not just what a learner can say, but that they can
    communicate it clearly and purposefully to others.

requirements:
  structuredHours: 225        # source: "approximately 200–250 hours" to reach A2+ from a beginner start
  durationWeeks: 20           # the "more achievable" model (~10 hrs/week); a 10-week model is also offered
  cadence: 10–20 weeks
  liveIndependentSplit: null  # not split in the source; significant independent practice is expected
  notes: >-
    The source estimates approximately 200–250 hours of instruction and practice to reach A2+ from a
    beginner start (A1 ≈ 60–100 hrs; A2 ≈ a further 100–150 hrs). Pacing is flexible: a 10-week model
    (~20 hrs/week) is highly ambitious, while a 20-week model (~10 hrs/week) allows more consolidation.
    Each of the five units is designed for a similar duration (≈ 20–40 hrs). Reaching A2+ also depends
    on consistent attendance, regular independent practice, and active use of English outside class.

objectives:
  # Objective = one of the five "I Can" units from the Scope & Sequence (guide p20).
  - statement: >-
      Say who you are: introduce yourself and express your identity in simple English. (Unit 1 — My Voice, A1-)
    anchorContribution:
      develops: >-
        Learners take the first step of FLC3 — making themselves understood — by building the
        foundational sounds, words, and sentence patterns needed to say who they are, and using them to
        communicate identity to a real audience.
      demonstrates: >-
        A personal identity artifact and a spoken "My Name, My Voice" introduction show a learner
        communicating basic personal information clearly to an audience — the first evidence of FLC3.
    supportedTo:
      - Recognise and use the uppercase and lowercase letters of the English alphabet, and identify and produce key English sounds (short vowels and common consonants).
      - Understand and use high-frequency vocabulary related to personal identity.
      - Use subject pronouns and the verb "to be" to introduce themselves in simple sentences (e.g. "I am…", "I live…", "I like…").
      - Ask and answer simple questions about personal information with support.
      - Read and understand simple words and short phrases, and write short, simple sentences using models and scaffolds.
      - Present basic personal information to an audience with growing confidence.
    furtherDetails:
      concepts:
        - "Phonics focus: the alphabet, vowels vs consonants, short vowels a/o/u, common consonants (s, t, l, m, n), hard \"k\" sounds, and plosives (voiceless /p/ /t/ /k/, voiced /b/ /d/ /g/)."
        - "Grammar focus: the verb \"to be\", subject pronouns, and basic sentence structure (Subject + be + complement)."
      activities:
        - "Authentic project — My Voice, My Name: a personal identity artifact using the alphabet, key sounds, and simple sentences, connected to meaningful words from the learner's own life."
        - A "My Name, My Voice" sharing experience where learners present their artifact to peers or a wider audience.
    competencyEvidence:
      - { code: FLC3, citedTitle: Influential communication, condition: "If learners communicate who they are clearly to an audience using simple spoken and written English." }
      - { code: FUS1, citedTitle: Developing self-awareness, condition: "If learners reflect on and express their own identity, strengths, and interests." }

  - statement: >-
      Share your story: tell a personal story about your life and experiences in short, connected English. (Unit 2 — My Story, A1)
    anchorContribution:
      develops: >-
        Learners extend FLC3 from single sentences to connected ideas, developing the control of tense,
        connectors, and structure needed to narrate an experience so a listener or reader can follow it.
      demonstrates: >-
        A written personal narrative and an "Author's Reading" of it demonstrate a learner communicating
        a meaningful experience clearly, with a beginning-to-end shape an audience can follow.
    supportedTo:
      - Use the present simple tense to describe daily routines, habits, and experiences, with high-frequency verbs and increasing accuracy.
      - Form simple sentences and expand them using basic connectors (e.g. "and", "but").
      - Write short paragraphs about familiar topics using models and sentence frames (e.g. "First, Next, Then, Finally").
      - Read and understand short texts about daily life, and identify key information in them.
      - Participate in simple conversations about routines and experiences.
      - Use translanguaging to develop and organise ideas in their Home Language(s) before expressing them in English.
    furtherDetails:
      concepts:
        - "Phonics focus: short vowels e/i (review a/o/u), CVC patterns, and fricative sounds (f, v, s, z; sh, ch, th), with sound discrimination (e.g. bit vs bet)."
        - "Grammar focus: present simple for routines, 3rd-person singular -s, basic connectors, simple negatives, and sentence expansion."
      activities:
        - "Authentic project — The Moment That Shaped Me: a personal narrative developed first through translanguaging, then drafted and revised in English using sentence frames and models."
        - "An Author's Reading where learners share their story with peers or a wider audience, with optional submission to authentic platforms (e.g. student writing contests)."
    competencyEvidence:
      - { code: FLC3, citedTitle: Influential communication, condition: "If learners tell a personal story clearly enough for an audience to follow and connect with it." }
      - { code: FUS1, citedTitle: Developing self-awareness, condition: "If learners reflect on a meaningful moment that has shaped who they are." }

  - statement: >-
      Interact with others: ask about, understand, and share another person's story. (Unit 3 — Our Stories, A1+ → A2-)
    anchorContribution:
      develops: >-
        Learners develop FLC3 as two-way communication — asking questions, listening for key
        information, and representing what they have heard — the interactive core of communicating with,
        not just to, others.
      demonstrates: >-
        A conducted interview and a magazine-style biography of a peer demonstrate a learner gathering
        another person's story and communicating it clearly and respectfully to an audience.
    supportedTo:
      - Ask and answer simple questions using wh- words and yes/no structures, with correct question word order.
      - Understand and respond to spoken questions about familiar topics.
      - Use the present continuous tense to describe actions happening now, and contrast it with the present simple (e.g. "I work" vs "I am working").
      - Read and understand short texts about people's lives, and identify key details from spoken and written information.
      - Conduct a simple interview, record key information, and write short paragraphs describing another person.
      - Present information about another person with increasing clarity and confidence.
    furtherDetails:
      concepts:
        - "Phonics focus: long vowels, the silent-e pattern, vowel teams (ai, ay, ee, ea, oa), y as a vowel, -ng, hard/soft c and g, and silent letters (kn, gn)."
        - "Grammar focus: wh- question words, question formation and word order, yes/no questions with \"do\", short answers, and the present continuous contrasted with the present simple."
      activities:
        - "Authentic project — Our Stories Magazine: learners interview a peer and write a magazine-style biography, using translanguaging to generate rich detail before drafting in English."
        - "Publication of a class magazine, Our Stories, with an optional speaking extension (read-aloud or podcast), celebrating the diverse voices in the group."
    competencyEvidence:
      - { code: FLC3, citedTitle: Influential communication, condition: "If learners gather and communicate another person's story clearly to an audience." }
      - { code: FUS2, citedTitle: Understanding other people, condition: "If learners listen to and accurately represent a peer's experiences and perspective." }
      - { code: FLC2, citedTitle: Fostering connection and belonging, condition: "If learners celebrate and give voice to the diverse stories within their learning community." }

  - statement: >-
      Understand the world: read about and report on real-world events and issues in English. (Unit 4 — Our World, A2)
    anchorContribution:
      develops: >-
        Learners develop FLC3 toward informational communication — reading sources, identifying key
        ideas, and reporting them clearly and accurately in their own words for a reader.
      demonstrates: >-
        A short news article contributed to a class newspaper demonstrates a learner summarising and
        reporting real-world information clearly, with an organised structure and appropriate tense.
    supportedTo:
      - Understand and describe real-world events using present and past tenses, including "there is / are / was / were" and regular and common irregular past-tense verbs.
      - Read and understand short informational and news-style texts, and identify key ideas and supporting details.
      - Summarise information in simple, clear language and organise writing into logical sequences.
      - Compare information from different sources, drawing on Home Language(s) through translanguaging to deepen understanding.
      - Collaborate to research and present information, and write short informational texts (e.g. news reports).
      - Share information about real-world topics with increasing confidence.
    furtherDetails:
      concepts:
        - "Phonics focus: r-controlled vowels (\"bossy R\": er, ir, ur, ar, or), additional patterns (air, ear, ire, ure, our), and -ed past-tense pronunciation (/t/, /d/, /ɪd/)."
        - "Grammar focus: \"there is/are/was/were\", present vs past simple, regular and irregular past-tense verbs, time expressions, compound sentences with connectors, and prepositions of place."
      activities:
        - "Authentic project — Our World Community Newspaper: an introduction to research and news writing, reading news in English and Home Language(s) and writing articles that report on local or global issues."
        - "Publication of a class newspaper, Our World, with an optional speaking extension (a newscast or presentations)."
    competencyEvidence:
      - { code: FLC3, citedTitle: Influential communication, condition: "If learners report real-world information clearly and accurately to a reader or audience." }
      - { code: FSI1, citedTitle: Investigate real-world issues, condition: "If learners read, compare sources, and research a local or global issue to write about it." }
      - { code: FUS2, citedTitle: Understanding other people, condition: "If learners engage with perspectives on local and global events beyond their own." }

  - statement: >-
      Change the world: express your opinions and persuade an audience to act on an issue you care about. (Unit 5 — Our Impact, A2+)
    anchorContribution:
      develops: >-
        Learners develop the most demanding form of FLC3 — influential communication — by stating an
        opinion, justifying it with reasons, and structuring an argument designed to move an audience to
        act.
      demonstrates: >-
        A persuasive speech delivered at a public showcase, and its written argument, demonstrate a
        learner communicating a clear opinion with reasons and a proposed solution to a real audience —
        the fullest evidence of FLC3.
    supportedTo:
      - Express opinions using clear structures (e.g. "I think… because…") and use modal verbs to suggest solutions (e.g. "should, must, can").
      - Use future forms ("going to", "will") to describe plans and actions.
      - Use connectors to organise and strengthen an argument (e.g. "so", "because", "for example", "therefore").
      - Read and understand short persuasive or opinion texts, and identify main ideas and supporting reasons.
      - Develop and organise ideas into a simple argument, and write a short persuasive text with reasons and examples.
      - Speak clearly to present an idea or solution to an audience, communicating about real-world issues with confidence.
    furtherDetails:
      concepts:
        - "Phonics focus: complex vowel teams (oo, ow/ou, oi/oy, aw/au) and \"gh\" patterns (igh, -aught/-ought, -augh, gh)."
        - "Grammar focus: opinion structures, modal verbs (should, must, can, could), future forms (going to, will), and connectors grouped by purpose (addition, cause/result, examples)."
      activities:
        - "Authentic project — Our Impact, Voices for Change: learners identify a real community issue and develop a persuasive message proposing a solution, using translanguaging to research and develop ideas."
        - "A public speaking event or community showcase where learners present their ideas to an authentic audience, demonstrating readiness for A2+ to B1-level communication."
    competencyEvidence:
      - { code: FLC3, citedTitle: Influential communication, condition: "If learners persuade an audience with a clear opinion, supporting reasons, and a proposed solution." }
      - { code: FSI1, citedTitle: Investigate real-world issues, condition: "If learners identify and research a real community issue as the basis for their argument." }
      - { code: FLC2, citedTitle: Fostering connection and belonging, condition: "If learners speak to and for their community about an issue that matters to it." }

principleMappings:
  # All 9 principles mapped, tailored to English for Impact.
  - principle: builds-on-identities
    inThisCourse:
      - Every unit begins from the learner's own identity, story, and community — from a personal identity artifact to a self-chosen community issue.
      - Translanguaging treats learners' Home Language(s) as a strength and a resource, not a deficit to be corrected.
      - Educators invite learners to bring meaningful words, experiences, and perspectives from their own lives into their English.
  - principle: collaboration
    inThisCourse:
      - Learners interview peers, co-create class magazines and newspapers, and give and receive feedback throughout.
      - Pair and group work, discussion, and peer review are built into every unit.
      - Facilitators model supportive, low-pressure participation so all learners feel able to speak and try.
  - principle: lifeworthy-competencies
    inThisCourse:
      - Learners build communication, confidence, and self-expression — capabilities that transfer across education, work, and life.
      - The course develops academic skills (reading, research, structured writing, presenting) that prepare learners for further study such as the GSD.
      - Voice and influential communication are framed as tools learners will use well beyond the classroom.
  - principle: authentic-challenges
    inThisCourse:
      - Each unit culminates in a real project with a genuine purpose and audience, not an isolated exercise.
      - Learners engage with real community and world issues, especially in Our World and Our Impact.
      - Projects can reach authentic platforms — writing contests, class publications, public showcases.
  - principle: responsible-action
    inThisCourse:
      - Learners handle their own and others' stories with care, consent, and respect, especially when interviewing peers.
      - The persuasive unit develops opinions that are reasoned and constructive, proposing solutions rather than simply criticising.
      - Educators foreground ethical, respectful communication as part of what it means to be understood.
  - principle: recognise-communicate-growth
    inThisCourse:
      - Growth trackers and "I Can…" statements help learners see and name their own progress in accessible language.
      - Learners focus on progress ("I can now write a paragraph about my life") rather than on a level they have not yet reached.
      - Each unit makes growth visible by comparing current work to earlier work.
  - principle: connect-to-futures
    inThisCourse:
      - The course is explicitly a bridge toward B1 and further academic pathways such as the Global Secondary Diploma.
      - Learners connect English to the futures they are building — study, work, and opportunity.
      - Research, reading, and structured writing tasks prepare learners for the academic demands ahead.
  - principle: feedback-and-data
    inThisCourse:
      - Feedback is focused (1–3 high-impact areas), strength-based, and supported with models and examples.
      - Can-Do statements and growth trackers give learners and educators structured, flexible progress data.
      - Educators use learner progress to adjust pacing and support while maintaining overall progression.
  - principle: safe-spaces
    inThisCourse:
      - A trauma-sensitive approach creates a safe, predictable, supportive environment with consistent routines.
      - Learners are never pressured to speak or share personal experiences, and choice and flexibility are offered where possible.
      - Errors are framed as a natural, expected part of learning, and communication is valued over perfection.

designChecklist:
  - My course design includes approximately 200–250 hours of learning experiences/tasks, sequenced across five units.
  - My course design is appropriate for my context (e.g. relevant topics, safe and trauma-sensitive activities, resource-optimised, culturally and linguistically accessible).
  - My course design is mostly aligned with Amala's principles for transformative education (and where it is not aligned, I have reflected on how I can improve alignment in the future).
  - Course design supports learners in making progress towards all of the course objectives.
  - Grammar, phonics, and vocabulary are directly connected to unit outcomes and authentic projects.
  - Opportunities for learners to generate and submit evidence that can be used to evaluate their proficiency in the Amala competencies — especially the anchor competency FLC3 — are built into the course design.

sourceIssues:
  - type: competency-mapping-authored
    detail: >-
      The source is a CEFR (A1/A2) language course and does not cite Amala competency codes. The
      throughline anchor (FLC3 Influential communication), the supporting competencies (FUS1, FUS2,
      FLC2, FSI1), and the per-objective competencyEvidence conditions are AUTHORED by mapping the
      course's voice/communication aims and authentic projects onto the framework. The fit is genuine
      but looser than the competency-designed courses (Research Project, Agency in Learning): the
      course's primary spine is language progression, with competency evidence carried mainly by the
      five authentic projects.
  - type: part-3-in-development
    detail: >-
      Part 3 "Instructional Resources and Tools" (sections 11–18: grammar exercises for units 2–5,
      vocabulary lists, reading texts, writing/speaking scaffolds, learner-agency tools, Can-Do
      checklists, sample rubrics, project templates, teacher reference/error guides, translanguaging
      examples) is largely stamped "IN DEVELOPMENT" in the source. Only the phonics tables (§10) and a
      full set of Unit 1 grammar exercises are built. These resources are not yet modelled as site
      materials/downloads.
  - type: can-do-appendix-unresolved
    detail: >-
      The unit plans reference "A1/A2-Level Can Do statements (See Appendix ?)" for their assessment
      approach, but the Can-Do appendix is not present in the source (§15a is "in development").
  - type: literacy-assumption
    detail: >-
      The course assumes strong Home Language literacy ("learners can read and write in their Home
      Language(s)"). It is therefore not suitable as-is for low-literacy, oral/visual-first contexts
      (e.g. the Cox's Bazar Learning Bridge edition, where most learners are not literate) without
      substantial adaptation.
  - type: programme-placement-pending
    detail: >-
      Authored as a standalone course (programmes: []). The email that accompanied the guide frames it
      as a "Learning Bridge+" course, and the Learning Bridge programme already lists an optional
      "English Language Development" component. How to use this course within Learning Bridge is to be
      worked out separately; it is deliberately not wired into any programme yet.
  - type: source-typos
    detail: >-
      Minor typographical errors in the source, recorded not corrected (per the extraction convention):
      "What is my identify" for "identity" (p24); "coirse"/"couirse" (p9); "Expanding Patters" (p50);
      "plays an instrumen" (p60). Content here uses the intended spellings.
  - type: strapline-authored
    detail: Strapline adapted from the source subtitle ("Building Voice, Communication & Confidence at the A1/A2 Level"); no one-line strapline exists in the source.
