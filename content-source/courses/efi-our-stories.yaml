# English for Impact — Unit 3 as a course. Source: LLL Course Guide, Unit 3 "Our Stories" (pp. 32–35).
# Competency anchor (FUS2) is authored — see sourceIssues.
id: efi-our-stories
slug: efi-our-stories
access: public
title: "Our Stories"
strapline: "Ask about, understand, and share someone else's story. (Unit 3 · A1+ → A2-)"
programmes: [english-for-impact]
testimonial: null
purpose: >-
  Our Stories expands learners from personal expression to interaction. They develop the skills to ask
  and answer questions, listen for key information, and share someone else's story in English. Learners
  build control of question forms and word order while developing the present continuous to describe
  actions happening now. Through interviews and collaborative work, and with translanguaging to develop
  ideas, the course culminates in a magazine-style biography of a peer, published in a class magazine.

throughline:
  anchorCompetency: FUS2
  fromAgency: >-
    Agency is exercised with and among other people. To contribute to a community, a learner must be
    able to understand others — to ask about their lives, listen, and represent them faithfully. Our
    Stories develops Understanding other people (FUS2): by interviewing a peer and telling their story
    accurately and respectfully, learners practise the attention to another person that connection and
    collaboration depend on.
  toObjectives: >-
    The three objectives move from the sounds and words of describing people, to asking questions and
    talking about what is happening now, and finally to interviewing a peer and writing their
    biography. The interview-and-biography project foregrounds FUS2.
  develops: >-
    Learners develop FUS2 by asking a peer about their life, listening for what matters, and
    representing their story accurately and respectfully — attending closely to someone other than
    themselves.
  demonstrates: >-
    Learners demonstrate FUS2 through a conducted interview and a magazine-style biography that
    represents a peer's life clearly and respectfully to an audience.

requirements:
  structuredHours: 50
  durationWeeks: 5
  cadence: ≈4–5 weeks
  liveIndependentSplit: 30 live / 20 independent
  notes: >-
    About 50 hours of structured learning — roughly 30 facilitated (live) and 20 independent —
    adaptable to pacing and instructional time. This unit bridges A1 to A2,
    with interviews and collaborative work at its centre.

objectives:
  - statement: >-
      Build the sounds and words to read about and describe other people.
    supportedTo:
      - Read and produce long vowels, the silent-e pattern, and vowel teams (ai, ay, ee, ea, oa), and recognise -ng, hard/soft c and g, and silent letters (kn, gn).
      - Read and understand short biographies and interview-style texts, identifying key details (who, what, where, when).
      - Understand and use question words, interview language, and descriptive vocabulary for people (friend, student, family, hobbies, interests).
    furtherDetails:
      concepts:
        - "Phonics focus: long vowels, silent e, vowel teams, y as a vowel, -ng, hard/soft c and g, silent letters."
      activities:
        - Adding new sounds and words to the personal Phonics Table; reading short biographies.
    competencyEvidence:
      - { code: FLC3, citedTitle: Influential communication, condition: "If learners read biographies and gather the vocabulary to describe another person." }

  - statement: >-
      Ask questions and describe what is happening now.
    supportedTo:
      - Ask and answer simple questions using wh- words and yes/no structures, with correct question word order.
      - Use yes/no questions with "do" and short answers; understand and respond to spoken questions about familiar topics.
      - Use the present continuous to describe actions happening now, and contrast it with the present simple (I work vs I am working).
      - Write short paragraphs describing another person, combining sentences for clarity.
    furtherDetails:
      concepts:
        - "Grammar focus: wh- question words, question formation and word order, yes/no questions with \"do\", short answers, and the present continuous vs present simple."
      activities:
        - Question-formation practice; interview role-plays and pair work.
    competencyEvidence:
      - { code: FLC3, citedTitle: Influential communication, condition: "If learners ask and answer questions and describe another person clearly." }

  - statement: >-
      Interview a peer and publish their story in a class magazine.
    anchorContribution:
      develops: >-
        Learners develop FUS2 by asking a peer about their life, listening for what matters, and
        representing their story accurately and respectfully — attending closely to someone else.
      demonstrates: >-
        A conducted interview and a magazine-style biography demonstrate understanding of another
        person: their life represented clearly and respectfully for an audience.
    supportedTo:
      - Develop and practise interview questions, then conduct a peer interview and record key information.
      - Use translanguaging to generate rich ideas and details before drafting in English.
      - Draft and revise a magazine-style biography, and present information about their partner with increasing clarity and confidence.
    furtherDetails:
      concepts:
        - Authentic project — Our Stories Magazine — an interview and biography of a peer.
      activities:
        - Publication of a class magazine, Our Stories, with an optional speaking extension (read-aloud or podcast).
    competencyEvidence:
      - { code: FUS2, citedTitle: Understanding other people, condition: "If learners listen to and accurately, respectfully represent a peer's life and perspective." }
      - { code: FLC2, citedTitle: Fostering connection and belonging, condition: "If learners give voice to the diverse stories within their learning community." }
      - { code: FLC3, citedTitle: Influential communication, condition: "If learners communicate another person's story clearly to an audience." }

principleMappings:
  - principle: builds-on-identities
    inThisCourse:
      - Learners' interviews surface peers' identities, experiences, and communities as the content of their writing.
  - principle: collaboration
    inThisCourse:
      - The course runs on pair and group work — interviews, role-plays, and a co-produced class magazine.
  - principle: responsible-action
    inThisCourse:
      - Learners handle a peer's story with care and consent, representing them faithfully and respectfully.
  - principle: safe-spaces
    inThisCourse:
      - Interview questions and sharing are kept safe and optional; learners choose what to ask and answer.
  - principle: lifeworthy-competencies
    inThisCourse:
      - Interviewing, listening, and representing others are transferable communication and research skills.

designChecklist:
  - The course includes ~20–40 hours of learning experiences integrating phonics, grammar, reading, writing, and speaking.
  - Grammar, phonics, and vocabulary are connected to the unit outcomes and the interview-and-biography project.
  - Opportunities to generate evidence for Amala competencies — especially the anchor FUS2 — are built into the interview project.

sourceIssues:
  - type: competency-mapping-authored
    detail: >-
      The source is a CEFR (A1→A2) language unit and cites no Amala competency codes. The anchor (FUS2
      Understanding other people) and the objective competencyEvidence are authored by mapping the
      unit's interview-and-represent focus onto the framework; FLC2 and FLC3 are cited as supporting.
  - type: part-of-programme
    detail: >-
      Unit 3 of the English for Impact programme, delivered as the third of five sequential courses.
