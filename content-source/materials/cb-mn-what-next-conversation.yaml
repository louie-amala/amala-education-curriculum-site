# The Week-12 mentoring conversation: what happens after the programme. The hardest conversation in the
# component, because the honest answer for some learners is "not the accredited pathway, not yet" and
# for others is "we do not know". The programme's mentoring block says to keep pathways conversations
# "honest and hopeful, focused on the next controllable step" and gave no way to do that.
