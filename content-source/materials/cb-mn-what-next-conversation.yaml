title: "The what-next conversation (Week 12)"
summary: >-
  The closing mentoring conversation: naming what actually changed, hearing the learner's own reading of
  it, and finding a next step that is inside their control - including when the honest answer is that
  the accredited place is not there yet.
facilitationContext:
- one-to-one-mentoring
primaryContext: one-to-one-mentoring
duration: "About 20 minutes, in the last week, after the final judgement is made"
educatorContent: |
  ## What makes this one hard

  Every other mentoring conversation ends with a step towards a goal. This one ends the relationship,
  and for some learners it ends with news they did not want. There are three versions of it and you
  will run all three.

  - The learner reached the readiness bar and a place is available.
  - The learner reached the bar and there is no place yet, or the timing is not theirs to decide.
  - The learner did not reach the bar.

  What they all have in common: the honest thing and the hopeful thing must be the same sentence. If
  you split them - say the honest thing then add a hopeful thing that is not connected to it - learners
  hear only the first half, and they are right to.

  ## Run it in this order

  **1. Ask them first.** Before you say anything about the judgement:

  > "Twelve weeks. What is different about you now?"

  Wait the five seconds. Their answer tells you what to build the rest of the conversation on, and it is
  the last piece of self-awareness evidence you will gather.

  **2. Name what you saw, specifically.** Not "you did well." One or two concrete things, from your
  record:

  > "In week four you could not say what you wanted to get better at. In week ten you changed your plan
  > yourself when the first way did not work. I saw you do that."

  Be specific rather than warm. A learner can dismiss praise; they cannot dismiss a description of something they
  did.

  **3. Give the judgement plainly, and say what it means.** No euphemism, no drawn-out preamble. Say the
  outcome, then immediately say what it does and does not mean.

  **4. Find the next controllable step.** See below.

  **5. Hand back the record of it.** Their book is theirs and it goes with them. Turn to the first pages
  once more. It is the most persuasive object in the room.

  ## Keeping it honest and hopeful at the same time

  The programme deliberately reframes goals around what is within a learner's control, because futures
  here are often blocked by things a young person cannot move. That same rule governs this conversation.

  **Do not** promise a place, a timeline, or an outcome that is not yours to give. That is not kindness. The promise comes due after you have stopped seeing them, and it teaches a
  learner that encouragement from adults is worth nothing.

  **Do** find the thing that is genuinely in their hands. There is always one, and it is usually
  smaller and more concrete than you expect:

  - Keep the goal cycle going on something new - they now have the method, and it is theirs.
  - Keep using English with the people they already practise with.
  - Teach something they learned to a younger sibling.
  - Keep the learning book and keep marking it.
  - One specific person to stay in contact with.

  **When the honest answer is "not yet":**

  > "You have not reached the bar for the accredited place this time. What you have is a way of setting
  > a goal and going after it, and you showed me you can use it. That does not go away, and it is not
  > waiting for anyone's permission."

  Then find the controllable step. Do not fill the silence after the bad news - let them have it.

  **When the answer is "we do not know":**

  Say that, rather than implying a decision has been made. "I do not know" from a trusted adult is
  survivable. A vague reassurance that turns out to be false is not.

  ## Three things to avoid

  1. **Making the whole conversation about the accredited pathway.** It is the door this programme is
     trying to open, and it is not the whole of what the learner gained. If the place is the only thing
     that counted, then a learner who does not get one learned nothing - which is untrue, and they will
     believe you.
  2. **Assuming continuation is the learner's decision.** For many learners, and disproportionately for
     girls, it is not. Ask who else will be part of the decision, and ask what would help them. This is
     often the conversation that leads to the optional significant adult meeting, if you have not
     already had one.
  3. **Ending without a handover.** If a learner is going on to something, they should leave knowing who
     to speak to and how. If they are not, tell your coordinator who is at risk of falling out of
     contact.

  ## Afterwards

  Note in your record what the learner said had changed, in their own words. Two things use it: the FSL2
  and FSI1 judgements, and NRC's reporting on what the programme actually did - for which a learner's
  own account of what changed is worth more than another number.
