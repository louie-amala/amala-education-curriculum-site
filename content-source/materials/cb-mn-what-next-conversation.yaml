  how: >-
    This is the conversation where a learner either leaves holding something they can act on, or leaves
    holding a verdict. Keeping the next step inside what they control - rather than inside a decision
    someone else makes about them - is the last and most consequential application of the reframe the
    whole edition is built on, and it is what determines whether the method they learned here gets used
    after Week 12.
