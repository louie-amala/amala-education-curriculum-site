learnerContent: |
  ## Why goals, and where am I now?

  This page is yours. You can draw, write, or say your answer, someone will write it for you if you
  ask, and nobody marks it right or wrong.

  - Read why setting your own goal matters, in the camp, and long after this course.
  - Mark the step on the ladder most like you **now**. Mark it again at the end.
  - Say or write the one thing you most want to be able to do by the end, and your next step.
