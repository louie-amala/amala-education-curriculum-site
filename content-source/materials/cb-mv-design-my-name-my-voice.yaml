educatorContent: |
  ## What you need to know before you teach this

  The authentic project the whole unit points at. A learner chooses what represents them and makes
  something they will keep, and for many it is the first thing they have ever made in English.

  ### It is a making block, and the making is the point

  Do not turn it into an assessment. The card should look like the learner made it, not like the class
  made thirty of the same thing. Vary nothing on purpose: different learners will use different
  amounts of English, different pictures, different arrangements. That is success, not inconsistency.

  ### Hold English expectations at A1-minus, and say so

  A name, two or three picture-words, and one simple sentence is a complete card. A card with a name
  and a beautiful drawing is also complete.

  Say this before anyone starts, because otherwise learners measure themselves against whoever writes
  most.

  ### The learner chooses everything on it

  What goes on the card is theirs, which is the agency of the block, and the reason it is the closing
  artefact. Do not correct their choices, do not suggest they add family if they have not, and do not
  redesign anyone's layout.

  ### Prepare the materials in advance, properly

  Card or thick paper, colours, something to display them on. This is the one material you cannot
  improvise on the day, and a beautiful card on flimsy paper does not survive being carried home.

  ### Rehearsal is part of this block, not the next one

  Every learner leaves having said their introduction aloud at least twice, in a same-gender pair. A
  learner who makes a card and has never said the words will freeze at the showcase.

  Point them at the "my spoken introduction" page, the ticked checklist of what to say, and let them
  practise from it.

  ### The showcase, and consent

  These are shown at the programme showcase, in front of guests the learners invited. Confirm before
  invitations go out that each learner is comfortable with theirs being seen, and offer the
  alternatives. A partner, a mentor, only the person they invited. Do not photograph cards or learners
  without NRC's consent process.

  ## Before they leave this block

  - Every learner has a finished card that they chose the contents of.
  - Every learner has said their introduction aloud at least twice, to a person.
  - Every learner knows what will happen at the showcase and what their options are.
learnerTeaching:
  title: "How to make your My Name, My Voice card"
  readAloud: |
    ## Your My Name, My Voice card

    This is the thing you make at the end. It says who you are, in English, in your own way, and you
    keep it.

    ### You choose everything on it

    Nobody will tell you what to put on your card. It is yours.

    Most cards have:

    - **Your name**, written big.
    - **A picture or two**, things that are you.
    - **A few words** from your own collection.
    - **One sentence**, if you want one.

    You can use all of those, or some of them.

    ### How much English is enough?

    Your name and a drawing is a finished card. Truly.

    Your name, three words and one sentence is a finished card.

    **There is no amount you are supposed to reach**, and nobody is comparing yours with anyone
    else's. Some people in this room started with more English than you. That has nothing to do with
    how good your card is.

    ### Choose things that are actually you

    Do not put what you think looks good. Put what is true.

    A card with one honest picture on it is worth more than a crowded card of things you do not care
    about, and when you speak about it, the true one will be much easier to talk about.

    ### Then practise saying it

    Making the card is only half of it. You will show it to people, so practise the words:

    **Hello. My name is ______. I am from ______. I like ______. Thank you.**

    Use your "my spoken introduction" page. Say it to a partner. Then say it again. Then say it at home.

    By the time you show it, the words should come out without you having to think.

    ### At the showcase

    You will show your card to the people we invited, including the person YOU invited.

    If showing it to the whole room is too much, you can show it to a small group, or to your partner,
    or only to the person you invited. **All of those count fully**, and nobody will ask why.
  words:
    - term: card
      meaning: the thing you make that shows who you are
    - term: introduce
      meaning: to tell someone who you are
