# Contextualised, fully offline adaptation of efi-mv-project-my-name-my-voice for Learning Bridge+
# (Cox's Bazar). The key shift from the source: the source is a written artifact plus a class showcase in
# one activity; here it is VISUAL-first, each learner designs and decorates a "My Name, My Voice" name
# card / identity poster and rehearses a short SPOKEN introduction of it. The making and rehearsal live
# here; the celebratory sharing is run as a connective block in the unit plan, so this material prepares
# learners for it rather than duplicating it. Strongly protective. Oral and visual first. Objective 3.
id: cb-mv-design-my-name-my-voice
slug: cb-mv-design-my-name-my-voice
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "Design my name card, My Name My Voice"
summary: >-
  The unit's authentic project, made visual first. Each learner designs and decorates a "My Name, My
  Voice" name card or identity poster, their name written and decorated, a few chosen picture-words, and
  maybe one simple sentence, then rehearses a short spoken introduction of it. Learners choose entirely
  what to include, so the card can be as personal or as light as they wish.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed, across several sessions. The group is both the workshop and the first warm audience:
    learners plan, design, and decorate their cards alongside each other, borrow ideas, and rehearse
    their spoken introduction in same-gender pairs. Making together makes the task feel ordinary and safe,
    and the pair rehearsal prepares everyone for the sharing block that follows in the unit plan.
- context: one-to-one-mentoring
  how: >-
    A supportive setting for a learner who is anxious about being seen, or who is behind on the writing.
    A mentor can help design the card at the learner's pace, take on the writing the learner cannot yet
    do while keeping the choices theirs, and rehearse the spoken introduction privately until it feels
    safe, so that, if the learner chooses, joining the group sharing later is a step they are ready for.
- context: independent
  how: >-
    A learner can design and decorate their card between sessions, drawing and writing at home, but the
    spoken introduction wants a listener and the sharing wants an audience. Arrange for them to rehearse
    with a mentor or a trusted person, and to bring the finished card to a group session so the sharing
    block has something real to celebrate.
duration: "3 hours facilitated across several sessions (planning, designing, rehearsing)"
grouping: "Individual card, planned and rehearsed in same-gender pairs and small groups; works with 10-35 learners"
whatLearnersDo:
- Plan a "My Name, My Voice" card or poster, which words, pictures, and colours represent them.
- Write and decorate their own name as the centre of the card.
- Add a few chosen picture-words and, if they wish, one simple sentence.
- Rehearse a short spoken introduction of their card with a same-gender partner, ready for the sharing.
materialsAndPreparation:
- Materials for making, paper or card, colours, pencils, and anything to decorate with; scraps and natural materials work where supplies are short.
- The learner's own words, name page, and picture-words from earlier in the unit, so the card is built from work they already own.
- Your own simple example card, made beforehand, to show what one can look like. Kept modest, so no one feels theirs must be elaborate.
- "Sensitivity: identity, home, family, and marriage can carry real pain here. Make it plain from the start that learners choose completely what to put on the card and what to say, a lighter, everyday focus (a colour, a food, a thing they like) is always welcome and always enough, and nothing personal is ever required or asked for."
visuals:
- kind: setup
  title: "Make, then rehearse in pairs"
  caption: >-
    Each learner plans and makes their own card while you circulate; at the end, same-gender pairs rehearse
    how they will introduce it.
  spec:
    type: groups
    facilitator: true
    clusters:
    - size: 1
      count: 6
      label: "each making their own card"
    - size: 2
      count: 3
      label: "rehearsal pairs"
- kind: example
  title: "A finished name card"
  caption: >-
    The capstone artefact: a decorated name, a few picture-words that are true for me, and one sentence I
    can say aloud.
  spec:
    type: zones
    cardStyle: drawing
    zones:
    - label: "My Name, My Voice"
      tone: positive
      cards:
      - "RASHIDA"
      - "rice · blue · goat"
      - "I like rice"
facilitationNotes: |
  This is where the whole unit comes together and where learners feel its point: they use their new
  English to show who they are, to real people. Made visual first, the card carries the meaning, a name
  written large and decorated, a few chosen picture-words, perhaps one simple sentence, so a learner who
  writes very little still makes something whole and proud. Keep ownership entirely with the learner: they
  choose what represents them and how much to reveal, and a card about a favourite colour and a food they
  love is a complete success, not a lesser one. Because identity here can touch displacement, loss,
  separation, and marriage, hold the protective frame openly and often, say aloud that nothing personal
  is required, that private things stay private, and that a lighter focus is always fine, and never let a
  learner feel that sharing more is worth more. Model with your own modest card so the task is concrete
  and the bar is low. The making and the spoken rehearsal live here; the celebratory sharing is run as its
  own connective block in the unit plan, so your job is to get each learner's card made and their short
  introduction rehearsed and safe, ready for that moment when it comes.
steps:
- title: "Plan your card, you choose what goes on it"
  duration: "40-50 min"
  guidance: |
    Show your own simple example card and explain the task: make something that shows who you are, with
    your name, a few pictures or words, and maybe one sentence. Before anything else, say clearly that
    they choose everything that goes on it, and that a light, everyday card, a colour, a food, a thing
    they like, is completely welcome. Learners plan on scrap paper or aloud with a partner, drawing on
    their name page and picture-words from earlier in the unit. Reassure them that whatever they keep
    private stays private.
  keyPrompts:
  - What are one or two things about you that you would be happy to show others?
  - Which of your words, pictures, and colours do you want on your card?
  - What do you want to keep just for yourself?
  watchOuts:
  - "A learner feeling they must put something painful, home, family, marriage, on the card; say openly that a simple, everyday focus is completely fine, and that a lighter card is worth just as much."
  - Comparing their plan to a neighbour's and feeling it must be grander; keep your own example modest and praise clear, honest choices over elaborate ones.
  adaptation: |
    With few materials, the card can be a single sheet with a decorated name and a couple of drawn,
    labelled words; the planning and the ownership are exactly the same.
- title: "Write and decorate your name"
  duration: "45-55 min"
  guidance: |
    The name is the heart of the card. Learners write their own name as large and bold as they like, or
    trace and go over it if writing is still new, and decorate it with colours, patterns, and their
    borders of choice. This is a visual, joyful step where even a learner with almost no writing makes
    something whole and theirs. Circulate and admire the decoration, not the neatness of the letters.
  keyPrompts:
  - Make your name the biggest, boldest thing on the card. How do you want to decorate it?
  - Which colours and patterns feel like you?
  watchOuts:
  - Anxiety about neat letters spoiling the joy; the win here is a name proudly decorated and owned, so praise the effort and the design, and let tracing count fully.
  - A learner with no confidence writing feeling stuck; let them trace over a prepared name or have a mentor lightly guide the hand, so the name is still visibly theirs to decorate.
  adaptation: |
    Where pencils and colours are scarce, a name traced boldly and outlined, or built from torn paper or
    natural scraps, decorates just as proudly; the muscle memory and the pride form the same.
- title: "Add your words, and one sentence if you wish"
  duration: "35-45 min"
  guidance: |
    Learners add a few of their chosen picture-words around the name, and, only if they are ready, one
    simple true sentence using a frame they know (I am from ___, I like ___). Keep the language at unit
    level: a decorated name and two or three meaningful words is a full card, and a single sentence is a
    stretch, never a requirement. Help with a word or a capital, but keep every choice the learner's own.
  keyPrompts:
  - Which two or three picture-words best show this part of you?
  - Would you like to add one sentence, "I like ___", or are your words enough?
  watchOuts:
  - Over-ambition in English that leaves a learner stuck and disheartened; steer them to what they can say and write well now, and celebrate it as complete.
  - A learner feeling a card with only words is not "enough"; make plain that a name and a few true words is a whole and worthy card, with no sentence needed.
  adaptation: |
    A learner who writes slowly labels their pictures with single words and plans to say the fuller
    sentences aloud in their introduction instead; the card and the spoken part share the load.
- title: "Rehearse how you will introduce it"
  duration: "30-40 min"
  guidance: |
    Prepare the short spoken introduction that will go with the card at the sharing. Each learner
    practises saying a few sentences, their name, one or two things they chose to show, in same-gender
    pairs, glancing at their card and speaking, not reading stiffly. Rehearsing now, privately with a
    partner, is what makes the later sharing feel safe rather than frightening. Remind them that being
    understood, not being perfect, is the whole goal, and that they say only what they chose to put on
    the card.
  keyPrompts:
  - What two or three sentences will you say about your card?
  - Practise with your partner, did they understand you? What felt easier the second time?
  watchOuts:
  - Pressure building about the sharing to come; frame the rehearsal as friendly practice with one partner, and remind learners the sharing itself will be warm, applause-only, and never a test.
  - A learner rehearsing more than they are comfortable saying aloud; check the introduction matches what they actually chose to show, and let them keep it as short as they wish.
  adaptation: |
    A very nervous learner rehearses with just the facilitator or one trusted partner, and can plan to
    introduce their card to a small group rather than the whole class when the sharing comes; the audience
    is still real, and the choice stays theirs.
closing: |
  Bring the making to a close by having a few willing learners hold up their card and say one thing they
  chose to put on it. Do not run the full sharing here, that celebratory "My Name, My Voice" showcase is
  its own connective block in the unit plan, but name what is ready: each learner now has a card that is
  truly theirs and a short introduction rehearsed and safe. Remind them, warmly, that at the sharing they
  choose what to say and how much, and that a lighter card is always welcome. Independent task: keep your
  card safe, and practise saying your introduction once to a trusted person at home before the sharing, or
  simply hold in mind the one thing you most want people to know about you.
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  - control-of-future-pathways
  - contribution-to-community
  how: >-
    Choosing what represents you and shaping it into a card, in your own words and images, is a real act
    of self-representation and voice: the learner decides how they are seen. Rehearsing the introduction
    gives them the means to be heard by others on their own terms, and preparing to share their card with
    the group is a way of contributing their story to the community they are part of, while keeping full
    control over what stays private.
principlesForegrounded:
- builds-on-identities
- authentic-challenges
- safe-spaces
- recognise-communicate-growth
principleAlignment:
- principle: builds-on-identities
  how: >-
    The entire card is the learner's own identity, in the name, words, pictures, and colours they choose;
    built from their own name page and picture-words, it is the clearest expression of building outward
    from who the learner is.
- principle: authentic-challenges
  how: >-
    The card is made for a real audience and a real purpose, to introduce oneself and be known at the
    sharing, not as an exercise for the facilitator alone, which is what gives the making and the
    rehearsal their meaning.
- principle: safe-spaces
  how: >-
    Learners choose completely what to include and say, difficult history is never required and a lighter
    everyday focus is always welcome, the introduction is rehearsed privately in same-gender pairs before
    any sharing, and a nervous learner can present to a small group, so representing oneself feels safe.
- principle: recognise-communicate-growth
  how: >-
    The card gathers the whole unit's learning into one visible, kept piece, the name they can now write,
    the words they now have, the sentences they can now say, letting learners see and name how far they
    have come as they prepare to show it.
competencyCodes:
- FUS1
- FLC3
competencyDevelopment:
- code: FUS1
  how: >-
    Deciding what represents them and shaping it into a card is sustained work of self-awareness, the
    project is the unit's main evidence of learners developing and choosing how to express their identity.
- code: FLC3
  how: >-
    Rehearsing a short, clear spoken introduction of the card, ready for a real audience, is direct
    practice in communicating who they are to others in English.
