provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs and low-bandwidth
  adaptations, delivery-mode notes, and agency/principle/competency explanations) from the source
  activity guide, which used the Lumiere Foundation as its worked example. Generalised so the specific
  programme is treated as one example only, with a "[to verify]" localisation note asking partners to
  substitute a real opportunity that is relevant and open to their own learners. Linked to Pathways
  objective 1.
