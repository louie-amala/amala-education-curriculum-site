learnerContent: |
  ## Our community map

  This is your own small map of what is connected to our hills and trees.

  In the middle, draw our hills. Around them, draw the people, groups, places, and things joined to them:
  who remembers the forest, who lives on the slopes, what strips the hills, what helps them recover, where
  it floods or slides. Draw lines to show what is joined to what.

  Mark the people you could safely and kindly learn from later. Remember: always ask permission first, and
  never use anyone's name.

  You can add to this page as you notice more on your way through the camp. Keep it in your research book -
  it helps you plan who to talk to when we gather evidence.
