agencyContribution:
  indicators:
  - contribution-to-community
  - power-over-wellbeing-and-self-direction
  how: >-
    Learners learn to gather knowledge from their own community with care and consent — treating
    neighbours as people with a right to say no, and holding their own safety too. This is the ethical
    ground of acting on a shared challenge without doing harm.
principlesForegrounded: [responsible-action, safe-spaces, collaboration]
principleAlignment:
- principle: responsible-action
  how: Consent, no names, and no one put at risk make research an action guided by care for others, not just a way to get an answer.
- principle: safe-spaces
  how: Same-gender pairs, the right to say no or stop, and a referral routine keep both learners and the people they ask safe.
- principle: collaboration
  how: Learners rehearse the consent request in pairs, giving and taking the role of asker and asked, before they meet the community.
competencyCodes: [FSI1, FLC1]
competencyDevelopment:
- code: FSI1
  how: Knowing the two ways a researcher finds things out — primary and secondary — is the plan behind conducting the investigation.
- code: FLC1
  how: Asking consent, protecting names, and risking no one is ethical action put into practice at the heart of the research.
