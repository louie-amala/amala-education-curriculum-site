# Contextualised, fully offline ACTIVITY for the Research Project component of Learning Bridge+ (Cox's
# Bazar). Learners meet the two ways a researcher finds things out — asking people and looking here
# (primary), and the supplied source pack (secondary) — and then learn research ethics as the heart of
# the work, practising the consent request aloud until it is natural. Plan and conduct research phase
# (objective 2). Oral and visual first; safeguarding is central because learners will soon speak to
# real community members.
id: cb-rp-two-ways-and-ethics
slug: cb-rp-two-ways-and-ethics
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "Two ways to find out, and being a fair and safe researcher"
summary: >-
  Learners meet the two ways a researcher finds things out — asking people and looking around us here,
  and studying what others have already found out in our source pack — and then learn how to do it
  fairly and safely: ask before you ask, explain why, let people say no or stop, use no names, and put
  no one at risk. They practise the consent request aloud until it feels natural.
facilitationContext:
- group
primaryContext: group
duration: "2 hours facilitated + 0.5 hour independent"
grouping: "Whole group to introduce, then pairs to practise the consent request"
whatLearnersDo:
- Meet, with pictures, the two ways a researcher finds things out — asking and looking here (primary), and the supplied source pack (secondary).
- "Learn the rules that keep everyone safe and treated fairly: ask first, explain why, let people stop, use no names, risk no one."
- Practise saying the consent request aloud in pairs, in our own language, until it comes easily.
- Talk through what to do if someone is upset, and who to tell — the referral routine.
materialsAndPreparation:
- "Two simple pictures or symbols: one for asking-and-looking-here, one for the source pack, to show the two ways side by side."
- The community map made earlier in the course, to point to the real people and places learners might ask.
- The "asking permission" reminder page from the research book (one per learner), and referral guidance to hand.
- Step-back and referral guidance ready, in case practice touches something personal.
