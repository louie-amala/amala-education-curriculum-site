id: pb-jah-and-kay
slug: pb-jah-and-kay
access: public
type: activity
title: "Jah and Kay: the helping simulation"
summary: >-
  A wealthy delegation arrives early to help a poor country build its monument, bringing better
  materials, a plan, and no questions.
facilitationContext: [group]
primaryContext: group
deliveryAdaptations:
  - context: group
    how: >-
      Group-only, and it needs two separate spaces and ideally two facilitators. The frustration on
      both sides is the material, and it cannot be produced any other way.
duration: 90-120 minutes, including a long debrief.
grouping: Two groups plus two observers, briefed separately.
materialsAndPreparation:
  - Two boxes or bags of materials, prepared in advance and not visible to the other group. Jah gets newspaper and a piece of string. Kay gets toilet roll, rubber bands, markers, ribbon, coloured paper, tape, stickers, scissors and glue.
  - The contents can change; what matters is that Kay's are clearly better while Jah's are enough to attempt a monument.
  - Two fact sheets, one per country, printed. They are summarised in the educator content.
  - Two different coloured armbands or markers, one colour per country. These are removed at the end as a de-roling gesture.
  - Two rooms or well-separated spaces. Jah should have the larger one, since Kay will come to them.
  - Two observers, ideally staff rather than learners so everyone can take part.
whatLearnersDo:
  - Take a role as a citizen of Jah or of Kay, and prepare from a briefing sheet.
  - Jah begins building a monument to their independence from their own materials.
  - Kay arrives early, with better materials and a plan to help.
  - Interact for as long as it lasts, then de-role.
  - "Debrief in four passes: facts, feelings, evaluation, and what it means for analysing before acting."
facilitationNotes: >-
  Do not interfere once it starts, and this will be hard. Facilitators and observers both feel the
  pull to smooth it over, and smoothing it over destroys the activity. The one thing to get right
  beyond that is timing: Kay must enter earlier than Jah is expecting. Jah are told they have 25
  minutes to build; Kay arrive after 15. That interruption, before the hosts are ready, is what
  makes the helping feel like an intrusion rather than an offer, and it is engineered by you.
steps:
  - title: "Prepare the boxes and brief separately"
    duration: 15 minutes
    guidance: >-
      Split the group, take them to separate spaces, and hand each their fact sheet. Jah are told
      they must make a monument using only the materials given to them. Kay are told to make a plan
      and be ready to share their ideas. Observers are told to note significant exchanges for the
      debrief. Give out the armbands here; they will come off at the end.
    keyPrompts:
      - "Read your sheet. This is who you are."
    watchOuts:
      - "The two groups overhear each other, and the surprise is lost. Use genuinely separate spaces
        if you possibly can."
      - "Kay see Jah's materials in advance and soften their plan. Keep the boxes closed until each
        group is alone."
  - title: "Let Jah build, and send Kay in early"
    duration: 20 minutes
    guidance: >-
      Kay get 15 minutes to plan. Jah are told they have 25 minutes to build. After 15, walk Kay into
      Jah's space and tell them to begin. Be strict about this timing: the interruption before the
      hosts are ready is the engineered part of the simulation and it is what makes helping feel like
      intrusion.
    keyPrompts:
      - "Kay, you may begin your interaction with the Jahns."
    watchOuts:
      - "You soften the entry because it feels rude. Do not. The rudeness is the content."
  - title: "Let the interaction run"
    duration: 10-30 minutes
    guidance: >-
      Do not interfere, and this will be hard for you and for the observers. Watch for leaders
      emerging, side conversations, and refusals. Stop when it has run its course: agreement reached,
      arguments circling, or heat rising. Take notes; you will use them.
    keyPrompts:
      - "Stop there, please."
    watchOuts:
      - "A facilitator or observer steps in to smooth it over. Brief them beforehand that they must
        not."
      - "It becomes genuinely heated. Call time early; nothing after that point adds anything."
  - title: "End the roles"
    duration: 5 minutes
    guidance: >-
      Say clearly that the simulation is over and that any ill feeling stays inside it. Take the
      armbands off as a physical marker. Then reform the room into small groups containing both Jahns
      and Kayns, so the debrief happens across the divide rather than within each side.
    keyPrompts:
      - "That is the end. Armbands off."
    watchOuts:
      - "Skipping the de-roling because the group is talking well. Do it anyway."
  - title: "Debrief in four passes"
    duration: 45 minutes
    guidance: >-
      Facts, then feelings, then evaluation, then the analysis question. The full question set is in
      the educator notes. Do not compress this: it is longer than the simulation on purpose, and the
      pass most often cut, the factual one, is the pass that makes the others possible.
    keyPrompts:
      - "Read your briefing sheets aloud. What was the other side told about you?"
      - "How will you change your behaviour in a helping situation with people different from you?"
    watchOuts:
      - "The group leaps from facts to conclusions. Guide them back; a shared account of what happened
        has to exist first."
      - "Kayns become defensive. Keep it about the brief they were given and what it made reasonable."
    adaptation: >-
      Short on time: shorten the interaction rather than the debrief. Ten minutes of interaction with
      a full debrief teaches far more than thirty minutes of interaction and a rushed one.
closing: >-
  Ask the analysis question last and let it stand: to what extent is it important to analyse
  problems, conflicts and violence before designing interventions? The group has just answered it
  from the inside, from both sides. Note the answers, because this is the argument for everything in
  the analysis week that follows.
educatorContent: |
  ## The two briefs, in summary

  **Jah.** An old country with rich culture and history, ruled by others for so long that it is only
  now regaining independence and pride. Few natural resources, little technology to develop what it
  has, poverty accepted as a normal way of life. This is the anniversary of independence, and they
  are choosing and building a monument to that pride, using their own native materials as far as
  possible, partly out of pride and partly to avoid becoming indebted to outsiders. They are
  especially wary of gifts with political strings. They have heard a team from Kay is arriving within
  25 minutes. They are open to suggestions and appreciative of help, but resist any kind of
  patronising: other nations have dominated them for centuries and they have learned to be suspicious.

  **Kay.** Fortunate citizens of a country without peers in technology, natural resources and wealth,
  which has solved epidemics, hunger, limited production and illiteracy. Many Kayns are concerned
  about less fortunate countries, some feel guilty, and others believe the world will not stay safe
  while the imbalance continues. They have volunteered to go to Jah, described to them as poor and
  underdeveloped, with inexperienced leaders who frequently act on a whim rather than on the
  country's basic needs. Jah, they are told, needs help setting priorities, needs resources to
  supplement its own, and needs technical help so that what it builds endures. They have 15 minutes
  to plan, and they will be evaluated on helping Jah reset priorities to match its needs, use the
  materials wisely, and receive useful construction and technical advice.

  **Observers.** Note significant exchanges and developments for the debrief. Do not interact.

  ## What tends to happen

  Kay arrive with a presentation and a plan for a monument they have designed. Jah are mid-build,
  proud of what they have, and did not expect anyone yet. Sometimes a leader emerges on each side and
  a diplomatic conversation begins while others squabble at the edges. Sometimes Jah simply refuse
  the materials. Occasionally Kay ask what Jah are making before they say anything else, and the
  whole thing resolves in five minutes, which is worth debriefing carefully because it is the answer.

  ## Ending it

  Stop when it has clearly run its course: agreement reached, arguments circling, or heat rising. Say
  the simulation is over, remind everyone that ill feeling stays inside it, and use a gesture to mark
  it. Removing the armbands is a good one.

  ## The four-pass debrief

  Longer than the simulation. Do not compress it.

  **Facts.** Both sides read their briefing sheets aloud, which is usually the moment Jah discover
  how Kay were told to see them. What materials did you have? What was your plan? Jahns, tell us
  about the monument, what does it represent, how did you decide? Observers, what did you see,
  factually? Guide people back if they leap to feelings; recalling what happened has to come first.
  Mixed small groups work better than a whole-group discussion.

  **Feelings.** What was the first thing you noticed about the other group, their body language, how
  they reacted to you? Kayns, what was your motivation? Jahns, how did you feel when Kay arrived, and
  why? Kayns, what were you expecting, and how did the reaction compare? What was surprising, what
  was frustrating? Which behaviours created a positive feeling, and which fostered resentment?

  **Evaluation.** What do Jah and Kay symbolise, and how many parallels can the group find? Have you
  ever felt like a Kayn? Like a Jahn? What would you do differently? And the question that transfers:
  based on today, how will you change your behaviour when you go into a helping situation with people
  who are different from you?

  **Analysis.** To what extent is it important to analyse problems, conflicts and violence before
  designing interventions? This is the reason the simulation sits at the start of the analysis week
  rather than in the transformation week.

  ## Optional extension

  Ernesto Sirolli's TED talk on aid and listening covers very similar ground and works well
  afterwards. Ask how the situation he describes resembles what happened in the room, and what
  learners will be mindful of when they are the ones trying to help.
learnerContent: |
  You are a citizen of **Jah** or of **Kay**, or an observer. Read your brief and prepare with your
  group. Do not show it to anyone from the other country.

  **Observers:** note down significant exchanges and developments. Do not join in.

  Afterwards, the simulation is over and nothing from inside it is held against anyone.

  **What happened:**

  - Both sides read your briefing sheets aloud. What was the other side told about you?
  - What materials did you have? What was your plan?
  - Jah: tell us about your monument. What does it represent? How did you decide?
  - Observers: what did you see? Facts only.

  **How it felt:**

  - What was the first thing you noticed about the other group?
  - Jah: how did you feel when Kay arrived? Why?
  - Kay: what were you expecting? How did their reaction compare?
  - What behaviours helped? What caused resentment?

  **What it means:**

  - What do Jah and Kay stand for? How many parallels can you find?
  - Have you ever felt like a Kayn? Like a Jahn?
  - **How will you change your behaviour when you go into a situation where you are trying to help
    people who are different from you?**
  - How important is it to analyse a problem before you design something to fix it?
agencyContribution:
  indicators: [contribution-to-community]
  how: >-
    Amala learners are often on the receiving end of help, and this simulation lets them occupy both
    positions. Having been Kay, they will design their own projects differently; having been Jah, they
    have language for something they have experienced and could not previously name.
principlesForegrounded: [responsible-action, safe-spaces, authentic-challenges]
principleAlignment:
  - principle: responsible-action
    how: >-
      The whole simulation is a demonstration of good intentions producing bad outcomes, which is the
      argument for do-no-harm made from the inside rather than as a rule.
  - principle: safe-spaces
    how: >-
      Explicit de-roling, the removal of armbands, and a debrief that starts with facts rather than
      accusations are what let a group run a genuinely uncomfortable simulation and come back together.
  - principle: authentic-challenges
    how: >-
      The dynamic is the one most learners will meet in their own project work, and several will
      recognise it from their own lives immediately.
competencyCodes: [FUS2, FLC1, APS1, FSI1]
competencyDevelopment:
  - code: FUS2
    how: >-
      Reading the other side's brief afterwards is a direct demonstration of how a party's behaviour
      followed from a description of you that you never saw.
  - code: FLC1
    how: >-
      Kayns are asked whether what they did was right, while they still remember believing it was
      generous, which is ethical reflection with something at stake.
  - code: APS1
    how: >-
      The simulation is entirely made of unintended consequences arising from an intervention designed
      without consultation.
  - code: FSI1
    how: >-
      The closing question establishes why analysis precedes design, which is the premise of the
      entire analysis week that follows.
objectiveIds: [peacebuilding--o2, peacebuilding--o3]
