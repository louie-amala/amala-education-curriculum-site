    Intercultural Sourcebook (Hoopes and Ventura, eds.) and in Kohls and Knight, "Developing
    Intercultural Awareness" (Intercultural Press). The country briefs are summarised here in Amala's
    words, never reproduced.
  note: >-
    Amala's full role briefs descend from a commercially published simulation. Do not publish them,
    here or elsewhere, without checking with Intercultural Press (now Nicholas Brealey, Hachette).
