- Read this before planning the unit and keep it to hand while teaching; it is the how-to behind every My Voice activity.
- A small set of picture cards for the daily retrieval warm-up (the sounds and words already met), cycled over the weeks.
- "Sensitivity: many learners carry interrupted education and displacement; keep the room safe, predictable, and low-pressure, and never require anyone to speak or share."
facilitationNotes: |
  This playbook is the how-to behind every My Voice activity: read it before you start and keep it to
  hand. The one rule under all of it is oral before print - learners hear, understand, and say a word
  well before they ever see it written. Two habits carry the rest: open every session by having learners
  recall prior words from a picture (retrieval, not review), and use English a little every day,
  everywhere, including in the other parts of the programme. Everything else - TPR, chunks and frames,
  sounds from real words, gentle recast correction, translanguaging - serves those. Keep it warm,
  predictable, and unhurried.
educatorContent: |
  ## The one thing to know

  Most learners here are emergent-literacy learners: Rohingya is an oral language with no everyday
  written script, so many have never read or written in any language. This is not a failing - it means
  print has to be built on top of spoken English the learner already controls, never assumed. So the
  golden rule is oral before print, on every single item: the learner hears a word, understands it, and
  says it well before they ever see it written. Print is the last step of a cycle, never the first. This
  is the core of LESLLA, the research field for adults learning to read and a new language at the same
  time. The English for Impact course assumes strong home-language literacy; here we do not, so we lead
  with the ear and the voice.

  ## The lesson routine to repeat every time

  A predictable shape lets a lightly-trained facilitator run a strong lesson, and lets learners relax
  because they know what is coming. Keep roughly this shape every session:

  - Warm greeting - the same English hello every time (a safe, familiar opener).
  - Retrieval, not review - before teaching anything new, have learners say last time's sounds and words from a picture prompt. This is the single highest-value move; see below.
  - A TPR warm-up - listen and do, to wake up the ear and the body.
  - One new oral chunk or sound - modelled, then said together, then in pairs, always with a picture or action.
  - Picture and speaking practice - use the new language for something real (a mini role-play, a survey).
  - One small print step - only now, and only on words already said well (recognise, match, trace).
  - A beyond-class mission - a spoken task to do before next time (see the Practice everywhere resource).

  ## Retrieval and spacing - the biggest lever

  The strongest finding in learning science is that recalling something from memory, and spacing those
  recalls across days, beats re-reading or one long session (Dunlosky and colleagues reviewed 242
  studies; Ebbinghaus first showed the spacing effect). For this cohort that means two things. First,
  open every session by having learners produce prior words from a picture - name the picture, do the
  action - before you re-teach. Retrieval, not review. Second, revisit each new word today, in two days,
  and next week, by cycling a small set of picture cards. Little and often, the same words coming back
  again and again in different games, is how they stick. Under-teach and over-recycle: a few words truly
  owned beat many words half-met.

  ## Total Physical Response (TPR)

  Give a command and show it with your body; learners respond by doing, so meaning is shown, not
  translated (Asher). Honour a silent period: comprehension comes before speaking, and no one is forced
  to speak early, which keeps anxiety low. "Stand up. Point to the door. Give me the pen. Touch your
  head." Add real objects (open and close the book, take and give the cup). Movement plus language makes
  durable memory.

  ## Teach chunks and frames, not just single words

  Whole useful phrases - "My name is ___", "How are you?", "I don't know", "Thank you" - give beginners
  real, usable language before they can build sentences grammatically. And a sentence frame with one
  changing slot ("I am ___", "I am from ___", "I like ___") lets a zero-level learner produce many
  correct sentences. Frames and chunks are the backbone of speaking at this level (Nation's
  high-frequency, lexical approach).

  ## Sounds through meaningful words

  Never teach the alphabet as an abstract A-B-C chart. Anchor each sound in a word the learner already
  owns - their own name first, then family and camp words. "Your name starts with /m/: Mohammed, mother,
  market." Then sort other known picture-words by their first sound. Reading your own name is often the
  single most motivating first literacy win.

  ## Language Experience Approach, and real-world print

  A powerful bridge from speaking to reading: the learner tells you something (in any language); you
  write it down in their exact words; that sentence - already understood and personally theirs - becomes
  their first reading text. Use real print from the camp too - a name, a sign, a label - as the first
  thing they "read". Meaningful, owned text is far easier than a stranger's words.

  ## Translanguaging - the home language is a strength

  Purposeful use of Rohingya (by a bilingual peer, a co-facilitator, or you) to set up meaning, check
  understanding, and lower anxiety speeds English up, it does not slow it down (García; Cummins). Use the
  home language to make meaning clear, then stay in English to practise the target chunk. Do not ban the
  first language - that throws away the strongest scaffold you have and tells learners their identity is a
  problem.

  ## Correcting gently

  At this level the goal is communication and confidence, not perfect grammar. Keep anxiety low: a
  frightened or shamed beginner stops learning (Krashen's affective filter). Correct mostly by recast -
  simply model the right form back inside your reply ("I go market" becomes "You go to the market? Good.") -
  and only on the one or two things the lesson is teaching. Praise that the message got through first.
  Make mistakes normal and expected; never single anyone out.

  ## Practice everywhere

  Class is a small part of the week, and English grows with how much it is used. Learners cannot take
  home a worksheet they cannot read, so beyond-class practice is spoken, social, and tied to routine: a
  "greet three people in English" mission, an English buddy to practise a chunk with, a word taught to
  family so the family becomes the practice partner. Crucially, use the rest of the programme - Agency in
  Learning, mentoring, and later the Research Project - as English practice too. See the Practice
  everywhere resource for how, and the Practice everywhere page in the student workbook.

  ## Safe, predictable, and by choice

  Withdrawal or silence is often a trauma response, not defiance. Keep the room predictable and calm,
  signal changes, and offer real choices within the lesson (point or speak, together before alone, which
  task first). Let a learner step back without penalty. Use gentle, safe pictures; do not probe home or
  journey experiences unless the learner raises them. Use same-gender grouping where girls' participation
  depends on it, and confirm norms with the community rather than assuming them.

  ## Common mistakes to avoid

  - Treating these learners like literate migrants - assuming print concepts, or that "read this at home" works.
  - Print-first or worksheet-dependent lessons - they exclude the majority.
  - Teaching the alphabet in abstract order instead of building sounds from meaningful known words.
  - One-and-done teaching - lots of words once, with no scheduled recycling; it evaporates.
  - Massing practice in one long weekly block instead of short touches across days.
  - Over-correcting, or flagging errors in public - it raises anxiety and shuts learning down.
  - Racing the pace - under-load and consolidate; a crowded syllabus means shallow, un-retained learning.
  - Banning the home language, or drilling with no picture, action, or purpose attached.
agencyContribution:
  indicators:
  - control-of-future-pathways
  how: >-
    A facilitator who teaches well at this level is what turns 50 hours into real reading, writing, and
    speaking - the foundational literacy that opens further study, work, and dealing with the written
    world. The playbook puts research-backed method in the hands of a lightly-trained facilitator so
    learners actually progress, rather than sit through activities that do not stick.
principlesForegrounded:
- lifeworthy-competencies
- safe-spaces
- feedback-and-data
- builds-on-identities
principleAlignment:
- principle: lifeworthy-competencies
  how: >-
    The methods here - oral-first literacy, retrieval and spacing, chunks and frames - are how
    foundational English is actually built to last, so learners carry it into every later unit and beyond.
- principle: safe-spaces
  how: >-
    The playbook makes low affect and predictability method, not just kindness: a silent period, gentle
    recast correction, real choice, and same-gender grouping are what let trauma-affected beginners risk speaking.
- principle: feedback-and-data
  how: >-
    Retrieval warm-ups and light, targeted correction give the facilitator constant, low-stakes
    information about which sounds and words are secure and which need another spaced pass.
- principle: builds-on-identities
  how: >-
    Sounds are anchored in the learner's own name and words, and the home language is treated as a
    resource through translanguaging, so English is built outward from who the learner already is.
competencyCodes:
- FLC3
competencyDevelopment:
- code: FLC3
  how: >-
    Everything in the playbook serves communication in English - decoding and pronunciation built
    oral-first, high-frequency chunks and frames for speaking, and gentle feedback that keeps learners
    talking - which is the whole of influential communication at this level.
