# Facilitator playbook for the Cox's Bazar edition of My Voice - the how-to behind every activity.
# Grounds the unit in the English for Impact Course Guide's pedagogy (Part 1) AND research on teaching
# beginner English to pre-literate adults (LESLLA) and second-language acquisition. Fully offline,
# oral and visual first. Type resource: no steps/timing; the method lives in educatorContent.
