learnerContent: |
  ## What we know / what we want to find out

  This page has two sides, like our wall.

  On one side - "what I already know" - put the things you know about our hills and trees: how they looked
  before, the clearing, the mud when it rains, the heat. Use marks, drawings, or a few words.

  On the other side - "what I still want to find out" - put the questions you have, and the things we only
  think but do not yet truly know.

  You can add to this page any time. When you find something out, move it across to "what I know". Keep this
  page in your research book - it shows how your thinking grows across the whole course.
