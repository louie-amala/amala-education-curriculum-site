summary: >-
  The educator's guide to judging each learner's proficiency in Investigate real-world issues (FSI1), 
  the anchor competency and one of the two certificated Learning Bridge+ competencies: the proficiency
  scale, the two assessment points, the evidence to gather across the research book, and how to judge.
