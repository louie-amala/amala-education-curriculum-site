# Facilitator assessment resource for the Research Project component of Learning Bridge+ (Cox's Bazar).
# FSI1 (Investigate real-world issues) is the anchor and one of the two certificated LB+ competencies.
# Gives the educator the proficiency scale, the two assessment points, the evidence to gather across the
# research book, and how to make the judgement. A printable rubric compiles into the offline pack.
