educatorContent: |
  ## What is assessed, and how

  This component develops and demonstrates one anchor competency: FSI1, Investigate real-world issues. 
  "the learner can conduct primary and secondary research into challenges affecting people and the
  planet to develop actionable insights." On Learning Bridge+ this is one of the two certificated
  competencies, so the judgement matters.

  You judge each learner's proficiency by your own professional judgement against Amala's proficiency
  scale, built up from evidence gathered across the whole investigation. You do NOT mark it from the
  final output alone: a learner who made a beautiful poster but could not turn evidence into an insight,
  and one who reached a defensible insight from messy evidence, are showing different proficiency, even
  with similar-looking posters.

  Assess at two points:

  - Midway (formative), around the end of the "Plan and conduct research" phase. To see where each
    learner is and adjust your support.
  - At the end (summative), during the showcase. The judgement that informs the readiness decision.

  Do not over-assess. Two considered judgements, built from evidence gathered over time, are worth far
  more than repeated testing, which this cohort does not need and should not carry.

  ## What FSI1 looks like across the research cycle

  Look for the whole cycle, not one moment. A learner achieving the goal, at this level:

  - Frames a researchable focus, makes the given question their own and turns it into things they can
    actually find out.
  - Gathers evidence ethically, asks and looks (primary) and reads the source pack (secondary), with
    consent and no names.
  - Weighs the evidence, checks a source against others and against what they found, rather than
    believing whatever sounded good.
  - Develops actionable insight, moves from "what the evidence says" to "what it means, and why it
    matters," backed by evidence.
  - Communicates it, shares findings honestly, including their limits, and answers questions about them.

  ## The proficiency scale

  Use Amala's official proficiency scale (the Competency Framework and Proficiency Scale for the cohort
  year). It is one generic five-level ladder, applied to any competency by reading each level against
  the goal that competency names. Here, conducting primary and secondary research into challenges
  affecting people and the planet to develop actionable insights. Credit begins at Practitioner.

  - No Level Awarded (GPA 0.0, no credit). Does not have a rationale for what they would do to achieve
    the goal in at least one scenario. Here: cannot say what they would try to find out about the issue,
    or how they would find it out, and why.
  - Theorist (GPA 2.0, no credit). Has a rationale for what they would do to achieve the goal in at
    least one scenario. Here: can say what they want to find out, who they would ask and what they would
    read to find it out, and why that would tell them something, but has not acted on it.
  - Practitioner (GPA 3.0, credit awarded). Has attempted to achieve the goal in at least one scenario
    and has a clear rationale for their actions. Here: actually investigated, asked and looked
    (primary) and used the source pack (secondary), with reasons for how they went about it, even if
    the research has not yet developed into an actionable insight.
  - Reflective Practitioner (GPA 3.5). Has achieved the goal in at least one scenario with a clear
    rationale, and has identified strengths, weaknesses and improvements they would make in their
    approach in that scenario, supporting their claims with evidence. Here: the research reached an
    insight they can point to the evidence for and communicate, and they can say what worked in how they
    investigated, what did not, and what they would do differently, with evidence for those claims.
  - Expert Practitioner (GPA 4.0). Has achieved the goal in two or more scenarios with a clear
    rationale, has identified strengths, weaknesses and improvements across those scenarios with
    evidence, and has implemented improvements, demonstrating growth over time. Here: a second, distinct
    investigation in which they carried through an improvement identified in the first.

  Two things to hold on to. Credit turns on an attempt, not on a polished plan: a learner who talks
  fluently about how they would research but never gathers anything is a Theorist, however good the
  plan. And Expert requires two or more genuinely different scenarios, this component runs one shared
  challenge, so a second scenario normally comes from elsewhere in the learner's work, not from
  repeating the same investigation. Expect most learners to sit at Practitioner or Reflective
  Practitioner at the end of this component.

  ## Where to find the evidence (in the research book)

  All of it lives in the learner's research book and in how they talk about their work:

  - The question and plan they framed, and their sub-questions.
  - The interview and survey questions they designed.
  - The evidence log, and how they marked how far to trust each piece.
  - The move from findings to insight, their insight statements and the evidence behind them.
  - The final research output, and how they answer questions about it.

  ## Making the judgement

  Read across all of that and place the learner on the scale as a whole, do not average a checklist.
  Weight the analytical heart most: gathering evidence is necessary, but turning it into a defensible,
  evidence-backed insight is what FSI1 is really about. Where a learner is disrupted (a missed week, a
  fire), judge the proficiency they show when they are there, not their attendance.

  Use the printable assessment record (a copy per learner) to record, at each point, the level the
  learner sits at and one or two lines of evidence for why. At the midway point this is developmental, 
  a provisional judgement, made with Amala's support and calibration, that tells you where to put your
  support next. The end judgement is the one that counts towards the certificated competency, and
  readiness for the accredited secondary pathway is set at Practitioner (Amala's pass, where credit
  begins). Aim to get as many learners as possible beyond that, to Reflective Practitioner or higher.
