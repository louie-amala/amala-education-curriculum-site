# Student worksheet for cb-mv-design-my-name-my-voice. A thin, visual-first resource. The "My Name, My
# Voice" card template from the downloadable Student My Voice book (workbook). A bordered card area to put
# your name big and draw/write what shows who you are. Identity/home/family can surface pain, so it
# carries a Sensitivity item. Objective 3.
