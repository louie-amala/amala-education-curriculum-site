id: pathways-prioritising-pathway-opportunities
slug: pathways-prioritising-pathway-opportunities
access: public
type: activity
title: "Prioritising pathway opportunities: realistic, ambitious and wildcard"
summary: Learners sort the opportunities they have found into realistic, ambitious and wildcard, then
  prioritise a balanced few to pursue on purpose rather than scattering their effort.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners sort and prioritise their own opportunities alone first, then compare in
    small breakout groups. The comparison is where the value sits, since peers challenge a learner's
    sense of what is realistic or ambitious and often spot a wildcard the learner had dismissed, so
    keep the sharing step even if you shorten the sorting.
- context: one-to-one-mentoring
  how: >-
    A strong fit. The learner sorts their opportunities and a mentor plays the role the peer group
    would, pressure-testing where the line between realistic and ambitious sits and asking why a
    wildcard was ruled in or out. The mentor should challenge the sorting without imposing their own
    ranking of which opportunities matter.
- context: independent
  how: >-
    Workable but weaker, because the learner loses the challenge that stops them mislabelling a stretch
    as realistic or discarding a wildcard too fast. If a learner works alone, ask them to explain their
    three categories to at least one other person, even asynchronously, and to note any opportunity that
    person would move to a different category.
duration: 40-50 min facilitated, plus the journal task
grouping: Individual sorting, then breakout groups of 3-5; works with 10-35 learners
whatLearnersDo:
- Complete the "prioritising your opportunities" task in your Pathways Journal, sorting the opportunities you have identified.
- Label each opportunity realistic, ambitious (a stretch) or wildcard, and pick a balanced few to pursue.
- Share your categorised opportunities in a small group with a nominated scribe.
- Discuss how your opportunities align with your ambitions and what the sorting taught you.
- Record your prioritised shortlist and your next steps after this activity.
materialsAndPreparation:
- The Pathways Journal, one per learner, open at the "prioritising your opportunities" task (printed or digital).
- The list of opportunities each learner generated in the earlier identifying-opportunities activity, to hand.
- A way for each breakout group to keep notes, and a nominated scribe per group.
- Your own three worked examples, one realistic, one ambitious and one wildcard, to model the categories before learners start.
facilitationNotes: |
  This activity turns a long, unmanageable list of opportunities into a deliberate, balanced shortlist.
  The one thing to get right is the balance: learners tend to keep only the safe, realistic options and
  quietly drop the ambitious and wildcard ones, which trains effort towards the least growth. Your job
  is to protect a place for stretch and for the low-odds, high-payoff wildcard, while keeping the
  shortlist small enough to actually pursue. The categories are the learner's own judgement to make,
  not yours to hand down.
steps:
- title: Model realistic, ambitious and wildcard with three worked examples
  duration: 5-10 min
  guidance: |
    Open by defining the three categories concretely: realistic is well within reach now, ambitious is
    a genuine stretch that would need real effort or luck, and wildcard is low-odds but could change the
    learner's path entirely. Use one worked example of your own for each so the lines are concrete. Keep
    it brief; the point is to give learners a frame before they sort, not to sort for them.
  keyPrompts:
  - What makes an opportunity realistic for you right now rather than a stretch?
  - What would a wildcard opportunity change about your path if it actually came off?
  - Where is the line between ambitious and simply unrealistic for you?
  watchOuts:
  - Learners collapse ambitious and wildcard into one "unlikely" pile; hold the two apart by stressing that a wildcard is not just harder but would change the whole direction, and give a clear example of each.
  adaptation: |
    With no slides or connectivity, this needs nothing but you speaking three honest examples aloud and
    writing the three category names on a board or a sheet of paper.
- title: Sort and prioritise your opportunities in the Pathways Journal
  duration: 15-20 min
  guidance: |
    Give learners quiet, individual time to complete the "prioritising your opportunities" task, labelling
    each opportunity realistic, ambitious or wildcard and then choosing a balanced few to pursue.
    Circulate quietly. Where a learner has kept only realistic options, ask what a stretch would look
    like rather than adding one for them. Push for a shortlist small enough to actually act on.
  keyPrompts:
  - Which of your opportunities is a genuine stretch, and what would it take to reach it?
  - Is there a wildcard you dismissed too quickly that is worth keeping in?
  - If you could only pursue three of these well, which three would you choose and why?
  watchOuts:
  - A learner keeps every opportunity rather than prioritising, so nothing is truly chosen; require them to name a small shortlist and to say what they are consciously setting aside for now, not just what they are keeping.
  adaptation: |
    If the journal is not available digitally, the same sorting can be done on paper, one opportunity per
    slip grouped into three piles, and copied into the journal later. The task does not need a device.
- title: Compare categorised opportunities in breakout groups
  duration: 15-20 min
  guidance: |
    Put learners in groups of three to five with a scribe. Each learner shares their categorised
    opportunities and how they align with their ambitions. The group challenges the sorting, where a
    realistic option is really a stretch, where a wildcard was dropped too fast, and reflects on what
    the act of categorising revealed. This peer challenge is the engine of the activity: learners
    routinely re-sort an opportunity once someone else questions the label.
  keyPrompts:
  - How do the opportunities you have chosen align with the ambitions you set earlier?
  - Looking at someone else's list, is there anything you would move to a different category?
  - How could your realistic and ambitious opportunities help you reach a wildcard one?
  watchOuts:
  - One learner dominates or the group only affirms each other's sorting; give a round-robin structure ("each person shares before anyone responds") and ask the scribe to record at least one category the group challenged for each member.
  adaptation: |
    With thin attendance or in a mentoring setting, the mentor plays the challenging role, questioning
    the sorting and the balance. Asynchronously, learners post their three categories in a shared space
    and reply to two others with one opportunity they would re-sort and why.
- title: Record your prioritised shortlist and next steps
  duration: 5 min
  guidance: |
    Close the loop individually. Ask each learner to write, in their journal, the balanced shortlist they
    are committing to pursue and the first next step for one of them. This turns a sorting exercise into a
    plan of action and gives you a quick read on who left with a deliberate portfolio and who is still
    hedging on everything.
  keyPrompts:
  - What insight did categorising your opportunities give you about where to put your effort?
  - Which shortlisted opportunity will you take a first step towards, and what is that step?
  - What are you deliberately setting aside for now so you can pursue this shortlist properly?
  watchOuts:
  - Learners write a shortlist but no first step, so the prioritising leads nowhere; push for one concrete action small enough to do before the next session.
closing: |
  Ask two or three learners to name one opportunity they re-sorted after the group challenged them, to
  show how much the labels shift under a second opinion. Remind learners that a balanced portfolio, some
  realistic, some ambitious, one or two wildcard, beats scattering effort across everything, and that this
  shortlist is the plan they will act on and revisit.
agencyContribution:
  indicators:
  - control-of-future-pathways
  - power-over-wellbeing-and-self-direction
  how: >-
    Deciding which opportunities to pursue, and consciously setting others aside, is a learner taking
    deliberate control of their own path rather than chasing whatever appears or defaulting to the safest
    option. Protecting a place for stretch and wildcard keeps the direction of their future an active
    choice they own.
principlesForegrounded:
- lifeworthy-competencies
- connect-to-futures
- feedback-and-data
principleAlignment:
- principle: lifeworthy-competencies
  how: >-
    Sorting options on feasibility and payoff and then choosing a balanced few to pursue is a
    transferable decision-making skill learners will reuse for every course, job and funding choice for
    years, not a one-off classroom exercise.
- principle: connect-to-futures
  how: >-
    Learners weigh each opportunity against the ambitions they set earlier and choose the portfolio that
    best serves the future they are trying to build, which is exactly the act of connecting present
    choices to a longer-term direction.
- principle: feedback-and-data
  how: >-
    The breakout round feeds each learner specific challenge on their own sorting, where a label looks
    wrong or the balance is off, and learners re-sort in response, so peer feedback directly sharpens the
    shortlist they leave with.
competencyCodes:
- FSL2
- FPS1
- APS4
competencyDevelopment:
- code: FSL2
  how: >-
    Turning a scattered list into a prioritised shortlist with a first next step is direct practice in
    setting and pursuing goals; the committed shortlist in the journal is the evidence.
- code: FPS1
  how: >-
    Holding realistic, ambitious and wildcard categories at once, and re-sorting an opportunity when a
    peer challenges the label, exercises adaptable thinking rather than fixing on one safe option.
- code: APS4
  how: >-
    Weighing each opportunity on feasibility and potential impact to decide which to pursue is exactly
    solution analysis, comparing approaches on explicit criteria to reach a deliberate choice.
