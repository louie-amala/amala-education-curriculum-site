rights:
  status: own-expression
  holder: "UC Berkeley YPAR Hub; credited by the source to Stanford's John W. Gardner Center (YELL) and San Francisco Peer Resources"
  basis: >-
    Mapping decisions to decision-makers is a method rather than an expression. Every word here is
    written from scratch, and the source's United States school-district role list and decision
    examples are replaced rather than reproduced.
  note: >-
    Do not restore the source's role set (school site council, district, state and federal government).
    It does not describe the institutions Amala's learners belong to.
sourceRefs:
  - "YPAR Hub (UC Berkeley), Get Started > Youth + Adults > Data and Adultism in Decision-Making lesson plan"
  - "Credited in that plan to Stanford University's Youth Engaged in Leadership and Learning (YELL) curriculum and San Francisco Peer Resources"
provenanceNote: >-
  Adapted from the YPAR Hub's "Data and Adultism in Decision-Making", supplied to Amala in August 2026.
  The three-stage structure, read the data, list the decisions, sort them to decision-makers, is the
  source's, as is the closing question about influencing decisions you do not make. The roles and
  decisions are relocated from a United States school district to whatever institution the learners
  actually belong to, and the routes step is promoted from a closing question to a protected step,
  because without it the session documents powerlessness and stops.
