id: ypar-getting-to-know-each-other
slug: ypar-getting-to-know-each-other
access: public
type: tools-approaches
title: "Getting to know each other: six ways in, from names to opinions"
summary: >-
  Six short activities that move a group from learning names to saying what they think, arranged so a
  facilitator can pick the depth the group is actually ready for.
facilitationContext: [group]
primaryContext: group
toolsFacet: facilitation
deliveryAdaptations:
  - context: group
    how: >-
      Group only. Every one of these produces its result from the fact that other people are
      listening; there is nothing to run alone. Where a learner joins the cohort late, run the name
      game and one other with the whole group again rather than briefing the newcomer separately.
duration: 2 to 20 minutes each, depending on the activity and the size of the group.
grouping: Whole group in a circle for most; pairs for one.
materialsAndPreparation:
  - "Nothing for the name game, role call and best friend."
  - "As the wind blows needs one chair per learner, minus one, and space to move between them."
  - "Skittles needs a bag of sweets or, better, coloured beads or buttons, which can be reused and do not assume anyone eats sugar."
  - "One truth, one lie needs floor space and, if you have it, a way to play music. It runs perfectly well with clapping instead."
  - "A decision about how far you are taking the group today. The later activities in this bank ask for opinions, not facts."
whatLearnersDo:
  - Learn and use each other's names, deliberately and out loud.
  - Say something true about themselves to a group they have just met.
  - Take a position on a statement and stand where everyone can see it.
educatorContent: |
  These sit between an [icebreaker](/materials/ypar-icebreakers), which asks nothing of anyone, and
  the real work of the course, which will eventually ask a group to disagree in public. They are
  arranged here from shallow to deep, and the judgement a facilitator has to make is how far along
  that line this particular group can go today.

  ## Names first, always

  **The name game (15 minutes).** In a circle, the first person says their name. The second says the
  first person's name and their own. The third says both, then their own, and so on round to the
  last, who says everybody's. Add a variation if you want it easier or harder: an animal or a fruit
  or a place beginning with the same sound as the name ("I am Amina and I like apples"), or a small
  action each person performs with their name, which the rest then copy.

  The variations are not decoration. Learners who struggle to hold a list of names often find the
  sound or the movement gives them a handle, and learners who find names easy get a harder version.
  Run the circle a second time going the other way if names are still not sticking. It is worth the
  ten minutes: a group that cannot use each other's names talks through the facilitator for weeks.

  ## Then facts, without pressure

  **Role call (15 minutes).** Split into two teams and call out an ordering: by birthday, by number
  of brothers and sisters, by how long they have lived here, by length of hair. Each team lines
  itself up in that order and the fastest correct line wins the round. Check the order out loud
  afterwards, which is where the information actually gets shared. Move people between teams if one
  keeps winning.

  **Best friend (2 to 3 minutes per person).** Sitting in a circle, each learner introduces the
  person next to them as though they were an old friend, inventing everything: this is my best friend
  Rashid, he is ninety-five, he keeps bees. The person then introduces themselves properly and
  invents the next person in turn. It gets a laugh and it takes the sting out of self-introduction,
  because the ridiculous version has already been said.

  **Skittles (1 to 2 minutes per person).** Pass round a bag of sweets, beads or buttons and tell
  learners to take as many as they want, but not to eat or put down any yet. Then tell them they owe
  the group one thing about themselves for each one they took. If you want it to go further, assign a
  question to each colour: what you like most about yourself, what you would change about the world,
  where you would go if you could go anywhere.

  Use beads rather than sweets if you can. They can be reused, they do not assume anyone eats sugar
  or is able to, and they avoid a group of learners who are hungry treating this as a food
  distribution.

  ## Then opinions

  **As the wind blows (15 to 20 minutes).** Chairs in a circle, one fewer than the number of people.
  The person standing in the middle says their name and "the wind blows for anyone who ...", finishing
  it with something that is true of themselves: who is wearing sandals, who speaks three languages,
  who has ever been asked to translate for an adult. Everyone for whom it is true has to move to a
  different chair, and so does the caller. Whoever is left standing calls the next one. If they cannot
  think of anything they can call "storm", and everybody moves.

  This is the pivot point of the bank. Run with light statements it is a game; run with real ones it
  is the first time the group discovers what it has in common, and that is a much more powerful
  thing. Tell the group which version you are running before you start, and give three examples of
  the kind of statement you mean, or they will follow the first caller's lead whatever it is.

  **One truth, one lie (15 minutes).** Mark two crosses on the floor facing each other. The group
  walks in a circle to music or clapping; when it stops, the two learners on the crosses tell each
  other one truth and one lie about themselves, and each guesses which is which. Whoever guesses
  right stays in. It is a pairs version of the whole-group game in the
  [energisers](/materials/ypar-energisers) bank, and it suits a group where speaking to twenty people
  is still too much but speaking to one is not.

  ## What to watch across all six

  The move from facts to opinions is the move from safe to not safe, and it should be deliberate. A
  cohort of refugee and conflict-affected young people may have very good reasons not to answer a
  question about where they have lived, how long they have been here, or who is in their family.
  Screen your statements and your questions for that before the session, offer the group the right to
  pass without explaining, and mean it.

  Do the group's agreements first if you can. See
  [class agreements](/materials/pb-class-agreements) and
  [co-create norms](/materials/cf-co-create-norms).
facilitationNotes: >-
  The one thing to get right is depth. These six are ordered from names to facts to opinions, and a
  facilitator who jumps to the end because the last one is the most interesting will get either
  silence or performance. Start where the group is, not where you want it to be, and treat the right
  to pass as real: a learner who has to explain why they are passing has not been offered a pass.
  Screen every statement and question against what this particular cohort may not want asked about
  family, movement or status.
steps:
  - title: "Decide how deep to go today"
    duration: 3 min
    guidance: >-
      Before the session, place your group on the line from names to opinions and pick one activity
      from where they are and one from the next step along. A first meeting is names and one fact
      activity. A group in its third week can go to as the wind blows with real statements. Write
      your statements or questions out in advance rather than improvising them in the room.
    keyPrompts:
      - "What does this group already know about each other, and what is the next honest step?"
    watchOuts:
      - "The most interesting activity is chosen for a group that is not ready, and produces either silence or a performance of openness. Go one step, not three."
      - "Statements are improvised in the room and stray somewhere painful. Write them beforehand and read them off the page."
  - title: "Get names working first"
    duration: 10-15 min
    guidance: >-
      Run the name game, with whichever variation fits, and go round twice if the names have not
      stuck. Use names constantly for the rest of the session yourself, and correct your own
      pronunciation out loud when you get one wrong. Ask learners how their name should sound rather
      than assuming, and make it normal for everyone else to ask too.
    keyPrompts:
      - "Say your name the way you want it said, and say it twice."
      - "Who can get all the way round?"
    watchOuts:
      - "Names are mispronounced repeatedly and nobody corrects it, because correcting the facilitator feels rude. Ask to be corrected, out loud, on the first day."
      - "The last person in the circle carries the hardest task and freezes. Let the group help them, or start the second round from a different point."
  - title: "Run one activity that trades facts"
    duration: 15 min
    guidance: >-
      Role call, best friend or skittles. The information is the by-product; the point is that
      everyone has spoken to the whole group once, early, about something with no risk in it. Take
      part yourself and answer at the same depth you are asking for, which sets the level more
      reliably than any instruction.
    keyPrompts:
      - "What did you find out about somebody that you did not expect?"
    watchOuts:
      - "An ordering in role call requires information a learner does not want to give, such as how long they have been in the country. Choose neutral criteria."
      - "A learner takes a large handful in skittles and then cannot think of ten things. Let the group offer them questions rather than leaving them stranded."
  - title: "Move to opinions, with the pass made real"
    duration: 15-20 min
    guidance: >-
      Run as the wind blows or one truth, one lie. Say plainly at the start that anyone may sit a
      round out and does not have to say why. Give your three example statements to set the level.
      Then let the group take it over, and step in only if the statements drift somewhere the group
      has not agreed to go.
    keyPrompts:
      - "The wind blows for anyone who ... what is true of you that might be true of others here?"
      - "What surprised you about who stood up?"
    watchOuts:
      - "Statements become a way of exposing one person. Stop it immediately, restate the rule that the caller's statement must be true of the caller, and take the next turn yourself."
      - "The right to pass exists on paper but a learner who passes is asked why. Make the pass silent and never follow it up in front of the group."
  - title: "Name what the group now knows about itself"
    duration: 5 min
    guidance: >-
      Close by asking what the group noticed about itself, not about individuals. Who stood up
      together that would not have guessed they had that in common? What does the group have more of
      than anyone expected? This turns a set of games into the first piece of evidence that this is a
      group with something shared, which is what the rest of the course will run on.
    keyPrompts:
      - "What do we have in common here that you would not have guessed an hour ago?"
      - "Is there anything you now want in our group agreements?"
    watchOuts:
      - "The closing turns into commentary on particular learners. Keep every question about the group as a whole."
closing: >-
  Carry one thing forward in writing: a shared fact, a common experience, or a statement most of the
  room stood up for. Put it on the wall next to the group's agreements. It is the beginning of the
  cohort having a description of itself, which is worth more later than any single one of these games
  is worth today.
learnerContent: |
  These activities go from easy to less easy, and that is on purpose.

  They start with **names**. It matters more than it sounds: a group where people do not use each
  other's names ends up talking through the facilitator instead of to each other. Say your name the
  way you want it said, and ask other people to say theirs again if you did not catch it. Nobody here
  is going to think that is rude.

  Then they move to **facts** about you, and then to **what you think**.

  You choose what goes into the room and what does not. You can pass on any question, any round, and
  you never have to say why. If something is asked that you do not want to answer, that is not you
  failing to take part.

  At the end we look at the group rather than at individuals: what do we have in common here that we
  would not have guessed an hour ago?

agencyContribution:
  indicators: [contribution-to-community, power-over-wellbeing-and-self-direction]
  how: >-
    A group that finds out it has things in common stops being an audience and starts being a body
    that could act. And the pass, offered and honoured, is a small real experience of controlling what
    you disclose about yourself, which for many of Amala's learners has not often been in their hands.
principlesForegrounded: [safe-spaces, builds-on-identities, collaboration]
principleAlignment:
  - principle: safe-spaces
    how: >-
      The bank is deliberately graded and the right to pass is built into the design rather than added
      as a caveat, because the honest risk here is a facilitator asking a displaced young person, in
      public, on day one, where they are from.
  - principle: builds-on-identities
    how: >-
      Names are treated as something to get right rather than to get through, and the deeper
      activities let learners choose which parts of themselves to put into the room and in what order.
  - principle: collaboration
    how: >-
      Discovering shared ground is the raw material of collaboration. As the wind blows in particular
      shows a group its own overlaps physically, which no discussion achieves as quickly.
competencyCodes: [FLC2, FUS2]
competencyDevelopment:
  - code: FLC2
    how: >-
      Learners practise the specific moves that make other people feel included: using a name
      correctly, asking a question that can be answered safely, noticing who has not spoken.
  - code: FUS2
    how: >-
      Each activity produces small, concrete evidence that other people's lives differ from the
      learner's own in ways that were not visible, which is where understanding other people starts.
