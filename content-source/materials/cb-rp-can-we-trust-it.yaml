title: "Can we trust it?"
summary: >-
  A simple page for weighing one piece of evidence - the three checks a researcher makes of any source
  (leading with checking it against others), and a place to mark how much weight it can bear.
facilitationContext:
- group
- independent
primaryContext: independent
learnerContent: |
  ## Can we trust it?

  Use one of these for each source, and for anything important people told us. Answer in words, drawings,
  or marks. These are the three checks printed on the cards in our source pack.

  For each piece of evidence, the sheet has room for:

  - Who made it, and why? (could they have a reason to tell it one way?)
  - How do they know - and is it still true? (do they show it, or just say it?)
  - Does it hold up? (does it agree with the other sources, and with what WE found?)
  - How much weight can it bear? (a lot, some, or a little)

  The third check matters most: the strongest evidence is what many sources AND our own research agree
  on. Keep these pages in your research book. They show your teacher how you are learning to weigh
  evidence like a researcher.
