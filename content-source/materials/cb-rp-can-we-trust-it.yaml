access: public
edition: learning-bridge-coxs-bazar
type: resource
title: "Can we trust it?"
summary: >-
  A simple page for weighing one piece of evidence — the five questions a researcher asks of any source,
  and a place to mark how much weight it can bear.
facilitationContext:
- group
- independent
primaryContext: independent
learnerContent: |
  ## Can we trust it?

  Use one of these for each source, and for anything important people told us. Answer in words, drawings,
  or marks. These are the same five questions printed on the cards in our source pack.

  For each piece of evidence, the sheet has room for:

  - Who? (who made it or said it)
  - When?
  - Why? (why did they say it — could they have a reason to tell it one way?)
  - Do they show how they know?
  - Does it help our question?
  - How much weight can it bear? (a lot, some, or a little)

  Keep these pages in your research book. They show your teacher how you are learning to weigh evidence
  like a researcher.
