access: partner
edition: learning-bridge-coxs-bazar
type: resource
title: "The ten-minute conversation"
summary: >-
  The repeatable shape of one mentoring conversation - check in, pick up the last step, look at what is
  in front of them, agree one next step - with the questions to ask, the five-second wait, what to do
  when a learner says nothing, and how to close.
facilitationContext:
- one-to-one-mentoring
primaryContext: one-to-one-mentoring
duration: "About 10 minutes, most weeks, inside the in-person time"
grouping: "One to one, or occasionally a very small same-gender group"
educatorContent: |
  ## Why a fixed shape

  You are running three components, you have a caseload, and you are doing this while the rest of the
  group works. Without a shape, mentoring becomes whatever there is time for - which in practice means
  progress-chasing with the learners who are already doing well.

  The shape below takes about ten minutes and works whether things are going well or badly. Learn it
  once and you can run it while tired, in a noisy room, in week eleven.

  ## The four moves

  **1. Check in - about two minutes. Always first.**

  Not as a doorway to business. Actually ask, and actually wait.

  - "How have things been since we talked?"
  - "What has been hard this week?"
  - "What has been good?"

  Ask the hard one before the good one. If you ask "what's been good" first, many learners will give you
  the good answer and close the door.

  **2. Pick up the last step - about two minutes.**

  Look at their mentoring page together. Last time you agreed one step.

  - "Last time you said you would ___. How did that go?"

  Whatever the answer, do not make it a test. If it happened, say so out loud and ask what helped. If it
  did not, the only useful question is "what got in the way?" - asked with genuine curiosity, because
  the answer is usually information you need. A learner who is punished for an honest "no" gives you a
  dishonest "yes" from then on, and you have lost the instrument.

  **3. Look at what is in front of them - about four minutes.**

  This is where you connect the components. Open whichever is live: their learning goal, their English
  practice, their part of the research, or something they raised in the check-in.

  - "Show me where you are."
  - "What is the hardest bit right now?"
  - "What have you already tried?"

  That third question is the coaching move. Ask it before you offer anything. Most of the time the
  learner has already tried something, and hearing themselves say it is more useful than your idea.

  **4. Agree one step - about two minutes. Always last.**

  One step. Small enough that it will actually happen before you next meet. The learner says it, not
  you - if you say it, it is your step.

  - "So what is one thing you will do before we talk again?"
  - "Is that small enough? What would make it easier?"

  Then they write or draw it on their mentoring page, and you note it on yours. Say it back to them
  once. That is the close.

  ## The five-second wait

  When you ask something real, count to five before you speak again. It will feel much longer than it
  is. Most facilitators fill the gap at two seconds and never find out what the learner would have
  said.

  This matters more here than in most settings: many learners are working in a second or third
  language, are used to school being a place where adults talk, and need time to decide whether to
  trust you with an honest answer.

  ## When a learner says nothing

  Silence is common early on and it is not failure. Options, roughly in order:

  - **Shift from talking to looking.** Open their workbook and ask them to show you something instead
    of tell you. Pointing is easier than speaking.
  - **Ask about the thing, not the feeling.** "What happened with your step?" lands more easily than
    "how are you feeling?"
  - **Offer a choice rather than an open question.** "Was it that you did not have time, or that it was
    harder than it looked, or something else?"
  - **Let it be short and warm, and come back next week.** A two-minute conversation that was
    comfortable is a better investment than ten minutes of extraction.

  Do not fill the silence with reassurance. "I'm sure it's fine" ends the conversation.

  ## What to do with what you hear

  - **Small and practical** - a step that was too big, a missing pencil, a clash with work at home:
    solve it or coach it, there and then.
  - **A pattern you do not like** - withdrawal, a "fine" that has changed shape, three weeks of nothing
    happening: note it, keep watching, and raise it with your coordinator if it continues.
  - **Anything about safety, harm, or risk** - stop. Do not follow it, do not promise secrecy, close
    the conversation calmly, and follow the referral pathway the same day. The safeguarding page has the
    words.

  ## Closing, every time

  End on the step, and end warmly. Two sentences:

  > "So: ___ before we next talk. I'll ask you about it."

  That last half-sentence is the part that makes the next conversation continuous rather than new, and
  continuity is the whole mechanism.
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  how: >-
    The shape is built so the learner does the deciding: they say what got in the way, they say what
    they have already tried, and they name the next step. A mentor who supplies all three has produced
    a plan the learner is following rather than one they are directing - the difference between support
    and management, and the whole point of the component.
