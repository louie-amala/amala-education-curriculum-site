# English for Impact - My Voice (Unit 1) resource. Key vocabulary + sentence frames + word bank.
# Source: LLL Course Guide Unit 1 Key Vocabulary (p. 26). Fills the "sentence frames" scaffold that
# Part 3 §12 marks "in development", for Unit 1.
id: efi-mv-key-vocabulary-and-frames
slug: efi-mv-key-vocabulary-and-frames
access: public
type: resource
title: "My Voice: key vocabulary and sentence frames"
summary: >-
  The Unit 1 word bank and sentence frames in one place - the identity vocabulary, high-frequency
  verbs and nouns, and the sentence starters learners use to introduce themselves. A reference for
  learners and a scaffold educators can display, print, or hand out.
facilitationContext: [group, independent]
primaryContext: independent
materialsAndPreparation:
- Display or print this word bank and the sentence frames where learners can see and reuse them.
- Pair with pictures for each word where possible, so the bank is readable by meaning as well as by sound.
educatorContent: |
  Keep this word bank and the sentence frames visible throughout Unit 1 - on the wall, in the learner's
  workbook, or on a handout. The frames are the scaffold that lets beginners produce whole sentences
  before they can generate them unaided: learners slot their own information into a fixed frame, and
  gradually take the frame away. Encourage learners to add a picture and, if they wish, the Home
  Language word beside each English one. This resource supports the vocabulary activity ("Words about
  me"), the grammar activity ("The verb 'to be' and subject pronouns"), and the writing activity.
learnerContent: |
  ## Key words

  Personal identity: name, age, country, city, language

  High-frequency verbs: am, is, are, live, like, go, have

  Basic nouns: student, teacher, friend, family

  Common sentence words: I, you, he, she, my

  ## Sentence frames - introduce yourself

  Use these frames and put in your own information.

  - My name is ______.
  - I am ______ years old.
  - I am from ______.
  - I am a ______.
  - I live in ______.
  - I speak ______.
  - I like ______.
  - I do not like ______.

  ## Grow your sentences

  Start with a word, then a phrase, then a sentence:

  - student → a student → I am a student.
  - Kenya → from Kenya → I am from Kenya.
  - football → like football → I like football.
agencyContribution:
  indicators: [power-over-wellbeing-and-self-direction, control-of-future-pathways]
  how: >-
    A word bank and sentence frames give a beginner the means to say and write real things about
    themselves from the first week, rather than wait until they can build sentences unaided. Having a
    scaffold they can reuse and gradually let go of puts early independence within reach.
principlesForegrounded: [builds-on-identities, lifeworthy-competencies]
principleAlignment:
- principle: builds-on-identities
  how: >-
    Every frame is completed with the learner's own information, so the language they produce is about
    their real identity; Home Language words are welcomed alongside the English.
- principle: lifeworthy-competencies
  how: >-
    Sentence frames and a reusable word bank are scaffolding strategies learners carry into every later
    unit as their independence grows.
competencyCodes: [FLC3]
competencyDevelopment:
- code: FLC3
  how: >-
    The frames and word bank are the immediate means by which beginners communicate personal
    information clearly in speech and writing.
