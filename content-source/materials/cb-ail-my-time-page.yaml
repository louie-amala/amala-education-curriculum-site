learnerContent: |
  ## My time

  This page is yours. You can draw, write, or say your answer — someone will write it for you if you
  ask — and nobody marks it right or wrong.

  - Mark the times you will work on your goal.
  - Name the one slot you will protect.
  - Name the smaller thing you will still do if the week gets hard.
