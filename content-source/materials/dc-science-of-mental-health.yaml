provenanceNote: >-
  Enriched into a structured facilitation flow (a jigsaw of topics with prompts, watch-outs, delivery
  modes, a no-device adaptation and a sensitivity note) from the Design Challenge activity guide,
  which supplied the purpose, the four source topics and the key-insight and discussion prompts. The
  source Design Challenge investigates the mental health and wellbeing of Afghan females; this
  material is written to generalise to any sensitive wellbeing challenge, with that as the worked
  example. Specific biological claims from the source videos are left for a facilitator to confirm and
  are marked [to verify]. Linked to Research Project objective 1 (framing a real-world challenge).
