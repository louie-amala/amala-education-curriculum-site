id: pathways-interview-tell-me-about-yourself
slug: pathways-interview-tell-me-about-yourself
access: public
type: activity
title: "Preparing for interviews: answering 'Tell me about yourself'"
summary: Learners build and rehearse a strong answer to the interview opener "Tell me about yourself",
  structuring it around past, present and future and keeping it relevant to the opportunity they want.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners draft their answer alone after the input, then read it aloud and swap
    feedback in small breakout groups. The value sits in hearing an answer spoken and getting a
    reaction, so protect the rehearsal step even if you shorten the drafting, and keep groups small
    enough that everyone gets a turn.
- context: one-to-one-mentoring
  how: >-
    A strong fit for the rehearsal. The learner drafts their answer, then delivers it to the mentor as
    if the mentor were the interviewer, and the mentor gives specific feedback on content and
    delivery. Have the learner draft before the session so the time is spent improving and practising
    a real answer, not writing one from scratch.
- context: independent
  how: >-
    Workable for drafting, weaker for the rehearsal that makes the answer land, because a learner
    cannot easily hear how they sound or read a listener's reaction. If a learner works alone, ask
    them to record themselves answering aloud and play it back, and to get at least one round of
    feedback from a peer, mentor or facilitator before an interview.
duration: 40-50 min facilitated, plus the video and journal task
grouping: Individual drafting, then breakout groups of 3-5; works with 10-35 learners
whatLearnersDo:
- Learn the past-present-future structure for answering "Tell me about yourself".
- Draft your own answer in your Pathways Journal, aimed at an opportunity you care about.
- Read your answer aloud and get feedback from your group on what is strong and what to strengthen.
- Reflect on what the activity taught you about interviews and refine your answer.
materialsAndPreparation:
- The Pathways Journal, one per learner, open at the "tell me about yourself" task (printed or digital).
- The past-present-future video or your own worked walkthrough if you prefer to lead the input live.
- Your own short worked answer, structured past-present-future, to model the shape before learners draft.
- A way for each breakout group to keep notes, and a nominated scribe per group.
facilitationNotes: |
  "Tell me about yourself" opens most interviews, and a prepared answer is the fastest way to steady a
  nervous learner. The one thing to get right is that there is no single correct answer: the job is to
  help each learner shape their own true story into a clear structure and keep it relevant to the
  opportunity, not to hand them a script. Rehearsing aloud matters more than perfecting the wording on
  the page, so protect time for learners to speak their answer and hear a reaction to it.
steps:
- title: Frame the question and the past-present-future structure
  duration: 10-15 min
  guidance: |
    Explain that "Tell me about yourself" is an invitation, not a trap: the interviewer wants a short,
    relevant story, not a life history. Introduce the past-present-future shape using the video or
    your own worked answer, keeping your example concrete. Stress that no single approach is best; the
    structure is a scaffold that helps a learner stay clear and relevant under pressure.
  keyPrompts:
  - Why do you think interviewers open with this question so often?
  - What belongs in the past, present and future parts of a good answer?
  - How is answering this at interview different from introducing yourself to a new friend?
  watchOuts:
  - Learners hear the structure as a rigid formula and produce identical robotic answers; stress that past-present-future is a scaffold for their own true story, and that the details, tone and emphasis should be theirs.
  adaptation: |
    With no way to play the video, your own spoken worked answer and the three time horizons written
    on a board or sheet of paper are enough to run this step.
- title: Draft your answer in the Pathways Journal
  duration: 15-20 min
  guidance: |
    Give learners quiet, individual time to draft their answer in the "tell me about yourself" task,
    aimed at a specific opportunity they care about. Circulate quietly. Where a learner is stuck, ask
    what first drew them to this path or what they are proud of rather than feeding them lines. Remind
    them to keep it to a minute or two and to cut anything not relevant to the opportunity.
  keyPrompts:
  - Which opportunity are you aiming this answer at, and what would that interviewer most want to hear?
  - What in your past best explains why you are a good fit for this?
  - Is everything in your answer relevant here, or is some of it just filling time?
  watchOuts:
  - A learner writes a long, unfocused life story that drifts off the opportunity; ask them to name the one opportunity they are answering for and cut anything that would not help that specific interviewer.
  adaptation: |
    If the journal is not available digitally, learners can draft on paper against the three headings
    and copy it into the journal later. The task needs no device.
- title: Rehearse aloud and swap feedback in breakout groups
  duration: 15-20 min
  guidance: |
    Put learners in groups of three to five with a scribe. Each learner reads their answer aloud, then
    the group discusses what was strong and why, and how it could be strengthened and why. Rehearsing
    aloud is the engine of the activity: an answer that reads well on the page often sounds long or
    stiff spoken, and learners only find that out by saying it and hearing a reaction.
  keyPrompts:
  - What was strong about that answer, and what made it work?
  - Where could this answer be strengthened, and why would that help?
  - Did the answer stay relevant to the opportunity, or did it wander?
  watchOuts:
  - Feedback stays vague ("that was good") and nothing improves; model one specific, kind comment yourself first, and ask the scribe to record at least one strength and one concrete suggestion for each speaker.
  adaptation: |
    With thin attendance or in a mentoring setting, the facilitator or mentor becomes the listener and
    the interviewer. Asynchronously, learners record their answer and post it, then reply to two peers
    with one strength and one suggestion each.
- title: Reflect on what you learned and refine your answer
  duration: 5 min
  guidance: |
    Close the loop individually. Ask each learner to note, in their journal, what the activity taught
    them about the interview process and one change they will make to their answer. This turns a
    discussion into a sharper answer and a piece of learning they can carry into any future interview,
    not just this question.
  keyPrompts:
  - What did completing this activity teach you about the interview process?
  - What is one change you will make to your answer based on the feedback you heard?
  - How could you use this way of preparing for other interview questions?
  watchOuts:
  - Learners treat the answer as finished and memorise it word for word; remind them a good answer is adapted to each opportunity and sounds natural, not recited, so it is a reusable approach rather than a fixed script.
closing: |
  Ask two or three learners to name one thing that made a peer's answer strong, so the group leaves
  with a shared sense of what good looks like. Remind everyone their answer lives in the Pathways
  Journal and is meant to be revisited and re-aimed at each new opportunity they apply for.
agencyContribution:
  indicators:
  - control-of-future-pathways
  how: >-
    Walking into an interview with a prepared, relevant answer to the opener turns a high-stakes,
    intimidating moment into one the learner has shaped in advance. Being able to present themselves
    clearly is what lets a learner actively pursue an opportunity rather than be thrown by it, keeping
    control of their own pathway.
principlesForegrounded:
- lifeworthy-competencies
- recognise-communicate-growth
- connect-to-futures
principleAlignment:
- principle: lifeworthy-competencies
  how: >-
    Answering "Tell me about yourself" is a transferable, real-world skill a learner will reuse in
    every job, course and funding interview for years, and the activity ends with an answer and an
    approach they own rather than a one-off exercise.
- principle: recognise-communicate-growth
  how: >-
    The whole task is a learner learning to recognise their own past, strengths and direction and
    communicate them concisely to a listener who does not know them, which is exactly the act of
    articulating one's own growth to others.
- principle: connect-to-futures
  how: >-
    The answer is deliberately aimed at a specific opportunity and built around a future part, so
    learners practise linking who they have been and are now to the future they are trying to reach.
competencyCodes:
- FLC3
- FSL1
competencyDevelopment:
- code: FLC3
  how: >-
    Crafting and delivering a concise, relevant answer to persuade an interviewer is direct practice
    in influential communication; the spoken answer and the group feedback on it are the evidence.
- code: FSL1
  how: >-
    Choosing what from their past and present best explains their fit, and reflecting on what the
    activity taught them, is self-reflection put to a concrete purpose; the journal entries evidence it.
