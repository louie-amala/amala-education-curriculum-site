  holder: Noam Ebner (Creighton University) and Yifat Winkler
  basis: >-
    The simulation is published and remains the authors'. Nothing of it is reproduced here: this page
    describes what it does, argues where it fits the course, and links to the authors' own free
    download. All wording is Amala's own. The authors mark the pre-print "use freely for educational
    and research purposes", which is a grant to use it, not to republish it.
  note: >-
    Do not copy the participant forms, payoff tables or role material onto this page. Send facilitators
    to the SSRN download, which is free, complete and kept current by the authors.
