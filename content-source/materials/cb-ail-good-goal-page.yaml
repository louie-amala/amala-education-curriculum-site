access: partner
edition: learning-bridge-coxs-bazar
type: resource
title: "Is my goal a good goal?"
summary: >-
  The four tests a good goal passes — small, clear, it matters, by-when — to check a goal against, every time.
facilitationContext:
- group
- independent
primaryContext: independent
learnerContent: |
  ## Is my goal a good goal?

  This page is yours. You can draw, write, or say your answer — someone will write it for you if you
  ask — and nobody marks it right or wrong.

  - Check your goal against the four tests.
  - If a test does not pass, change your goal a little until it does.
  - Keep this page. Use it every time you set a goal.
agencyContribution:
