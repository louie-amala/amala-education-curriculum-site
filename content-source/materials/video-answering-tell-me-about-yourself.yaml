links:
- label: "Watch: How to Answer 'Tell Me About Yourself'"
  url: https://www.youtube.com/watch?v=eyehDPkAQRA
  note: >-
    External video (YouTube), in English.
facilitationNotes: |
  This video is a resource for the linked activity: learners watch it to learn how to answer the interview question 'Tell me about yourself', then
  apply it to their own work. Treat it as an input to their practice, not the lesson itself, and keep
  the focus on what each learner produces. Preview it first, and have a no-video fallback ready.
learnerContent: |
  Watch this video to learn how to answer the interview question 'Tell me about yourself', then use what you learn on your own work for the linked
  activity. You can pause, rewatch, and turn on captions. The video is a starting point: your own
  draft, and the feedback you get on it, are what make it stick.
