# Contextualised, fully offline adaptation of ail-making-an-action-plan for Learning Bridge+ (Cox's Bazar).
# Oral and visual first, ~60 min facilitated.
id: cb-ail-making-an-action-plan
slug: cb-ail-making-an-action-plan
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "My first small step"
summary: >-
  Learners turn one goal into a small picture-plan: the steps drawn in order, the first small step
  chosen, and what they need to take it before the next session.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners draw their own steps, then show a same-gender partner who asks whether they
    could really start the first one this week. That partner question is what catches a step that is
    too big or too vague, so keep the pairing even if you shorten your own modelling.
- context: one-to-one-mentoring
  how: >-
    A strong fit. A mentor helps the learner size the first step honestly and name the person or thing
    they will need. Have the learner arrive holding a goal they already set, so the time goes on
    planning a real step rather than choosing a goal from scratch.
- context: independent
  how: >-
    Workable but weaker: a learner alone tends to pick a step that is too large or forgets what it
    needs. The workbook picture-steps and the four questions (steps, order, by when, what it needs)
    carry it, but ask them to say their first step to a peer or mentor before they start it.
duration: "About 2 hours in the unit plan (generous for this oral/visual, translated cohort, the step timings below are the active teaching core; the rest is warm check-in, drawing, and translation), plus a 30 min independent task"
grouping: "Individual planning, then same-gender pairs; works with 10-35 learners"
whatLearnersDo:
- Bring out the step ladder you built for your goal, and lay the steps out to work with.
- Put the step-pictures in order and point to the one that comes first.
- Mark a by-when for your first step and say what it needs (a person, a thing, a place, or time).
- "Draw an if–then for your first step: if the thing that usually stops you happens, then you will do this instead."
- Show your first step to a partner, then say aloud the one step you will take and when.
materialsAndPreparation:
- Your own honest example of a real goal, three or four steps, a first step with a by-when, and an if–then, to draw and model first.
- Learners' step ladder from "Your steps, and your first step", so the plan builds on the steps they already made rather than starting over.
- The student workbook (a strip of empty boxes for step-pictures, and simple pictures for who or what a step needs).
- Small stones, bottle caps, or scraps the learner can lay out and reorder as steps, so no writing is needed.
- "Sensitivity: a goal can touch on family, work, or leaving the camp. Let learners keep the goal private, choose a simpler one, and never require anyone to say their reasons aloud."
visuals:
- kind: setup
  title: "Lay out the plan"
  caption: >-
    Steps in order, the first one marked with its by-when, and an if–then for the thing that usually gets
    in the way. Stones or cards, not writing.
  spec:
    type: zones
    cardStyle: drawing
    zones:
    - label: "Steps, in order"
      tone: neutral
      cards:
      - "1 → 2 → 3"
    - label: "First step + by-when"
      tone: positive
      cards:
      - "by Tuesday"
    - label: "If… then…"
      tone: question
      cards:
      - "a back-up step"
- kind: example
  title: "My first small step"
  caption: >-
    The finished picture-plan: a first step with a day, and an if–then so a hard day does not stop the
    whole goal.
  spec:
    type: zones
    flow: across
    flowLabel: "if not"
    zones:
    - label: "My first step"
      tone: positive
      cards:
      - "ask teacher for a book, by Tuesday"
    - label: "If it doesn't happen…"
      tone: question
      cards:
      - "then read one page at home instead"
facilitationNotes: |
  An action plan only helps if it is small enough to act on this week. The one thing to get right is
  to stop learners drawing a big, overwhelming plan they will never start. Keep it to a real goal, a
  few step-pictures, and a first step small enough to take before you next meet. Do not labour the
  words action plan: it is just deliberate steps, drawn, not a document. Say aloud that a plan a
  learner owns and can truly begin beats a tidy one they abandon. Help them name what the first step
  needs, so a missing thing is spotted now rather than becoming an excuse later.
steps:
- title: "Lay out the steps you already built"
  duration: "14-16 min"
  guidance: |
    Model with your own goal first: say it aloud and show its steps. Then have learners bring out the
    step ladder they built in the goal-setting session and lay the pictures out, adding any step that is
    missing rather than starting over. Say aloud that each step should be a thing a person could actually
    do, not a wish, and that a few good steps beat twenty. Circulate and ask, do not tell, whether any
    step is really the next doable thing.
  keyPrompts:
  - Looking at the ladder you built, is any step missing between where you are and your goal?
  - Is each picture a thing you could do, or is it still just a wish?
  - What is the smallest first thing that would move this forward?
  watchOuts:
  - A learner draws steps so big each is really a goal of its own; help them break the first one down into a single doable action, and scribe a few words under the picture if they ask.
  adaptation: |
    With no board or device, lay out stones or caps, one per step, and point. Learners draw or place,
    and you scribe a word only if asked. The steps matter more than the marking.
- title: "Put the steps in order and point to the first"
  duration: "12-14 min"
  guidance: |
    Show learners how to put the step-pictures in order: what has to come before what, and which one
    they can start now. Say aloud that some steps must wait for others, so a sensible order stops a
    learner stalling on something they cannot yet do. Have each learner lay their pictures left to
    right and point to the one that comes first, checking it does not wait on a step not yet reached.
  keyPrompts:
  - Which of these steps has to happen before the others can?
  - Which step could you actually start first, this week?
  - Is anything you drew waiting on a step you have not done yet?
  watchOuts:
  - A learner points to a first step that quietly waits on a later one and then cannot start; walk them back to the true first action they can take alone.
  adaptation: |
    If there are no boxes, laying the stones or scraps in a row and swapping their order by hand shows
    the sequence just as well as writing numbers.
- title: "Mark a by-when, name what it needs, and draw your if–then"
  duration: "14-16 min"
  guidance: |
    Move from order to commitment. Ask each learner to mark a real by-when for their first step (point
    to a day on the workbook week-strip), and to say what it needs: a person to ask, a thing, a place,
    or a slice of time. Say aloud that naming needs now is how a learner spots a blocker before it
    becomes an excuse. Then have each learner draw an if–then: a picture of the thing that usually stops
    them, an arrow, and a picture of the smaller thing they will do instead, so the plan already knows
    what to do when the week goes wrong. Model your own if–then first. Keep the by-when close and honest,
    so the first step is done before you meet again.
  keyPrompts:
  - By when will you have taken your first step, pointing to a real day?
  - "What do you need to take it: a person, a thing, or some time?"
  - "Draw your if–then: if the thing that usually stops you happens, then what smaller thing will you do instead?"
  watchOuts:
  - A by-when is vague or far off, so nothing starts; pin it to a real day this week and shrink the step until it fits the time the learner honestly has.
  adaptation: |
    If a needed thing turns out to be unavailable in the camp, help the learner reshape the step
    around what they do have rather than parking the whole plan.
- title: "Show a partner and say your step aloud"
  duration: "12-14 min"
  guidance: |
    Put learners in same-gender pairs to show each other their first step and by-when. The partner's
    one job is to ask whether the step is really doable by then, and whether anything is missing. Each
    learner changes their step if needed, then says aloud, to their partner, the one step they will
    take and when. Saying it to someone is a light form of accountability that makes the step more likely.
  keyPrompts:
  - Could your partner really start their first step by the day they pointed to?
  - Is anything missing from their step that they have not spotted?
  - What is the one step you are committing to, and by when?
  watchOuts:
  - Pairs slip into admiring the drawing rather than testing it; give them the one question to ask each other, whether the first step is truly doable by that day, and keep them on it.
  adaptation: |
    In thin attendance or a mentoring setting, the facilitator or mentor plays the partner and asks
    the same doable-by-when question aloud.
closing: |
  Ask two or three learners to say their first step and its by-when aloud. Say that the plan lives in
  their workbook and is not fixed: as steps are taken and things change, the plan is updated, not
  abandoned. Remind them the point is not a tidy picture but a first deliberate step actually taken
  before you next meet. Independent task: take your first small step, then mark in the workbook
  whether it happened and what got in the way.

educatorContent: |
  ## What you need to know before you teach this

  The steps already exist, learners built the ladder last session. This block turns that ladder into
  something that survives contact with a real week. Three things get added: an order, a by-when, and a
  plan for the week going wrong.

  ### The failure this block exists to prevent

  Not "learners do not plan". Learners plan beautifully and then nothing happens, because the plan
  assumed a week that did not arrive. Then they conclude they are the sort of person who does not
  follow through. That conclusion is the real damage, and it is what the if–then is for.

  ### Keep it small: resist the impulse to make it impressive

  A plan that fills the page looks like good work and predicts nothing. Four or five steps, one first
  step, one by-when. If a learner is drawing an elaborate plan, they are performing planning rather
  than preparing to act.

  Do not labour the words "action plan" either. It is just deciding what you will do and when.

  ### What each step needs: ask it as a question, not a form

  For each step: **what does this need?** A person, a thing, a place, or time. That question is what
  turns "practise English" into "practise English, needs: someone to practise with", which
  immediately surfaces that the step cannot happen yet. Better to find that now than on Thursday.

  ### The if–then is the most valuable thing in the block

  This is the part to protect if you are short of time.

  **If [the thing that usually stops me] happens, then I will [smaller thing instead].**

  Not "I will try harder". A specific, smaller alternative decided in advance, while the learner is
  calm and can think, because in the moment the obstacle arrives they will not be.

  Make them name the real obstacle, not a polite one. The honest answers here are things like: my
  mother needs me, there is no light, I am too tired after work, my brother takes the book, it rains
  and I cannot go. A learner who names "I get distracted" has given you a placeholder, push once, warmly.

  Good if–thens sound small and slightly disappointing. That is correct. "If there is no light, then I
  will say my sentences out loud instead of writing them" is worth more than any amount of resolve.

  ### The by-when is a decision, not a deadline

  Nobody is enforcing it and learners should know that. Its whole job is to convert "soon" into
  something you can notice you have missed, which is information, not failure.

  ### Say it aloud to a partner

  End with each learner saying their first step and their if–then out loud to someone. A plan said to a
  person is far more likely to happen, and it is where you hear which plans are still fantasy.

  ## Before they leave this block

  - Steps in an order, with the first one pointed at.
  - A by-when on the first step.
  - Each step has what it needs named, and any step that cannot happen yet has been spotted.
  - An if–then with a REAL obstacle and a genuinely smaller alternative.
  - First step and if–then said out loud to a partner.
learnerTeaching:
  title: "How to make a plan that survives a bad week"
  readAloud: |
    ## How to make a plan that survives a bad week

    You have your steps. Now we turn them into a plan.

    Here is the thing to understand first: **most plans do not fail because they were wrong. They fail
    because the week went wrong.** Someone got ill, the rain came, you were needed at home, you were
    too tired.

    So we are going to plan for that from the start. Not because we expect you to fail, because that
    is what a real plan does.

    ### 1. Put your steps in order

    Which one has to happen first? Which one cannot happen until another is done?

    Point at the first one.

    ### 2. Say when: a by-when

    Put a time on your first step. By Thursday. Before the next session. This week.

    Nobody is checking, and nothing bad happens if you miss it. The by-when is just so that "soon"
    turns into something you can notice. Noticing you missed it is useful. It is not failing.

    ### 3. For each step, ask: what does this need?

    A person? A thing? A place? Time?

    This one question saves a lot of wasted weeks. If your step is "practise English" and what it needs
    is "someone to practise with", and you do not have anyone yet, then that step cannot happen at
    all. Much better to find that out now than on Thursday.

    ### 4. Now the most important part: your if–then

    Think about what USUALLY stops you. The real thing, not the polite thing.

    - My mother needs me.
    - There is no light.
    - I am too tired after work.
    - My brother takes the book.
    - It rains and I cannot go.

    Now decide, **now, while you are calm**, what you will do instead when that happens:

    **If ______ happens, then I will ______.**

    The "then" must be SMALLER, not the same thing with more effort.

    - "If I am too tired to write, then I will say my three sentences out loud instead."
    - "If my mother needs me all evening, then I will do one word in the morning."

    ### Why this works

    When the obstacle actually arrives, you will be tired, or worried, or busy. That is the worst
    moment to decide anything.

    If you already decided, you do not have to think. You just do the smaller thing. And doing the
    smaller thing means you did not stop, which is the whole point.

    ### A good if–then sounds small and a bit disappointing

    That is correct. It is supposed to. A tiny thing that actually happens beats a big thing that
    does not.

    ### Say it out loud

    Tell your partner your first step and your if–then. Out loud, to a person. It makes it real.
  words:
    - term: action plan
      meaning: your steps, in order, with when you will do them and what they need
    - term: by-when
      meaning: the time you decide you will have done a step by
    - term: if–then
      meaning: deciding now what you will do instead when the usual thing stops you
  tryIt:
    intro: >-
      Is each of these a good if–then, or will it fail? Circle your answer, then check at the back of
      the book.
    chooseFrom: ["good if–then", "will fail"]
    items:
      - "If I am busy, then I will try harder."
      - "If there is no light in the evening, then I will practise my words while I walk to the water point in the morning."
      - "If I feel too shy to speak English to a stranger, then I will say it to my sister instead."
      - "If I miss a day, then I will do double the next day."
    answers:
      - "Will fail. \"Try harder\" is not a plan. It is the same thing with more effort, decided by a tired person in a bad moment. What SMALLER thing could you do instead?"
      - "Good. The obstacle is real and specific, and the \"then\" is smaller and happens somewhere else. This will survive the week."
      - "Good. It keeps the step alive at a size you can manage, and speaking to one trusted person counts fully."
      - "Will fail. Double is bigger, not smaller, so a bad day turns into a harder day, and then you stop. Try: \"if I miss a day, then I will do one small thing the next day and carry on.\""
    then: >-
      Now write or draw your own if–then. Use the REAL thing that stops you, and make the "then"
      genuinely smaller.
worksheet:
  slug: cb-ail-action-plan-page
  note: "In the learner's book (My Learning Book): the 'My action plan' page. Print one per learner."
agencyContribution:
  indicators:
  - control-of-future-pathways
  how: >-
    Turning a goal into small steps a learner will actually take is the move from wanting a future to
    building one, even where the camp limits so much else. By choosing the order, the day, and what
    each step needs, the learner keeps the direction and pace of their own progress in their own hands.
principlesForegrounded:
- lifeworthy-competencies
- connect-to-futures
- feedback-and-data
principleAlignment:
- principle: lifeworthy-competencies
  how: >-
    Breaking a goal into ordered, timed steps and taking the first one is planning and self-direction
    in miniature, a habit these learners can reuse for any goal in life, and one that does not depend
    on literacy or a classroom to keep using.
- principle: connect-to-futures
  how: >-
    The plan is built from a goal the learner has already tied to what matters to them, so the drawn
    steps and by-whens are deliberate progress towards the future they are trying to build, not busywork
    for the session alone.
- principle: feedback-and-data
  how: >-
    Naming what each step needs and showing the first step to a partner turns the plan into something
    the learner tests and adjusts against real feedback, and the workbook note on whether the step
    happened feeds the next session's planning.
competencyCodes:
- FSL2
- ASL2
competencyDevelopment:
- code: FSL2
  how: >-
    Making an ordered, timed picture-plan and taking a first deliberate step is the pursue half of
    setting and pursuing goals; the drawn plan and the step taken between sessions are the evidence a
    learner moves from intention to action.
- code: ASL2
  how: >-
    Marking an honest by-when, fitting the first step to the time a learner actually has in a busy camp
    week, and naming blockers in advance is direct practice in managing time and priorities to sustain
    progress.
