id: mentor-know-your-safeguarding-policy
slug: mentor-know-your-safeguarding-policy
access: public
type: educator-move
title: "Know your safeguarding policy before you mentor"
summary: >-
  Before you work one-to-one with any young person, know your setting's safeguarding policy and
  referral pathways cold. Everything else in this bucket assumes you have.
tags:
  - id: safeguarding
facilitationContext:
  - one-to-one-mentoring
primaryContext: one-to-one-mentoring
educatorContent: |
  Mentoring means working closely, often one-to-one, with young people — many of whom have lived
  through conflict, displacement or loss. That closeness is exactly why safeguarding comes first.
  Before you start, know your setting's safeguarding policy: what counts as a concern, who the
  designated safeguarding lead is, how and when you must report, what records you keep, and the
  referral pathways that actually exist in your context.

  These are not universal. A policy written for a school is not the one that fits a refugee camp,
  and a referral that is available to a mentee in one setting may not exist in another. This site
  cannot give you that policy — your organisation must, and you must follow it at all times when
  working individually with students. Treat every other move in this bucket as how to hold the
  relationship well within that policy, never as a substitute for it. If you do not yet know your
  policy, that is the first thing to fix, before the next meeting.
agencyContribution:
  indicators:
    - power-over-wellbeing-and-self-direction
  how: >-
    A mentee is only safe to be open when the adult they are opening up to knows exactly what to do
    with what they hear. Safeguarding competence is the ground everything else stands on.
principleAlignment:
  - principle: safe-spaces
    how: >-
      A genuinely safe space is one held by an adult who knows the policy and acts on it — not one
      that merely feels informal and friendly.
relatedSlugs:
  - mentor-notice-and-respond
  - mentor-respond-to-disclosure
sourceRefs:
  - "AMALA Global Secondary Diploma (GSD) Educator Guide / Handbook — Student Mentor Playbook"
provenanceNote: >-
  Built out from the Student Mentor Playbook's minimum requirement to "adhere to the safeguarding
  policy at all times when working individually with students." Deliberately programme- and
  context-agnostic: it points the educator to their own policy rather than prescribing one.
