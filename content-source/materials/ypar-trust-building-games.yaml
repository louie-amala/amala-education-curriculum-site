id: ypar-trust-building-games
slug: ypar-trust-building-games
access: public
type: tools-approaches
title: "Trust-building games that need bodies, and how to judge them"
summary: >-
  Two physical group challenges that build trust quickly, set out with the honest cautions about
  contact, injury and consent that decide whether either belongs in your room.
facilitationContext: [group]
primaryContext: group
toolsFacet: facilitation
deliveryAdaptations:
  - context: group
    how: >-
      Group only, and both need at least eight people. Neither has a version for one learner or for a
      pair, and neither should be attempted in a space with hard edges, steps or a slippery floor.
duration: 10 to 20 minutes each, plus 10 minutes of debrief for all aboard.
grouping: Whole group.
materialsAndPreparation:
  - "All aboard needs something to define a shrinking area: a tarpaulin, a blanket, a rope laid in a circle, or lines chalked on the ground."
  - "Push me pull me needs nothing, and needs a soft, level floor. Read the caution below before deciding to run it at all."
  - "Everything removable off wrists, necks and pockets: watches, rings, phones, pens. Do this before you explain the activity, not after."
  - "You, standing where you can reach the group, not at the front talking."
  - "Your answer to the three questions in [decide about touch before the session](/materials/cf-physical-and-contact-activities), settled in advance."
whatLearnersDo:
  - Solve a physical problem that no individual can solve, in close proximity to each other.
  - Take, or support, another person's weight, in the version that involves it.
  - Discuss what made them willing or unwilling to rely on the group.
educatorContent: |
  Physical trust games do something no discussion achieves: they produce reliance, immediately and
  without anyone agreeing to it in words. That is why they persist in youth work, and it is also
  exactly why they need judging rather than running.

  Read [decide about touch before the session](/materials/cf-physical-and-contact-activities) first.
  This page assumes you have.

  ## All aboard (15 minutes)

  Ask the whole group to fit inside a marked area: a tarpaulin, a blanket, a circle of rope. When
  they manage it, make the area smaller, by folding the tarpaulin or shrinking the rope, and ask
  again. Keep going until they cannot.

  **Variation, tarpaulin flip.** With the group standing on a tarpaulin, challenge them to turn it
  completely over without anyone stepping off. It is harder than it sounds and it produces more
  planning and less shoving than the shrinking version, which makes it the better choice in most
  rooms.

  **What it teaches.** Problem-solving under a physical constraint, and patience: the groups that do
  best are the ones that stop and plan rather than the ones that push. It is also a very clear
  demonstration that the last few centimetres of a problem require everybody's cooperation and cannot
  be solved by whoever is strongest.

  **Cautions.** People end up pressed against each other. Set the stopping point yourself rather than
  letting the group chase the challenge until somebody falls, and stop it at the first sign of anyone
  taking weight on one leg or gripping to stay upright. If contact across gender is not acceptable
  for this group, the tarpaulin flip can be run with each learner keeping their own square of the
  sheet and hands on shoulders only within same-gender pairs, or the activity can be replaced with
  [the team trail](/materials/ypar-team-trail), which is the same kind of collective problem with no
  contact at all.

  ## Push me pull me (10 minutes)

  The group stands in a circle with elbows linked. One person at a time keeps their feet planted and
  leans forward while the people on either side lower them slowly, then raise them back up. The whole
  circle carries the weight.

  **Amala's judgement: run this rarely, and only when you know the group well.** It is included here
  because it is in the source and because it does work, not because we recommend it as a default.
  Three reasons for caution:

  - **Injury.** It is the only activity in the YPAR team-building set where somebody can be dropped.
    It needs a soft floor, firm footing and a facilitator inside the circle rather than outside it.
  - **Consent.** Being lowered by a group of people while unable to protect yourself is an unusually
    high-trust act to ask of a young person in the first weeks of a course, and it is very hard to
    decline in a circle where everyone is watching.
  - **Contact.** Linked elbows and taken weight, across the whole group, in a fixed circle.

  If you do run it: make it voluntary for the person in the middle, name the alternative role first,
  never ask anybody twice, keep it to a few volunteers rather than going round the circle, and stop
  the moment the tone turns to daring.

  ## The question to ask of both

  Does the trust come from the physical risk, or from the problem? If it comes from the problem, as
  in the tarpaulin flip, the activity is doing something you cannot get elsewhere. If it comes from
  the risk, ask what the group actually gains that
  [the team trail](/materials/ypar-team-trail) or [the trust walk](/materials/ypar-trust-walk) would
  not give you more safely.
facilitationNotes: >-
  The one thing to get right is that you are the safety system, not the group. Stand inside the
  activity where you can physically reach people, watch feet and balance rather than faces, and stop
  it early rather than at the point where it goes wrong. The second thing is that the choice not to
  take part has to be offered before the activity is named, and offered as a job rather than as a
  chair at the side. If you cannot arrange both of those, choose a different activity; there are
  several in this bank that cost nothing and risk nothing.
steps:
  - title: "Decide whether to run it at all"
    duration: 5 min
    guidance: >-
      Before the session, answer three questions: is contact across gender acceptable here, can a
      learner decline invisibly, and what does this ask of somebody who has been physically hurt. If
      any answer is uncertain, ask a colleague who knows the community, or choose a non-contact
      alternative. This is a planning decision and it cannot be made in the room.
    keyPrompts:
      - "Who in this group might have a reason not to be touched that I will never be told about?"
    watchOuts:
      - "The decision is deferred to the group with a public question. Asking who objects is not consent, it is exposure."
      - "An activity is kept because it worked with a different cohort. The judgement is per group, not per activity."
  - title: "Clear the space and the bodies"
    duration: 3 min
    guidance: >-
      Check the floor and its surroundings yourself: hard edges, steps, cables, glass. Have everyone
      remove watches, rings, badges, phones and anything in a pocket that could dig in. Do this before
      you explain the activity, so it reads as normal preparation rather than as a warning about what
      is coming.
    keyPrompts:
      - "Watches, rings, anything in your pockets: over there, before we start."
    watchOuts:
      - "The floor is checked but the surroundings are not. Most injuries in these games come from what somebody falls against, not from the floor."
  - title: "Offer the roles before you name the activity"
    duration: 2 min
    guidance: >-
      Say that there are two jobs in the next activity, taking part and watching for safety, and that
      you need at least one watcher. Then describe the activity. Offered in this order, nobody is
      declining anything; they are choosing a role. Offered in the other order, the watcher role is a
      consolation prize and everybody knows it.
    keyPrompts:
      - "Two jobs, both needed. Who wants to be our safety watcher?"
    watchOuts:
      - "The alternative role is invented on the spot for one learner who hesitates. That singles them out precisely as effectively as asking them to explain."
  - title: "Run it, and stop it before the peak"
    duration: 10-15 min
    guidance: >-
      Stand inside the circle or beside the sheet. Watch balance and feet. For all aboard, decide the
      final round yourself rather than letting the group push for one more. For push me pull me, take
      volunteers only, and keep it short. The moment the atmosphere becomes a dare rather than a
      challenge, end it and go to the debrief.
    keyPrompts:
      - "This is the last round. Plan it before you move."
      - "Stop. Everybody stand up straight for a second."
    watchOuts:
      - "The group treats a shrinking area as a competition and starts lifting people. Rule it out explicitly before the second round."
      - "A learner is being physically manoeuvred by others rather than moving themselves. Stop immediately; that is the line."
  - title: "Debrief the reliance, not the achievement"
    duration: 10 min
    guidance: >-
      Ask what made it possible: whose idea worked, and what the group did before it worked. Then ask
      the trust question directly and give it room: what made you willing to rely on the people around
      you, and what would have made you unwilling? Accept an honest negative answer without arguing
      with it. That answer is the most useful thing said all session.
    keyPrompts:
      - "What did this group do before the attempt that worked?"
      - "What made you willing to lean on the people either side of you? What would have made you not?"
    watchOuts:
      - "The debrief celebrates the achievement and skips the reliance. The tarpaulin is not the point."
      - "A learner says they did not trust the group. Thank them, ask what would change it, and do not let the group talk them out of it."
closing: >-
  Ask what the group would want to be true before it tried something harder together. Add anything
  worth keeping to the group's agreements. If your group opted out in numbers, that is information
  rather than failure: it tells you where this cohort actually is, which is worth knowing before you
  plan anything else physical.
learnerContent: |
  This activity uses your body. That means you get to decide about it.

  There are two jobs. One is taking part. The other is being the person who watches for safety and
  stops us if something looks wrong. Both are real jobs and we need both. Choose the one you want.

  You do not have to say why, now or afterwards.

  If you are taking part: take off watches, rings and anything in your pockets. Move slowly. If
  somebody is being pushed or pulled rather than moving themselves, say stop. Anybody can say stop
  and everybody stops.

  Afterwards there is one question worth being honest about: **what would make you willing to rely on
  the people around you?** If the answer today is "nothing yet", say that. It is more useful to this
  group than a polite answer.
agencyContribution:
  indicators: [power-over-wellbeing-and-self-direction]
  how: >-
    The activity is only worth running if the choice to take part is genuinely the learner's, and that
    choice, offered without cost and without explanation, is a more valuable experience for many of
    Amala's learners than the exercise itself. A young person who has been able to decline something
    physical, in public, with no consequence, has learned something about this room that will show up
    later when the work gets personal.
principlesForegrounded: [safe-spaces, collaboration]
principleAlignment:
  - principle: safe-spaces
    how: >-
      The whole page is organised around the conditions under which these games are safe rather than
      around how to run them, because the honest answer is that they are frequently not the right
      choice and a facilitator needs to be able to reach that conclusion.
  - principle: collaboration
    how: >-
      Neither challenge yields to strength or to one person's plan; both require the group to stop,
      think and move together, and the last few centimetres cannot be done any other way.
competencyCodes: [FLC2, ALC2]
competencyDevelopment:
  - code: FLC2
    how: >-
      Relying on other people physically, having chosen to, produces a kind of connection quickly; and
      the group's handling of those who chose not to is a live test of whether it can include people
      on their own terms.
  - code: ALC2
    how: >-
      The groups that succeed are the ones that stop and plan, so the activity rewards deliberate
      collective decision-making over improvisation, visibly and within a few minutes.
