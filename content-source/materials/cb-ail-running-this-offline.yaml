# Facilitator start-here resource for the Agency in Learning component of Learning Bridge+ (Cox's
# Bazar). The AIL part of the Educator Guide went straight from the front matter into Phase 1: unlike
# the Research Project, it had no kit list, no phase-by-phase preparation, and no "how to run this with
# no screen". This is the parity fix. Sibling of cb-rp-running-this-offline. Not a learner sheet.
