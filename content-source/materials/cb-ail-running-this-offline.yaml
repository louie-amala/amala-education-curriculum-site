title: "Running Agency in Learning offline - start here"
summary: >-
  The facilitator's start-here for delivering Agency in Learning with no internet: what is in the pack,
  the kit you need, what to prepare for each phase, how to run it orally and visually, how to hold the
  learning book across stop-start attendance, and the pictures you will need to make.
