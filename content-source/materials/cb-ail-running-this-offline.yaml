- group
primaryContext: group
educatorContent: |
  ## Start here

  This is the first thing to read before you run Agency in Learning. It is a 50-hour component (30 hours
  in-person, 20 hours independent) that runs over at least 10 weeks. Everything runs fully offline. You
  do not need the internet, and you do not need a screen.

  What learners actually do here is one complete cycle of self-directed learning on a real goal of their
  own: understanding themselves as a learner, choosing a goal, planning it, taking steps between
  sessions, using feedback, and looking back at how they grew. Everything else serves that cycle.

  One thing to hold above all others: **the scaffolding never comes down.** What changes across the
  course is whose goal it is, not how much help there is. If a learner flounders, add support - never
  withdraw it as a test.

  ## The offline pack

  You have four things, all editable and printable:

  - The Facilitator Unit Plan and Guide (this pack) - the full plan with every session's guidance.
  - The Student Workbook, "My Learning Book" - the book each learner keeps for the whole component.
  - The picture cards - a PDF on the USB, printed and cut out, one set per group. If you cannot print
    it, every activity tells you how to draw the picture on paper or on the ground instead.
  - This start-here, the safeguarding guide, and the assessment guide (all in this pack).

  ## What you need (kit)

  - One printed My Learning Book per learner, and a few spare blank pages.
  - Pencils, and colours if you have them. Colour is never required to make sense of anything.
  - A wall or floor you can use, kept for the whole course: for the growth path, the strengths sorting,
    the goal ladder, and the "who can help me" map. Big paper or cleared wall space is fine.
  - Cards or cut paper you can move around: for sorting strengths, judging goals thumbs-up or
    thumbs-down, and ordering the steps of a plan.
  - The picture cards, cut out.
  - Something to keep the learning books safe and dry between sessions if learners cannot carry them
    home reliably. This matters more than it sounds - the book is the assessment evidence.

  ## What to prepare, phase by phase

  - **Getting started.** Have the learning books ready so learners can make them their own on day one.
    Prepare the growth-path picture for "Getting better at setting and pursuing goals" - a simple ladder
    or path with five places to stand.
  - **Understand yourself as a learner.** Prepare your own honest story of a time you got better at something hard. You will tell it first. Wall space for the strengths and areas-to-grow sorting.
  - **Set clear, meaningful learning goals.** Prepare four or five example goals on cards, some good and
    some weak, for the thumbs-up/thumbs-down judging. Write them as pictures plus a few words.
  - **Plan and take deliberate steps.** Prepare the picture-clock for the "my time" activity, and a
    blank week grid you can draw large. Have the "who can help me" map space ready on the wall.
  - **Track progress, use feedback, and reflect.** Nothing new to make - but protect the check-in at the
    start of every session, because that is where the between-session work becomes real.
  - **Celebrate and look ahead.** Coordinate with the other two components: the sharing itself happens
    at the one programme showcase, so this phase is looking back, choosing what to share, rehearsing it,
    and deciding who to invite.

  ## Running it with no screen or internet

  - Everything is oral and visual first. You speak; learners draw, mark, point and say. Neat writing is
    never required, and no activity depends on a learner reading.
  - Deliver in the language you share with learners, from the plain-English guide. The guide is written
    to be translated aloud by you, not read out verbatim.
  - The slides are optional. They exist for the minority of sites with a screen and add nothing you
    cannot do with a wall.
  - **How much to print.** One My Learning Book per learner is best - the book carries the teaching and
    the worked examples, and it is what the FSL2 judgement is made from. One book shared between two or
    three learners works, with each learner using an ordinary notebook for their own answers. The floor
    is one copy, displayed or held up, and everyone in notebooks. Say the page title aloud each time so
    a learner's notebook still has a shape you can both follow. What matters is that every learner can
    SEE the teaching, not that every learner owns a copy.

  ## The learning book is the spine - protect it

  The My Learning Book carries the whole component: the Learner Profile, the goal, the plan, the weekly
  steps, the feedback, the growth pages. Three things follow from that.

  1. **Set it up early and come back to it every session.** A book that is opened once a fortnight stops
     being the learner's own.
  2. **It is designed to hold the scaffold when you are not beside someone.** Every page carries a
     worked example and a frame, never a blank box, so a learner can keep going while you are helping
     someone else - or catch up alone after a missed session.
  3. **It is your assessment evidence.** The FSL2 judgement at Week 6 and Week 12 is built from what is
     in this book plus what you saw and heard. A lost book is a real problem; plan where they live.

  ## Stop-start attendance

  Expect it, and design around it rather than against it. A learner who returns after a fire, an
  illness, or a week kept indoors is picking up, not starting again.

  - Re-anchor the goal first: is this still the goal you want? It is fine if it is not.
  - Break the next step down smaller than you think you need to.
  - Point them at the page in their book, not at what the group did - the book is the catch-up mechanism.
  - Treat the return as progress out loud. Adapting a plan when life interrupts it is the actual skill
    this component teaches; say so.

  ## Pictures you will need to make

  None of these needs artistic skill - stick figures and simple shapes are exactly right, and learners
  copy them more readily than polished drawings.

  - A growth path or ladder with five places to stand (for the competency growth path, used twice).
  - A "before / now" pair of figures (for looking back at growth).
  - A step ladder with four or five rungs (for the goal steps).
  - A picture-clock of a day, and a simple week grid (for managing time).
  - A person in the middle with people and things around them (for the help-and-resources map).
  - A set of simple strength pictures - carrying, teaching, fixing, listening, speaking, counting - for
    the strengths activity. The picture cards cover these if you can print them.
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  how: >-
    A facilitator who can run the whole cycle from paper and a wall is a facilitator who never has to
    cut the parts where learners choose. Most of what gets dropped when preparation is thin is exactly
    the learner-led half of the course, so being ready is a protection of learners' agency, not just
    good practice.
