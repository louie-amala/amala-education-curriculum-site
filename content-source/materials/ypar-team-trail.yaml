  basis: >-
    A hidden-path grid is a widely used group problem-solving exercise with no single traceable
    author. Every word here is written from scratch and none of the YPAR Hub's wording is reproduced.
sourceRefs:
  - "YPAR Hub (UC Berkeley), Get Started > Team-Building > Trust-Building lesson plan (Team Trail Activity)"
provenanceNote: >-
  Rewritten from the YPAR Hub's "Team Trail Activity", supplied to Amala in August 2026. The grid, the
  silence rule and the two-line turn structure are the source's. The instruction to draw the route in
  advance, the consistency discipline for the signal, and the debrief's focus on how a group learns
  from public failure rather than on teamwork in general are Amala's.
