learnerContent: |
  ## Who and what can help me

  This page is yours. You can draw, write, or say your answer, someone will write it for you if you
  ask, and nobody marks it right or wrong.

  - Say who you will ask, and what you will ask them for.
  - Name the thing that usually stops you, and the smaller step you will still take.
