# Contextualised, fully offline ANALYSIS activity for the Research Project component of Learning Bridge+
# (Cox's Bazar). One way to analyse the gathered evidence: dig past the surface problem to its root
# cause, using the Five Whys (and, as another way, a simple problem tree). Evaluate evidence phase
# (objective 3). Oral and visual first; drawn, not written; warm and hopeful.
id: cb-rp-root-cause
slug: cb-rp-root-cause
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "Dig for the root cause"
summary: >-
  One way to make sense of what we found: dig past the problem we can see to the real reason underneath
  it, by asking "why?" again and again — the Five Whys. Getting to the root cause means our insights, and
  anything we suggest, deal with the real cause and not just the surface.
facilitationContext:
- group
primaryContext: group
duration: "1.5 hours facilitated + 0.5 hour independent"
grouping: "Whole group to model; pairs or small groups to dig"
whatLearnersDo:
- Take one problem our evidence shows, and ask "why does this happen?" — then ask "why?" of the answer, again and again.
- Draw the chain of whys going downward, until we reach a cause underneath that we cannot easily push past — the root cause.
- Check the root cause against our evidence, and notice that one problem can have more than one root.
materialsAndPreparation:
- The themes and patterns from "Sort and theme what we found" — the problems our evidence surfaced.
- Wall or floor space to draw a chain of "whys" going down (or a tree with its roots).
- The community map and evidence log nearby, to check each "why" against what we found.
facilitationNotes: >-
  The one thing to get right: keep asking "why?" past the first easy answer. Learners (and all of us)
  tend to stop at the surface — "the hills slide because it rains." Model going deeper, gently: why are
  the hills bare, why were the trees cut, why was there no other choice. Each "why" should rest on our
  evidence, not on blame or guessing — this is analysis, not fault-finding, so keep it warm and about the
  hills, never about any person. Five is a guide, not a rule: stop when you reach a cause you cannot
  easily push past. A problem tree (roots = causes, trunk = the problem, branches = what it leads to) is
  another good way to draw the same thinking if your group prefers it.
steps:
- title: "Pick a problem, and ask the first why"
  duration: "20 min"
  guidance: >-
    From our themes, choose one clear problem the evidence shows — for example, "the soil slides down our
    hills when it rains." Write or draw it at the top. Ask the group: why does this happen? Draw the answer
    below it, joined by an arrow.
  keyPrompts:
  - "What problem shall we dig into?"
  - "Why does this happen?"
- title: "Keep asking why, going down"
  duration: "40 min"
  guidance: >-
    Ask "why?" of each answer in turn, drawing the chain downward — about five times, until you reach a
    cause you cannot easily push past. For example: the soil slides → because the hills are bare → because
    the trees were cut → because families needed wood to cook and build → because there was no other fuel
    and many people arrived very fast. Let learners lead once you have modelled it, in pairs or small
    groups, each digging one problem.
  keyPrompts:
  - "And why is that?"
  - "Is that the real cause, or is there something underneath it?"
- title: "Find the root, and check it"
  duration: "30 min"
  guidance: >-
    Name the root cause (or causes — there is often more than one) at the bottom of the chain. Check it
    against our evidence: do our sources and what people told us support it? Keep it hopeful — knowing the
    root cause is what lets us think clearly about what could help.
  keyPrompts:
  - "What is the cause underneath all the others?"
  - "Does our evidence support this root cause?"
learnerContent: |
  ## Dig for the root cause

  The problem we can see is usually not the whole story. Under it is a deeper reason — the root cause. To
  find it, we ask "why?" again and again, digging down like following a tree's roots into the ground.

  Start with a problem our evidence shows. Ask why it happens. Then ask why THAT happens. Keep going —
  about five times — until you reach a cause you cannot easily push past.

  For example:

  - The soil slides down our hills when it rains.
  - Why? The hills are bare.
  - Why? The trees were cut down.
  - Why? Families needed wood to cook and to build shelters.
  - Why? There was no other fuel, and very many people arrived very fast.

  Now we can see a root cause, not just the surface. There is often more than one root. Check each one
  against our evidence — and remember, this is about the hills, never about blaming any person.

educatorContent: |
  ## What you need to know before you teach this

  The Five Whys is a simple tool with one real difficulty: it can slide from analysis into blame within
  about three steps. In this context that matters more than usual, so the guard rails below are not
  optional politeness — they are what makes the tool safe to use here.

  ### What a root cause is

  The surface problem is what you can see. The root cause is the thing that, if it changed, would stop
  the surface problem coming back. Digging a drain treats the symptom; a drain has to be dug again every
  year. Roots holding the slope treat the cause.

  The test for having reached the root: **you cannot easily push past it**, and changing it would change
  everything above it in the chain.

  ### It is not always five

  Five is a rough number, not a rule. Sometimes three whys reach something real; sometimes seven do.
  Learners taught "five whys" will invent a fifth answer to fill the box. Tell them plainly that
  stopping at three with an honest answer beats five with a made-up one.

  ### The blame problem, and how to hold it

  Ask "why?" enough times about deforestation in a camp and the chain will arrive at people: families
  cut the trees. This is where the block can go wrong.

  Two moves keep it safe:

  1. **Keep asking why past the people.** "Families cut the trees" is not a root cause, it is a
     midpoint. Why did they? There was no other fuel. Why? Fuel was not supplied and could not be
     bought. Now you have something structural — and it is both truer and more useful than stopping at
     the family.
  2. **Ask about causes, not culprits.** Say it out loud at the start: *we are asking what caused this,
     not who is at fault.* If a chain reaches a named person or a named group, stop and re-ask the
     question about the situation instead.

  Some learners' own families cut those trees. Some are still cutting them. A block that ends with
  "our families destroyed the hills" has done harm and taught nothing.

  ### Every step must rest on evidence

  The commonest failure is a chain that is pure speculation and looks rigorous because it is drawn as
  arrows. At each "why", ask: *what did we find that tells us this?* If nothing does, mark that link as
  a guess — visibly — and note it as something to find out. A chain with two solid links and an honest
  gap is better research than five confident inventions.

  ## Before they leave this block

  - One chain, drawn, with at least three links.
  - Each link can be traced to a piece of evidence, or is honestly marked as a guess.
  - The chain has been pushed PAST any point where it landed on people.
  - Learners can say what a root cause is, and why treating one is different from treating a symptom.
learnerTeaching:
  title: "How to dig for the root cause"
  readAloud: |
    ## How to dig for the root cause

    Most problems have another problem underneath them. If we only fix the top one, it comes back.

    Think of a weed. If you pull off the leaves, it grows again. If you dig out the root, it does not.
    Our job is to find the root.

    ### Start with what we can see, then ask why

    Take a problem the evidence shows us. Then ask **why?** — and keep asking.

    - **The soil slides down when it rains.**
    - → Why? The hill is bare.
    - → Why? The trees were cut.
    - → Why? Families needed wood to cook.
    - → Why? There was no other fuel they could get.

    Now we have something underneath. Fixing the drain does not stop the slide. Giving families another
    fuel might.

    ### How do we know we have reached the root?

    Two signs:

    - You cannot easily push past it.
    - If that one thing changed, everything above it would change too.

    ### It does not have to be five

    People call this "the five whys", but five is only a guess at how many you might need. Three good
    whys are better than five made-up ones. **If you do not know the next why, stop and say so.**

    ### The most important rule: we ask what, not who

    When you keep asking why, you will reach people. Families cut the trees. That is true.

    **Do not stop there, and do not blame anyone.** Keep asking why. Why did they? Because they needed
    to cook. Why did they use wood? Because there was nothing else. That is the real answer, and it is
    fairer as well as truer.

    We are looking for what caused this, not who is at fault. Some of us have family who cut those
    trees. Some of us still need the wood. This is not about blame — it is about understanding.

    ### Each step needs evidence

    At every "why", ask: **what did WE find that tells us this?**

    If we found something, good. If we are guessing, say so and mark it — a guess is fine as long as we
    know it is a guess. An honest chain with a gap in it is better research than a confident chain we
    made up.
  words:
    - term: root cause
      meaning: the problem underneath the problem — the one that makes it keep coming back
    - term: symptom
      meaning: the part of a problem we can see, on the surface
    - term: chain
      meaning: the line of causes, each one underneath the last
  tryIt:
    intro: >-
      Someone is digging for the root cause of "there is rubbish on the path". Is each step a good next
      step, or a problem? Circle your answer, then check at the back of the book.
    chooseFrom: ["good step", "problem"]
    items:
      - "There is rubbish on the path. → Why? Because people drop it."
      - "Because people drop it. → Why? Because they are lazy and do not care."
      - "Because there is nowhere to put it. → Why? Because there are no bins near the path."
      - "Because there are no bins. → Why? I do not know. We would have to find out."
    answers:
      - "Good step. It is true and it follows from the problem. But it lands on people, so we must keep asking why — do not stop here."
      - "Problem. This is blame, not a cause. \"Lazy\" is a judgement about people, and it is not something we found out. Re-ask it about the situation: why is dropping it the easiest thing to do?"
      - "Good step. It has moved from people to the situation around them, which is where useful answers live."
      - "Good step — and an honest one. Saying \"I do not know, we would have to find out\" is proper research. Mark it as a gap and move on."
    then: >-
      Now do it with one of OUR problems about the hills. Draw the chain going down. Mark any link where
      we are guessing.
