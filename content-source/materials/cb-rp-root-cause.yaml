provenanceNote: >-
  Authored analysis activity for the Learning Bridge+ (Cox's Bazar) Research Project edition, added after
  educator feedback (Kurshed, Anjali) that asked for explicit root-cause analysis. Uses the Five Whys
  (with the problem tree noted as an alternative). One of the analysis methods in the "Evaluate evidence
  and develop insights" phase (objective 3). Fully offline, oral and visual first. Its printable page
  compiles into the Research Project student workbook.
