agencyContribution:
  indicators:
  - control-of-future-pathways
  - power-over-wellbeing-and-self-direction
  how: >-
    Learning to look past a surface problem to its root cause is a way of thinking learners can turn on
    any challenge in their lives — it is what separates treating a symptom from understanding what is
    really going on.
principlesForegrounded: [feedback-and-data, authentic-challenges]
principleAlignment:
- principle: feedback-and-data
  how: Each "why" is checked against the evidence the cohort gathered, so the root cause rests on data, not on assumption or blame.
- principle: authentic-challenges
  how: The problems dug into are the real ones the learners' own evidence surfaced about their own hills.
competencyCodes: [FSI1, FPS3, ATS1]
competencyDevelopment:
- code: FSI1
  how: Digging to the root cause is part of interpreting the evidence to develop actionable insight — the analytical heart of the investigation.
- code: FPS3
  how: The Five Whys is a direct tool for identifying the contributing factors and the cause underneath them.
- code: ATS1
  how: Learners analyse and interpret their gathered data to move from a surface pattern to an underlying cause.
