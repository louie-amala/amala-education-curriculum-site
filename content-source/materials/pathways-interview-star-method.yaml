id: pathways-interview-star-method
slug: pathways-interview-star-method
access: public
type: activity
title: "Preparing for interviews: the STAR method"
summary: Learners use the STAR method to structure interview answers about their experience, practise
  them aloud, and give each other feedback so they feel more confident going into real interviews.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners learn the STAR method and draft answers alone, then swap answers in small
    breakout groups to give each other feedback. The peer review is where confidence is built, since
    hearing how others structure the same story shows there is no single right answer, so protect the
    swap even if you shorten the drafting.
- context: one-to-one-mentoring
  how: >-
    A strong fit. The mentor plays the interviewer, asks a common question, and reflects back where the
    learner's answer already follows STAR and where a step is thin. Because the mentor can push on the
    Result the learner glosses over, the feedback is often sharper than a peer's, so have the learner
    draft answers before the session and spend the time practising aloud.
- context: independent
  how: >-
    Workable for learning the method and drafting answers, weaker for the feedback that improves them.
    If a learner works alone, give them the STAR checklist to self-mark each answer, and ask them to
    record one answer aloud and play it back, or share it with one other person, so they get at least
    one outside read before a real interview.
duration: 40-50 min facilitated, plus the video and journal task
grouping: Individual drafting, then breakout groups of 3-5; works with 10-35 learners
whatLearnersDo:
- Watch or read the STAR method resource and note what each of Situation, Task, Action and Result means.
- Record in the "Preparing for Interviews" section of your Pathways Journal which parts feel easy and which are harder.
- Draft answers to common interview questions using the STAR method.
- Swap answers in a small group and give each other specific feedback on how well each answer works.
- Note what completing the activity taught you about interviews and how you will use it next time.
materialsAndPreparation:
- The "Preparing for an Interview" resource (video and slides), with the transcript printed as a fallback where connectivity is unreliable.
- The Pathways Journal, one per learner, open at the "Preparing for Interviews" section (printed or digital).
- A short list of common interview questions, and a simple STAR checklist (Situation, Task, Action, Result) for drafting and feedback.
- A way for each breakout group to keep notes, and a nominated scribe per group.
facilitationNotes: |
  Interviews are where a learner's real experience either lands or gets lost, and most learners freeze
  or ramble because they have no structure to hang an answer on. STAR gives them one. The one thing to
  get right is that STAR is a scaffold to feel more confident, not the only correct way to answer. Say
  so plainly and keep saying it: an answer does not have to follow STAR exactly to be good. Your job is
  to help each learner tell a clear, honest story about what they did, and to make sure the Result, the
  part learners skip most, is not left off.
steps:
- title: Frame the STAR method as a scaffold, not a rule
  duration: 5-10 min
  guidance: |
    Open by naming the problem STAR solves: in an interview it is easy to ramble or freeze, and a
    simple structure helps you say what you did clearly. Walk through Situation, Task, Action, Result
    with one short example of your own. Stress from the start that STAR is one tool among many, not a
    formula an answer must match exactly.
  keyPrompts:
  - Have you ever known you had a good example but could not get it out clearly under pressure?
  - Which part of an answer do you think interviewers most want to hear, and why?
  - If a great answer does not fit STAR neatly, does that make it a worse answer?
  watchOuts:
  - Learners treat STAR as a rigid script and produce robotic, box-ticking answers; keep repeating that it is a scaffold to organise a real story, and reward answers that are clear and honest over ones that mechanically hit every letter.
  adaptation: |
    No slides or connectivity needed: writing the four STAR words on a board and talking through one
    spoken example of your own is enough to run this step.
- title: Learn STAR and capture each part in the Pathways Journal
  duration: 10-15 min
  guidance: |
    Give learners quiet time to watch or read the "Preparing for an Interview" resource and note, in
    the "Preparing for Interviews" section of their journal, what each of Situation, Task, Action and
    Result means in their own words. Ask them to mark which parts feel easy and which are harder, so
    you can see where the group needs most support before they draft.
  keyPrompts:
  - In your own words, what belongs in the Action step, and how is it different from the Task?
  - Which part of STAR do you find hardest to fill in for your own examples?
  - Was there anything in the resource, beyond STAR itself, that you found useful?
  watchOuts:
  - Connectivity fails and learners cannot watch the video; have the printed transcript ready so no one is stuck waiting, and let learners read at their own pace rather than holding the whole group to the video.
  adaptation: |
    Where devices or bandwidth are limited, use the printed transcript instead of the video. Learners
    can note the four STAR meanings on paper and copy them into the journal later.
- title: Draft STAR answers to common interview questions
  duration: 15-20 min
  guidance: |
    Give each learner a short list of common interview questions and ask them to draft answers using
    STAR, drawing on their own experience, including informal, family and community experience. Circulate
    and prompt learners who are stuck to talk the example out loud first, then write it down. Push gently
    for the Result, the outcome or what they learned, since this is the step learners most often leave off.
  keyPrompts:
  - "Think of a time you handled something difficult: what was the situation, and what were you actually responsible for?"
  - What did you personally do, step by step, not what the group did?
  - What was the result, and if it did not go perfectly, what did you learn from it?
  watchOuts:
  - Learners write only the Situation and stop, so the answer never reaches what they did or achieved; ask each learner to check every answer has all four letters, and single out the Result as the part to double-check.
  adaptation: |
    No devices needed: learners can draft answers by hand against the STAR checklist and type them up
    later. If a learner has few formal examples, help them count experience from home, volunteering and the programme.
- title: Swap answers and give feedback in breakout groups
  duration: 15-20 min
  guidance: |
    Put learners in groups of three to five with a scribe. Each learner reads out one answer; the group
    discusses how far it follows STAR, what works and why, and how it could be stronger. Keep feedback
    specific and kind, about the answer not the person. Remind groups that an answer does not have to
    follow STAR exactly, so "it skips a step but still works" is a valid finding.
  keyPrompts:
  - To what extent does this answer follow STAR, and does it need to follow it exactly to work?
  - What was good about this answer, and why did it land?
  - How could this answer be strengthened, and what specifically would you add or cut?
  watchOuts:
  - Feedback stays vague ("that was good") and nothing improves; model one specific comment yourself first, and ask the scribe to record at least one concrete suggestion for each person's answer.
  adaptation: |
    With thin attendance or in a mentoring setting, the facilitator or mentor plays the reviewer.
    Asynchronously, learners post one answer in a shared space and reply to two others with specific feedback each.
- title: Reflect on what you learned about interviews
  duration: 5 min
  guidance: |
    Close the loop individually. Ask each learner to write in their journal what completing the activity
    taught them about the interview process, and one thing they will do differently in a future
    interview. This turns a practice exercise into a takeaway they own, and gives you a quick read on
    who feels more confident and who still needs support.
  keyPrompts:
  - What did completing this activity teach you about the interview process?
  - How could you use the STAR method, or what you learned from feedback, in a future interview?
  - What is one thing you will practise before your next real interview?
  watchOuts:
  - Learners write a vague "I feel more ready" with no specifics; push for one concrete change, such as a question they will prepare an answer for or the STAR step they will strengthen.
closing: |
  Ask two or three learners to name one thing a peer's feedback changed about their answer, to show the
  group how much they sharpened each other's thinking. Remind learners their STAR answers live in the
  Pathways Journal and are meant to be reused and adapted for every real interview they prepare for.
agencyContribution:
  indicators:
  - control-of-future-pathways
  how: >-
    An interview is often the last gate before a pathway opens, and learners frequently lose good
    opportunities because they cannot show what they have done under pressure. Practising structured,
    confident answers turns the interview from something that happens to a learner into something they
    can prepare for and shape, keeping control of the pathway with them.
principlesForegrounded:
- lifeworthy-competencies
- feedback-and-data
- connect-to-futures
principleAlignment:
- principle: lifeworthy-competencies
  how: >-
    Structuring and telling a clear story about your own experience under pressure is a transferable
    skill learners will reuse for every job, course and funding interview for years, well beyond this
    activity, and the STAR answers they draft are theirs to keep and adapt.
- principle: feedback-and-data
  how: >-
    Answers are deliberately improved through a round of specific peer feedback in the breakout groups,
    where learners judge how far each answer works and name concrete changes, so feedback, not lecturing,
    is what raises the quality of the answers.
- principle: connect-to-futures
  how: >-
    The whole activity rehearses a real, high-stakes moment in accessing a future pathway, so present
    practice is tied directly to the interviews learners will actually sit for education, work or funding.
competencyCodes:
- FLC3
- FSL1
- FPS1
competencyDevelopment:
- code: FLC3
  how: >-
    An interview answer is persuasive communication aimed at convincing a specific audience, and
    practising STAR teaches learners to present what they did so a listener is convinced; the drafted
    answers and the peer feedback on them are the evidence.
- code: FSL1
  how: >-
    Building answers means drawing on their own experiences, including informal and community
    experience they tend to discount, and the closing journal entry on what the activity taught them is
    direct practice in self-reflection.
- code: FPS1
  how: >-
    Learning that STAR is a scaffold to bend rather than a rigid script, and reshaping an answer in
    response to feedback and to different questions, develops adaptable thinking about how to respond
    in the moment.
