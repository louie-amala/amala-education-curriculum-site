id: pathways-networking-and-personal-pitch
slug: pathways-networking-and-personal-pitch
access: public
type: activity
title: Networking and your personal pitch
summary: Learners craft a short personal pitch, saying who they are, what they are looking for and what
  they offer, then learn to build and use networks that open opportunities now and later.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners draft a pitch alone, then deliver it in a small breakout group and take
    feedback. The group is where most of the value sits, because hearing several pitches gives each
    learner lines to borrow and honest feedback on how they come across, so protect the sharing round
    even if you shorten the drafting.
- context: one-to-one-mentoring
  how: >-
    A strong fit for the feedback, weaker for the peer harvest. A mentor plays the listener, gives
    specific feedback on the pitch and delivery, and can open a real introduction from their own
    network. To keep the borrowing of ideas that a group gives, ask the learner to test the pitch on
    one other person before the next session.
- context: independent
  how: >-
    Workable for drafting, weaker for the feedback that makes a pitch land. A learner alone loses the
    live audience, so ask them to record their pitch and get a response from at least one person, even
    asynchronously, and to write down one thing that worked and one to change.
duration: 40-50 min facilitated, plus the journal task
grouping: Individual drafting, then breakout groups of 3-5; works with 10-35 learners
whatLearnersDo:
- Pick or write a networking scenario in the "personal pitch" task in your Pathways Journal.
- Answer the prompts, then write a 30 to 45 second pitch covering who you are, what you want and what you offer.
- Deliver your pitch to a small group and take feedback on the words and the delivery.
- Note what you could borrow from others and how your own pitch comes across.
- Plan one respectful piece of outreach, and record what the task taught you about yourself.
materialsAndPreparation:
- The Pathways Journal, one per learner, open at the "personal pitch" task with its networking scenarios (printed or digital).
- A way for each breakout group to keep notes, and a nominated scribe per group.
- Your own worked pitch, said aloud, to model the three parts and the 30 to 45 second length before learners start.
- A watch, phone or timer so learners can hold each other to length.
facilitationNotes: |
  This activity turns a learner's story into a short pitch, and builds the habit of networking by
  giving value, not only asking. The one thing to get right is reciprocity: learners often think a
  network is a list of people to ask for favours, which feels pushy and rarely works. Keep steering
  them towards what they can offer a connection, so every ask sits inside a two-way relationship. The
  pitch and the delivery both improve most from specific, kind feedback on the real thing, so protect
  the sharing round even when time is tight.
steps:
- title: Frame the pitch and the give-and-take of a network
  duration: 5-10 min
  guidance: |
    Open with what a pitch is for: a short, honest introduction in three parts, who you are, what you
    are looking for, and what you can offer. Say one aloud so the length and shape are concrete. Stress
    that a network is built by being useful to people, not only by asking them for things, so the ask
    never stands alone.
  keyPrompts:
  - Who are you, in one honest line a stranger would remember?
  - What are you looking for right now, and what could you offer in return?
  - When someone helps you, how might you be useful to them later?
  watchOuts:
  - Learners hear "networking" as cold-asking strangers for favours and decide it is not for them; reframe it as offering something useful and building real relationships over time, so the request is one part of a two-way exchange.
  adaptation: |
    No slides or connectivity needed. One pitch spoken aloud by you, with the three parts written on a
    board or a sheet of paper, is enough to run this step.
- title: Draft your 30 to 45 second pitch against a real scenario
  duration: 15-20 min
  guidance: |
    Give learners quiet time to pick or write a networking scenario in the Pathways Journal, answer the
    prompts, then write a pitch of 30 to 45 seconds covering the three parts. Circulate. Where a learner
    is stuck, ask what they want this listener to do next rather than writing the pitch for them.
  keyPrompts:
  - Which scenario is closest to a connection you actually want to make?
  - If the listener remembered one thing about you, what should it be?
  - What is the small, specific ask or offer at the end of your pitch?
  watchOuts:
  - A learner tries to fit their whole life story in and runs well over time; hold them to 30 to 45 seconds and push them to cut to the one thing that matters for this particular listener.
  adaptation: |
    The journal task works on paper; no device is needed to draft or rehearse. Learners can time each
    other with any watch or phone, and type the pitch up later.
- title: Deliver and pressure-test pitches in a small group
  duration: 15-20 min
  guidance: |
    Put learners in groups of three to five with a scribe. Each learner names their scenario, then
    delivers their pitch. Listeners note what landed, what they could borrow, and how the delivery came
    across, including body language and tone on screen if online. Give everyone a turn and keep the
    feedback specific and kind.
  keyPrompts:
  - What did you hear in someone else's pitch that you could adapt for your own?
  - What body language or tone worked well on screen, and what got in the way?
  - What is one change this group would suggest to make your pitch land better?
  watchOuts:
  - Feedback drifts into vague praise such as "that was good" and nothing improves; ask each listener to name one concrete thing that worked and one specific tweak, and have the speaker write the tweak down.
  adaptation: |
    With thin attendance or in a mentoring setting, you play the listener and give the feedback.
    Asynchronously, learners record a short pitch and reply to two peers with one thing that worked and
    one thing to change.
- title: Plan one real, respectful piece of outreach
  duration: 5-10 min
  guidance: |
    Close by turning the pitch into action. Each learner names one person or group to reach out to, how
    they will make contact respectfully, and what value they could offer, not only what they want.
    Capture this in the journal, together with what the task taught them about how they come across.
  keyPrompts:
  - Who is one person or group your pitch could open a door with?
  - How will you reach out respectfully, and what could you offer them?
  - What did completing this task teach you about how you come across?
  watchOuts:
  - Learners plan outreach that is all ask and no offer, or name no one at all; insist on a named contact and at least one genuine way they can be useful, so the relationship starts as a two-way one.
closing: |
  Ask two or three learners to share the one connection they now plan to make and what they will offer
  it. Remind the group that both the pitch and the network live in the Pathways Journal and grow every
  time they are used, so the pitch is a starting draft to keep sharpening, not a script to memorise
  once.
agencyContribution:
  indicators:
  - contribution-to-community
  - control-of-future-pathways
  how: >-
    Building a network by offering value, not only asking, positions a learner as a contributor to the
    community around them rather than a supplicant. A clear pitch and a live network are then how a
    learner actively opens the pathways they want, rather than waiting to be noticed or picked.
principlesForegrounded:
- collaboration
- lifeworthy-competencies
- connect-to-futures
principleAlignment:
- principle: collaboration
  how: >-
    The activity runs on peers pressure-testing each other's pitches and lending lines and ideas, so
    each learner leaves with a stronger pitch than they could have written alone, and the group itself
    models the reciprocity a real network depends on.
- principle: lifeworthy-competencies
  how: >-
    A personal pitch, and the habit of building networks by giving value, are skills a learner reuses
    for every application, job and introduction for years, and the activity ends with a real pitch and
    a real outreach plan they own, not a practice exercise.
- principle: connect-to-futures
  how: >-
    The explicit aim is to build connections that open opportunities now and later, so learners are
    linking who they are today to the people and pathways they want in their future rather than leaving
    that to chance.
competencyCodes:
- FR1
- AR1
- FLC3
- ASL3
competencyDevelopment:
- code: FR1
  how: >-
    Choosing a real networking scenario and naming the specific person or group to approach is direct
    practice in identifying the people and connections that are resources for their own pathway.
- code: AR1
  how: >-
    The activity is about growing a network on purpose, and it closes with a concrete plan to make one
    new connection, which is the act of expanding the resources available to the learner.
- code: FLC3
  how: >-
    Crafting a 30 to 45 second pitch aimed at a specific listener, then refining it on feedback, is
    practice in influential communication so a listener wants to help; the pitch is the evidence.
- code: ASL3
  how: >-
    Planning respectful outreach that offers value and builds a two-way relationship is direct practice
    in leveraging networks and relationships well, rather than treating contacts as one-off asks.
