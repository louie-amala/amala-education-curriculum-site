provenanceNote: >-
  Contextualised, fully offline adaptation of efi-mv-phonics-games-and-dictation and efi-mv-plosive-sounds
  for the Learning Bridge+ (Cox's Bazar) edition. The sources assume learners are literate and use
  dictation and word-building on paper; this version is rebuilt for emergent literacy — oral and visual
  first, no reading or writing required, sound and body only, with picture-words kept in the My Voice book
  as a record. It keeps the sources' short vowels, common consonants, and voiced/voiceless plosive
  contrasts (pat/bat and the like). Objective 1 of the My Voice unit.
