provenanceNote: >-
  Authored for the Learning Bridge+ (Cox's Bazar) Research Project edition. The source-evaluation
  activity for the "Evaluate evidence and develop insights" phase (objective 3). Uses the corroboration-
  led three checks printed on every card of the supplied source pack (cb-rp-secondary-source-pack),
  applied to both primary evidence and the pack. Fully offline, oral and visual first, hands-on. Its
  printable "can we trust it?" sheet compiles into the Research Project student workbook.
