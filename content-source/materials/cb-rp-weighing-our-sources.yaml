# Contextualised, fully offline ANALYSIS activity for the Research Project component of Learning Bridge+
# (Cox's Bazar). Learners meet, in plain terms, how a researcher decides how far to trust a source, and
# apply it to BOTH their primary evidence and the supplied source pack, marking how much weight each
# piece can bear. Evaluate evidence phase (objective 3). Uses the source pack's corroboration-led three
# checks. Oral and visual first; hands-on; warm tone; no learner speaks from their own life.
id: cb-rp-weighing-our-sources
slug: cb-rp-weighing-our-sources
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "Can we trust it? Weighing our sources"
summary: >-
  Learners meet, in plain terms, how a researcher decides how far to trust a piece of evidence - who
  said it, how they know, whether other evidence agrees, and whether they might be mistaken or have a
  reason to shape the story - and use it to weigh both their own primary evidence and the supplied
  source pack, marking how much weight each piece can bear.
facilitationContext:
- group
- independent
primaryContext: group
duration: "2 hours facilitated + 1 hour independent"
grouping: "Whole group to model, then pairs; a short independent think between sessions"
whatLearnersDo:
- Meet the three checks a researcher makes of any source - leading with checking it against others.
- Weigh the sources in the pack - some strong, one weak - and say which can carry more weight.
- "Weigh their own primary evidence too: one person's strong opinion is not the same as a pattern across many."
- Mark, in the research book, how much weight each piece of evidence can bear.
materialsAndPreparation:
- The supplied secondary source pack (cb-rp-secondary-source-pack) and its printed "Can we trust it?" cards.
- The evidence log from earlier in the course, with what learners have gathered so far.
- The "can we trust it?" sheet from the research book (one per learner).
- A floor or wall where cards can be placed along a line from "trust more" to "trust less".
visuals:
- kind: setup
  title: "A trust line on the floor"
  caption: >-
    Make a line from ‘trust more’ at one end to ‘trust less’ at the other. In pairs, learners make the
    three checks and place each source along it, saying why. It fills up as you go.
  spec:
    type: zones
    zones:
    - label: "Trust more"
      tone: positive
      cards: []
    - label: "Trust less"
      tone: warn
      cards: []
- kind: example
  title: "The line, weighed"
  caption: >-
    There is no single right order - the reasons are the point. The strongest evidence is what many
    sources AND our own research agree on.
  spec:
    type: zones
    zones:
    - label: "Trust more"
      tone: positive
      cards:
      - "what many people said"
      - "what we saw ourselves"
      - "the science article"
      - "the UN report"
    - label: "Trust less"
      tone: warn
      cards:
      - "a company selling trees"
      - "one person's opinion"
facilitationNotes: >-
  The one thing to get right is that trust is not yes-or-no - it is how much weight a piece of evidence
  can carry, and the way to judge that is to check a source against others, not just to study it on its
  own. Keep it plain and hands-on: the three checks, then a line on the floor from "trust more" to
  "trust less", and learners place each source along it and say why. Lead with the third check - does it
  agree with the other sources and with what we found? - because checking a source against others is the
  habit that matters most (and the one we can do offline). Use the pack's built-in weak source (the
  company's website) so the judging has something real to bite on. When you turn to the learners' own
  primary evidence, keep it warm and general - no learner has to speak from their own life; weigh "what
  one person told us" and "what many people said" as examples, not anyone's story.
steps:
- title: "Three checks a researcher makes"
  duration: "30 min"
  guidance: >-
    Introduce, in plain terms, the three checks we make of any piece of evidence. One: who made it, and
    why - could they have a reason to tell the story one way (a company selling trees wants trees to
    sound good)? Two: how do they know - do they show it (numbers, named people, a study), and is it
    still true? Three, the big one: does it agree with the OTHER sources, and with what we found by
    asking and looking ourselves? A good researcher does not just study one source on its own - they
    check it against others. These are the signals printed on the "Can we trust it?" card in our pack.
  keyPrompts:
  - "Who made this, and could they have a reason to tell it one way?"
  - "Do they show how they know - and is it still true?"
  - "Does it agree with the other sources, and with what we found ourselves?"
- title: "Weigh the source pack on a line"
  duration: "45 min"
  guidance: >-
    Make a line on the floor or wall, from "trust more" at one end to "trust less" at the other. In
    pairs, learners take a source from the pack, make the three checks, and place it on the line, saying
    why. Draw out why the company's website sits low (it sells trees and shows no proof) and why
    the science and the UN sources sit higher. There is no single right order - the reasons are the point.
  keyPrompts:
  - "Why does this source sit here and not further along?"
  - "Which source would you trust most for our question, and why?"
- title: "Weigh our own evidence too"
  duration: "30 min"
  guidance: >-
    Turn to the primary evidence the group gathered. Weigh it the same way, using general examples: one
    person's strong opinion is not the same as a pattern many people described; something we saw with our
    own eyes on the hills carries real weight. Keep it general and warm - we are weighing kinds of
    evidence, not anyone's personal story.
  keyPrompts:
  - "Did many people say this, or just one?"
  - "Did we see it ourselves, or were we told it?"
- title: "Mark how much weight each piece can bear"
  duration: "15 min"
  guidance: >-
    Learners go back to their evidence log and, on the "can we trust it?" sheet, mark for each piece how
    much weight it can bear - a lot, some, or a little - with a word or a mark. This protects us later
    from building an insight on a single shaky claim.
learnerContent: |
  ## How much can we trust it?

  Not every piece of evidence is equal. Some we can lean on hard; some we should treat with care. A
  researcher does not just ask "is this true or false?" - they ask "how much weight can this carry?"

  For every source, and for everything people told us, make three checks:

  - Who made it, and why? Could they have a reason to tell the story one way? (A company selling trees
    wants trees to sound good.)
  - How do they know - and is it still true? Do they show where their facts come from - numbers, named
    people, a study - or do they just say it?
  - Does it hold up? Does it agree with the OTHER sources, and with what WE found by asking and looking?

  The third check matters most. One source on its own - even a good one - is only a start. One person's
  strong opinion is not the same as a pattern many people described; something we saw ourselves on the
  hills carries real weight. The strongest evidence is what many sources AND our own research agree on.

  We do this for the source pack and for our own evidence, then mark how much weight each piece can bear -
  so we build our findings on evidence we can trust, not on a single shaky claim.

educatorContent: |
  ## What you need to know before you teach this

  Learners arrive believing that a source is either true or false, and that anything printed, official,
  or said by an older person is true. This block replaces that with something more useful: **how much
  weight can this piece bear?** Not true or false - how much can we build on it.

  ### The three checks, and why they are these three

  1. **Who said it, and how do they know?** The difference between someone who SAW something and someone
     who HEARD about it is the single most useful distinction in the whole block. A person who watched
     the slope come down is strong evidence about that slope. A person repeating what a neighbour said is
     weak evidence about anything.
  2. **Do they have a reason to shape the story?** Not "are they lying" - almost nobody is. But an
     organisation reporting on its own project has a reason to tell the good half. Source D in the pack is a company selling tree-planting. It is in there on purpose so learners have something real to
     practise on. Teach this without cynicism: an interested source is one you check against another, not a worthless one.
  3. **Does anything else agree?** This is the strongest check and the one learners forget. One source
     saying a thing is a claim. Two independent sources saying it, plus what we saw ourselves, is close
     to knowledge. The word for this is triangulation, and it is worth naming.

  ### Watch for "official" being read as "strong"

  Learners will rank an agency report above their grandmother every time. Sometimes right, often not.
  The grandmother who watched the hill for forty years is a primary source with direct observation; the
  report may be repeating a number from somewhere else. Make this exact comparison out loud - it is the
  moment the idea lands, and it also tells learners their own community's knowledge counts.

  ### Watch for the opposite problem

  Having taught scepticism, some learners will decide nothing can be trusted. Head this off: the point of
  weighing is to know how much to lean on something, not to reject everything. A weak source can still
  tell you what question to ask next.

  ### Old is not automatically wrong

  A 2021 study of how roots hold soil has not expired. A 2019 count of how many trees are standing has.
  Teach the distinction: does this kind of fact go out of date?

  ## Before they leave this block

  - Every learner can say the three checks in their own words, without the page.
  - The source pack has been ranked on a line, and learners can defend where they put each one.
  - Their own interview evidence has been weighed too, not just the pack - this is the half that gets
    skipped.
  - At least one learner has said "but does anything else agree with it?" without being prompted.
learnerTeaching:
  title: "How to weigh a source"
  readAloud: |
    ## How to weigh a source

    Not everything we are told is equally strong. A researcher does not ask "is this true or false?"
    A researcher asks: **how much weight can this carry?**

    Think of a bridge. Some planks can carry a person. Some can carry only a bird. You need to know
    which is which before you step on it.

    ### Check 1 - Who said it, and how do they know?

    Ask how the person knows.

    - **They saw it themselves.** Strong. "I watched the mud come down in the night."
    - **Someone told them.** Weaker. "My neighbour said the mud came down."
    - **They studied it carefully.** Strong, if they say how. "We measured this hill for two years."

    Someone who SAW is stronger than someone who HEARD.

    ### Check 2 - Do they have a reason to tell it one way?

    This is not asking whether someone is lying. Most people are not.

    But if a company sells trees, it will tell you the good things about trees. If an organisation
    reports on its own work, it will tell you the parts that went well. That does not make them useless -
    it means we check them against someone else.

    ### Check 3 - Does anything else agree?

    This is the strongest check of all.

    - One source says it → it is a claim.
    - Two sources that do not know each other say it → it is much stronger.
    - Two sources AND what we saw with our own eyes → now we can build on it.

    ### Careful: official does not always mean strong

    A printed report is not automatically stronger than your grandmother. If she watched that hill for
    forty years, she SAW it. The report may just be repeating a number from somewhere else.

    Ask the same three questions of both.

    ### And careful the other way

    Weighing does not mean trusting nothing. A weak source can still be useful - it can show us what to
    ask about next. We are working out how hard to lean on something, not throwing it away.
  words:
    - term: weigh
      meaning: to work out how much we can trust something, and how much to lean on it
    - term: source
      meaning: anywhere our information comes from - a person, a book, a report, what we saw
    - term: agree
      meaning: when two different sources say the same thing
  tryIt:
    intro: >-
      How much weight can each of these carry? Circle strong, medium, or weak - and be ready to say why.
      Then check at the back of the book.
    chooseFrom: ["strong", "medium", "weak"]
    items:
      - "An old woman who has lived on this hill since before the camps: \"there were big trees all the way up. I watched them go.\""
      - "A tree-planting company's website: \"trees stop erosion completely.\""
      - "A study by four scientists who measured the temperature of cut and uncut land for two years, and say who paid for it."
      - "A boy in our group: \"my cousin said the whole hill is going to come down next monsoon.\""
    answers:
      - "Strong. She saw it herself, over a long time, and she has no reason to shape the story. This is exactly the kind of evidence people wrongly ignore because it is not printed."
      - "Weak. They are selling trees, so they tell the good half - and \"completely\" is a warning sign. Useful for finding out what to check, not for building on."
      - "Strong. They measured it, they say how, and they say who paid - which lets us judge for ourselves. Saying how you know is what makes a source strong."
      - "Weak. He heard it from someone who heard it. Nobody saw it, and it is about the future, which nobody can see. Worth asking about - not worth building on."
    then: >-
      Now take one piece of evidence WE gathered and run the three checks on it. Be honest, even if it
      is your own.
