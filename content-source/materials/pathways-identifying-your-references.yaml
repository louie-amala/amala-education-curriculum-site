id: pathways-identifying-your-references
slug: pathways-identifying-your-references
access: public
type: activity
title: Identifying your references
summary: Learners identify people who can vouch for their capabilities, work out who fits which
  opportunity, and learn to ask well and give a referee what they need to write a strong reference.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners identify their references alone first, then compare in small breakout groups.
    The sharing step earns its place because hearing who others chose, and why, prompts learners to
    think of people they overlooked and to reconsider whether a referee actually fits the opportunity
    they have in mind.
- context: one-to-one-mentoring
  how: >-
    A strong fit. The learner lists candidate references and a mentor helps stress-test the choices,
    asking who can speak to which capability and who fits which opportunity. The mentor should push
    the learner to name real people rather than approving a thin or purely formal list.
- context: independent
  how: >-
    Workable, but the learner loses the peer prompt that surfaces forgotten referees. If a learner
    works alone, give them the criteria for a strong reference and ask them to talk their three
    choices through with at least one other person, even asynchronously, before they approach anyone.
duration: 25-35 min facilitated, plus the journal task
grouping: Individual work, then breakout groups of 3-5; works with 10-35 learners
whatLearnersDo:
- Learn what a reference is and who can act as one, including teachers, mentors, employers and community figures.
- Identify three potential references and record them in the reference table in your Pathways Journal.
- Match each reference to the opportunity and capability they are best placed to speak to.
- Plan how you will ask each person politely and what you will give them so they can write a strong reference.
- Share your reflections in a breakout group and agree your next steps for organising your references.
materialsAndPreparation:
- The Pathways Journal, one per learner, open at the reference table (printed or digital).
- The short reference explainer video, or your own worked walkthrough if you prefer to lead it live.
- A way for each breakout group to keep notes, and a nominated scribe per group.
- "[to verify] What a reference is called and how it is used varies by country and sector (referee, recommender, character versus professional reference). Check the norms for the pathways your learners are actually applying to and tell them plainly."
facilitationNotes: |
  A reference is often the part of an application a learner has least control over, so this activity is
  about making it deliberate rather than last-minute. The one thing to get right is that a good
  reference is chosen for fit, not just availability: the best referee is someone who can speak
  specifically to the capability a given opportunity asks for. Learners often default to whoever is
  easiest to reach. Your main job is to help them match real people to real opportunities, and to ask
  well, since a referee approached politely and briefed properly writes a far stronger reference.
steps:
- title: Explain what a reference is and who can be one
  duration: 5-8 min
  guidance: |
    Open by making the idea concrete: a reference is someone who vouches for what a learner can do,
    to a provider who has never met them. Show the explainer video or walk it through yourself. Widen
    the pool deliberately, teachers, mentors, employers, volunteering coordinators and community
    figures all count, so learners do not assume they need a formal professional referee they do not
    yet have.
  keyPrompts:
  - Who has seen you do something well, and could tell someone else about it honestly?
  - What is the difference between someone who likes you and someone who can speak to your capabilities?
  - Does a reference always have to be a former employer?
  watchOuts:
  - Learners assume they have no one to ask because they have little formal work history; point them to teachers, mentors, volunteering leads and community members who have seen them act responsibly, and treat those as legitimate referees.
  adaptation: |
    With no way to play the video, your own spoken walkthrough of what a reference is and who counts
    is enough. The step needs no device.
- title: Identify three potential references in your journal
  duration: 6-8 min
  guidance: |
    Give learners quiet time to complete the reference table in their Pathways Journal, naming three
    potential references and, for each, how they know the person and what that person could speak to.
    Circulate quietly. Where a learner is stuck, ask about who they have worked or studied alongside
    rather than suggesting names for them.
  keyPrompts:
  - Who are three people who have seen you at your best, in study, work or your community?
  - For each person, what specifically could they say about you that a provider would trust?
  - Do you have current contact details for each of them, and if not, how could you get them?
  watchOuts:
  - A learner lists three people who all speak to the same thing, such as three classmates; prompt them to spread the choices so their references cover a range of capabilities rather than repeating one.
  adaptation: |
    If the journal is not available digitally, learners complete the same three-row table on paper and
    copy it into the journal later. No connectivity is required.
- title: Match each reference to the opportunity they fit
  duration: 6-8 min
  guidance: |
    Move from a general list to deliberate matching. For each opportunity a learner is aiming at, ask
    which of their three references is best placed to speak to what that opportunity asks for. A
    teacher may fit a university application, an employer a job. This is where a formal list becomes a
    strategy, and where learners often realise they need one more referee.
  keyPrompts:
  - For the opportunity you most want, which of your references can speak most directly to what it asks for?
  - Is there a capability an opportunity needs that none of your current references can vouch for?
  - Which reference would you use for a job, and which for further study, and why?
  watchOuts:
  - A learner plans to send the same referee to every application regardless of fit; have them line each reference up against a specific opportunity so mismatches, and gaps, become visible before they apply.
- title: Plan a polite ask and what you will give your referee
  duration: 5-8 min
  guidance: |
    A reference is only as strong as the ask behind it. Have learners draft how they will approach
    each person: asking permission first, giving enough notice, and offering the information a referee
    needs, the opportunity, the deadline, and a reminder of relevant things they have done together.
    Model one polite ask aloud so the register is clear.
  keyPrompts:
  - How will you ask this person so it is easy for them to say yes, and easy to say no if they cannot?
  - What information does your referee need from you to write something specific rather than generic?
  - How much notice is fair to give someone before a reference deadline?
  watchOuts:
  - Learners plan to ask at the last minute with no context, which produces thin, generic references; have them commit to asking early and sending each referee the opportunity details and a short reminder of what they did together.
- title: Reflect and agree your next steps
  duration: 4-6 min
  guidance: |
    Close in breakout groups with a nominated scribe. Each learner shares one reflection from the
    exercise and the group discusses next steps for organising and approaching their references. This
    turns a private list into committed action and lets learners hear approaches they had not
    considered.
  keyPrompts:
  - What is one thing completing this exercise changed about who you will ask, or how?
  - What is your first next step in organising your references, and when will you take it?
  - Whose reference will you request first, and what will you send them?
  watchOuts:
  - Groups drift into general chat and no one leaves with an action; give a clear round-robin ("each person names one next step before anyone responds") and ask the scribe to record a next step for every member.
closing: |
  Ask two or three learners to name the referee they will approach first and what makes that person a
  strong fit. Remind everyone their reference table lives in the Pathways Journal and should be kept
  current: a reference is a relationship to maintain, not a name to use once and forget.
agencyContribution:
  indicators:
  - contribution-to-community
  - control-of-future-pathways
  how: >-
    Choosing and approaching your own references, and offering a referee what they need, turns a part
    of applications that usually feels outside a learner's control into something they actively manage.
    Asking well, and staying worth vouching for, also strengthens the learner's standing in the
    networks and community they draw on.
principlesForegrounded:
- collaboration
- lifeworthy-competencies
- connect-to-futures
principleAlignment:
- principle: collaboration
  how: >-
    A reference is a collaborative act: the learner depends on others to vouch for them, and the
    activity has learners choose those people deliberately and ask in a way that makes it easy to say
    yes, treating their network as a shared resource rather than a list of contacts.
- principle: lifeworthy-competencies
  how: >-
    Knowing who to ask for a reference, and how to ask so people say yes and represent you well, is a
    transferable skill learners will reuse for every job, course and funding application for years, not
    a one-off exercise.
- principle: connect-to-futures
  how: >-
    Learners match each reference to a specific opportunity they are aiming at, which links a present
    relationship directly to the future pathway it can help unlock rather than collecting referees in
    the abstract.
competencyCodes:
- FR1
- FLC3
competencyDevelopment:
- code: FR1
  how: >-
    Identifying three references and matching each to the opportunity they fit is direct practice in
    recognising the people and support around them as resources that advance their pathways; the
    completed reference table is the evidence.
- code: FLC3
  how: >-
    Planning how to ask a referee politely, with enough notice and the right information, is influential
    communication aimed at a specific person, so the request is more likely to succeed and the resulting
    reference is stronger.
