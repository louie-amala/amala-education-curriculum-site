sourceRefs:
  - "AMALA Global Secondary Diploma (GSD) Educator Guide / Handbook — Course Facilitator Playbook (Assessment)"
provenanceNote: >-
  Generalised from the Playbook's "Portfolio Defense Presentation" and "Viva Voce" methods (select
  criteria, coach beforehand, share questions, invite significant adults, harder to fake, good for
  verbal learners).
