  Authored analysis activity for the Learning Bridge+ (Cox's Bazar) Research Project edition, added at the
  request for an activity examining who/what has agency in the problem, what beliefs and attitudes shape
  it, and who benefits or suffers. A critical/systems lens for the "Evaluate evidence and develop insights"
