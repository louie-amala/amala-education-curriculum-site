id: cf-communicate-quality
slug: cf-communicate-quality
access: public
type: educator-move
title: "Show quality, don't just describe it"
summary: >-
  Rubrics can only say so much. Use samples of work and learner-built success criteria to develop a
  shared, felt sense of what good looks like.
tags:
  - id: learning-design
    how: >-
      When designing, gather anonymous work samples of varying quality and plan how learners will build
      their own success criteria from them.
  - id: learning-facilitation
    how: >-
      When facilitating, have learners rank the samples, construct criteria, and self-assess before
      handing work in. Using where they disagree to open a dialogue about what quality really is.
  - id: feedback
  - id: reflection-self-assessment
facilitationContext:
  - group
primaryContext: group
educatorContent: |
  Some things about quality cannot be written down. Rather than relying on a rubric alone, communicate
  quality by showing it: share anonymous samples of work of varying quality and have learners rank and
  discuss them, people are often better at spotting strengths and weaknesses in others' work than in
  their own. Then push further: get learners to construct their own success criteria by comparing
  those samples, and to self-assess against them before handing work to you.

  Watch a trap: choose examples where the deep features (what really makes the work good) are not
  aligned with surface features (length, neatness), or learners will "succeed" by reading the wrong
  signal. Rubrics still help lay out criteria, use them, but keep them general enough to apply across
  tasks, and use them to open a dialogue ("here is where I would have scored it differently, why?")
  rather than to close one.
agencyContribution:
  indicators:
    - power-over-wellbeing-and-self-direction
  how: >-
    Learners who build and apply their own sense of quality can judge and improve their own work,
    rather than waiting for a verdict from the educator.
principleAlignment:
  - principle: feedback-and-data
    how: >-
      Comparing work samples and self-assessing against criteria turns quality into shared data
      learners can act on.
  - principle: collaboration
    how: >-
      Co-constructing success criteria makes quality something built with learners, not handed to
      them.
relatedSlugs:
  - cf-learning-intentions-success-criteria
sourceRefs:
  - "AMALA Global Secondary Diploma (GSD) Educator Guide / Handbook. Course Facilitator Playbook"
provenanceNote: >-
