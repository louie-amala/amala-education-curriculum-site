# Student worksheet for cb-mv-words-about-me. A thin resource: the learner-facing page the activity refers
# to, with four labelled draw boxes for words about the learner's own life. Home and family can touch
# displacement, so a lighter focus is always offered. Its printable form is one page of the Student My Voice
# book (workbook).
