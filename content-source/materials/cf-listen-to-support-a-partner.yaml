id: cf-listen-to-support-a-partner
slug: cf-listen-to-support-a-partner
access: public
type: educator-move
title: "Listen to support a learning partner"
summary: >-
  Supporting a colleague's thinking is a skill. Set your own interest aside and use three moves —
  pausing, paraphrasing, and clarifying questions.
tags:
  - id: improving-practice
educatorContent: |
  When you support a colleague's thinking — as a learning partner, coach or critical friend — the
  instinct is to listen for yourself: to make a connection, satisfy curiosity, or offer a solution.
  Supporting someone else's thinking means setting that aside ("this isn't about me; it's not my role
  to solve it") and listening to understand. Three skills carry it.

  Pausing: using wait time — before, and after, you or they speak — creates space for better thinking,
  even if the silence feels awkward at first. Paraphrasing: restate the essence of what you heard,
  tone included, shorter than the original and using "you", to show you are listening and to check you
  have understood — you can acknowledge ("you're frustrated because…"), organise ("so there are three
  issues…"), or move up to the bigger idea ("so a value you hold is…"). Clarifying questions: ask only
  questions that help their thinking, not your curiosity. Used together, these help a colleague think
  their own way forward — the same coaching stance a mentor uses with a learner.
agencyContribution:
  indicators:
    - power-over-wellbeing-and-self-direction
  how: >-
    Educators who coach each other's thinking keep improving the facilitation learners depend on — and
    model the very listening that lets learners think for themselves.
principleAlignment:
  - principle: collaboration
    how: >-
      Pausing, paraphrasing and clarifying are how colleagues genuinely think together rather than
      trade advice.
  - principle: feedback-and-data
    how: >-
      Listening to understand, rather than to judge, treats a partner's reflection as data for their
      own next step.
