provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, a low-bandwidth
  adaptation, delivery-mode notes and a sensitivity note) from the Design Challenge activity guide,
  which supplied the purpose, the reflection sentences and the connect-challenge-extend discussion. The
  source Design Challenge investigates the mental health and wellbeing of Afghan females; this material
  is written to generalise to any context, so localise the definitions and examples to the community
  you are working with. Linked to Research Project objective 1 and Social Entrepreneurship objective 1.
