rights:
  status: own-expression
  holder: "School of Unity and Liberation (SOUL), by way of San Francisco Peer Resources and the UC Berkeley YPAR Hub"
  basis: >-
    A seven-part taxonomy of coping strategies is an idea rather than an expression. Every word here,
    including all seven descriptions and the scenario, is written from scratch, and the originating
    organisation is credited and linked.
  note: >-
    The framing that six of these are survival rather than failure is a deliberate Amala addition and the
    condition on which this material is publishable at all. Do not edit it out. Do not restore the
    source's scenario, which is specific to a United States city.
sourceRefs:
  - "YPAR Hub (UC Berkeley), Get Started > Community Support > Barriers to Working Together lesson plan"
  - "Credited in that plan to the SOUL Curriculum and San Francisco Peer Resources"
provenanceNote: >-
  Rewritten from the YPAR Hub's "Barriers to Working Together", supplied to Amala in August 2026. The
  seven strategies and the performance structure are SOUL's by way of that plan. The scenario is replaced
  entirely; the source's is set in San Francisco and turns on policing and minimum-wage work there. The
  insistence that six of the seven are survival rather than failure, the reframing of the central question
  from why people do not combine to what makes combining hard, the acknowledgement that the risk is
  sometimes real, and the judgement about whether to run the material at all are Amala's.
