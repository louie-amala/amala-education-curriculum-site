id: ypar-coping-with-hard-conditions
slug: ypar-coping-with-hard-conditions
access: public
type: tools-approaches
title: "Seven ways people cope, and only one that changes anything"
summary: >-
  A frame naming the strategies people use to survive conditions they did not choose, used to explain
  why getting together is hard rather than to judge anyone for not doing it.
facilitationContext: [group, one-to-one-mentoring]
primaryContext: group
toolsFacet: analytical
deliveryAdaptations:
  - context: group
    how: >-
      As designed, with small groups performing a strategy each and the whole group naming what they
      saw. The performances matter: a strategy acted out is recognised, where a strategy described is
      agreed with and forgotten.
  - context: one-to-one-mentoring
    how: >-
      Use it carefully and rarely in mentoring, and only where a learner has already named their own
      withdrawal or anger as something they want to talk about. The frame can give a name to what they
      are doing; it must never be used to tell them what they are doing.
duration: 75 to 90 minutes with performances. 40 minutes as a discussion.
grouping: Seven small groups, or fewer groups covering several strategies each.
materialsAndPreparation:
  - "The seven strategies written up, one per group, and space for the performances."
  - "A scenario for the closing analysis. Write one for your own setting, or use the one below."
  - "A board for the strategies and what the group notices about each."
  - "A clear decision about whether this group is ready for it. See the caution below."
whatLearnersDo:
  - Perform and recognise seven ways people cope with conditions they cannot easily change.
  - Work out what each costs, and who benefits from people using it.
  - Analyse a scenario and identify which strategies the person in it is using.
  - Discuss what stops people combining, and what would make it possible.
educatorContent: |
  ## The seven

  Written in the second person because that is how they are recognised.

  1. **Get ahead.** Work hard, succeed, rise. Often this means competing with people in the same
     position as you, and arriving somewhere isolated.
  2. **Get by.** Do the minimum. Tell me what to do and I will do it. Wait for the end of the day, the
     week, the year.
  3. **Get over.** Pursue the same goals by routes that are closed off officially, because the official
     ones are closed to you.
  4. **Get around.** Do not confront the obstacle; work through connections, charm, or whatever
     leverage you can find.
  5. **Get out.** Withdraw. Leave school, leave the family, leave emotionally, or find something that
     stops you thinking about it.
  6. **Get back.** Direct the anger at somebody. Usually not at whoever caused it, but at whoever is
     nearby and available to blame.
  7. **Get together.** Combine with the people in the same position and act collectively.

  Only the last one changes the conditions. All seven are rational responses to being stuck in them.

  ## The framing that makes this usable

  This is not a list of good and bad people, and if it is taught that way it does real damage in a room
  full of young people who are surviving hard circumstances. Six of the seven are survival, and most
  people use several, and the same person will use different ones in different parts of their life.

  The honest claim is narrow: **six of these get a person through, and one of them changes what they are
  getting through.** Notice that even that is not an instruction, because getting together requires
  other people, time and some safety, and a person who has none of those is not failing by using
  something else.

  ## The question that carries it

  Not "why do people not get together?" but **"what makes getting together hard?"** The first invites
  learners to judge their neighbours. The second produces an accurate list: risk, exhaustion, not
  knowing who else feels the same, past attempts that failed, the cost of being visible, and a genuine
  fear of consequences that may be entirely warranted.

  In several of the settings Amala works in, the answer includes real danger. Do not talk the group out
  of that. A frame that pretends collective action is safe everywhere is a frame learners will correctly
  ignore.

  ## Whether to run it at all

  This material touches oppression, hopelessness, addiction and violence, and it asks learners to
  perform them. Judge before you run it:

  - Is the group established, with agreements in use?
  - Is anyone in it currently in the middle of one of these, in a way that performing it would expose?
  - Do you have somewhere to refer someone afterwards?

  If the answers are not comfortable, run the discussion without the performances, or do not run it.
  [Five ways to make change](/materials/ypar-ways-to-make-change) covers adjacent ground with far less
  personal exposure and is the better choice for many groups.

  ## Handling the performances

  Assign strategies rather than letting groups choose, so nobody selects the one they are living. Ask
  for a situation, not a character study. And say at the start that anybody may direct rather than
  perform, offered as a role before the strategies are handed out.

  ## Closing

  End on what could be built rather than on the analysis. The source's last move is a good one: after
  discussing what stops people combining, the group makes something together, a poem, a song, a drawing,
  a piece of music, that shows what getting together looks like. Ending on making rather than on
  diagnosis matters in a session that has spent an hour on constraint.
learnerContent: |
  People are not stupid, and they are not weak. When you are stuck in conditions you did not choose and
  cannot easily change, you do something to get through. There are about seven of these.

  1. **Get ahead.** Work hard, climb, succeed. Sometimes by competing with people in the same position
     as you, and sometimes you arrive at the top alone.
  2. **Get by.** Do the minimum. Get to the end of the day.
  3. **Get over.** Go after the same things by routes that are not officially open, because the official
     ones were not open to you either.
  4. **Get around.** Do not fight the obstacle. Go via people, connections, charm, whatever works.
  5. **Get out.** Leave. School, home, the situation. Or leave in your head, and find something that
     stops you thinking.
  6. **Get back.** Get angry at somebody. Usually somebody near you, rather than whoever actually caused
     it.
  7. **Get together.** Join with the people in the same position and act together.

  Six of these get you through. **One of them changes what you are getting through.**

  That is not the same as saying the first six are wrong. They are what people do to survive, and most
  people use several. You probably use several.

  The question is not why don't people just get together. It is: **what makes getting together hard?**

  Be honest about that. Sometimes it is exhaustion. Sometimes it is not knowing who else feels the same.
  Sometimes people tried before and it failed. And sometimes it is genuinely dangerous, and nobody
  should pretend otherwise.

  You can direct rather than perform, and you do not have to say why.

  ## A situation to work with

  *This is invented.*

  Nadia is seventeen. Her mother is unwell and cannot work, so Nadia has taken a job in a workshop that
  runs from mid-afternoon until late. The pay is low and irregular and there is no one to complain to
  about that. She used to attend classes in the mornings but she is now too tired to follow them, and
  she has missed enough that catching up feels impossible. Two of her friends have stopped speaking to
  her since she took the job. She has started to think that people who talk about education have no idea
  what her life is actually like.

  - What obstacles is Nadia facing? Which of them are about her, and which are about how things are
    arranged around her?
  - How does all this affect how she feels about herself?
  - How does it affect how she feels about other people in her community?
  - Which of the seven strategies is she using? Is she reacting, or choosing?
  - What would have to be true for the seventh one to be possible for her?
facilitationNotes: >-
  The one thing to get right is that six of these are survival, not failure. In a room of young people
  managing hard circumstances, a frame taught as good and bad coping does harm, and they will disengage
  from it, correctly. Ask what makes getting together hard rather than why people do not do it, and let
  the answer include real danger where that is true. Judge before running it whether this group is
  established enough, assign strategies rather than letting groups choose, offer a directing role before
  the performances, and know where you would refer someone afterwards.
steps:
  - title: "Ask what people around here are dealing with"
    duration: 10 min
    guidance: >-
      Open with private writing rather than discussion: what is hard here, for people you know? Then take
      a few offered answers without pressing anyone. Private first matters, because the group will
      otherwise settle on the safest shared answer and the session runs on that instead.
    keyPrompts:
      - "What is difficult here, for people you know? Write it, do not say it yet."
    watchOuts:
      - "The offered answers are all abstract. That is fine; do not push for personal disclosure at this point or at any point."
  - title: "Assign the strategies and prepare"
    duration: 15 min
    guidance: >-
      Give each group one strategy and a short description, and ask for a two to four minute scene
      showing it, without naming it. Assign rather than let them pick. Offer the directing role now,
      before groups form, so taking it is a choice among roles rather than an opt-out.
    keyPrompts:
      - "Show a situation, not a character. What does this look like on an ordinary day?"
    watchOuts:
      - "A group turns their strategy into mockery of a real person locally. Redirect to an invented situation immediately."
      - "A learner is visibly uncomfortable with the strategy assigned. Swap it quietly, without asking why."
  - title: "Perform, and name what you saw"
    duration: 25 min
    guidance: >-
      After each scene, before the strategy is named, ask the room what they noticed: how the person
      behaved, how they related to people above, below and beside them, what they were trying to get.
      Then the group reveals which strategy it was. Guessing first is what produces recognition.
    keyPrompts:
      - "What was that person trying to achieve?"
      - "What does this cost them, day to day?"
      - "Who benefits from people doing this?"
    watchOuts:
      - "The room laughs at get out or get back. Let the laugh pass and then ask the cost question; the humour is usually recognition."
  - title: "Read the seven together"
    duration: 10 min
    guidance: >-
      Read all seven in order and say plainly that six are survival and one changes the conditions. Then
      ask which ones learners have seen most around them. Do not ask which ones they use, and do not let
      the group ask each other.
    keyPrompts:
      - "Which of these do you see most where you live?"
      - "Can one person use more than one of these?"
    watchOuts:
      - "Learners start diagnosing each other. Stop it at once and restate that these describe situations, not people."
  - title: "Ask what makes getting together hard"
    duration: 15 min
    guidance: >-
      Put the question in that form and collect the answers as a list. Accept risk and fear as real
      answers where they are given, and do not counter them with encouragement. Then the second question:
      what would have to be true for it to be possible here? That is the one that produces something
      usable.
    keyPrompts:
      - "What makes getting together hard?"
      - "What would have to be true for it to be possible?"
    watchOuts:
      - "The facilitator argues the group out of its assessment of the risk. In several of Amala's settings that assessment is correct; take it seriously and work within it."
  - title: "Make something that shows the seventh"
    duration: 15 min
    guidance: >-
      Finish by making one thing together: a short poem, a song, a drawing, a piece of movement, that
      shows what getting together looks like. It is not decoration. A session that has spent an hour on
      constraint should end on something the group made rather than on a diagnosis.
    keyPrompts:
      - "What does it look like when people manage it?"
    watchOuts:
      - "This step gets cut for time. Protect it, and cut a performance instead if you must."
agencyContribution:
  indicators: [power-over-wellbeing-and-self-direction, contribution-to-community]
  how: >-
    Learners recognise their own responses to hard conditions as strategies rather than as facts about
    their character, which is the reframing that makes a different response thinkable. And the closing
    question, what would have to be true for people here to act together, converts a session about
    constraint into a short list of what would have to change first.
principlesForegrounded: [safe-spaces, builds-on-identities, responsible-action]
principleAlignment:
  - principle: safe-spaces
    how: >-
      Strategies are assigned rather than chosen, a directing role is offered before performances, nobody
      is asked which they use, and the facilitator judges in advance whether the group is ready at all.
  - principle: builds-on-identities
    how: >-
      The frame takes seriously that learners are already managing difficult conditions competently, and
      names what they are doing as strategy rather than deficiency.
  - principle: responsible-action
    how: >-
      Collective action is presented with its real costs and risks attached, so a learner deciding not to
      act is making an informed judgement rather than failing a test.
competencyCodes: [FUS1, FUS2, FPS3]
competencyDevelopment:
  - code: FUS1
    how: >-
      Recognising a coping strategy as a response to circumstances, rather than as who you are, is a
      substantial piece of self-understanding, and the frame supplies the language for it.
  - code: FUS2
    how: >-
      The frame explains behaviour in others that is usually read as laziness, anger or dishonesty, and
      replaces that reading with one that accounts for the conditions producing it.
  - code: FPS3
    how: >-
      The scenario analysis separates what is about the person from what is about the arrangement around
      them, which is the same discipline as root-cause work applied to a life.
objectiveIds: [making-societal-change--o1, living-peacefully--o1]
