provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, an adaptation and
  delivery modes) from the Design Challenge activity guide, which supplied the purpose, the individual
  study resources and the mixed-group discussion question. Written to generalise to any design
  challenge; the source project investigates the mental health and wellbeing of Afghan females. Linked
  to Social Entrepreneurship objective 3 (convincing others to invest in or adopt the concept).
