# The Weeks 7-11 mentoring work: surfacing the capability a learner already exercises in daily life,
# naming it as competency, and turning it into evidence. The programme's mentoring block names this
# ("surface the skills learners are already using in camp life... this evidence feeds the Set and
# Pursue Goals assessment") and gave no method for doing it.
