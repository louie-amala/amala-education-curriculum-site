title: "Surfacing the growth a learner cannot see"
summary: >-
  How to draw out the capability a learner already exercises at home and in the camp, name it in the
  language of the competencies, and turn it into evidence that survives to the assessment — for a cohort
  that routinely undervalues what it can already do.
facilitationContext:
- one-to-one-mentoring
primaryContext: one-to-one-mentoring
duration: "One or two conversations, best placed between Weeks 7 and 11"
educatorContent: |
  ## The problem this solves

  Ask a learner here what they are good at and you will often get a short, thin answer, or none. That
  is not modesty and it is not an accurate self-assessment. Several years of interrupted schooling
  teaches a young person that capability is the thing school certifies, and school has mostly been
  unavailable. So the enormous amount they actually do — running a household, caring for younger
  siblings, translating for adults, earning, negotiating at a stall, resolving a dispute between
  neighbours, keeping a family fed on nothing — sits outside the category "things I can do."

  Two consequences, and both matter.

  1. **Learners set goals below their capability**, because they are working from a low estimate of
     themselves.
  2. **You will under-assess them**, because the strongest evidence of Set and Pursue Goals in many
     learners' lives is happening outside your room, and nobody has connected it.

  This is mentoring work rather than classroom work, because it takes a relationship and it takes
  someone asking twice.

  ## The method: ask about the doing, not the quality

  Never ask "what are you good at?" You will get nothing. Ask what they actually did.

  **1. Ask about a day, not about themselves.**

  > "Tell me about yesterday. What did you do, from waking up?"

  Let it run. Do not steer. You are listening for verbs.

  **2. Catch a verb and slow it down.**

  When something goes past — took my sister to the health post, sorted out the argument at the water
  point, sold at the stall, cooked for six — stop there.

  > "Wait. Tell me more about that bit. How did you do that?"

  This is the whole technique. The learner will describe it as nothing. Keep asking how.

  **3. Name it back, in ordinary words first.**

  > "So you worked out what was wrong, you decided who to ask, you went, and you got it sorted. On your
  > own."

  Say it plainly. Do not congratulate — describe. Being accurately described is more convincing than
  being praised, and this cohort has good defences against praise.

  **4. Then name it as the competency.**

  > "That is the same thing we are doing here. You set a goal, you worked out the steps, you did them,
  > and you changed it when it did not work. That is exactly what this course calls setting and
  > pursuing goals."

  This is the connection that changes how a learner sees themselves, and it only lands if step 3 came
  first.

  **5. Write it down while it is fresh** — on your record, in their words. This is assessment evidence.
  See the mentor record.

  ## What to listen for, by competency

  | You hear | It is evidence of |
  |---|---|
  | "I had to sort out ___ so I ___, and when that did not work I ___" | Set and pursue goals (FSL2) — including the adapting, which is the hard half |
  | "I asked ___ because they would know" | Identifying and using resources; help-seeking as a strategy |
  | "I translated for ___" / "I explained it to ___ so they understood" | Communication, and self-awareness about their own languages |
  | "They were arguing so I ___" | Fostering connection; ethical action |
  | "I worked out how much we needed and ___" | Numeracy and evidence-informed decisions |
  | "I taught my sister to ___" | Contribution to community — and often the answer to the agency question they could not answer |

  ## Cautions

  - **Do not romanticise hardship.** "You are so resilient" said to a young person carrying too much is
    not a compliment; it can sound like an instruction to keep carrying it. Name the capability, not the
    suffering.
  - **Notice when it is too much.** Sometimes the honest reading of a learner's day is that they are
    doing more than a young person should. That is a wellbeing conversation and possibly a referral, not
    a competency conversation. Both can be true at once — name the skill, and raise the load.
  - **Do not do this in the group.** A learner's household circumstances are theirs. This is a 1:1
    conversation.
  - **Do not use it to inflate a judgement.** Evidence from life is real evidence, and it still has to
    meet the descriptor. A learner who solves problems at home but cannot articulate a rationale is
    showing something genuine that is not yet Practitioner. Record it, judge it honestly.

  ## Where it goes

  - Into your mentor record, in the learner's words, dated.
  - Into the learner's own sense of themselves — which is the point, and shows up in the goals they set
    next, so watch for a goal getting more ambitious after this conversation.
  - Into the "something I made better for someone else" line on their growth self-check, which many
    learners cannot answer until someone has done this with them.
  - Into the FSL2 judgement, alongside the workbook.
agencyContribution:
  indicators:
  - contribution-to-community
  - power-over-wellbeing-and-self-direction
  - control-of-future-pathways
  how: >-
    A young person who does not count what they already do cannot see themselves as someone who acts on
    the world — and agency that is invisible to its owner does not get used. Naming existing capability
    as capability is the cheapest available intervention in a learner's estimate of themselves, and it
    raises the goals they set next, which is where it turns into a pathway rather than a compliment.
