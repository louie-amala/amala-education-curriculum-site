id: pathways-strategy-for-identifying-opportunities
slug: pathways-strategy-for-identifying-opportunities
access: public
type: activity
title: Developing a strategy for finding pathway opportunities
summary: Learners build a practical, repeatable method for finding pathway opportunities that fit them,
  compare methods with peers, then put the strategy to work by logging real opportunities they uncover.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners draft a strategy alone, then compare in small breakout groups where they
    borrow the sources and routines they had not thought of. The comparison is the engine here,
    because most learners know only two or three places to look until they hear how others search,
    so protect the sharing step even if you trim the drafting.
- context: one-to-one-mentoring
  how: >-
    A strong fit. The mentor plays the peer group, naming sources and contacts the learner cannot
    see from where they sit, especially people and organisations in the learner's reach. The mentor
    should hand over their own way of searching rather than just handing over opportunities, so the
    learner leaves with a method they can run without the mentor.
- context: independent
  how: >-
    Workable for drafting the method, weaker without the peer comparison that widens where a learner
    looks. If a learner works alone, give them a starter list of source types (people, organisations,
    online, community, notice boards) and ask them to test their strategy by logging at least three
    real opportunities before the next session.
duration: 45-55 min facilitated, plus the journal task
grouping: Individual drafting, then breakout groups of 3-5; works with 10-35 learners
whatLearnersDo:
- Complete the "developing a strategy for identifying opportunities" task in your Pathways Journal.
- "Map where you can look for opportunities: people you know, organisations, online, your community and local notice boards."
- Decide how you will keep track of what you find and how often you will check for new opportunities.
- Share your strategy in a small group, then borrow at least one source or habit from someone else.
- Put the strategy into action and add real opportunities you find into your opportunity list.
materialsAndPreparation:
- The Pathways Journal, one per learner, open at the "developing a strategy for identifying opportunities" task (printed or digital).
- A way for each breakout group to keep notes, and a nominated scribe per group.
- A shared list of local source types to prompt learners (people, organisations, online boards, community groups, notice boards), adapted to where your learners actually are.
- Your own worked example of a simple weekly search routine, to show that a strategy is a habit, not a one-off hunt.
facilitationNotes: |
  The point of this activity is a method learners can repeat, not a single search they do once and
  forget. The one thing to get right is that a strategy names both where to look and how often to
  check: a learner who only lists websites has half a strategy. Push every learner to turn their
  ideas into a routine they could actually run each week. Opportunities appear and close on their
  own schedule, so the learner who keeps looking, in more places, finds the ones the one-time
  searcher never sees.
steps:
- title: Show why a search routine beats a one-off hunt
  duration: 5-10 min
  guidance: |
    Open by separating a strategy from a single search. Use your own example of a simple weekly
    routine: where you look, how you record what you find, when you check again. Keep it short. The
    aim is to give learners the idea that finding opportunities is an ongoing habit before they draft
    their own, not to prescribe one correct method.
  keyPrompts:
  - What is the difference between looking for an opportunity once and having a way to keep finding them?
  - If a good opportunity opened next month, how would you even hear about it?
  - How often would you need to check for you to catch things before they close?
  watchOuts:
  - Learners picture a single big search and stop there; make the repeatable routine explicit by asking each learner how their method would still work three months from now.
  adaptation: |
    With no slides or connectivity, this needs only you describing one honest weekly routine aloud
    and writing its three parts (where, how recorded, how often) on a board or sheet of paper.
- title: Map where opportunities actually come from
  duration: 10-15 min
  guidance: |
    Have learners list the places opportunities could reach them, across five source types: people
    they know, organisations, online, their community and local notice boards. Circulate and push
    past the obvious. Most learners default to websites and miss the people and local organisations
    who often carry the best openings, so prompt for named contacts and specific places, not
    categories.
  keyPrompts:
  - Who do you know, or know of, who might hear about opportunities before you do?
  - Which organisations or places near you post openings, and how would you see them?
  - What can you check online, and how do you know it is worth trusting?
  watchOuts:
  - Learners list only online sources and overlook people and local places; ask each learner to name at least one real person and one physical place, since these are the sources they most often forget.
  adaptation: |
    If the journal is not available digitally, learners map their sources on paper against the five
    types and copy them into the journal later. No device is needed for this step.
- title: Turn the map into a routine you can keep
  duration: 10-15 min
  guidance: |
    Now move learners from a list of places to a working routine. Each learner decides how they will
    record what they find, so nothing is lost, and how often they will check each source. Keep the
    routine small enough to actually sustain: a short weekly check a learner keeps beats an ambitious
    plan they abandon. Ask them to write it into the journal as their strategy.
  keyPrompts:
  - How will you keep track of what you find, so a good opportunity does not slip away?
  - How often will you check each of your sources, realistically?
  - What is the smallest version of this routine you would actually keep doing?
  watchOuts:
  - Learners design a routine so demanding they will drop it in a week; steer them to a lighter routine they will sustain, since a strategy only works if it is repeated.
  adaptation: |
    Where time is short, have learners commit to just one recording method and one weekly check now,
    and flesh out the rest of the routine in the journal after the session.
- title: Compare strategies and borrow what works
  duration: 15-20 min
  guidance: |
    Put learners in groups of three to five with a scribe. Each shares their strategy. The group
    names what they like in each other's methods and each learner takes away at least one source or
    habit to add to their own. This peer exchange is where a learner's search widens fastest, because
    every person in the room knows sources the others do not.
  keyPrompts:
  - What do you like about each other's strategies, and what will you add to your own and why?
  - What suggestion do you have for someone else's strategy, and why would it help?
  - Which one source or habit from this group are you taking away today?
  watchOuts:
  - The group drifts into general chat or one learner dominates; give a round-robin structure ("each person shares their strategy before anyone responds") and ask the scribe to record one thing each member is borrowing.
  adaptation: |
    With thin attendance or in a mentoring setting, the facilitator or mentor plays the comparison
    role, offering sources the learner has missed. Asynchronously, learners post their strategy in a
    shared space and reply to two others with one source or habit each.
- title: Put the strategy to work and log real opportunities
  duration: 5-10 min
  guidance: |
    Close by running the strategy for real. Ask each learner to use their method now, or as homework,
    to find and add actual pathway opportunities to their opportunity list in the journal. This turns
    a plan into evidence that the method works and gives you a read on whose strategy is already
    surfacing options and whose needs another look.
  keyPrompts:
  - Using your strategy right now, what is the first opportunity you can add to your list?
  - Which of your sources gave you something, and which came up empty?
  - When will you next run your routine before we meet again?
  watchOuts:
  - Learners treat the list as finished after one pass; remind them the strategy is meant to be run again and again, and that an empty source this week may carry something next week.
closing: |
  Ask two or three learners to share one source a peer gave them that they would never have checked
  alone, to show the group how much wider their collective reach is than any one search. Remind
  learners that the strategy lives in their journal and is meant to be run on repeat: the opportunity
  list will keep growing every time they use it.
agencyContribution:
  indicators:
  - control-of-future-pathways
  how: >-
    A learner who owns a repeatable way of finding opportunities no longer waits for a pathway to be
    handed to them. Building and running their own search strategy turns access to opportunities from
    luck into something the learner actively drives, which keeps control of their future in their
    hands.
principlesForegrounded:
- lifeworthy-competencies
- feedback-and-data
- connect-to-futures
principleAlignment:
- principle: lifeworthy-competencies
  how: >-
    Knowing how to find opportunities systematically is a transferable life skill learners will reuse
    for every future course, job and application, and the activity leaves them with a working method
    they own rather than a one-off list that goes stale.
- principle: feedback-and-data
  how: >-
    Learners test their strategy against real results by logging what each source actually returns,
    and refine the method based on which sources deliver and which come up empty, so the data from
    running it improves the strategy.
- principle: connect-to-futures
  how: >-
    The whole method exists to link learners to the concrete opportunities that carry them towards
    their pathways, so present effort is deliberately connected to the future they are working to
    reach.
competencyCodes:
- FR1
- FR2
- FSL2
competencyDevelopment:
- code: FR1
  how: >-
    Mapping where opportunities come from, across people, organisations, online and community
    sources, is direct practice in identifying the resources available to them; the source map in the
    journal is the evidence.
- code: FR2
  how: >-
    Turning that map into a routine and then running it to surface real opportunities is learners
    actively utilising the resources they identified, rather than just knowing they exist.
- code: FSL2
  how: >-
    Committing to a repeatable search routine, and using it to build a growing opportunity list, is
    the first move in setting and pursuing a goal over time rather than acting once.
