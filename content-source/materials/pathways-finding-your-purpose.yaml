id: pathways-finding-your-purpose
slug: pathways-finding-your-purpose
access: public
type: activity
title: Finding your purpose
summary: Learners begin a lifelong exploration of what matters to them and what they want to contribute,
  so they can recognise pathways that align with an evolving sense of purpose.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners reflect on their own purpose privately first, then share in small breakout
    groups where they look for shared and complementary purposes. The sharing is where learners see
    that purpose is plural and personal rather than a single right answer, so protect it even if you
    shorten the individual reflection.
- context: one-to-one-mentoring
  how: >-
    A strong fit for the reflection, and often safer for a learner who would not open up in a group.
    The mentor takes the listening role the peer group would, reflecting patterns back without
    supplying a purpose. The trade-off is the learner loses the reassurance of hearing that peers are
    also unsure, so name that openly.
- context: independent
  how: >-
    Workable but weaker, because the learner loses the peer reflection that shows purpose is shared and
    evolving. If a learner works alone, ask them to talk their reflections through with at least one
    trusted person, even asynchronously, and to note what that conversation surfaced.
duration: 40-50 min facilitated, plus the journal task
grouping: Individual reflection, then breakout groups of 3-5; works with 10-35 learners
whatLearnersDo:
- Watch the Ikigai video, then complete the "finding your purpose" task in your Pathways Journal.
- Decide which reflections you are comfortable sharing and which you would rather keep private.
- Share some reflections in a small group and look for shared or complementary purposes.
- Note any pathway opportunities that come to mind as you listen to others.
- Record what the task taught you about yourself and what you want to explore next.
materialsAndPreparation:
- The Pathways Journal, one per learner, open at the "finding your purpose" task (printed or digital).
- The "Discover Your Purpose in Life (Ikigai in 4 Steps)" video, or your own spoken walkthrough of the four questions if you cannot show video.
- A way for each breakout group to keep notes, and a nominated scribe per group.
facilitationNotes: |
  This is a reflective, lifelong exploration, not a task with a right answer. The one thing to get
  right is psychological safety: purpose touches identity, family and loss, so learners must be free
  to keep reflections private and to leave with only a partial, provisional sense of direction. Frame
  purpose as something that evolves and can be revisited, never a fixed label a learner must commit to
  now. Your job is to help each learner notice what matters to them and which pathways line up with
  it, not to resolve the question for them or judge the answer.
steps:
- title: Frame purpose as an evolving, personal question
  duration: 5-10 min
  guidance: |
    Open by making clear this is the start of a lifelong exploration, not a test with a correct
    answer. Introduce purpose as two linked questions: what matters to me, and what I want to
    contribute. Stress that answers change over time and can stay private. Keep it short and warm, so
    learners feel safe to be tentative rather than pressured to declare a fixed life plan.
  keyPrompts:
  - When you imagine a good week, what are you spending your time on?
  - What is something you care about that you would want to contribute to?
  - If your sense of purpose changes in a few years, does that make today's answer wrong?
  watchOuts:
  - Learners feel they should already have a clear purpose and freeze; say plainly that being unsure is normal and expected, and that a rough, changing answer is the whole point.
  adaptation: |
    With no way to play video, walk through the four Ikigai questions aloud, one at a time, and write
    them on a board or sheet. The reflection does not need a device or connectivity to run.
- title: Reflect on purpose using the Ikigai prompts
  duration: 15-20 min
  guidance: |
    Play the [Ikigai video](/materials/video-discover-your-purpose-ikigai), or pose its four questions, then give learners quiet individual time to
    complete the "finding your purpose" task in their journal. Circulate gently. Where a learner is
    stuck, ask what they enjoy or who they want to help rather than naming a purpose for them. Ask each
    learner to mark which reflections they are willing to share and which they would rather keep.
  keyPrompts:
  - What do you love doing, and what are you good at?
  - What does the world around you need that you could help with?
  - Which of these reflections are you comfortable sharing, and which would you rather keep private?
  watchOuts:
  - A learner writes something raw about family, displacement or loss and then feels exposed; remind everyone before they start that nothing has to be shared, and let a learner step back without explaining why.
  adaptation: |
    If the journal is not available digitally, the same prompts can be answered on paper and copied in
    later. No device is required, and a learner can reflect without watching the video.
- title: Share and connect purposes in breakout groups
  duration: 15-20 min
  guidance: |
    Put learners in groups of three to five with a scribe. Each learner shares only what they chose to.
    The group looks for purposes that are similar and ones that are complementary, different aims that
    could help each other, and names any pathway opportunities that come to mind as they listen. This
    peer reflection shows learners that purpose is plural and that others see options they had missed.
  keyPrompts:
  - Are any of your purposes similar, and how could you work together on them?
  - Are any of your purposes complementary, so that different aims could support each other?
  - As you listen, what pathway opportunities come to mind for the person speaking?
  watchOuts:
  - The conversation drifts or one learner dominates; give a clear round-robin structure so each person shares before anyone responds, and ask the scribe to capture at least one connection or opportunity per member.
  adaptation: |
    With thin attendance or in mentoring, the facilitator or mentor plays the listening role and
    reflects patterns back. Asynchronously, learners post one reflection in a shared space and reply to
    two others with a connection or an opportunity.
- title: Capture what you learned and your next step
  duration: 5 min
  guidance: |
    Close the loop individually. Ask each learner to write, in their journal, what the task taught them
    about themselves and one pathway opportunity they now want to explore. Keep it provisional: the aim
    is a direction to look into, not a decision. This gives you a quick read on who left with a thread
    to follow and who is still searching, without forcing anyone to conclude.
  keyPrompts:
  - What did completing this task teach you about yourself?
  - How could knowing what matters to you help you choose which pathways to explore?
  - What is one pathway opportunity you want to look into before the next session?
  watchOuts:
  - Learners feel pressure to name a single life purpose to finish; make clear that a partial, changing answer is a valid place to stop and that they will return to this question again.
closing: |
  Ask two or three learners to share one thing they noticed about themselves or one connection a peer
  surfaced, only if they are comfortable. Remind everyone that purpose lives in the journal and will be
  revisited: it is a question they will keep answering, and each pathway choice is a chance to test what
  matters to them against what is in front of them.
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  - control-of-future-pathways
  how: >-
    Naming what matters to you and what you want to contribute is an act of self-direction: it puts the
    definition of a good future in the learner's own hands. Later pathway choices are then measured
    against that evolving sense of purpose, which keeps control of the journey with the learner rather
    than with a default script.
principlesForegrounded:
- builds-on-identities
- connect-to-futures
- safe-spaces
principleAlignment:
- principle: builds-on-identities
  how: >-
    The reflection starts from what each learner already loves, values and cares about, and explicitly
    makes room for family and community purposes rather than a narrow career frame, so the work is
    anchored in the learner's own life and identity.
- principle: connect-to-futures
  how: >-
    Learners move from naming what matters to them to hunting for pathway opportunities that line up
    with it, which is exactly the act of connecting a present sense of purpose to the future they want
    to build.
- principle: safe-spaces
  how: >-
    Purpose touches identity and loss, so the activity is built around consent: learners choose what to
    share and can keep reflections private, and being unsure or provisional is framed as normal, which
    protects the psychological safety needed to reflect honestly.
competencyCodes:
- FSL1
- FUS1
competencyDevelopment:
- code: FSL1
  how: >-
    Reflecting on what matters to them, and closing with what the task taught them about themselves, is
    direct practice in self-reflection; the journal entries are the evidence.
- code: FUS1
  how: >-
    Articulating their own purpose and hearing how peers' purposes differ or align develops awareness
    of what drives their own choices and how their sense of self is evolving.
