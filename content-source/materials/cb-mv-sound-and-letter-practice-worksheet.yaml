# Student worksheet for cb-mv-sound-and-letter-practice. A thin resource: the learner-facing sheet the
# activity refers to, with spaces to build and place letters into your name and first words, and to mark the
# sound you hear (emergent dictation), with no fluent writing assumed. Its printable form is one page of the
# Student My Voice book (workbook).
