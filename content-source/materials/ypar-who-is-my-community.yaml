provenanceNote: >-
  Rewritten from the YPAR Hub's "Who is My Community?", supplied to Amala in August 2026. The discussion
  questions, including the three about authority, and the two-circle drawing with a gallery walk are the
  source's. The handling of non-belonging for displaced learners, the removal of the requirement that one
  circle be the school, and the closing question about whose definition of the problem the project is
  inheriting are Amala's.
