id: as-see-the-work-they-produce
slug: as-see-the-work-they-produce
access: public
type: educator-move
title: "Evaluate the work they produce"
summary: >-
  The things learners make are evidence too. Evaluate real products against clear criteria — and
  triangulate, so a polished artefact doesn't stand in for the person.
tags:
  - id: seeking-evidence
educatorContent: |
  Products — a report, an artefact, a plan, a piece of writing — are a natural source of evidence.
  Set a task, be clear what it is meant to evidence, and evaluate what learners submit against the
  criteria. What you can assess depends on what you asked for: a report with an appended methodology
  and interview transcripts, for instance, can evidence a learner's ability to conduct primary
  research. You can raise the quality of both the product and the learning by scaffolding the process
  — templates, guidance, or building towards the product across several assignments.

  One caution keeps this honest: a product can be produced with help, or with AI, that the learner
  could not reproduce alone. That is exactly why product evaluation should not stand on its own —
  triangulate it with questioning and performance, so you are judging the person's proficiency, not
  the artefact's polish.
agencyContribution:
  indicators:
    - power-over-wellbeing-and-self-direction
    - control-of-future-pathways
  how: >-
    Judging real work against clear criteria, alongside other evidence, gives a learner an honest and
    usable account of what they can do and where to grow.
principleAlignment:
  - principle: feedback-and-data
    how: >-
      Evaluating products against shared criteria produces concrete, actionable evidence — as long as
      it is triangulated rather than trusted alone.
  - principle: lifeworthy-competencies
    how: >-
      Building towards real products means learners are assessed on making the kinds of things that
      matter beyond the classroom.
