educatorContent: |
  ## Start here

  This is the practical companion to the playbook. The playbook tells you **how to teach** beginner
  English to learners who may never have read in any language. This page tells you **what you need**
  and **what to make** before each phase.

  My Voice is a 50-hour component (30 hours in-person, 20 hours independent) over at least 10 weeks. It
  runs fully offline, with no screen. Learners start from the sound of their own name and finish by
  making and sharing a "My Name, My Voice" card.

  The single most important thing to hold: **this course leads with the ear and the voice.** Reading
  and writing grow out of speaking here; they are not a gate in front of it. A learner who can say a
  true sentence about themselves and cannot yet write it has succeeded.

  ## The offline pack

  - The Facilitator Unit Plan and Guide (this pack) - the full plan, the playbook, the practice
    guidance, and the phonics reference appendix.
  - The Student My Voice book - one per learner, for the whole component.
  - The letter and picture cards - printable alphabet cards, key-sound cards, and blank picture-word
    cards for building your own vocabulary. One set per group, printed and cut up.
  - This start-here, and the safeguarding and protection guide.

  There are no slides. Nothing in this component needs a screen.

  ## What you need (kit)

  - One printed My Voice book per learner, plus spare blank paper.
  - Pencils, and colours if you have them, for the picture-words and the final card.
  - The letter and picture cards, cut out and kept in a bag or tin so they survive ten weeks. You will
    use them in almost every session - this is the most-used object in the component.
  - Card or thick paper for the "My Name, My Voice" cards at the end. Make sure you have this from the
    start; it is the one material you cannot improvise on the day.
  - Wall space for the sound chart the group builds, and for the classroom-words display. Both stay up
    all course.
  - Small objects from around the learning space you can name, point to and pick up - a cup, a stone, a
    leaf, a cloth. Real objects beat pictures for beginners, and they are free.
  - Something to make a noise with for the listening games: a stick, a tin, your hands.

  ## What to prepare, phase by phase

  - **Getting started.** Have the My Voice books ready so learners can make them their own on day one.
    Prepare the classroom-words display space. Learn to say every learner's name correctly before the
    first session - ask, and practise. In this component that is not a courtesy, it is the first
    lesson's content.
  - **The sounds, letters, and first words of English.** This is the phase to be most generous with
    time and most prepared for. Cut out the alphabet and key-sound cards before you start. Write each
    learner's name clearly on a strip of card for tracing - one per learner, prepared in advance, not
    written while thirty people wait. Read the phonics progression in the appendix so you know which
    sounds come in which order and why.
  - **Say who you are.** Prepare sentence-frame strips - I am ___, I am from ___, I like ___ - big
    enough for the wall, plus a set of word cards learners can physically move to build a sentence.
    Building a sentence with your hands is what makes the grammar visible to someone who cannot yet
    read it.
  - **My Name, My Voice - make and share.** The card stock, colours, and something to display the
    finished cards on. Coordinate with the other two components: the sharing happens at the one
    programme showcase, so this phase is making, rehearsing, and deciding who to invite.

  ## Pictures and cards you will need to make

  The printed cards cover most of it. You will still want to make:

  - A large sound chart on the wall that the group adds to as sounds are met - one box per sound, with
    a picture and a word the group chose.
  - Picture-words for whatever your group cares about that the printed set does not cover. The blank
    cards are for this, and learner-drawn ones work better than yours.
  - The classroom-words display: hello, thank you, please, again, I don't understand, how do you say…
  - A big version of the sentence frames, for the wall.

  Stick figures are fine. Learners copy simple drawings more readily than polished ones.

  ## Running a speaking course in a small, shared room

  This component is noisier than the other two, by design, and that is often the hardest practical
  problem in a CBLF.

  - **Choral repetition is your friend.** Everyone says it together first. It is loud, it protects the
    shy learner, and it means nobody is performing alone before they are ready.
  - **Pairs, not the whole group, for most speaking.** Twelve learners speaking in pairs is six times
    the practice of twelve learners taking turns, and it is quieter than it sounds.
  - **Same-gender pairs wherever that is what lets girls speak.** A girl who will not speak in a mixed
    pair has not failed to practise; the pairing has failed her.
  - **If the room echoes**, move the pairs apart and let people sit on the floor in corners. Volume
    matters less than being able to hear your partner.
  - **If a neighbour complains about the noise**, tell your coordinator rather than quietening the
    course. A silent English class does not teach English.

  ## The My Voice book holds it together

  The book is the spine. It carries the "I can…" self-check the learner marks at the start and again at
  the end, the growing collection of picture-words, the name practice, the sentence frames, the
  practice-weeks loop, and the final card.

  - **Set it up early** and open it every session, so it stays the learner's own.
  - **It is built to hold the scaffold when you are not beside someone** - every page has a worked
    example and a frame, never a blank box.
  - **You do need a printer.** One book per learner is the baseline. If the printer is down for a
    session, hold up one copy or draw the page large on the wall and let learners work in a notebook -
    a contingency for a bad week, not a way to run ten of them.

  ## Stop-start attendance

  English is the component most damaged by gaps, because it builds. Two things protect it.

  1. **Recycle relentlessly.** Open most sessions with a short, warm review of the sounds and words
     already met. Little and often beats teaching a thing once - and it means a returning learner meets
     old material in their first session back rather than only new.
  2. **A returning learner needs a sound, not a syllabus.** Give them one sound or one word to hold
     that day, not four weeks of catching up. Their book is the catch-up mechanism; point them at one
     page.

  ## Practice is the other half of the course

  Twenty of the fifty hours are independent, and they are not homework you invent - they are the
  weekly practice loop in the book, and the English learners use in the rest of the programme and at
  home. See the "Practice everywhere" guidance. If you only protect one thing outside the session,
  protect the question you ask at the start of each one: **who did you speak English with?**
agencyContribution:
  indicators:
  - control-of-future-pathways
  - power-over-wellbeing-and-self-direction
  how: >-
    English below B1 is the specific barrier standing between this cohort and an accredited secondary
    place, so a facilitator who is prepared enough to protect the speaking practice - rather than
    retreating to quiet copying because the room is small and noisy - is protecting the learner's route
    to that place. Preparation is what makes the difference between a course that builds voice and one
    that builds handwriting.
