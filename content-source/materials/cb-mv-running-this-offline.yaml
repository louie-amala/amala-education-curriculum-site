# Facilitator start-here resource for the English Language Development (My Voice) component of
# Learning Bridge+ (Cox's Bazar). The last of the three taught components to get one: the Research
# Project had cb-rp-running-this-offline and Agency in Learning now has cb-ail-running-this-offline,
# while My Voice went from the playbook straight into Phase 1 with no kit list and no preparation.
#
# Distinct from cb-mv-facilitator-playbook, which is about HOW TO TEACH beginner English to
# pre-literate learners. This is about what you need in the room and what to make before each phase.
