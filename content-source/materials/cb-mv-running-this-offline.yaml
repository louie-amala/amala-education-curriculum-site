title: "Running My Voice offline - start here"
summary: >-
  The facilitator's start-here for delivering My Voice with no internet: what is in the pack, the kit
  you need, what to prepare and make for each phase, how the My Voice book holds the course together,
  and how to run a listening-and-speaking course in a small, noisy, shared room.
