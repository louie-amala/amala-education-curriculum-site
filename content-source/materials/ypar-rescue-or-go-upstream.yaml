  basis: >-
    The upstream parable is old and widely retold, and its structure is an idea rather than an
    expression. The telling on this page is written from scratch, in a different setting, with
    different characters. None of the source's wording is reproduced.
  note: >-
    Do not replace this telling with the source's version, which is set in a named Swiss village with a
    named millionaire and is that author's expression rather than ours.
