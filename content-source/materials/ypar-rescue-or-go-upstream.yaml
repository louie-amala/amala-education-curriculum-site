provenanceNote: >-
  Rewritten from the parable carried in the YPAR Hub's "Community Organizing" lesson plan, supplied to
  Amala in August 2026, where it appears as a story about falling rocks and a named millionaire. The
  three-party structure and the question about which village group the antagonist prefers are the
  source's and are why the material is worth carrying. The telling here is Amala's own, relocated to a
  river, and the instruction to argue the rescue case properly, together with the note on how this lands
  with learners whose communities are sustained by relief operations, is Amala's.
