# Contextualised, fully offline adaptation of efi-mv-writing-about-myself for Learning Bridge+ (Cox's
# Bazar), pitched far earlier — at EMERGENT literacy. The source has literate learners composing sentences
# from frames; this version is the very first physical act of writing: how to hold a pencil, how to form a
# letter, and how to trace and copy your own name and a few key personal words. Recognition and tracing
# come before any free writing, and for learners who have never held a pencil, finger-tracing in sand or
# dust and air-writing are the first steps. Objective 1.
id: cb-mv-writing-my-name
slug: cb-mv-writing-my-name
access: public
edition: learning-bridge-coxs-bazar
type: activity
title: "Writing my name"
summary: >-
  Learners take their first physical steps in writing — how to hold a pencil, how to make a letter, and how
  to trace and then copy their own name and a few key personal words into the My Voice book. Recognition
  and tracing come before free writing, air-writing and finger-tracing in sand come before the pencil, and
  the moment a learner writes their own name for the first time is celebrated as the real milestone it is.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    Workable as designed, with care, because handwriting is where a beginner most fears being seen to fail.
    Air-writing and tracing together give shy learners cover, and a room writing their own names at once
    makes the moment shared rather than exposing. Circulate constantly, kneel beside people, and keep all
    praise for effort, not neatness. Use same-gender pairs where learners show each other their writing.
- context: one-to-one-mentoring
  how: >-
    The best fit for a learner who has never held a pencil, or who is ashamed to be seen struggling. A
    mentor can show the grip quietly, guide the hand through the first letters with no audience, and let the
    learner trace their name as many times as they need at their own pace — which removes the shame that
    can otherwise stop a beginner from ever picking up a pencil.
- context: independent
  how: >-
    Limited alone at first, because a learner needs the grip and the letter shapes shown before they can
    practise them well. Once shown, tracing and copying a name is good independent practice: the My Voice
    book carries the name to trace, and the independent task is to trace or write their name once more at
    home, or in the dust, and show it next session.
duration: "2.5 hours facilitated across two or three sessions, plus independent tracing practice"
grouping: "Whole group for air-writing and the grip, then individual tracing with same-gender pairs to share; works with 10-35 learners"
whatLearnersDo:
- Learn how to hold a pencil, and make first marks and letter shapes with a finger and then a pencil.
- Recognise and trace their own name before being asked to write it freely.
- Trace and then copy their name and a few key personal words from their My Voice book.
- Write their own name for the first time, and keep it in the My Voice book as a real milestone.
materialsAndPreparation:
- Each learner's name written large and clear to trace over (write it big beforehand if you can), and one or two of their picture-words from the "Words about me" activity.
- Something to trace with and in — the My Voice book and a pencil where there are pencils; and a tray of sand, dust on the ground, or a wetted finger on a surface where there are not.
- Space to air-write, so learners can make big letter shapes in the air with a whole arm before the small ones on paper.
- Your own name ready to write slowly and large, so learners see how a letter is formed stroke by stroke.
- "Sensitivity: for many learners this is the first time they have ever held a pencil, and being seen to struggle with it can bring deep shame. Show the grip quietly and one to one, never single out a learner's marks in front of others, let anyone who wishes trace with a finger before a pencil, and keep every word of praise for the effort and the try, not the neatness."
visuals:
- kind: example
  title: "Trace, then copy"
  caption: >-
    The hand learns the shape over a model, then makes it fresh underneath. A name written is a big first
    win — celebrate it.
  spec:
    type: zones
    cardStyle: drawing
    flow: across
    flowLabel: "then"
    zones:
    - label: "Trace over the model"
      tone: known
      cards:
      - "Rashida (dotted)"
    - label: "Copy it fresh"
      tone: positive
      cards:
      - "Rashida"
      - "rice"
facilitationNotes: |
  This activity is the first physical act of writing, pitched far earlier than the source it grows from:
  that source has literate learners composing sentences from frames, but here many learners have never held
  a pencil, so the work is the hand itself — the grip, the first marks, the shape of a letter. Lead with
  recognition and tracing, never free writing: a learner should be able to see and know their name, and
  trace over it many times, well before they are asked to make it unaided. Start big and loose — air-writing
  a letter with the whole arm, then a finger in sand or dust — before the small, controlled movement a
  pencil needs, because the big movement teaches the shape and the small one only follows. Build everything
  from the learner's own name and the picture-words they already own from earlier activities, because a
  learner will work hard on their own name when an abstract letter drill would defeat them, and writing your
  own name for the first time is a real, dignified milestone worth dwelling on. Guard against shame above
  all: the pencil is where a beginner most fears being seen to fail, so show the grip quietly, praise the
  effort not the neatness, and let no one's marks be a public moment. Welcome bridges to scripts learners
  already know — Arabic from the madrasa, Burmese — as evidence that their hand can already make meaningful
  marks. Go slow, and treat the first shaky name as the win it is.
steps:
- title: "Big shapes: the hand before the pencil"
  duration: "35-45 min"
  guidance: |
    Start with the whole arm, not the pencil. Air-write a big letter shape — the first letter of your own
    name — with your arm, and have learners copy the movement in the air with you. Then move to a finger in
    sand, in dust on the ground, or wetted on a surface, making the same big shapes. Only when the shape
    feels familiar in the arm and the finger do you bring in the pencil, and then show the grip quietly,
    kneeling beside learners rather than announcing it. Keep it big, slow, and loose; the small, neat
    movement comes much later, and forcing it now only breeds shame.
  keyPrompts:
  - Make this shape big in the air with me — follow my arm.
  - Now the same shape with your finger in the sand — how does it feel?
  - Which shapes does your hand already know from a script you have written before?
  watchOuts:
  - Going to the pencil and small letters too soon; the big arm and finger movements teach the shape, and a learner rushed to a pencil grips it in fear and learns the shape worse, not better.
  - A learner ashamed they have never held a pencil; show the grip quietly and one to one, let them stay with the finger and sand as long as they need, and never make it a public moment.
  adaptation: |
    No pencils or paper at all are needed for this step — a finger in sand or dust, or a wetted finger on
    any surface, teaches the hand the shapes just as well, and many learners are steadier starting there.
- title: "See and trace your name"
  duration: "45-55 min"
  guidance: |
    Give each learner their name written large and clear, and first let them simply look at it and point —
    this is my name, this is its first letter, this is the sound it makes. Recognition comes before writing.
    When they are ready, they trace over the name, as many times as they like and unhurried — with a pencil
    in the My Voice book, or with a finger over the large name and in sand if pencils are short. For many
    this is the first time they have traced their own name, and it is worth dwelling on. Circulate, kneel
    beside people, and praise the effort and the trying, never the neatness.
  keyPrompts:
  - Point to your name. Now point to its first letter — what sound does it make?
  - Trace over it slowly with me — which part is getting easier?
  - How does it feel to make the shape of your own name?
  watchOuts:
  - Pushing for neat, correct formation too soon; the win here is recognising the shape and having a go, and neatness comes only with time and repetition.
  - Comparing one learner's tracing to another's; every hand starts differently, so keep all attention on each learner's own progress against their own last try.
  adaptation: |
    Where there is no paper to spare, learners trace their name in a tray of sand, in dust on the ground,
    or over a large name card with a dry finger; the muscle memory forms just the same.
- title: "Copy your name and your words"
  duration: "40-50 min"
  guidance: |
    When tracing feels steady, learners move from tracing over the name to copying it beside the model —
    looking at their name and making it themselves, with the large version still there to check against.
    Then, for those ready, copy one or two of their key picture-words from the "Words about me" activity in
    the same way: look, then copy, with the word and its picture beside them. This is the bridge from
    tracing to writing, and it stays supported — the model is always there. Celebrate the first name a
    learner writes by copying rather than tracing as the milestone it is.
  keyPrompts:
  - Look at your name, then make it yourself just below — you can check against the big one.
  - Which of your words would you like to copy next to its picture?
  - You wrote your own name — how does that feel?
  watchOuts:
  - Taking the model away too soon and asking for free writing; the copy-from-a-model stage is where the hand learns, and free writing without the model belongs to a much later activity.
  - A learner discouraged that their copy is shaky; name that every writer's first name is shaky, show the one part that is going well, and keep the model there as long as they want it.
  adaptation: |
    A learner whose hand tires quickly copies just the first letter, or their name in sand rather than on
    paper; the act of copying from a model counts fully, however small, and can be built on next session.
closing: |
  Bring the group together and let any learner who wishes hold up their My Voice book and show their name —
  traced or copied, however it looks. Put the written name into the book beside the sounds and picture-words
  already there, as proof of what the hand can now do. Name the win plainly and warmly: today you held a
  pencil, made the shapes of letters, and wrote your own name — for many people the first time they have
  ever done so, and the beginning of writing in English. Independent task: trace or write your name once
  more at home, in a book or in the dust, and, if you can, show it to one person you live with.
agencyContribution:
  indicators:
  - control-of-future-pathways
  how: >-
    Learning to hold a pencil, form letters, and write your own name is the first turn of the key that
    unlocks writing — and writing is the gateway to the forms, applications, and study that further
    pathways require. For a learner who has never held a pencil, making the shapes of their own name for
    the first time is a real widening of the futures open to them, and a dignity no one can take back.
principlesForegrounded:
- builds-on-identities
- safe-spaces
- lifeworthy-competencies
principleAlignment:
- principle: builds-on-identities
  how: >-
    Everything is built from the learner's own name and the picture-words they already own, so the first
    thing a learner writes is themselves; bridges to scripts they have written before — Arabic from the
    madrasa, Burmese — are welcomed as proof their hand can already make meaningful marks.
- principle: safe-spaces
  how: >-
    Handwriting is where a beginner most fears being seen to fail, so the activity is built to protect
    against shame: recognition before formation, tracing before copying, air-writing and sand before the
    pencil, the grip shown quietly one to one, no marks made a public moment, and praise for effort not
    neatness — all so a learner dares to pick up a pencil at all.
- principle: lifeworthy-competencies
  how: >-
    Holding a pencil, forming letters, and writing your own name are the foundation beneath all later
    writing; the hand a learner trains here is reused in every later session, every form, and every
    signature for the rest of their life.
competencyCodes:
- FLC3
competencyDevelopment:
- code: FLC3
  how: >-
    Making the first physical marks of writing — the grip, the letter shapes, and tracing then copying
    one's own name and key words — is the ground floor of being able to communicate in written English, the
    very start of turning known sounds and words into marks on a page.
