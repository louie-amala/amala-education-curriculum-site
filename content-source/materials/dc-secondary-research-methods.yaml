  Enriched into a structured facilitation flow (steps with prompts, watch-outs, an access note,
  adaptations and delivery modes) from the Design Challenge activity guide, which supplied the purpose,
  the secondary-research plan task and the breakout discussion questions. The source Design Challenge
  investigates the mental health and wellbeing of Afghan females; this material is written to
  generalise to any research challenge, with that as the worked example. Linked to Research Project
  objective 2 and Social Entrepreneurship objective 1.
