    teams, r-controlled, diphthongs), each with an example word.
  caption: "The Phonics Table model — the completed reference learners build toward across the course."
agencyContribution:
  indicators: [control-of-future-pathways]
  how: >-
    Reading and writing English is a gateway to further study and work. A single, cumulative map of
    how English sounds and spellings fit together gives a learner a tool they can keep returning to
    on their own, so decoding becomes something they can do independently rather than a barrier that
    depends on a teacher being present.
principlesForegrounded: [lifeworthy-competencies, connect-to-futures]
principleAlignment:
- principle: lifeworthy-competencies
  how: >-
    Decoding and spelling are foundational literacy skills learners reuse across every subject and
    into work and further study; the table makes that foundation visible and reusable.
- principle: connect-to-futures
  how: >-
    The table is framed as a lasting personal reference, not a disposable worksheet — a tool learners
    carry forward into the reading and writing their next steps will demand.
competencyCodes: [FLC3]
competencyDevelopment:
- code: FLC3
  how: >-
    Clear, accurate reading and pronunciation are the ground floor of being understood; the table
    supports the decoding that lets learners communicate in writing and speech.
