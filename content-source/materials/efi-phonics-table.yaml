# English for Impact resource — Part 3 §10a "Phonics Table Model".
# Source: The Language Learning Lab "English for Impact" Course Guide (pp. 45–46).
id: efi-phonics-table
slug: efi-phonics-table
access: public
type: resource
title: "Phonics Table"
summary: >-
  A cumulative sound–spelling reference chart that organises the 44 English sounds by type
  (consonants and vowels). Learners build toward this model across the course, collecting sounds and
  spelling patterns as they meet them in each unit.
facilitationContext: [group, independent]
primaryContext: group
materialsAndPreparation:
- One large, visible copy of the Phonics Table for the classroom wall, plus a small copy per learner if possible.
- A plan for how learners will add to their own table over time (see the companion "Phonics Table (build your own)").
facilitationNotes: |
  The Phonics Table is a cumulative tool, not a one-off worksheet. Instead of memorising isolated
  rules, learners build their understanding by adding examples from each unit, making connections
  between sounds, spelling, and meaning. This model shows how the completed table looks; use it as an
  ongoing reference to support reading, writing, and pronunciation across the whole course.

  Sounds are grouped so learners can see patterns: stop, fricative, affricate, nasal, liquid, and
  semi-vowel consonants; and short vowels, long vowels, vowel teams, r-controlled vowels, and
  diphthongs. The order sounds are taught in follows the Phonics Progression, not the alphabet — see
  the companion "Phonics Progression by Unit".
learnerContent: |
  This is the Phonics Table — a map of the sounds of English and the letters that spell them.

  English has 26 letters but about 44 sounds. The table groups them so you can see how they fit
  together: consonants on one side, vowels on the other. As you move through the course you will meet
  these sounds a few at a time and add them to your own table, with example words that matter to you.

  Use the table to help you read (turn letters into sounds), write (turn sounds into letters), and
  say words clearly.
