# Student worksheet (resource) for the activity cb-ail-making-an-action-plan. Thin per §3: what the page is and how the
# learner uses it. Ships no file of its own — its printable version compiles into the Agency in
# Learning student workbook ("My Learning Book"). Learning Bridge+ (Cox's Bazar) edition.
id: cb-ail-action-plan-page
slug: cb-ail-action-plan-page
access: partner
edition: learning-bridge-coxs-bazar
type: resource
title: "My action plan"
summary: >-
  The steps in order, what the learner needs for each, and the first step they will take this week.
facilitationContext:
- group
- independent
primaryContext: independent
learnerContent: |
  ## My action plan

  This page is yours. You can draw, write, or say your answer — someone will write it for you if you
  ask — and nobody marks it right or wrong.

  - Write or draw each step, in order.
  - For each step, say what you need.
  - Say your first step this week.
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  how: >-
    Keeping their own record of what they decided, and why, is what lets a learner carry a goal
    between sessions without an adult holding it for them.
objectiveIds: [agency-in-learning--o3]
