title: "Video: Choosing and asking for references"
summary: "A short video on who can act as a reference and how to ask them well, used with the Identifying your references activity."
facilitationContext:
- group
- independent
links:
- label: "Watch: Who can be my reference and how to ask"
  url: https://youtu.be/_YYBXI2mXv4
  note: >-
    External video (YouTube), in English.
facilitationNotes: |
  This video is a resource for the linked activity: learners watch it to learn who can be a reference and how to ask them, then
  apply it to their own work. Treat it as an input to their practice, not the lesson itself, and keep
  the focus on what each learner produces. Preview it first, and have a no-video fallback ready.
learnerContent: |
  Watch this video to learn who can be a reference and how to ask them, then use what you learn on your own work for the linked
  activity. You can pause, rewatch, and turn on captions. The video is a starting point: your own
  draft, and the feedback you get on it, are what make it stick.
agencyContribution:
