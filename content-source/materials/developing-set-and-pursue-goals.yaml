provenanceNote: >-
  A reusable competency-development resource for FSL2 (Set and pursue goals), rendering Amala's own
  proficiency scale (Theorist to Expert) into plain, learner-facing language so learners can understand
  and own their growth in the competency. It is a development resource, not an assessment instrument;
  assessment remains educator judgement against the proficiency scale. The Cox's Bazar edition adapts it
  for oral and visual delivery (see cb-ail-getting-better-at-goals).
