    The exercise is credited to Jane Elliott and the documentary is linked rather than hosted. The
    account and all analysis here are written from scratch.
  note: >-
    Do not host or embed the documentary. Elliott is protective of the exercise, so seek permission
    before any Amala use beyond study of the recording.
