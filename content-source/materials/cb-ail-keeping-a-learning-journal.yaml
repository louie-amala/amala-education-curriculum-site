provenanceNote: >-
  Contextualised, fully offline adaptation of ail-keeping-a-learning-journal for the Learning Bridge+ (Cox's
  Bazar) edition: the written journal becomes a visual picture workbook that non-literate learners draw and mark
  in, with the facilitator scribing a few words on request; no reading, writing, or devices assumed, ~60 min
  facilitated with a short independent marking task in the Agency in Learning unit. Linked to
  objective 4.
