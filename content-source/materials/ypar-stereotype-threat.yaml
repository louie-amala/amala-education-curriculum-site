provenanceNote: >-
  Written by Amala in August 2026 while adapting the YPAR Hub's "Busting Stereotypes" lesson plan,
  which introduces stereotype threat in a single paragraph and states the effect more confidently than
  the current evidence supports (its worked example is the girls-and-mathematics finding, which is the
  part of the literature most affected by the publication-bias reassessment). Given its own page so
  that the concept and its caveats travel together.
