educatorContent: |
  Little Golano is a peer-reviewed simulation by Noam Ebner and Yael Efron, and the winner of the
  2010-11 collaborative governance teaching case and simulation competition. Two countries, the United
  States and Mexico, dispute a piece of land. The dispute, the war that produced it and the treaty
  that ended it are all fictional, but they are set inside real countries with real history, which the
  authors call a pseudo-reality: familiar enough to feel weighty, invented enough that nobody in the
  room is defending their own country's actual position.

  Participants take roles across delegations and third parties, and work through analysis,
  negotiation, mediation and questions of international law.

  ## Why it belongs in this course, and where

  Everything else in the Peacebuilding bank is short. Simulations of an hour teach a mechanism
  cleanly, and they cannot teach what it is like to still be in a conflict on day two. Little Golano
  can, and that is its whole argument for inclusion.

  Over six to sixteen hours, learners hit things a one-hour game never reaches: positions hardening
  because of something said yesterday, the cost of a bad first meeting, the difficulty of holding a
  delegation together, and the point at which people simply become tired of each other. Those are
  ordinary features of real processes and they are invisible in short activities.

  Its slot is late, as a capstone for objectives 1 and 3, after learners have the analysis tools and
  the transformative-platform criteria. They can then use both under sustained pressure rather than
  on a case study.

  ## What it demands, honestly

  This is the most expensive material in the bank in timetable terms, and the authors pitch it at
  participants with some background in conflict resolution, international relations or international
  law. For an Amala cohort that means late in the course, with the earlier materials done, and with a
  facilitator willing to prepare properly. If you cannot give it a day, do not start it: a truncated
  Little Golano is worse than a well-run hour-long simulation.

  ## What to protect in the debrief

  - **Debrief along the way, not only at the end.** Over a multi-day run, learners forget what day one
    felt like. Short reflective pauses preserve the evidence.
  - **Ask what the first meeting cost.** In long simulations, the opening interaction usually shapes
    everything after it, which is a finding worth naming.
  - **Ask about fatigue.** Deals get made at hour twelve that nobody would have accepted at hour two.
    That is true of real negotiations and worth being honest about.

  ## Getting it

  Free from SSRN, and also hosted by Syracuse University's E-PARCC collection of peer-reviewed
  collaboration simulations, which is worth browsing more widely.
learnerContent: |
  You will take a role in a dispute between two countries over a piece of land. The land, the war
  behind it and the treaty that ended that war are invented. The countries are not.

  This runs for a long time, possibly across several days. That is deliberate.

  Along the way, and at the end:

  - What happened in the very first meeting? What did it cost you later?
  - When did a position harden? What hardened it?
  - How hard was it to keep your own delegation together?
  - **What would you have accepted at the end that you refused at the start? Why?**
  - Which of the analysis tools from this course did you actually use, and which did you forget?
agencyContribution:
  indicators: [contribution-to-community]
  how: >-
    Sustained pressure teaches something short simulations cannot: that a process is survived as much
    as it is designed, and that early moves constrain late ones. A learner who has felt that is far
    better prepared to be patient with a real one in their own community.
principlesForegrounded: [authentic-challenges, collaboration, safe-spaces]
principleAlignment:
  - principle: authentic-challenges
    how: >-
      The length is what makes it authentic: learners meet fatigue, hardened positions and the cost of
      a bad opening, none of which a one-hour activity can produce.
  - principle: collaboration
    how: >-
      Learners must hold their own delegation together while negotiating outward, which is the double
      task every real negotiator faces.
  - principle: safe-spaces
    how: >-
      The dispute is fictional and placed inside countries most Amala learners have no personal stake
      in, so the pressure stays professional rather than personal.
competencyCodes: [FSI1, FUS2, ALC3, FLC3]
competencyDevelopment:
  - code: FSI1
    how: >-
      The background material is substantial and learners have to investigate it before they can
      negotiate from it.
  - code: FUS2
    how: >-
      Sustained contact with a delegation whose interests oppose yours forces a working model of their
      position, and tests it repeatedly.
  - code: ALC3
    how: >-
      The simulation is long enough for a relationship to deteriorate and be repaired, which is where
      transformation becomes visible rather than theoretical.
  - code: FLC3
    how: >-
      Delegations must persuade across a real divide, over days, and can see which arguments moved
      anyone.
objectiveIds: [peacebuilding--o1, peacebuilding--o3]
