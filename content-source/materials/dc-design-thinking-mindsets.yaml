provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, adaptations, delivery
  modes and a sensitivity note) from the Design Challenge activity guide, which supplied the purpose,
  the breakout discussion questions, the reading focus and the closing reflection. The reading in the
  source is IDEO.org's Field Guide to Human-Centered Design (pages 19-25); substitute any accessible
  guide to the same mindsets. The source Design Challenge investigates the mental health and wellbeing
  of Afghan females; this material is written to generalise to any design challenge, with that as the
  worked context. Linked to Agency in Learning objective 1 and Research Project objective 1.
