provenanceNote: >-
  Transcribed from the "Personal Interest Project (PIP) Assessment Rubric" resource: the four criteria
  (focus, methodology, knowledge and understanding, critical thinking), their passing descriptions, and the
  facilitator-comment prompts. The generous-reading note for personal and creative PIPs is added guidance,
  consistent with the planner's insistence that a PIP can take almost any form. Mapped to PIP objective 5.
