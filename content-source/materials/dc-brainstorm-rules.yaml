provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, a low-bandwidth
  adaptation and delivery-mode notes) from the Design Challenge activity guide, which supplied the
  purpose, the brainstorm rules (from IDEO's Design Kit) and the breakout discussion questions. Written
  to generalise to any design challenge; the source project investigates the mental health and
  wellbeing of Afghan females. Linked to Social Entrepreneurship objective 2 (developing a solution
  concept).
