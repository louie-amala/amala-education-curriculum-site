title: "How I have grown as a researcher"
summary: >-
  The end-of-course reflection page: the learner looks back at their "Where I am as a researcher" growth
  path, marks where they are now, and names one way they have grown and one thing they would still like to
  find out — in words or drawings.
facilitationContext:
- group
- independent
primaryContext: independent
learnerContent: |
  ## How I have grown as a researcher

  This is the last page of your research journey. Use it to look back and see how far you have come, in
  words or in drawings.

  On the page there is room to:

  - Look again at the growth path you marked on the first day, and mark where you are as a researcher now.
  - Draw or write one way you have grown — one thing you can do now that you could not do at the start,
    like asking, looking closely, keeping a record, or checking whether something is true.
  - Draw or write one thing about our hills you would still like to find out.

  There is no wrong answer, and no one marks this page right or wrong. It is yours, to see how you moved
  from guessing to finding out. Keep it in your research book.
