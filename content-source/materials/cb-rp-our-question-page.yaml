learnerContent: |
  ## Our research question and our three sub-questions

  At the top of this page is our whole group's research question: what happens to our hills without trees,
  and what changes when trees and plants grow back? Write it, draw it, or both.

  Below it, the page has room for our three sub-questions:

  - Before, our hills were …; now, they are … (what changed?)
  - What happens to a bare hill in the heavy rain, and in the hot sun?
  - What do trees, grass, and roots do for the soil, and for us?

  Next to each one, mark how we will find it out: by asking people and looking around us here, or from the
  source pack.

  Keep this page in your research book and look back at it often, so you always know what we are trying to
  find out.
