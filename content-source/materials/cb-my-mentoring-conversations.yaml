# Programme-level student worksheet (resource) for the Learning Bridge+ (Cox's Bazar) edition. The
# learner's side of Mentoring and Wellbeing, which the programme calls "the spine of wellbeing
# support" but which had no learner-facing artefact at all: every mentoring page existed for the
# educator. This is the page a learner keeps in their own book so a conversation carries to the next
# one, and so the goal set in Agency in Learning stays alive between sessions.
#
# NOT a record of what a learner disclosed. It records only what the LEARNER chooses to carry
# forward, their next step. The educator's light paper record stays with the educator. This
# separation is deliberate: the learner's book travels home with them, so it must never be a place a
# disclosure is written down.
#
# Belongs to no single unit, it spans all 12 weeks. Its printable version compiles into the
# programme-wide student workbook (Part 4), not into a component workbook.
id: cb-my-mentoring-conversations
slug: cb-my-mentoring-conversations
access: partner
edition: learning-bridge-coxs-bazar
type: resource
title: "My mentoring conversations"
summary: >-
  The learner's page for their 1:1 mentoring: who their mentor is, and, for each conversation, the one
  step they agreed to take next, marked when it is done. Carried across the whole programme so each
  conversation starts from the last one rather than from nothing, and so a return after absence picks
  up where the learner is.
facilitationContext:
- one-to-one-mentoring
primaryContext: one-to-one-mentoring
learnerContent: |
  ## My mentoring conversations

  You meet your mentor for a short conversation most weeks. This page is yours. It is here so that each
  conversation can carry on from the one before, instead of starting again every time.

  At the top, write or mark:

  - Who my mentor is.
  - When we usually meet.

  Then there is one row for each conversation, with room to:

  - Mark the date, or just the week number.
  - Draw or write the one step you will take before you meet again. One step, small enough that you
    can really do it.
  - Tick it when it is done.

  ## What goes on this page, and what does not

  Only the step you choose to take next goes here. What you talk about with your mentor does not go on
  this page. If you talk about something hard, that stays between you and your mentor. You do not have
  to write it anywhere, and no one will ask you to.

  You never have to share this page with the group. You do not have to write: a drawing or a mark is a
  full answer.

  ## If you miss some weeks

  Leave the rows empty and start again at the next one. Coming back is progress. Your mentor will help
  you pick a step from where you are now, not from where the plan says you should be.
educatorContent: |
  Give every learner this page at the start, inside their book, and use it in the 1:1 time you already
  fold into the weekly in-person hours. It takes the last two minutes of the conversation, not the whole
  of it.

  Close every conversation on it. Whatever the conversation was about, end by agreeing one step the
  learner will take before you next meet, and have them draw or write it here. Open the next conversation
  by looking at that row together. That is the whole mechanism: it is what makes a series of short
  conversations into one continuous relationship, and it is what keeps the Agency in Learning goal alive
  between sessions.

  Keep disclosures off this page. This book goes home with the learner. Your own light paper record,
  what you noticed, what concerned you, stays with you, held under NRC's policy. Nothing a learner tells
  you in confidence is written in their book. If something surfaces that needs referral, follow NRC's
  MHPSS and protection referral pathway: notice, steady, refer. You are not a counsellor, you never
  promise secrecy, and you do not write it down here.

  Coach, do not rescue. If a step was not taken, that is information, not failure. Ask what got in
  the way, make the next step smaller, and let the learner take it.

  After an absence, do not work back through the empty rows. Re-anchor the goal, agree one small step,
  and fill the next row. A return is progress, not a fresh start.

  What learners record here, the steps they set themselves, and how they adjust when a step does not
  work, is evidence for the Set and Pursue Goals (FSL2) judgement. Read it alongside their learning book
  when you assess at Week 6 and Week 12.
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  - control-of-future-pathways
  how: >-
    The learner, not the mentor, decides and records the next step, so the mentoring relationship builds
    a habit of self-direction rather than dependence. Keeping only the step, and never the conversation,
    also makes the page safe to own: the learner controls what is written about them, which in a context
    where much is decided for them is itself an experience of agency.
