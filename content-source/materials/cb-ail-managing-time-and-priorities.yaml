# Contextualised, fully offline adaptation of ail-managing-time-and-priorities for Learning Bridge+ (Cox's Bazar).
# Oral and visual first, ~60 min facilitated.
id: cb-ail-managing-time-and-priorities
slug: cb-ail-managing-time-and-priorities
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "One small slot for me"
summary: >-
  Learners map a normal camp week in pictures, then protect one small, realistic slot to work towards
  a goal, planning what to drop when a week gets hard so wellbeing is kept, not traded away.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners map their week and pick one realistic slot alone, then test it with a
    same-gender partner. The peer step matters: saying a plan aloud and being asked what would really
    get in the way is what turns a hopeful timetable into an honest one, so keep the pairing even if
    you shorten your modelling.
- context: one-to-one-mentoring
  how: >-
    A strong fit, and often the most honest setting for this. A mentor can help a learner name the
    caring, work, and family duties that really compete for their time, without the learner feeling
    they must look more free than they are. Have the learner arrive with a rough picture of a normal
    week so the time goes on finding a real slot.
- context: independent
  how: >-
    Workable but weaker: a learner alone tends to plan for an ideal week, not a real one. The workbook
    week-strip and the one small slot rule carry it, but ask them to say their slot to a peer or
    mentor, since another person spots the slot that will not survive a normal camp week.
duration: "About 1.5 hours in the unit plan (generous for this oral/visual, translated cohort, the step timings below are the active teaching core; the rest is warm check-in, drawing, and translation), plus a 30 min independent task"
grouping: "Individual mapping, then same-gender pairs; works with 10-35 learners"
whatLearnersDo:
- Map a normal week in pictures, including family, work, caring and prayer, not just study.
- Choose one small, realistic slot you can protect for working towards your goal.
- Pick the one next step that fits that slot, and decide what you will drop if the week gets hard.
- Test your plan with a partner, then commit to it until the next session.
materialsAndPreparation:
- The student workbook (a week-strip of seven day-boxes to mark with simple pictures).
- Small stones or caps to lay on the day-boxes for fixed duties and for the one protected slot, so no writing is needed.
- Your own honest example of a busy week with one protected slot marked in it, to draw and model before learners plan.
- "Sensitivity: a real week can expose caring loads, work, or hardship at home. Let learners keep the details private, share only a general shape, and never require anyone to explain why a day is full."
facilitationNotes: |
  Between-session progress is where goals are reached or quietly abandoned, and time decides which.
  The one thing to get right is that plans are honest about the learner's real life: study competes
  with family, work, caring and much else, and a plan that ignores that fails in the first week and
  leaves the learner feeling they are the problem. Aim for one small, protected slot a learner can
  truly keep, not an ambitious timetable. Say aloud that protecting rest is part of the plan, not a
  reward for finishing it. Resist making anyone feel they should have more time than they do.
steps:
- title: "Map a normal week honestly, in pictures"
  duration: "14-16 min"
  guidance: |
    Have learners map a normal week as it really is: the fixed things first (family, work, caring,
    fetching water, prayer, rest), then the gaps that are left. Say aloud that the point is to see the
    real shape of the week before planning any study into it. Draw your own busy week first so no one
    feels theirs is too full to admit. Keep it quick and concrete; a rough picture-strip is enough.
  keyPrompts:
  - What are the fixed things in your week that you cannot move?
  - Where in a normal week do you actually have a little time that is your own?
  - What tends to eat the time you thought you had?
  watchOuts:
  - Learners map an ideal week rather than a real one; ask about last week specifically, not a typical week, since the real week is where the honest gaps and pressures show up.
  adaptation: |
    With no planner or device, lay a stone on each day-box for a fixed duty, or count the days on
    fingers and say them aloud. The honest picture matters more than the format.
- title: "Protect one small, realistic slot"
  duration: "14-16 min"
  guidance: |
    Ask each learner to choose one small slot in their real week, as little as twenty or thirty
    minutes, that they can genuinely protect for working towards their goal. Steer them away from grand
    timetables towards one slot they can actually keep. Have them mark where it sits, say what might
    threaten it, and how they will guard it. Say aloud that one kept slot beats five hopeful ones that
    never happen.
  keyPrompts:
  - Which one slot could you realistically protect for your goal this week?
  - What is most likely to steal that slot, and how could you guard it?
  - Is this slot small enough that you could keep it even in a hard week?
  watchOuts:
  - A learner marks several hours they will not keep; push for one small, protected slot, because a plan that assumes a good week collapses the moment the week is ordinary.
  adaptation: |
    A single bright stone or cap laid on one day-box marks the protected slot clearly, and can be moved
    if the week changes, without any writing.
- title: "Match the next step to the slot, then plan for a hard week"
  duration: "14-16 min"
  guidance: |
    Have learners choose the one next step towards their goal that actually fits the slot they
    protected, not the biggest step they wish they could take. Then plan for the week going wrong: this
    is the same if–then they drew in their action plan, if the week gets hard, then they do the smaller
    thing instead of giving up. Say aloud, in advance, what they will drop or shrink if time runs short,
    so a hard week costs them progress rather than their wellbeing or confidence. Finish by pairing
    learners to test each other's plans in same-gender pairs.
  keyPrompts:
  - What is one step towards your goal that genuinely fits the time you have protected?
  - "Your if–then for the week: if it gets hard, then what smaller thing will you do instead of giving up?"
  - What is the smallest version of this step that would still count as progress?
  watchOuts:
  - Learners treat a missed week as failure and stop; say clearly, in advance, that a smaller step, or picking the slot back up next week, is the plan working, not the plan breaking.
  adaptation: |
    If pairing is hard in stop-start attendance, the facilitator plays the partner and asks each
    learner aloud what would really threaten their slot.
closing: |
  Ask two or three learners to say their protected slot and first step aloud, and one thing they will
  drop if the week gets hard. Say that the plan lives in their workbook and is meant to be adjusted,
  not obeyed. Remind them that protecting time and wellbeing is a skill they are practising, and that a
  small step kept every week beats a big plan kept for none. Independent task: keep your slot once this
  week, then mark in the workbook whether it happened and what threatened it.

educatorContent: |
  ## What you need to know before you teach this

  Between-session progress is where goals are reached or quietly abandoned, and time decides which.
  This is not a time-management lesson in the office sense, most of what fills these learners' weeks
  is not theirs to move.

  ### Start from an honest week, or the whole block is theatre

  Learners will draw the week they think they should have: study, study, study. That plan dies on day
  one, and the learner concludes they are undisciplined.

  So map the real week first, in pictures, and put everything in it. Family, work, caring, cooking,
  water, prayer, the walk, rest. Say plainly that all of it is legitimate and none of it is in the way.
  A learner who is caring for three siblings does not have a time-management problem.

  Go first with your own honest week, including the parts that are not work.

  ### Then find one slot, one, and make it small

  Not a schedule. One slot, small enough to be real, in a gap that actually exists.

  Fifteen minutes is a fine slot. Learners will offer an hour a day because that sounds serious; an
  hour a day will not happen and its failure will cost you the learner's belief in the whole plan.
  Push down, not up. Then ask the test question: *did that happen last week, in that gap, reliably?*

  Attach it to something that already happens. After the morning meal, while the rice cooks, on the
  walk back. An anchored slot survives; a floating one does not.

  ### Important, and easy to miss: it does not have to be sitting down

  Much of what these learners are working on can be done while doing something else. Saying English
  sentences while walking or carrying. Practising sounds while cooking. Thinking through a research
  question while queuing.

  For a learner whose whole week is accounted for, this is not a consolation prize. It may be the only
  slot that exists. Teach it as a legitimate first choice, not a fallback.

  ### The priority idea, in one move

  Not a matrix. One question: **of the things I could do towards my goal, which one moves it most?**

  Learners default to the easiest task, because finishing something feels good. Name that pattern out
  loud, it is very human and completely normal, then ask them to do the important thing first, while
  they still have energy, and let the easy thing wait.

  ### Plan the hard week before it arrives

  Every learner decides now what they will drop when the week goes badly, and what the smallest version
  of their step looks like. This is the same move as the if–then, applied to the slot rather than the
  step, and it is what stops one bad week becoming the end.

  ### Do not let this become moral

  There is a strong pull towards discipline language, commitment, dedication, making sacrifices. Avoid
  it. A learner who misses their slot because their mother was ill has not failed at anything. Keep the
  frame practical: what happened, what would fit better, what shall we try next week.

  ## Before they leave this block

  - An honest week map that contains more than study.
  - ONE protected slot, small, anchored to something that already happens.
  - The next step chosen to fit that slot, not the other way round.
  - A decision about what the hard-week version looks like.
learnerTeaching:
  title: "How to find time that actually exists"
  readAloud: |
    ## How to find time that actually exists

    Your goal will be reached, or quietly given up, in the days between our sessions. What decides it
    is whether you have real time for it.

    ### First: draw your week as it really is

    Not the week you think you should have. The real one.

    Put everything in it, family, work, looking after children, cooking, water, prayer, walking, rest.
    All of it.

    **None of that is in the way of your learning.** It is your life, and it is not a fault. We are not
    trying to remove it. We are looking for where a small piece of learning could fit inside it.

    ### Then: find ONE slot, and make it small

    Not a timetable. One slot.

    Small. Fifteen minutes is a real slot. An hour every day is not, for most people, and when it does
    not happen you will feel you failed, when really the plan was wrong.

    Ask yourself honestly: **did that gap actually happen last week?** If not, choose a different one.

    ### Tie it to something that already happens

    A slot floating in the day gets lost. A slot attached to something that already happens survives.

    - After the morning meal.
    - While the rice is cooking.
    - On the walk back.
    - Just before sleeping.

    ### It does not have to be sitting down

    This is important, especially if your week is completely full.

    A lot of what you are learning can be done while you do something else:

    - Say your English sentences while you walk.
    - Practise your sounds while you cook.
    - Think about your question while you queue.

    That is not second best. For many people it is the only time that exists, and it works.

    ### Do the important thing first, not the easy thing

    When you finally have your slot, you will want to do the easiest task, because finishing something
    feels good. Everybody does this.

    But ask: **which of these moves my goal the most?** Do that one first, while you still have energy.
    The easy one can wait.

    ### Now plan for the bad week

    Some weeks will go wrong. Decide now, not then:

    - What will I drop?
    - What is the smallest version of my step that still counts?

    A week where you did the tiny version is a week you kept going. That is completely different from a
    week where you stopped.
  words:
    - term: slot
      meaning: a small piece of time you protect for working on your goal
    - term: anchor
      meaning: something that already happens every day, that you attach your slot to
    - term: priority
      meaning: the thing that moves your goal most, out of everything you could do
  tryIt:
    intro: >-
      Is each of these a slot that will survive a real week, or one that will not? Circle your answer,
      then check at the back of the book.
    chooseFrom: ["will survive", "will not"]
    items:
      - "I will study for one hour every evening."
      - "I will say my English sentences while I walk to fetch water each morning."
      - "I will work on my goal whenever I get some free time."
      - "After the evening meal, before I clear up, I will do ten minutes on my goal."
    answers:
      - "Will not. An hour a day is a lot, and the first evening it does not happen you will feel you failed. Try fifteen minutes. You can always do more."
      - "Will survive. It is small, it is attached to something that already happens every day, and it does not need you to sit down."
      - "Will not. \"Whenever I get free time\" is not a slot, free time does not arrive on its own, it gets taken. Name a real moment in a real day."
      - "Will survive. Small, anchored to something that already happens, and at a moment you can picture. This is exactly the right shape."
    then: >-
      Now find your own slot. Say what it is anchored to, and how long. Then decide what you will do in
      a week that goes badly.
worksheet:
  slug: cb-ail-my-time-page
  note: "In the learner's book (My Learning Book): the 'My time' page. Print one per learner."
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  how: >-
    Deciding when and how you will work towards your goal, within the real limits of camp life, is a
    direct act of self-direction: the learner, not the week or their circumstances, chooses where their
    effort goes. Planning for a hard week, and protecting rest as part of the plan, keeps the power over
    their own wellbeing in their hands rather than trading it away for progress.
principlesForegrounded:
- lifeworthy-competencies
- responsible-action
- connect-to-futures
principleAlignment:
- principle: lifeworthy-competencies
  how: >-
    Managing time and priorities against real, competing demands is a habit these learners will reuse
    long after the course; the activity practises it on their own goal and their own week rather than
    teaching it in the abstract, and needs no literacy to keep using.
- principle: responsible-action
  how: >-
    Learners take ownership of their progress between sessions by committing to a slot they can honestly
    keep, and are helped to sustain their wellbeing while doing so by planning for hard weeks rather
    than pushing through them.
- principle: connect-to-futures
  how: >-
    The protected slot and next step are chosen to move a personal goal forward, so managing this
    week's time is explicitly tied to the future the learner is building rather than to getting through
    the session alone.
competencyCodes:
- ASL2
- FSL2
competencyDevelopment:
- code: ASL2
  how: >-
    Mapping a real camp week, protecting one realistic slot, and planning what to drop when time runs
    short is direct practice in managing time, priorities and wellbeing; the week-plan is the evidence a
    learner can balance competing demands without sacrificing themselves.
- code: FSL2
  how: >-
    Turning a goal into a protected slot and a concrete next step between sessions is the pursue in
    setting and pursuing goals; the plan and the step taken show the learner moving from intention to
    deliberate progress.
