provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, a low-bandwidth
  adaptation and delivery-mode notes) from the Design Challenge activity guide, which supplied the
  purpose, the guidance on what a problem statement is and the discussion and feedback questions. The
  "5 whys" sharpening step generalises a standard root-cause technique. Written to generalise to any
  design challenge; the source project investigates the mental health and wellbeing of Afghan females.
  Linked to Research Project objective 1 and Social Entrepreneurship objective 1.
