  - "Credited in that plan to San Francisco Peer Resources, adapted from SOUL (School of Unity and Liberation)"
provenanceNote: >-
  The five-category frame comes from SOUL by way of the YPAR Hub's "Community Organizing" lesson plan,
  supplied to Amala in August 2026. The categories and their ordering along an accepts/challenges axis
  are the source's. The explicit statement that this is not a ranking of moral worth, the who-speaks
  test separating advocacy from organising, the note on how that distinction lands for communities that
  are advocated for constantly and organise rarely, and the move-one-step method are Amala's.
