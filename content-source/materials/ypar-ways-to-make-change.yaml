rights:
  status: own-expression
  holder: "School of Unity and Liberation (SOUL), by way of San Francisco Peer Resources and the UC Berkeley YPAR Hub"
  basis: >-
    A five-category taxonomy of responses to a problem is an idea rather than an expression. Every word
    on this page, including all category descriptions and examples, is written from scratch, and the
    originating organisation is credited and linked.
  note: >-
    Do not paste in the source's chart or its worked example. The insistence that this is not a ranking
    of moral worth is a deliberate Amala addition; do not edit it out.
sourceRefs:
