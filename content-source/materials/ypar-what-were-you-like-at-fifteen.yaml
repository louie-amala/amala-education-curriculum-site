provenanceNote: >-
  Rewritten from the YPAR Hub's "Flashback to Adult Partners' Younger Years", supplied to Amala in
  August 2026. The pairing structure and the closing question, which the source itself marks as the most
  important one, are the source's. The adjustment of the questions away from settled-life assumptions,
  the briefing for adults that they are answering rather than facilitating, and the step that turns the
  final answers into a written list of commitments are Amala's.
