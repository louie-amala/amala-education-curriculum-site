provenanceNote: >-
  Rewritten from three of the five activities in the YPAR Hub's "Verbal Communication" lesson plan,
  supplied to Amala in August 2026. Island Paradise from the same plan is separated out at
  [island paradise](/materials/ypar-island-paradise). Widget Assembly is deliberately not carried
  across: it requires a large collection of LEGO, craft-paper rolls and partitions, which is not a
  realistic ask of Amala's delivery partners, and [the trust walk](/materials/ypar-trust-walk) teaches
  the same lesson about instructing someone who cannot see what you can see, at no cost.
