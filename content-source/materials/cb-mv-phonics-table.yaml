  reference chart of all 44 English sounds, filled in by writing example words and assuming Home-Language
  literacy; this version is cut down to the Unit 1 sounds only (short a, o, u; s, t, l, m, n; hard "k"; the
  plosive pairs p, t, k, b, d, g) and rebuilt as a visual, picture-led chart a pre-literate learner grows
  in their My Voice book. A drawn picture, the English word, and the learner's own word or translation
  per sound, with writing kept optional. It keeps the sources' cumulative, learner-owned framing.
