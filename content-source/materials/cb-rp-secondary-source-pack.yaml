# Contextualised, fully offline SECONDARY SOURCE PACK for the Research Project component of Learning
# Bridge+ (Cox's Bazar). Shared challenge: what is happening to the trees on the hills where we live.
# Each source has three reading levels (original / B1 / A1-A2), a per-source glossary feeding the
# programme word bank, and printed source-checking signals (corroboration-led) for offline evaluation.
