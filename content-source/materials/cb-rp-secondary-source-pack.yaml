# Bridge+ (Cox's Bazar). Shared challenge: what is happening to the trees on the hills where we live.
# Each source has three reading levels (original / B1 / A1-A2), a per-source glossary feeding the
# programme word bank, and printed CRAAP trust signals for offline source-evaluation. DRAFT for review.
