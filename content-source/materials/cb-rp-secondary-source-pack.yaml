educatorContent: |
  ## About this source pack

  This is the supplied pack of secondary sources for the Research Project. There is no internet in the
  camps, so secondary research is done from this curated pack, not from searching online.

  Every source is given at three reading levels: the real original article (authentic English, for you
  and the strongest readers, and to show learners we simplified from something real), a B1 version, and
  a simpler A1/A2 version. Most learners read the B1 or A1/A2 version; read aloud for learners still
  building fluency. The pack is also an English-development resource, so the graded texts carry real
  information and grow in difficulty — they are scaffolded, not dumbed down.

  The pack deliberately mixes strong sources with a weak one, so evaluating sources (course objective 3)
  has something real to bite on. We teach source-checking as THREE MOVES, not a long checklist, and we
  lead with corroboration — because that is what skilled fact-checkers actually do: they do not just
  study a source on its own, they check it against others. (Online this is called lateral reading;
  offline, with a curated pack and no internet, it becomes triangulation.) The three moves: (1) Who made
  this, and why? (2) How do they know — and is it still true? (3) Does it hold up when we check it
  against the OTHER sources and against what WE found? Each card prints the signals that feed these moves
  (who, when, why, whether they show their evidence, and whether it agrees with the rest), so learners
  can judge a source without going online. The strongest evidence is what several sources AND our own
  primary research agree on. (We deliberately move past the old CRAAP-style checklist, which research
  finds novices apply poorly, toward this corroboration-first habit.)

  The pack also follows the arc of the challenge, not just the problem: some sources show what people are
  already doing to help (planting on the bare slopes, and giving families gas so fewer trees are cut),
  and two ask whether it is working. This lets learners investigate the fourth sub-question — what are
  people doing to help our hills, and is it working — from the sources and from their own community. And
  notice that the "it is working" sources come from the groups that did the work, so they are exactly
  where the weighing habit matters most: good news from an interested source is still to be checked.

  Every word explained on a card also collects in the programme word bank at the end.

  ## Copyright, decided per source

  - Source A (The Conversation): CC BY-ND — reproduce the whole original with attribution; our B1/A2
    texts are our own summaries of the facts, not edits of their wording.
  - Source B (FAO): reproduced under FAO's educational, non-commercial permission, with attribution.
  - Source C (UN in Bangladesh): reproduced for educational, non-commercial use, with attribution.
  - Source D (Grow Billion Trees): commercial, all rights reserved — not reproduced; cited and
    summarised only. Fittingly, the least trustworthy source is also the one we cannot copy.
  - Source E (USGS): US Government public domain — free to reproduce with a courtesy credit.
  - Source F (Rohingya Khobor): community outlet, rights reserved — not reproduced; cited and
    summarised only.
  - Source G (Atmosphere / MDPI): open-access science journal (CC BY) — free to reproduce with
    attribution. (Author list to confirm at the source.)
  - Source H (UNHCR): UN agency story, reproducible for educational, non-commercial use with attribution;
    not reproduced here (full text not to hand). Date and any quotes to confirm at the source.
  - Source I (IOM): UN agency, reproducible for educational, non-commercial use with attribution.
  - Source J (FAO): UN agency report, reproducible for educational, non-commercial use with attribution.
  - Source K (One Tree Planted): tree-planting charity, rights reserved — not reproduced; cited and
    summarised only.

  ## Teacher master reference list

  - A. Thompson, S., Correa, D., Duncan, J. and Crompton, O. "Deforestation can raise local temperatures
    by up to 4.5C." The Conversation, 15 November 2021. Based on a peer-reviewed study in Environmental
    Research Letters. Strong: named experts, peer-reviewed, funding disclosed, tropical focus.
  - B. FAO Regional Office for Asia and the Pacific. "Protecting 45,000 Rohingya Lives Ahead of
    Life-Threatening Landslides." 28 April 2026. Strong, but reports FAO's own programme; specific
    verifiable figures.
  - C. FAO / United Nations in Bangladesh. "Nearly half a million trees planted in two months." 7 January
    2020. High authority but dated; planted by local villagers, not refugees — pair with B to teach
    currency.
  - D. Grow Billion Trees. "How Can Trees Help Prevent Soil Erosion?" growbilliontrees.com. Weak: no
    author, no cited evidence, odd date, sells tree-planting. Rank lowest.
  - E. U.S. Geological Survey (USGS), Water Science School. "Surface Runoff and the Water Cycle."
    usgs.gov. US Government public domain. Strong and unbiased: a government science service, freely
    given, nothing sold. Fills the sub-question 2 gap so the weak blog is not the only erosion source.
  - F. Ro Maung Shwe / RK News Desk. "Rohingya Youth Form Environmental Network to Protect Camps from
    Growing Ecological Crisis." Rohingya Khobor, 12 December 2025. Low authority: a community advocacy
    outlet, no citations or quotes — a valuable local voice, but not proof.
  - G. "Land Cover Changes and Land Surface Temperature Dynamics in the Rohingya Refugee Area, Cox's
    Bazar, Bangladesh: An Analysis from 2013 to 2024." Atmosphere (MDPI), 2025. doi:10.3390/atmos16030250.
    Strong: peer-reviewed, local, quantitative, open-access. Full author list unverified — see below.
  - H. UNHCR. "Rohingya refugees restore depleted forest in Bangladesh." Around 2021 (exact date unverified).
    First-person refugee testimony (a plantation guardian) — powerful but a single voice, not
    independently verified.
  - I. IOM. "UN Agencies and Government Distribute LPG Stoves to Rohingya Refugees to Save Remaining
    Forests." iom.int. A response people made (gas instead of firewood); reports its own work.
  - J. FAO. "Restoring degraded land in Rohingya refugee camps in Cox's Bazar, Bangladesh." openknowledge.fao.org.
    An effectiveness source — the success story told by the group that did the work; deliberately paired
    with a counter-fact (recovery is partial) to teach weighing claims of success.
  - K. One Tree Planted. "How trees improve soil quality." onetreeplanted.org. A tree-planting charity —
    an interested source on the benefits of trees; weigh it against the science sources (A, E). Strengthens
    sub-question 3 (what trees do for the soil and for us).

  ## What this set covers, and its two loose ends

  The set spans the credibility range AND the arc of the challenge — the problem (deforestation →
  landslides, heat), what people are doing about it (planting, and gas instead of firewood: Sources B,
  C, H, I), and whether it is working (Sources G and J, weighed critically).

  Two provenance details could not be verified when the pack was built, because both hosts blocked
  automated checking: Source G's full author list, and Source H's exact date. Neither affects how the
  source reads or how much weight it can bear — but if you have a way to check them, do, and correct
  the line here. If a learner asks, "we do not know exactly" is an honest and useful answer.
learnerContent: |
  ## How to use this pack

  - Each source has three versions: the real article, an easier B1 version, and a simplest A1/A2
    version. Read the one that is right for you, or listen while your teacher reads.
  - Do not believe a source just because it sounds right. Check it, with three questions: Who made it,
    and why? How do they know — and is it still true? And the big one: does it agree with the OTHER
    sources, and with what WE found by asking and looking?
  - Add what you find to your evidence log. The strongest evidence is what many sources AND our own
    research agree on. One source on its own — even a good one — is only a start.

  ## Which sources for which question

  Each sub-question has several sources, so a group can take one sub-question, read its sources, compare
  them, and check one against another — then teach the rest of us what they found.

  - Sub-question 1 — before and now (what changed?): Sources B, C, F, G, H
  - Sub-question 2 — a bare hill in the rain and the hot sun: Sources A, B, D, E, G, K
  - Sub-question 3 — what trees, grass, and roots do for the soil and for us: Sources A, D, E, G, K
  - Sub-question 4 — what people are doing to help, and is it working: Sources B, C, F, H, I, J

  Source D (the company's website) is our weak source on purpose — use it to practise checking, not as
  strong evidence.

  ## Source A — Trees keep the land cool

  Helps with sub-questions 2 and 3 (a bare hill in the hot sun; what trees do). Reading level: B1.

  ### The original article

  Thompson, Correa, Duncan and Crompton, "Deforestation can raise local temperatures by up to 4.5C," in
  The Conversation, 15 November 2021. Read it at [theconversation.com](https://theconversation.com/deforestation-can-raise-local-temperatures-by-up-to-4-5-and-heat-untouched-areas-6km-away-163584).
  Your facilitator has the whole article, in the real English, if you want to see it.

  ### Read it (B1)

  Trees help keep the land cool, and cutting them down makes a place hotter. A tree pulls water up from
  the soil, through its body, and out of its leaves into the air. When the water changes into vapour, it
  carries heat away with it — the same way your skin feels cold when you step out of the water. This is
  called evaporation. Scientists at a university in Australia say that one tree in a hot country can cool
  the air around it about as much as two air-coolers running all day.

  When many trees are cut down, this cooling stops and the land heats up. The scientists used pictures
  from satellites — cameras high above the Earth — to measure the heat. They found that cutting the
  forest can make a place up to 4.5 degrees Celsius hotter. The heat even reaches nearby forest that was
  not cut down, up to 6 kilometres away. Hotter land is also harder for farming: for every 1 degree
  hotter, farmers grow about 3 to 7 percent less food.

  ### Read it (simpler, A1/A2)

  Trees keep the land cool. A tree takes water from the ground and lets it out through its leaves into
  the air. This makes the air cooler. When people cut the trees, the land gets hot. Scientists say a
  place with no trees can be much hotter — up to 4.5 degrees hotter. Hot land is also hard for growing
  food.

  ### New words

  - vapour — water that has turned into a gas in the air
  - evaporation — when water changes into vapour and rises into the air
  - satellite — a machine high above the Earth that can take pictures of the ground
  - degree Celsius — the unit we use to measure how hot or cold something is
  - percent — a part of one hundred
  - scientist — a person who studies the world carefully to find out how it works

  ### Can we trust it?

  - Who? Four named university scientists.
  - When? 2021. The science does not go out of date.
  - Why? To explain their research to ordinary people.
  - Do they show how they know? Yes — a study other scientists checked, and they say who paid for it.
  - Check it another way: does it match the other sources and our own hills?

  ## Source B — Making the bare hills safe again

  Helps with sub-questions 1, 2, and 4 (before and now; a bare hill in the rain; what people are doing). A local action. Reading
  level: B1.

  ### The original article

  Food and Agriculture Organization of the United Nations (FAO), Regional Office for Asia and the
  Pacific, "Protecting 45,000 Rohingya Lives Ahead of Life-Threatening Landslides," 28 April 2026. Read
  it at [fao.org](https://www.fao.org/asiapacific/news/news-detail/protecting-45-000-rohingya-lives-ahead-of-life-threatening-landslides/en).

  The Food and Agriculture Organization of the United Nations (FAO) in Bangladesh has received USD
  584,369 from the Bangladesh Humanitarian Fund to carry out urgent slope stabilization and community
  preparedness work, to protect Rohingya households from landslide risks before the monsoon season. The
  work covers about 170 hectares of high-risk slopes at 85 sites in 15 camps, and includes planting
  deep-rooted native vegetation, building bamboo crib walls, digging contour trenches, and offering
  Cash-for-Work to 800 people, protecting over 45,000 refugees. Since 2018, through the Safe Access to
  Fuel and Energy Plus (SAFE+) programme, FAO says it has stabilized over 3,500 hectares of degraded
  slopes. Your facilitator has the whole article, in the real English, if you want to see it.

  ### Read it (B1)

  On the hills where the camps stand, the forest was cut down to make room for people, and the hills
  became bare. When the heavy monsoon rain falls, the soil slides down the bare slopes. These landslides
  are dangerous — they can bury shelters, block escape routes, and hurt people.

  The Food and Agriculture Organization (FAO), a part of the United Nations, is working to make the hills
  safe again and to protect more than 45,000 people before the monsoon comes. The workers use three main
  methods. They plant native grasses and small trees with deep, strong roots that hold the soil like
  ropes under the ground. They build low walls of bamboo across the slope, called crib walls. And they
  dig long lines across the hill, called contour trenches, to slow the rain water so it does not rush
  straight down.

  In 2025 and 2026 this work was done on about 170 hectares, at 85 places in 15 camps. Since 2018, FAO
  says it has made more than 3,500 hectares of slope safer. About 800 people from the camps do the work
  and are paid for it through Cash-for-Work, so it protects the hills and gives families money at the
  same time.

  ### Read it (simpler, A1/A2)

  The hills in the camp have no trees now. When the big rain comes, the ground slips down the hill. This
  is a landslide. It can hurt people and break homes.

  A group called the Food and Agriculture Organization (FAO) wants to make the hills safe. Workers plant
  grass and small trees. The roots hold the ground. They build small walls of bamboo on the hill. People
  from the camp do this work. They get money for it.

  ### New words

  - Food and Agriculture Organization (FAO) — a part of the United Nations that helps countries with food, farming, and land
  - monsoon — the season of very heavy rain
  - landslide — when soil and rock slide down a hill
  - slope — the sloping side of a hill
  - native plants — plants that grow naturally in a place
  - roots — the part of a plant that grows under the ground and holds it in place
  - bamboo — a tall, strong plant with hard, hollow stems
  - crib wall — a low wall, here made of bamboo, built across a slope to hold the soil
  - contour trench — a long, shallow ditch dug across a hill to slow rain water
  - hectare — a unit for measuring land, about the size of a large sports field
  - Cash-for-Work — paid work given to community members on a local project

  ### Can we trust it?

  - Who? A United Nations agency — experts.
  - When? 2026 — this is new.
  - Why? It reports FAO's own work, so it shows the work in a good light.
  - Do they show how they know? Yes — clear numbers and a named spokesperson.
  - Check it another way: does it agree with the other sources and with what we saw on our hills?

  ## Source C — Half a million trees

  Helps with sub-questions 1 and 4 (before and now; what people are doing). A local action, and a lesson about old news. Reading level:
  A2.

  ### The original article

  Food and Agriculture Organization of the United Nations (FAO) / United Nations in Bangladesh, "Nearly
  half a million trees planted in two months," 7 January 2020. Read it at [bangladesh.un.org](https://bangladesh.un.org/en/30306-nearly-half-million-trees-planted-two-months-fao-restores-degraded-watersheds-and-forests-cox).

  Through the SAFE Plus project, a collaboration between FAO, IOM and WFP, nearly half a million tree
  seedlings were planted near the Rohingya camps. During October and November, local workers from poor
  communities planted 475,000 seedlings across 571 hectares; with more inside and around the camps, the
  total reached one million trees, replacing losses from building the camps and from firewood. The
  project also started 16 new nurseries. The new forests sit on high land that catches rainwater for
  rivers and streams, and forests like these hold the soil, stop landslides, and keep water clean. Your facilitator has the whole
  article, in the real English, if you want to see it.

  ### Read it (B1)

  A few years ago, in 2020, a large tree-planting took place near the camps. In just two months, in
  October and November, workers planted 475,000 young trees — nearly half a million — on 571 hectares of
  bare land. With more trees planted inside and around the camps, the total reached about one million
  trees. The planting was meant to bring back the forest that was cut down when the camps were built and
  when families cut wood to cook.

  The work was done by the Food and Agriculture Organization (FAO) together with two other United Nations
  groups, under a project called SAFE Plus. Most of the planting was done by local Bangladeshi workers
  from poor villages nearby — not by Rohingya refugees. The project also started 16 new tree nurseries —
  places where young trees are grown — to keep a supply of trees and to give local people work. The new
  forests sit on the high land that catches rain water for the rivers. Forests like these hold the soil,
  stop landslides, and keep the water clean.

  ### Read it (simpler, A1/A2)

  In 2020, workers planted many young trees near the camps. In two months they planted about half a
  million trees on the bare land. They wanted to bring back the forest that was cut down. Local people
  from villages near the camps did most of the planting. Trees hold the soil, stop landslides, and keep
  the water clean.

  ### New words

  - hectare — a unit for measuring land, about the size of a large sports field (see Source B)
  - nursery — a place where young plants are grown until they are big enough to plant out
  - refugee — a person who has had to leave their own country to be safe
  - Food and Agriculture Organization (FAO) — see Source B
  - SAFE Plus — the name of a United Nations project in the camps (Safe Access to Fuel and Energy Plus)
  - forest — a large area of land covered with many trees

  ### Can we trust it?

  - Who? The UN and FAO — experts.
  - When? 2020 — this is old, five or more years ago. Does Source B tell a newer story?
  - Why? To report the programme's work.
  - Do they show how they know? Yes — clear numbers.
  - One thing to notice: the planters were local villagers, not refugees — easy to misread.
  - Check it another way: compare its date with Source B.

  ## Source D — "Trees stop erosion" (a company's website)

  Helps with sub-questions 2 and 3. A weak source, on purpose. Reading level: A2 to B1.

  ### The original article

  Not reproduced. This is a company's website (all rights reserved), so we may read it and name it, but
  not copy it into the pack — and that limit is itself worth noticing. Grow Billion Trees (no named
  author), "How Can Trees Help Prevent Soil Erosion?" at [growbilliontrees.com](https://growbilliontrees.com/blogs/knowledge/how-can-trees-help-prevent-soil-erosion).

  ### Read it (B1)

  A tree-planting company writes on its website that trees stop soil from being washed away. When rain
  falls on a bare hill, the water runs down fast and carries the soil with it. This is called erosion.
  The company says that tree roots hold the soil in place, and that the leaves of the trees slow the rain
  before it hits the ground, so less soil is lost. The website gives numbers — for example, that trees
  can cut soil loss by a large amount — but it does not say where these numbers come from, and no
  writer's name is given. The company sells a service: people pay it to plant trees.

  ### Read it (simpler, A1/A2)

  A company says that trees stop the soil from washing away. When rain falls on a bare hill, the water
  runs down fast and takes the soil with it. This is called erosion. Tree roots hold the soil. The
  company wants people to pay it to plant trees.

  ### New words

  - company — a business that sells something to make money
  - website — a page on the internet
  - erosion — when soil is slowly worn away and carried off by water or wind
  - roots — the part of a plant that grows under the ground and holds it in place (see Source B)

  ### Can we trust it?

  - Who? A company — no writer's name.
  - When? The date looks wrong (a future date).
  - Why? It sells tree-planting, so it wants trees to sound good.
  - Do they show how they know? No — numbers with no source.
  - Check it another way: the idea matches the stronger sources, but this one shows no proof and is
    selling something, so we trust it least.

  ## Source E — What happens to rain on a bare hill

  Helps with sub-questions 2 and 3 (a bare hill in the rain; what roots do). A strong, unbiased science source. Reading level: B1.

  ### The original article

  U.S. Geological Survey (USGS), Water Science School, "Surface Runoff and the Water Cycle." Read it at
  [usgs.gov](https://www.usgs.gov/water-science-school/science/surface-runoff-and-water-cycle). This is
  from the United States government science service, so it is free for anyone to use.

  "When falling raindrops strike bare soil, the impact causes both splash erosion and soil compaction,
  resulting in faster runoff and increased erosion." "Vegetation can slow the movement of runoff,
  allowing more time for it to seep into the ground."

  ### Read it (B1)

  When rain falls on land, it can do one of two things: soak into the ground, or run off the top. Which
  one happens depends a lot on whether the ground is covered with plants or is bare.

  On ground covered with grass and trees, the plants slow the rain down. The water has time to soak into
  the soil — this is called infiltration. The roots make small channels in the soil that help the water
  go down, and the roots hold the soil together.

  On bare ground it is different. The raindrops hit the soil hard and break it up. The water cannot soak
  in fast enough, so it runs off the top and carries the soil with it. The faster the water runs, the
  more soil it takes away — this is erosion. So plants do two jobs at once: they help the rain soak in,
  and they hold the soil in place. This is why a bare hill loses its soil and floods more easily than a
  hill covered in plants.

  ### Read it (simpler, A1/A2)

  When rain falls, it can soak into the ground or run off the top. On ground with plants, the rain soaks
  in and the roots hold the soil. On bare ground, the rain cannot soak in. It runs off fast and takes the
  soil with it. This is why bare hills lose their soil and flood more easily than hills with plants.

  ### New words

  - infiltration — when water soaks down into the soil instead of running off
  - runoff — rain water that runs off the top of the ground instead of soaking in
  - channel — a small path that water flows along
  - erosion — when soil is worn away and carried off by water (see Source D)

  ### Can we trust it?

  - Who? The United States Geological Survey (USGS), a government science service.
  - When? It is kept up to date, and this is basic science that does not change.
  - Why? To teach everyone about water, for free — there is nothing to sell.
  - Do they show how they know? Yes — this is well-known, tested science.
  - Check it another way: does it match what we saw when the rain fell on our own bare hills?

  ## Source F — Young people protect the camp

  Helps with sub-questions 1 and 4 (what is happening now; what people are doing), and shows a local voice. A community news story — low authority. Reading level: A2 to B1.

  ### The original article

  Not reproduced. This is a community news website (rights reserved), so we name it and summarise it but
  do not copy it. Ro Maung Shwe / RK News Desk, "Rohingya Youth Form Environmental Network to Protect
  Camps from Growing Ecological Crisis," Rohingya Khobor, 12 December 2025. Find it at
  [rohingyakhobor.com](https://rohingyakhobor.com/rohingya-youth-form-environmental-network-to-protect-camps-from-growing-ecological-crisis/).

  ### Read it (B1)

  A group of young Rohingya people in the camps have started their own group to look after the
  environment. They call it the Rohingya Environmental Protection Network. This story about them was
  written by Rohingya Khobor, a small news website run by Rohingya people to share news about their
  community.

  The young people pick up rubbish, clear the drains so the water can flow, and talk to their neighbours
  about caring for the camp. The writer says they are working hard to repair an environment damaged by
  years of crowding and displacement. The story is proud of them and wants others to support them.

  It is a local voice, close to the community. But it does not give numbers, it does not quote other
  people, and it does not say where its facts come from. It is telling a story it believes in, not
  checking it the way a scientist would.

  ### Read it (simpler, A1/A2)

  Some young Rohingya people have made a group to look after the camp. They pick up rubbish, clear the
  drains, and tell their neighbours to care for the environment. A small Rohingya news website wrote this
  story about them. The story is proud of them. It does not give numbers or say where its facts come from.

  ### New words

  - network — a group of people who join together to work on something
  - environment — the natural world around us: land, water, air, plants, and animals
  - drains — the channels that carry rain and dirty water away

  ### Can we trust it?

  - Who? A Rohingya community news website — written by people in the community, not scientists or a big organisation.
  - When? 2025 — this is new.
  - Why? To support and celebrate local young people — it is on their side.
  - Do they show how they know? Not really — no numbers, no other people quoted, no sources.
  - Check it another way: this is a real local voice worth hearing, but check its facts against the stronger sources.

  ## Source G — What the satellites show about our hills

  Helps with sub-questions 1, 2, 3, and 4 (before and now; the heat; what trees do; is it working). A strong, peer-reviewed local study. Reading level: B1.

  ### The original article

  A study in the science journal Atmosphere used pictures taken from satellites over our camps from 2013
  to 2024. Read it (open access, free to read and share) at [the journal](https://doi.org/10.3390/atmos16030250).
  (The paper's authors are listed at the source — to confirm when we print the pack.)

  ### Read it (B1)

  Scientists used pictures taken from satellites — cameras far above the Earth — to measure how the land
  around our camps changed from 2013 to 2024. They measured two things: how much of the land was covered
  in forest, and how hot the ground was.

  They found a big change. Between 2013 and 2018, as the camps were built, almost all of the forest was
  lost — a drop of 97 out of every 100 — and the built-up land grew fast. As the trees went, the ground
  got hotter, and the very hot areas grew much bigger.

  But there is hope in the numbers too. From 2018 to 2024, as the government and other groups planted
  trees and grass again, the hottest area stopped growing and even shrank a little. Bringing the green
  back is starting to cool the land.

  ### Read it (simpler, A1/A2)

  Scientists used pictures from satellites to look at our land from 2013 to 2024. They found that when the
  trees were cut down, the land got much hotter. Then, when people planted trees and grass again, the land
  started to cool a little. Green land is cooler than bare land.

  ### New words

  - satellite — a machine far above the Earth that takes pictures of the ground (see Source A)
  - study — careful work by scientists to find something out
  - journal — a book where scientists share studies that other scientists have checked
  - forest — a large area of land covered with many trees (see Source C)

  ### Can we trust it?

  - Who? Scientists, in a science journal that other scientists checked before it was shared.
  - When? 2024–2025 — new, and about our own area.
  - Why? To measure and understand what happened to our land — not to sell anything.
  - Do they show how they know? Yes — they measured it from satellite pictures, with numbers.
  - Check it another way: it agrees with what we feel (bare land is hotter) and with the other sources.

  ## Source H — A tree guardian's story

  Helps with sub-questions 1 and 4 (what is happening now; what people are doing). A refugee's own voice — one person's story. Reading level: A2 to B1.

  ### The original article

  Not reproduced here. This is a story from UNHCR, the United Nations refugee agency, about a Rohingya man
  who cares for young trees in the camps. Find it at [unhcr.org](https://www.unhcr.org/news/stories/rohingya-refugees-restore-depleted-forest-bangladesh).
  (Published around 2021 — the exact date is to be confirmed at the source.)

  ### Read it (B1)

  This is the story of a Rohingya man who works as a "plantation guardian" in the camps — he looks after
  the young trees that have been planted on the bare hills. He waters them and cares for them, and when a
  landslide tears young trees out of the ground, he plants them again. He also talks to his neighbours
  about why the trees matter.

  A story like this is powerful because it comes from someone who is really there, doing the work. But it
  is one person's story. It tells us what he sees and feels, not what is true for the whole camp — so we
  listen to it, and we also check it against what other people and other sources say.

  ### Read it (simpler, A1/A2)

  This is the story of a Rohingya man who looks after young trees in the camps. He waters them, and when a
  landslide pulls them out, he plants them again. He tells his neighbours why trees matter. It is one
  person's story — it tells us what he sees, but it is only one voice.

  ### New words

  - plantation guardian — a person whose job is to look after young trees
  - UNHCR — the United Nations agency that helps refugees
  - landslide — when soil and rock slide down a hill (see Source B)

  ### Can we trust it?

  - Who? A Rohingya man who does the work, told through UNHCR (the UN refugee agency).
  - When? A few years ago (about 2021).
  - Why? To share a real person's story and show the work being done.
  - Do they show how they know? It is what one person sees and does — true for him, but only one voice.
  - Check it another way: does his story match what we saw, and what the stronger sources say?

  ## Source I — Cooking with gas, not wood

  Helps with sub-question 4 (what people are doing to help, and is it working). A local action. Reading level: A2 to B1.

  ### The original article

  Reproduced with attribution under IOM's educational, non-commercial permission. International
  Organization for Migration (IOM), "UN Agencies and Government Distribute LPG Stoves to Rohingya
  Refugees to Save Remaining Forests." Read it at [iom.int](https://www.iom.int/news/un-agencies-government-distribute-lpg-stoves-rohingya-refugees-bangladeshi-villagers-save-remaining-forests).

  ### Read it (B1)

  When the camps were new, families cut wood from the hills to cook their food. So much wood was cut —
  about four football fields of trees every day — that the hills were soon bare. To stop this, aid
  groups and the government gave families gas to cook with instead of wood. The gas is called LPG. In
  2024 alone, they gave out nearly two million bottles of it.

  The change helped in more ways than one. The hills stopped being stripped for firewood, so the grass
  and small trees could start to grow back on their own. Women and girls, who used to walk far into the
  forest to collect wood — a dangerous job — no longer had to. And the air inside the shelters was
  cleaner, because there was less smoke.

  ### Read it (simpler, A1/A2)

  Families used to cut trees from the hills to cook. This made the hills bare. Now aid groups give
  families gas to cook with, instead of wood. So fewer trees are cut, and the plants can grow back.
  Women and girls no longer have to walk far to collect wood. The air is cleaner too.

  ### New words

  - LPG — gas in a bottle, used for cooking instead of wood
  - firewood — wood that is burned to cook or keep warm

  ### Can we trust it?

  - Who? IOM, a United Nations agency.
  - When? recent, and about the change from wood to gas.
  - Why? to report its own work, so it shows the work in a good light.
  - Do they show how they know? yes — a clear number (nearly two million bottles).
  - Check it another way: do the families around us really use gas now instead of wood?

  ## Source J — Bringing the green back: is it working?

  Helps with sub-question 4 (is it working). A "did it work?" source — read it carefully. Reading level: B1.

  ### The original article

  Reproduced with attribution under FAO's educational, non-commercial permission. Food and Agriculture
  Organization of the United Nations (FAO), "Restoring degraded land in Rohingya refugee camps in Cox's
  Bazar, Bangladesh." Read it at [fao.org](https://openknowledge.fao.org/server/api/core/bitstreams/64716592-d871-46a8-81d9-4759f72dd951/content).

  ### Read it (B1)

  The groups working in the camps say the hills are coming back to life. They have planted grass and
  trees on the bare slopes, and given families gas so fewer trees are cut. They report that the green is
  returning — one study found the green cover grew by almost half (about 43 in every 100 more) between
  2018 and 2024 — and that there are fewer landslides than in the first years.

  But read this carefully. This good news comes from the same groups that did the work, so of course
  they want it to sound good. And the fuller story is harder: when the camps were built, almost all of
  the forest on the hills was lost — inside the camps it fell from more than half the land to almost
  none. Bringing it back is slow, and it is not finished. So the honest answer to "is it working?" is:
  it is helping, but the hills are not healed yet — and the best way to know is to look with our own eyes
  and ask the people who live here.

  ### Read it (simpler, A1/A2)

  The groups say the hills are getting greener again. They planted trees and gave families gas. Some
  green has come back, and there are fewer landslides than before. But the forest is not back to how it
  was — this takes a long time. So it is helping, but it is not finished. Look at our own hills to see.

  ### New words

  - restore — to bring something back to how it was before
  - green cover — how much of the land is covered by plants and trees

  ### Can we trust it?

  - Who? FAO and the other groups — the ones who did the work.
  - When? recent.
  - Why? to show their work is working, so they show the good side.
  - Do they show how they know? some numbers, but not the whole picture (they say less about what is
    still broken).
  - Check it another way: does it match what WE see on our own hills, and what people here say? This is
    good news from the people who did the good thing — so weigh it, do not just believe it.

  ## Source K — What trees give us

  Helps with sub-questions 2 and 3 (a bare hill in the hot sun; what trees do for the soil and for us). Reading level: A2 to B1.

  ### The original article

  Not reproduced here (a tree-planting charity's website, rights reserved), so we name it and summarise
  it. One Tree Planted, "How trees improve soil quality." Find it at [onetreeplanted.org](https://onetreeplanted.org/blogs/stories/trees-soil-quality).

  ### Read it (B1)

  Trees give us more than wood. Their roots hold the soil together and stop it washing away. Their fallen
  leaves rot into the ground and make the soil richer, so more can grow. Their branches give shade, which
  keeps the ground — and the people and shelters under them — cooler in the hot sun. And growing plants
  help clean the air we breathe. So bringing trees back to a bare hill does many good things at once: it
  holds the soil, cools the ground, and feeds the land.

  ### Read it (simpler, A1/A2)

  Trees do many good things. Their roots hold the soil. Their leaves make the soil richer. Their shade
  keeps us cooler in the hot sun. Growing plants clean the air. So trees on a hill help the soil, the
  ground, and us.

  ### New words

  - shade — the cooler, darker place under a tree or a roof, out of the sun

  ### Can we trust it?

  - Who? A charity that plants trees.
  - When? recent.
  - Why? it loves trees and wants people to plant them, so of course it lists the good things.
  - Do they show how they know? a little, but not much proof.
  - Check it another way: do the strong science sources (A and E) say the same? And do we feel it — is it
    cooler under a tree?

  ## Programme word bank

  Every word explained in this pack collects here. These are our research words — we build them onto the
  word wall and keep using them.

  - bamboo — a tall, strong plant with hard, hollow stems (Source B)
  - Cash-for-Work — paid work given to community members on a local project (Source B)
  - channel — a small path that water flows along (Source E)
  - company — a business that sells something to make money (Source D)
  - contour trench — a long, shallow ditch dug across a hill to slow rain water (Source B)
  - crib wall — a low wall, here of bamboo, built across a slope to hold the soil (Source B)
  - degree Celsius — the unit we use to measure how hot or cold something is (Source A)
  - drains — the channels that carry rain and dirty water away (Source F)
  - environment — the natural world around us: land, water, air, plants, and animals (Source F)
  - erosion — when soil is slowly worn away and carried off by water or wind (Source D)
  - evaporation — when water changes into vapour and rises into the air (Source A)
  - firewood — wood that is burned to cook or keep warm (Source I)
  - Food and Agriculture Organization (FAO) — a part of the United Nations that helps with food, farming, and land (Source B)
  - forest — a large area of land covered with many trees (Source C)
  - green cover — how much of the land is covered by plants and trees (Source J)
  - hectare — a unit for measuring land, about the size of a large sports field (Source B)
  - infiltration — when water soaks down into the soil instead of running off (Source E)
  - journal — a book where scientists share studies that other scientists have checked (Source G)
  - landslide — when soil and rock slide down a hill (Source B)
  - LPG — gas in a bottle, used for cooking instead of wood (Source I)
  - monsoon — the season of very heavy rain (Source B)
  - native plants — plants that grow naturally in a place (Source B)
  - network — a group of people who join together to work on something (Source F)
  - nursery — a place where young plants are grown until big enough to plant out (Source C)
  - percent — a part of one hundred (Source A)
  - plantation guardian — a person whose job is to look after young trees (Source H)
  - refugee — a person who has had to leave their own country to be safe (Source C)
  - restore — to bring something back to how it was before (Source J)
  - roots — the part of a plant that grows under the ground and holds it in place (Source B)
  - runoff — rain water that runs off the top of the ground instead of soaking in (Source E)
  - SAFE Plus — a United Nations project in the camps, short for Safe Access to Fuel and Energy Plus (Source C)
  - satellite — a machine high above the Earth that can take pictures of the ground (Source A)
  - scientist — a person who studies the world carefully to find out how it works (Source A)
  - shade — the cooler, darker place under a tree or a roof, out of the sun (Source K)
  - slope — the sloping side of a hill (Source B)
  - study — careful work by scientists to find something out (Source G)
  - United Nations (UN) — a group of most of the world's countries that work together (Sources B and C)
  - UNHCR — the United Nations agency that helps refugees (Source H)
  - vapour — water that has turned into a gas in the air (Source A)
  - website — a page on the internet (Source D)
