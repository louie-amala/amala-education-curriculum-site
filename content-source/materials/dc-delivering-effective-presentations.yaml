id: dc-delivering-effective-presentations
slug: dc-delivering-effective-presentations
access: public
type: activity
title: Delivering effective presentations
summary: Learners work out what makes a presentation clear and engaging, then plan how to structure,
  visualise and deliver theirs so they can communicate their research and ideas with real impact.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners draw out top tips alone, then pool and pressure-test them in breakout
    groups against their own upcoming presentation. The shared step is where the value sits, because
    hearing how peers plan to handle nerves, structure and visuals surfaces techniques one learner
    would not reach alone, so keep the group discussion even if you shorten the input.
- context: one-to-one-mentoring
  how: >-
    A strong fit for rehearsal. A mentor helps a learner shape the structure of their specific
    presentation, spot where an audience will lose the thread, and practise handling nerves, but the
    learner loses the range of tips a group generates, so ask them to draft their own list first.
- context: independent
  how: >-
    Workable for planning, weaker for delivery. A learner alone can structure their talk and design
    visuals, but presenting is a live skill; have them rehearse aloud at least once to a real
    listener, even a family member, and note what to change before the milestone.
duration: 40-50 min facilitated
grouping: Individual reflection, then breakout groups of 3-5; works with 10-35 learners
whatLearnersDo:
- Reflect on presentations you have seen and draw out your own top tips for delivering one well.
- Share one tip with your group and discuss what makes a presentation land with an audience.
- Plan how you will structure your presentation, knowing who your audience is.
- Decide how you will use visuals and handle nerves so your message has impact at the milestone.
materialsAndPreparation:
- A short guide or set of examples of strong and weak presentations, adapted to your context.
- A way for each breakout group to record its discussion and a nominated scribe.
- "Optional: a simple structure template (opening, key points, call to action) learners can plan against; paper works as well as a slide tool."
facilitationNotes: |
  A presentation is how a learner's research and ideas reach other people, so a strong project can
  still fail if it is delivered poorly. The one thing to get right is that technique serves the
  audience: structure, visuals and calm delivery exist to make the message land, not to perform. Keep
  the focus on the learner's own upcoming presentation rather than presentation theory in the
  abstract. Steer learners to plan for a real audience and a real purpose, and treat nerves as normal
  and manageable rather than a sign they are not ready.
steps:
- title: Draw out what makes a presentation work
  duration: 8-12 min
  guidance: |
    Give learners quiet time to think back to presentations they have watched, in person or online,
    and to note their own top tips for delivering one well. The aim is to make good practice concrete
    from experience before it becomes advice: a learner who remembers being bored by a wall of text
    understands the case for clear visuals faster than one handed a rule.
  keyPrompts:
  - "Think of a presentation that held your attention: what did the speaker actually do?"
  - What are your five top tips for delivering an effective presentation, and why those?
  - When a presentation has lost you, what usually went wrong?
  watchOuts:
  - Learners list generic advice they have heard rather than what they have seen work; push them back to a specific presentation they remember and ask what made it land or fail.
  adaptation: |
    No connectivity needed: describe two short contrasting presentations aloud, or have learners
    recall ones they have seen, then run the reflection on paper. No video is required.
- title: Pool and pressure-test tips in groups
  duration: 12-15 min
  guidance: |
    In breakout groups, each learner shares one top tip, then the group discusses what makes a
    presentation land with an audience. Draw out the recurring themes: a clear structure, knowing who
    you are talking to, visuals that support rather than crowd the message, and managing nerves.
    Capture the group's shared shortlist as a visible list learners can plan against.
  keyPrompts:
  - Which of these tips would make the biggest difference to how your audience receives your message?
  - How does knowing exactly who your audience is change what you would say and show?
  - What is one honest way to steady your nerves that has worked for someone here?
  watchOuts:
  - The discussion drifts into a general chat about public speaking; keep anchoring it to the presentation each learner will actually give at the project milestone.
- title: Plan your structure for your audience
  duration: 10-15 min
  guidance: |
    Bring it back to each learner's own presentation. Ask them to plan a clear structure, an opening
    that signals what is coming, a few key points, and a close that says what they want the audience
    to think or do, shaped around who that audience is. This is where a set of tips becomes a plan
    for a specific talk rather than general knowledge.
  keyPrompts:
  - What are the three things your audience must take away, and in what order?
  - Who is in your audience, and what do they already know or care about?
  - How will your opening make them want to keep listening?
  watchOuts:
  - Learners try to include everything they researched; help them cut to the few points the audience needs, since an overloaded talk communicates less, not more.
- title: Design visuals and rehearse the delivery
  duration: 8-10 min
  guidance: |
    Turn to how the presentation is delivered. Ask learners to decide how visuals will support their
    words rather than repeat them, and to rehearse a section aloud so delivery and nerves are
    practised, not left to the day. Even one run-through changes how ready a learner feels and shows
    them where the talk is unclear.
  keyPrompts:
  - Does each visual make a point clearer, or is it there just to fill the screen?
  - Having said it aloud once, where did you lose your thread, and how will you fix it?
  - What will you do in the first ten seconds to settle your nerves and start well?
  watchOuts:
  - Learners crowd slides with text and read them out; steer them towards a few images or words that support what they say, and towards speaking to the audience rather than the screen.
closing: |
  Ask two or three learners to name the one change they will make to how they present, and remind the
  group that these are skills, not talents: they improve every time they plan for the audience and
  rehearse. Point out that the same techniques will serve them at every project milestone and well
  beyond this challenge.
agencyContribution:
  indicators:
  - contribution-to-community
  how: >-
    A learner's research and ideas only help their community if other people can understand and act
    on them. Learning to present clearly is what turns private insight into a case that an audience
    can be moved by, which is how a learner's contribution reaches the people it is meant to serve.
principlesForegrounded:
- lifeworthy-competencies
- recognise-communicate-growth
- connect-to-futures
principleAlignment:
- principle: lifeworthy-competencies
  how: >-
    Planning and delivering a clear, engaging presentation is a high-value transferable skill learners
    will reuse in study, work and civic life whenever they need to persuade an audience, well beyond
    this project.
- principle: recognise-communicate-growth
  how: >-
    The whole activity is learners building the ability to communicate their own learning and ideas to
    others, and to make the growth in their project visible and convincing to an audience at each
    milestone.
- principle: connect-to-futures
  how: >-
    Presenting to a real audience about a real project rehearses exactly the communication that study,
    employment and community leadership demand, connecting this task to the futures learners are
    working towards.
competencyCodes:
- FLC3
- FPS1
competencyDevelopment:
- code: FLC3
  how: >-
    Structuring a message for a specific audience, choosing visuals that carry it, and delivering it
    with impact is direct practice in influential communication; the planned presentation and its
    delivery at the milestone are the evidence.
- code: FPS1
  how: >-
    Reshaping the same research for different audiences and purposes, and adjusting structure and
    delivery so the message lands, is direct practice in adaptable thinking.
