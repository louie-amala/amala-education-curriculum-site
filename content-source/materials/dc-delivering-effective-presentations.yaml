provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, adaptations and
  delivery modes) from the Design Challenge activity guide, which supplied the purpose, the individual
  reflection on top tips and the breakout discussion question. Written to generalise to any design
  challenge; the source project investigates the mental health and wellbeing of Afghan females. Linked
  to Research Project objective 4 (communicating findings) and Social Entrepreneurship objective 3
  (convincing others to adopt the concept).
