  how: Building an honest, evidence-based output and defending it is central evidence of proficiency in investigating real-world issues.
- code: FLC3
  how: Structuring findings so a non-expert can follow, and answering questions, is communicating with influence.
- code: FSL1
  how: Rehearsing, taking feedback, and naming the one thing they most want understood asks learners to reflect on their own message.
