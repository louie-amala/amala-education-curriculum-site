# Contextualised, fully offline PRACTICE for the Research Project component of Learning Bridge+ (Cox's
# Bazar). Phase 5 "Communicate findings". Learners build their chosen output — structuring findings and
# insights into a clear, honest, evidence-based account a non-expert can follow — and rehearse presenting
# and answering questions. Much of the making is in independent hours. Central evidence for FSI1.
id: cb-rp-build-our-output
slug: cb-rp-build-our-output
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "Build our research output"
summary: >-
  Learners build the output they planned, structuring their findings and insights into a clear, honest,
  evidence-based account a non-expert can follow. They represent the evidence's limits honestly, and
  rehearse presenting it and answering questions.
facilitationContext:
- group
- independent
primaryContext: independent
duration: "2 hours facilitated + 3 hours independent"
grouping: "Small teams making; whole group for feedback and rehearsal"
whatLearnersDo:
- Build the output they planned — a poster, a talk with pictures, a role-play or story, a simple infographic.
- Structure findings and insights so a non-expert can follow them, with the evidence shown for each claim.
- Show the limits of the evidence honestly — for example, "we only spoke to a few people" — rather than overclaiming.
- Rehearse presenting, and practise answering the questions an audience might ask.
- Give and act on feedback, checking no names of the people we spoke to appear anywhere.
materialsAndPreparation:
- Each team's plan from "Choose our format and our audience".
- The evidence log and the cohort's insight statements, to check each claim against.
- Simple making materials — paper, pens, and whatever the chosen format needs; a space to rehearse.
- The building page from the research book (one per learner).
visuals:
- kind: setup
  title: "Small teams make; teams show teams"
  caption: >-
    Most of the making happens in the independent hours; use session time for feedback and rehearsal, not
    to make from scratch. Teams show a first version to another team, then rehearse.
  spec:
    type: groups
    facilitator: true
