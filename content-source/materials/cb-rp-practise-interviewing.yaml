  Authored activity for the Learning Bridge+ (Cox's Bazar) Research Project edition (August 2026). Added
  because learners previously moved straight from designing questions to gathering in the community, with
  only a briefing in between. It absorbs that briefing and adds the rehearsal: the whole arc of an
  interview, the three hard moments, and a readiness check. Fully offline, oral and visual first.
