# Contextualised, fully offline ACTIVITY for the Research Project component of Learning Bridge+ (Cox's
# Bazar). The rehearsal between designing the questions and going out to use them: learners practise the
# whole arc of a real interview - greet, ask permission, ask, follow up, record, thank - on each other
# and on a stranger-role, and check they are ready to gather. Absorbs the briefing that used to sit
# inside "Go and gather", so learners are rehearsed before they meet a real person rather than briefed
# on the way out. Plan and conduct research phase (objective 2).
id: cb-rp-practise-interviewing
slug: cb-rp-practise-interviewing
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "Practise being an interviewer, and get ready to go"
summary: >-
  Learners rehearse a whole interview from start to finish - greeting, asking permission, asking their
  question, following up, recording the answer with marks or drawings, and thanking the person - first
  with each other, then with a partner playing a stranger who is busy, shy, or says no. They finish by
  checking, out loud and on the page, that they are ready to go and gather.
facilitationContext:
- group
primaryContext: group
duration: "1.5 hours facilitated"
grouping: "Pairs, then same-gender gathering pairs for the readiness check"
whatLearnersDo:
- "Practise the whole arc of an interview in order: greet, ask permission, ask, follow up, record, thank."
- Practise recording an answer while the person is still talking - with a mark, a drawing, or a few words - without losing the thread.
- "Meet the three hard moments in a role-play: the person who says no, the person in a hurry, and the person who gives a one-word answer."
- Practise the five-second wait until it stops feeling uncomfortable.
- Check with their gathering partner that they have everything they need, and agree who they will ask, where, and when.
materialsAndPreparation:
- The questions pages the learners designed in the previous block, and the survey page with its tally.
- The gathering-record page from the research book, so learners practise recording on the real page.
- The consent words from "Asking permission", on the wall.
- The good interviewer / poor interviewer columns from the previous block, still on the wall.
- Role cards or spoken briefs for the three hard moments (says no, in a hurry, one-word answers).
- The agreed safeguarding and referral pathway, and the gender-responsive gathering plan - confirm both before anyone goes out.
visuals:
- kind: setup
  title: "The arc of an interview"
  caption: >-
    Rehearse the whole thing in order, not just the questions. Most of what goes wrong for a first-time
    interviewer happens before the first question and after the last answer.
  spec:
    type: zones
    zones:
    - label: "Greet & ask permission"
      sublabel: "may I ask you some questions?"
      tone: positive
      cards:
      - "say why we are asking"
      - "they can say no"
