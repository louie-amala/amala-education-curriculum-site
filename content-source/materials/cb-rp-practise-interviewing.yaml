agencyContribution:
  indicators:
  - control-of-future-pathways
  - contribution-to-community
  how: >-
    Rehearsing the whole encounter - including the refusal - is what turns a learner from someone
    carrying questions into someone who can walk up to an adult in their community and hold a
    conversation on their own terms. That confidence transfers far beyond this investigation.
principlesForegrounded: [collaboration, authentic-challenges, feedback-and-data]
principleAlignment:
- principle: collaboration
  how: Learners rehearse in pairs and give each other one thing to improve between rounds.
- principle: authentic-challenges
  how: The rehearsal is for a real conversation with real people in their own community, days away.
- principle: feedback-and-data
  how: Each round ends with a named improvement, and the readiness check surfaces what is still missing before it costs real evidence.
competencyCodes: [FSI1, FTS3]
competencyDevelopment:
- code: FSI1
  how: Conducting primary research well is part of the investigation itself, not preparation for it.
- code: FTS3
  how: Learners practise capturing data accurately at the moment it is given, which is what makes it usable later.
