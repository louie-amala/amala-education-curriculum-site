provenanceNote: >-
  Authored from Research Project objective 2 (plan and conduct ethical primary and secondary research),
  with no source activity guide. Written as a generic planning activity that pulls the method-specific
  materials (surveys, interviews, secondary methods) into one simple research plan. Linked to Research
  Project objective 2 and to competencies FSI1 and FTS3.
