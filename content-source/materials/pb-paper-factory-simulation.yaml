rights:
  status: own-expression
  basis: >-
    Origin not recorded in Amala's pack, and the document carries no link. The role briefs are
    summarised rather than reproduced, and all wording here is Amala's own.
  note: >-
    Searched in August 2026 without success. It belongs to the transboundary-water negotiation genre
    that Harvard's Program on Negotiation publishes several examples of, so a published ancestor is
    likely. Ask whoever built Amala's version before the briefs are published anywhere.
