educatorContent: |
  ## Start here

  This is the first thing to read before you run the Research Project. It is a 50-hour component (30
  hours in-person, 20 hours independent) that a whole group works through together over at least 10
  weeks, investigating one shared, local challenge: what is happening to the trees on the hills where
  they live. Everything runs fully offline. You do not need the internet, and you do not need a screen.

  The heart of the course is a real cycle of investigation, handed over to learners bit by bit: early on
  you lead, in the middle it is shared, and by the end the learners lead. Your job is to make that
  handover happen safely and warmly, not to deliver facts.

  ## The offline pack

  You have four things, all editable and printable:

  - The Facilitator Unit Plan and Guide (this pack) — the full plan with every session's guidance, the
    source pack, and the original articles behind it.
  - The Student Workbook — the research book each learner keeps: the sources to read, the research word
    bank, and a page for each step of the investigation.
  - The picture-word cards — printable cards for the research words, to build the word wall.
  - This start-here, the safeguarding and protection guide, and the assessment guide (all in this pack).

  ## What you need (kit)

  - One printed research book (student workbook) per learner, and a few spare blank pages.
  - Pencils, and colours if you have them.
  - A wall or floor you can use — for the "before and now" picture, the know / find-out wall, the
    community map, the theme sorting, and the trust line. Big paper or a cleared wall space works.
  - Cards you can move around: for sorting evidence into themes, and for the trust line. Cut paper is fine.
  - The picture-word cards, cut out, for the word wall.
  - The pictures you prepare (see below).

  ## What to prepare, phase by phase

  - Getting started: a picture — or a story you can tell — of the hills before the camps and now.
    Prepare the research books so learners can make them their own on day one.
  - Frame the challenge: wall space for the "what we know / what we want to find out" wall and the
    community map. Keep both up all course.
  - Plan and conduct research: practise the consent words with the group before anyone gathers. Agree,
    with the group and the community, who it is safe and appropriate to speak to — and plan girls'
    gathering carefully (see the safeguarding guide).
  - Evaluate evidence: cards for theme-sorting; a line on the floor for the trust line.
  - Communicate findings: whatever the learners choose for their output — paper for a poster, space for a
    role-play, and time to rehearse.
  - Showcase and reflect: a warm space and, if possible, the audience the learners chose to invite.

  ## Running it with no screen or internet

  - Everything is oral and visual first. Read sources aloud. Let learners answer in drawings, marks, and
    a few words — neat writing is never required.
  - The Student Workbook is designed to be printed and written in by hand. The source cards come at three
    reading levels (a real article, a B1 version, a simpler A1/A2 version) so you can meet each learner.
  - The research book is the spine of the whole course. It carries each learner's question, evidence, and
    thinking from the first day to the last. A learner who misses a week can pick their book back up and
    see where they were — so protect it, and keep coming back to it.
  - Times are generous on purpose. Oral and visual work, drawing, and translation take longer than they
    look. It is fine to take two sessions over one block.

  ## Pictures you will need to make

  The course is visual, so a few simple pictures do a lot of work. You do not need an artist — a clear
  drawing, or a real photo if you have one, is enough. Prepare:

  - The hills "before and now": one showing the hills full of trees, one showing bare slopes today.
  - A simple picture for each research word on the word wall (the picture-word cards give you a blank box
    to draw in): tree, hill, rain, root, bare slope, landslide, and so on.
  - A simple picture for each source card if you can (a bare hill in the rain, roots holding soil, people
    planting on a slope). These help learners who are not yet reading follow the source.

  If your programme has an illustrator, these are the images to commission; until then, draw them with
  the group — making the picture is itself part of the learning.
