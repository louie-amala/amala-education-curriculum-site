# Facilitator start-here resource for the Research Project component of Learning Bridge+ (Cox's Bazar).
# Everything a facilitator needs to run the 50-hour component fully offline: the pack, the kit, what to
# prepare, how to run with no screen or internet, and the pictures to make. Not a learner sheet.
