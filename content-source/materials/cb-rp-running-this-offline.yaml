title: "Running the Research Project offline — start here"
summary: >-
  The facilitator's start-here for delivering the Research Project with no internet: what is in the pack,
  the kit you need, what to prepare for each phase, how to run it orally and visually, how to hold the
  research book across stop-start attendance, and the pictures you will need to make.
facilitationContext:
- group
