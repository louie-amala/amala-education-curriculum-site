learnerContent: |
  ## Who we will tell, and how

  Before we build our output, we plan it. Fill this in — in words or drawings — with your team.

  The sheet has room for:

  - Who we will tell (our peers, our families, the wider community, a camp committee) and why they
    should care.
  - The one thing we most want them to understand.
  - The format we will use (a poster, a talk with pictures, a role-play or story, a simple infographic)
    and why it fits.
  - For each thing we will say: where our evidence for it is in our evidence log.
  - What our evidence does NOT tell us — the limits we will be honest about.
  - How we will present in a way that is safe for everyone, using no names of the people we spoke to.

  Keep this plan in your research book. You will use it when you build your output.
