type: resource
title: "The significant adult meeting (optional)"
summary: >-
  An optional three-way conversation - mentor, learner, and one adult the learner chooses - in which the
  learner shows their own work and says what has changed for them, and the adult says what they have
  noticed. Organisationally demanding, and worth it: it is the fastest way to make a learner's growth
  visible to the people whose belief in them shapes what happens next.
facilitationContext:
- one-to-one-mentoring
primaryContext: one-to-one-mentoring
duration: "30 to 40 minutes. Best placed between Week 7 and Week 11, or straight after the showcase"
grouping: "Three people: the mentor, the learner, and one adult the learner chose. Same-gender mentor pairing where that is what makes it possible"
learnerContent: |
  ## Talking with someone who matters to you

  Some learners have a meeting with their mentor and one grown-up they choose. It is not for everyone,
  and it is not something you have to do.

  ### Who you might choose

  Someone whose opinion matters to you, and who is part of your life: a parent, an older brother or
  sister, an aunt or uncle, a grandparent, a guardian, a teacher, a religious leader, a neighbour who
  has helped you. You choose. If you would rather not have this meeting at all, say so - nobody will
  ask you why, and nothing bad happens.

  ### What happens

  It takes about half an hour, and there are three parts:

  1. **You show your work.** Your book, your goal, your card, your part of our research. You do the
     showing and the talking - your mentor is there to help if you get stuck, not to speak for you.
  2. **You say what has changed.** One thing you can do now that you could not do before.
  3. **They say what they have noticed.** The adult says what they have seen change in you at home or
     outside the learning space. Sometimes this is the surprising part.

  Then all three of you agree one thing: what would help you most in the weeks ahead.

  ### Two things that will not happen

  - Nobody will tell them your marks, or discuss you as if you were not there.
  - Nothing you have told your mentor privately will be repeated. That stays between you and your
    mentor.
educatorContent: |
  ## Why bother - the case for the meeting

  A learner's sense of what is possible for them is shaped less by their facilitator than by the adults
  they live among. In this context that is sharper than usual: schooling has been interrupted for
  years, many families have not seen what this young person can do in a learning space, and for girls
  in particular whether learning continues past this programme is often not the learner's decision
  alone. A judgement recorded on an assessment form does not reach any of those people.

  This meeting reaches them, and it does four things nothing else in the programme does.

  1. **It makes growth articulable.** Learners are poor at describing what has changed in them, and
     they get better at it by doing it in front of someone whose opinion they care about. This is the
     highest-stakes, most motivating practice of the recognise-and-communicate-growth skill available.
  2. **It surfaces evidence you do not have.** The adult sees the learner in the twenty-one hours a
     day you do not. "He has started teaching his sister her letters." "She organised the neighbours
     about the water point." That is FSL2 and agency evidence, and you would never have got it.
  3. **It converts a private change into a recognised one.** Being seen to have grown, by someone who
     matters, is what turns a learner's growth into something the people around them expect more of.
     That is often what decides whether learning continues after Week 12.
  4. **It gives the adult something to do.** Most significant adults want to help and do not know how.
     The meeting ends with one concrete, small thing - protect this half hour, ask her about her goal
     on Fridays - which is far more useful than general encouragement.

  It is optional because it is genuinely demanding to organise: a time, a space, an adult who can
  travel, and a mentor with thirty spare minutes. Run it for the learners you can. Two well-run
  meetings are worth more than twenty rushed ones, and a site that manages none has not failed.

  ## How to run it

  **Before.** The learner chooses the adult, and the learner does the inviting - as with the showcase,
  the choosing is part of the value. Agree with your coordinator where it happens and that it is a safe
  and appropriate space. Prepare the learner: which three things will you show, and what is the one
  change you will name? Ten minutes of preparation makes the difference between a proud half hour and a
  silent one.

  **The shape, and hold to it.** Thirty to forty minutes:

  - *The learner shows and speaks* (about 15 minutes). Their book, their goal, their card, their
    research. They talk. Do not narrate over them.
  - *The learner names one change* (about 5 minutes). One thing they can do now that they could not do
    before.
  - *The adult says what they have noticed* (about 10 minutes). Ask it directly: what have you seen
    change, at home or outside? Wait. Let the silence do the work.
  - *All three agree one thing* (about 5 minutes). One small, specific thing that would help the
    learner in the weeks ahead, that the adult can actually do.

  **After.** Note what the adult said in your mentor record - it is evidence. The learner writes or
  draws the agreed one thing on their mentoring page. Do not write anything about the meeting on the
  learner's own page beyond that: their book goes home.

  ## The five ways this goes wrong

  1. **It becomes a parents' evening.** The mentor talks, the adult listens, the learner sits silent
     while being described. If you are speaking more than the learner, stop and hand it back.
  2. **Grades appear.** Do not share the Week-6 or Week-12 judgement, the proficiency level, or any
     comparison with other learners. This meeting is about what changed, not about a mark.
  3. **Something private is repeated.** Anything a learner told you in confidence stays in confidence.
     Say this to the learner beforehand, in plain words, so they can relax into the meeting.
  4. **The adult uses it to complain about the learner.** Redirect once, warmly and firmly - "what I'd
     most like to hear is what you have seen her do well" - and if it continues, close the meeting
     early and courteously. Then debrief the learner alone; do not leave them holding it.
  5. **It exposes a learner.** A learner with no adult to bring, or whose household would make the
     meeting unsafe, must never be visible as such. Offer it privately, take no for an answer without
     a reason, and never announce who is having one.

  ## Safeguarding and protection

  - Follow NRC's Code of Conduct and the camp referral pathway throughout, and clear the space and the
    guest with your coordinator before inviting anyone.
  - Same-gender mentor pairing wherever girls' participation depends on it, and check that the adult
    the learner has chosen is one they are genuinely safe with. Ask the learner privately, before the
    invitation goes out, not in front of anyone.
  - Do not run this meeting where there is any protection concern involving the household, an open
    referral, or a disclosure. In those cases the answer is your referral pathway, not a meeting.
  - If something is disclosed during the meeting, do not handle it there. Close the meeting normally,
    then follow the referral pathway.
  - The learner can end the meeting at any point, for any reason, and should be told so beforehand.
agencyContribution:
  indicators:
  - control-of-future-pathways
  - contribution-to-community
  - power-over-wellbeing-and-self-direction
  how: >-
    Whether a young person's learning continues is rarely their decision alone, and almost never
    decided by an assessment record. This meeting puts the learner in front of the person whose belief
    most shapes what they are permitted and expected to do next, speaking for themselves about their own
    growth - which is agency over a pathway in the most direct sense available to them here. It also
    makes visible the contributions they are already making at home, which the learner routinely
    undervalues and the adult routinely has not connected to the programme.
principlesForegrounded:
- recognise-communicate-growth
- collaboration
- connect-to-futures
- safe-spaces
principleAlignment:
- principle: recognise-communicate-growth
  how: >-
    The learner narrates their own growth, with evidence in their hands, to an audience that matters -
    the most demanding and most motivating version of that skill the programme can offer.
- principle: collaboration
  how: >-
    It draws a significant adult into the learning as a genuine participant with something to
    contribute, rather than as a recipient of a report.
- principle: connect-to-futures
  how: >-
    It ends with one concrete thing the adult will do, which is how a general wish that a young person
    does well becomes support they can actually feel.
- principle: safe-spaces
  how: >-
    It is optional, the learner chooses who comes, confidences are never repeated, and the learner can
    end it at any time - the conditions without which none of the rest would be safe to attempt.
competencyCodes: [FSL2, FUS1, FLC3]
competencyDevelopment:
- code: FSL2
  how: >-
    Accounting for a goal, the steps taken, and what changed, to someone outside the programme, is the
    fullest articulation of setting and pursuing goals a learner will be asked for.
- code: FUS1
  how: >-
    Saying what has changed in you, to someone who has known you a long time, demands and develops
    self-awareness.
