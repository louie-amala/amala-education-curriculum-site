# Programme-level, OPTIONAL mentoring resource for the Learning Bridge+ (Cox's Bazar) edition: a
# three-way conversation between the mentor, the learner, and one adult who matters in the learner's
# life.
#
# Deliberately optional. It takes real organisation - finding a time, a safe space, and an adult who
# can come - and a site running at capacity may not manage it for every learner, or for any. It is
# written so that a site can run it for two learners or for twenty without the programme depending on
# it. What it must NOT become is a parents' evening: it is not a report on the learner, and the learner
# is not discussed in the third person while sitting there.
#
# Belongs to the Mentoring and Wellbeing component. When that component's unit plan and guide are
# built, this is composed into them rather than re-authored.
