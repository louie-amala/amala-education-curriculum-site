provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, an adaptation,
  delivery modes and a sensitivity note) from the Design Challenge activity guide, which supplied the
  purpose and the individual reflection and breakout questions. The source Design Challenge
  investigates the mental health and wellbeing of Afghan females; this material is written to
  generalise to any design challenge. Linked to Research Project objective 3 (evaluate evidence and
  develop insights) and Social Entrepreneurship objective 2 (develop a solution concept).
