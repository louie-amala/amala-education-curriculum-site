rights:
  status: own-expression
  holder: "UC Berkeley YPAR Hub; the source plan credits the Center for Education in Law and Democracy's pARTicipation Curriculum [to verify]"
  basis: >-
    Every word here is written from scratch, and the constitutional content the source is built on has
    been replaced rather than reproduced. The structure, mapping power, finding its limits, then
    removing them, is a method rather than an expression.
  note: >-
    Do not restore the United States constitutional framing. It does not apply to Amala's learners, and
    for a learner without citizenship it is actively misleading. The attribution to the Center for
    Education in Law and Democracy is taken from the source document and has not been independently
    verified.
