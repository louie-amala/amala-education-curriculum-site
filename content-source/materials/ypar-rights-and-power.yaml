provenanceNote: >-
  Adapted heavily from the YPAR Hub's "Government, Rights, and Power", supplied to Amala in August
  2026. The source is a United States civics lesson built on the Constitution and the Bill of Rights;
  its structure is kept and its content is replaced with a rights instrument the facilitator chooses,
  usually the Universal Declaration, which is not tied to citizenship of anywhere. The power map, the
  invented-setting and analysis-only routes, the observer role and the safeguarding judgement are
  Amala's, and are the reason this material can be run with a displaced cohort at all.
