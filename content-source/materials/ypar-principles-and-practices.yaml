id: ypar-principles-and-practices
slug: ypar-principles-and-practices
access: public
type: activity
title: "Principles and practices: what it takes to work well with people"
summary: >-
  The group writes its own principles for working with a community, then tests them against four
  dilemmas that show where good intentions run out.
facilitationContext: [group]
primaryContext: group
deliveryAdaptations:
  - context: group
    how: >-
      As designed. The principles have to be co-constructed and then argued over in a silent written
      exchange and a fishbowl, and none of that exists for an individual. A learner joining later should
      be walked through the finished list by a peer rather than by a facilitator.
duration: 75 to 95 minutes.
grouping: Groups of three or four, then a silent gallery walk, then whole group.
materialsAndPreparation:
  - "Large paper, one sheet per group, half headed Principles and half headed Practices."
  - "One black marker per group for the brainstorm, and a different colour for every learner for the silent exchange. The colour change is what makes the second layer visible."
  - "The four dilemmas below, cut up so each learner has one."
  - "Wall space for the gallery walk, and room for a circle with an inner circle."
whatLearnersDo:
  - Agree what they mean by a principle and by a practice.
  - Brainstorm what it takes to work well with people, under one heading or the other.
  - Add questions and challenges to every group's sheet, in silence and in writing.
  - Test the list against a dilemma, and work out what is missing from it.
educatorContent: |
  ## Principles and practices

  A principle is what you hold to. A practice is what you actually do. Groups find the distinction
  slippery at first and that is useful: the discovery that a principle with no corresponding practice is
  decoration, and a practice with no principle behind it is a habit nobody can defend, is most of the
  session.

  Have half the groups work on principles and half on practices, then let the gallery walk connect them.

  ## The silent exchange

  After the brainstorm, everyone walks the sheets in silence with a coloured marker and writes comments,
  questions and challenges directly onto other groups' paper. No talking at all, for several laps.

  This is worth protecting, for two reasons. It gets a written challenge from the quietest learners, who
  would not raise it aloud. And because the exchange is anonymous by colour rather than by name, a group
  can be disagreed with without anyone having to confront anyone.

  ## The dilemmas

  Four situations, below, where a well-meaning group runs into something its principles do not cover.
  Each learner gets one, writes privately first, then finds the others with the same one.

  What they are for: a list of principles produced in the abstract is always admirable and always
  insufficient. The dilemmas show where. Every one of the four contains a conflict between two things
  the group has probably written down, and the productive answer is usually not a resolution but a
  recognition that the group will have to choose, and should decide now how it chooses.

  ## The fishbowl

  If there is time, an inner circle discusses while an outer circle listens, and anyone from the outside
  may take a free chair to contribute and then leave. It suits this material because it lets a
  conversation be joined rather than performed, and because learners can enter when they have something
  and leave when they do not.

  Do not run it if the group is not comfortable being watched. A discussion group with an audience of
  reluctant peers produces nothing.

  ## For Amala's contexts

  One addition to the source, and it matters here more than in a university setting. Several of Amala's
  learners are researching communities they belong to, while others are researching communities they do
  not. Those two positions have different ethics, and the group's list should say something about both:
  what you owe a community you will leave, and what you owe one you will still be living in when the
  project is over. The second is the harder one and the more common.
learnerContent: |
  ## The two words

  A **principle** is something you hold to. A **practice** is something you actually do.

  A principle with no practice attached is decoration. A practice with no principle behind it is just a
  habit. You need both.

  Your group takes one of the two, and answers: **what does it take to do good work with people?**

  Then everybody walks around all the sheets, in **silence**, with a coloured pen, and writes questions
  and challenges straight onto other groups' paper. No talking. Several laps.

  ## Four situations

  Then you get one of these. Write on your own first, then find the others who have the same one.

  For each: **What would you do? Which of our principles and practices help? What is missing from our
  list? Where is power showing up in this?**

  ---

  **1.** You are working with an organisation that runs a service your community depends on. Talking to
  people who use it, several tell you that staff there treat them badly. They tell you this because you
  are one of them and they trust you. The organisation has given your project space, permission and its
  name.

  ---

  **2.** Your group agreed that everyone you interview stays anonymous. One woman you interviewed says
  the opposite: she wants her name used, because she has been saying this for years and nobody has
  listened, and an anonymous quote is one more way of not listening.

  ---

  **3.** One member of your group is from the neighbourhood you are researching and the rest are not.
  He is glad to be doing it. He is also uncomfortable, partly because of how the others in the group
  talk about the area when they think it is only them, and partly because he will still be living there
  when everyone else has moved on.

  ---

  **4.** Your findings are strong, and they are unflattering about a group of people your community
  already thinks badly of. Published as they stand, they are true, and they will be used by people who
  are looking for exactly that.
facilitationNotes: >-
  The one thing to get right is that the dilemmas are not solved. Each contains a conflict between two
  things the group has already written down, and the useful outcome is that the group notices it will have
  to choose and decides now how it will. A facilitator who supplies resolutions teaches learners that
  someone else holds the answers to ethical questions. Protect the silent written exchange: it is where
  the quietest learners put their challenge, and it lets a group be disagreed with without a confrontation.
steps:
  - title: "Quick write on being welcomed"
    duration: 5 min
    guidance: >-
      Ask each learner to write privately about a time they joined a group and were made to feel welcome:
      what specifically made it work. Do not discuss it yet. The detail they produce here is the raw
      material of the practices list, and it is more concrete than anything they would generate by being
      asked directly what good practice is.
    keyPrompts:
      - "What did somebody actually do that made you feel you belonged?"
    watchOuts:
      - "A learner cannot think of one. Let them write about the opposite, a time they were not welcomed; it yields the same practices in negative form."
  - title: "Agree what the word means, then brainstorm"
    duration: 20 min
    guidance: >-
      Give each group principles or practices, and have them agree their own working definition before
      listing anything. The definition argument is not a delay, it is the content. Then brainstorm what it
      takes to do good work with people, in black marker, on the sheet.
    keyPrompts:
      - "What do you mean by that word? Agree it before you list anything."
      - "What does that look like on an ordinary day?"
    watchOuts:
      - "The lists become abstract virtues. Ask for the practice that would show it, and write that instead."
      - "Groups produce near-identical lists. Fine at this stage; the gallery walk is where difference appears."
  - title: "Silent gallery walk with coloured pens"
    duration: 15 min
    guidance: >-
      All sheets on the wall. Everyone takes a colour that is not black and walks, reading and writing
      comments, questions and disagreements straight onto the paper, including their own sheet. No
      talking, several laps. Hold the silence firmly; it is the whole mechanism.
    keyPrompts:
      - "Write what you would say if you were arguing with this."
    watchOuts:
      - "People start talking. Restate the rule once and stand near the offenders; the silence is what gets the quiet learners' challenge onto the paper."
      - "Comments are all approving. Ask directly for one disagreement per person before the second lap."
  - title: "Discuss what the wall shows"
    duration: 10 min
    guidance: >-
      Break the silence and ask what themes ran across the sheets, what surprised them, and how principles
      and practices connect. Draw out that neither works without the other. Note anything the group wants
      to add to the list after seeing the whole wall.
    keyPrompts:
      - "What came up on nearly every sheet?"
      - "Does a principle produce a practice, or the other way round?"
    watchOuts:
      - "The discussion stays at the level of agreement. Ask which comment on the wall was the sharpest disagreement, and take it up."
  - title: "Test the list against a dilemma"
    duration: 25 min
    guidance: >-
      Each learner takes one dilemma, writes privately, then joins the others with the same one. Their
      task is not to solve it but to work out which of the group's principles apply, which two conflict,
      and what is missing. Move between groups and resist giving answers, however much they ask.
    keyPrompts:
      - "Which two of our principles are pulling against each other here?"
      - "Who has power in this situation, and who carries the risk?"
      - "What is missing from our list?"
    watchOuts:
      - "A group wants the right answer. Say plainly that there is not one, and that deciding how you will choose is the thing you can actually prepare."
      - "The group with the fourth dilemma concludes findings should be suppressed, or that truth settles it. Both are too quick; ask who is harmed either way, and who decides."
  - title: "Fishbowl, and add what was missing"
    duration: 15 min
    guidance: >-
      If the group is comfortable being watched, run a fishbowl: one group discusses in the middle, others
      join a free chair and leave when done. Otherwise take report-backs. Either way, finish by adding to
      the principles and practices the things the dilemmas showed were absent.
    keyPrompts:
      - "What did your dilemma show was missing from our list?"
      - "What one thought are you taking away?"
    watchOuts:
      - "The fishbowl is run with a group that finds being watched uncomfortable, and dies. Read the room and take report-backs instead; nothing is lost."
      - "The additions are never made. The list is the output of the session; write them on before anyone leaves."
closing: >-
  Put the finished list where the group will see it, and add one line to it: what we owe a community we
  will leave, and what we owe one we will still be living in afterwards. Come back to the list whenever a
  new phase of the research starts, because each phase raises dilemmas the last one did not.
agencyContribution:
  indicators: [contribution-to-community]
  how: >-
    Learners write the ethics they will work by rather than receiving them, and then discover for
    themselves where those ethics run out. A group that has done this treats an ethical problem in the
    field as something it is equipped to reason about, rather than as a rule it has broken or a question
    for the adults.
principlesForegrounded: [collaboration, responsible-action, safe-spaces]
principleAlignment:
  - principle: collaboration
    how: >-
      The list is genuinely co-constructed, including a silent written round designed so that the least
      confident learners' objections reach the paper.
  - principle: responsible-action
    how: >-
      The dilemmas force learners to weigh loyalty, honesty, consent and consequence against each other in
      situations where every option costs something.
  - principle: safe-spaces
    how: >-
      Disagreement happens in writing and by colour rather than by name, and the fishbowl is explicitly
      optional for groups that would find being watched uncomfortable.
competencyCodes: [FLC1, ALC2, FUS2]
competencyDevelopment:
  - code: FLC1
    how: >-
      This is the competency in its most direct form: learners establish the ethical commitments they will
      act by, then test them against cases where two of them conflict.
  - code: ALC2
    how: >-
      Producing one agreed list from four groups' sheets and a wall of written challenges is collaborative
      decision-making with a visible, durable product.
  - code: FUS2
    how: >-
      Every dilemma turns on somebody else's position, the person who wants to be named, the member who
      will still live there, the community that will be read about, and requires learners to reason from
      it rather than about it.
objectiveIds: [research-project--o2, ethical-leadership--o1]
