  holder: "Rebecca G. Kaplan, CU Engage, University of Colorado Boulder, by way of the UC Berkeley YPAR Hub"
  basis: >-
    The lesson structure, co-construct principles and practices, exchange challenges silently in writing,
    then test against scenarios, is a method rather than an expression. Every word here is written from
    scratch and the author is credited. The source's four scenarios are replaced entirely rather than
    reproduced.
  note: >-
    Do not restore the source's scenarios. They are set among United States university students doing
    community service and turn on that relationship, which is not the one Amala's learners are in.
sourceRefs:
