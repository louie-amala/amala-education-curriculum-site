provenanceNote: >-
  Rewritten from the YPAR Hub's "Principles and Practices of Community Partnerships", supplied to Amala in
  August 2026. The structure is the source's and is strong: co-construct the two lists, challenge them in
  a silent written gallery walk, then test them against scenarios, then add what was missing. The four
  dilemmas here are Amala's own, written for learners researching communities they belong to as well as
  ones they do not, and the closing distinction between what you owe a community you will leave and one
  you will still be living in is Amala's.
