learnerContent: |
  ## My research book

  This is the front of your book - the book you keep for the whole course.

  On the cover you can:

  - Put your name or your own mark, so you always know the book is yours.
  - Draw a small picture of our hills if you wish.

  The next page, "how I use my book", reminds you how the book works:

  - Drawings and pictures are welcome.
  - Marks and small signs that mean something to you are welcome.
  - A few words are fine, when a word helps.
  - No one grades your book right or wrong. It is yours.

  Keep your book safe, and bring it every time the group meets. If it gets rained on or torn, that is
  all right - the thinking inside it is what matters.
