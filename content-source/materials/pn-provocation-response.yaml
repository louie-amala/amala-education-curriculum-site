    file: /downloads/pn-provocation-response.docx
    format: Word
    role: worksheet
    note: >-
      A generic analysis task with a six-part framework, a reflection section, and a formative rubric.
      Choose any provocation that suits your context; the facilitator adds the summative success indicators.
