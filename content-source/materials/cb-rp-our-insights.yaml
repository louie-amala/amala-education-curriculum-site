primaryContext: independent
learnerContent: |
  ## Our insights — what we found and why it matters

  Use this page to write our insights — the few clear things we now understand from all our evidence.
  Write or draw one insight at a time.

  For each insight, the sheet has room for:

  - What we found (the finding — what the evidence says).
  - What it means and why it matters for our hills and the people who live on them.
  - What could be done about it.
  - The evidence behind it (which sources, or what people said, or what we saw).
  - Is this what the evidence shows, or is it our opinion?

  Keep this page in your research book. These insights are what our whole investigation was building
  towards, and what we will share in the last step.
