provenanceNote: >-
  Contextualised, fully offline adaptation for the Learning Bridge+ (Cox's Bazar) edition, drawing on
  efi-phonics-table-student and efi-mv-vocabulary-recycling-games. The source Phonics Table is a written grid
  of sounds, spelling patterns, and example words that assumes a learner already literate in their Home
  Language; this version is rebuilt for emergent literacy as a visual "My Voice book" grown across the unit,
  where each entry is drawn, named in English, and translated by the learner into a language they know, and
  where collected words are kept alive through oral recycling games. Objective 1 of the My Voice unit.
