id: galtungs-violence-triangle
slug: galtungs-violence-triangle
access: public
type: concept
title: Galtung's violence triangle
summary: A model of three connected forms of violence - direct, structural and cultural - where only the top is visible and the two hidden forms keep producing it.
facilitationContext: [group, independent]
primaryContext: group
deliveryAdaptations:
  - context: group
    how: >-
      As designed. The insight that does the work is that the visible fighting is only the tip, so
      run it as a live sort: give the group a real incident of violence from their context and keep
      asking "what beneath this made it possible?" until they have populated the structural and
      cultural corners themselves rather than being told them.
  - context: independent
    how: >-
      The three-corner model is simple enough to grasp alone from the diagram, but without a
      facilitator most learners stop at the direct corner. Give the three guiding questions in
      writing (what is the visible harm, what systems produce it, what beliefs make it seem normal)
      and require an entry at every corner before they move on.
educatorContent: |
  Johan Galtung's violence triangle is one of the most useful frames in peacebuilding because it stops learners treating violence as a single, visible event. Galtung argued that visible harm is only the tip of a triangle; two larger, hidden forms sit beneath it and keep producing it.

  ## The three corners

  - Direct violence - visible harm with a clear actor, act and victim: an attack, a threat, an act of humiliation. It is what most people mean by "violence".
  - Structural violence - harm built into the way a society is organised: poverty, exclusion, or denial of rights that damages people with no single attacker. Galtung defined it as the gap between how well people could live and how well the structure actually lets them.
  - Cultural violence - the beliefs, stories, religion, ideology or language used to make the other two forms look normal, natural or even right.

  ## Why it is a triangle, not a list

  The point of the model is the relationships between the corners, not the corners themselves. Cultural violence legitimises structural and direct violence; structural violence produces the grievances that erupt as direct violence. It is a cycle that keeps regenerating unless all three corners are addressed - which is exactly why stopping the fighting (achieving a negative peace) so often fails to last.

  The "waterline" in the diagram carries the second key idea: only direct violence is visible. Structural and cultural violence are normalised and easy to miss - they can look like "just how things are". Naming them is what lets learners see that a context with no open fighting can still be deeply violent.

  ## How to use it with learners

  This is a concept for understanding a conflict, not for solving it yet. The teaching move that matters is direction of travel: learners will readily describe the direct violence, so your job is to keep pressing beneath it - "what systems allowed this?", "what beliefs made it acceptable?" - until the hidden corners are populated with evidence rather than assumption. Keep the completed triangle: it feeds directly into deciding where a peacebuilding idea should act, since a durable idea usually has to change something in the structural or cultural corner, not only the visible one.

  Watch for two things: learners collapsing structural and cultural into each other (structure is how a system is arranged; culture is what makes that arrangement feel right), and learners treating the hidden corners as fixed facts rather than things that can be changed.
learnerContent: |
  When we see violence, we usually see only the visible part - someone hurting someone else. Galtung's triangle says that is just the tip. Two hidden forms sit underneath and keep it going:

  - Direct violence: the visible harm - an act, an actor, a victim.
  - Structural violence: harm built into unfair systems, like poverty or exclusion, with no single attacker.
  - Cultural violence: the beliefs and stories that make the other two seem normal or deserved.

  As you look at a conflict in your own context, try filling in all three corners. Ask: what is the visible harm? What systems produce it? What beliefs make people accept it? The most lasting peace ideas usually change something in the hidden corners, not just the visible one.
agencyContribution:
  indicators: [contribution-to-community]
  how: >-
    Seeing past the visible fighting to the systems and beliefs that keep producing it gives
    learners an evidenced account of why violence persists in their community - the kind of
    understanding that makes a contribution towards peace land on a real cause rather than a symptom.
principlesForegrounded: [authentic-challenges, safe-spaces]
principleAlignment:
  - principle: authentic-challenges
    how: >-
      The triangle is only ever filled in against a real context of violence the learners are
      investigating, so the hidden corners become the questions they take into their research rather
      than a worked example to memorise.
  - principle: safe-spaces
    how: >-
      Because the model asks learners to name structural and cultural violence in contexts they may
      have lived through, it is used with agreed ground rules and the option to work from case
      studies rather than personal experience, so the analysis never requires anyone to expose themselves.
competencyCodes: [FPS3, FUS3]
competencyDevelopment:
  - code: FPS3
    how: >-
      The structural corner is this competency directly - naming, with evidence, the systems and
      relationships that contribute to violence rather than asserting a single cause.
  - code: FUS3
    how: >-
      The cultural corner asks learners to explore the beliefs, values and norms that legitimise
      violence, which is the intercultural understanding this competency describes.
objectiveIds: [peacebuilding--o1]
relatedSlugs: []
diagram:
  src: /diagrams/galtungs-violence-triangle.svg
  alt: >-
    A triangle with direct violence at the top above a dashed waterline marking the visible from the
    hidden, and structural violence (bottom left) and cultural violence (bottom right) below it.
    Arrows show cultural violence justifying both structural and direct violence, and structural
    violence producing direct violence.
  caption: >-
    Only direct violence sits above the waterline. Structural and cultural violence are hidden, and
    keep producing the violence we see.
links:
