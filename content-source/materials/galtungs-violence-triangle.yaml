    url: https://journals.sagepub.com/doi/10.1177/002234336900600301
    note: Introduces direct and structural violence, and the negative/positive peace distinction.
  - label: "Galtung, J. - Cultural Violence (1990)"
    url: https://journals.sagepub.com/doi/10.1177/0022343390027003005
    note: The later paper adding the third corner - culture as what legitimises violence.
