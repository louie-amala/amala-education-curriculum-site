sourceRefs:
  - "AMALA Global Secondary Diploma (GSD) Educator Guide / Handbook — Student Mentor Playbook"
provenanceNote: >-
  Generalised from the Playbook's "Supporting assigned students in identifying and actualising
  pathways" — the guidance that a mentor regularly meets students to discuss pathway interests and
  strategise next steps, keeping options realistic.
