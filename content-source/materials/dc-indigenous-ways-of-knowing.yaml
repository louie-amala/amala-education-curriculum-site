id: dc-indigenous-ways-of-knowing
slug: dc-indigenous-ways-of-knowing
access: public
type: activity
title: Indigenous and cultural ways of knowing wellness
summary: Learners explore understandings of wellness beyond a single Western clinical model, drawing on
  indigenous, traditional and cultural ways of knowing to broaden how they think about strengthening
  wellbeing locally.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners study a holistic model of wellness alone, then share insights in breakout
    groups. The group step is where the value sits, because hearing how peers picture wellness widens
    everyone's sense of what wellbeing can mean, so keep the sharing step even if you shorten the
    reading.
- context: one-to-one-mentoring
  how: >-
    A good fit for depth over range. A mentor and learner work through one model of wellness together
    and connect it to the learner's own context, but the learner loses the plurality of views a group
    surfaces, so bring at least one perspective different from the learner's own into the conversation.
- context: independent
  how: >-
    Workable for the reflection, weaker for the broadening. A learner alone tends to stay inside their
    own frame; ask them to seek out at least one wellness tradition unfamiliar to them and, if
    possible, discuss it with someone from or close to that tradition.
duration: 30-40 min facilitated
grouping: Individual reflection, then breakout groups of 3-5; works with 10-35 learners
whatLearnersDo:
- Study a holistic model of wellness from a cultural tradition different from a single clinical one.
- Sketch your own picture of wellness and the words you would put at its centre.
- Share one insight in your group about a way of knowing wellness that was new to you.
- Discuss what these wider understandings mean for strengthening wellbeing in your own context.
materialsAndPreparation:
- A holistic model or visual depiction of wellness from a cultural or indigenous tradition, with a short written explanation, adapted to your context.
- A way for each breakout group to record its discussion and a nominated scribe.
- "[to verify]: any specific cultural claim used here must be checked with knowledgeable community sources and adapted to your context, rather than taken from a single second-hand summary."
- "Sensitivity: wellness beliefs are tied to identity, faith and family. Value diverse ways of knowing, avoid stereotyping, and be clear that no one person speaks for a whole culture. Make room for learners who hold traditional understandings and for those who do not, and let anyone pass without explaining why."
facilitationNotes: |
  The point is to loosen the assumption that there is one correct, clinical picture of wellness, and to
  show that many cultures hold rich, holistic understandings learners can draw on. The one thing to get
  right is respect: these are living beliefs, not exhibits, so treat every tradition as a real way of
  knowing rather than a curiosity. Keep the focus on broadening, not ranking. Learners are not deciding
  which model is best, they are widening the range of ideas they can use when they think about
  strengthening wellbeing where they live.
steps:
- title: Study a holistic model of wellness
  duration: 10-15 min
  guidance: |
    Give learners quiet time to look closely at a holistic model of wellness from a cultural tradition,
    then read the short explanation with it. Ask them to notice what it includes that a narrow clinical
    picture might leave out: connection to land, community, spirit, balance. The aim is to let a
    different way of knowing land on its own terms before any discussion begins.
  keyPrompts:
  - What does this model of wellness include that a purely clinical view might miss?
  - Which parts of it feel familiar to you, and which are new?
  - What does this tradition seem to treat as the source of wellbeing?
  watchOuts:
  - Learners judge an unfamiliar tradition as less valid than a clinical one; frame every model as a serious way of knowing and steer away from ranking them.
  adaptation: |
    With no connectivity, a printed image and a read-aloud of the written explanation is enough. If no
    print is possible, describe the model aloud and have learners sketch it as you speak.
- title: Sketch your own picture of wellness
  duration: 5-10 min
  guidance: |
    Ask each learner to draw a simple picture of wellness as they understand it and to write the few
    words they would place at its centre. This makes the abstract personal and gives each learner
    something of their own to bring to the group, rather than only reacting to someone else's model.
  keyPrompts:
  - If you drew your own picture of wellness, what would sit at the centre?
  - Which words matter most to you, and where did they come from?
  - What in your own life or culture shapes how you picture being well?
  watchOuts:
  - A learner feels they have no tradition to draw on; reassure them that family, place and everyday practice are ways of knowing too, and no picture is too small to count.
- title: Share insights in breakout groups
  duration: 10-15 min
  guidance: |
    In breakout groups with a scribe, each learner shares one insight about a way of knowing wellness
    that was new to them. Keep it to sharing and curiosity, not debate over which view is right. The
    value is in the range of understandings the group hears, so make sure quieter voices are invited in.
  keyPrompts:
  - What is one way of understanding wellness you had not considered before today?
  - Where did your group's pictures of wellness overlap, and where did they differ?
  - What could you learn from a picture of wellness that is not your own?
  watchOuts:
  - One learner speaks for a whole culture or the group slides into stereotype; remind them that individuals differ within any tradition and no one person represents all of it.
- title: Connect this to strengthening wellbeing where you live
  duration: 5-10 min
  guidance: |
    Bring it back to the challenge learners are investigating. Ask what these wider understandings mean
    for strengthening wellbeing in their own context: which local, cultural or community sources of
    wellbeing a narrow clinical lens would overlook. This turns a broadening exercise into a real input
    for how they frame the problem.
  keyPrompts:
  - What sources of wellbeing in your own community might a purely clinical approach overlook?
  - How could a wider view of wellness change the way you frame the challenge you are working on?
  - Who in your community already holds knowledge about wellbeing that you could learn from?
  watchOuts:
  - Learners treat one tradition's practices as a solution to lift wholesale into another setting; keep them grounded in what fits their own context and in checking claims with knowledgeable local sources.
closing: |
  Draw the threads together: wellness is understood in many ways, and a wider view gives learners more
  to work with when they think about strengthening wellbeing locally. Close by reminding them that
  specific cultural understandings belong to the communities that hold them and should be learned with,
  not about, those communities.
agencyContribution:
  indicators:
  - contribution-to-community
  how: >-
    Widening how they understand wellness lets learners draw on the real sources of wellbeing already
    present in their own communities, rather than importing a single external model. That is what makes
    any contribution they go on to design fit the people it is meant to serve.
principlesForegrounded:
- builds-on-identities
- safe-spaces
- collaboration
principleAlignment:
- principle: builds-on-identities
  how: >-
    Learners sketch wellness from their own life and culture before meeting other models, so the
    activity starts from and honours who they are rather than replacing their understanding with an
    external clinical template.
- principle: safe-spaces
  how: >-
    Wellness beliefs are tied to faith, family and identity, so the activity is explicitly framed to
    value diverse ways of knowing, avoid stereotyping, and let any learner pass without explaining why,
    keeping personal and cultural beliefs safe from judgement.
- principle: collaboration
  how: >-
    The breakout sharing is built on the fact that a group holds more ways of understanding wellness
    than any one learner, so each person's view is widened by hearing the others rather than limited to
    their own frame.
competencyCodes:
- FUS3
- FUS2
competencyDevelopment:
- code: FUS3
  how: >-
    Engaging seriously with wellness as understood in cultural and indigenous traditions different from
    a single clinical model, on those traditions' own terms, is direct practice in exploring other
    cultures; each learner's shared insight is the evidence.
- code: FUS2
  how: >-
    Recognising that people picture wellbeing differently depending on their culture, faith and life,
    and learning from views unlike their own, develops the understanding of other people that this
    activity turns on.
