provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, adaptations, delivery
  modes, a sensitivity note and a to-verify note) from the Design Challenge activity guide, which
  supplied the purpose, the individual reflection on a holistic model of wellness and the breakout
  discussion. The source Design Challenge investigates the mental health and wellbeing of Afghan
  females and drew on a First Nations model of wellness [to verify]; this material is generalised
  respectfully to any cultural or indigenous way of knowing, with a localisation note that specific
  cultural claims must be checked with knowledgeable community sources. Linked to Research Project
  objective 1 (framing a real-world challenge).
