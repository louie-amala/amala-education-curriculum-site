id: pathways-exploring-a-career-focus
slug: pathways-exploring-a-career-focus
access: public
type: activity
title: Exploring a career focus
summary: Learners explore potential careers and fields, connecting their interests and strengths to
  real roles, so they can narrow towards a focus to explore rather than commit to for life.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners explore in pairs so each can prompt the other towards roles they would not
    have considered alone, then reflect in breakout groups. Keep the breakout reflection even if you
    shorten the exploration, since hearing what surprised peers surfaces focuses a learner had ruled
    out too early.
- context: one-to-one-mentoring
  how: >-
    A strong fit. The mentor plays the exploring partner and, ideally, is or can introduce someone who
    actually does a role the learner is curious about. The mentor should widen the field of options
    before helping narrow it, and resist steering the learner towards the mentor's own preferred career.
- context: independent
  how: >-
    Workable but weaker, because the learner loses the peer prompting that opens up unfamiliar roles.
    If a learner works alone, ask them to talk to at least one person who does work they are curious
    about, even by message, and to record what that person told them the role actually involves.
duration: 45-55 min facilitated, plus the journal task
grouping: Pairs for exploration, then breakout groups of 3-5; works with 10-35 learners
whatLearnersDo:
- Work through the career focus tasks in the video and slides with a partner.
- Connect your interests and strengths to real roles and fields you could explore.
- Find out what one role actually involves day to day, and from someone who does it where you can.
- Document your exploration in your Pathways Journal.
- Discuss in a breakout group what you learned about yourself and your next steps.
materialsAndPreparation:
- 'The "Pathway planning: career focus" video and slides, or your own worked walkthrough if you prefer to lead it live.'
- The Pathways Journal, one per learner, for recording the exploration (printed or digital).
- A way for each breakout group to keep notes, and a nominated scribe per group.
- "[to verify] Where you can, line up one or two people who do relevant roles to speak briefly or
  answer questions, as first-hand accounts of a job land harder than a slide; check who is realistically
  available in your context before promising this to learners."
facilitationNotes: |
  This activity turns a vague sense of "what job might suit me" into a focus a learner can actually
  investigate. The one thing to get right is that a focus is a direction to explore, not a lifelong
  commitment. Learners freeze when they think they are choosing a career for good, so keep reminding
  them they are opening options, not closing them. Your job is to help each learner connect what they
  already enjoy and are good at to real roles, and to widen the field before helping them narrow it,
  not to confirm the first idea they arrive with.
steps:
- title: Frame a focus as a direction to explore, not a decision for life
  duration: 5-10 min
  guidance: |
    Open by defining a career focus as a field or type of role a learner will look into next, not a
    binding choice. Give a short honest example of a focus that shifted as someone learned more. The
    point is to lower the stakes so learners explore widely, rather than defend the first career that
    comes to mind or refuse to name one for fear of being held to it.
  keyPrompts:
  - What is the difference between exploring a career and committing to one?
  - What could change your focus once you learn more about a role?
  - If you knew you could change your mind later, what would you be curious to look into?
  watchOuts:
  - Learners treat this as picking a final career and freeze; restate plainly that a focus is a starting point they are free to revise, and that changing it later is a sign of learning, not failure.
  adaptation: |
    With no slides or connectivity, this needs only you speaking one honest example aloud and writing
    the phrase "a direction to explore, not a commitment" where learners can see it.
- title: Connect your interests and strengths to real roles
  duration: 15-20 min
  guidance: |
    Learners work through the career focus tasks in pairs, mapping what they enjoy and are good at onto
    real roles and fields. The partner's job is to suggest roles the writer would not think of for
    themselves. Circulate and widen the field where a pair narrows too fast, and ask learners to record
    the roles they want to explore in their Pathways Journal.
  keyPrompts:
  - What kinds of tasks make you lose track of time, and where might people get paid to do them?
  - What are you often asked to help others with, and what roles use that strength?
  - Which of these roles would you actually want to know more about?
  watchOuts:
  - A learner fixes on one familiar job, such as doctor or teacher, and stops; ask them to name two more roles that use the same strength, so the focus is chosen from options rather than defaulted to the first one.
  adaptation: |
    If the video cannot be shown, walk through the same tasks aloud from the slides or your own notes;
    learners can map interests to roles on paper and copy it into the journal later. No device is required.
- title: Find out what a role actually involves
  duration: 10-15 min
  guidance: |
    Push past the job title to the daily reality of one role each learner is curious about: what the
    work involves, what it demands, and how people enter it. Where you have arranged for someone who
    does the role to speak or answer questions, use them now. Otherwise have learners note what they
    already know and, crucially, what they still need to find out.
  keyPrompts:
  - What does a person in this role actually do on a normal working day?
  - What would you need to learn or gain to move towards this role?
  - What is one thing about this role you cannot answer yet and need to find out?
  watchOuts:
  - Learners judge a role on its image rather than its reality; steer them to concrete daily tasks and entry routes, and treat an honest "I do not know yet" as a useful research question, not a gap to paper over.
  adaptation: |
    With no guest speaker available, a learner can talk to one person who does relevant work by phone
    or message before the next session, or read one honest first-person account of the role.
- title: Reflect on your focus in breakout groups
  duration: 10-15 min
  guidance: |
    Put learners in groups of three to five with a scribe to compare what they explored. Draw out what
    they learned about themselves, what surprised them, whether their thinking shifted and why, and
    their next steps. Hearing that a peer's thinking changed gives others permission to keep their own
    focus open, which is the outcome that matters most here.
  keyPrompts:
  - What did you learn about yourself from exploring a potential career focus?
  - Did anything surprise you, or did your thinking about a focus change, and why?
  - What are your next steps after this activity?
  watchOuts:
  - The group compares who has "decided" and quieter learners feel behind; frame a shifting or undecided focus as good exploring, and ask the scribe to record a next step for every member, not only those with a firm answer.
  adaptation: |
    With thin attendance or in a mentoring setting, the facilitator or mentor plays the discussion
    partner. Asynchronously, learners post their focus and one surprise in a shared space and reply to
    two others with a next step to suggest.
closing: |
  Ask two or three learners to name one role they will look into further and one thing they still need
  to find out about it. Remind everyone that the focus lives in their Pathways Journal and is meant to
  narrow and shift as they learn more: exploring a career is the work, and changing direction is part
  of doing it well.
agencyContribution:
  indicators:
  - control-of-future-pathways
  how: >-
    Choosing which fields and roles to explore, from options a learner has widened rather than
    inherited, is a direct act of directing their own future. Naming what a role really involves and
    what they still need to find out turns a career from something that happens to them into a
    direction they are actively steering.
principlesForegrounded:
- builds-on-identities
- connect-to-futures
- collaboration
principleAlignment:
- principle: builds-on-identities
  how: >-
    The exploration starts from what each learner already enjoys and is good at, mapping their own
    interests and strengths onto roles, so the focus grows out of who the learner is rather than an
    external list of prestigious careers.
- principle: connect-to-futures
  how: >-
    Learners link present interests and strengths to concrete future roles and the entry routes into
    them, which is exactly the act of connecting who they are now to the future they might build, while
    keeping the focus revisable.
- principle: collaboration
  how: >-
    Pairs suggest roles for each other that neither would reach alone, and the breakout groups let a
    peer's shift in thinking widen everyone's sense of what is open, so the field of options is expanded
    by the group rather than limited to one learner's knowledge.
competencyCodes:
- FSL1
- FUS1
- FR1
competencyDevelopment:
- code: FSL1
  how: >-
    Weighing which roles fit their interests and strengths, and closing by naming what the exploration
    taught them about themselves, is direct practice in self-reflection; the journal entries are the
    evidence.
- code: FUS1
  how: >-
    Connecting what they enjoy and are good at to real roles, and noticing what surprised them or
    shifted their thinking, develops self-awareness of their own interests, strengths and assumptions
    about work.
- code: FR1
  how: >-
    Finding out what a role actually involves and its entry routes, and naming what they still need to
    find out and who could tell them, is direct practice in identifying the resources and people that
    inform a pathway choice.
