id: as-observe-authentic-performance
slug: as-observe-authentic-performance
access: public
type: educator-move
title: "Watch learners perform in authentic contexts"
summary: >-
  Nothing evidences a competency like seeing it in action. Observe performance, planned or by chance,
  and out in the real settings where a learner is doing the work.
tags:
  - id: seeking-evidence
educatorContent: |
  Some of the strongest evidence of a competency is watching a learner do the thing, a presentation,
  a facilitated discussion, a project in action. Performance observation can be planned (set an
  explicit task and make the criteria clear ahead of time) or caught by chance (you happen to see a
  learner skilfully resolve a disagreement), in which case a strong grip on the criteria lets you
  document it and link it to what it evidences.

  Site visits take this into the real world: go with the learner (following safeguarding, health and
  safety) to where a project is actually happening, agree in advance what the visit is meant to
  evidence, and let them show you the work in action while you ask follow-up questions in real time.
  Authentic performance is hard to fake and rich to probe; it is time-consuming, so it is often best
  where you can assess several learners, or several criteria, at once.
agencyContribution:
  indicators:
    - contribution-to-community
    - control-of-future-pathways
  how: >-
    Assessing learners on real performance in authentic settings recognises the competencies they are
    actually using to act in the world, not just what they can write about.
principleAlignment:
  - principle: authentic-challenges
    how: >-
      Observing performance in real tasks and real settings assesses competence where it genuinely
      lives, in authentic challenges rather than proxies for them.
  - principle: feedback-and-data
    how: >-
      Seeing a learner perform, against clear criteria, is direct evidence you can act on and feed
      back.
relatedSlugs:
