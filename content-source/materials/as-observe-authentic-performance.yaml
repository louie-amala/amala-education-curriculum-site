sourceRefs:
  - "AMALA Global Secondary Diploma (GSD) Educator Guide / Handbook. Course Facilitator Playbook (Assessment)"
provenanceNote: >-
  Generalised from the Playbook's "Performance Observation" and "Site Visits" methods (agree criteria
  in advance, document planned or chance performance, visit projects in action). Site-visit
  safeguarding note retained.
