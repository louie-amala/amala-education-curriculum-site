# English for Impact resource — Part 3 §10b "Phonics Table for Students".
# Source: The Language Learning Lab "English for Impact" Course Guide (pp. 47–48).
id: efi-phonics-table-student
slug: efi-phonics-table-student
access: public
type: resource
title: "Phonics Table (build your own)"
summary: >-
  A blank version of the Phonics Table that each learner fills in over the course, collecting sounds,
  spelling patterns, and their own example words as they meet them — a personal, growing reference
  for reading, writing, and pronunciation.
facilitationContext: [group, independent]
primaryContext: independent
materialsAndPreparation:
- One blank Phonics Table per learner (printed), plus space to keep it safe and revisit it each week.
- The completed "Phonics Table" model to refer to, and the "Phonics Progression by Unit" for the order sounds are introduced.
facilitationNotes: |
  This is the learner's own copy of the Phonics Table, built up over time rather than handed over
  complete. Each week, as a new sound is taught, learners add it: the sound, the letters that spell
  it, and two to five example words they choose themselves — ideally words from their lessons,
  reading, or their own lives. The table grows across the whole course and becomes a personal
  reference they own.

  The directions on the sheet frame it as a challenge: "There are 26 letters in the English alphabet
  that make 44 sounds. Can you find them all?" Keep the tone exploratory. The value is in the
  collecting and connecting, so protect regular time to add to and review the table, and encourage
  learners to check their spellings with a partner or teacher.
learnerContent: |
  ## Your Phonics Table

  Your Phonics Table is your own tool for learning English sounds and spelling patterns. You will
  build it step by step throughout the course.

  Follow these steps:

  - Listen and notice. When you learn a new sound in class, listen carefully to how it is said.
  - Write the sound. Add the sound to your table (for example: short a, sh, ee).
  - Add spelling patterns. Write the letters or letter combinations that make this sound (for example: a, sh, ee, ea).
  - Collect example words. Add 2–5 words with this sound. Try to choose words that are meaningful to you.
  - Practise saying the words. Say the words out loud to practise pronunciation.
  - Keep adding. Each week, add new sounds and words. Your table will grow over time.

  Tips for success:

  - Use words from your lessons, your reading, or your own life.
  - Check your spelling with your teacher or classmates.
  - Review your table often to help you remember.

  Remember: your Phonics Table is not just for writing — it helps you read, write, and speak English
  more confidently.
