agencyContribution:
  indicators: [power-over-wellbeing-and-self-direction, control-of-future-pathways]
  how: >-
    Building and owning a personal reference — in the learner's own example words, added to at their
    own pace — turns phonics from something done to them into a tool they make and control. A learner
    who has assembled their own map of English sounds can keep improving their reading and writing
    independently, which is what carries them toward further study.
principlesForegrounded: [builds-on-identities, recognise-communicate-growth, connect-to-futures]
principleAlignment:
- principle: builds-on-identities
  how: >-
    Learners choose their own example words — from their lessons, reading, and lives — so the table
    is populated with language that is meaningful to them rather than a fixed word list.
- principle: recognise-communicate-growth
  how: >-
    Because the same table is added to across the whole course, learners can look back and see how
    much they have collected and learned — a visible record of their own progress.
- principle: connect-to-futures
  how: >-
    The table is a personal tool learners keep and reuse, supporting the independent reading and
    writing their further study and work will require.
