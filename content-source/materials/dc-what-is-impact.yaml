provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, adaptations, delivery
  modes and a sensitivity note) from the Design Challenge activity guide, which supplied the purpose,
  the IDEO.org impact definition and the reflection questions. The source Design Challenge investigates
  the mental health and wellbeing of Afghan females; this material is written to generalise to any
  design challenge, with that as the worked example. Linked to Social Entrepreneurship objective 1
  (contributing to understanding a social challenge).
