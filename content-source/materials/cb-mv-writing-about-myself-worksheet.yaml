# Student worksheet for cb-mv-writing-about-myself. A thin, visual-first resource - the "Writing a little
# about myself" page from the downloadable Student My Voice book (workbook). One or two scaffolded lines
# to copy/complete a personal sentence, with an oral/drawing alternative for those not yet writing.
# Touches home/family/loss, so it carries a Sensitivity item. Objective 2.
