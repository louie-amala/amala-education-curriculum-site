type: resource
title: "The writing a little about myself page"
summary: >-
  Your page for putting a few of your own words on paper - one or two scaffolded lines to copy and
  complete a personal sentence, with a full drawing-and-saying route for anyone not yet ready to write.
facilitationContext:
- group
