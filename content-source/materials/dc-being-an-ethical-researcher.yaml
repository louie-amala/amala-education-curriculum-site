provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, adaptations, delivery
  modes and a sensitivity note) from the Design Challenge activity guide, which supplied the purpose,
  the reflection prompts and the breakout questions. The source Design Challenge investigates the
  mental health and wellbeing of Afghan females; this material is written to generalise to any
  sensitive challenge, with that as the worked example. Linked to Research Project objective 2.
