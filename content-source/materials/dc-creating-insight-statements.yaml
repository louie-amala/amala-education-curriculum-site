  and the resource-review and discussion questions. The source Design Challenge investigates the
  mental health and wellbeing of Afghan females; this material is written to generalise to any design
  challenge, with that as the worked example. Linked to Research Project objective 3 (evaluating
  evidence and developing actionable insights) and Social Entrepreneurship objective 1.
