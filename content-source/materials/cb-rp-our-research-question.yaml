agencyContribution:
  indicators:
  - control-of-future-pathways
  - power-over-wellbeing-and-self-direction
  how: >-
    Taking a big question apart into the specific things you will go and find out, and deciding how to find
    each one out, is how a researcher takes control of an inquiry — a way of thinking learners can turn on
    any question that matters to their lives.
principlesForegrounded: [authentic-challenges, builds-on-identities, collaboration]
principleAlignment:
- principle: authentic-challenges
  how: The question is about the real hills the learners live on, and the sub-questions are things they can genuinely go and find out here.
- principle: builds-on-identities
  how: Learners unpack the question through what they already know and see on their own hills, using their own words and pictures.
- principle: collaboration
  how: The whole cohort unpacks the shared question and builds the sub-questions together, holding one common focus.
competencyCodes: [FSI1, FPS3]
competencyDevelopment:
- code: FSI1
  how: Owning and unpacking the given question and turning it into researchable sub-questions is the core framing move (objective 1).
- code: FPS3
  how: The sub-questions target the contributing factors — what a bare slope does in rain and heat, what roots and trees do for the soil.
