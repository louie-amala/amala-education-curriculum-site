# Contextualised, fully offline FRAMING activity for the Research Project component of Learning Bridge+
# (Cox's Bazar). The cohort is GIVEN the research question and makes it their own: unpack it in plain and
# pictorial terms, break it into the four given sub-questions, and decide which parts are answered by
# asking and looking (primary) and which by the supplied source pack. Frame the challenge phase
# (objective 1). Oral and visual first; sentence frames; warm, hopeful tone.
id: cb-rp-our-research-question
slug: cb-rp-our-research-question
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "Make our research question our own"
summary: >-
  The whole cohort is given one research question — "What happens to our hills without trees, and what
  changes when trees and plants grow back?" — and makes it their own. They unpack what it is really asking,
  break it into four sub-questions (including what people are doing to help, and whether it is working),
  and decide which parts they answer by asking and looking, and which by the source pack.
facilitationContext:
- group
primaryContext: group
duration: "2 hours facilitated + 0.5 hour independent"
grouping: "Whole group to unpack; pairs for the sub-questions"
whatLearnersDo:
- Meet the research question the whole cohort will investigate, shown big in words and pictures.
- Unpack what it is really asking, in plain, pictorial terms, until everyone understands it.
- Break it into four sub-questions — before and now; a bare hill in rain and hot sun; what roots, grass, and trees do; and what people are doing to help, and whether it is working.
- Decide which parts we answer by asking people and looking here (primary), and which the source pack will help with.
- Capture the question and its four sub-questions, big on the wall and in every research book.
materialsAndPreparation:
- "The research question written and drawn big to show: \"What happens to our hills without trees, and what changes when trees and plants grow back?\""
- Space to show the four sub-questions as pictures the group builds up together.
- The "what we know / what we still need to find out" wall and the community map from the earlier activities, nearby.
- Simple sentence frames on hand, such as "Before, …; now, …", for learners to lean on.
visuals:
- kind: setup
  title: "One question, three things to find out"
  caption: >-
    The given question, broken into the four sub-questions the cohort will actually go and find out —
    built up together as pictures on the wall.
  spec:
    type: zones
    zones:
    - label: "1. Before & now"
      tone: neutral
      cards:
      - "what changed?"
    - label: "2. Rain & hot sun"
      tone: neutral
      cards:
      - "damage to a bare hill?"
    - label: "3. Roots & trees"
      tone: neutral
      cards:
      - "what they do for us"
    - label: "4. Who's helping — does it work?"
      tone: neutral
      cards:
      - "planting, gas — is it working?"
- kind: example
  title: "How we'll answer each part"
  caption: >-
    For each sub-question the cohort decides: can we find this out by asking and looking here, or does the
    source pack help? This sets up the next phase.
  spec:
    type: zones
    flow: across
    zones:
    - label: "Ask & look here"
      sublabel: "primary — our own community"
      tone: known
      cards:
      - "Before & now: ask elders"
      - "See a slope in the rain"
    - label: "The source pack"
      sublabel: "secondary — supplied reading"
      tone: neutral
      cards:
      - "What roots do for soil"
      - "What science found"
facilitationNotes: >-
  The one thing to get right: the question is given, but the framing work is real. The cohort does not
  invent a question from nothing — one shared question keeps a single focus and suits this cohort — but
  making it theirs is genuine research work: unpacking what it asks, breaking it into the four
  sub-questions, and deciding what is answered by asking and looking versus by the source pack. Use
  pictures and sentence frames throughout, and keep it hopeful — the last sub-question is about what
  people are already doing to help, and whether it is working, which learners answer both from the source
  pack and by asking and looking here. If a cohort adds a sub-question of its own, welcome it as long as
  it stays answerable here.
steps:
- title: "Our question, in plain words and pictures"
  duration: "40 min"
  guidance: >-
    Show the research question big, in words and a picture. Unpack it together in plain, pictorial terms:
    what does "without trees" look like, what does "grow back" look like. Do not rush — the whole group
    should understand what the question is really asking before moving on.
  keyPrompts:
  - "What is this question really asking us to find out?"
  - "What does a hill without trees look like? What does it look like when trees grow back?"
- title: "Break it into four things to find out"
  duration: "50 min"
  guidance: >-
    Build the four sub-questions together, as pictures: (1) what were our hills like before, and what are
    they like now; (2) what happens to a bare hill when it rains and in the hot sun; (3) what do trees,
    grass, and roots do for the soil and for us; (4) what are people doing to help our hills, and is it
    working. Use the frame "Before, …; now, …" for the first. These four are what the cohort will actually
    go and find out. The fourth keeps the tone hopeful — people are already acting — and it is one we can
    both read about in the source pack and check by asking and looking here.
  keyPrompts:
  - "Before, our hills were …; now, they are …"
  - "What happens to a bare hill in the heavy rain? In the hot sun?"
  - "What do roots, grass, and trees do for the soil and for us?"
  - "What are people doing to help our hills — and is it working?"
- title: "Asking and looking, or the source pack?"
  duration: "30 min"
  guidance: >-
    Go through the four sub-questions and decide, together, which parts we can answer by asking people
    and looking around us here (primary), and which the supplied source pack will help with. This sets up
    the next phase. Capture the question and its four sub-questions, big on the wall and in every research
    book, in words and pictures.
  keyPrompts:
  - "Can we find this out by asking and looking here, or do we need the source pack?"
  - "Who from our map could help us answer this one?"
learnerContent: |
  ## Make our research question our own

  Our whole group shares one research question: what happens to our hills without trees, and what changes
  when trees and plants grow back? We did not have to invent it — but we do make it our own. That means
  understanding exactly what it asks, and turning it into the real things we will go and find out.

  Why are we finding this out? Because these hills are ours — what happens to them touches our safety, our
  homes, and our health. When we understand a challenge with real evidence instead of guessing, we can
  think clearly about it. And people are already working to help the hills — so we can also find out
  whether what they are doing is working. Learning to find things out like this is a skill we can use for
  any challenge in our lives.

  We break our question into four smaller questions:

  - Before, our hills were …; now, they are … (what changed?)
  - What happens to a bare hill when the heavy rain comes, and in the hot sun?
  - What do trees, grass, and roots do for the soil — and for us?
  - What are people doing to help our hills — and is it working?

  Then we decide, for each one, how we will find out: by asking people and looking around us here, or by
  reading the source pack. We keep our question and our four sub-questions big on the wall and in every
  research book, so we never lose sight of what we are trying to find out.
