      - "What science found"
facilitationNotes: >-
  The one thing to get right: the question is given, but the framing work is real. The cohort does not
  invent a question from nothing - one shared question keeps a single focus and suits this cohort - but
  making it theirs is genuine research work: unpacking what it asks, breaking it into the four
  sub-questions, and deciding what is answered by asking and looking versus by the source pack. Use
  pictures and sentence frames throughout, and keep it hopeful - the last sub-question is about what
  people are already doing to help, and whether it is working, which learners answer both from the source
  pack and by asking and looking here. If a cohort adds a sub-question of its own, welcome it as long as
  it stays answerable here.
steps:
- title: "Our question, in plain words and pictures"
  duration: "40 min"
  guidance: >-
    Show the research question big, in words and a picture. Unpack it together in plain, pictorial terms:
    what does "without trees" look like, what does "grow back" look like. Do not rush - the whole group
    should understand what the question is really asking before moving on.
  keyPrompts:
  - "What is this question really asking us to find out?"
  - "What does a hill without trees look like? What does it look like when trees grow back?"
- title: "Break it into four things to find out"
  duration: "50 min"
  guidance: >-
    Build the four sub-questions together, as pictures: (1) what were our hills like before, and what are
    they like now; (2) what happens to a bare hill when it rains and in the hot sun; (3) what do trees,
    grass, and roots do for the soil and for us; (4) what are people doing to help our hills, and is it
    working. Use the frame "Before, …; now, …" for the first. These four are what the cohort will actually
    go and find out. The fourth keeps the tone hopeful - people are already acting - and it is one we can
    both read about in the source pack and check by asking and looking here.
  keyPrompts:
  - "Before, our hills were …; now, they are …"
  - "What happens to a bare hill in the heavy rain? In the hot sun?"
  - "What do roots, grass, and trees do for the soil and for us?"
  - "What are people doing to help our hills - and is it working?"
- title: "Asking and looking, or the source pack?"
  duration: "30 min"
  guidance: >-
    Go through the four sub-questions and decide, together, which parts we can answer by asking people
    and looking around us here (primary), and which the supplied source pack will help with. This sets up
    the next phase. Capture the question and its four sub-questions, big on the wall and in every research
    book, in words and pictures.
  keyPrompts:
  - "Can we find this out by asking and looking here, or do we need the source pack?"
  - "Who from our map could help us answer this one?"
learnerContent: |
  ## Make our research question our own

  Our whole group shares one research question: what happens to our hills without trees, and what changes
  when trees and plants grow back? We did not have to invent it - but we do make it our own. That means
  understanding exactly what it asks, and turning it into the real things we will go and find out.

  Why are we finding this out? Because these hills are ours - what happens to them touches our safety, our
  homes, and our health. When we understand a challenge with real evidence instead of guessing, we can
  think clearly about it. And people are already working to help the hills - so we can also find out
  whether what they are doing is working. Learning to find things out like this is a skill we can use for
  any challenge in our lives.

  We break our question into four smaller questions:

  - Before, our hills were …; now, they are … (what changed?)
  - What happens to a bare hill when the heavy rain comes, and in the hot sun?
  - What do trees, grass, and roots do for the soil - and for us?
  - What are people doing to help our hills - and is it working?

  Then we decide, for each one, how we will find out: by asking people and looking around us here, or by
  reading the source pack. We keep our question and our four sub-questions big on the wall and in every
  research book, so we never lose sight of what we are trying to find out.

educatorContent: |
  ## What you need to know before you teach this

  The cohort is given its question rather than inventing one. That is a deliberate choice - one shared
  focus, realistic for an A1-English oral group - and it does NOT make this block a formality. Owning
  and unpacking a question is real framing work, and it is what evidences the first objective.

  ### Break the big question into things you can actually go and find out

  This is the skill. A big question cannot be researched directly; it has to be cut into pieces small
  enough that you can picture yourself finding the answer.

  The test for a good sub-question: **can you say who you would ask, or what you would look at?** If a
  learner cannot answer that, it is still too big.

  The four are: what were our hills like before, and now · what happens to a bare hill in rain and hot
  sun · what do trees, grass and roots do for the soil and for us · what are people doing to help, and
  is it working.

  ### Then sort them: ask-and-look, or the source pack?

  Learners need to see that different questions get answered different ways.

  - "What were the hills like before?" - ask people who were here. Nothing in the pack can tell us.
  - "Why does a bare slope slide?" - the pack. Nobody here measured it.
  - "Are people helping, and is it working?" - both, and that is the interesting one.

  Doing this sort now saves a fortnight later, because learners stop trying to interview their way to
  an answer that was in a source all along.

  ### Make it visible and keep it up

  The question and its four sub-questions go big on the wall, in words and pictures, and into every
  research book. You will point at them constantly for the rest of the component - when evidence comes
  in, ask which sub-question it answers. Evidence that answers none of them is a signal to check
  whether the question has drifted.

  ### If a cohort wants to add one

  Welcome it if it is answerable here and safe. A cohort that adds a sub-question of its own has taken
  ownership of the question, which is exactly what this block is for.

  ## Before they leave this block

  - Every learner can say the main question in their own words, without reading it.
  - Four sub-questions, in words and pictures, on the wall and in every book.
  - Each sub-question sorted: ask-and-look, source pack, or both.
  - Learners can say, for one sub-question, who they would ask or what they would look at.
learnerTeaching:
  title: "How to turn a big question into things we can find out"
  readAloud: |
    ## How to turn a big question into things we can find out

    Our question is:

    **What happens to our hills without trees, and what changes when trees and plants grow back?**

    That is a good question. It is also too big to answer all at once. Nobody could walk out today and
    answer it.

    So we cut it into pieces.

    ### What makes a good piece

    A good sub-question is small enough that **you can picture yourself finding the answer**.

    Test it like this: **can I say who I would ask, or what I would look at?**

    - "Why is the world getting hotter?" - no. Who would you even ask?
    - "What did this hill look like when my grandmother was young?" - yes. You would ask her, and
      people her age.

    If you cannot say who or what, the piece is still too big. Cut it again.

    ### Our four pieces

    1. What were our hills like **before**, and what are they like **now**?
    2. What happens to a bare hill **when it rains**, and **in the hot sun**?
    3. What do **trees, grass and roots** do for the soil, and for us?
    4. What are **people doing to help** our hills - and is it working?

    ### Different questions, different ways of finding out

    Not every question is answered the same way. There are two ways, and you have to pick the right one.

    - **Ask and look here** - for things only people here know. Nothing in any book can tell us what
      this hill looked like thirty years ago. Only someone who saw it can.
    - **The source pack** - for things that have already been studied. Nobody here measured why a bare
      slope slides, but scientists have.
    - **Both** - question 4 is like this. We can look and ask around us, AND read what has been written.

    Working this out now saves us weeks. Otherwise you spend days asking people something that was in a
    source all along.

    ### Keep the question in front of you

    Our question and the four pieces go on the wall, and in your book.

    Every time we find something, ask: **which of our four does this answer?** If it answers none of
    them, that is worth noticing too.
  words:
    - term: research question
      meaning: the big thing we are trying to find out
    - term: sub-question
      meaning: one smaller piece of the big question, that we can actually go and answer
    - term: primary
      meaning: finding out by asking people and looking ourselves
  tryIt:
    intro: >-
      Would you answer each of these by ASKING AND LOOKING here, or from the SOURCE PACK? Circle your
      answer, then check at the back of the book.
    chooseFrom: ["ask and look", "source pack"]
    items:
      - "What did this hillside look like before the camps?"
      - "Why does water run off a bare slope faster than a slope with roots?"
      - "Where does the water go when it rains near our shelters?"
      - "How much hotter does land get when the forest is cut down?"
    answers:
      - "Ask and look. Only people who were here can tell us. No book has this."
      - "Source pack. This has been studied and measured by people whose job it is. We could not measure it ourselves."
      - "Ask and look. This is about our own place, right now - go and see, and ask people who live there."
      - "Source pack. Scientists measured this over years. We can use their number and then check it against what we feel here."
    then: >-
      Now take our four sub-questions and mark each one: ask and look, source pack, or both.
