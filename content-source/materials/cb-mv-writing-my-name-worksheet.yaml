# Student worksheet for cb-mv-writing-my-name. A thin resource: the learner-facing page the activity refers
# to, with tracing lines for the learner's own name and a few key personal words. Recognition and tracing
# come before free writing. Its printable form is one page of the Student My Voice book (workbook).
id: cb-mv-writing-my-name-worksheet
