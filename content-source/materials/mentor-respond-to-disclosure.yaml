  - mentor-notice-and-respond
sourceRefs:
  - "AMALA Global Secondary Diploma (GSD) Educator Guide / Handbook — Student Mentor Playbook"
provenanceNote: >-
  Added to complete the safeguarding bucket. It operationalises the Playbook's safeguarding and
  open-environment requirements as in-the-moment disclosure practice; the listen / don't investigate
  / don't promise secrecy / report sequence is standard safeguarding guidance, kept policy-deferring.
