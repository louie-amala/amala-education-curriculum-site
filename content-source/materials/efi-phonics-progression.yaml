# English for Impact resource — Part 3 §10c "Phonics Progression by Unit".
# Source: The Language Learning Lab "English for Impact" Course Guide (pp. 49–50).
id: efi-phonics-progression
slug: efi-phonics-progression
access: public
type: resource
title: "Phonics Progression by Unit"
summary: >-
  The 10-part phonics sequence for English for Impact, mapped unit by unit with teaching notes. It
  moves from the most common, useful sounds toward more complex and less predictable patterns —
  ordered to support early reading, writing, and communication rather than by the alphabet.
facilitationContext: [group, independent]
primaryContext: group
materialsAndPreparation:
- The completed "Phonics Table" model and a blank "Phonics Table (build your own)" for each learner.
- Objects, pictures, or example words for each sound; a way to model mouth shapes and voicing.
facilitationNotes: |
  This progression sequences phonics so instruction is always tied to the language learners are using
  in each unit. Sounds are introduced from most common and useful toward more complex and less
  predictable — not in alphabetical order. Each part aligns to a unit, and learners record each new
  sound in their own Phonics Table as they go. Teach patterns through use and lots of listening and
  speaking practice, not memorised rules.
educatorContent: |
  The progression runs in 10 parts across the five units. Parts 1–5 cover the A1 phonics (Units 1–3);
  parts 6–10 cover the A2 phonics (Units 3–5). Each part gives a focus question, the sounds
  introduced, and key teaching notes.

  ## Unit 1 — My Voice (A1)

  ### Part 1: The Alphabet & High-Frequency Sounds

  Focus: What are vowels and what do they do? What are consonants?

  Sounds: short a, o, u; consonants s, t, l, m, n; hard "k" sounds c, k, ck.

  Teaching notes:

  - Double consonants (tt, ll, mm, nn) make the same sound.
  - Teach final consonants clearly — "sock" vs "so" (very different meaning). Final sounds are essential for clarity in English.

  ### Part 2: Plosives (Stop Sounds)

  Focus: How do air and voice change the way we produce sounds?

  Sounds: voiceless / strong air — /p/, /t/, /k/; voiced / use voice — /b/, /d/, /g/; same mouth shape, different voice.

  Teaching notes:

  - Plosives are made by stopping air, then releasing it.
  - Contrast plosive pairs: /p/ ↔ /b/ (pen/bat), /t/ ↔ /d/ (top/dog), /k/ ↔ /g/ (cat/go).

  ## Unit 2 — My Story (A1)

  ### Part 3: Short Vowels & Core Patterns

  Focus: How do small changes in vowel sounds change meaning?

  Sounds: short vowels e, i (review a, o, u); CVC patterns (bat, bet, bit, bot, but); consonants r, y (as a consonant).

  Teaching notes:

  - Short e and i are often hard to hear and produce — use facial cues ("smile for short e!").
  - Emphasise that changing the vowel changes the word meaning.
  - Provide lots of repetition and listening practice.

  ### Part 4: Fricatives (Continuous Sounds)

  Focus: How can we manipulate sounds with breath?

  Sounds: h, f, ff, v, s, ss, z, zz; sh, ch, j, w; th — /θ/ (thin) and /ð/ (this); x at the beginning, middle, and end of words.

  Teaching notes:

  - Fricatives are long, continuous sounds — stretch them when modelling.
  - Contrast voiceless vs voiced partners: /f/ ↔ /v/, /s/ ↔ /z/, /θ/ ↔ /ð/.
  - Encourage learners to feel vibration in the throat for voiced sounds (v, z, th in "this").
  - x makes three sounds: /z/, /gz/, and /ks/.

  ## Unit 3 — Our Stories (A1 → A2)

  ### Part 5: Long Vowels

  Focus: How do vowel sounds change?

  Sounds: long vowels a, e, i, o, u; silent-e pattern (bit → bite, hop → hope); vowel teams (ai, ay, ee, ea, oa); y as a vowel — long i (fly, sky) and long e (happy).

  Teaching notes:

  - Introduce long vowels through clear contrasts with short vowels.
  - Silent e is a high-impact pattern — teach early and revisit often.
  - ea has multiple sounds — teach carefully.
  - Encourage learners to notice patterns across words.

  ### Part 6: Expanding Patterns

  Focus: How are the same sounds spelled?

  Sounds: nasal sound -ng (bang, England, sing, long, hung; present-progressive tense); hard and soft c and g; silent k (kn) and g (gn).

  Teaching notes:

  - Soft c and g often appear before e, i, y (cent, city, cycle; germ, giraffe, gym).
  - These are patterns, not strict rules — exceptions exist.
  - Teach silent letters as word patterns.
  - Align the -ing lesson with the present-progressive grammar focus.

  ## Unit 4 — Our World (A2)

  ### Part 7: R-Controlled Vowels (Bossy R)

  Focus: How does the letter R affect vowels?

  Sounds: er, ir, ur → "er" sound; or → /or/; ar → /ar/; other patterns air, ear, ire, ure, our.

  Teaching notes:

  - "Bossy R" changes the vowel sound.
  - er, ir, ur often sound the same — teach together.
  - "our" has two pronunciations (our, sour, hour vs four, pour, your) — have learners notice and add words to a running list.

  ### Part 8: Pronunciation of Past-Tense Verbs

  Focus: How do consonants change the pronunciation of -ed past-tense verbs?

  Sounds: /t/ → walked, helped; /d/ → played, lived; /ɪd/ → wanted, needed.

  Teaching notes:

  - Pronunciation depends on the final sound of the verb, not the spelling.
  - If the verb ends in a voiceless sound (/p/, /k/, /f/), use /t/ (helped).
  - If it ends in a voiced sound (/b/, /g/, vowels), use /d/ (played).
  - If it ends in /t/ or /d/, use /ɪd/ (wanted).

  ## Unit 5 — Our Impact (A2+)

  ### Part 9: Other Vowel Patterns

  Focus: How do vowel teams affect pronunciation?

  Sounds: oo — long (moon) vs short (book); ow, ou (cow, out); oi, oy (coin, boy); aw, au (law, August).

  Teaching notes:

  - These are patterns, not strict rules — exceptions exist.
  - Teach through examples and grouping.
  - Encourage learners to notice patterns across words.
  - Reinforce through reading and listening practice.

  ### Part 10: "GH" Patterns

  Focus: How does "gh" affect pronunciation?

  Sounds: gh → /g/ (ghost, aghast); igh → /aɪ/ (light, night); -aught / -ought → /ɔːt/ (caught, bought); -augh → /æf/ (laugh).

  Teaching notes:

  - Words that begin with "gh" are usually associated with "scary" words.
  - Teach as word families (e.g. light, night, fight).
  - "laugh" (laughs, laughed, laughing) is the only word that makes the /æf/ sound.
agencyContribution:
  indicators: [control-of-future-pathways]
  how: >-
    A clear, research-informed order for teaching English sounds lets educators build learners'
    decoding step by step, so reading and writing — the gateway skills for further study — develop
    reliably rather than by chance.
principlesForegrounded: [lifeworthy-competencies, feedback-and-data]
principleAlignment:
- principle: lifeworthy-competencies
  how: >-
    The progression builds the foundational literacy skills — decoding and spelling — that learners
    reuse across every subject and beyond the classroom.
- principle: feedback-and-data
  how: >-
    Sequencing sounds from most useful to most complex, and aligning each with its unit, lets
    educators pace phonics to what learners are actually reading and saying, adjusting as they go.
