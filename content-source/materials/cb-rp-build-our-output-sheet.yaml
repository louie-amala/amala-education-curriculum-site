title: "Building our output — our main message and our evidence"
summary: >-
  The learner's building page: the one thing we most want people to understand, the few claims our output
  makes, where the evidence for each one sits, what our evidence does not tell us, and the questions we
  practise answering.
facilitationContext:
- group
- independent
primaryContext: independent
learnerContent: |
  ## Building our output

  Use this page as you build and rehearse. Fill it in with your team, in words or drawings.

  The sheet has room for:

  - The one thing we most want people to understand.
  - The few things our output says — our claims.
  - For each claim, where the evidence for it is in our evidence log.
  - What our evidence does NOT tell us — the limits we will show honestly (for example, "we only spoke
    to a few people").
  - The questions our audience might ask, and how we would answer them.
  - Who does what when we present — a safe part for everyone, and no names of the people we spoke to.

  Keep this page in your research book. It is part of how your teacher sees you grow as a researcher.
