primaryContext: independent
learnerContent: |
  ## What I found when I asked and looked

  These are the pages where your evidence lives.

  There is **one page for each person you ask** — three of them, because we each ask three people. On
  each page, write or draw what the person said **next to the sub-question it answers**, so we can see
  later what we learned about each part of our question. Each page has room for:

  - What kind of person it was, and when you asked (do NOT write anyone's name).
  - What they said about each of our four sub-questions.
  - One thing that surprised you, or that you want to check.

  Then there is a page for **what you saw with your own eyes** — a bare place and a green place, what
  was different, and what that tells us about our question.

  Remember: ask permission first, every time. If someone does not want to answer, that is fine — thank
  them and go on. Keep these pages in your research book so all our evidence stays in one place.
