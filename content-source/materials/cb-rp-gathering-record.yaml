title: "What I found when I asked and looked"
summary: >-
  The learner's gathering-record pages: one page per person interviewed, with the answers recorded
  against the sub-question each one answers, plus a page for what the learner saw with their own eyes —
  all in marks, drawings, and a few words, and without naming anyone.
facilitationContext:
- independent
