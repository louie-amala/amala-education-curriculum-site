id: ail-strengths-and-areas-to-grow
slug: ail-strengths-and-areas-to-grow
access: public
type: activity
title: Your strengths and areas to grow
summary: Learners name their strengths as learners and the areas they want to develop, using honest
  self-reflection and what peers notice in them, so they know where to aim their goals.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners map their own strengths and areas to grow, then hear what peers notice in
    them. The peer step matters, because learners routinely name strengths for each other that a
    person would never claim alone, so keep the peer round even if you shorten the modelling.
- context: one-to-one-mentoring
  how: >-
    A strong fit. A mentor plays the role the peer group would, reflecting back strengths the learner
    is discounting and helping them name an area to grow without shame. The mentor should resist
    handing the learner a ready-made verdict on themselves and let the learner do the naming.
- context: independent
  how: >-
    Workable but weaker, because the learner loses the peer input that surfaces strengths they cannot
    see. Give them the prompts, and ask them to check their list with at least one person who knows
    them as a learner before they treat it as settled.
duration: 35-45 min facilitated, plus the journal task
grouping: Individual reflection, then pairs or small groups; works with 10-35 learners
whatLearnersDo:
- Look at what a strength as a learner is, and why an area to grow is not a weakness to hide.
- Map your own strengths and the areas you most want to develop, in your journal.
- Hear what peers notice as your strengths, and add any you had not claimed.
- Pick one or two strengths to build on and one area to aim a future goal at.
materialsAndPreparation:
- The learner's journal or a simple two-column sheet (strengths, areas to grow), printed or digital.
- Your own honest example of one strength and one area you are working on, to model before learners start.
- "Sensitivity: naming an area to grow can feel exposing. Make clear that everyone, including you, has areas to develop, that naming one is a sign of a strong learner rather than a weak one, and that no one has to share anything they would rather keep private."
facilitationNotes: |
  This is where self-directed learning starts: a learner cannot aim a goal well until they know their
  own strengths and where they want to grow. The one thing to get right is the tone around areas to
  grow. If naming a weakness feels like admitting failure, learners will hide the real ones and pick
  safe, vague ones. Treat an area to grow as ordinary and useful, model it with your own, and keep the
  room honest rather than reassuring. Let learners keep private what they choose; the value is in the
  honesty, not the sharing.
steps:
- title: Frame strengths and areas to grow honestly
  duration: 6-8 min
  guidance: |
    Open by naming what a strength as a learner looks like (asking questions, sticking with hard
    tasks, learning from others) rather than only marks. Then name one honest area of your own that
    you are working on, so an area to grow reads as ordinary, not shameful. Keep it short: the point
    is to set a tone learners can be honest inside before they write anything down.
  keyPrompts:
  - What does being good at learning actually look like, beyond getting things right?
  - Why is naming something you want to get better at a sign of a strong learner, not a weak one?
  - What is one area you are working on, so learners see you name your own?
  watchOuts:
  - Learners hear "area to grow" as "weakness to confess" and pick something safe and vague; model a real one of your own and make clear everyone has them, so the honest ones come out.
  adaptation: |
    With no board or slides, this needs nothing but you speaking two honest examples aloud, one
    strength and one area you are working on.
- title: Map your own strengths and areas to grow
  duration: 12-15 min
  guidance: |
    Give learners quiet time to list their strengths as learners and the areas they most want to
    develop, in their journal. Circulate and ask rather than tell: when has learning felt easy, and
    when has it felt hard, and why? Steer them towards specific, honest entries rather than modest
    blanks or a long tidy list. A few real ones on each side is plenty.
  keyPrompts:
  - When has learning felt easy or gone well for you, and what does that tell you about your strengths?
  - What do you find hardest as a learner, and which of those would you actually want to change?
  - Which of these matter most to you right now?
  watchOuts:
  - A learner leaves the strengths column empty out of modesty; prompt them with a specific time you or a peer saw them do something well, since most learners undercount their strengths.
  adaptation: |
    If the journal is not to hand, learners use a folded sheet with two columns and copy it in later.
    No device is needed.
- title: Gather what peers notice in you
  duration: 10-12 min
  guidance: |
    Put learners in pairs or small groups. Each learner hears, from the others, one or two strengths
    the group has seen in them as a learner. This is the engine of the activity: people name strengths
    for each other that no one claims for themselves. Learners add any new strength to their own list.
    Keep it to strengths here, not areas to grow, so no one feels judged by peers.
  keyPrompts:
  - What is one strength you have seen in this person as a learner?
  - Which of the strengths your group named surprised you, or had you not claimed for yourself?
  - Does hearing this change how you see one of your areas to grow?
  watchOuts:
  - The group drifts into naming each other's weaknesses; hold the round to strengths only, since unsolicited criticism from peers is exactly what makes areas to grow feel unsafe to name.
- title: Pick where to build and where to grow
  duration: 6-8 min
  guidance: |
    Close the loop individually. Ask each learner to mark, in their journal, one or two strengths they
    want to build on and one area they want a future goal to aim at. This turns a list into a starting
    point for goal-setting and gives you a quick read on who has found a direction and who is still
    unsure. Remind them the list is not fixed and will be revisited.
  keyPrompts:
  - Which one or two strengths do you most want to build on?
  - Which area would you most like your next learning goal to work on?
  - What is the first thing knowing this makes you want to try?
  watchOuts:
  - A learner picks an area to please you rather than one they care about; reassure them there is no right answer and that a goal only works if the area genuinely matters to them.
closing: |
  Ask two or three learners to share one strength they will build on, and, if they are willing, one
  area they want to grow. Draw out that everyone in the room has both. Remind learners this list lives
  in the journal and is the reference point they will hold their first learning goal up against: you
  cannot aim a goal well until you know where you are starting from.
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  how: >-
    Knowing your own strengths and the areas you want to grow, in your own words, is what lets a
    learner decide where to aim rather than waiting to be told what to fix. That honest self-picture
    is the ground every self-directed goal is set from, and it keeps the direction of a learner's
    growth in their own hands.
principlesForegrounded:
- recognise-communicate-growth
- builds-on-identities
- feedback-and-data
principleAlignment:
- principle: recognise-communicate-growth
  how: >-
    Learners name and record their own strengths and areas to grow, and say them aloud to peers, which
    is the first act of the recognising and communicating growth this whole component sets out to
    build.
- principle: builds-on-identities
  how: >-
    The work starts from each learner's own experience of when learning has felt easy or hard, in
    their own terms, and the facilitator is warned off handing them a ready-made verdict, so the
    self-picture is anchored in the learner rather than an external benchmark.
- principle: feedback-and-data
  how: >-
    Learners treat what peers notice in them as data about strengths they cannot see alone, and add it
    to their own self-assessment, so an honest picture is built from evidence rather than a private
    feeling.
competencyCodes:
- FSL1
- FUS1
competencyDevelopment:
- code: FSL1
  how: >-
    Looking honestly at their own strengths and areas for development as learners, and grounding that
    in when learning has gone well or badly, is direct practice in self-reflection; the journal list
    is the evidence.
- code: FUS1
  how: >-
    Weighing their own self-picture against what peers notice in them, and noticing strengths they had
    discounted, develops the self-awareness of seeing themselves more accurately than from inside
    alone.
