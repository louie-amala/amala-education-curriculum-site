slug: efi-unit1-grammar-exercises
access: public
type: resource
title: "Unit 1 (My Voice): Grammar Exercises"
summary: >-
  A set of eight practice exercises for Unit 1 — the verb "to be", subject pronouns, and simple
  sentences — moving from controlled practice (sentence building, choosing the correct form) to
  freer, personal use (guided writing, speaking, and reflection).
facilitationContext: [group, independent]
primaryContext: independent
materialsAndPreparation:
- One printed copy per learner (the exercises are fill-in and pair-work worksheets), or project them for shared practice.
- Sentence-frame and vocabulary support from Unit 1 (see the Grammar Progression) so learners can complete the freer tasks.
facilitationNotes: |
  These eight exercises give focused practice in the Unit 1 grammar: the verb "to be", subject
  pronouns, and building simple sentences. They are sequenced from controlled to freer use — start
  with sentence building and form choice, then move to word order, guided writing, speaking, and
  reflection. Exercises 6 (Ask and Answer) and 7 (Find Someone Who…) are spoken, interactive tasks;
  use them to get learners using the language with each other, not just on paper.

  Keep feedback strength-based and focused on 1–3 targets (here: the correct form of "to be", correct
  pronouns, and complete sentences). Errors are expected — model the correct form and move on. The
  source notes these worksheets should be supplemented with additional practice for learners to
  acquire the grammar securely.
learnerContent: |
  **Focus:** *to be*, subject pronouns, simple sentences.

  ### Exercise 1: Who Am I? (Sentence Building)
  *Complete the sentences with your own information.*
  1. My name is ______.
  2. I am ______ years old.
  3. I am from ______.
  4. I am a ______.
  5. I am in ______ (school/class).
  6. My favorite color is ______.
  7. My favorite food is ______.
  8. I am ______ (happy, excited, tired, etc.).
  9. I am good at ______.
  10. I like ______.

  ### Exercise 2: Choose the Correct Form of "to be"
  *Circle the correct answer (am / is / are).*
  1. I (am / is / are) a student.
  2. She (am / is / are) my friend.
  3. They (am / is / are) from Kenya.
  4. We (am / is / are) in class.
  5. He (am / is / are) 15 years old.
  6. You (am / is / are) my classmate.
  7. It (am / is / are) a book.
  8. I (am / is / are) happy today.
  9. We (am / is / are) friends.
  10. She (am / is / are) from Indonesia.

  ### Exercise 3: Match the Pronoun
  *Write the correct pronoun (he, she, they, we, you, I).*
  1. Maria → ______
  2. Ahmed → ______
  3. Ahmed and I → ______
  4. My teacher → ______
  5. My friends → ______
  6. You and Ali → ______
  7. My sister → ______
  8. My parents → ______
  9. The students → ______
  10. Me → ______

  ### Exercise 4: Build the Sentence
  *Put the words in the correct order.*
  1. am / I / student / a → *I am a student.* (example)
  2. from / I / Indonesia / am → ______
  3. is / she / my / friend → ______
  4. are / we / classmates → ______
  5. is / he / teacher / a → ______
  6. am / I / 14 / years / old → ______
  7. are / they / friends → ______
  8. is / this / my / book → ______
  9. are / you / ready → ______
  10. am / I / happy / today → ______

  ### Exercise 5: My Identity (Guided Writing)
  *Write one complete sentence for each prompt. E.g. Write your name. → My name is Nina.*
  1. Write your name. ______
  2. Write your age. ______
  3. Write your country. ______
  4. Write your school and class. ______
  5. Write your favorite activity. ______
  6. Write something you like. ______
  7. Write something you are good at. ______
  8. Write how you feel today. ______
  9. Write something about your family. ______
  10. Write one more sentence about yourself. ______

  ### Exercise 6: Ask and Answer (Speaking Practice)
  *Work with a partner. Ask and answer the questions. Try to answer in complete sentences.
  E.g. Are you happy today? → Yes, I am happy today. Are you?*
  1. What is your name?
  2. How old are you?
  3. Where are you from?
  4. Are you a student?
  5. What is your favorite food?
  6. What is your favorite color?
  7. How do you feel today?
  8. What do you like?
  9. What do you **not** like?
  10. Are you ready to learn English?

  ### Exercise 7: Find Someone Who… (Class Activity)
  *Walk around the class. Ask your classmates questions. Write a name for each.
  E.g. is vegetarian → Nina.* **Find someone who:**
  1. is from another country → ______
  2. is over 20 years old → ______
  3. is a vegetarian → ______
  4. likes rock music → ______
  5. does not like rock music → ______
  6. likes sports → ______
  7. plays a sport → ______
  8. is your friend → ______
  9. plays an instrument → ______
  10. is ready to learn → ______

  ### Exercise 8: My Voice Reflection
  *Complete the sentences using your own words.*
  1. I can say: "I am ______."
  2. I can say: "My name is ______."
  3. I can say: "I am from ______."
  4. I feel ______ when I speak English.
  5. English is ______ for me.
  6. I like ______ in English class.
  7. I am good at ______.
  8. I want to learn ______.
  9. I feel ______ about learning English.
  10. One thing about me is ______.
educatorContent: |
  Use these as the controlled- and freer-practice layer for the Unit 1 grammar focus ("to be",
  subject pronouns, simple sentences), alongside the communicative activities and the Author's/​
  identity project. A suggested order: Exercises 1–4 (controlled practice on paper), then 5 (guided
  personal writing), then 6–7 (spoken interaction), closing with 8 (reflection and "I can…"
  statements that feed learners' growth tracking).

  Answer guidance for the controlled items: Ex 2 — 1 am, 2 is, 3 are, 4 are, 5 is, 6 are, 7 is, 8 am,
  9 are, 10 is. Ex 3 — 1 she, 2 he, 3 we, 4 he/she, 5 they, 6 you, 7 she, 8 they, 9 they, 10 I. Ex 4
  answers are complete "to be" sentences in SVO order (e.g. 2 *I am from Indonesia.*). Exercises 5–8
  are open and personal — assess for clear communication and correct use of the target structures,
  not perfection.
agencyContribution:
  indicators: [control-of-future-pathways]
  how: >-
    Secure control of the most basic English sentence patterns is what lets a learner say who they
    are and take part at all. Practising these until they are automatic gives learners the footing to
    keep building English independently toward the study and work they are aiming for.
principlesForegrounded: [lifeworthy-competencies, builds-on-identities]
principleAlignment:
- principle: lifeworthy-competencies
  how: >-
    The exercises build foundational sentence-level English — a skill learners reuse in every later
    unit and beyond the course.
- principle: builds-on-identities
  how: >-
    The freer tasks (guided writing, speaking, reflection) are all about the learner's own identity,
    so practice of "to be" and pronouns is done through saying who they actually are.
competencyCodes: [FLC3]
competencyDevelopment:
- code: FLC3
  how: >-
    Practising the sentence patterns for introducing oneself supports learners in communicating basic
    personal information clearly — the first step of being understood in English.
