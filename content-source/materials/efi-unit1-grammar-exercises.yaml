# English for Impact resource — Part 3 §11a "Grammar Exercises" (Unit 1: My Voice).
# Source: The Language Learning Lab "English for Impact" Course Guide (pp. 54–61).
# Note: Unit 1 is the only unit whose grammar exercises are built in the source; §11a for Units 2–5
# is marked "in development" (see the course's sourceIssues).
