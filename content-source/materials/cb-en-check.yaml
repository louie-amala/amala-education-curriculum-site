downloads:
- label: The assessment - BASELINE paper
  file: /downloads/cb-en-check-baseline.docx
  format: Word
  role: worksheet
  note: >-
    The paper itself, sat in the first session before any teaching. Parts 1 and 2 are done by the whole
    class on paper; Part 3, the speaking prompts, is optional. Print one per learner and write each
    learner's own name into it beforehand - three tasks depend on it. Contains no answers. Editable.
- label: The assessment - ENDLINE paper
  file: /downloads/cb-en-check-endline.docx
  format: Word
  role: worksheet
  note: >-
    The paper sat in the final week. The same tasks in the same order as the baseline with different
    content, so nobody sits the same questions twice. Five tasks are deliberately identical in both.
    Print one per learner. Contains no answers. Editable.
- label: Marking pack - the answers for both papers
  file: /downloads/cb-en-check-marking-pack.docx
  format: Word
  role: template
  note: >-
    Answer keys and the tick-box schemes for the baseline and the endline. For the facilitator only -
    never print it into a learner's paper, and never leave it where learners can read it, because they
    sit the same tasks again at the end of the course. Editable.
- label: The complete guide - coordinator and facilitator
  file: /downloads/cb-en-check-guide.docx
  format: Word
  role: explainer
  note: >-
    Part A is the coordinator's: what to print, the record spreadsheet, how to read the results, and
    what to put in a report. Part B is the facilitator's: running it, marking it, and what to do with
    what it shows. Written for someone who does not know the CEFR. Editable.
- label: Class record spreadsheet
  file: /downloads/cb-en-check-record-sheet.csv
  format: Spreadsheet
  role: template
  note: >-
    Open in Excel or Google Sheets. The coordinator enters the raw scores only; the CEFR level and the
    change between the two sittings calculate themselves. Reading, writing and speaking have their own
    columns and are never averaged.
- label: Learner profile - what I can do in English
  file: /downloads/cb-en-check-learner-profile.docx
  format: Word
  role: worksheet
  note: >-
    One per learner, given to them at the end and read through together. "I can" statements in plain
    language, and four lines for the learner to name their own growth. Never show a learner a CEFR
    level. Editable.
