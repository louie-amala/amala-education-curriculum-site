# The English Check - the baseline/endline proficiency instrument for the English Language Development
# component of Learning Bridge+ (Cox's Bazar). Sits BESIDE the component's formative assessment, which
# is unchanged: this answers the one question the growing My Voice book cannot, which is whether English
# measurably improved. Reading, writing and speaking are reported SEPARATELY on a 1-10 step ladder that
# runs Pre-A1.1 to B1 - the CEFR sub-banded, with a below-A1 floor borrowed in shape from the Council of
# Europe's LASLLIAM guide, because the CEFR assumes literacy even at A1 and most of this cohort does not
# have it. Two parallel forms (A baseline, B endline) built from one blueprint. Fully offline.
# Planning docs: docs/ENGLISH-ASSESSMENT-PLAN.md, -BLUEPRINT.md, -FORM-A.md, -FORM-B.md,
# -ADMIN-GUIDE.md, -SHEETS.md.
id: cb-en-check
slug: cb-en-check
access: partner
edition: learning-bridge-coxs-bazar
type: resource
title: "The English Check - measuring progress at the start and the end"
summary: >-
  The assessment itself, in two papers: a baseline sat in the first session before any teaching, and an
  endline sat in the final week. Same tasks, different content. One paper for the whole class, three
  parts - Reading, Writing, Speaking - marked by counting, and turned into a CEFR level by the class
  spreadsheet. Fully offline.
facilitationContext:
- group
- independent
primaryContext: group
materialsAndPreparation:
- One Form A booklet per learner for the baseline, one Form B booklet per learner for the endline, printed and photocopy-checked (the pictures go grey easily - redraw by hand if they do).
- One marking sheet per learner, one class record sheet, and one laminated conversion card per marker.
- Each learner's own name written onto their sheet beforehand, where the booklet says [learner's name] - this cannot be skipped.
- A quiet corner for the six-minute talk, and appointment times given out in advance so nobody waits.
- "Sensitivity: being tested is itself a stressor for a beginner. Say aloud, in the language you share, that this is not an exam and nobody fails, and let any learner stop at any point."
- "Sensitivity: no prompt anywhere in the check asks where a learner is from, and every writing and speaking task offers a lighter everyday option - a food, a colour, a thing you like - which counts as a full answer."
facilitationNotes: |
  Two sittings, one before you teach anything and one in the final week. That timing is the whole
  instrument: assess a learner in the fifth session and their "before" number is already wrong. Everything
  else about the design bends to make those two sittings runnable by one facilitator with a full class.

  Most of your learners will start between step 1 and step 4, which is below A1. That is expected and it
  is why the ladder has a floor: a learner who is learning to read at all sits underneath the CEFR rather
  than at the bottom of it, and reporting them as "A1, not achieved" would show no movement across the
  whole course. Moving from step 2 to step 4 is real progress and this check is built to see it.

  Keep the three results apart. A learner is routinely several steps higher in speaking than in writing,
  and that gap is the most useful thing the sheet will tell you. Never average them into one level.
educatorContent: |
  ## Where the assessment is

  The two papers are the first two downloads on this page: **the baseline**, sat in the first session
  before any teaching, and **the endline**, sat in the final week. They are the same tasks in the same
  order with different content, so nobody sits the same questions twice. Everything else here explains
  how to run and mark them.

  ## What it is

  One paper, sat by the whole class on paper, in three parts:

  | | | Marks | Time |
  |---|---|---|---|
  | **Part 1 - Reading** | 12 tasks, from letters to a short article | 45 | 28 min |
  | **Part 2 - Writing** | 6 tasks, from your own name to a letter | 30 | 22 min |
  | **Part 3 - Speaking** | five prompts, one to one - **optional** | 16 | 6 min |

  There is no routing and there are no separate booklets. Tasks run easiest first, and a learner who
  cannot do a task leaves it and moves on. **Most learners will not finish every part, and that is
  expected** - a blank is information, not failure.

  ## The levels

  Four: **Pre-A1 · A1 · A2 · B1**. Each part gets its own level, and they are never combined - a
  learner is routinely a level higher in speaking than in writing, and that difference is the useful
  part.

  | | Pre-A1 | A1 | A2 | B1 |
  |---|---|---|---|---|
  | Reading /45 | 0-16 | 17-27 | 28-38 | 39-45 |
  | Writing /30 | 0-6 | 7-13 | 14-22 | 23-30 |
  | Speaking /16 | 0-3 | 4-8 | 9-13 | 14-16 |

  The ladder starts below A1 because the CEFR assumes literacy even at A1, and a cohort that is largely
  not yet reading in any language sits underneath the framework rather than at the bottom of it. It
  stops at B1 because that is the level the Global Secondary Diploma requires.

  **The raw score is what shows progress, not the level.** Fifty hours moves a beginner a long way
  inside a level and rarely across one: a learner going from 12 to 24 on Reading has gained a great
  deal and is "A1" at both ends. The class spreadsheet holds both numbers for exactly that reason, and
  a rise of four or more marks on a part counts as a real move.

  ## Timing, which is the one thing that cannot flex

  The baseline is sat in the **first session, before any teaching**. A learner who sits it in the fifth
  session has already had five sessions of English and their "before" number is wrong. The endline is
  sat in the **final week**.

  ## The speaking part is optional

  Take whichever of these is possible - all three are fine:

  - the whole class, one at a time, before the programme starts;
  - some learners, however many fit, chosen at random beforehand and spoken with again at the end;
  - nobody, in which case say so in the report.

  If it can be run, it is worth running. This component leads with the ear and the voice and treats
  writing as something that grows out of speaking, so speaking is very probably where learners gain
  most - and a paper-only result will understate the course.

  ## Marking

  Counting, not judging. Every writing task is a list of tick boxes: read what the learner wrote, tick
  what is there, count the ticks. Two facilitators marking the same page should reach the same number.

  - Spelling is not marked unless a tick box says so. If you can read it, it counts.
  - What a learner chooses to write is never wrong. "I like rice" is as full an answer as "I am Nur".
  - Mark the whole class one task at a time, not one learner at a time.
  - If you are unsure between two ticks, do not tick.

  The facilitator records three raw totals and nothing else. The class spreadsheet turns them into
  levels by formula, so nobody looks up a table and nobody mistypes a level.

  ## Context and its limits

  Part 1 tests only what this component teaches - the taught sounds, the learner's own name, and the
  three frames. The plosive pairs come last in the phonics sequence, so no decoding task uses b, d, g
  or p. Content is drawn from block and shelter life, water, the health post, the learning centre, the
  weather, small work and family. Repatriation, violence, fire, loss of family, boat journeys and camp
  politics are excluded without exception, "I am from ___" is never a required answer, and every
  writing and speaking prompt offers a lighter everyday choice that counts as a full answer.

learnerContent: |
  ## What I can do in English

  Tick together with your facilitator. It is fine if some are not ticked. You will keep growing.

  **Listening and sounds**

  - I can hear the first sound in a word.
  - I can hear the difference between two sounds.

  **Reading**

  - I know some letters.
  - I can find my own name.
  - I can read the words I, am, from, like.
  - I can sound out short words.
  - I can read a short sentence about someone.
  - I can find what I need on a notice or a timetable.

  **Writing**

  - I can write my own name.
  - I can copy a sentence.
  - I can fill in a form with my name and my age.
  - I can write true sentences about myself.
  - I can write a short note to somebody.

  **Speaking**

  - I can say my name in English.
  - I can say who I live with.
  - I can say what I like.
  - I can talk about a picture.
  - I can answer questions about my day.
  - I can talk about what I want to do next.

  ## My growth

  - At the start I could ______________________.
  - Now I can also ______________________.
  - One thing I want to get better at is ______________________.
  - I feel ______________________ about learning English.

  Never show a learner a step number or a CEFR level. Fill the first two lines from their own two
  sheets, in their words: "At the start you could write your name. Now you can also write five
  sentences."
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  - control-of-future-pathways
  how: >-
    Naming what you can now do that you could not do before is how growth becomes visible to the person
    who did it. The learner profile is written as "I can" statements in the learner's own words, never as
    a level, so the check gives a learner evidence of their own progress rather than a verdict on them.
    And because the ladder tops at B1 - the level the Global Secondary Diploma requires - it tells a
    learner honestly how far they have come toward a pathway they may want to take.
principleAlignment:
- principle: recognise-communicate-growth
  how: >-
    The whole instrument exists to make growth visible and sayable: two sittings, three separate strands,
    a step number that moves, and a learner-facing "I can now" page that names the movement in the
    learner's own words.
competencyCodes:
- FLC3
- FUS1
competencyDevelopment:
- code: FLC3
  how: >-
    The check measures communication in English directly - reading, writing and speaking assessed and
    reported separately, against what a learner can observably do.
- code: FUS1
  how: >-
    Marking a learner's own "I can" profile at the start and revisiting it at the end is self-aware
    reflection on one's own learning, and it is the anchor the component already uses for recognising
    growth.
