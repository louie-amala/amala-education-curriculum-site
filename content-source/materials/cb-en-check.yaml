provenanceNote: >-
  Authored for the Learning Bridge+ (Cox's Bazar) edition at the user's request, as a baseline/endline
  measure of English proficiency for a component whose other assessment is entirely formative. The design
  is grounded in the CEFR self-assessment grid for Reading and Writing and in LASLLIAM for the span below
  A1; the below-A1 steps, the half-levels and the 1-10 step numbering are Amala's and are marked as such.
  Part 0 draws its sounds, words and frames from cb-mv-phonics-progression and cb-mv-i-am-sentences, so
  it tests only what this component teaches. Not yet trialled - the pilot (10-15 learners, two markers on
  the same eight scripts) is outstanding, and item content may change as a result.
