sourceRefs:
  - "AMALA Global Secondary Diploma (GSD) Educator Guide / Handbook. Student Mentor Playbook"
provenanceNote: >-
  Generalised from the Playbook's pathways section: supporting students to identify and apply for
  opportunities, producing references, and tailoring the programme (e.g. project choice) towards a
  pathway. The nursing / healthcare-access example is drawn from the source.
