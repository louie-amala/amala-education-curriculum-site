learnerContent: |
  ## Are we ready to go?

  Fill this page in with your gathering partner, before you go out. It is one page for the two of you.

  It has room to:

  - Tick what you are carrying: our questions, our follow-ups, our survey page and our marks, our asking
    words, our gathering page, something to write or draw with.
  - Write or draw your **one most important question** — the one you will ask if the person only has a
    moment.
  - Say who you will ask, where, and when.
  - Say **who you will ask instead**, if that person is not there.
  - Tick the things we never do: no names, no pressing, no arguing, never alone, never anywhere unsafe.

  Keep it in your research book and look at it just before you knock.
