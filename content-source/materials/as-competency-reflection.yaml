id: as-competency-reflection
slug: as-competency-reflection
access: public
type: educator-move
title: "Use competency reflections"
summary: >-
  Ask learners to explain how their evidence meets a competency. It makes the link explicit, builds
  metacognition, and gives you evidence in their own words.
tags:
  - id: assessment-tools
educatorContent: |
  A competency reflection asks the learner to do the connecting: to explain how a specific piece of
  work or experience demonstrates a particular competency or success indicator. The value is in the
  explicit link - the learner names which evidence shows what, and why - rather than leaving you to
  infer it.

  Learners can do this in whatever medium suits them: a short written explanation with links to
  evidence, or a video talking through it. Done regularly, reflections become quicker and build genuine
  metacognition - learners get better at seeing the abstract competency in their concrete work, and at
  talking about their skills to other people, including pathway providers. Support them to make the
  links well (this is where the mentor's "turn reflection into evidence" work pays off), then use the
  reflection, alongside your own evidence, when you judge the competency.
steps:
  - title: "Learner picks the competency and the evidence"
    guidance: >-
      The learner chooses which competency or success indicator to claim, and the specific piece of
      work or experience they'll use as evidence.
  - title: "Make the explicit link"
    guidance: >-
      They explain how that evidence shows they meet the competency - which part demonstrates what, and
      why. The explicit connection is the whole point.
  - title: "Choose the medium"
    guidance: >-
      Written, or a short spoken or video walk-through - whatever lets the learner make the link
      clearly. Done regularly, it gets quicker and builds real metacognition.
  - title: "Assessor uses it to verify"
    guidance: >-
      Weigh the reflection alongside your own evidence when you judge the competency, and use it to open
      a dialogue where the link doesn't yet hold.
downloads:
  - label: "Competency reflection"
    file: /downloads/as-competency-reflection.docx
    format: Word
    role: template
    note: >-
      A template for the learner to link evidence to a competency in their own words - competency,
      the evidence, how it shows they meet it - with a worked example and blank rows.
agencyContribution:
  indicators:
    - power-over-wellbeing-and-self-direction
    - control-of-future-pathways
  how: >-
    Explaining how their own evidence meets a competency helps learners recognise, own and articulate
    their proficiency - a skill they carry into every future application and interview.
principleAlignment:
  - principle: recognise-communicate-growth
    how: >-
      A competency reflection is the learner recognising and communicating their own growth, in their
      own words.
  - principle: feedback-and-data
    how: >-
      Reflections give the assessor evidence in the learner's own account, and a basis for a dialogue
      about whether the link holds.
