rights:
  status: amala-own
  basis: >-
    Written by Amala in August 2026. The activity structure they serve comes from the YPAR Hub by way of
    San Francisco Peer Resources; the four scenarios, the notes on each and the guidance for writing more
    are original.
  note: >-
    The scenarios are invented. Never edit them to present the people or organisations in them as real,
    and keep the boundaries on scenario 3.
sourceRefs:
  - "Written to replace the situation sheets in the YPAR Hub (UC Berkeley) Institutional Change lesson plan"
provenanceNote: >-
  Authored by Amala in August 2026. The source lesson plan ships three situation sheets and two skits set
  in United States high schools, turning on school discipline, policing and liquor laws; none of it
  travels to Amala's settings, and none is reproduced. These four are written from scratch around the
  frictions Amala's learners actually meet, and each is deliberately built so the person in it did
  something, which is what stops a group reaching the structural reading by declaring everyone blameless.
