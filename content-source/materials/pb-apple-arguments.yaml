  holder: University of Oregon (the compiled activity collection)
  basis: >-
    The activity is credited and linked. The source's fifteen written position cards are not
    reproduced here: this page describes the three kinds of position and leaves facilitators to take
    the set from the linked collection or write their own for their context.
  note: >-
    Do not paste the fifteen position cards onto this page. Writing local positions is better practice
    anyway, since an apple is not the right object everywhere.
