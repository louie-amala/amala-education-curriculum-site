provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, an adaptation, delivery
  modes and a safeguarding note) from the Design Challenge activity guide, which supplied the purpose, the
  definition of an expert and the breakout discussion and question-ladder tasks. The question ladder
  itself, referred to but never specified in the source, is now a tool material of its own. The source
  Design Challenge investigates the mental health and wellbeing of Afghan females; this material is
  written to generalise to any research challenge, with that as the worked example. Linked to Research
  Project objective 2.
