provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, adaptations, delivery
  modes, a sensitivity note and a source-evaluation step) from the Design Challenge activity guide,
  which supplied the purpose, the divided-reading method and the breakout discussion. The source
  Design Challenge investigates the mental health and wellbeing of Afghan females and provided
  Afghan-specific sources; this material is generalised to any context, with a localisation note that
  partners supply locally relevant sources. Linked to Research Project objective 2 and Social
  Entrepreneurship objective 1.
