  url: https://www.youtube.com/watch?v=CwdgpdwVcRY
  note: >-
    External video (YouTube), in English. [to verify] Conventions vary by destination; check it fits where your learners are applying.
facilitationNotes: |
  This video is a resource for the linked activity: learners watch it to learn how to write a university personal statement, then
  apply it to their own work. Treat it as an input to their practice, not the lesson itself, and keep
  the focus on what each learner produces. Preview it first, and have a no-video fallback ready.
learnerContent: |
  Watch this video to learn how to write a university personal statement, then use what you learn on your own work for the linked
  activity. You can pause, rewatch, and turn on captions. The video is a starting point: your own
  draft, and the feedback you get on it, are what make it stick.
