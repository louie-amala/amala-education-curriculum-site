title: "Video: Building a portfolio"
summary: "Two short videos, on what a career portfolio is and on building one with a free tool, supporting the Producing a portfolio activity."
facilitationContext:
- group
- independent
links:
- label: "Watch: What is a Career Portfolio?"
  url: https://youtu.be/8nvfLEpnCB4
  note: >-
    External video (YouTube), in English.
- label: "Watch: Google Sites for Student Portfolios (tutorial)"
  url: https://www.youtube.com/watch?v=lPp_pIbFsTU
  note: >-
    External video (YouTube). [to verify] Google Sites needs an account and connectivity; offer a physical portfolio route where that is not possible.
facilitationNotes: |
  This video is a resource for the linked activity: learners watch it to learn how to build and present a portfolio, then
  apply it to their own work. Treat it as an input to their practice, not the lesson itself, and keep
  the focus on what each learner produces. Preview it first, and have a no-video fallback ready.
learnerContent: |
  Watch this video to learn how to build and present a portfolio, then use what you learn on your own work for the linked
  activity. You can pause, rewatch, and turn on captions. The video is a starting point: your own
  draft, and the feedback you get on it, are what make it stick.
agencyContribution:
  indicators:
  - control-of-future-pathways
  how: >-
    A portfolio lets a learner show, not just claim, what they can do; the videos give them the know-how to build one that opens doors.
