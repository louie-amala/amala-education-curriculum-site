rights:
  status: linked-not-reproduced
  holder: Nicky Case (dedicated to the public domain)
  basis: >-
    The interactive is dedicated to the public domain by its author, so there would be no rights
    obstacle to reproducing it. It is not reproduced here because it is a hosted web experience that
    cannot usefully be copied: this page explains what it shows, argues where it fits the course, and
    links to it.
  note: >-
    Requires a device and a connection, so it is unavailable in fully offline contexts. Where devices
    are scarce, project it and drive it as a whole group.
sourceRefs:
  - "Case, N. The Evolution of Trust. https://ncase.me/trust/ (public domain). Built on Axelrod, R. (1984), The Evolution of Cooperation."
