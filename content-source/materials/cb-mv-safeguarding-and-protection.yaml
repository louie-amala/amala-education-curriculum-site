# Facilitator safeguarding & protection resource for the English Language Development (My Voice)
# component of Learning Bridge+ (Cox's Bazar). The last of the three taught components to get one.
#
# My Voice looks like the safest of the three — it is grammar and phonics — and it is the one whose
# SUBJECT MATTER is the learner themselves. Every unit asks who you are, where you are from, what you
# like, who your family is. In a displaced cohort, "where are you from?" is not a warm-up question.
