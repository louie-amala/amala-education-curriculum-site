title: "Safeguarding and protection in My Voice"
summary: >-
  The protection guidance this component needs: why a course about saying who you are is sensitive
  ground in a displaced cohort, the lighter alternative that must exist for every personal prompt, the
  particular exposure of speaking aloud, names and how to handle them, and the step-back routine.
