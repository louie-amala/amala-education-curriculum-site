educatorContent: |
  ## Why a language course needs a protection guide

  This is the component people assume is safe. It is phonics and sentence frames — no fieldwork, no
  interviews, nobody leaves the room.

  But look at what the sentences actually are. *I am ___. I am from ___. I like ___. This is my
  family. This is my home.* The content of this course is the learner. In a cohort that has been
  displaced, "where are you from?" is not a warm-up question — it is a question about a place that may
  be gone, that they may not remember, or that they may have been told not to discuss. And unlike the
  other two components, the answers are said **out loud, to other people**.

  So the exposure here is different in kind from the Research Project's. There it is fieldwork; here it
  is the ordinary content of the lesson, every session, for ten weeks.

  Read this before you begin, know NRC's referral pathway, and follow NRC's Code of Conduct and
  protection principles throughout.

  ## Before you start

  - **Know the referral pathway.** The name of the person you hand a concern to, and how — written
    down and to hand before the first session.
  - **Know your step-back options** and say them aloud in Session 1, so no learner has to invent a
    reason to opt out later.
  - **Agree same-gender grouping and pairing** wherever girls' participation depends on it. In a
    speaking course this matters more than in the other components, because the work IS being heard.
  - **Learn to say every learner's name correctly.** Ask, and practise. See below — this is protection
    work, not just courtesy.

  ## The rule: every personal prompt has a lighter twin

  This is the single most important line in this page.

  Every activity that invites something personal must also offer an everyday alternative, offered
  **without comment and without anyone having to ask for it.** Not "tell me if this is difficult" —
  just two options on the table, both normal.

  | The prompt | The lighter twin, always available |
  |---|---|
  | I am from ___ | Name the place you live now, or the place you like best |
  | This is my family | This is someone I know / my friend / my neighbour |
  | This is my home | This is a place I go / where I like to sit |
  | Something I miss | Something I like |
  | When I was small… | Yesterday… |
  | My favourite food from home | A food I like |

  A learner who takes the lighter option has completed the activity. Say so with your body language as
  much as your words: do not pause, do not look concerned, do not follow up in front of anyone.

  ## Speaking aloud is its own exposure

  In the other two components a learner can hide in a drawing. Here the work is audible.

  - **Never make a learner speak alone in front of the group.** Choral first, then pairs, then a small
    group, then — only if they choose — the whole room.
  - **Nobody is corrected while sharing.** Correction during a share teaches the room that speaking is
    risky. Note it and come back to it another day, generally rather than personally.
  - **Never let a learner's accent, home language, or slow speech be laughed at.** Handle it the first
    time it happens, immediately and calmly, or it sets the tone for ten weeks. Name the rule for the
    group rather than the individual who broke it.
  - **A learner who speaks only to a partner all course has succeeded.** Say that out loud early, so
    the shy learner is not counting down to a performance.
  - **Translanguaging is a strength, not a failure.** A learner reaching into Rohingya, Chittagonian,
    Burmese or Arabic to get an idea across is doing the right thing. Never police it.

  ## Names

  Names carry more weight in this component than anywhere else in the programme — the whole first
  phase is built on the sound and letters of the learner's own name.

  - **Ask each learner how their name is said, and how they want it written.** Then use it that way,
    every time. Getting a learner's name wrong for ten weeks in a course about their name is its own
    small harm.
  - **Some learners have more than one name, or a name they are not called at home.** Let them choose
    which one goes in the book and on the card. Do not ask why.
  - **Some learners will not know how to spell their own name in any script**, or will have seen it
    written differently on different documents. This is common and it is not a deficiency. Take
    whichever they choose, write it clearly, and never treat one version as the correct one.
  - **Never correct a learner's name to a "proper" spelling.**

  ## The "My Name, My Voice" card

  The card is the authentic project, and it invites a learner to put themselves on paper.

  - The learner chooses everything that goes on it. If they choose only their name and a drawing of a
    bird, that is a finished card.
  - Cards are shown at the programme showcase, in front of guests. Confirm before invitations go out
    that each learner is comfortable with theirs being seen, and offer the alternatives — show it to a
    partner, to a mentor, or to the person they invited only.
  - Do not photograph learners' cards, or the learners, without NRC's consent process. This is a
    protection matter, not an admin one.

  ## The step-back routine

  When a prompt opens something it should not:

  1. **Do not follow it.** No second question.
  2. **Acknowledge briefly and normalise.** "Thank you. Lots of people here would say something like
     that."
  3. **Offer the lighter option, as if it were nothing.** "You can do the everyday one instead."
  4. **Move the group on** so the learner is not being looked at.
  5. **Come back privately afterwards**, and follow the referral pathway if you need to.

  Never promise secrecy. If a learner asks you to, say you will not tell anyone who does not need to
  know, and that if they are in danger you have to tell one person whose job it is to help.

  ## If a learner becomes distressed

  Stay calm and stay ordinary — your steadiness is most of the intervention. Give them a way out of the
  room that does not look like being removed. Do not gather the group. Afterwards, follow the referral
  pathway: notice, steady, refer. Tell your coordinator the same day, and follow it up in mentoring.
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  how: >-
    Voice is the precondition for agency, and a learner only finds one in a room where speaking is
    safe. Giving every personal prompt a lighter twin, and never making anyone perform alone, is what
    lets a learner choose how much of themselves to put into the language — which is itself the first
    exercise of the voice this component exists to build.
