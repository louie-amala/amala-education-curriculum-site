  basis: >-
    The simulation is published and remains the authors'. Nothing of it is reproduced here: this page
    describes what it does, sets out the judgement an educator has to make before using it, and links
    to the authors' free download. All wording is Amala's own.
  note: >-
    Do not copy the role material onto this page. The suitability guidance above is Amala's own
    editorial position and should be kept with the link wherever this material is referenced.
