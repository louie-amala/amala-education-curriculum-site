provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, adaptations, delivery
  modes and a sensitivity note) from the Design Challenge activity guide, which supplied the purpose,
  the split-source viewing task and the breakout discussion questions. A source-credibility step was
  added to foreground evaluating sources. The source Design Challenge investigates the mental health
  and wellbeing of Afghan females; this material is written to generalise to any context, with that as
  the worked example. Linked to Research Project objective 1 (framing a real-world challenge).
