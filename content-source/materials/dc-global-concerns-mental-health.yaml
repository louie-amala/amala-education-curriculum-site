id: dc-global-concerns-mental-health
slug: dc-global-concerns-mental-health
access: public
type: activity
title: Global concerns for mental health and wellbeing
summary: Learners use secondary sources to understand current global concerns about mental health and
  wellbeing, practising how to judge whether a source is credible before they trust what it tells them.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners take one source each, make notes, then pool their insights in breakout
    groups. Splitting the sources across the group is the point, since the group covers far more
    ground together than any learner could alone, so keep the shared harvest even if you shorten the
    individual viewing.
- context: one-to-one-mentoring
  how: >-
    A good fit for building the credibility habit. The learner and mentor work through one or two
    sources closely, and the mentor models the questions a careful reader asks about who made a source
    and why, rather than covering many sources thinly.
- context: independent
  how: >-
    Workable but weaker, because the learner loses the range of sources and views the group provides.
    If a learner works alone, ask them to use at least three different sources and to write down, for
    each, one reason to trust it and one reason to be cautious.
duration: 30-40 min facilitated
grouping: Individual viewing, then breakout groups of 3-5; works with 10-35 learners
whatLearnersDo:
- Take one assigned source on global mental health and wellbeing and make notes on what it tells you.
- For your source, note who made it, when, and why, and how far you would trust it.
- Share one key insight with your group and appoint a scribe to capture the discussion.
- "Compare the global concerns with the situation where you live: what is the same, what is different?"
- Agree what this learning means for the mental health and wellbeing challenge you are investigating.
materialsAndPreparation:
- A small set of credible secondary sources on global mental health and wellbeing (for example short
  videos or briefings from health bodies), enough for one per learner in each breakout group.
- A way for each breakout group to record its discussion, and a nominated scribe per group.
- "Sensitivity: mental health and wellbeing may be personal for some learners, who may have their own
  or a family member's experience. Make clear that no one has to share anything personal, that they
  can step back from any part without explaining why, and signpost where they can find support if the
  topic is hard for them today."
facilitationNotes: |
  This activity opens the challenge by grounding it in what credible sources say about mental health
  globally. The one thing to get right is that learners weigh their sources rather than simply
  believing them: keep asking who made a source, when, and why, so credibility becomes a habit they
  carry into all their research. Hold the topic with care. The subject may be personal for some
  learners, so make plain that no one has to disclose anything, that anyone can step back without
  singling themselves out, and know where you would signpost a learner who needs support.
steps:
- title: Take a source and make notes on what it tells you
  duration: 12-18 min
  guidance: |
    Give each learner in a breakout group a different source on global mental health and wellbeing,
    and quiet time to work through it and make notes. The aim is coverage: because each learner takes
    a different source, the group will later hold a much wider picture than any one of them could
    gather alone. Circulate and check learners are noting concerns, not just summarising.
  keyPrompts:
  - What is this source telling you about the concerns for mental health and wellbeing globally?
  - What is the single most striking thing you have learned from your source?
  - "How would you finish this: a key insight about global mental health is, and I think this because?"
  watchOuts:
  - A learner copies the source out rather than drawing an insight from it; ask them what it means and why it matters, not just what it said.
  adaptation: |
    If videos cannot be streamed, use short printed briefings or read a source aloud and have learners
    note the concerns on paper. The step needs sources and note-taking, not a device each.
- title: Ask who made your source, and how far to trust it
  duration: 6-10 min
  guidance: |
    Before learners pool what they found, have them judge their source. Ask who made it, when, and for
    what purpose, and what that means for how far they trust it. This is the credibility move at the
    heart of good secondary research: a source can be interesting and still be out of date, one-sided
    or selling something, and learners need to notice that.
  keyPrompts:
  - Who made this source, when, and why might they have made it?
  - What is one reason to trust this source, and one reason to be cautious about it?
  - If another source disagreed with this one, how would you decide which to believe?
  watchOuts:
  - Learners treat anything on screen as automatically true; give them a short, repeatable check (who, when, why) so credibility becomes a habit rather than a one-off.
- title: Pool insights and compare with your own context
  duration: 8-12 min
  guidance: |
    In breakout groups, each learner shares one insight and the appointed scribe captures the
    discussion. The group then compares the global picture with life where they are: what is the same,
    what is different. This is where the split sources pay off, as learners hear concerns they never
    looked at themselves and start to locate their own context within a global pattern.
  keyPrompts:
  - What is the same, and what is different, about these concerns compared with where you live?
  - Which global concern surprised you, and does it show up in your own context?
  - What does the group now understand that no single one of you knew at the start?
  watchOuts:
  - One learner dominates or the group drifts; use a round where each person shares one insight before anyone responds, and ask the scribe to record at least one point from every member.
- title: Decide what this means for your challenge
  duration: 4-6 min
  guidance: |
    Bring the learning back to the challenge learners are investigating. Ask what these global
    concerns mean for the mental health and wellbeing challenge in their own project, and note it. This
    turns a set of sources into a foothold on the real problem and gives you a read on who has
    connected the global picture to their own work.
  keyPrompts:
  - What does this learning mean for the mental health and wellbeing challenge you are working on?
  - Which global concern feels most relevant to the people your project is about?
  - What is one thing you now want to find out from your own primary research?
  watchOuts:
  - Learners leave the global picture as interesting but disconnected; push each group to name one concrete link between what they learned and the challenge they are investigating.
closing: |
  Ask each group to share one thing that is the same and one that is different between the global
  concerns and their own context. Remind learners that every source they used had a maker and a
  purpose, and that weighing sources this way is a habit they will keep using through the whole
  research project.
agencyContribution:
  indicators:
  - contribution-to-community
  how: >-
    Understanding the real, evidenced concerns around mental health and wellbeing is what lets learners
    contribute usefully to their community rather than acting on assumption. Learning to weigh sources
    means their eventual contribution rests on evidence they have judged trustworthy, not on whatever
    they happened to read first.
principlesForegrounded:
- authentic-challenges
- lifeworthy-competencies
- safe-spaces
principleAlignment:
- principle: authentic-challenges
  how: >-
    Learners investigate a real, current global concern using genuine secondary sources rather than a
    tidied-up brief, so the challenge they go on to address is grounded in what the world actually
    reports about mental health and wellbeing.
- principle: lifeworthy-competencies
  how: >-
    Judging whether a source is credible, by asking who made it, when and why, is a transferable
    competency learners will reuse far beyond this project, every time they meet a claim online or in
    the news.
- principle: safe-spaces
  how: >-
    The activity treats a topic that may be personal with explicit care, making clear that no one has
    to disclose anything, that a learner can step back without explaining, and that support is
    signposted, so learners can engage with a difficult subject safely.
competencyCodes:
- FSI1
- FPS2
competencyDevelopment:
- code: FSI1
  how: >-
    Using secondary sources to build a picture of a real global concern, and connecting it to their own
    context and challenge, is direct practice in investigating real-world issues; each learner's notes
    and the group's comparison are the evidence.
- code: FPS2
  how: >-
    Asking who made each source, when and why, and weighing one reason to trust it against one reason to
    be cautious, is exactly the work of evaluating sources; learners practise it on every source they
    take.
