      - "new saplings"
      - "roots holding soil"
facilitationNotes: >-
  The one thing to get right: this map does double duty, so build it with both jobs in mind. It surfaces
  the contributing factors — what strips the hills and what helps them recover — and it becomes the list
  of who the cohort could safely learn from in the next phase. As people go on the map, flag early and
  clearly which of them it is appropriate and safe for learners to approach, and which are better reached
  another way or not at all. Keep it one big shared drawing, hands-on and oral; the map is the thinking.
steps:
- title: "Put our hills in the middle"
  duration: "20 min"
  guidance: >-
    Start the map with the hills and trees in the middle, drawn together. This is our challenge. Everything
    else the group adds connects back to it. Keep it big enough for everyone to reach and add to.
  keyPrompts:
  - "What is at the centre of our map? Let us draw our hills."
- title: "Who is connected to our hills?"
  duration: "50 min"
  guidance: >-
    In pairs, learners add the people and groups connected to the trees and hills: elders who remember
    the forest, families who live on the slopes, those who cut wood, those who plant and protect, the
    people who help when the mud slides. Draw lines to show how each connects. Talk about each as it goes up.
  keyPrompts:
  - "Who remembers our hills covered in trees? Who lives on the slopes now?"
  - "Who takes from the hills, and who helps them come back?"
- title: "What is connected — and what causes what"
  duration: "30 min"
  guidance: >-
    Now add the things and places: what strips the hills, what helps them recover, where it floods or
    slides, where it is greening again. Draw out which things cause or worsen the problem and which help —
    these are the factors behind our challenge, and they feed straight into our sub-questions.
  keyPrompts:
  - "What makes our hills worse? What helps them get better?"
  - "Where does the water go? Where does the ground slide?"
- title: "Who can we safely learn from?"
  duration: "20 min"
  guidance: >-
    Look at the people on the map together. Mark, with the group, who it would be safe and appropriate for
    us to ask and learn from later — and who is better reached another way. This turns the map into the
    plan for who we talk to, and holds the protection line before any gathering begins.
  keyPrompts:
  - "Who on our map could we safely and kindly ask to learn from?"
  - "Who should we not approach ourselves?"
learnerContent: |
  ## Who and what is connected to our challenge

  Our challenge is not just the trees. It is all the people, groups, and things joined to them. So we
  build one big map together.

  In the middle are our hills and trees. Around them we add: the elders who remember the forest, the
  families who live on the slopes, the people who cut wood and the people who plant. And we add the things
  and places — what strips the hills bare, what helps them recover, where the water floods, where the
  ground slides, where it is greening again. We draw lines to show what is joined to what.

  As we build it, we notice what makes the problem worse and what helps. And we mark who we could safely
  and kindly learn from later. Before we ask anyone anything, we always ask their permission, and we never
  use anyone's name. This map shows us where our research can go.
