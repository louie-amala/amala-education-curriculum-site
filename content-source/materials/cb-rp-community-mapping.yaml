# Contextualised, fully offline FRAMING activity for the Research Project component of Learning Bridge+
# (Cox's Bazar). A big shared drawing that maps the people, groups, and things connected to the trees and
# hills — who remembers the forest, who lives on the slopes, what strips the hills and what helps them
# recover, where it floods or slides. Surfaces contributing factors AND becomes the sampling frame for who
# to safely talk to later. Frame the challenge phase (objective 1). Oral and visual first; safeguarding.
id: cb-rp-community-mapping
slug: cb-rp-community-mapping
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "Who and what is connected to our challenge"
summary: >-
  A big shared drawing that maps the people, groups, and things connected to the trees and hills — who
  remembers the forest, who lives on the slopes, what strips the hills and what helps them recover, where
  it floods or slides. It surfaces the causes behind the challenge and shows who we might safely talk to.
facilitationContext:
- group
primaryContext: group
duration: "2 hours facilitated + 1 hour independent"
grouping: "Whole group around one big map; pairs to add and talk"
whatLearnersDo:
- Build one big shared map, in drawings and marks, of everything connected to the trees and hills.
- Add the people and groups — who remembers the forest, who lives on the slopes, who cuts and who plants.
- Add the things and places — what strips the hills, what helps them recover, where it floods or slides.
- Notice which things cause or worsen the problem and which help — the factors behind our challenge.
- Mark, with the facilitator, who it is safe and appropriate for us to learn from and talk to later.
materialsAndPreparation:
- A very large sheet, cloth, or cleared floor space for one shared map the whole group can reach.
- Pens, chalk, cards, or small objects for people, groups, places, and things; no writing required.
- The "what we know / what we still need to find out" wall from the previous activity, nearby.
- Step-back and referral guidance to hand, and a clear sense of who learners should NOT be sent to approach.
visuals:
- kind: setup
  title: "Everyone around one shared map"
  caption: >-
    One big sheet, cloth, or cleared floor the whole group can reach. Pairs add people and things; you
    move around and hold the line on who is safe to approach.
  spec:
    type: groups
    facilitator: true
    clusters:
    - size: 10
      count: 1
      label: "whole group, one map they all reach"
- kind: example
  title: "Our map: people, harms, and helps"
  caption: >-
    The finished map sorts what is connected to the hills, and marks who it is safe and kind to learn from
    later. We always ask permission, and never use anyone's name.
  spec:
    type: zones
    zones:
    - label: "People"
      tone: neutral
      cards:
      - "elders who remember"
      - "families on the slopes"
