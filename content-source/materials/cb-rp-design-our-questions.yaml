# Contextualised, fully offline ACTIVITY for the Research Project component of Learning Bridge+ (Cox's
# Bazar). Learners are TAUGHT how a research question works — open, closed, leading, two-in-one; asking
# about experience rather than opinion; the three follow-ups and the five-second wait; interview versus
# survey; who to ask — and then design the oral instruments they will use to gather primary evidence.
# Plan and conduct research phase (objective 2). Oral and visual first; questions tie back to the four
# sub-questions of our given research question.
#
# This is the first material built to the teaching-content standard: `learnerTeaching` carries the
# method for the learner ("Learn it" page of the workbook spread), `educatorContent` carries the subject
# brief the facilitator needs to teach it. The workbook is a textbook as well as a workbook, because
# offline there is nothing else to look it up in.
id: cb-rp-design-our-questions
slug: cb-rp-design-our-questions
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "Design our interview and survey questions"
summary: >-
  Learners learn how to ask a question that makes a person tell them what they know — and then design
  the questions they will ask their community: a short set of oral interview questions and a very short
  survey, all tied to our four sub-questions about the hills. They learn open, closed and leading
  questions, how to follow up an answer, who to ask, and how to record answers with marks rather than
  writing. They try their questions on each other and make them better.
facilitationContext:
- group
primaryContext: group
duration: "3 hours facilitated + 1 hour independent"
grouping: "Whole group for the teaching and the fishbowl, then pairs and small groups to draft, try and fix"
whatLearnersDo:
- Learn the four kinds of question — open, closed, leading, two-in-one — and which of them gives us real evidence.
- Watch the facilitator interview someone in front of them, well and then badly, and name what made the difference.
- Learn the three follow-ups — "tell me more", "why do you think that?", and waiting quietly — and practise the waiting.
- Design a short set of oral interview questions, one or two for each of our four sub-questions about the hills.
- Shape a very short oral survey — one or two closed questions asked of many people, each offering two or three answers to choose from — and record the answers as tally marks under the answer each person gave.
- Decide who to ask, choosing five different kinds of people rather than five people like themselves.
- Try their questions on each other, notice what was confusing or leading, and fix them.
materialsAndPreparation:
- The research question and its four sub-questions, big on the wall (before/now; a bare hill in rain and hot sun; what roots, grass, and trees do; what people are doing to help and whether it is working).
- The "our questions to ask" pages from the research book (one per learner) — the Learn it page, the questions page, the survey page, and the who we will ask page.
- The eight question cards for the sort, printed from the picture-word cards file or written on scraps of paper (the cards and their answers are in the facilitator notes below).
- A learner who is willing to be interviewed in front of the group for the fishbowl — ask them before the session, not on the spot.
- Two columns marked on the wall or a board, for what a good interviewer does and what a poor one does.
- The six question-starter words drawn big — what, when, who, where, how, why — plus "tell me about…".
- "Marks agreed for recording survey answers: the answers the question offers, drawn as small pictures at the top of the tally page, and one tally mark per person underneath."
