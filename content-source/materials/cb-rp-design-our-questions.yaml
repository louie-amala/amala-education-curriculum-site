provenanceNote: >-
  Authored activity for the Learning Bridge+ (Cox's Bazar) Research Project edition. Learners are taught
  how a research question works — open, closed and leading questions, asking about experience, the three
  follow-ups, interview versus survey, and who to ask — and then design short, oral instruments tied to
  the four sub-questions of the given research question. Plan and conduct research phase (objective 2);
  fully offline, oral and visual first. Rebuilt (August 2026) as the first material carrying
  `learnerTeaching` and `educatorContent`, so the learner book teaches the method and the facilitator
  has the subject knowledge to teach it. Its printable pages compile into the Research Project student
  workbook.
