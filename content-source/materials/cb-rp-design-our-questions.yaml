agencyContribution:
  indicators:
  - contribution-to-community
  - control-of-future-pathways
  how: >-
    Designing their own questions puts learners in charge of what their community investigation asks and
    finds — the difference between running someone else's survey and shaping the enquiry themselves, a
    skill they can turn on any question that matters to them.
principlesForegrounded: [collaboration, authentic-challenges, feedback-and-data]
principleAlignment:
- principle: collaboration
  how: Learners draft questions in small groups and try them on each other, improving them together before meeting the community.
- principle: authentic-challenges
  how: Every question is built to answer a real sub-question about the hills the learners live on, not a practice exercise.
- principle: feedback-and-data
  how: Trying questions on each other surfaces which ones confuse or lead, and learners use that feedback to improve them.
