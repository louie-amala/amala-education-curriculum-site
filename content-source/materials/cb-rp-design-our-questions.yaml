facilitationNotes: >-
  The one thing to get right: teach the method before they draft. This block used to be a drafting
  block, and learners drafted what they already knew how to ask — which was mostly leading questions.
  Teach the four kinds of question, model an interview in front of them, and only then set them to
  design. The second thing: questions come from our sub-questions, not from nowhere. Keep pointing back
  to the wall — every question should help answer one of the four things we want to find out. Keep the
  set short — a handful of good questions beats a long list. Trying questions on each other is how
  learners find the confusing ones before a real person does.
steps:
- title: "How a good question works"
  duration: "45 min"
  guidance: >-
    Teach the Learn it page: the four kinds of question, how to fix a leading one with the six starter
    words, asking about what a person saw rather than what they think in general, and the three
    follow-ups including the five-second wait. Sort the eight prepared question cards together into
    open, closed and leading, saying each aloud and acting out how a person would reply. Then the
    fishbowl: interview one learner in front of the group for three minutes, using only the starter
    words and the follow-ups — then do one minute badly on purpose, leading and interrupting. The group
    names what they saw in each; keep the two columns on the wall for the rest of the block.
  keyPrompts:
  - "Does this question let the person say anything, or does it expect one answer?"
  - "How could we turn this leading question into an open one?"
  - "What did I do in the good one that I did not do in the bad one?"
  - "What happened when I said nothing and waited?"
- title: "Design our questions, sub-question by sub-question"
  duration: "60 min"
  guidance: >-
    Working from the four sub-questions on the wall, small groups draft one or two oral interview
    questions for each, and write or draw the follow-up they will use after it. Every question is
    checked against four things before it goes on the page: is it open, is it about one thing, is it
    short enough to say in one breath, and is it safe to ask. Move between groups and hand questions
    back rather than fixing them yourself — "how would they answer that if they could not say yes or
    no?" does more than a correction.
  keyPrompts:
  - "Which sub-question does this help us answer?"
  - "Is this asking what they think in general, or what they actually saw?"
  - "What will you say after they answer?"
- title: "Our short survey, and who we will ask"
  duration: "30 min"
  guidance: >-
    Now the other instrument. Together, shape one or two closed questions we could ask many people — and
    for each, the two or three answers people choose between, drawn as small pictures at the top of the
    tally page. Practise recording a few answers on the page so the marks are agreed before anyone goes
    out. Then each group names five different kinds of person they will ask, and why each one would know
    something different. Set the targets out loud: three interviews each, ten survey marks per pair.
  keyPrompts:
  - "What answers can a person choose between? Can we count them?"
  - "Who would know something about this that we do not?"
  - "If we only ask people like us, what will we miss?"
- title: "Try them on each other, and fix them"
  duration: "45 min"
  guidance: >-
    In pairs, learners run their questions on each other as if for real, opening with the consent
    request they practised, and using their follow-ups. The partner says afterwards which question was
    confusing, too long, or pushed an answer. Each pair fixes at least one question and records on the
    page what they changed and why. Close by hearing one open question, its follow-up, and who will be
    asked, from every pair — that is the check that they are ready to gather.
  keyPrompts:
  - "Which question was hard to understand? How can we say it more simply?"
  - "Did any question push you toward an answer? How can we open it up?"
  - "Did you wait after the answer? What came out when you did?"
educatorContent: |
  ## What you need to know before you teach this

  Learners are about to collect the only primary evidence this investigation will have. The quality of
  that evidence is decided here, in the questions — not out in the community. So this is a teaching
  block, not a drafting block. Teach the method, model it in front of them, and only then let them
  design. If you set them straight to drafting they will write the questions they already know how to
  ask, and most of those will be leading.

  ### Why open versus leading is not about politeness

  A leading question — "The rain ruins the bare slope, doesn't it?" — tells you what you already
  believed. Learners then bring back "evidence" that is really their own opinion, handed back to them by
  a neighbour. Later, when they weigh their sources, they will have nothing to triangulate: every answer
  agrees, because every answer was suggested. Say that to the group in plain words. A leading question
  does not just bother the person answering. It destroys the evidence.

  ### The one technique that changes everything: ask about experience

  Beginners ask for opinions — "Is erosion a problem here?" — and people answer opinions with
  generalities. Ask instead about a specific thing the person saw or did: "Tell me about the last big
  rain. What did you see?" Concrete memory produces detail, places, times and numbers. Every time a
  learner's question drifts back to opinion, hand it back with one question of your own: "when did they
  last see that?"

  ### The three follow-ups, and the five-second wait

  A first answer is almost always short and polite. The information is in the second answer. Teach three
  moves and no more: "Tell me more", "Why do you think that?", and silence. Silence is the hardest to
  teach and the strongest — most people fill a five-second pause with the thing they were deciding
  whether to say. Learners will break it out of nervousness, so rehearse counting to five explicitly,
  and let them feel how long it is.

  ### Interviews and surveys do opposite jobs

  An interview uses open questions on a few people to learn WHY. A survey uses closed questions on many
  people to learn HOW MANY. Learners mix these up constantly — open questions in the survey, which
  cannot be counted, and yes/no questions in the interview, which produce nothing. Hold one line: if it
  cannot be answered with a mark, it does not belong in the survey.

  Because most of this cohort is not yet writing, the survey has to be recordable without writing. Teach
  one system and use it everywhere: decide the two or three answers the question offers, draw a small
  picture for each at the top of the tally page, then one mark per person underneath, tallied in fives.
  The columns must be the ANSWERS TO OUR OWN QUESTION — this is the part learners get wrong. A fixed
  good/in-between/bad face scale cannot answer "where is it cooler, the bare hill or under the trees?";
  a survey whose marks do not stand for the choices the question offers cannot be counted at all. Faces
  are right only when the question really is about good and bad. Learners who can write may write;
  nobody has to.

  ### Sampling, in the honest version

  We are not teaching statistics. We are teaching variation: if you only ask people like yourself, you
  learn one thing. Push each group to name five different kinds of person — an elder who remembers the
  hills before, someone who works on them, a woman who walks that path for water or firewood, a young
  person, someone who lives below a slope. Say the targets out loud: three interviews each, ten survey
  marks per pair.

  Do not let anyone claim their findings speak for the whole camp. Name the limit now, while it is
  cheap: it becomes the "an honest limit" line on their output page in the Communicate phase, and it is
  a mark of a good researcher, not a weakness.

  ### Protection, restated at the point of use

  The consent words were practised in the previous block and are used for real in the next one. Here,
  check every drafted question against three things: it does not ask for names, it does not ask about
  anyone's household or status, and it does not ask anything that could put the person answering at
  risk. A question about who cut the trees is a protection matter, not a research one — redirect it to
  the hills. Girls gather in same-gender pairs where that is what keeps them safe. Any question you are
  unsure about, cut it; there are always other questions.

  ## How to model it: the fishbowl

  Do not explain interviewing. Show it.

  - Ask one confident learner beforehand to sit with you in the middle. Interview them for three minutes
    about the last heavy rain, using only the six starter words and the three follow-ups. Go slowly. Use
    the silence, and let it be uncomfortable.
  - Then ask the group what they saw you do. Collect it. They will name the short questions, the
    waiting, the "tell me more".
  - Now do one minute badly on purpose: lead, interrupt, argue with the answer, ask two things at once.
    They will laugh, and then name every fault. That naming is the learning.
  - Keep the good and the poor version on the wall as two columns for the rest of the block.

  ## The sort cards, and their answers

  Read each aloud and let the group sort it. Print them from the picture-word cards file, or write them
  on scraps of paper.

  - "What happens to this slope when it rains?" — OPEN
  - "The rain ruins it, doesn't it?" — LEADING
  - "Do the hills slide?" — CLOSED (fine for the survey, weak in an interview)
  - "What were the hills like when you were young?" — OPEN
  - "Trees are better, right?" — LEADING
  - "Tell me about the last big rain." — OPEN, and the strongest kind: it asks about something they saw
  - "Is it hotter now?" — CLOSED
  - "Everyone wants the trees back, don't they?" — LEADING

  For the Try it rehearsal on the learner's page, use four of these — one open, one closed, two leading
  — and finish by fixing a leading one aloud, together.

  ## The five errors you will see, and the fix for each

  - **A yes/no question in the interview.** Ask: "how would they answer that if they could not say yes
    or no?"
  - **An opinion question.** Ask: "when did they last see it? Ask about that."
  - **Two questions joined by 'and'.** Cut it in half.
  - **A question the person cannot answer** — asking a child what the hills were like forty years ago.
    Ask: "who would actually know this?"
  - **A question about people rather than the hills.** Redirect to the issue; this is also a protection
    matter.

  ## Before they leave this block

  Every pair can say aloud: one open question, the follow-up they will use after it, and who they will
  ask. If a pair cannot, they are not ready to gather — give them the extra time at the start of the
  next block rather than sending them out.
learnerTeaching:
  title: "How to ask a good question"
  readAloud: |
    ## How to ask a good question

    We are going to ask people in our community. A good question makes a person tell us what they know.
    A weak question makes them say only yes or no — or it puts our own words in their mouth.

    ### Four kinds of question

    - **Open** — "What happens to this slope when it rains?" The person tells us a lot. Use these.
    - **Closed** — "Do the hills slide?" The person says yes or no. Good only for our short survey, when we want to count.
    - **Leading** — "The rain ruins it, doesn't it?" We already said the answer. The person only agrees. Never use these.
    - **Two-in-one** — "What happens in the rain and in the hot sun?" The person answers one part and forgets the other. Cut it into two questions.

    ### How to fix a leading question

    Take the answer out. Then start again with one of these words:

    **What · When · Who · Where · How · Why** — or **"Tell me about…"**

    "The rain ruins it, doesn't it?" becomes "**What** happens here when it rains?"

    ### Ask what they saw, not what they think

    People remember what happened to them. A big question about everything is hard to answer.

    - Weak: "Is the soil a problem here?"
    - Strong: "Tell me about the last big rain. What did you see?"

    ### One question, one thing

    Say it in one breath. If you cannot say it in one breath, it is too long.

    ### After they answer — the three follow-ups

    The first answer is short. The real answer comes next. Use these three:

    - Tell me more.
    - Why do you think that?
    - Say nothing. Count to five in your head. People fill the quiet. This one is the strongest.

    ### What not to do

    - Do not argue. Do not tell them they are wrong.
    - Do not finish their sentence for them.
    - Do not ask about anything private, or anything that could put someone in danger.
    - Do not write anyone's name.

    ### An interview is not a survey

    - **Interview** — a few people. Long answers. Open questions. We learn **why**.
    - **Survey** — many people. One or two closed questions. We learn **how many**.

    A survey question must offer people a small number of answers to choose from — usually two or three —
    or there is nothing to count. "Where is it cooler — on the bare hill, or under the trees?" offers
    three: *on the bare hill*, *the same*, *under the trees*.

    We do not need to write to record it. We can use marks:

    - First decide the answers people can choose, and draw a small picture for each one at the top of the page.
    - Then put ONE mark under the answer each person gives.
    - A tally is easiest: one mark for each person, and a line across every fifth mark, so we can count in fives.

    If our question asks whether something is good or bad, the three answers can be three faces — a
    smiling face, a flat face and a sad face. Only then.

    ### Who to ask

    Ask **different kinds of people**. If everyone we ask is like us, we only learn one thing.

    Try to ask:

    - an elder who remembers the hills before
    - someone who works on the hills
    - a woman who walks that way for water or firewood
    - a young person
    - someone who lives at the bottom of a slope

    Each of us asks **three people** for our interviews. Each pair collects **ten marks** for our survey.

    When we tell people what we found, we say honestly: "We asked a small number of people." That is not
    a weakness. That is being an honest researcher.
  words:
  - term: open question
    meaning: a question that lets a person tell us a lot
  - term: closed question
    meaning: a question answered with yes or no, or one word — good for counting
  - term: leading question
    meaning: a question that already says the answer we want
  - term: follow-up
    meaning: what we say after the first answer, to hear more
  - term: interview
    meaning: asking a few people open questions, to learn why
  - term: survey
    meaning: asking many people one small question, so we can count
  - term: tally
    meaning: a mark we make each time, so we can count without writing
  tryIt:
    intro: >-
      Before you write your own, try these four. Say what kind each one is, and circle it. You can do this
      on your own, or with a friend.
    chooseFrom: [open, closed, leading]
    items:
    - '"What happens to this slope when it rains?"'
    - '"The rain ruins it, doesn''t it?"'
    - '"Do the hills slide?"'
    - '"Tell me about the last big rain."'
    answers:
    - Open. It lets the person tell us anything they saw. This is the kind we want.
    - Leading. It already says the answer, so the person can only agree with us.
    - Closed. They can only say yes or no. Fine for our short survey, weak in an interview.
    - Open, and the strongest kind — it asks about something they really saw, on a day they remember.
    then: >-
      Now fix number 2. Take the answer out, and start again with What, When, Who, Where, How or Why.
learnerContent: |
  ## Our questions to ask

  We are going to ask people in our community to help answer our four sub-questions about the hills.
  Good questions let people tell us what they really think.

  An open question invites anything: "What happens to this slope when it rains?" A leading question
  pushes one answer: "The rain ruins the bare slope, doesn't it?" We want open questions.

  For each of our four sub-questions, we design one or two short questions to ask, and we decide what we
  will say after the answer to hear more:

  - What were our hills like before, and what are they like now?
  - What happens to a bare hill when it rains, and in the hot sun?
  - What do trees, grass, and roots do for the soil and for us?
  - What are people doing to help our hills, and is it working?

  We also make a very short survey — one or two questions we ask many people, and record with a tally
  mark or a face. And we decide who to ask, choosing five different kinds of people, so we do not only
  hear what people like us already think.

  We try our questions on each other first, and make the confusing ones clearer.
