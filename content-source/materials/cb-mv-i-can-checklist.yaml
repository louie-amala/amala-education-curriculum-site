# Contextualised, fully offline adaptation of efi-mv-can-do-checklist for Learning Bridge+ (Cox's Bazar).
# The key shift from the source: the source is a written "I can now…" checklist that assumes learners can
# read the statements and write their own reflection. This version is emergent-literacy first — it is an
# ORAL, picture-based self-check, marked with thumbs, faces, or a mark, never written self-report. It is
# marked once near the START of the unit (where am I now) and again at the END (what grew). It is a
# development and reflection tool, not a test. Oral and visual first, no devices. Objective 1.
id: cb-mv-i-can-checklist
slug: cb-mv-i-can-checklist
access: partner
edition: learning-bridge-coxs-bazar
type: resource
title: "My 'I can…' check — where am I now, and what grew"
summary: >-
  An oral, picture-based self-check where learners mark how sure they feel about each small thing they are
  learning to do in English — using thumbs, faces, or a mark rather than written words. It is marked near
  the start of the unit to see where each learner is now, and revisited at the end to let them see and own
  how far they have come. It is a tool for reflection and growth, never a test.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. The facilitator says each "I can…" picture aloud in the learners' language, and everyone
    marks their own sheet privately at the same time — thumbs up, a middle face, or a not-yet mark. Marking
    together keeps it low-stakes and stops it feeling like a public test; no one sees another's marks unless
    they choose to share. Use same-gender pairs if any talking-about-it is done aloud.
- context: one-to-one-mentoring
  how: >-
    A warm fit. A mentor and learner go through the pictures together, and the mentor can slow down, give an
    example of each "I can…" so it is concrete, and reassure a learner who is anxious that not-yet marks are
    expected and good. One to one, the end-of-unit comparison becomes a gentle, honest conversation about
    real growth the learner might otherwise not notice in themselves.
- context: independent
  how: >-
    Limited alone, because the value is a trusted person saying each item aloud and framing not-yet as fine.
    If used independently, the learner keeps the picture sheet in their My Voice book and marks it with a
    helper at home; the marks are then talked through at the next session so the reflection still happens
    with support.
duration: "About 1 hour facilitated, used in two short parts — roughly 25 minutes near the start of the unit and 25 minutes at the end"
grouping: "Whole group, each marking their own sheet privately; a mentor route for anyone anxious; works with 10-35 learners"
whatLearnersDo:
- Meet a small set of picture "I can…" statements and learn what the marks (thumb up, middle, not-yet) mean.
- Mark, near the start of the unit, how sure they feel about each one right now — no reading or writing needed.
- Revisit the same pictures at the end of the unit and mark again, so they can see what has changed.
- Notice and name one thing they can now do that they could not do before, and one thing to keep growing.
materialsAndPreparation:
- A picture "I can…" sheet for each learner, kept in their My Voice book, with a simple image for each thing they are learning to do (say my name, greet someone, hear first sounds, say a word about me, introduce myself).
- A clear, agreed set of marks the whole group knows — a thumb up for yes-I-can, a flat hand or middle face for a-little, and a small dot or open circle for not-yet.
- Your own way of saying each "I can…" aloud in the learners' language, with a quick concrete example of each so it is never abstract.
- "Sensitivity: this is a self-check, not a test, and it must never feel like one. Some learners carry shame about school and will mark themselves down harshly or fear being judged. Say plainly, before any marking, that not-yet marks are expected, private, and exactly what the first mark is for — so growth can be seen later. No marks are ever collected, compared, or shown to anyone."
facilitationNotes: |
  The source is a written checklist a literate learner reads and fills in. Here almost no one can yet read
  the statements, so the whole thing is rebuilt to run by ear and by picture: you say each "I can…" aloud
  in the learners' language, learners look at a small picture that stands for it, and they mark how sure
  they feel with a thumb, a face, or a mark. Nothing is read; nothing is written. The single most important
  thing is that this is a development and reflection tool, not a test and not an assessment. Its power comes
  entirely from being marked twice — once near the start, when almost everything is honestly "not yet", and
  again at the end, when the learner can lay the two side by side and see, in their own marks, how much they
  have grown. So protect the start-of-unit marking even though it feels discouraging in the moment; the
  not-yet marks are what make the growth visible later. Keep every item small, true, and concrete, give an
  example of each so no one is guessing what it means, and keep the marks private. Celebrate the second
  marking as the real point: this is you seeing your own learning.
steps:
- title: "Meet the pictures and the marks (start of unit)"
  duration: "10-12 min"
  guidance: |
    Before any marking, walk through the picture sheet slowly. Say each "I can…" aloud in the learners'
    language and give a quick, concrete example — "this one is: I can say my name and its first sound, like
    Fatima, fff". Then teach the three marks together as a game: everyone show me a thumb up, now a flat
    hand for a-little, now the not-yet mark. Make sure the not-yet mark is framed warmly and out loud as the
    normal, expected thing at the start. The aim of this step is only that everyone knows what the pictures
    mean and that marking is safe and private.
  keyPrompts:
  - This picture means "I can…". What do you think it shows? Let me say it for you.
  - "Show me your three marks — yes, a-little, not-yet. All of them are fine."
  - Remember, no one sees your marks but you. Not-yet is the most useful mark of all today.
  watchOuts:
  - A learner treating it as a test and freezing or copying a neighbour; say clearly and more than once that there are no right answers and no one is checking, only themselves.
  - The not-yet mark feeling like failure; keep naming it as the starting line that lets them see how far they run later.
  adaptation: |
    No printed sheet is needed. The pictures can be drawn quickly on paper or on the ground, and learners
    can mark "yes / a-little / not-yet" with pebbles, folded fingers, or marks in the dust beside each
    picture — the record just needs to be theirs and kept until the end of the unit.
- title: "Mark where I am now (start of unit)"
  duration: "10-13 min"
  guidance: |
    Now go item by item. Say each "I can…" aloud, wait, and let every learner mark their own sheet quietly
    at the same time. Keep the pace calm and even so no one feels rushed or watched. Do not gather or look
    at the marks — this belongs to the learner. When you finish, have them keep the sheet safely in their My
    Voice book, and tell them plainly what it is for: we will do this exact same check again at the end, and
    you will get to see for yourself what changed.
  keyPrompts:
  - Listen to this one, then mark how sure you feel right now — yes, a-little, or not-yet.
  - There is no hurry and no right answer; mark what is true for you today.
  - Keep this safe in your book. It is a photograph of today, so you can see how you grow.
  watchOuts:
  - Faster learners marking loudly or peeking at others; keep it private and unhurried, and remind them the marks are only for themselves.
  - A learner distressed that everything is not-yet; reassure them that this is exactly right at the start and is the whole point of marking now.
  adaptation: |
    If there is no way to keep a paper sheet safely, the facilitator can note each learner's marks privately
    for them (as a helper, not a judge) so the two markings can be compared later; make clear these notes
    are only to let the learner see their own growth and are shared with no one.
- title: "Mark again, and see what grew (end of unit)"
  duration: "12-15 min"
  guidance: |
    At the end of the unit, bring out the same sheets. Run the identical check: say each "I can…" aloud and
    let learners mark again, privately, beside their first mark. Then comes the real moment — have each
    learner look at the two markings together and see the movement: items that were not-yet in week one and
    are now a-little or yes. This is the check doing its job. Move around, kneel beside people, and help
    those who cannot yet see their own progress to spot it in their own marks.
  keyPrompts:
  - Mark each one again for today, next to your first mark.
  - Look at the two marks together. Which ones moved? What can you do now that you could not before?
  - Who has a not-yet that became a yes? That is your own learning, made by you.
  watchOuts:
  - A learner focusing only on remaining not-yet marks; steer them firmly to what moved, and remind them that some things keep growing after the unit ends, which is normal and good.
  - Any temptation to turn the two markings into a score or a grade; it is a mirror for the learner, never a measure for anyone else.
  adaptation: |
    Where marks were kept as pebbles or dust marks rather than paper, simply recreate the first pattern
    beside a fresh one, or read the learner back their earlier marks from the private helper-notes, so they
    can still see the before and after side by side.
- title: "Name a win, and choose what to keep growing (end of unit)"
  duration: "8-10 min"
  guidance: |
    Close by having each learner, in a same-gender pair or with a mentor, say aloud one thing they can now
    do that they could not at the start — a real, named win from their own sheet — and one thing they want
    to keep getting better at. Gather a few of these for the whole group so growth is witnessed and shared.
    Link it forward: this same habit of checking "where am I now, and what grew" is something they can keep
    using in every part of their learning.
  keyPrompts:
  - Tell your partner one thing you can now do that you could not do before.
  - What is one thing you want to keep growing at? That is your next not-yet to prove wrong.
  watchOuts:
  - A shy learner reluctant to claim a win aloud; let them say it quietly to a partner or mentor first, and never require public sharing.
closing: |
  Bring the two markings together one last time and name the point plainly: you did not just learn some
  English, you can now see your own learning, in your own marks, made by you. That noticing — where am I
  now, and what grew — is a skill you keep for every subject and every year ahead. The marked sheet stays
  in the My Voice book as a lasting record of the growth. Independent task: at home, tell one person one
  thing you can now do in English that you could not do when the unit began.
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  how: >-
    Marking their own learning, in their own picture-marks, and seeing growth they made themselves, puts a
    learner in charge of judging their own progress rather than waiting to be judged. In a setting where
    much is decided for them and where school may have taught them to expect a verdict, quietly proving a
    not-yet into a yes is real power over how they see themselves as learners — the self-belief that keeps
    them investing in their own growth.
principlesForegrounded:
- recognise-communicate-growth
- safe-spaces
- connect-to-futures
principleAlignment:
- principle: recognise-communicate-growth
  how: >-
    The whole tool exists to help learners recognise and name their own growth in accessible, picture-based
    language: by marking the same small "I can…" statements at the start and the end, they see and can say
    for themselves exactly what changed, which is the habit of noticing progress made concrete.
- principle: safe-spaces
  how: >-
    It is deliberately private, low-stakes, and framed out loud as reflection rather than a test: not-yet is
    named as expected and useful, no marks are collected or compared, and no one has to share, so a learner
    carrying shame about school can take part without exposure.
- principle: connect-to-futures
  how: >-
    Learning to ask "where am I now, and what has grown?" is a self-direction habit that reaches far past
    this unit; a learner who can honestly read their own progress carries a tool they will reuse across
    accredited study and life, wherever their learning takes them next.
competencyCodes:
- FUS1
competencyDevelopment:
- code: FUS1
  how: >-
    Marking what they can and cannot yet do, and reflecting on how they have grown across the unit, is
    direct practice in self-awareness: the two markings are the evidence a learner can look at their own
    learning honestly and see themselves as someone who is changing and capable of more.
