id: cb-ail-my-steps-page
slug: cb-ail-my-steps-page
access: partner
edition: learning-bridge-coxs-bazar
type: resource
title: "My steps"
summary: >-
  The goal at the top and the steps down to one the learner can reach soon — the first step, coloured in.
facilitationContext:
- group
- independent
primaryContext: independent
learnerContent: |
  ## My steps

  This page is yours. You can draw, write, or say your answer — someone will write it for you if you
  ask — and nobody marks it right or wrong.

  - Write or draw your goal at the top.
  - Write or draw the steps that come before it.
  - Colour the first step — the one you can reach soon.
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  how: >-
    Keeping their own record of what they decided, and why, is what lets a learner carry a goal
    between sessions without an adult holding it for them.
