# Contextualised, fully offline adaptation of ail-what-makes-a-good-goal for Learning Bridge+
# (Cox's Bazar). Oral and visual first, ~60 min facilitated.
id: cb-ail-what-makes-a-good-goal
slug: cb-ail-what-makes-a-good-goal
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "What makes a good goal"
summary: >-
  Learners learn simple tests of a good learning goal and practise judging and fixing spoken example
  goals, so they can tell a strong goal from a weak one and sharpen their own.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners judge the same spoken example goals with a show of thumbs, then compare
    verdicts with a partner. The disagreement is the point: arguing over whether a goal is clear
    enough forces learners to apply the tests sharply, so keep the paired compare.
- context: one-to-one-mentoring
  how: >-
    A strong fit. A mentor and learner judge the examples together, and the mentor pushes on the test
    the learner tends to skip, often "by when". Use the learner's own rough goal as the last example.
- context: independent
  how: >-
    Weaker alone, since a learner has no one to check their verdicts. If independent, use the workbook
    picture-prompts of the tests and ask them to say one improved goal aloud to a family member.
duration: "About 1.5 hours in the unit plan (generous for this oral/visual, translated cohort - the step timings below are the active teaching core; the rest is warm check-in, drawing, and translation), plus a 30 min independent task"
grouping: "Individual judging, then same-gender pairs or small groups; works with 10-35 learners"
whatLearnersDo:
- "Learn the tests of a good goal: small enough to reach, clear so you can tell when it is done, it matters to you (and maybe to people you care about), and it has a by-when."
- Judge spoken example goals with thumbs up or down, and say which test each one fails.
- Fix a weak goal so it passes the tests.
- Test one of your own rough goals and make it stronger.
materialsAndPreparation:
- "The four goal-test picture cards (in the [Picture Cards pack](/downloads/agency-in-learning-picture-cards.pdf)): small, clear, it matters, by-when."
- A set of spoken example goals at mixed quality, some vague, some too big, some with no by-when, close to your learners' real goals.
- One weak goal and the same goal improved, to model the fix aloud.
visuals:
- kind: setup
  title: "The four tests of a good goal"
  caption: >-
    Kept on the wall as a reference: a good goal passes all four. Learners judge goals against them, then
    test their own.
  spec:
    type: zones
    zones:
    - label: "Small enough"
      tone: neutral
      cards:
      - "not too big"
    - label: "Clear"
      tone: neutral
      cards:
      - "a clear finish"
    - label: "It matters"
      tone: neutral
      cards:
      - "matters to me"
    - label: "By when"
      tone: neutral
      cards:
      - "has a day"
- kind: example
  title: "A weak goal made strong"
  caption: >-
    ‘Get better at English’ fails the tests - not clear, no by-when. Sharpened, it passes all four.
  spec:
    type: zones
    flow: across
    flowLabel: "becomes"
    zones:
    - label: "Weak goal"
      tone: warn
      cards:
      - "get better at English"
    - label: "Strong goal"
      tone: positive
      cards:
      - "say 10 new English words by Friday"
facilitationNotes: |
  Learners draft goals in the next sessions; here they build the judgement to tell a good goal from a
  weak one and fix it. The one thing to get right is that learners apply the tests to the examples
  themselves, out loud, rather than watching you. A learner who can hear that "get better at English"
  is not clear or timed can sharpen their own goals for years. Keep the tests plain and the examples
  close to their real lives. It is a way of thinking, not a form to fill in.
steps:
- title: "Learn the tests of a good goal"
  duration: "10-12 min"
  guidance: |
    Say the tests plainly, with the workbook picture for each: a good goal is small enough to reach,
    clear so you can tell when it is done, it matters to you (and maybe to people you care about), and
    it has a by-when. Give one quick
    spoken goal that passes all of them. Keep it short: learners understand the tests far better by
    judging goals in the next step than by hearing you explain.
  keyPrompts:
  - What does each test ask, in your own words?
  - Which test do you think goals most often fail?
  watchOuts:
  - Learners treat the tests as boxes to tick; stress that the point is judgement, and that a goal can sound neat and still not matter to the learner.
  adaptation: |
    No handout is needed: say the four tests aloud and point to the four pictures on the workbook page
    to score against.
- title: "Judge goals, thumbs up or down"
  duration: "16 min"
  guidance: |
    Say each mixed-quality example goal aloud. Learners show thumbs up or down and name which test it
    fails. Then they compare with a partner. Circulate and listen for disagreement rather than settling
    it; asking "which test does this fail, and how do you know?" does more than giving the answer.
  keyPrompts:
  - Which test does this goal fail, and what tells you that?
  - Could two people hear this goal and picture different things?
  watchOuts:
  - Learners approve a goal because it sounds big and ambitious; remind them that a big goal with no by-when and no clear finish is a weak goal.
- title: "Fix a weak goal"
  duration: "16 min"
  guidance: |
    Model the fix first with your spoken example: take a weak goal and improve it test by test until it
    passes, thinking aloud. Then say one weak goal and have each pair improve it together and say it
    back. The aim is a goal that would survive the tests.
  keyPrompts:
  - Which test does this goal fail first, and what is the smallest change that fixes it?
  - Now that it is clear, can you still reach it in the time you set?
  watchOuts:
  - Learners fix the words but strip out what made the goal matter; check the improved goal is still one a real person would care about.
- title: "Test your own goal"
  duration: "12 min"
  guidance: |
    Turn the lens on the learners' own goals. Ask each learner to take a rough goal they carry, from
    their Learner Profile last week, and run it through the tests, sharpening any it fails. This is not
    drafting a new goal; it is testing one they hold, so they leave able to do this for themselves.
  keyPrompts:
  - "Run your own goal through the tests: which does it pass, and which needs work?"
  - What is the one change that would make your goal stronger?
  watchOuts:
  - A learner declares their goal fine to avoid the work; ask them to say the exact words that make it clear and timed, which usually surfaces the gap.
closing: |
  Ask two or three learners to say a goal before and after they applied the tests, so the room hears
  the difference. Remind them this is a lens they now own: every goal they set from here can be held up
  against small, clear, matters, and by-when. Independent task: think of one goal you might set next
  session, and check it against the four tests, or ask someone at home to hear it and help you.

educatorContent: |
  ## What you need to know before you teach this

  This is the block the rest of the component rests on. A learner with a weak goal will spend eight
  weeks failing at something that was never reachable, and will conclude the failure was theirs. Most
  of what looks like poor motivation later is a bad goal set here.

  ### The four tests, and what each is actually guarding against

  1. **Small enough to reach.** Guards against a goal that is really an ambition. "Learn English" is a
     wish; "say five true sentences about myself" is a goal. The test: could you finish this in the
     weeks we have?
  2. **Clear enough to know when it is done.** Guards against a goal a learner can never tick.
     "Get better at reading" has no finish line. "Read the words on the shop signs near my shelter"
     does. The test: how will you KNOW?
  3. **It matters to you.** Guards against the goal a learner thinks you want to hear. This is the
     commonest failure in this block and the hardest to spot, because those goals sound excellent.
  4. **It has a by-when.** Guards against the goal that is always about to start. The test: when will
     you have done it?

  ### The trap: goals set to please you

  Learners who have been in school know what an adult wants to hear. You will get "study hard every
  day" and "be a good student", said with real sincerity. They are not lying - they are answering the
  question they think you asked.

  The tell is that the learner cannot say WHY, or says why in the same borrowed words. Ask "what would
  be different for you if you did that?" and listen for something concrete. If nothing comes, the goal
  is not theirs yet. Do not accept it because it is well-behaved.

  ### The other trap: goals about things they do not control

  This edition deliberately reframes goal-setting around what is within a learner's control, and this
  block is where that gets enforced. "Get a place at the secondary school" is not a goal a learner can
  set - it depends on a decision someone else makes. "Be able to introduce myself in English" is. If a
  learner reaches for the blocked thing, do not correct them and do not endorse it: ask what the first
  step towards it would be that is theirs to take, and let the goal be that step.

  ### Teach judgement on other people's goals first

  Learners cannot yet judge their own - nobody can, at the start. So the sequence is: learn the tests,
  judge examples that are not theirs, fix a weak one together, and only then turn the tests on their
  own rough goal. Skipping to their own goal is the commonest way this block fails.

  Use example goals close to your learners' real lives, not textbook ones. Include at least one that
  fails only ONE test - those are the useful ones, because a goal that fails all four teaches nothing.

  ## Before they leave this block

  - Every learner can say the four tests without the page in front of them.
  - They have judged at least four goals that are not their own, and said which test each one fails.
  - They have fixed a weak goal out loud, as a group.
  - They have run the tests on one rough goal of their own - the goal itself comes next session, so it
    does not have to be finished, only tested.
learnerTeaching:
  title: "How to tell a good goal from a weak one"
  readAloud: |
    ## How to tell a good goal from a weak one

    You are going to choose a goal of your own. Before you do, you need to be able to tell a good goal
    from a weak one - because a weak goal wastes weeks, and it makes you feel it was your fault.

    A good goal passes four tests.

    ### Test 1 - Is it small enough to reach?

    Small enough that you could finish it in the weeks we have.

    - "Learn English" - too big. That takes years.
    - "Say five true sentences about myself in English" - small enough.

    A big wish is not a bad thing. But a goal is a piece of it you can actually reach.

    ### Test 2 - Is it clear? Will you KNOW when it is done?

    You must be able to tell whether you have done it.

    - "Get better at reading" - how would you know? Better than what?
    - "Read the words on the signs near my shelter" - you will know. You either can or you cannot.

    Ask yourself: **how will I know I have done it?**

    ### Test 3 - Does it matter to ME?

    This is the most important one, and the easiest to get wrong.

    Do not choose the goal you think your facilitator wants to hear. "Study hard every day" sounds
    good and means nothing. Nobody is marking your goal.

    Ask yourself: **what would be different for me if I did this?** If you cannot answer, it is not
    your goal yet. Choose again.

    ### Test 4 - Is there a by-when?

    A goal with no time is always about to start. Say when: by the end of this course, in four weeks,
    by the time the rains come.

    ### One more thing: choose something YOU can decide

    Some things are decided by other people. Whether you get a place somewhere is not yours to decide.

    So make your goal the part that IS yours. Not "get into the school" - but "be able to introduce
    myself in English". You can do that one. Nobody has to say yes first.
  words:
    - term: goal
      meaning: something you decide you want to be able to do, and go after on purpose
    - term: by-when
      meaning: the time you say you will have done it by
    - term: reachable
      meaning: small enough that you really could finish it
  tryIt:
    intro: >-
      Read each goal. Does it pass all four tests, or does it fail one? Circle your answer, and see if
      you can say WHICH test it fails. Then check at the back of the book.
    chooseFrom: ["good goal", "fails a test"]
    items:
      - "I want to be better."
      - "By the end of this course, I want to be able to write my name and say three sentences about myself."
      - "I want to study hard every day and be a good student."
      - "I want to get a place at the secondary school next year."
    answers:
      - "Fails Test 2 - it is not clear. Better at what? How would you know? Ask: what would I be able to DO?"
      - "A good goal. It is small, it is clear (you can tell), and it has a by-when. Whether it passes Test 3 only YOU can say."
      - "Fails Test 3 - and probably Test 2. It sounds like the answer a teacher wants. What would actually be different for you? Answer that, and you will find your real goal."
      - "Fails the last rule - it is not yours to decide. Someone else decides who gets a place. Make your goal the part you CAN decide: what would you need to be able to do to be ready?"
    then: >-
      Now take one rough goal of your own and run all four tests on it. It does not have to pass yet -
      that is what next session is for.
worksheet:
  slug: cb-ail-good-goal-page
  note: "In the learner's book (My Learning Book): the 'Is my goal a good goal?' page. Print one per learner."
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  how: >-
    Being able to judge and sharpen a goal for themselves, rather than relying on someone else to tell
    them whether it is any good, is what lets a learner set sound goals long after the programme ends.
    That judgement keeps the direction of their own learning in their hands.
principlesForegrounded:
- lifeworthy-competencies
- recognise-communicate-growth
- builds-on-identities
principleAlignment:
- principle: lifeworthy-competencies
  how: >-
    Judging whether a goal is small, clear, meaningful and timed is a reusable thinking skill, not a
    one-off exercise; learners will apply this same lens to goals in study, work and life for years.
- principle: recognise-communicate-growth
  how: >-
    Learners practise naming precisely why a goal is weak and what would improve it, which gives them
    the words to talk about the quality of their own goals rather than a vague sense that one is good.
- principle: builds-on-identities
  how: >-
    The "it matters to you" test forces every goal to be checked against what the learner actually
    cares about, so a neat goal that means nothing to them is caught and rejected rather than pursued.
competencyCodes:
- FSL2
- FSL1
competencyDevelopment:
- code: FSL2
  how: >-
    Setting and pursuing goals depends on being able to set a sound one; practising the tests of a good
    goal and fixing weak examples builds the judgement that makes a learner's own goals clear and
    reachable rather than vague wishes.
- code: FSL1
  how: >-
    Applying the "small enough" and "matters to you" tests to their own goal requires learners to
    reflect honestly on what is within reach and what genuinely matters to them, which is direct
    practice in self-reflection.
