  status: own-expression
  holder: "UC Berkeley YPAR Hub; credited by the source to Youth in Focus (Youth REP: Step by Step) and Stanford's John W. Gardner Center (YELL)"
  basis: >-
    A guided walk with a non-seeing partner is a long-standing youth-work method with no single
    author. Every word here is written from scratch and none of the YPAR Hub's wording is reproduced.
  note: >-
    Do not restore the blindfold as the default if this page is edited. The substitution of closed
    eyes is a deliberate safeguarding decision, and the reasoning is on the page.
