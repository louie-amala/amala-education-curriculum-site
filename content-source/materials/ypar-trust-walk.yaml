provenanceNote: >-
  Rewritten from the YPAR Hub's "Trust Walk", supplied to Amala in August 2026. The source's variation,
  removing speech in a second round, is kept and promoted to a full step because it carries the main
  finding. The blindfold substitution, the safety-watcher role and the instruction-focused debrief are
  Amala's.
