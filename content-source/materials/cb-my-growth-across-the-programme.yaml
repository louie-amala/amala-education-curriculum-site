provenanceNote: >-
  Authored for the Learning Bridge+ (Cox's Bazar) edition. The five steps in each ladder are the
  learner-facing, first-person reading of Amala's five-level Proficiency Scale
  (framework/proficiency-scale.yaml), read for FSL2 and FSI1 respectively - the same ladder the educator
