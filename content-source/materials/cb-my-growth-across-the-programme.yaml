# Programme-level student worksheet (resource) for the Learning Bridge+ (Cox's Bazar) edition. The
# LEARNER's side of the two assessment points. The programme protects two windows - a supported
# judgement at Week 6 and a final one at Week 12 - but every artefact at those points was an educator
# record (the FSL2 and FSI1 assessment records). Component-level growth pages exist for one competency
# each (cb-ail-getting-better-at-goals for FSL2, cb-rp-how-i-have-grown for FSI1); nothing spanned both,
# and nothing was filled at the same two moments the educator makes their judgement.
#
# The learner's marks are NOT the grade. The educator's judgement is the grade; this page is evidence
# alongside the rest, and a conversation-starter at the Week-6 checkpoint.
#
# The five steps are the learner-facing reading of Amala's five-level Proficiency Scale
# (framework/proficiency-scale.yaml), phrased in the first person and without the level names - so a
# learner marks where they are without needing to read a rubric. Belongs to no single unit; its
# printable version compiles into the programme-wide student workbook (Part 4).
id: cb-my-growth-across-the-programme
