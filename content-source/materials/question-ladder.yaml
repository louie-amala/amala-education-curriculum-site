provenanceNote: >-
  Authored as a tool material because activities referred learners to "a question ladder" without one
  existing anywhere in the library. The rungs and stems here are written for Amala, drawing on the
  question-ladder idea common in design and research toolkits (including Nesta's Development Impact and
  You), with an original diagram. No third-party text or artwork is reproduced.
rights:
  status: own-expression
  basis: >-
    The question-ladder idea is a common technique with no single traceable author, and every word and
    the diagram here are Amala's own, so no third party's expression is reproduced.
