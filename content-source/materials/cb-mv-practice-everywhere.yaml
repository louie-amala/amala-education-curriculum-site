# Cross-programme practice resource for the Cox's Bazar edition of My Voice. Turns the rest of the
# Learning Bridge+ programme (Agency in Learning, Mentoring & Wellbeing, the Research Project) and daily
# camp life into English-practice opportunities, because acquisition depends on volume of use and class
# is a small part of the week. Grounded in beyond-the-classroom research (Reinders & Benson) and the
# spacing/retrieval evidence. Type resource: educatorContent (how the facilitator nudges) + learnerContent
# (the practice routine and the workbook page). Fully offline; literacy-free.
