title: "Practice everywhere - using the whole programme and daily life"
summary: >-
  How to grow English between lessons: weave practice into Agency in Learning, mentoring, and daily camp
  life through spoken missions, English buddies, and family practice - because English grows with how
  much it is used, not lesson hours alone.
facilitationContext:
- group
- independent
primaryContext: group
materialsAndPreparation:
- The "Practice everywhere" page and practice log in the student My Voice book (workbook), introduced in the first session and used all course long.
- A short, agreed English greeting the whole cohort uses to open every session, in My Voice and beyond.
- "Sensitivity: practising in public can expose a beginner; let learners choose who they practise with, and make practising with one trusted person, or a partner in the room, count fully."
facilitationNotes: |
  Class is a small part of a learner's week, and English grows with how much it is used, so this resource
  is about the other 95% of the time. The rule is little and often: short, spoken, social practice tied to
  daily routine beats one long block, and reporting it back next session doubles as retrieval. Your job is
  to keep nudging it - build the greeting into every part of the programme, set one small spoken mission
  each session, and open with a warm "who did you speak English with?" Never make it pressure; celebrate
  any attempt, however small.
educatorContent: |
  ## Why practice beyond the lesson matters most

  Learners will not reach even A1 on facilitated hours alone; acquisition depends on the volume of
  meaningful use, and the classroom is only one of many places learning happens (Reinders and Benson).
  For this cohort there is a twist: learners cannot be sent home with a worksheet they cannot read, and
  there is little English in the camp environment. So beyond-class practice has to be spoken, social,
  and tied to routine - and the richest, most reliable arena is the rest of the programme and the
  learner's own social network.

  ## Use the rest of the Learning Bridge+ programme

  The cohort is together across the whole programme, so make English live there too. Agree the moves with
  the other facilitators and the mentor:

  - Agency in Learning: open the session with the same English greeting; let learners say one English word or a short "I am ___" as they check in; celebrate it, then carry on in the language of the session. Goal-setting is a natural place to practise "I want ___".
  - Mentoring and Wellbeing: the one-to-one is the safest place of all to practise. Mentors can use the learner's current chunks - hello, how are you, my name is, I am from - and let the learner lead. No correction pressure; warmth first.
  - The Research Project (when it runs): naming things, simple questions, and "this is a ___" all recur; fold in the English the learner already has.
  - Everyday programme moments: registers, snack times, arrivals and goodbyes - attach a known English word or greeting to a thing that already happens every day, so it gets automatic spacing.

  ## Beyond the programme - the social network and daily routine

  - Spoken missions, not pages: "Today, greet three people in English." "Tonight, count your family in English." "Name five things in your shelter in English." Report back next session - the report-back is the retrieval.
  - English buddies: pair learners to practise one chunk together between sessions.
  - Family as practice partner: teach a chunk the learner can use at home (a greeting, numbers, food words) so a parent, sibling, or child becomes the practice partner.
  - Routine-embedding: attach English to greetings, meals, fetching water, the market - the same moment each day spaces the practice for free.

  ## How to run it

  - Introduce the Practice everywhere page in the workbook in session one: where can I use my English, and who with? Learners mark or draw their people and places.
  - Set one small, achievable spoken mission at the end of most sessions, matched to the language just learned.
  - Open most sessions with a warm, no-pressure "who did you speak English with, and what did you say?" - this is both encouragement and retrieval.
  - Keep it safe and by choice: some learners will only practise with one trusted person, and that counts fully.
learnerContent: |
  ## Practising your English every day

  Your English will grow fastest if you use it a little every day, in many places. You do not need to
  read or write to practise - you can practise by speaking.

  Use the Practice everywhere page in your My Voice book:

  - Where can I use my English, and who with? Mark or draw your people and places - your family, a
    neighbour, your mentor, your group, a friend, someone at home.
  - Each time you use your English, make a mark or a small drawing of who you spoke to. Bring it to show
    next time.

  Some ways to practise:

  - Say your English greeting to someone every day.
  - Teach one English word to someone at home, so you can practise it together.
  - Use your English in your other classes - say hello, or one thing about yourself, at the start of
    Agency in Learning and with your mentor.
  - Find an English buddy and say your words to each other.

  There is no wrong way and no wrong amount. Every time you try counts.
agencyContribution:
  indicators:
  - control-of-future-pathways
  - contribution-to-community
  how: >-
    Turning the whole programme and daily life into practice is what actually moves a learner toward
    usable English, the key to further study and dealing with the written and spoken world. And by
    greeting, teaching a word to family, and speaking with neighbours, the learner brings English into
    their community and helps build a place where it is normal to try.
principlesForegrounded:
- lifeworthy-competencies
- connect-to-futures
- builds-on-identities
- recognise-communicate-growth
principleAlignment:
- principle: lifeworthy-competencies
  how: >-
    The habit of using new language often, in real situations, is exactly how language sticks and grows -
    a learning strategy the learner reuses for every language and skill beyond this course.
- principle: connect-to-futures
  how: >-
    Practising across the programme and at home builds the volume of English needed to keep progressing
    toward the level required for further study, rather than plateauing on lesson hours alone.
- principle: builds-on-identities
  how: >-
    Practice starts from the learner's own people and places and their own greeting and words, so English
    grows outward from the life and relationships the learner already has.
- principle: recognise-communicate-growth
  how: >-
    The practice log and the warm "who did you speak English with?" check-in help learners notice and
    name their own use of English, making growth visible and building the habit of tracking it.
competencyCodes:
- FLC3
- FUS1
competencyDevelopment:
- code: FLC3
  how: >-
    Using greetings, chunks, and simple sentences with real people, often, is direct practice in
    communicating in English - the volume of meaningful use that turns taught language into fluent use.
- code: FUS1
  how: >-
    Choosing who and where to practise, and noticing one's own growing use of English, is self-aware,
    self-directed learning - the learner taking hold of how their English develops.
