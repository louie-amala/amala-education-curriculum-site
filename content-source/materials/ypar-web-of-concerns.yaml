  holder: "UC Berkeley YPAR Hub; credited by the source to Youth in Focus (Youth REP: Step by Step) and Stanford's John W. Gardner Center (YELL)"
  basis: >-
    A string web is a common youth-work method with no single traceable author. Every word here is
    written from scratch and none of the YPAR Hub's wording is reproduced.
  note: >-
    Amala's Peacebuilding bank also references a "web of connectedness" protocol held as
    linked-not-reproduced. Keep the two separate and do not import that protocol's wording here.
sourceRefs:
  - "YPAR Hub (UC Berkeley), Get Started > Team-Building > Getting to Know Each Other lesson plan (String)"
provenanceNote: >-
  Separated out from the YPAR Hub's "Getting to Know Each Other" lesson plan, supplied to Amala in
  August 2026. The source runs it as an introduction activity; here it is repositioned as the opening
  move of a research project, and the instruction to write the concerns down before untying the web,
  which is what makes it a beginning rather than a game, is Amala's.
