# Contextualised, fully offline adaptation of ail-reflecting-on-your-growth for Learning Bridge+ (Cox's Bazar).
# Oral and visual first, ~60 min facilitated.
id: cb-ail-reflecting-on-your-growth
slug: cb-ail-reflecting-on-your-growth
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "Looking at how far I have come"
summary: >-
  Learners look back through their workbook and their goal, show one clear way they have grown and one thing
  they have learned about themselves, and choose one thing to carry forward.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners look back alone through their own workbook, then show one piece of growth to a
    same-gender group. The sharing matters: saying "here is how I have grown" out loud, or holding up a drawing,
    makes it real and lets learners see progress in each other, so keep the share even if you shorten the
    looking-back. Use same-gender groups.
- context: one-to-one-mentoring
  how: >-
    A strong fit for an honest look back. A mentor helps a learner see progress they are brushing aside and name
    a realistic next step. This works especially well at the end of a goal cycle or of the programme, with the
    workbook open between them.
- context: independent
  how: >-
    Weakest fit, because learners alone tend to see only what they did not finish and there is no one to hold up
    the growth they discount. Give them the spoken prompts, ask them to turn through their actual workbook page
    by page, then show one piece of growth to a peer or the facilitator at the next session so it is witnessed.
duration: "About 2 hours in the unit plan (generous for this oral/visual, translated cohort - the step timings below are the active teaching core; the rest is warm check-in, drawing, and translation), plus a 20 min independent task done from the workbook"
grouping: "Individual looking-back, then same-gender pairs or small groups; works with 10-35 learners"
whatLearnersDo:
- Turn through your workbook and find your goal and the marks you have made.
- Look at how far you have come towards the goal you set.
- Name one thing you have learned about yourself as a learner.
- Choose one thing to carry forward or a next goal, and show one piece of growth.
materialsAndPreparation:
- The learner's workbook, goal page, and any drawings or work made over the period being looked back on.
- A short set of spoken reflection prompts you can say in the learners' own language.
- Coloured pencils and a facilitator pen, to draw the next step and scribe a few words when asked.
- "Sensitivity: some learners will feel they made little progress, or will have had a hard period through displacement or loss. Say clearly that an honest look back is not judging yourself, and that noticing one small step, or naming what got in the way, is real growth. No one must share, and a learner may only draw."
visuals:
- kind: example
  title: "How far I have come"
  caption: >-
    Turning back through the workbook from the first page, a learner sees the distance travelled and names
    one thing to carry forward.
  spec:
    type: zones
    flow: across
    flowLabel: "now"
    zones:
    - label: "When I started"
      tone: known
      cards:
      - "couldn't set a goal"
      - "goal: read one page"
    - label: "Now"
      tone: positive
      cards:
      - "reached my goal"
      - "I focus best in the morning"
      - "next: read a whole story"
facilitationNotes: |
  Looking back is where learning becomes visible and where the next goal comes from. The one thing to get right
  is that learners look at real evidence, their own workbook and goal page, not a vague feeling. Left to a
  feeling, learners either inflate or, far more often here, dismiss their progress. Your job is to help them see
  growth they are brushing aside and to be kind but honest about what did not happen and why. Because the room
  does not read, do it all by turning pages, pointing, and speaking, and keep the focus on learning, never on
  grading themselves.
steps:
- title: "Turn through your workbook"
  duration: "12-14 min"
  guidance: |
    Have learners lay open their workbook and turn through it: the goal on the first page, the marks and drawings
    they have made since. The point is to look back at something real, not a general memory. Give a quiet moment
    for each learner to find their first goal page and look at it again before they judge how far they have come.
    Walk round and help any learner who cannot find their goal.
  keyPrompts:
  - Turn to your goal page. What were you working towards when you started?
  - Turn through the marks you have made. Which one do you remember making?
  watchOuts:
  - A learner judges from memory and dismisses their progress; sit beside them and turn the pages with them, since the marks on the page are usually kinder and more accurate than the feeling.
  adaptation: |
    If a learner's workbook is thin or was missed for a while, they say aloud what they set out to do and what
    they have done since; the look back at the original goal is the part that matters most.
- title: "See how far you have come"
  duration: "16-18 min"
  guidance: |
    Work through spoken prompts against the workbook: which parts of the goal they have reached, where they made
    progress even if the goal is not finished, and what helped or got in the way. Say each prompt in the learners'
    own language and give time to point at the page in answer. Push gently against both inflation and dismissal. A
    goal half-reached, with real marks along the way, is progress worth naming aloud.
  keyPrompts:
  - Point to where you got closer to your goal, even if you have not finished it.
  - What helped you move forward, and what got in your way?
  - Was there a time your plan changed, or a step did not work? What did you do next?
  watchOuts:
  - A learner sees only what they did not finish; help them count the small steps and the things they learned along the way, which is where most of the growth actually sits, and name one of them aloud for them.
  adaptation: |
    Where looking back risks touching a hard period, let the learner choose a lower-stakes stretch of the book to
    talk about, and never require anyone to share the details aloud.
- title: "Name your growth and your next step"
  duration: "16-18 min"
  guidance: |
    Move from what happened to what it means. Ask each learner to name one clear way they have grown as a learner,
    and to choose one thing to carry forward: a habit that worked, the same goal continued, or a new goal. Have
    them draw the next step on a fresh workbook page, scribing a word or two if they ask. Then each learner shows
    one piece of growth to their same-gender group, so progress is witnessed and the room sees how much has moved.
  keyPrompts:
  - What is one way you have grown as a learner in this time? Say it or show me the page.
  - What is your next goal, or the one thing you will carry forward? Draw it, and I will help you mark it.
  watchOuts:
  - The look back ends without a forward step; make sure every learner leaves with one concrete thing drawn to carry forward, so reflection feeds the next cycle rather than closing a door.
  adaptation: |
    A learner who does not want to speak may hold up a drawing instead of saying anything, and that counts fully
    as sharing one piece of growth.
closing: |
  Ask several learners to show one piece of growth and one thing they will carry forward, by speaking or by
  holding up the page. Draw out how much the room has changed since the start. Say aloud that this look back, and
  the next goal it produced, go back into the workbook: growth is a cycle they now know how to run themselves.
  Independent task: before the next session, make one mark in your workbook about the next step you have chosen.

educatorContent: |
  ## What you need to know before you teach this

  This is where the whole component pays off, and it is the block most often rushed because it falls at
  the end when time is short. Protect it. A learner who did the work and cannot see that they did the
  work has not finished the course.

  ### Reflection must run on evidence, not on feeling

  Left to a feeling, learners in this cohort will under-report almost every time. Asked "have you
  grown?", many will say not much - because the goal is not fully reached, or because a hard week is
  freshest in the mind.

  So the mechanism is physical: turn back through the book, from page one, in order. The pages do the
  arguing. A learner looking at their own first drawing next to their tenth is confronted with evidence
  they cannot easily talk themselves out of.

  Do not let anyone reflect without the book open.

  ### The three questions that produce real answers

  Not "what did you learn?" - that gets a shrug or a platitude. Ask:

  1. **What can you do now that you could not do at the start?** Specific, and pointable-to.
  2. **What was hard, and what did you do about it?** This is the one that shows the competency, and
     it is the one you most want on record. The "what did you do about it" half is where a Practitioner
     shows themselves.
  3. **What do you still want to get better at?** This becomes the next goal, and it is the honest
     answer to a goal not fully reached.

  ### A goal not reached is not a failure - say it out loud

  Many learners will not have reached their goal. Say plainly, to the group, before anyone shares:
  reaching the goal was never the test. Setting one, taking real steps, and adapting when a step did
  not work is what this course was about, and it is what is being assessed.

  A learner who thinks they failed will under-report everything else too, and you will lose the
  evidence.

  ### Watch for the two reporting errors

  - **The learner who says nothing changed.** Turn the pages for them and ask about a specific one.
    "You could not do this in week two. Can you now?"
  - **The learner who says everything changed.** Ask for the evidence, kindly. "Show me the page."

  ### This is assessment evidence - take it down as they speak

  What learners say here, in their own words, is among your strongest FSL2 evidence, especially the
  rationale. Write it down the same day. Do not rely on recall in Week 12.

  ## Before they leave this block

  - Every learner has turned back through their own book from the first page.
  - Each can name one specific thing they can do now that they could not do at the start, and point to
    the page.
  - Each has said what was hard AND what they did about it.
  - Each has one thing they still want to get better at - the seed of the next goal.
  - You have their words written down.
learnerTeaching:
  title: "How to see how far you have come"
  readAloud: |
    ## How to see how far you have come

    You have been working for weeks. Now we look back - and this is not a small thing at the end. It is
    one of the most useful things you will do.

    ### Why we bother looking back

    Because if you cannot see that you changed, you will not believe you can change again. And then the
    next goal will feel pointless.

    ### Do not trust your feeling. Look at your book.

    If you just ask yourself "have I grown?", you will probably say not much. Everybody does. The hard
    week is the one you remember, and the goal you did not fully reach is the one on your mind.

    So do not ask your feeling. **Open your book at page one and turn through it, in order, slowly.**

    Look at your first drawing. Look at what you wrote or marked in the second week. Look at what you
    did last week.

    The pages will tell you the truth better than your feeling will.

    ### Three questions to answer

    Answer these out loud, or by drawing. Point at the page each time.

    1. **What can I do now that I could not do at the start?**
    2. **What was hard - and what did I DO about it?**
    3. **What do I still want to get better at?**

    The second one matters most. Anyone can have an easy week. What shows you have really learned
    something is what you did when it went wrong - when the step did not work, and you found a smaller
    one, or a different one, and kept going.

    ### If you did not reach your goal

    Read this carefully.

    **Reaching the goal was never the test.**

    What this course was about is: did you set a goal of your own, did you take real steps, and did you
    change your plan when something did not work. If you did those, you did this course - whether or not
    you got all the way there.

    A goal not reached is not a failure. It is usually just a goal that was slightly too big, which is
    something you now know how to fix.

    ### And the last question

    What do you want to work on next?

    You have the method now. It is yours, and you can use it on anything, for the rest of your life,
    without asking anyone's permission.
  words:
    - term: reflect
      meaning: to look back at what you did, and work out what changed
    - term: evidence
      meaning: the real marks in your book that show what you did
worksheet:
  slug: cb-ail-how-i-have-grown-page
  note: "In the learner's book (My Learning Book): the 'How I have grown' page. Print one per learner."
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  - control-of-future-pathways
  how: >-
    Seeing and naming their own growth, from the real marks in their own workbook, is how learners come to trust
    that they can direct their own learning. That belief, and the next goal it produces, is what lets a learner
    keep steering their own development long after the programme ends, even where reading and devices are out of
    reach.
principlesForegrounded:
- recognise-communicate-growth
- feedback-and-data
- connect-to-futures
principleAlignment:
- principle: recognise-communicate-growth
  how: >-
    The whole activity is learners recognising and then showing their own growth against the goal they set,
    whether by speaking or by holding up a page, which is the defining habit this component builds, made reachable
    here without any reading or writing.
- principle: feedback-and-data
  how: >-
    Learners look back against real evidence, the marks and drawings in their own workbook, rather than a feeling,
    and use what they find to choose the next goal, so a real record drives the next cycle of learning even when
    that record is pictures rather than words.
- principle: connect-to-futures
  how: >-
    The look back ends by choosing a next goal or a habit to carry forward, drawn onto a fresh page, connecting
    this period of learning to the future the learner is building rather than closing it off.
competencyCodes:
- FSL1
- FSL2
- FPS1
competencyDevelopment:
- code: FSL1
  how: >-
    Looking honestly at their own progress against the marks in their workbook, and naming how they have grown as
    a learner, is direct practice in self-reflection; the workbook, turned through page by page, is the evidence.
- code: FSL2
  how: >-
    Turning a look back into a next goal or a habit to carry forward, drawn onto a new page, is how learners keep
    setting and pursuing goals over time, closing the loop from progress back to a new objective.
- code: FPS1
  how: >-
    Recalling a time a plan changed or a step did not work, and naming what they did next, surfaces the adaptable
    thinking learners used to keep going when circumstances shifted, which in the camps is a constant reality.
