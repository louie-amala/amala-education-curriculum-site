competencyDevelopment:
- code: FSI1
  how: Drawing conclusions from the evidence is the culminating analytical work of the investigation.
- code: ATS1
  how: Moving from findings to insights is interpreting the analysed data — saying what it means.
- code: FPS3
  how: Asking what could be done and why surfaces the contributing factors behind the challenge, backed by evidence.
