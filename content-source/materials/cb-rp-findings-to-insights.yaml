# Contextualised, fully offline ANALYSIS activity for the Research Project component of Learning Bridge+
# (Cox's Bazar). The analytical heart: learners move from findings (what the evidence says) to insights
# (what it means and why it matters for the hills and the people who live on them, and what could be
# done), draft clear insight statements each backed by evidence, and separate evidence-backed claims
# from opinion. Evaluate evidence phase (objective 3). Oral and visual first; warm, hopeful tone.
id: cb-rp-findings-to-insights
slug: cb-rp-findings-to-insights
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "From findings to insights"
summary: >-
  The analytical heart of the course. Learners move from findings — what the evidence says — to insights
  — what it means and why it matters for the hills and the people who live on them, and what could be
  done. They draft a small number of clear insight statements, each one backed by evidence, and learn to
  tell an evidence-backed claim from an opinion.
facilitationContext:
- group
- independent
primaryContext: group
duration: "2 hours facilitated + 1 hour independent"
grouping: "Whole group to model, then small groups to draft; whole group to sharpen"
whatLearnersDo:
- Hear, with an example, the difference between a finding and an insight.
- Take a theme and ask what it means, why it matters, and what could be done about it.
- Draft a few clear insight statements, each one they can point to the evidence for.
- Sort each statement into "the evidence shows this" or "this is our opinion" — and keep them apart.
materialsAndPreparation:
- The "our themes" pages from the sorting activity, and the evidence log.
- The "our insights" sheet from the research book (one per learner or group).
- Two labels or spaces for sorting statements — "the evidence shows this" and "this is our opinion".
