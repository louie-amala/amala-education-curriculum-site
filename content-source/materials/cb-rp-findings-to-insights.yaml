agencyContribution:
  indicators:
  - contribution-to-community
  - power-over-wellbeing-and-self-direction
  how: >-
    Moving from what the evidence says to what it means and what could be done — and standing each claim
    on evidence — is how learners turn an investigation into understanding they can act on and share, so
    they can speak to a challenge in their community with something solid behind them.
principlesForegrounded: [feedback-and-data, responsible-action, authentic-challenges]
principleAlignment:
- principle: feedback-and-data
  how: Every insight must point back to the evidence, and claims that cannot are kept apart as opinion.
- principle: responsible-action
  how: Working out what the evidence means and what could be done — without overclaiming beyond it — is the honest basis for acting on the challenge.
- principle: authentic-challenges
  how: The insights are about the real hills the learners live on and the people whose homes they are, so what they mean genuinely matters.
