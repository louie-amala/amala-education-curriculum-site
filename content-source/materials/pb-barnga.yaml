  holder: Sivasailam Thiagarajan and Barbara Steinwachs; Intercultural Press / Nicholas Brealey (John Murray Press, Hachette)
  basis: >-
    Barnga is a commercial publication that remains in copyright. Nothing of it is reproduced here:
    this page describes what the simulation does, argues where it fits the course, and links to the
    publisher and to freely published adaptations. All wording is Amala's own.
