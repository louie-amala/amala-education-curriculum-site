provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, adaptations and
  delivery modes) from the Design Challenge activity guide, which supplied the purpose, the assigned
  reading resources and the breakout discussion questions. Written to generalise to any design
  challenge; the source project investigates the mental health and wellbeing of Afghan females. Linked
  to Social Entrepreneurship objective 2 (developing a solution concept).
