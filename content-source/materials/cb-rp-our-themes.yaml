title: "Our themes — what keeps coming up"
summary: >-
  A page to record the clusters the group made when sorting the evidence: each theme's name and the
  patterns inside it, so the analysis is kept for the step where we ask what it all means.
facilitationContext:
- group
- independent
primaryContext: independent
learnerContent: |
  ## Our themes — what keeps coming up

  After we sorted our cards into groups on the floor, use this page to keep the themes we found. Write or
  draw one theme at a time.

  For each theme, the sheet has room for:

  - The theme's name (a word or a drawing).
  - What keeps coming up in this group.
  - Where our sources and the people we asked agree or disagree.
  - One thing that seems to cause another (a contributing factor).

  Keep this page in your research book. We carry these themes into the next step, where we ask what they
  mean for the hills and the people who live on them.
