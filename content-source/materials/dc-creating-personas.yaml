provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, adaptations and delivery
  modes) from the Design Challenge activity guide, which supplied the purpose and the breakout study
  questions. The evidence-not-stereotype focus is drawn out here as the material's core discipline.
  Written to generalise to any design challenge; the source project investigates the mental health and
  wellbeing of Afghan females. Linked to Research Project objective 3 (evaluating evidence into
  actionable insight) and Social Entrepreneurship objective 1 (understanding a social challenge).
