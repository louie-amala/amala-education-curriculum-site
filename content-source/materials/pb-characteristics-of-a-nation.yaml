id: pb-characteristics-of-a-nation
slug: pb-characteristics-of-a-nation
access: public
type: activity
title: "Seven characteristics of a nation"
summary: >-
  Groups define what makes their nation their nation, then each learner scores themselves against
  every nation's list, including their own.
facilitationContext: [group]
primaryContext: group
deliveryAdaptations:
  - context: group
    how: >-
      Group-only, and it works best with several nationalities in the room. With a single-nationality
      group, add other nations and assign them, though the scoring step loses some of its force.
duration: 60-75 minutes.
grouping: Small groups, one nation each, then individual scoring, then small groups again.
materialsAndPreparation:
  - Poster paper and pens, one sheet per nation.
  - A table for each learner with a row per nation and a column for the number of characteristics they match.
  - Read the sensitivity note in the facilitation notes before you list nationalities aloud.
  - Wall space if you run the sharing as a gallery walk, which is better for learners working in an additional language.
whatLearnersDo:
  - Help build a list of the nationalities in the room, adding others if there are fewer than four.
  - In groups, write the seven characteristics of one nation on poster paper.
  - Record the similarities and differences between nations as each group presents.
  - Score themselves out of seven against every nation's list, including their own.
  - Discuss what the scores say about how valid national characteristics are.
facilitationNotes: >-
  Nationality is contested, and saying so out loud is part of running this well. Some nations are not
  recognised by every state: Taiwan is not recognised by China, and many people in Catalonia consider
  it a nation while the Spanish government does not. A nation that does not officially exist still
  exists in the experience of the people who belong to it. Say that before the list is written, and
  where you can, put people from a nation in charge of describing their own. The finding the activity
  produces is that learners often score poorly against their own nation's seven characteristics,
  which is where national stereotype starts to come apart.
steps:
  - title: "Build the list of nations"
    duration: 10 minutes
    guidance: >-
      In discussion with the group, list the nationalities in the room. If there are fewer than four,
      add more until there are. Handle the contested cases as they arise, using the examples above,
      and be led by how people describe themselves rather than by what a map says.
    keyPrompts:
      - "What nations are in this room?"
    watchOuts:
      - "A learner's nation is disputed by another learner. Do not adjudicate. Say that recognition is
        contested and that belonging is real regardless, and move on."
      - "A learner does not want their nationality listed. Do not list it, and do not ask why."
  - title: "Write the seven characteristics"
    duration: 15 minutes
    guidance: >-
      One nation per group, seven characteristics on poster paper. Try to have people from a nation
      describe their own, though it is not essential. Keep it to seven: the constraint forces choices
      and the choices are what get argued about later.
    keyPrompts:
      - "What makes your nation your nation? Only seven."
    watchOuts:
      - "Groups describing a nation they do not belong to write stereotypes. That is useful material,
        but flag it in the discussion rather than letting it pass as description."
  - title: "Share, and record similarities and differences"
    duration: 15 minutes
    guidance: >-
      Ninety seconds per group, or a gallery walk of about ten minutes, which supports learners
      working in an additional language. Everyone completes a two-column table of similarities and
      differences between nations as they go. Then discuss in small groups: which was easier to find,
      and what does that mean for the word nation?
    keyPrompts:
      - "Was it easier to find similarities or differences?"
      - "What does that do to the word nation?"
    watchOuts:
      - "Groups record only differences because that is what they expected. Ask them to count the
        similarities they have written."
    adaptation: >-
      Gallery walk rather than presentations if the group includes learners working in an additional
      language, or if you have more than five nations.
  - title: "Score yourself against every nation"
    duration: 10 minutes
    guidance: >-
      Each learner walks the posters again and scores themselves out of seven against every nation's
      characteristics, including their own. This is the step the activity is built around, and it is
      quiet and quick. Do not comment while they do it.
    keyPrompts:
      - "How many of your own nation's seven do you actually match?"
    watchOuts:
      - "A learner scores low against their own nation and is unsettled by it. That is the finding,
        and it is worth handling gently: it says something about the list, not about them."
  - title: "Discuss what the scores mean"
    duration: 15 minutes
    guidance: >-
      Small groups share their findings. How important and valid do these national characteristics
      seem? What does that mean for how important nationality is to identity? Then the peacebuilding
      questions: how does nationality as identity lead to othering, how do assumptions about other
      nationalities become prejudice and discrimination, and how might the idea of nations lead to
      conflict at personal, interpersonal and systemic levels?
    keyPrompts:
      - "How valid do these characteristics look now?"
      - "How might the idea of nations lead to conflict at each level: you, you and me, whole communities?"
    watchOuts:
      - "The discussion becomes an argument that nations are meaningless. They are not; they organise
        rights, movement and belonging. The finding is narrower: the characteristics attached to them
        fit individuals badly."
closing: >-
  Note what the scoring showed without labouring it. Groups produce seven confident characteristics
  of a nation, and then individuals from that nation match three or four of them. The description was
  real and the people it described do not fit it, which is what a stereotype is. Point forward: the
  same move is about to be examined where the group being described is one the learners are outside
  of.
learnerContent: |
  We are going to list the nations in this room. Some nations are recognised by every government and
  some are not. That does not decide whether they exist for the people who belong to them.

  **In your group:** write the **seven characteristics** of your nation on poster paper. Only seven.

  As other groups present, fill in this table:

  | Similarities between nations | Differences between nations |
  |---|---|

  Discuss:

  - Was it easier to find similarities or differences?
  - What does that mean for what we mean by the word nation?

  **Now score yourself.** Walk the posters. For each nation, including your own, how many of the
  seven characteristics do you match, out of seven?

  | Nation | Number of characteristics I match |
  |---|---|

  Then:

  - How important and valid do these national characteristics seem now?
  - What does that say about how important nationality is to your identity?
  - When nationality is a big part of our identity, how might that lead to **othering** other nationalities?
  - How do assumptions about other nationalities become prejudice, stereotyping or discrimination?
  - **How might the idea of nations lead to conflict** at a personal level, between people, and across whole communities?
agencyContribution:
  indicators: [power-over-wellbeing-and-self-direction]
  how: >-
    A learner who has just discovered that they match three of their own nation's seven defining
    characteristics has direct evidence that a national label describes them loosely at best. That
    makes the label something they hold rather than something that holds them.
principlesForegrounded: [builds-on-identities, safe-spaces, authentic-challenges]
principleAlignment:
  - principle: builds-on-identities
    how: >-
      Learners describe their own nations in their own terms, and contested nationalities are treated
      as real rather than corrected against a map.
  - principle: safe-spaces
    how: >-
      Nationality is contested in most Amala classrooms. Learners may decline to have theirs listed,
      and disputes about recognition are named rather than adjudicated.
  - principle: authentic-challenges
    how: >-
      The national identities examined are the ones in the room, several of them attached to ongoing
      conflicts, rather than neutral examples.
competencyCodes: [FUS3, AUS1, FUS1]
competencyDevelopment:
  - code: FUS3
    how: >-
      Groups articulate what defines a culture and then test that definition against individuals from
      it, which is a sharper exercise than describing a culture from outside.
  - code: AUS1
    how: >-
      The scoring step is a direct demonstration of how badly a group generalisation fits the
      individuals it claims to describe.
  - code: FUS1
    how: >-
      Learners find out how much of their own national identity they actually carry, which is
      frequently not what they assumed.
objectiveIds: [peacebuilding--o1]
