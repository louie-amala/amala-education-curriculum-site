learnerContent: |
  ## Our questions to ask

  This is where you keep the questions your group designed. They are grouped under our three
  sub-questions, so each question helps answer one of them:

  - What were our hills like before, and what are they like now?
  - What happens to a bare hill when it rains, and in the hot sun?
  - What do trees, grass, and roots do for the soil and for us?

  For each question, the sheet has room to:

  - Write or draw the question in your own words.
  - Mark whether it is an interview question (asked of one person) or a short survey question (asked of many).
  - Note how a person can answer if they cannot write — with a mark, a face, or a picture.

  Keep this page in your research book and take it with you when you go to ask. Start every time by
  asking permission first.
