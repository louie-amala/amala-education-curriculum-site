learnerContent: |
  ## Our questions to ask

  These pages hold everything you need to ask your community well.

  The first page teaches you how to ask a good question - the four kinds of question, how to fix a
  leading one, how to follow up an answer, and how a survey is different from an interview. Read it
  again any time, even after our session. It stays in your book.

  Then come your own pages:

  - **Our questions.** Your questions are grouped under our four sub-questions, so each one helps answer
    one of them. For each question there is room to write or draw it, to note the follow-up you will say
    afterwards, and to tick the four checks: is it open, is it about one thing, is it short, is it safe.
  - **Our short survey.** One or two questions you will ask many people, with the tally box and the three
    faces already drawn, so you can record answers with a mark instead of writing.
  - **Who we will ask.** Five different kinds of people, and what each one might know that the others do
    not.
  - **We tried it, and we fixed it.** After you try a question on your partner, note what was confusing
    and write your better question underneath.

  Keep these pages in your research book and take them with you when you go to ask. Start every time by
  asking permission first, and never write anyone's name.
