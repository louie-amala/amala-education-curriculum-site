rights:
  status: own-expression
  holder: "UC Berkeley YPAR Hub; credited by the source to San Francisco Peer Resources"
  basis: >-
    Preparing a group for an introductory meeting is a method rather than an expression. Every word here
    is written from scratch; the source's tips list and sample agenda are not reproduced.
  note: >-
    Do not import the source's conduct tips as universal advice. The page deliberately builds that list
    with the group, and opens the code-switching question rather than answering it.
sourceRefs:
  - "YPAR Hub (UC Berkeley), Get Started > Community Support > Engaging Your School Principal lesson plan"
  - "Credited in that plan to San Francisco Peer Resources"
provenanceNote: >-
  Rewritten from the YPAR Hub's "Engaging Your School Principal", supplied to Amala in August 2026. The
  core judgements are the source's and are good: identify the person by asking who would hear the
  complaints and who could broadcast the success, make the first meeting an introduction rather than a
  request, and rehearse it. The role is generalised from a United States school principal to whoever
  holds that position in the setting, the conduct list is built with the group rather than supplied, and
  the requirement to agree the next contact before dispersing is Amala's.
