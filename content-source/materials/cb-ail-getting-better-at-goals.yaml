# Contextualised, fully offline competency-development resource for Learning Bridge+ (Cox's Bazar):
# a plain-language, oral/visual rendering of Amala's proficiency scale for the component's anchor
# competency FSL2 (Set and pursue goals), so learners understand the competency and can see their own
# growth in it. Used at the start (place yourself) and revisited at the end (see how you have moved).
# NOT the assessment (educators judge against the proficiency scale); a resource for development.
id: cb-ail-getting-better-at-goals
slug: cb-ail-getting-better-at-goals
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "Getting better at setting and pursuing goals"
summary: >-
  Learners meet the main thing this course helps them grow, see how people get better at it step by
  step, mark where they are now, and look again at the end to see how they have moved.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. The whole group meets the growth path together as simple steps, then each learner
    marks where they are now on their own sheet. Hearing that people are at different steps, and that
    there is no failing, is what makes it safe to be honest, so keep the shared framing.
- context: one-to-one-mentoring
  how: >-
    A strong fit. A mentor helps a learner place themselves honestly and name a real next step, and
    returns to the growth path over time, which is exactly the gentle, personal tracking that makes the
    growth visible to the learner.
- context: independent
  how: >-
    Workable: the growth-path sheet carries the steps. A learner alone tends to place themselves high
    to look good, so ask them to think of a real example for the step they choose, and to check it with
    a mentor.
duration: "About 30 minutes in the unit plan (a short development check, not a test)"
grouping: "Whole group, then individual marking; works with 10-35 learners"
whatLearnersDo:
- "Meet the main thing this course helps you get better at: setting your own goals and taking steps to reach them."
- See how people grow at it, step by step, from saying how, to doing it, to keeping getting better.
- Mark where you are now, honestly, and name one next step.
- Look again at the end of the course, to see how you have moved.
materialsAndPreparation:
- The growth-path sheet (in the provided downloads) and the student workbook page for it.
- Your own honest example of a next step in setting and pursuing your own goals, to model that no one is finished growing.
- "Sensitivity: placing yourself on a path can feel exposing. Make clear it is not a test, there is no failing, and a learner at the start is not behind, only beginning."
visuals:
- kind: setup
  title: "The path of getting better at goals"
  caption: >-
    Not a test - a path everyone moves along. Learners find where they are now and name their next step.
  spec:
    type: zones
    zones:
    - label: "The path →"
      tone: neutral
      cards:
      - "can say how a goal works"
      - "set a goal & took steps"
      - "reached a goal, know what helped"
      - "reach goals again and again"
facilitationNotes: |
  This is a map of how people grow at setting and pursuing their own goals, the competency this whole
  course builds. The one thing to get right is that it is not a test and there is no failing: a learner
  low on the path is just starting, and everyone can move. Place yourself honestly, aim for your next
  step, and celebrate movement at the end. It is a resource to help learners see and own their growth,
  not a mark you give them.
steps:
- title: "The thing we get better at here"
  duration: "10 min"
  guidance: |
    Say it plainly: the main thing this course helps you get better at is setting your own learning
    goals and taking real steps to reach them. Everything else, understanding yourself, planning,
    tracking, is part of getting better at this. Keep it short and warm; you are naming the one skill
    the whole course grows.
  keyPrompts:
  - What does it mean to set a goal and take steps towards it?
  - Why is getting better at this worth your time?
  watchOuts:
  - Learners hear "getting better at it" as a test they might fail; reassure them this is about growth over time, and that everyone starts somewhere.
  adaptation: |
    Nothing is needed but your spoken words; no board or slides.
- title: "How people grow at it"
  duration: "10 min"
  guidance: |
    Show the growth path as simple steps, said aloud with the sheet: first you can say how you would
    set a goal and take steps; then you have set a goal and taken real steps, and can say why; then you
    reached a goal and can say what helped and what you would do better; then you have reached goals
    more than once and keep improving how you do it. Explain each plainly.
  keyPrompts:
  - Which of these steps sounds most like you right now?
  - What is the difference between saying how you would do it, and having really done it?
  watchOuts:
  - A learner feels bad being near the start; make clear the start is a normal place to be and that the whole point of the course is to help everyone move up.
  adaptation: |
    Draw the steps as a simple ladder on paper or the ground, and say each one; no writing is needed.
- title: "Where am I now, and my next step"
  duration: "10 min"
  guidance: |
    Ask each learner to mark, honestly, where they are now on the growth-path sheet or workbook page,
    and to name one next step that would move them up. Say clearly that you will look at this again at
    the end of the course, to see how they have moved. Honesty now is what makes the growth visible later.
  keyPrompts:
  - Where are you now, honestly, and what is one thing that would move you to the next step?
  - What would you like to be able to say about your goals by the end of this course?
  watchOuts:
  - Learners place themselves high to look good; reassure them that an honest start is what lets them see real growth, and that there is no reward for a higher mark.
closing: |
  Confirm the growth path lives in the learning book, and that the class will look at it again at the
  end of the course to see how far each learner has moved. Remind them there is no failing here: the
  only thing that matters is taking your next step. Revisit: in the final phase, learners look at the
  path again, mark where they are now, and celebrate the movement.

educatorContent: |
  ## What you need to know before you teach this

  This is a map, not a test, and everything depends on learners believing that. It is run twice - here
  at the start and again in the final phase - and the whole value is in the distance between the two
  marks.

  ### Why show learners the ladder at all

  Because a learner who cannot see what getting better looks like has no way to notice that they have.
  In this cohort that matters more than usual: schooling has been interrupted so often that many
  learners have no experience of tracking their own progress at all, and will attribute any improvement
  to luck or to a kind facilitator.

  ### It is the same ladder you assess against

  The five steps are the learner-facing reading of Amala's proficiency scale for FSL2, in the first
  person and with the level names removed. Do not show learners the level names, the GPA values, or
  where the readiness bar sits. They are for your record, not theirs - a learner who knows which rung
  counts will mark that one.

  ### Nobody starts high, and say so first

  Mark it yourself, out loud, honestly, before you ask anyone else to. A learner low on the path is at
  the beginning, which is exactly where a course like this expects them to be.

  Watch for the learner who marks themselves at the top on day one. That is usually not arrogance - it
  is either not understanding the ladder, or not trusting you enough to be honest. Either way, do not
  correct them. Note it, and let the final marking do the work.

  ### The mark is not evidence, the movement is

  A self-mark is not your judgement and should not feed it directly. What is useful is the GAP between
  their mark and yours at Week 6 - that gap is the conversation to have, and it usually shows you
  evidence you have not gathered.

  ## Before they leave this block

  - Every learner has marked one rung, honestly, in their own book.
  - They know it is not a test, and they know they will mark it again at the end.
  - They can say in their own words what the next rung up would look like for them.
learnerTeaching:
  title: "What getting better at this actually looks like"
  readAloud: |
    ## What getting better at this looks like

    This whole course is about one skill: **setting a goal for yourself and going after it.**

    Like any skill, you can be a beginner at it and get better. So before we start, it helps to see
    what getting better actually looks like - otherwise you would not notice it happening.

    ### The path

    Here is the path people take. Read it from the bottom.

    1. **I am not sure how to set a goal for myself, or what to do about it.**
    2. **I can say what goal I would set, and what steps I would take - but I have not done it yet.**
    3. **I set a goal of my own, and I took real steps towards it. I can say why I chose it.**
    4. **I reached a goal I set. I can say what helped, what did not, and what I would do differently.**
    5. **I have reached more than one goal, and I did the second one better because of the first.**

    ### Mark where you are now

    Mark the one that is most like you **today**. Not where you want to be. Today.

    Almost everybody is near the bottom at the start. That is not a bad thing - it is what the
    beginning of a course looks like. If you were already at the top, there would be nothing here for
    you.

    This is not a test. Nobody is marking it. Nobody will see it but you and your facilitator.

    ### You will mark it again

    At the end of the course you will come back to this page and mark it again, with a different mark
    so you can see both.

    That is the point of doing it now. Two marks show you the distance you moved - and that distance is
    yours, and nobody can take it off you.
  words:
    - term: skill
      meaning: something you can get better at by practising
    - term: path
      meaning: the steps people go through as they get better at something
