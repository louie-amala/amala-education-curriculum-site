provenanceNote: >-
  Authored as a learner-facing competency-development resource for the component's anchor competency
  FSL2 (Set and pursue goals), rendering Amala's own proficiency scale (Theorist to Expert) in plain,
  oral and visual language. It supports learners to understand and own their growth in the competency;
  it is not the assessment, which remains educator judgement against the proficiency scale. Used in the
  orientation phase (place yourself) and revisited in the celebrate phase (see how you have moved).
