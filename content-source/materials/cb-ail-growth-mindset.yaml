# Contextualised, fully offline adaptation of ail-growth-mindset for Learning Bridge+ (Cox's Bazar).
# Oral and visual first, ~60 min facilitated, no reading or devices assumed.
id: cb-ail-growth-mindset
slug: cb-ail-growth-mindset
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "You can grow"
summary: >-
  Learners find their own proof that ability grows with effort, a new approach, and help, by
  remembering a time they got better at something hard, so they can believe a goal is worth setting.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners recall a personal example alone, then hear how others grew at something
    hard. Hearing a peer describe struggling and then improving is what makes "ability can grow"
    believable rather than a slogan, so keep the sharing even if you shorten the opening. Use
    same-gender pairs.
- context: one-to-one-mentoring
  how: >-
    A strong fit for an honest talk. A mentor can gently surface where a learner has written
    themselves off and walk back through a real example of them getting better at something, which is
    more persuasive one to one than in a group.
- context: independent
  how: >-
    Weaker alone, because the learner misses hearing others describe their struggles, which is what
    normalises difficulty. If it must be independent, the workbook page carries the drawing and the
    "not yet" step, and the learner tells one person at home about a time they got better at something.
duration: "About 2 hours in the unit plan (generous for this oral/visual, translated cohort, the step timings below are the active teaching core; the rest is warm check-in, drawing, and translation), plus a 30 min independent task at home"
grouping: "Individual reflection, then same-gender pairs or small groups; works with 10-35 learners"
whatLearnersDo:
- See the difference between "I cannot do this" and "I cannot do this yet".
- Remember and draw a time you got better at something that was hard at first.
- "Say what helped you improve: your effort, a different way, or help from someone."
- Change one "I cannot" into "I cannot yet", and choose one small step to try.
materialsAndPreparation:
- Your own true example of something you were once bad at and then got better at, to tell first.
- The word "yet" ready to show on paper, a board, or the ground, or simply said aloud.
- The student workbook (page for drawing a growth example and a "not yet" step).
- "Sensitivity: a hard learning memory can touch on displacement, loss, or family. Let learners choose an easy, everyday example, and make clear no one has to say theirs aloud."
visuals:
- kind: setup
  title: "‘I cannot’ becomes ‘I cannot yet’"
  caption: >-
    The whole hinge is one word. A ‘cannot’ is a closed door; ‘cannot yet’ is a door you have not opened
    yet.
  spec:
    type: zones
    flow: across
    flowLabel: "yet"
    zones:
    - label: "I cannot…"
      tone: warn
      cards:
      - "I cannot read this"
      - "I can't do maths"
    - label: "I cannot… yet"
      tone: positive
      cards:
      - "I cannot read this yet"
      - "not yet, but I can start"
- kind: example
  title: "One ‘cannot’, turned into a step"
  caption: >-
    Each learner changes one of their own ‘cannot’s into ‘cannot yet’, and names one small step toward it.
  spec:
    type: zones
    flow: across
    flowLabel: "step"
    zones:
    - label: "I cannot read this… yet"
      tone: warn
      cards:
      - "the door I want to open"
    - label: "My first step"
      tone: positive
      cards:
      - "ask my sister to help"
      - "learn 5 letters this week"
facilitationNotes: |
  This activity underpins the whole component: a learner who believes ability is fixed will not set a
  goal to grow. The one thing to get right is that the shift comes from the learner's own real example
  of improving, not from being told to think positively. A growth mindset is not pretending everything
  is easy; it is treating difficulty as information about what to try next. Watch your own words too,
  praising effort and a good approach rather than being "clever", since learners read how you talk
  about ability. Keep it honest: some things are genuinely hard, and that is the point. And some limits
  here are real and outside a learner's control, the camp, what is available, which is never their
  failing: this is about how they meet difficulty and what they can still grow, not a promise that
  effort alone overcomes everything.
steps:
- title: "Tell 'I cannot' from 'I cannot yet'"
  duration: "10-12 min"
  guidance: |
    Say two things aloud: "I am just not good at this" and "I cannot do this yet, but I can get better
    with practice and help." Draw out the difference: the first treats ability as a fixed fact, the
    second treats it as something that grows. Show or say the small word "yet". Keep it short and
    spoken; the point is a frame before learners look at themselves.
  keyPrompts:
  - What changes when you add the word "yet" to the end?
  - Where do ideas like "I am just bad at this" come from, and are they always true?
  watchOuts:
  - A growth mindset gets flattened into empty positivity; make clear it does not mean everything is easy, only that ability can grow with the right effort, approach and help.
  adaptation: |
    No board or slides are needed. Two spoken examples and the single word "yet", said aloud or drawn
    on the ground, carry this step.
- title: "Remember a time you grew"
  duration: "15-16 min"
  guidance: |
    Give learners quiet time to remember one thing they can do now that was genuinely hard at first,
    and to draw it on the workbook page. Circulate and ask rather than tell. Their own story is far
    more convincing than any example you could give, so the aim is for each learner to find their own
    proof that ability grows.
  keyPrompts:
  - What is something you can do now that felt impossible when you started?
  - What actually helped you get better at it?
  watchOuts:
  - A learner insists they have never improved at anything; start smaller, walking them to an everyday skill like a language, a game, cooking, or a task at home, since everyone has grown at something.
  adaptation: |
    No writing is needed: learners draw the memory, or simply hold it in mind to tell a partner in the
    next step.
- title: "Say what helped you improve"
  duration: "14 min"
  guidance: |
    In same-gender pairs, learners show their drawing and, together, name what made the improvement
    happen: effort, a change of approach, help from someone, or practice. Gather a few of these aloud
    for the whole group. The point is that growth is not luck or fixed talent but things a learner can
    choose to do again.
  keyPrompts:
  - Across your stories, what keeps coming up as the thing that helped?
  - Which of those could you choose to do on purpose next time something is hard?
  watchOuts:
  - The group credits improvement to natural talent, which quietly rebuilds the fixed belief; steer them back to the effort, approaches and help they named, since those are what they can repeat.
- title: "Change one 'cannot' into 'cannot yet'"
  duration: "14 min"
  guidance: |
    Ask each learner to name one thing they currently believe they cannot do, and to mark it on the
    workbook as a "not yet", then choose one small step: a different way to try, or one person to ask.
    Close by having a few learners say their "not yet" and their step aloud, so the shift is witnessed
    and made real.
  keyPrompts:
  - What is one thing you have decided you cannot do?
  - What is one small step, or one person to ask, that would move you forward on it?
  watchOuts:
  - A reframe stays a slogan with no action behind it; make sure each learner leaves with one small, concrete step, so the new belief is backed by something they will actually do.
closing: |
  Ask two or three learners to share their "not yet" and their first step. Draw out that believing
  ability can grow is the ground everything else stands on: there is no point setting a goal to improve
  if you secretly think you cannot. The "not yet" and the step stay in the workbook, to be proved wrong
  over the weeks ahead. Independent task: tell one person at home about a time you got better at
  something that was hard, and what helped.

educatorContent: |
  ## What you need to know before you teach this

  This block underpins the whole component. A learner who believes ability is fixed will not set a goal
  to grow. There would be no point. But it is also the block most easily taught badly, and taught
  badly in this context it does real harm.

  ### What a growth mindset actually is

  The belief that ability changes with **effort, a different approach, and help from others**. Three
  ingredients, and the middle one is the one people drop.

  "Try harder" is not a growth mindset. A learner who tries the same failed method more times just
  collects more evidence that they cannot do it. The move is: effort, AND something different, AND
  someone to help. Say all three every time.

  ### What it is not, and this matters more than the definition

  It is **not** positive thinking, and it is **not** the claim that anyone can achieve anything if they
  believe hard enough. Be careful here, because the popular version of this idea is much stronger than
  the evidence behind it. Studies find real but modest effects, mostly for learners who were
  struggling, and mostly when the teaching changed too, not from telling people to believe.

  So teach it as what it is: a way of reading difficulty. Difficulty means this is new and I need
  another approach, not difficulty means I am not the kind of person who can.

  ### The harm to avoid, which is specific to this cohort

  Taught carelessly, "you can do anything if you believe" tells a young person whose education was
  destroyed by displacement that their situation is a failure of attitude. It is not. They did not
  fail to try hard enough, a war and a border did that.

  So draw the line explicitly, and say it out loud in the session: **some things are hard because they
  are hard, and some things were taken from you. Neither is a mindset problem.** What a growth mindset
  is for is the part that IS in your hands, what you can get better at, starting now.

  A learner who hears you make that distinction will trust the rest of it. A learner who hears
  unqualified optimism will correctly conclude you do not understand their life.

  ### The proof has to be theirs

  Nobody adopts this because they were told. The mechanism of the block is that each learner produces
  their OWN evidence: a real memory of being unable to do something and then being able to. Everyone
  has one, walking, a language, cooking, carrying water, minding a younger child, a trade.

  Your job is to make them notice what made the difference. Push past "I just practised" to the
  specifics: who showed you, what you changed, how long it took, what it felt like at the start. That
  detail is the proof. Then name it: that is exactly what will happen with the goal you are about to
  set.

  ### Watch your own words all course

  This block is undone in five seconds by praise of the wrong kind. Praise the process, not the person.

  - "You worked that out" · "you kept going when it was hard" · "you tried it a different way", good.
  - "You are clever" · "you are a natural" · "you are good at this", teaches that ability is a fixed
    thing you either have or do not, and makes a learner afraid to try something they might be bad at.

  The same applies to how you talk about yourself in front of them.

  ### "Not yet" is the one phrase to make stick

  Adding one word to "I cannot read this" changes it from a fact about who you are into a statement
  about where you have got to. Use it yourself, every session, for the whole course. Including about
  yourself.

  ## Before they leave this block

  - Every learner has told someone a real story of getting better at something hard, with the detail of
    what helped.
  - They can name the three ingredients: keep going, try a different way, get help.
  - They have turned one of their own "I cannot" statements into "I cannot YET".
  - They have heard you say that some things are not a mindset problem, and can say the difference.
learnerTeaching:
  title: "How people get better at things"
  readAloud: |
    ## How people get better at things

    Before you choose a goal, there is something you need to decide: **can you get better at things, or
    are you just the way you are?**

    This matters. If you believe you cannot change, there is no reason to set a goal at all.

    ### Two ways of thinking

    Listen to these two sentences. They are about the same person on the same day.

    - "I cannot read this."
    - "I cannot read this **yet**."

    One word. But the first one is about who you are. The second one is about where you have got to so
    far, and where you have got to always changes.

    ### You already have the proof

    You do not have to take anyone's word for this. You have your own proof.

    Think of something you can do now that you could not do before. Carrying water. Cooking. Minding a
    younger child. Speaking a second language. A trade. Walking.

    You were not born able to do it. You got better at it. That already happened to you, more than
    once.

    ### What actually makes people grow: three things

    Not one thing. Three, and you need all of them.

    1. **Keep going.** Not giving up the first time it is hard.
    2. **Try a DIFFERENT way.** This is the one people forget. If you do the same thing again and again
       and it does not work, doing it more times will not help. Change something.
    3. **Get help.** Ask someone who can already do it. This is not cheating and it is not weakness.
       Nobody learns anything alone.

    ### Hard does not mean you cannot

    When something feels hard, that feeling is not a message that you are the wrong kind of person.

    It is a message that this is **new**. That is all. Everything you can do now felt like that once.

    ### But some things are not about your mind, and we should say so

    Here is the honest part.

    Some things are hard because they are genuinely hard. And some things were taken from you, school
    that stopped, years you did not get, choices other people made about your life.

    **That is not your fault, and no amount of believing changes it.** Anyone who tells you that you
    just have to think differently about it is wrong.

    What this is for is the part that IS in your hands. Not everything is. But some of it is, and that
    part is worth going after.
  words:
    - term: yet
      meaning: the word that turns "I cannot" into "I have not got there so far"
    - term: effort
      meaning: keeping going when something is hard
    - term: approach
      meaning: the way you try to do something. You can change it
  tryIt:
    intro: >-
      Read each sentence. Is the person thinking "I can grow", or "I am stuck"? Or is it something else
      altogether? Circle your answer, then check at the back of the book.
    chooseFrom: ["I can grow", "I am stuck", "not about thinking"]
    items:
      - "I am just bad at numbers. I always have been."
      - "I could not do it that way, so tomorrow I am going to ask my neighbour to show me."
      - "I could not go to school for four years because we had to leave."
      - "This is too hard for me. I will try again for a long time, exactly the same way."
    answers:
      - "I am stuck. \"Always have been\" makes it a fact about the person. Try: \"I am not good at numbers YET, what could I try?\""
      - "I can grow. It has all three ingredients: they kept going, they are changing the way, and they are asking for help."
      - "Not about thinking. This is something that happened TO you. It is not a mindset problem and it is not your fault. What you can choose is what you do from here."
      - "I am stuck, even though it sounds like effort. Trying the same failed way for longer is not growing. The missing ingredient is a different approach, or someone to help."
    then: >-
      Now take one of your own "I cannot" sentences and add the word YET. Say it out loud. Then say
      what you would try differently, and who you could ask.
worksheet:
  slug: cb-ail-you-can-grow-page
  note: "In the learner's book (My Learning Book): the 'You can grow' page. Print one per learner."
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  how: >-
    Believing your abilities can grow is what makes self-direction possible: a learner who thinks
    ability is fixed has no reason to try, while one who sees difficulty as part of learning can take
    charge of their own growth. In a context where much is outside their control, this gives learners
    power over how they respond to struggle rather than being ruled by a verdict they have accepted.
principlesForegrounded:
- lifeworthy-competencies
- recognise-communicate-growth
- safe-spaces
principleAlignment:
- principle: lifeworthy-competencies
  how: >-
    A growth mindset is a habit learners will reuse across study, work and life: treating difficulty as
    information about what to try next, rather than proof of a fixed limit, is what lets a person keep
    learning long after this programme ends.
- principle: recognise-communicate-growth
  how: >-
    Learners recognise their own growth by drawing a real example of getting better at something hard,
    and communicate it to a partner, which both proves the idea to them and builds the habit of noticing
    and naming their own progress.
- principle: safe-spaces
  how: >-
    The activity asks learners to admit what they find hard and where they have written themselves off,
    so it depends on a space where struggle is normal and safe to name; the facilitator models this by
    telling their own honest example first, and no one is required to share.
competencyCodes:
- FSL1
- FPS1
competencyDevelopment:
- code: FSL1
  how: >-
    Examining their own beliefs about their ability, and reflecting on how they have grown at something
    hard, is direct practice in self-reflection; the drawn example and the "not yet" are the evidence a
    learner can look at their own thinking and revise it.
- code: FPS1
  how: >-
    Reframing a fixed belief as a "not yet" and treating a mistake as information about what to try next
    is adaptable thinking: learners practise changing their approach in response to difficulty rather
    than concluding they cannot do it.
