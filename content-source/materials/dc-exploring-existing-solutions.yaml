provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, adaptations and delivery
  modes) from the Design Challenge activity guide, which supplied the purpose, the guiding research
  questions and the report-back discussion questions. The source Design Challenge investigates the mental
  health and wellbeing of Afghan females and names Friendship Bench and Positive Psychology as example
  solutions; this material is written to generalise to any design challenge, with those as worked
  examples. Linked to Social Entrepreneurship objectives 1 and 2.
