# Contextualised, fully offline FRAMING activity for the Research Project component of Learning Bridge+
# (Cox's Bazar). Learners explore why the trees/hills matter to them and pool what they already know -
# the hills before, the clearing, the mud when it rains, the heat - as real evidence, and build a shared
# "what we already know / what we still need to find out" wall. Frame the challenge phase (objective 1).
# Oral and visual first; treats lived knowledge as evidence; warm, hopeful, safeguarding to hand.
id: cb-rp-what-we-already-know
slug: cb-rp-what-we-already-know
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "What we already know"
summary: >-
  Learners explore why the trees on our hills matter to them, and pool what they already know - the hills
  before, the clearing, the mud when it rains, the heat - treating their own knowledge as real evidence.
  Together they build a shared wall of what we already know and what we still need to find out.
facilitationContext:
- group
primaryContext: group
duration: "2 hours facilitated + 1 hour independent"
grouping: "Whole group for the wall; pairs for talking and drawing"
whatLearnersDo:
- Say, in words or drawings, why the trees and hills matter to them and their families.
- Pool what they already know about the hills - before, the clearing, the mud in the rain, the heat - as real evidence to start from.
- "Add their marks and drawings to a shared wall with two sides: what we already know, and what we still need to find out."
- Notice, gently, which things we truly know and which we only assume, and put the assumed things on the "find out" side.
materialsAndPreparation:
- "A big wall or floor space split into two sides: \"what we already know\" and \"what we still need to find out\", with a simple picture or symbol over each."
- Cards, paper, and pens or chalk for marks and drawings; no writing required.
- Step-back and referral guidance to hand, in case the talk touches a landslide or a lost shelter.
visuals:
- kind: setup
  title: "The wall, before you start"
  caption: >-
    One big space, split down the middle with a simple symbol over each side. It starts almost empty;
    learners fill it with marks and drawings. Nothing is written - a drawn card counts.
  spec:
    type: zones
    flow: across
    cardStyle: drawing
    zones:
    - label: "What we already know"
      sublabel: "our own memory, as evidence"
      tone: known
      cards:
      - "the hills, before"
      - "the mud when it rains"
    - label: "What we still need to find out"
      sublabel: "the things we only assume"
      tone: question
      cards: []
- kind: example
  title: "A wall in full flow"
  caption: >-
    Later in the activity: lived knowledge is up on the left as real evidence, and the things the group
    only assumed have moved across to the right. This wall stays up and grows all through the course.
  spec:
    type: zones
    flow: across
    cardStyle: drawing
    zones:
    - label: "What we already know"
      tone: known
      cards:
      - "hills were green before"
      - "trees cut for firewood"
      - "mud slides in heavy rain"
      - "bare slopes get very hot"
    - label: "What we still need to find out"
      tone: question
      cards:
      - "how many trees were lost?"
      - "which slopes are worst?"
      - "what grows back fastest?"
facilitationNotes: >-
  The one thing to get right: treat what learners already know as real evidence, not as chatter to get
  past. Their memory of the hills before, and of the mud and the heat, is data this investigation starts
  from. Draw it out warmly, then help the group sort it: some things we truly know, some we only assume -
  the assumed ones are not wrong, they simply go on the "find out" side. Keep the tone hopeful, and let no
  learner be singled out for what they do or do not know.
steps:
- title: "Why our trees and hills matter"
  duration: "30 min"
  guidance: >-
    In pairs, learners say or draw one reason the trees and hills matter to them and their families -
    shade, safety from the mud, somewhere green, wood, memory. Gather a few aloud. This roots the whole
    investigation in why it is worth doing, in the learners' own words.
  keyPrompts:
  - "Why do the trees and our hills matter to you?"
  - "What is good about a hill with trees on it?"
  visuals:
  - kind: setup
    title: "In pairs"
    caption: "Same-gender pairs talk and draw one reason; you move between them, gathering a few aloud."
    spec:
      type: groups
      facilitator: true
      clusters:
      - size: 2
        count: 8
        label: "same-gender pairs"
- title: "Pool what we already know"
  duration: "50 min"
  guidance: >-
    Draw out what the group already knows about the hills - how they looked before, how the trees were
    cleared, the mud when the heavy rain comes, the heat on the bare slopes. Each thing goes up on the
    "what we already know" side as a mark or drawing. Treat every offering as evidence worth having;
    do not correct or teach yet.
  keyPrompts:
  - "What were our hills like before? What changed?"
  - "What happens here when the heavy rain comes? In the hot sun?"
- title: "Know it, or only think it? Build the wall"
  duration: "40 min"
  guidance: >-
    Look together at the "what we already know" side. Gently ask of a few things: do we truly know this,
    or do we only think it? The things we only assume move across to "what we still need to find out" -
    without singling anyone out. This wall stays up and the cohort adds to it all through the course.
  keyPrompts:
  - "How do we know this is true?"
  - "What do we still need to go and find out?"
learnerContent: |
  ## What we already know

  Before we go and find things out, we start with what we already carry. We have lived on these hills.
  We remember how they looked before, how the trees came down, the mud when the heavy rain comes, and the
  heat on the bare ground. That memory is real evidence - it is where our research begins.

  We put what we know on one side of our wall: "what we already know". Then we ask an honest question of
  each thing: do we truly know it, or do we only think it? The things we only think, we move to the other
  side: "what we still need to find out". Both sides help us. And our wall keeps growing as we learn more.

  You do not have to speak about your own life if you would rather not. Marks and drawings count.

educatorContent: |
  ## What you need to know before you teach this

  Two things happen here, and the second is the one that matters. Learners pool what they already know -
  and then they learn to separate what they KNOW from what they only THINK.

  ### Their own knowledge is data, not warm-up

  Say this and mean it. These learners have watched these hills. Their memory of trees, of the mud when
  it rains, of the heat, is primary evidence about a real place over real time - the kind a visiting
  researcher would have to work hard to get.

  Treat it as the investigation's starting evidence, not as chatter to get through before the real work.
  A cohort that learns its own knowledge counts will gather far better later.

  ### Then the move: know it, or only think it?

  This is the intellectual content of the block. Take what has been pooled and sort it into two:

  - **We know it** - someone saw it, or many people say the same thing.
  - **We think it** - we have heard it, or it seems obvious, or everyone says so.

  "Everyone knows" is the phrase to listen for. It almost always marks a "we think it".

  The point is not to embarrass anyone. Nothing moves to "we think it" because it is wrong - it moves
  because we have not checked it yet. Say that out loud. The "we think it" column is where the research
  questions come from; it is the useful column, not the shameful one.

  ### Do it on the wall, and keep it up all course

  Two columns, in marks and drawings, that stay up for the whole component and get added to. When
  something moves from "we think it" to "we know it" because the cohort found evidence, move the card
  physically and say what happened. That moment is the whole method in miniature, and it is worth
  stopping the session for.

  ### Never single anyone out

  Sort the ideas, not the people. Once a claim is on the wall it belongs to the group, and whoever
  offered it should be able to see it moved without it being about them. Do not say "that was
  Rashid's". If a learner argues for something being "known", do not overrule - ask what would show us,
  and put that on the find-out side.

  ## Before they leave this block

  - A two-column wall in marks and drawings, with real content in both.
  - At least one thing has moved from "we know" to "we think" without anyone being embarrassed.
  - Learners can say why "everyone knows" is not the same as knowing.
  - The find-out column has something in it that the cohort actually wants to find out.
learnerTeaching:
  title: "How to tell what we KNOW from what we only THINK"
  readAloud: |
    ## What we know, and what we only think

    We are not starting from nothing. We live here. We have watched these hills. That counts, and it is
    where our research starts.

    But a researcher has to be careful about one thing: **not everything we believe is something we
    know.**

    ### Two piles

    Everything we say about our hills goes into one of two piles.

    **WE KNOW IT** - somebody saw it, or many people say the same thing.

    - "There were trees on that slope. My grandmother saw them."
    - "The path floods every monsoon. We all walk through it."

    **WE ONLY THINK IT** - we heard it, or it seems obvious, or everyone says so.

    - "The hills will all come down next year."
    - "Nobody cares about the trees."
    - "Everyone knows the planting does not work."

    ### Watch out for "everyone knows"

    When you hear yourself say "everyone knows", stop.

    That phrase almost always means nobody checked. It is one of the easiest ways to be wrong while
    feeling certain.

    ### Being in the THINK pile is not being wrong

    This is important, so read it twice.

    Something goes in the THINK pile because **we have not checked it yet** - not because it is false.
    Plenty of things in that pile will turn out to be true.

    In fact the THINK pile is the better one. It is where our questions come from. If everything we
    said was already known, there would be nothing to find out and no reason to do this.

    ### The best moment in the whole course

    Sometimes, weeks from now, we will find real evidence for something in the THINK pile - and we will
    move it across to KNOW.

    That is exactly what research is. Watch for it.

    ### Ask yourself, every time

    **How do I know that? Did I see it, or did I hear it?**
  words:
    - term: know
      meaning: something we saw, or that many people say the same way
    - term: assume
      meaning: to believe something without having checked it
    - term: check
      meaning: to go and find out whether something is really true
  tryIt:
    intro: >-
      Does each one go in "we KNOW it" or "we only THINK it"? Circle your answer, then check at the back
      of the book.
    chooseFrom: ["we know it", "we only think it"]
    items:
      - "The path by the water point floods every monsoon. We walk through it every year."
      - "Everyone knows the tree planting is a waste of money."
      - "My grandmother says there were big trees on that slope when she was young."
      - "The whole hill is going to come down next year."
    answers:
      - "We know it. Many of us have seen it, again and again. That is about as strong as evidence gets."
      - "We only think it. \"Everyone knows\" is the warning sign. Has anyone checked? That is a good thing to find out."
      - "We know it - she saw it herself. One person's memory is not proof of everything, but a person who was there is real evidence."
      - "We only think it. Nobody can see the future. Worth asking about; not something we know."
    then: >-
      Now add two of your own to our wall - one for each pile. Be honest about which pile yours goes in.
