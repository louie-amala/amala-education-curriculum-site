id: mentor-build-evidence-habit
slug: mentor-build-evidence-habit
access: public
type: educator-move
title: "Build the habit of capturing evidence"
summary: >-
  Growth is hard to reconstruct months later. Help mentees capture evidence of what they do as they
  go, so a portfolio builds itself.
tags:
  - id: recognising-growth
facilitationContext:
  - one-to-one-mentoring
primaryContext: one-to-one-mentoring
educatorContent: |
  Most learners, asked at the end of a term what they achieved, remember almost none of it. The move
  is to make capturing evidence a habit rather than an end-of-year scramble. Encourage mentees to
  collect as they go — a draft, a photo, a voice note, a short reflection, a piece of feedback — and
  to keep it somewhere simple that they control.

  Your job is to prompt and to lower the bar: a two-line note in the moment beats a perfect write-up
  that never happens. Help them see a portfolio not as a bureaucratic task but as their own growing
  record of what they can do — useful for showing a competency, applying for a pathway, or simply
  seeing how far they have come. Model it in your own practice: if you keep a light record of each
  mentee's progress, capturing evidence stops being something you ask of them and do not do yourself.
agencyContribution:
  indicators:
    - control-of-future-pathways
    - power-over-wellbeing-and-self-direction
  how: >-
    A learner who habitually captures what they do owns a record they can use to claim competencies
    and open pathways, rather than losing the evidence of their own growth.
principleAlignment:
  - principle: recognise-communicate-growth
    how: >-
      A running evidence habit is how a learner comes to recognise, hold and communicate their own
      growth over time.
  - principle: feedback-and-data
    how: >-
      Captured work and feedback become the data both mentor and learner reason from when judging
      progress.
competencyDevelopment:
  - code: FSL1
    how: >-
      Regularly capturing and reflecting on their work develops a learner's habit of self-reflection.
  - code: FSL3
    how: >-
      Keeping an ongoing record of learning supports the disposition of continuous learning.
relatedSlugs:
  - mentor-surface-skills-from-life
  - mentor-reflection-into-evidence
sourceRefs:
  - "AMALA Global Secondary Diploma (GSD) Educator Guide / Handbook — Student Mentor Playbook"
provenanceNote: >-
  Generalised from the Playbook's requirement that a mentor supports students in developing a
  portfolio of evidence drawn from assignments and personal life. Portfolio mechanics kept
  programme-agnostic (any store the learner controls).
