  August 2026. The source is a short plan built around a chart supplied only as an image, so the rungs
  here are written from Hart's published ladder rather than copied. The evidence rule (name a decision),
  the one-rung limit, the requirement to say which rungs are closed, and the re-placement date are
  Amala's.
