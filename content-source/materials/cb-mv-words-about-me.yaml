provenanceNote: >-
  Contextualised, fully offline adaptation of efi-mv-words-about-me and efi-mv-key-vocabulary-and-frames
  for the Learning Bridge+ (Cox's Bazar) edition. The sources teach identity vocabulary through reading and
  word cards for a literate cohort; this version is rebuilt for emergent literacy — the same words learned
  as picture-words and spoken aloud, never read, with home and family handled protectively and a lighter
  everyday focus always offered. It gathers the raw vocabulary for the spoken self-introductions to come,
  so it serves objective 1 and bridges toward objective 2 of the My Voice unit.
