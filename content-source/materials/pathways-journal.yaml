provenanceNote: >-
  Grounded in the learner-facing Pathways Journal workbook (Pathway Journal.pdf, as provided), which
  runs alongside the Pathways activities and holds ambitions, purpose, opportunity lists, CV and
  application documents and ongoing reflections. Framed here as a resource: what it is, how to keep
  it in use, and a localisation caveat on the sections that assume online documents. Linked to all
  five Pathways objectives as the place their outputs accumulate.
