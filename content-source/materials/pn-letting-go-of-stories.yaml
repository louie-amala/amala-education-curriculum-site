id: pn-letting-go-of-stories
slug: pn-letting-go-of-stories
access: public
type: activity
title: Letting go of stories
summary: >-
  Learners write about an internalised narrative they carry about themselves and want to release, share
  as much as they choose in a supportive circle, then physically let the paper go.
facilitationContext: [group]
primaryContext: group
deliveryAdaptations:
  - context: group
    how: >-
      As designed, and it needs the group's supportive witness for the release to mean something. But it
      only works once trust is well established and the facilitator can hold emotion in the room. Never
      run it with a group that is not ready, and always keep both the sharing and the writing optional.
duration: About 60 minutes.
grouping: Individual writing, then a whole-group circle.
whatLearnersDo:
  - Identify a narrative they have internalised about themselves that they would like to let go of.
  - Write it down privately, in whatever form feels right.
  - Share as much or as little as they choose in a supportive circle.
  - Physically release the paper (tearing it up, discarding it) as a symbolic act, with the group's support.
materialsAndPreparation:
  - Paper and pens, and a bin or box for the released papers.
  - A room where a quiet, contained emotional moment is possible without interruption.
  - Established group trust and clear agreements about confidentiality and the right to pass.
facilitationNotes: >-
  The one thing to get right: safety comes before the ritual. Run this only with a group that already
  trusts each other, once earlier work has surfaced how narratives get internalised. Both writing and
  sharing are fully optional; a learner can write nothing, or write and share nothing, and still take
  part in the release. Watch closely for distress, know where a learner can go if they need a moment or
  support, and do not treat this as therapy. It is a symbolic act of authorship, not a cure, and no one
  should feel exposed by it.
steps:
  - title: Set the frame and the agreements
    duration: 10 min
    guidance: >-
      Explain the activity plainly and set the agreements first: what is shared here stays here, anyone
      can pass at any point, and no one has to write or say anything. Name that some narratives are heavy
      and that stepping out is always fine. The safety frame is the activity; do not rush it.
    keyPrompts:
      - What do we each need to feel safe enough to take part today?
      - What does it mean to be a supportive witness for someone else here?
    watchOuts:
      - The frame is treated as a formality. Slow down; if the agreements are not real, the activity should not run.
  - title: Write privately
    duration: 15 min
    guidance: >-
      Learners write, only for themselves, about a story they carry about who they are that they would
      like to release. It might come from an earlier activity on internalised narratives. Make clear no
      one will read it unless they choose to share, and that writing a little, or nothing, is fine.
    keyPrompts:
      - What story about yourself do you carry that you did not choose and no longer want?
      - Where did that story come from, and whose voice is it really?
    watchOuts:
      - A learner is visibly overwhelmed by what surfaces. Quietly check in, offer a pause, and remind them they can stop.
  - title: Share by choice in the circle
    duration: 20 min
    guidance: >-
      In a circle, learners may share as much or as little as they wish; passing is a full and equal
      option. Receive each contribution with silence and respect, no fixing or advice. The point is to be
      witnessed, not counselled. Keep the pace unhurried and the room calm.
    keyPrompts:
      - Is there any part of this you would like the group to witness with you?
      - "(To the group) How do we hold what has just been shared, without rushing to respond?"
    watchOuts:
      - "Learners start advising or comparing. Gently restore the rule: we witness and hold, we do not fix."
  - title: Release and close
    duration: 15 min
    guidance: >-
      Learners who wish to physically let their paper go, tearing it, placing it in the bin, as a symbol
      of releasing the story's hold. Then close with something forward-looking and grounding, so the group
      does not leave sitting in the heaviness. Name that letting go is a practice, not a single moment.
    keyPrompts:
      - What is one thing you want to hold onto about yourself instead?
      - How do you want to feel as you leave this circle?
    watchOuts:
      - The session ends on the release and the heaviness. Always close with a grounding, forward step so learners leave steadier than they arrived.
closing: >-
  End with each learner naming one truer story they want to tell about themselves from here. This links
  the release back to the course's central work: reclaiming authorship of your own narrative.
learnerContent: |
  Some of the stories we carry about ourselves are not ones we chose. They were handed to us, and we
  came to believe them.

  Write, just for yourself, about a story about who you are that you would like to let go of. Where did
  it come from? Whose voice is it really?

  You share only what you want to, and you can pass at any time. If you wish, you can then let the paper
  go, tearing it, releasing it, as a way of loosening the story's hold. This is not about fixing anything
  today. It is a small act of taking your story back.
agencyContribution:
  indicators: [power-over-wellbeing-and-self-direction]
  how: >-
    Naming a story you were handed about yourself, and choosing to set it down, is authorship in its most
    direct form: deciding which narratives about you get to stay. Doing it witnessed but unpressured lets
    learners feel that they, not the story, hold the pen, which is the heart of power over one's own
    self-direction.
principlesForegrounded: [safe-spaces, recognise-communicate-growth]
principleAlignment:
  - principle: safe-spaces
    how: >-
      The whole activity is built as a safe space: firm agreements, everything optional, a facilitator
      holding the room, and a grounding close, because it touches learners' deepest sense of themselves.
  - principle: recognise-communicate-growth
    how: >-
      Choosing to release an old story and name a truer one is a visible act of personal growth that
      learners author and, if they wish, share with the group.
competencyCodes: [FUS1, FSL1]
competencyDevelopment:
  - code: FUS1
    how: >-
      Identifying a narrative you have internalised about yourself, and its source, is the deepest form of
      self-awareness the course asks for. What a learner chooses to name is the evidence.
  - code: FSL1
    how: >-
      Reflecting on a story you have carried and deciding to move beyond it is direct practice at
      recognising an area for growth and acting on it.
