id: cb-ail-you-can-grow-page
slug: cb-ail-you-can-grow-page
access: partner
edition: learning-bridge-coxs-bazar
type: resource
title: "You can grow"
summary: >-
  The learner's own proof that ability grows: a time they got better at something hard, what they got better at, and what helped.
facilitationContext:
- group
- independent
primaryContext: independent
learnerContent: |
  ## You can grow

  This page is yours. You can draw, write, or say your answer — someone will write it for you if you
  ask — and nobody marks it right or wrong.

  - Draw or write a time you got better at something that was hard at first.
  - Say what you got better at, and what helped you.
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  how: >-
    Keeping their own record of what they decided, and why, is what lets a learner carry a goal
    between sessions without an adult holding it for them.
