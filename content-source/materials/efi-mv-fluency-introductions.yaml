provenanceNote: >-
  Authored to fill the fluency-development gap identified when evaluating Unit 1 against Nation's Four
  Strands. Applies the 4/3/2 repeated-talk technique and flashcard/quick-fire fluency to the unit's own
  self-introduction language, using only items learners already know.
