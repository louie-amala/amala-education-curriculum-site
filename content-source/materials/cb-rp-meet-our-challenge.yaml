  - power-over-wellbeing-and-self-direction
  how: >-
    Learners begin an investigation into a real challenge in their own community, starting from what
    they already notice and care about — the first step in turning concern into understanding they can
    act on.
principlesForegrounded: [builds-on-identities, authentic-challenges, safe-spaces]
principleAlignment:
- principle: builds-on-identities
  how: The challenge starts from the hills the learners live on and what they already know and feel about them.
- principle: authentic-challenges
  how: This is a real, local challenge the whole community shares, not a hypothetical case.
- principle: safe-spaces
  how: No learner has to speak from their own life; the facilitator holds a warm, hopeful tone and has referral guidance to hand.
competencyCodes: [FSI1]
competencyDevelopment:
- code: FSI1
  how: Meeting and reacting to a real-world challenge is the orientation from which the whole investigation grows.
