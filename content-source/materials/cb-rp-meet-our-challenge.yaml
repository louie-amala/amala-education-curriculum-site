# Contextualised, fully offline ORIENTATION activity for the Research Project component of Learning
# Bridge+ (Cox's Bazar). Learners meet the shared challenge - the trees on the hills where they live -
# through a picture/story of the hills before and now, react to it, and hear what the course will do.
# Getting started phase. Oral and visual first; warm, hopeful tone; safeguarding to hand.
id: cb-rp-meet-our-challenge
slug: cb-rp-meet-our-challenge
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "Meet our challenge"
summary: >-
  Learners meet the one challenge the whole group will investigate - what is happening to the trees on
  the hills where we live - through a picture and story of the hills before and now. They say what they
  notice and wonder, and hear how the course will work.
facilitationContext:
- group
primaryContext: group
duration: "2 hours facilitated + 0.5 hour independent"
grouping: "Whole group, sitting together; pairs for talking"
whatLearnersDo:
- Look at a picture or hear a short story of the hills as they were before, and as they are now.
- Say what they notice and what they already wonder about the trees, the bare slopes, the rain, the heat.
- "Hear, in plain terms, what the course will do: make our question our own, gather evidence, work out what it means, and share it."
materialsAndPreparation:
- A picture (or a story you tell) of the hills before the camps and now - bare slopes, few trees.
- 'The research question written or drawn big to show at the end: "What happens to our hills without trees, and what changes when trees and plants grow back?"'
- Step-back and referral guidance to hand, in case the talk touches a landslide or a lost shelter.
visuals:
- kind: setup
  title: "The hills, before and now"
  caption: >-
    Show one picture, or a wall in two halves - the forested hills of before, the bare slopes of now.
    Let learners look and react before you explain anything.
  spec:
    type: zones
    cardStyle: drawing
    zones:
    - label: "Before"
      sublabel: "the hills the elders remember"
      tone: positive
      cards:
      - "hills full of trees"
      - "shade and cool"
    - label: "Now"
      sublabel: "the hills today"
      tone: warn
      cards:
      - "bare slopes"
      - "soil slides in rain"
- kind: example
  title: "Our wonder-wall"
  caption: >-
    The wonderings gathered in step 2 - the first seeds of our research. No question is too small, and a
    drawn one counts.
  spec:
    type: zones
    cardStyle: drawing
    zones:
    - label: "What we wonder"
      tone: question
      cards:
      - "Why did the trees go?"
      - "Where does the mud go?"
      - "Will the trees come back?"
      - "Why is it so hot now?"
facilitationNotes: >-
  The one thing to get right: keep the tone one of curiosity and hope - the land is greening again - not
  disaster. The trees are a safe subject, but they touch landslides and lost shelters, so no learner has
  to speak from their own life. Start from a picture or story, not a definition, and let learners react
  before you explain anything.
steps:
- title: "The hills, before and now"
  duration: "40 min"
  guidance: >-
    Show a picture, or tell a short story, of the hills before the camps - covered in forest - and now,
    bare in many places. Give learners time to look and react. Draw out what they notice, in their own
    words, without correcting or teaching yet.
  keyPrompts:
  - "What do you see? What is different between before and now?"
  - "What do you already know about our hills?"
- title: "What we wonder"
  duration: "40 min"
  guidance: >-
    In pairs, learners say one thing they wonder about the trees and hills. Gather these together - they
    are the first seeds of our research. Notice how personal the flooding or landslides are for the
    group; this tells you how much to lead later, and where to take care.
  keyPrompts:
  - "What do you wonder about our hills and trees?"
- title: "What our course will do"
  duration: "40 min"
  guidance: >-
    Walk through, simply, what the group will do together over the course: make our question our own,
    gather evidence by asking and looking and by reading the source pack, work out what it means, and
    share it. Show the research question. Keep it warm and unhurried.
learnerContent: |
  ## Our challenge

  Our hills were once covered in trees. When the camps were built, and when families needed wood, many
  of the trees were cut down, and the hills became bare. Now, when the heavy rain comes, the soil slides,
  and in the hot sun the bare land gets very hot. But the land is being brought back to life, little by
  little.

  Together we are going to find out about this. Our question is: what happens to our hills without trees,
  and what changes when trees and plants grow back?

  Why do we find this out? Because these hills are ours - what happens to them touches our safety, our
  homes, and our health. Understanding a real challenge with evidence, instead of guessing, is how we can
  think clearly about it. And people are already working to help the hills - so we can also find out
  whether what they do is working. Learning to find things out this way is a skill we can use for any
  challenge in our lives.

educatorContent: |
  ## What you need to know before you teach this

  This is the block that decides whether the cohort cares. Everything downstream - the quality of the
  questions, whether pairs actually go out and gather - depends on whether the challenge feels like
  theirs in this session.

  ### Lead with the place, not the topic

  Do not open with deforestation, and do not define anything. Open with the hills themselves: a
  picture, or a story of this slope before and now. Let learners react, disagree, and tell you what
  they remember before you frame anything.

  Their reactions are also your diagnostic. How personal the flooding and the landslides are for this
  group tells you how much to lead in the framing phase and where the protection risks sit.

  ### Say why we are doing this - all three reasons

  1. These hills are theirs, and what happens to them touches their safety, their homes, their health.
  2. Understanding a real thing with evidence lets you think clearly about it, instead of arguing.
  3. People are already working on it - so we can also find out whether it is working, which is a
     researcher's skill they can use on anything.

  ### Hold the tone: hopeful, not disaster

  The land is greening again, and that is the frame. This is a course about a place that can recover,
  not a catalogue of loss. A session that leaves learners frightened has failed, however accurate it
  was.

  ### The safeguarding, which is real here

  The trees are a deliberately safe subject - but they touch landslides and lost shelters, and some
  learners in the room will have lost family or a home to exactly that.

  So: no learner speaks from their own life unless they choose to; the everyday, observational version
  of every prompt is always available; and you have step-back and referral guidance to hand before you
  start. See the safeguarding guidance for this component.

  ### Listen more than you talk in the second half

  Once the challenge is on the table, the useful part is learners' own wondering. Write their questions
  up - several will become the things they actually chase, and a learner who sees their own question on
  the wall is a learner who turns up.

  ## Before they leave this block

  - Every learner has said or drawn something they already notice about the hills.
  - Their wonderings are recorded where the cohort can see them.
  - Learners can say why the cohort is investigating this, in their own words.
  - The tone in the room is curious, not frightened.
learnerTeachingNotNeeded: >-
  Orientation, not a method: meeting the challenge and reacting to it. The learner's page for this is "My first thoughts about our hills", which is where their wondering goes. There is no technique to teach yet.
