id: ypar-how-adults-see-young-people
slug: ypar-how-adults-see-young-people
access: public
type: tools-approaches
title: "Objects, recipients, resources: three ways adults see young people"
summary: >-
  A three-part frame for reading any programme, school or committee by how it treats the young people
  in it, and for naming honestly where your own sits.
facilitationContext: [group, independent, one-to-one-mentoring]
primaryContext: group
toolsFacet: analytical
deliveryAdaptations:
  - context: group
    how: >-
      As designed. Learners recognise the three positions instantly from their own lives, and the
      argument about which one a particular organisation occupies is where the understanding forms.
  - context: independent
    how: >-
      A learner can apply the frame alone to places they spend time, and will. What is lost is the
      disagreement, so ask them to test one judgement against somebody else before treating it as
      settled.
  - context: one-to-one-mentoring
    how: >-
      Strong in mentoring for a learner who feels unheard somewhere. The frame gives them language
      that describes a position rather than accuses a person, which is usually the difference between
      a conversation that can happen and one that cannot.
duration: 30 to 45 minutes to teach. Ongoing once the group is using it.
grouping: Whole group to teach, small groups to apply.
materialsAndPreparation:
  - "Somewhere to write three headings where everyone can see them."
  - "Real organisations to test the frame against. The learners' own school, programme, camp committee or youth group works better than invented examples."
  - "An honest answer, prepared in advance, about where this programme sits. You will be asked."
whatLearnersDo:
  - Learn three positions an adult can take towards young people.
  - Sort organisations and situations from their own lives into the three.
  - Judge where this programme sits, and say what would move it.
educatorContent: |
  Three positions, and almost every adult-run setting occupies one of them most of the time.

  **Young people as objects.** Adults decide what is best and control the situations young people are
  allowed into. Young people are assumed to have little to contribute. They are not in the design of
  the thing at all; their job is to take up what has been designed for them.

  **Young people as recipients.** Young people are in the room, and the reason they are in the room is
  that taking part is thought to be good for them. The emphasis is on what they will get out of it,
  not on what they bring to it. Adults still set the conditions under which participation happens.
  This is where most well-intentioned youth programmes sit.

  **Young people as resources.** Young people are treated as having something the work actually needs.
  Decision-making and leadership are shared. Both sides usually have to learn new skills for that to
  function, because neither is used to it.

  ## Why the middle position is the interesting one

  Objects is easy to spot and easy to condemn. Resources is easy to aspire to. The frame earns its
  keep on **recipients**, because that position looks like participation and is often described as
  participation, while the young person's actual influence is nil.

  The diagnostic question is not "are young people involved?" but "**what would be different if they
  were not?**" If the answer is nothing, the young people are recipients however full the room is.

  ## Using it on this programme

  Learners will turn the frame on their own course within about four minutes, and you should let
  them. Have an honest answer ready. Most education programmes, including good ones, are recipients
  with resource-like moments, and saying so plainly is far better received than claiming otherwise.
  A group that catches a facilitator overstating how much power it has will discount everything else
  that facilitator says about power.

  ## Two cautions

  **Resources is not automatically the right answer everywhere.** A setting with real legal,
  safeguarding or financial responsibilities cannot hand all of them over, and pretending it can is
  its own kind of dishonesty. The useful question is which decisions genuinely can move, not whether
  everything can.

  **This frame describes positions, not people.** An individual adult can be excellent inside an
  object-shaped institution, and a badly run resource-shaped programme can be worse for a young
  person than a well-run recipient-shaped one. Keep the analysis on the arrangement.

  ## Where it goes next

  [Where are we on the ladder](/materials/ypar-ladder-of-participation) turns the frame into a
  self-assessment and a plan. [Who decides here](/materials/ypar-who-decides-here) maps the same
  question onto a specific institution's actual decisions.
facilitationNotes: >-
  The one thing to get right is your own honesty about this programme. Learners will apply the frame
  to the room they are sitting in, quickly, and a facilitator who claims more shared power than the
  programme really has loses the group's trust on the whole topic. Name which decisions here are
  genuinely theirs, which are shared and which are not, and why. Sensitivity: the frame gives learners
  language for experiences of being overruled at home as well as at school, and some of what surfaces
  will not be about institutions.
steps:
  - title: "Ask where they already have power"
    duration: 5 min
    guidance: >-
      Before any of the three positions are named, ask each learner where in their life they have the
      most power to decide something. Take answers without comment and write them up. The list is
      usually short and mostly outside formal institutions, which is the observation the rest of the
      session builds on.
    keyPrompts:
      - "Where in your life do you have the most say over what happens?"
      - "Is that a place adults run, or not?"
    watchOuts:
      - "Answers are all trivial (what I eat, what I wear). Take them seriously; the smallness of the list is itself the finding, and pushing for grander answers just produces invented ones."
  - title: "Give the three positions and let them argue"
    duration: 10 min
    guidance: >-
      Put up the three headings and describe each in a sentence or two. Then stop talking and ask for
      examples from their own lives for each. Expect a long, easy list under objects and recipients
      and a thin one under resources. Do not fill the gap yourself; the thinness is accurate and it is
      worth sitting with.
    keyPrompts:
      - "Somewhere you have been that worked like this: where?"
      - "What is the difference between being allowed in the room and being needed in the room?"
    watchOuts:
      - "Learners treat recipients as good enough because it sounds positive. Ask the diagnostic question: what would be different if the young people were not there?"
      - "The examples become complaints about named teachers. Move it back to arrangements: the question is how the place is set up, not who is unpleasant in it."
  - title: "Test the frame on real organisations"
    duration: 15 min
    guidance: >-
      In small groups, take three or four organisations the learners actually deal with and place each
      one. Insist on evidence for the placement: not how it feels, but which decisions young people
      make there. Groups will disagree about the same organisation, which is the most productive
      thing that can happen.
    keyPrompts:
      - "What is one decision young people actually make there?"
      - "You two placed the same place differently. What are you each looking at?"
    watchOuts:
      - "A group places everything under objects to make a point. Ask for the decision that proves it; the discipline is what makes the frame usable rather than a mood."
  - title: "Turn it on this programme, honestly"
    duration: 10 min
    guidance: >-
      Ask where this programme sits and take the answer you are given rather than the one you want.
      Then give your own honest account, including which decisions are not the group's and why. Then
      the only question that matters: which decisions here could actually move, and what would have to
      change for them to.
    keyPrompts:
      - "Where does this programme sit? Be straight with me."
      - "Which decisions here could genuinely move to you?"
    watchOuts:
      - "The facilitator claims more shared power than exists. Learners can tell, and it costs more credibility than an honest recipient answer would."
      - "The group names a change that is genuinely impossible. Say so plainly and say why, rather than promising to look into it."
closing: >-
  Keep the three headings on the wall. They become shorthand: a group that can say "that meeting
  treated us as recipients" has a way of raising a real problem without accusing anyone, and that is
  most of what the frame is for.
learnerContent: |
  There are three ways adults can see young people. You will recognise all of them.

  - **As objects.** Adults decide what is best for you and control what you are allowed into. It is
    assumed you have nothing much to add.
  - **As recipients.** You are in the room, and you are in the room because it is thought to be good
    for you. Adults still set the terms. This one looks like being included.
  - **As resources.** You are there because the work needs what you have. Decisions are genuinely
    shared.

  The middle one is the tricky one, because it looks like the third one from the outside.

  Here is the test. **What would be different if the young people were not there?** If the answer is
  nothing, they are recipients, however many of them are in the room.

  Use it on the places you spend your time. Then use it on this programme, and say what you find. You
  will get an honest answer back about which decisions here are actually yours.
agencyContribution:
  indicators: [contribution-to-community, power-over-wellbeing-and-self-direction]
  how: >-
    Young people are constantly told they are being included, and often have no language for the gap
    between being present and having influence. This frame supplies it. A learner who can name the
    difference can ask for the second thing specifically, rather than feeling vaguely dissatisfied
    with the first and not knowing why.
principlesForegrounded: [collaboration, lifeworthy-competencies, feedback-and-data]
principleAlignment:
  - principle: collaboration
    how: >-
      The frame is about the terms on which people work together, and it makes those terms nameable so
      a group can negotiate them rather than absorb them.
  - principle: lifeworthy-competencies
    how: >-
      Reading an organisation by how much influence it actually gives you is a skill that keeps paying
      out: in a workplace, a committee, a consultation, an aid programme.
  - principle: feedback-and-data
    how: >-
      Placements have to be justified by naming a real decision, so the analysis rests on evidence
      about what happens rather than on how a place makes someone feel.
competencyCodes: [ALC1, FPS3, FUS2]
competencyDevelopment:
  - code: ALC1
    how: >-
      Learners work out what it takes for other people to lead rather than be led, and apply it to
      arrangements they are inside, which is where the competency starts becoming practical.
  - code: FPS3
    how: >-
      Placing an organisation requires identifying who actually holds which decisions, which is
      structural analysis of a system the learner is part of.
  - code: FUS2
    how: >-
      The frame includes an honest account of why adults occupy the positions they do, including the
      constraints they are under, rather than treating the arrangement as simple bad faith.
