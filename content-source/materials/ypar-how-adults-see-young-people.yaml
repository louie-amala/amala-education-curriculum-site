    in youth-work literature beyond YELL. Every word on this page is written from scratch. The YELL
    "Youth as Objects, Recipients, Resources" handout, which carries a 2007 John W. Gardner Center
    copyright line, is not reproduced; the handbook is linked instead.
  note: >-
    Never paste the YELL handout's bullet lists onto this page.
