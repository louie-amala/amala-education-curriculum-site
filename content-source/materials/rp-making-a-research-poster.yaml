provenanceNote: >-
  Authored from Research Project objective 4 (communicate findings and actionable insights to an
  audience), which lists a poster or infographic as a format option but supplies no activity guide.
  Written to generalise to any shared research challenge, and designed as the lower-literacy,
  lower-bandwidth alternative to a written report so learners who find writing hard can still
  communicate real insight. Linked to Research Project objective 4.
