# Contextualised, fully offline adaptation of efi-unit1-grammar-exercises and efi-mv-to-be-and-pronouns
# for Learning Bridge+ (Cox's Bazar). The key shift from the sources: this is the controlled-to-freer
# PRACTICE layer for the Unit 1 grammar (the verb "to be", subject pronouns, simple sentences), rebuilt
# oral-first. The source's eight paper fill-in exercises become spoken and card-based tasks — choosing
# am/is/are by ear, matching a person to a pronoun with picture cards, building a sentence from word cards,
# oral ask-and-answer, an oral mingle, and a spoken "I can say" close. Writing is optional throughout, with
# a written version offered to those ready. Objective 2.
id: cb-mv-sentence-practice
slug: cb-mv-sentence-practice
access: public
edition: learning-bridge-coxs-bazar
type: activity
title: "Practising your sentences: am, is, are, and who is who"
summary: >-
  The practice that takes learners' first sentences from careful to easy — the verb "to be" (am, is, are),
  the subject pronouns, and simple sentences about themselves — rebuilt spoken-first and offline. Learners
  choose am, is, or are by ear, match a person to a pronoun with picture cards, build a sentence from word
  cards, ask and answer in same-gender pairs, mingle to find someone who, and close by saying aloud what
  they can now say. Writing stays optional, offered to those ready, so no one is held back by the pencil.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. This practice is made for the group — choosing am, is, or are aloud together, matching the
    people in the room to pronouns, and the ask-and-answer and find-someone-who tasks all need other
    people to work. Hearing the same pattern used a dozen ways teaches it faster than any rule, and a room
    practising together gives a shy learner cover to find their voice. Use same-gender pairs and small
    groups for anything said aloud.
- context: one-to-one-mentoring
  how: >-
    A gentle fit for a learner who freezes when others listen, or who is behind on the pattern. A mentor
    can slow the card tasks right down, let the learner choose am, is, or are and build a sentence with no
    audience until it is easy, and stand in as the partner for the ask-and-answer, so the practice is a sure
    win rather than a public risk before the learner rejoins the group.
- context: independent
  how: >-
    Partly workable alone once the pattern is met: a learner can sort person-cards to their pronouns and
    build sentences from word cards by themselves, and the My Voice book carries their own picture-words to
    fill the frames. But the pattern settles by using it with people, so the independent task is to say the
    sentences to someone at home; pair it with a spoken check next session.
duration: "2.5 hours facilitated across two or three sessions, plus about 1 hour of independent practice"
grouping: "Whole group for the pattern, then same-gender pairs and small groups; the mingle uses the whole room; works with 10-35 learners"
whatLearnersDo:
- Choose am, is, or are by ear to finish a spoken sentence, matched to a person they can see.
- Match a person or a group to the right pronoun (I, you, he, she, we, they) using picture cards.
- Build a simple sentence from word cards laid in order (I / am / from / ___).
- Ask and answer simple questions about themselves in same-gender pairs, and mingle to find someone who.
materialsAndPreparation:
- Word cards for the small set of sentence words (I, you, he, she, we, they, am, is, are, from, a, and each learner's own picture-words), printed, drawn, or scratched on card.
- Picture cards or drawn pictures of people and groups (a woman, a man, two friends, a family) for the pronoun matching, and the people in the room themselves.
- The learner's picture-words from earlier My Voice sessions (their drawn words for name, place, and things they like), so the frames are filled with real words that are theirs.
- The My Voice book and something to draw or trace with, for those who want to keep a written version.
- "Sensitivity: the frame 'I am from ___' can touch displacement, loss, and separation. Offer the lighter road openly and often — a learner can name a smaller, safer place, or fill the frame with a colour, a food, or a thing they like instead. No one has to say where they are from, and choosing the easy word is never a failing."
facilitationNotes: |
  This is the practice layer that makes the Unit 1 grammar easy rather than merely met — the verb "to be",
  the subject pronouns, and simple sentences. The sources it grows from are eight paper fill-in exercises
  for learners who can read and write. Here every one is rebuilt to be spoken and physical, because most
  learners are not yet reading in any language: choosing am, is, or are is done by ear about a real person
  in the room, not circled on a worksheet; matching a pronoun is done with picture-cards and pointing;
  building a sentence is done by laying word cards in order, not writing them; and the two spoken exercises
  from the source — ask-and-answer and find-someone-who — carry straight over as the heart of the practice.
  Keep the verb attached to real, visible people, never to a rule, because the pattern sticks when it is
  about someone the learner can see. Expect "I from" and "I student" and do not pounce; say the whole
  sentence back warmly and let the correct shape soak in through repetition. Move from controlled to freer
  across the steps — first choosing and matching, then building, then free use in pairs and the mingle —
  just as the source sequences it, but by mouth and by card. Writing is optional at every step: a learner
  ready to trace or copy a sentence into their My Voice book may, but no one waits on the pencil. Welcome
  bridges to Rohingya, Chittagonian, Burmese, and Arabic — how is "I am" said in a language you already
  have? A learner who can say and vary true sentences about who they are has crossed a real line.
steps:
- title: "Choose am, is, are, and match the pronoun"
  duration: "35-45 min"
  guidance: |
    Start with the controlled work, done aloud. Point to a real person and say a sentence with a gap for
    the group to fill by ear — "Fatima ___ my friend" and the group says "is"; "I ___ a student" and they
    say "am"; "they ___ here" and they say "are". Keep it about people they can see, so the choice carries
    meaning. Then match people to pronouns with picture-cards: hold up a card of a woman and learners say
    "she", a man "he", two friends "we" or "they", and rebuild the sentence with the pronoun (Maria is my
    friend becomes She is my friend). Go slowly and let the choices be made together before anyone is asked
    alone.
  keyPrompts:
  - Point to her. She ___ my friend. Which word finishes it?
  - Which pronoun goes with this card, or with these two people?
  - How do you say "I am" in a language you already speak?
  watchOuts:
  - He and she mixed up; keep practising with real, known people so the choice carries meaning, and treat a slip as ordinary rather than a failure.
  - Rushing to cover every pronoun; a learner who owns "I am", "she is", and "we are" has more than one who half-heard six forms.
  adaptation: |
    No cards are needed. Point at the actual people in the room for the pronouns, and let the gap-sentences
    live entirely in your voice and theirs; the choosing and matching work the same with nothing but
    speech.
- title: "Build a sentence from cards"
  duration: "35-45 min"
  guidance: |
    Now build, without writing. Give out word cards for the small sentence set and have learners lay them
    in order to make a true sentence — I / am / from / and then their own picture-word for a place; or I /
    am / a / and their word for what they are. Say a sentence and learners build it from the cards; then
    they build one that is true for them and say it aloud. This is the source's put-the-words-in-order
    exercise, done by hand with cards instead of on paper, so a learner who cannot write still feels a
    sentence take shape and hears which word goes where.
  keyPrompts:
  - Lay the cards to make it true for you. Now say the whole sentence.
  - Which card comes first? Where does "am" go?
  - Read me your sentence, pointing to each card.
  watchOuts:
  - Dropping the "am" (laying "I from ___"); do not scold, just build the whole sentence back warmly with the cards and have them echo it, so the full shape is what they see and say.
  - A learner reaching for a place that hurts to name; offer the lighter road openly, so filling the frame with a colour, a food, or a thing they like never feels like failing.
  adaptation: |
    With no cards, learners build the sentence aloud from the frame said slowly, word by word, or lay small
    objects or scratched scraps in order; the win is hearing the order of the words, which a gesture and a
    voice carry as well as printed cards.
- title: "Ask and answer, in pairs"
  duration: "30-40 min"
  guidance: |
    Move to freer use. In same-gender pairs, learners ask and answer simple questions about themselves,
    aiming for a whole-sentence answer — "What is your name?", "Where are you from?", "What do you like?".
    Model a pair first with a confident learner or the mentor. Do not correct during the exchange; let the
    pattern flow. This is the source's ask-and-answer speaking task, carried straight over — it needs no
    paper, only two people and the sentences they have been building.
  keyPrompts:
  - Ask your partner where they are from. Answer in a whole sentence.
  - What is your name? What do you like? Take turns.
  - What felt easier to say this time than last time?
  watchOuts:
  - Stopping to fix small errors, which kills the flow; save any teaching for later and let the paired repetition do its work.
  - A shy learner freezing with a new partner; let them rehearse quietly with the mentor or a trusted partner first, and keep pairs same-gender for anything said aloud.
  adaptation: |
    In a seated group with no room to move, learners simply turn to the person beside them; the whole
    exchange is spoken, so it needs nothing but a partner and a little quiet.
- title: "Find someone who, and mingle"
  duration: "25-35 min"
  guidance: |
    Close the freer practice with a gentle mingle. Give the group a few simple things to find — someone who
    likes rice, someone who is from the same place, someone with the same first sound in their name — and
    learners move around asking and answering to find them, using the sentences they now have. Keep it warm
    and unhurried, and keep the questions light and safe. This is the source's find-someone-who task,
    rebuilt as a spoken mingle with nothing to write, so the grammar is used for a real purpose — finding
    something out about a real person.
  keyPrompts:
  - Find someone who likes the same food as you. Ask them.
  - Who is from near where you are from? Ask and answer in whole sentences.
  - Tell the group one thing you found out about someone.
  watchOuts:
  - Questions that push toward what hurts; keep the things-to-find light and everyday, and let a learner pass on any question with no explanation.
  - The mingle unsettling a shy learner; let them work the room with a partner, or find just one person rather than several.
  adaptation: |
    Where moving around is not possible, run it seated by rotating one row so each learner meets three
    fresh partners in turn; the finding-out works the same without anyone crossing the space.
closing: |
  Bring the group back and close with a spoken reflection. Go round and let a few learners say aloud what
  they can now say — "I can say, I am Fatima; I am from my village; I like rice" — and mark the milestone
  plainly: the sentences that were careful work a few weeks ago now come easily, and you can ask and answer
  about who you are, in English, with other people. For any learner who wants it, offer the written version
  now — trace or copy one sentence into the My Voice book — but no one waits on the pencil. Independent
  task: say your sentences to one person at home, ask them one question back in English, and, if you like,
  trace one sentence once in your book.
agencyContribution:
  indicators:
  - control-of-future-pathways
  - power-over-wellbeing-and-self-direction
  how: >-
    The verb "to be" is the hinge of the first whole sentences a learner can make, and practising them
    until they come easily is what turns a fragile first sentence into a reliable tool. Being able to state
    who you are, ask about someone else, and be understood — without stalling — is the ground that speaking
    up, meeting people, and every later choice stands on, and it puts a beginner in charge of representing
    themselves in English on their own terms.
principlesForegrounded:
- builds-on-identities
- lifeworthy-competencies
- safe-spaces
principleAlignment:
- principle: builds-on-identities
  how: >-
    Every sentence practised is a true statement about the learner, filled with their own picture-words and
    their own name, and bridges to how "I am" is said in Rohingya, Chittagonian, Burmese, or Arabic are
    invited in, so the grammar is drilled on the learner's own life rather than on abstract examples.
- principle: lifeworthy-competencies
  how: >-
    Building and varying a whole sentence from Subject plus "to be" plus a word of your own is the
    structural foundation of all later speaking and writing — a pattern a learner reuses in every later
    session and every conversation for the rest of their life; this practice is how it becomes automatic.
- principle: safe-spaces
  how: >-
    Errors in the verb forms are met with the whole sentence said back warmly rather than correction, the
    "where I am from" frame can always be filled with a lighter everyday word, pairs and groups are
    same-gender for anything said aloud, and every sentence is rehearsed quietly before the room hears it —
    so learners take real risks with speech without fear of failing.
competencyCodes:
- FLC3
- FUS1
competencyDevelopment:
- code: FLC3
  how: >-
    Practising clear, complete sentences with "to be" until they come easily is the means by which learners
    move from being understood with effort to communicating basic personal information fluently — their
    name, where they are from, what they like — and asking the same of others.
- code: FUS1
  how: >-
    The sentences learners practise are statements of their own identity, so drilling the frames doubles as
    naming, again and again until it is sure, who they are, where they are from, and what matters to them.
