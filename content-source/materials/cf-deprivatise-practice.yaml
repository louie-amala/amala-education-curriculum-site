id: cf-deprivatise-practice
slug: cf-deprivatise-practice
access: public
type: educator-move
title: "De-privatise your practice"
summary: >-
  Teaching is often done behind closed doors. Open it up — invite a colleague to observe for data on
  student learning, and observe others to grow your own practice.
tags:
  - id: improving-practice
educatorContent: |
  Teaching can feel private — we plan, teach and reflect largely alone. Yet the best professional
  learning happens in context, with peers, especially through watching effective practice.
  De-privatising your practice means opening some of it up.

  A useful structure is a non-evaluative observation cycle. The observed educator owns it — they set
  the focus and agree what data the observer will collect — because the point is not to judge
  performance but to gather data on student learning the educator can act on. It runs in three stages:
  a pre-observation conference (agree the focus, the data, and the logistics), the observation itself
  (the observer collects the agreed data — wait time given, who speaks, how learners talk about the
  learning), and a post-observation conference (the observer hands the data back non-judgementally and
  asks reflective questions; the observed educator interprets it). Observing others is just as
  valuable — it exposes you to ideas you would never reach alone. Start small: pick one aspect of your
  practice to make public this week.
agencyContribution:
  indicators:
    - power-over-wellbeing-and-self-direction
  how: >-
    Every improvement an educator makes to how they facilitate compounds into learners who are better
    seen, better challenged, and more in control of their own learning.
principleAlignment:
  - principle: collaboration
    how: >-
      Opening practice to a colleague makes teaching a shared, collaborative craft rather than a solo
      performance.
  - principle: feedback-and-data
    how: >-
      The observation cycle gathers real data on student learning and feeds it back as reflection, not
      as a verdict.
