# Contextualised, fully offline activity for Learning Bridge+ (Cox's Bazar): the milestones-and-first-
# step half of goal-setting, derived from ail-setting-your-goals. Oral and visual first, ~60 min.
id: cb-ail-your-goal-steps
slug: cb-ail-your-goal-steps
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "Your steps, and your first step"
summary: >-
  Learners break their goal into a small ladder of steps, choose a first step small enough to take
  this week, and commit to it aloud, so a goal on the page becomes deliberate action.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners build a step ladder alone, then say their first step to a partner. Saying a
    first step aloud to someone is what turns intention into a commitment, so keep the pairing. Use
    same-gender pairs.
- context: one-to-one-mentoring
  how: >-
    A strong fit. A mentor helps a learner make the first step small and real, and follows it up next
    time, which is exactly the gentle accountability that makes a first step actually happen.
- context: independent
  how: >-
    Workable: the workbook ladder carries the steps. Ask the learner to say their first step to someone
    at home and take it before the next session, since a first step with no witness is easily dropped.
duration: "About 2 hours in the unit plan (generous for this oral/visual, translated cohort — the step timings below are the active teaching core; the rest is warm check-in, drawing, and translation), plus taking the first step during the week"
grouping: "Individual laddering, then same-gender pairs; works with 10-35 learners"
whatLearnersDo:
- See that a goal is easier when it is broken into small steps.
- Break your goal into a few steps, from a small first step up to your goal.
- Choose one first step small enough to take this week.
- Say your first step to a partner, and take it before the next session.
materialsAndPreparation:
- Learners' goal page from the last session (the goal they drew).
- The student workbook (the step-ladder page, with three rungs to draw or colour).
- Your own goal and its first small step, to model the ladder aloud.
visuals:
- kind: example
  title: "My goal, broken into steps"
  caption: >-
    A big goal split into small rungs, with the first step — small enough for a day or two — chosen and
    coloured in.
  spec:
    type: zones
    flow: across
    flowLabel: "steps"
    zones:
    - label: "My goal"
      tone: neutral
      cards:
      - "read a short story"
    - label: "My steps (first one first)"
      tone: positive
      cards:
      - "learn 5 letters this week"
      - "read 3 words"
      - "read one page"
facilitationNotes: |
  A goal on the page does nothing until a learner takes a step towards it. The one thing to get right
  is that the first step is small enough to actually be done this week: a first step that is really the
  whole goal in disguise will not be taken. Push gently for something a learner could do in a day or
  two, with what they already have. Saying it aloud to a partner, and being asked about it next time,
  is what makes the step happen. Celebrate steps taken, however small.
steps:
- title: "Why small steps"
  duration: "10 min"
  guidance: |
    Open with your own goal and one small first step towards it, said aloud. Draw out that a big goal
    feels impossible until it is broken into steps, and that the first step should be small and near.
    Keep it short; learners will understand this by building their own ladder next.
  keyPrompts:
  - Why is a goal easier when you break it into steps?
  - What is one small first step towards a goal of your own?
  watchOuts:
  - Learners think a first step has to be big to count; make clear that a small step you actually take beats a big one you never start.
  adaptation: |
    Nothing is needed but your spoken example; no board or slides.
- title: "Build your step ladder"
  duration: "18 min"
  guidance: |
    Have learners draw a ladder of three steps on the workbook page, from a small first step at the
    bottom up to their goal at the top. Circulate and help them make the steps real and in order. Three
    rungs is plenty. Where a learner wants words, you scribe them.
  keyPrompts:
  - What are two or three smaller steps that would show you are getting there?
  - Which step comes first, and which comes later?
  watchOuts:
  - The steps are as vague as the goal; push for steps a learner could actually tick off, not restatements of the goal.
  adaptation: |
    No writing is needed: learners draw each step, or place a mark on each rung, and you scribe only if asked.
- title: "Choose your first step"
  duration: "16 min"
  guidance: |
    Ask each learner to colour or mark the first rung: the one step they can reach this week. Help them
    make it small enough to do in a day or two, with what they already have around them. This is the
    step they will actually take.
  keyPrompts:
  - Which step could you reach first, this week?
  - Is it small enough to do with what you already have?
  watchOuts:
  - A learner picks a first step that needs something they do not have; help them find a smaller step that depends only on themselves.
- title: "Say it and commit"
  duration: "12 min"
  guidance: |
    In same-gender pairs, each learner says their first step aloud and when they will take it. The
    partner will ask them about it next session. Saying it to someone, and knowing they will ask, is
    the commitment. Confirm the ladder lives in the workbook and will be returned to.
  keyPrompts:
  - Tell your partner your first step, and when you will take it.
  - What will you tell them next time about how it went?
  watchOuts:
  - A first step stays a plan with no when; make sure each learner names a day or a moment they will do it.
closing: |
  Ask two or three learners to say their first step and when they will take it, so the room hears real,
  small steps. Remind them that next session begins by asking how the first step went, and that a step
  taken, however small, is proof they can steer their own learning. Independent task: take your first
  step this week, and be ready to say what happened.

educatorContent: |
  ## What you need to know before you teach this

  A goal on a page does nothing. This is the block that turns it into something a learner can start on
  Thursday. Everything after it — the action plan, the weekly steps, the whole between-session engine —
  runs on what happens here.

  ### Why break a goal into steps at all

  Two reasons, and learners find the second one surprising.

  1. **A big thing is hard to start.** Not because people are lazy, but because you cannot see where to
     put your hand. Steps give you somewhere to put your hand.
  2. **Steps are how you find out you are moving.** A learner working on a ten-week goal with no steps
     has no evidence of progress for ten weeks, and will conclude nothing is happening. A learner who
     finished step two knows something changed. That evidence is what keeps them going, and in this
     cohort it is often the first evidence they have ever had that effort works.

  ### What makes a step a step

  A step is something you could **finish in one go, and know you had finished**. If a learner cannot
  say when it would be done, it is not a step, it is a smaller goal.

  Four or five steps is right. Ten means they are planning, not stepping. Two usually means the steps
  are still goals in disguise.

  ### The first step is the one that matters — make it embarrassingly small

  This is the single most important judgement in the block, and facilitators consistently pitch it too
  high.

  A good first step is one the learner could do **today, without anyone's help, without anything they
  do not already have.** "Ask my neighbour to teach me three words" is a first step. "Practise English
  for an hour every day" is not — it is a habit, and habits are not first steps.

  Learners will offer ambitious first steps because ambition feels like commitment. Push back warmly
  and specifically: *could you do that before we next meet, even if this week goes badly?* If the
  honest answer is no, halve it. Then check again.

  The point of the first step is not progress. It is that the learner finds out they can move at all.

  ### Ladders that go the wrong way

  Watch for step ladders where the first rung is the hardest — a learner who puts "find someone to
  teach me" at the bottom and "practise what they taught me" at the top has it upside down. Ask which
  one they could do first, and re-order.

  ### Say it out loud, to a person

  The block ends with each learner saying their first step aloud to a partner. Do not cut this for
  time. A step said to another person is far more likely to happen than one written on a page, and this
  is also the moment you hear which steps are still too big.

  ## Before they leave this block

  - A drawn ladder with four or five steps, in an order that makes sense.
  - A first step chosen and coloured, which the learner could genuinely do before the next session.
  - The first step said out loud to a partner.
  - You have personally checked the first step of any learner you are unsure about — this is worth your
    time more than anything else in the block.
learnerTeaching:
  title: "How to break a goal into steps you can actually take"
  readAloud: |
    ## How to break a goal into steps

    You have a goal now. A goal on a page does nothing on its own. This is how you turn it into
    something you can start.

    ### Why steps?

    Two reasons.

    **A big thing is hard to start.** Not because you are lazy — because you cannot see where to put
    your hand first. Steps give you somewhere to put your hand.

    **Steps are how you find out you are moving.** If your goal takes ten weeks and you have no steps,
    you will not know for ten weeks whether anything is happening. If you finish step two, you KNOW you
    moved. That is worth a lot.

    ### What makes something a step

    A step is something you could **finish in one go, and know you had finished it**.

    - "Learn to read" — not a step. That is another goal.
    - "Ask my neighbour to show me the letters in my name" — a step. You can finish it. You will know.

    Four or five steps is about right. If you have ten, they are too small. If you have two, they are
    probably still goals in disguise.

    ### Put them in order

    Which one has to happen first? Which one cannot happen until another is done?

    Watch out for a ladder that is upside down. If your first step is the hardest one, swap it.

    ### Now the important part: your FIRST step

    Choose the first step. Then make it smaller.

    A good first step is one you could do **today**, on your own, with what you already have.

    - "Practise English for an hour every day" — this is not a first step. It is a habit, and habits
      are hard to start.
    - "Ask one person to teach me three words" — this is a first step. You could do it this afternoon.

    Ask yourself honestly: **could I do this before we meet again, even if this week goes badly?**

    If the answer is no, make it smaller. Then ask again.

    ### Why so small?

    Because the point of the first step is not to get a lot done. The point is to find out that you can
    move at all. Everything after that is easier.

    ### Say it out loud

    Tell your partner your first step. Out loud, to a person.

    A step you have said to someone is much more likely to actually happen than one you only wrote
    down. Nobody knows why, but it is true.
  words:
    - term: step
      meaning: something small you can finish in one go, on the way to your goal
    - term: first step
      meaning: the one you will do first — small enough to do today
    - term: ladder
      meaning: your steps drawn in order, from the one you do first to the one you do last
  tryIt:
    intro: >-
      Someone's goal is "be able to introduce myself in English". Is each of these a good FIRST step, or
      is it too big? Circle your answer, then check at the back of the book.
    chooseFrom: ["good first step", "too big"]
    items:
      - "Practise English for one hour every evening."
      - "Ask my facilitator to say the words \"my name is\" so I can hear them."
      - "Become confident speaking English to strangers."
      - "Say my name in English to one person in my family tonight."
    answers:
      - "Too big. This is a habit, not a step — and if you miss one evening it feels like you have already failed. Habits come later."
      - "A good first step. You could do it today, it needs nothing you do not have, and you will know when it is done."
      - "Too big. This is not a step at all, it is a bigger goal than the one you started with. Ask: what is the smallest piece of this?"
      - "A good first step. Small, today, one person, and you will know. This is exactly the right size — it may even feel too easy, which is fine."
    then: >-
      Now look at your own first step. Could you do it before we meet again, even if this week goes
      badly? If not, make it smaller.
worksheet:
  slug: cb-ail-my-steps-page
  note: "In the learner's book (My Learning Book): the 'My steps' page. Print one per learner."
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  - control-of-future-pathways
  how: >-
    Choosing and taking a first step is the moment a learner moves from wanting to doing, on their own
    initiative. Breaking a goal into steps they control, and acting between sessions, is self-direction
    in practice: the learner, not circumstance, decides the next move in their own learning. And a
    learner who has proved to themselves that a step they chose actually moved them is a learner who can
    believe a next step is worth taking — which is what makes a pathway feel reachable rather than given.
principlesForegrounded:
- recognise-communicate-growth
- responsible-action
- lifeworthy-competencies
principleAlignment:
- principle: recognise-communicate-growth
  how: >-
    Breaking a goal into trackable steps and saying a first step aloud gives learners a way to see and
    talk about their own progress, the habit of recognising and communicating growth this component builds.
- principle: responsible-action
  how: >-
    Committing to a first step and taking it between sessions is learners taking ownership of their own
    learning and acting with intention, the responsible action the goal was set for.
- principle: lifeworthy-competencies
  how: >-
    Breaking a goal into steps and starting with a small one is a habit a learner will reuse across
    study, work and life whenever they take on something hard, which is what makes it worth practising.
competencyCodes:
- FSL2
- FSL1
competencyDevelopment:
- code: FSL2
  how: >-
    Breaking a goal into milestones and taking a deliberate first step between sessions is the "pursue"
    in setting and pursuing goals; the step ladder and the step taken are evidence a learner can move
    from intention to real progress.
- code: FSL1
  how: >-
    Choosing a first step that is genuinely within reach requires learners to reflect honestly on what
    they can do this week with what they have, which is direct practice in self-reflection.
