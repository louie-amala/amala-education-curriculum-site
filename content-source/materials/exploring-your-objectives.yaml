provenanceNote: >-
  A reusable, component-agnostic orientation activity, authored to give any Amala course or component a
  consistent way to open: explore the objectives, understand why they matter, clarify the words, and
  surface how learners would approach each. Used by Agency in Learning and applicable to the Research
  Project. The Cox's Bazar edition adapts it per component (see cb-ail-exploring-our-objectives).
