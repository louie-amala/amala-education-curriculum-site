primaryContext: independent
learnerContent: |
  ## My first thoughts about our hills

  This is your first page. It is about what you notice, not about being right.

  On this page you have room to:

  - Draw or mark what you see when you look at our hills — the trees, the bare slopes, the rain, the sun.
  - Mark one thing you already know about our hills.
  - Draw or mark one thing you wonder about the trees and hills.

  You can use drawings, marks, and a few words. There is no wrong answer here. Keep this page in your
  research book, so that at the end of the course you can look back and see the first thing you wondered.

  A gentle note: our hills can bring up hard memories, like a landslide or a lost home. You never have
  to draw or say anything about your own life. Draw only what you want to share.
