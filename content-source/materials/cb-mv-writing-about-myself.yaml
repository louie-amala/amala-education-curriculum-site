provenanceNote: >-
  Contextualised, fully offline adaptation of efi-mv-writing-about-myself for the Learning Bridge+
  (Cox's Bazar) edition. The source expects learners to build several true sentences from frames and
  assumes Home-Language literacy; this version is rebuilt for emergent literacy — learners copy and
  complete a few personal words, only those ready attempt one simple scaffolded sentence, and a full
  oral/drawing alternative means no one is excluded. The words produced feed the "My Name, My Voice"
  identity artifact. Objective 2 of the My Voice unit.
