rights:
  status: own-expression
  holder: "UC Berkeley YPAR Hub; credited by the source to Youth in Focus (Youth REP: Step by Step) and Stanford's John W. Gardner Center (YELL)"
  basis: >-
    Island-founding simulations are a long-standing genre with no single traceable author. Every word
    here is written from scratch and none of the YPAR Hub's wording is reproduced.
  note: >-
    The setting is invented on purpose. If this page is ever adapted, do not transpose the islands onto
    a real territory, border or displacement route; see the materials standard on simulations and whose
    life is being played.
sourceRefs:
