provenanceNote: >-
  Rewritten from the YPAR Hub's "Island Paradise", supplied to Amala in August 2026. The three-stage
  structure, silent individual design, group island, then the reveal of other islands, and the six
  debrief topics are the source's. The instruction not to hint at the reveal, the timing discipline,
  the low-cost material substitutions and the closing question about doing it differently are Amala's.
