provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, adaptations and delivery
  modes) from the Design Challenge activity guide, which supplied the purpose, the self-assessment tool,
  the group reflection questions and the personal-commitment step. The source Design Challenge investigates
  the mental health and wellbeing of Afghan females; this material is written to generalise to any design
  challenge. Linked to Agency in Learning objective 1.
