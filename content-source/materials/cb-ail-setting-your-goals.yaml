# Contextualised, fully offline adaptation of ail-setting-your-goals (first half) for Learning Bridge+
# (Cox's Bazar). Oral and visual first, ~60 min facilitated.
id: cb-ail-setting-your-goals
slug: cb-ail-setting-your-goals
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "Choose and draw your goal"
summary: >-
  Learners turn a rough sense of what they want into one small, clear learning goal they care about,
  drawn and said aloud, built from the Learner Profile they made in Week 1.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners choose and draw a goal alone, then sharpen it with a partner. Saying a goal
    aloud and being asked "how would you know you had reached it?" is what turns a wish into a goal, so
    keep the pairing. Use same-gender pairs.
- context: one-to-one-mentoring
  how: >-
    A strong fit. A mentor helps the learner make a goal clear and honest, and holds them to it gently
    over time. Have the learner bring their Learner Profile so the goal grows from a real starting point.
- context: independent
  how: >-
    Weaker alone, since a learner tends to leave goals vague. The workbook page carries the drawing;
    ask them to say the goal aloud to a family member and check it against last session's tests.
duration: "About 2 hours in the unit plan (generous for this oral/visual, translated cohort — the step timings below are the active teaching core; the rest is warm check-in, drawing, and translation), plus a 30 min independent task"
grouping: "Individual drawing, then same-gender pairs; works with 10-35 learners"
whatLearnersDo:
- Choose one small learning goal that matters to you, using your Learner Profile.
- Draw the thing you want to be able to do.
- Say why this goal matters to you, and to the people you care about.
- Say your goal to a partner and make it clearer.
materialsAndPreparation:
- Learners' Week 1 Learner Profile pages (strengths, areas to grow, how they learn best).
- Your own honest example of a small learning goal and why it matters to you, to model first.
- The student workbook (the goal page, with space to draw).
- "Sensitivity: a goal can touch on hard things, family, marriage, leaving. A learning goal can still be for the people a learner cares about (to help my family, to teach a younger sibling); what stays constant is that it is about their own learning, something they can work on now, not a future they cannot control. Let anyone pass and only draw."
facilitationNotes: |
  A clear goal is the difference between hoping to improve and steering your own learning. The one
  thing to get right is that the goal is the learner's own and genuinely matters to them: a goal set to
  please you will not be pursued. Keep goals small, real, and about the learner's own learning — which
  can still be for the people they care about — rather than a far-off future they cannot control. Some
  limits here are real and outside a learner's control, and that is not their failing: a goal is about
  the learning they can steer. Two clear goals a learner cares about beat a long list they quietly
  abandon. Resist tidying their goal into your words.
steps:
- title: "You choose what you learn"
  duration: "10 min"
  guidance: |
    Open with the idea the whole component rests on. Say: here, many things are chosen for you, but
    what you learn is yours to choose, and a goal is how you take hold of your own learning. Keep it
    short and warm; you are setting up why a goal is worth having before anyone chooses one.
  keyPrompts:
  - What is one small thing about your learning that you get to choose?
  - Why is it worth having a goal, and not just a wish?
  watchOuts:
  - Learners reach for big life goals outside their control; warmly bring it back to a small learning goal for now, and keep any bigger dream noted, not crushed.
  adaptation: |
    Nothing is needed but you speaking the idea aloud; no board or slides.
- title: "Choose a goal from your profile"
  duration: "16 min"
  guidance: |
    Have learners look at their Week 1 Learner Profile, the areas they wanted to grow, and choose one
    small learning goal for now. Circulate and ask, rather than tell: what would you like to be able to
    do, and why does it matter to you? Steer them to one real goal, not a long list.
  keyPrompts:
  - Looking at what you wanted to grow, what would you like to be able to do that you cannot yet?
  - Why does this one matter to you, and to the people you care about?
  - Who could you work on this goal with, or who might it help?
  watchOuts:
  - A learner writes a goal to please you; reassure them there is no right answer and a goal only works if they care about reaching it.
  adaptation: |
    If the profile is not to hand, ask them to remember one area they wanted to grow, and start there.
- title: "Draw your goal"
  duration: "18 min"
  guidance: |
    Ask learners to draw the thing they want to be able to do on the workbook goal page. They do not
    have to write; where a learner wants words, you scribe them. Circulate and help each learner make
    the goal small and clear, held against last session's tests.
  keyPrompts:
  - Can you draw what it looks like when you have reached this goal?
  - How would you know you had reached it?
  watchOuts:
  - The goal stays huge and distant so it cannot be pictured; help the learner cut it down to one small, clear step of the bigger wish.
  adaptation: |
    No writing is needed: the drawing is the goal, and you scribe a few words only if the learner wants them.
- title: "Say it to a partner and make it clearer"
  duration: "12 min"
  guidance: |
    In same-gender pairs, learners say their goal aloud and their partner asks the two questions that
    sharpen it: how would you know you had reached it, and can you reach it soon? Learners adjust their
    goal. Saying it aloud is what makes it real.
  keyPrompts:
  - Tell your partner your goal. How would they know you had reached it?
  - Is it small enough to reach soon?
  watchOuts:
  - Partners just approve each other's goals; give them the two questions to ask so the sharpening actually happens.
closing: |
  Ask two or three learners to say their goal aloud. Confirm the goal lives in the workbook and is not
  fixed forever: it will be revisited and adjusted. A goal on the page is the start of directing your
  own learning. Independent task: tell one person at home your learning goal, and why it matters to you.

educatorContent: |
  ## What you need to know before you teach this

  Learners already know the four tests. This block is where they actually choose — and the choice has
  to be theirs, or the next eight weeks are performance.

  ### The goal must come from the profile they built

  Point them back at their own pages: strengths, areas to grow, how they learn. A goal invented on the
  spot, unconnected to any of that, is usually a goal they think you want.

  ### The tell that a goal is not theirs

  It sounds excellent and they cannot say why. Ask "what would be different for you if you did this?"
  and listen for something concrete — a thing they could do, a person they could speak to, a place they
  could go. If the answer comes back in the same borrowed words, it is not theirs yet. Say so warmly
  and let them choose again. Do not accept a well-behaved goal.

  ### Do not fix their goal for them

  You will see goals you would have set differently. Unless a goal fails a test or is outside the
  learner's control, leave it. A slightly worse goal that belongs to the learner beats a better one
  that belongs to you — the whole component is about who is deciding.

  Where a goal is genuinely too big or depends on someone else's decision, do not correct it: ask what
  the first piece of it would be that is theirs to take, and let that be the goal.

  ### Draw it, do not write it

  Learners draw the thing they want to be able to do — themselves doing it. This is not a concession to
  low literacy; a picture of yourself doing the thing is more motivating than a sentence about it, and
  it is what they will turn back to when a week goes badly.

  ### Say it aloud to a partner

  A goal said to another person is much more likely to be pursued, and saying it aloud is where a vague
  goal becomes specific — the partner's blank face does the work you would otherwise have to do.

  ## Before they leave this block

  - One goal per learner, drawn, that passes the four tests.
  - Each learner can say why it matters TO THEM, in their own words, without hesitating.
  - The goal is within their control, and connected to something on their profile.
  - It has been said out loud to a partner.
learnerTeaching:
  title: "How to choose a goal that is really yours"
  readAloud: |
    ## How to choose a goal that is really yours

    Now you choose. This is the important moment in the whole course, so take your time over it.

    ### Start from your own pages, not from nothing

    Turn back through your book. Look at:

    - What you are good at.
    - What you said you want to get better at.
    - How you learn best.

    Your goal should come from there. A goal that has nothing to do with any of it is usually not
    really yours.

    ### The test: can you say why it matters to YOU?

    This is the one that decides everything.

    Ask yourself: **what would actually be different for me if I could do this?**

    If you can answer with something real — something you could do, someone you could talk to,
    somewhere you could go — then it is your goal. Good.

    If the answer is vague, or if it sounds like something a teacher would like to hear, choose again.
    That is not a failure. It is much better to find out now than in six weeks.

    **Nobody is marking your goal.** It does not have to be impressive. It has to be yours.

    ### Choose something YOU can decide

    Remember: some things are decided by other people. Make your goal the part that is in your hands.

    ### Draw it

    Draw **yourself doing the thing**. Not the words — you doing it.

    This matters more than it sounds. On a week when everything goes wrong, you will turn back to this
    page. A picture of yourself doing it pulls harder than a sentence about it.

    ### Say it out loud to a partner

    Tell someone your goal, out loud.

    Two things happen. It becomes more real. And if their face goes blank, your goal was not clear
    enough yet — so say it again, better. That is useful, not embarrassing.
  words:
    - term: my goal
      meaning: the thing YOU chose that you want to be able to do
    - term: matters to me
      meaning: something would really be different for you if you did it
worksheet:
  slug: cb-ail-my-goal-page
  note: "In the learner's book (My Learning Book): the 'My goal' page. Print one per learner."
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  - control-of-future-pathways
  how: >-
    Choosing your own small, meaningful learning goal is the moment a learner takes the wheel of their
    own growth rather than waiting to be told what to learn. In a place where much is outside their
    control, their own learning is a thing they can direct, and the goal keeps that direction in their
    hands. It is a pathway move as much as a self-direction one: the goal a learner chooses is the first
    piece of a future they picked rather than were assigned.
principlesForegrounded:
- builds-on-identities
- recognise-communicate-growth
- lifeworthy-competencies
principleAlignment:
- principle: builds-on-identities
  how: >-
    The goal grows from the learner's own Learner Profile and their own reasons, in their own words, and
    the facilitator is warned off tidying it into someone else's language, so it is anchored in the learner.
- principle: recognise-communicate-growth
  how: >-
    Drawing a goal and saying it aloud to a partner is a learner's act of naming what they want to grow
    towards, the habit of recognising and communicating their own learning this component keeps building.
- principle: lifeworthy-competencies
  how: >-
    Turning a vague wish into one small, clear goal you actually pursue is a habit a learner will reuse
    across study, work and life, which is what makes it worth practising here.
competencyCodes:
- FSL2
- FSL1
competencyDevelopment:
- code: FSL2
  how: >-
    Turning a rough wish into a small, clear learning goal a learner cares about is the core of setting
    goals; the drawn goal and the reasons behind it are the evidence a learner can establish an objective
    for their own learning.
- code: FSL1
  how: >-
    Choosing a goal that genuinely matters to them, from their own Learner Profile, requires learners to
    reflect on where they are now and what they want, which develops self-reflection.
