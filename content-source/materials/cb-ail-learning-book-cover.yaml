id: cb-ail-learning-book-cover
slug: cb-ail-learning-book-cover
access: partner
edition: learning-bridge-coxs-bazar
type: resource
title: "My Learning Book — the cover"
summary: >-
  The front of the learner's own book: their name or mark, where they are from, and the promise that nothing in it is marked right or wrong.
facilitationContext:
- group
- independent
primaryContext: independent
learnerContent: |
  ## My Learning Book — the cover

  This page is yours. You can draw, write, or say your answer — someone will write it for you if you
  ask — and nobody marks it right or wrong.

  - Put your name, or your own mark, on the front.
  - Say where you are from.
  - Read the promise: you can draw, write, or say every answer, and nobody marks this book.
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  how: >-
    Keeping their own record of what they decided, and why, is what lets a learner carry a goal
    between sessions without an adult holding it for them.
