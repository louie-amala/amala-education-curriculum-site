# English for Impact — My Voice (Unit 1) authentic project activity.
# Source: LLL Course Guide Unit 1 Authentic Learning Project "My Voice, My Name" (pp. 18, 25, 27).
id: efi-mv-project-my-name-my-voice
slug: efi-mv-project-my-name-my-voice
access: public
type: activity
title: "Project: My Voice, My Name — a personal identity artifact"
summary: >-
  The Unit 1 authentic project. Learners create a personal artifact that represents who they are —
  using the alphabet, key sounds, and simple sentences — then present it to an audience in a "My Name,
  My Voice" sharing, bringing together everything they have learned in the unit.
facilitationContext: [group, independent]
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed, over several sessions. The group is the audience and the support: learners plan and
    make their artifacts alongside each other and share them in a class "My Name, My Voice" event.
- context: independent
  how: >-
    A learner can make their artifact independently between sessions, but the sharing needs an
    audience — arrange for them to present to a mentor, a small group, or family so the communicative
    purpose is real.
duration: "3–5 hours across several sessions (planning, making, presenting)"
grouping: "Individual artifact, shared in pairs/small groups then the whole class; works with 10–35 learners"
whatLearnersDo:
- Plan a personal identity artifact — the words, pictures, and sentences that represent who they are.
- Use the alphabet, key sounds, and simple sentences to build the written part.
- Design and make the artifact (a poster, card, drawing, object, or digital page).
- Prepare and give a short "My Name, My Voice" presentation to an audience.
materialsAndPreparation:
- Materials for making — paper, colours, magazines to cut, or a simple device if available.
- The learner's own writing from earlier in the unit, the sentence frames, and the Phonics Table.
- The "identity artifact" idea shown with one or two examples (make your own to model).
- "Sensitivity: identity can touch on family, home, and displacement. Let learners choose what to include and share; never require anything personal."
facilitationNotes: |
  This project is where the whole unit comes together and where learners feel the point of it: they use
  their new English to say who they are, to real people. Keep ownership with the learner — they choose
  what represents them, in their own words and images, and how much to share. Model with your own
  artifact so the task is concrete, but make clear there is no single right form: a poster, a folded
  card, a drawing, an object with labels, or a digital page all work. Hold the language expectations at
  Unit 1 level — a few simple, true sentences (I am…, I am from…, I like…) plus meaningful words and
  images is a full success. Protect the sharing as a warm, supportive event, not a test. Because it can
  touch on home and displacement, let learners keep anything private and choose a lighter focus if they
  prefer.
steps:
- title: "Understand the project and plan"
  duration: "35–45 min"
  guidance: |
    Show your own example artifact and explain the task: make something that shows who you are, using
    English words, pictures, and a few simple sentences. Learners plan on paper — which words, images,
    and sentences they want to include — drawing on their writing from earlier in the unit and the
    frames. Reassure them they choose what to share.
  keyPrompts:
  - What are the most important things about you that you want to show?
  - Which words, pictures, and sentences will you use?
  - What do you want to keep just for yourself?
  watchOuts:
  - Learners feeling they must reveal difficult personal history; make clear a simple, everyday focus (interests, languages, hopes) is completely fine.
  adaptation: |
    With few materials, the artifact can be a single sheet with drawings and labelled words; the
    planning is the same.
- title: "Make your artifact"
  duration: "60–90 min (may span sessions)"
  guidance: |
    Learners make their artifacts, writing the words and sentences and adding images. Circulate to help
    with spelling (point to the Phonics Table), sentence frames, and encouragement. Keep the language
    at unit level — a few clear, true sentences and meaningful words is the target, not a paragraph.
  keyPrompts:
  - Are your sentences true for you? Do they use the frames you know?
  - Which picture or word best shows this part of you?
  watchOuts:
  - Perfectionism or over-ambition in English; steer learners to what they can say well now and celebrate it.
  adaptation: |
    Learners who write slowly can label images with single words and say the full sentences aloud in
    the presentation instead.
- title: "Prepare your presentation"
  duration: "30–40 min"
  guidance: |
    Learners prepare to present their artifact in a few sentences: their name, a little about
    themselves, and one or two things they chose to include. They rehearse in pairs first — this makes
    the whole-group sharing far less frightening. Remind them that being understood, not being perfect,
    is the goal.
  keyPrompts:
  - What three or four sentences will you say about your artifact?
  - Practise with your partner — did they understand you?
  watchOuts:
  - Reading stiffly from the page; encourage a glance-and-speak so they connect with the audience, but reading is fine if it builds confidence.
  adaptation: |
    A very nervous learner can present to just their partner or a small group rather than the whole
    class; the audience is still real.
- title: "My Name, My Voice — share"
  duration: "45–60 min"
  guidance: |
    Hold the "My Name, My Voice" sharing. Each learner presents their artifact to the group (or a small
    group). Keep the atmosphere warm — applause, no correction during sharing, one kind response from
    the audience. This is the authentic audience and purpose that the whole unit has built toward.
  keyPrompts:
  - Tell us your name and one thing about you.
  - "Audience: what is one thing you liked or learned about your classmate?"
  watchOuts:
  - Turning it into an assessment moment that raises the pressure; keep feedback and grading separate from the sharing itself (use the Can-Do checklist afterwards).
closing: |
  Thank every learner for sharing. Display the artifacts if learners are willing. Return to the unit's
  question — "What is my identity, and how do I share it?" — and note that they have just answered it in
  English. Learners complete the "I can now…" Can-Do checklist to recognise their growth.
agencyContribution:
  indicators: [power-over-wellbeing-and-self-direction, control-of-future-pathways, contribution-to-community]
  how: >-
    Choosing what represents you and presenting it, in your own words, to an audience is a real act of
    self-representation and voice. Learners decide how they are seen and are heard by others — and in
    sharing, they contribute their story to the group and help build the community they are part of.
principlesForegrounded: [builds-on-identities, authentic-challenges, safe-spaces, recognise-communicate-growth]
principleAlignment:
- principle: builds-on-identities
  how: >-
    The entire project is the learner's own identity, in words and images they choose; it is the
    clearest expression of building outward from who the learner is.
- principle: authentic-challenges
  how: >-
    The artifact is made for a real audience and a real purpose — to introduce oneself and be known —
    not as an exercise for the teacher alone.
- principle: safe-spaces
  how: >-
    Learners choose what to include and share, difficult history is never required, and the sharing is
    kept warm and free of correction, so presenting feels safe.
- principle: recognise-communicate-growth
  how: >-
    The project gathers the whole unit's learning into one visible piece, and the closing Can-Do
    reflection lets learners recognise and name how far they have come.
competencyCodes: [FUS1, FLC3]
competencyDevelopment:
- code: FUS1
  how: >-
    Deciding what represents them and shaping it into an artifact is sustained work of self-awareness —
    the project is the unit's main evidence of learners developing and expressing their identity.
- code: FLC3
  how: >-
    Presenting the artifact to an audience in simple, clear English is direct evidence of communicating
    who they are to others.
