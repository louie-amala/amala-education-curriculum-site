# English for Impact — My Voice (Unit 1) teaching activity. Phonics Part 1.
# Source: LLL Course Guide Unit 1 phonics focus + Phonics Progression Part 1 (pp. 25, 49).
# Approach grounded in LESLLA practice for older learners: oral first, a few sounds + one short vowel
# at a time, decode CVC words, use meaningful words; these learners are literate in their Home
# Language(s), so this is literacy transfer, not emergent literacy.
id: efi-mv-alphabet-and-first-sounds
slug: efi-mv-alphabet-and-first-sounds
access: public
type: activity
title: "The alphabet and your first English sounds"
summary: >-
  Learners meet the English alphabet and their first sound–letter links — short vowels a, o, u and the
  consonants s, t, l, m, n — and use them to read and build their first simple words, starting their
  own Phonics Table.
facilitationContext: [group, independent]
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners hear each sound, say it together, then find it in real words — ideally their
    own names and words they know. Keep the pace brisk: these learners already read and write in their
    Home Language(s), so the work is linking known ideas to new letters, not learning to read from zero.
- context: independent
  how: >-
    Workable as review. A learner alone can practise letter–sound links and CVC reading with a word
    list and the Phonics Table, but the oral, hear-and-say part is much stronger with a partner or
    audio; pair the independent practice with a later speaking check.
duration: "45–60 min facilitated, plus independent practice"
grouping: "Whole group for sounds, then pairs for reading; works with 10–35 learners"
whatLearnersDo:
- Hear, say, and recognise the letters of the English alphabet.
- Learn the difference between vowels and consonants, and the short sounds of a, o, u.
- Read and build simple CVC words (e.g. sat, mat, sun) from the sounds s, t, l, m, n.
- Start their own Phonics Table with the first sounds and their own example words.
materialsAndPreparation:
- Alphabet cards or a visible alphabet display, and objects or pictures for example words.
- A blank Phonics Table for each learner (see the "Phonics Table (build your own)" resource).
- Your own example words for each sound, ideally including learners' names and familiar words.
- "Optional: letter tiles, or small cards learners can move to build CVC words without writing."
facilitationNotes: |
  These learners can already read and write in their Home Language(s); your job is to link the sounds
  of English to its letters, not to teach reading from scratch. Lead with the ear: say a sound, have
  learners say it back, then show the letter and find the sound in real words. Teach a few consonants
  with one short vowel so learners can immediately read whole words (s, t, l, m, n + short a give sat,
  mat, tan, lam…), which is far more motivating than letters in isolation. Use learners' own names and
  familiar words wherever you can. Welcome translanguaging — comparing an English sound to one in a
  Home Language helps it stick. Keep it low-pressure and celebrate the first words read.
steps:
- title: "Meet the alphabet — by ear first"
  duration: "12–15 min"
  guidance: |
    Say the name and sound of each letter and have learners repeat, pointing to the letter as you go.
    Do not drill all 26 to mastery — the aim is familiarity and the idea that letters carry sounds.
    Ask learners which letters look or sound like ones in their Home Language(s), and let them say so;
    those bridges speed everything up.
  keyPrompts:
  - What sound does this letter make? Can you say it with me?
  - Is there a letter or sound like this in a language you already know?
  - Which letters are in your own name?
  watchOuts:
  - Treating this like a children's alphabet song; keep it adult and useful by tying letters straight to real words and names.
  adaptation: |
    With no cards, write letters large on paper or in the dirt/board; the hear-and-say still works with
    nothing but your voice and learners' voices.
- title: "Vowels, consonants, and three short vowel sounds"
  duration: "12–15 min"
  guidance: |
    Explain simply that vowels (a, e, i, o, u) open the mouth and are the centre of most words, and
    consonants are the sounds around them. Focus on the short sounds of a, o, u (as in ant, orange,
    umbrella). Say each, have learners say it, and collect a couple of example words for each — adding
    them to the Phonics Table.
  keyPrompts:
  - What is your mouth doing when you say this vowel?
  - What word do you know with this sound in it?
  watchOuts:
  - Confusing the letter name with the sound; keep returning to the sound the letter makes in a word.
  adaptation: |
    Use a small mirror or have learners watch each other's mouths to notice the vowel shapes; no
    materials needed.
- title: "Build your first words"
  duration: "15–20 min"
  guidance: |
    Introduce the consonants s, t, l, m, n by sound. Then model blending: s–a–t → "sat". Have learners
    build and read simple CVC words with letter tiles, cards, or writing — sat, mat, tan, lot, sun,
    nut. Keep every word real and sayable; act them out or picture them. Note the hard "k" sound
    (c, k, ck) if it comes up in a learner's name or word.
  keyPrompts:
  - What sound comes first? Next? Last? Now say them together — what word is it?
  - Can you make another word by changing just the first sound?
  watchOuts:
  - Dropping the final consonant (saying "sa" for "sat"); English marks meaning at the end of words, so gently insist on the final sound (sun vs sup).
  adaptation: |
    No tiles? Learners write the three letters on separate scraps and slide them together, or build the
    word aloud in a pair while one points to letters on a shared sheet.
closing: |
  Have a few learners read a word they built and add it to their Phonics Table with a small drawing or
  their own translation. Confirm the table is theirs to grow all course long. End on the win: in one
  session they have read their first English words.
agencyContribution:
  indicators: [control-of-future-pathways]
  how: >-
    Decoding is the key that unlocks reading and writing, and reading and writing are the gateway to
    further study and work. Learning to turn English letters into sounds and sounds into words puts
    that key in the learner's own hands from the very first session.
principlesForegrounded: [builds-on-identities, safe-spaces, lifeworthy-competencies]
principleAlignment:
- principle: builds-on-identities
  how: >-
    Sounds are taught through learners' own names and familiar words, and translanguaging invites them
    to bridge from the languages and literacy they already have.
- principle: safe-spaces
  how: >-
    The activity is low-pressure and success-oriented — hear, say, build — with errors treated as a
    normal part of learning, so beginners feel safe to try aloud.
- principle: lifeworthy-competencies
  how: >-
    Letter–sound knowledge and CVC decoding are foundational literacy skills learners reuse across
    every later unit and beyond the classroom.
competencyCodes: [FLC3]
competencyDevelopment:
- code: FLC3
  how: >-
    Beginning to decode and pronounce English words is the ground floor of reading, writing, and
    speaking so as to be understood — the start of communication in the new language.
