  holder: "UC Berkeley YPAR Hub; credited by the source to Youth in Focus (Youth REP: Step by Step) and Stanford's John W. Gardner Center (YELL)"
  basis: >-
    Four corners is a widely used classroom method with no single owner, and every word on this page
    is written from scratch. None of the YPAR Hub's wording or example statements is reproduced; the
    statements suggested here are Amala's own and are written for Amala's cohorts.
  note: >-
    Do not copy the source's example statements onto this page. Several of them assume a United States
    school context (going to college, the local community) that does not travel.
