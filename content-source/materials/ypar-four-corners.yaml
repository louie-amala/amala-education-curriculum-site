provenanceNote: >-
  Separated out from the YPAR Hub's "Getting to Know Each Other" lesson plan, supplied to Amala in
  August 2026, because four corners and the question wheel are stance-taking tools rather than
  introductions and earn a page of their own. The remaining activities from that plan are at
  [getting to know each other](/materials/ypar-getting-to-know-each-other). The statement-writing
  guidance, the ordering of the steps and the before-and-after use are Amala's.
