# Student worksheet for cb-mv-sentence-practice. A thin, visual-first resource — the "Building sentences"
# sheet from the downloadable Student My Voice book (workbook). Word cards/spaces to build a sentence
# (I / am / from / ___), and a simple am/is/are choosing task done by ear or by picture. No fluent
# reading assumed. Objective 2.
