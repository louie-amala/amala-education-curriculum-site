provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, an adaptation, delivery
  modes and a sensitivity note) from the Design Challenge activity guide, which supplied the purpose
  and the breakout discussion questions. The source project investigates the mental health and
  wellbeing of Afghan females and uses Islam as its worked example; this material keeps Islam as the
  primary example but is framed as "faith and belief" so it generalises, with a localisation note that
  religious claims should be checked with knowledgeable community sources and adapted to the learners'
  own faith context. Linked to Research Project objective 1.
