provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, low-bandwidth
  adaptations, delivery-mode notes, and agency/principle/competency explanations) from the Design
  Challenge activity guide, which supplied the purpose, the individual reflection and the breakout
  discussion questions. The five-stage cycle and its human-centred, iterative framing are drawn out
  from the design thinking resources the guide points learners to. The source Design Challenge
  investigates the mental health and wellbeing of Afghan females; this material is written to
  generalise to any design challenge, with that as the worked example. Linked to Research Project
  objective 1 (framing a real-world challenge into a researchable focus) and Social Entrepreneurship
  objective 2 (developing an ethical solution concept).
