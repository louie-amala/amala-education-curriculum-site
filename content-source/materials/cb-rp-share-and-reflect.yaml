agencyContribution:
  indicators:
  - control-of-future-pathways
  - power-over-wellbeing-and-self-direction
  - contribution-to-community
  how: >-
    Learners share findings about a real, shared challenge with an audience of their choosing, and read
    their own growth as researchers. Seeing that finding out for themselves, rather than guessing, is a
    power they can carry into any question that matters to their lives and community.
principlesForegrounded: [recognise-communicate-growth, connect-to-futures, safe-spaces]
principleAlignment:
- principle: recognise-communicate-growth
  how: The whole close is about seeing and naming growth, learners revisit their starting mark, look back through their research book, and name for themselves how far they have moved.
- principle: connect-to-futures
  how: Learners leave knowing that finding out carefully, rather than guessing, is a way of working they can carry into any future question or challenge they care about.
- principle: safe-spaces
  how: No learner is forced to present in a way that is unsafe for them; showing, telling from a seat, or sharing alongside a friend are all named as real ways to share, with referral guidance to hand.
competencyCodes: [FSI1, FSL1]
competencyDevelopment:
- code: FSI1
  how: Sharing the output and answering questions about it is the final act of the investigation, and, with the whole research book, is the evidence the educator reads to judge each learner's proficiency in investigating real-world issues.
- code: FSL1
  how: Learners look back over their own journey and their starting growth-path mark, and name honestly how they have grown as researchers. Self-reflection on their own learning.
