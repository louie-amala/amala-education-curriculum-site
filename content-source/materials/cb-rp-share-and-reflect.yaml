provenanceNote: >-
  Authored consolidation activity that closes the Learning Bridge+ (Cox's Bazar) Research Project edition.
  Realises the "Share our findings, and look back" block of the Showcase and reflect phase: a warm,
  celebratory sharing to a chosen audience, then a look back through the research book and the
  cb-rp-researcher-growth-path self-check. On Learning Bridge+, the point at which the educator gathers
  the evidence for the FSI1 assessment judgement, made against Amala's proficiency scale rather than from
  the final output alone. Fully offline, oral and visual first. Its printable reflection page compiles
  into the Research Project student workbook.
