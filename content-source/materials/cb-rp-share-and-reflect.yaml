# Contextualised, fully offline CONSOLIDATION activity that closes the Research Project component of
# Learning Bridge+ (Cox's Bazar). Learners share their research output with the audience they chose and
# answer questions (no one forced to present unsafely), then look back through the research book and the
# "Where I am as a researcher" growth path, and name one way they have grown. Showcase and reflect phase.
# On Learning Bridge+, this is where the educator gathers the evidence for the FSI1 assessment judgement.
id: cb-rp-share-and-reflect
slug: cb-rp-share-and-reflect
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "Share our findings, and look back"
summary: >-
  The warm, celebratory close of the course: learners share what they found with the audience they chose
  and answer questions about it, no one forced to present in a way that is unsafe for them, then look
  back through their research book and their growth path, and name one way they have grown as a researcher.
facilitationContext:
- group
- independent
primaryContext: group
duration: "2.5 hours facilitated + 3 hours independent"
grouping: "Whole group for the sharing; individual for the looking-back and the growth mark"
whatLearnersDo:
- Share their research output with the real audience they chose, in the way they chose. Showing, telling, or with a friend beside them.
- Answer questions from the audience about what they found and what it means.
- Look back through their research book, from the very first page, and see how far the work has come.
- Return to the "Where I am as a researcher" growth path they marked at the start, mark where they are now, and name one way they have moved from guessing to finding out.
materialsAndPreparation:
- Each learner's or group's research output, ready to share, and the space set up warmly for the audience they chose.
- Every learner's research book, so they can look back from the first page.
- The "Where I am as a researcher" growth-path page (cb-rp-researcher-growth-path) each learner marked at the start of the course.
- The "how I have grown as a researcher" reflection page from the research book (one per learner).
- Step-back and referral guidance to hand, in case the sharing or looking-back touches a hard memory.
