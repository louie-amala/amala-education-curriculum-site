facilitationNotes: >-
  The one thing to get right: this is a celebration, not an exam. Every learner has grown, and the day is
  for showing that, warmly and together. No one is forced to present in a way that is unsafe for them, 
  showing without speaking, telling from their seat, or having a friend speak alongside are all real ways
  to share. On Learning Bridge+, this is also the point where you gather and record the evidence of each
  learner's growth in investigating real-world issues (FSI1): their question and plan, their evidence log,
  how they made sense of what they found, their output, and how they answer questions about it. Gather
  this across the whole course from the research book, not from the final output alone, and make the
  judgement against Amala's proficiency scale, by your own reading of the whole picture, not a mark
  scored off one performance.
steps:
- title: "Share our findings"
  duration: "60 min"
  guidance: >-
    Hold the sharing warmly. Each learner or group shares their output with the audience they chose, in
    the way they chose. Showing a drawing or model, telling the one thing they most want people to
    understand, or being alongside a friend who speaks with them. Make it safe: no one is made to stand
    and speak alone if that is not safe for them. Celebrate each sharing before moving to the next.
  keyPrompts:
  - "What did you want people to understand about our hills?"
  - "What is the one thing you found that you are proudest of?"
  watchOuts:
  - "Do not push a reluctant learner to the front; a quiet way to share is still sharing, and still evidence."
- title: "Answer questions from our audience"
  duration: "30 min"
  guidance: >-
    Invite the audience to ask gentle, real questions, and help learners answer them. How a learner
    responds, pointing back to their evidence, saying what they are still not sure about, is some of the
    richest evidence of how they have grown as a researcher, so give it time and warmth. Rephrase or
    translate questions where needed so no learner is caught out by the English.
  keyPrompts:
  - "Where in your research did you find that?"
  - "What is one thing you are still not sure about?"
- title: "Look back through our research book"
  duration: "30 min"
  guidance: >-
    Each learner turns through their research book from the very first page, their first thoughts about
    the hills, their question, their evidence log, what they worked out, their output. Give them quiet
    time to see the whole journey. Draw out, gently, how much is there now that was not there on the first
    day.
  keyPrompts:
  - "Look at your first page. What did you think about our hills back then?"
  - "What can you do now, as a researcher, that you could not do on the first day?"
- title: "Mark how far we have come"
  duration: "30 min"
  guidance: >-
    Bring back the "Where I am as a researcher" growth path each learner marked at the start. Each learner
    marks where they feel they are now, sees the distance from their first mark, and names, by drawing and
    speaking, one way they have moved from guessing to finding out. This is theirs to keep, and yours to
    read as evidence of growth.
  keyPrompts:
  - "Look at the mark you made on the first day. Where are you now?"
  - "Name one way you have moved from guessing to finding out."
closing: >-
  Close the course the way it deserves, with warmth and pride. Every learner started somewhere on the
  path and every learner has moved. Name that out loud, together: we did not guess about our hills, we
  went and found out, and we shared it. Send them off knowing they are researchers now, and that this is a
  way of finding out they can carry into anything they want to understand.
learnerContent: |
  ## Sharing what we found, and looking back

  Today we share what we found out about our hills with the people we chose, and we celebrate the work we
  did together.

  You can share in the way that is right for you, showing your drawing or model, telling the one thing
  you most want people to understand, or having a friend beside you. There is no wrong way to share.

  Then we look back. Turn through your research book, from the very first page. See how far you have come
  since the first day, when we only wondered about our hills.

  Last, look again at the growth path you marked at the start. "Where I am as a researcher". Mark where
  you are now, and name one way you have grown: how you moved from guessing to finding out. You are a
  researcher now.

educatorContent: |
  ## What you need to know before you teach this

  Two things happen here and both need protecting: the sharing itself, and the looking back. Time runs
  out at the end of a course, and the reflection is what gets cut, which is precisely the part that
  carries the assessment evidence.

  ### The sharing is the programme showcase

  In this edition this block is the spine of the single closing event, with the My Voice cards and the
  growth statements folded in, and guests each learner invited themselves. See the showcase guidance.
  Plan it with your coordinator well ahead, invitations have to go out.

  ### Answering questions is the assessment, more than the poster

  A learner who made a beautiful output and cannot say how they know is showing something different
  from a learner with a rough poster and a clear rationale. Ask questions yourself if the audience is
  gentle, and write down what learners say the same day. This is your last and best FSI1 evidence.

  ### Then the looking back, and it must run on the book

  Ask "have you grown as a researcher?" and you will get shrugs. So do it physically: turn back through
  the research book from page one, in order. The pages argue better than any question.

  Then the growth path they marked at the start, marked again with a different mark, so both are
  visible. Name the movement out loud, from guessing to finding out.

  ### The three questions that produce real answers

  - What can you do now that you could not do at the start?
  - What was hard, and what did you do about it?
  - What would you still like to find out?

  The second is the one that shows the competency and the one you most want on record.

  ### Nobody presents in a way that is unsafe for them

  Same-gender grouping, presenting with a group rather than alone, showing rather than speaking,
  presenting to a partner or a mentor only. All full successes. Say so before the day, not on it.

  ## Before they leave this block

  - Every learner has shared something, in a way that was safe for them.
  - Every learner has answered at least one question about their research.
  - Growth paths marked a second time, both marks visible.
  - You have their words written down.
learnerTeaching:
  title: "How to look back at what we did"
  readAloud: |
    ## How to look back

    We have shared what we found. Now we look back at ourselves, and this is not a small thing at the
    end of the course. It is part of the work.

    ### Why look back at all

    Because if you cannot see that you changed, you will not believe you can change again. And then the
    next hard thing will feel pointless.

    ### Do not ask your feeling. Open your book.

    If you just ask yourself "am I better at this?", you will probably say not really. Everyone does.

    So instead: **open your research book at the first page and turn through it slowly.**

    Look at what you wrote about our hills before we started. Look at your first questions. Look at
    what you brought back from your interviews. Look at your insights.

    You did all of that. The pages will tell you the truth better than your feeling will.

    ### Mark the path again

    Find the page where you marked what a researcher does, right at the beginning of the course.

    Mark it again, with a different mark, so you can see both.

    Look at the two marks together. That distance is yours, and nobody can take it off you.

    ### Three questions

    Answer these out loud, or by drawing:

    1. **What can I do now that I could not do at the start?**
    2. **What was hard, and what did I DO about it?**
    3. **What would I still like to find out?**

    The second one matters most. Anyone can have an easy week. What shows you have really become a
    researcher is what you did when it went wrong, when someone said no, when the rain stopped you,
    when the evidence did not agree.

    ### The thing you are taking with you

    You started this course finding things out by guessing or by asking around. You are leaving it able
    to ask a real question, go and find out, weigh what you find, and say what it means.

    That works on anything. Not only trees. Anything in your life you want to understand properly.
    Nobody has to give you permission to use it.
  words:
    - term: reflect
      meaning: to look back at what you did and work out what changed
    - term: growth
      meaning: the distance between what you could do before and what you can do now
