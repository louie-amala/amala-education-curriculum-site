# Facilitator safeguarding & protection resource for the Agency in Learning component of Learning
# Bridge+ (Cox's Bazar). The Research Project has one of these; Agency in Learning did not - even
# though its activities ask learners about their strengths, their families, their futures, and times
# they failed, all of which touch loss and displacement. Sibling of cb-rp-safeguarding-and-protection.
