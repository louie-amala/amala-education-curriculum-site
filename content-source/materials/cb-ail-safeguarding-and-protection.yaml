title: "Safeguarding and protection in Agency in Learning"
summary: >-
  The protection guidance this component depends on, in one place: why goal-setting is sensitive ground
  here, the activities that most often surface something, the step-back routine, how to keep goals
  inside a learner's control, and the referral pathway.
