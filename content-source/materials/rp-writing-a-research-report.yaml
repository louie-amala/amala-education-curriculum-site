provenanceNote: >-
  Authored from Research Project objective 4 (communicate findings and actionable insights to an
  audience), which was thin on facilitation material. Written as a generic write-up activity that any
  cohort investigating a shared challenge can use, structuring findings into a report anchored to the
  learner's own evidence log and insights statement. Linked to Research Project objective 4 and
  competencies FLC3 (influential communication) and FSI1 (investigate real-world issues).
