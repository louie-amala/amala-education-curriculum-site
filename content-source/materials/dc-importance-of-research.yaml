provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, adaptations and
  delivery modes) from the Design Challenge activity guide, which supplied the purpose, the stimulus
  and the breakout discussion questions. The source Design Challenge investigates the mental health
  and wellbeing of Afghan females; this material is written to generalise to any real-world challenge.
  Linked to Research Project objective 1 (framing a real-world challenge).
