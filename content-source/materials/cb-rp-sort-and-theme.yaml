  slug: cb-rp-our-themes
  note: "In the research book (student workbook): the 'Our themes — what keeps coming up' page. Print one per learner."
agencyContribution:
  indicators:
  - contribution-to-community
  - control-of-future-pathways
  how: >-
    Turning a pile of evidence into named patterns is how a researcher makes sense of a real community
    challenge — a way of thinking learners can use again on any question that matters to them, so their
    understanding rests on what the evidence shows, not on a first impression.
principlesForegrounded: [feedback-and-data, authentic-challenges, responsible-action]
principleAlignment:
- principle: feedback-and-data
  how: The themes come from grouping the actual evidence and seeing where it agrees and disagrees, not from what learners assumed at the start.
- principle: authentic-challenges
  how: The evidence being sorted is about the real hills the learners live on, so the patterns that emerge matter.
- principle: responsible-action
  how: Naming patterns and contributing factors from the evidence is the groundwork for any action that is fair to what was actually found.
competencyCodes: [FSI1, ATS1, APS3]
competencyDevelopment:
- code: FSI1
  how: Making sense of the gathered evidence is part of conducting the investigation.
- code: ATS1
  how: Sorting and grouping the evidence is analysing and interpreting the data the group collected.
- code: APS3
  how: Naming the clusters is pattern identification — seeing what keeps coming up and where sources agree or disagree.
