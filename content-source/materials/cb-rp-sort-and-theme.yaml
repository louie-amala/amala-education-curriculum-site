# Contextualised, fully offline ANALYSIS activity for the Research Project component of Learning Bridge+
# (Cox's Bazar). Learners physically group their evidence — cards, drawings, marks — into themes on the
# floor or wall and name each cluster; out of this come patterns, trends, and contributing factors. The
# sorting IS the analysis. Evaluate evidence phase (objective 3). Oral and visual first; hands-on.
id: cb-rp-sort-and-theme
slug: cb-rp-sort-and-theme
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "Sort and theme what we found"
summary: >-
  Learners organise all their evidence — primary and secondary — so that patterns can be seen: they
  physically group cards, drawings, and marks into themes on the floor or wall and name each cluster.
  Out of this come the patterns, trends, and contributing factors — what many people said, where sources
  agree or disagree, what keeps coming up.
facilitationContext:
- group
- independent
primaryContext: group
duration: "2 hours facilitated + 1.5 hours independent"
grouping: "Whole group around a shared floor or wall space; pairs to prepare cards"
whatLearnersDo:
- Turn each piece of evidence into a card, drawing, or mark that can be moved and grouped.
- Physically group the cards into clusters on the floor or wall, moving them until the groups feel right.
- Give each cluster a name — a theme — in words or a drawing.
- "Notice the patterns: what keeps coming up, where sources agree or disagree, what seems to cause what."
materialsAndPreparation:
- The evidence log and the weighed evidence from the earlier activities.
- Cards, paper scraps, or sticky notes, and pens — one idea per card.
- A large clear floor or wall where the whole group can see and reach the cards.
- The "our themes" sheet from the research book (one per learner), to record the clusters at the end.
