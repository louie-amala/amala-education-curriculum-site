learnerContent: |
  ## Asking permission

  Before we ask anyone anything, we ask their permission. Say it in your own words, warmly. The sheet
  gives you the words to practise:

  - "May I ask you some questions?"
  - "It is for our group's project about our hills."
  - "You do not have to answer, and you can stop any time."

  And the rules to keep every time:

  - Ask first, and say why.
  - Use no names — never say or write who told you.
  - Let the person stop whenever they want.
  - Keep everyone safe — never put another person, or yourself, at risk.

  There is space to write or draw the words in your own language, so they are ready in your mouth. Keep
  this page in your research book and look at it before every time you go to ask.
