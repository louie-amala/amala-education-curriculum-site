- The meeting people prompt cards from the My Voice book, one set per pair.
facilitationNotes: |
  These cards only prompt the spoken role-play in cb-mv-meeting-people-role-play — the exchange is still
  learned by ear from your modelling. The pictures give a pair a reminder of the shape (hello, name,
  where from, goodbye) so they can run the meeting without you. Nothing on the cards needs reading. The
  printable page lives in the Student My Voice book (workbook) as the "Meeting people" prompt cards.
educatorContent: |
  ## How to use the meeting people prompt cards

  Use these cards with cb-mv-meeting-people-role-play, after learners have met the exchange by ear from
  your modelling. They are picture prompts, not a script:

  - A small strip of pictures shows the shape of a first meeting in order — two people waving hello, a
    face with a name-picture, a little map or place-picture for "where are you from", two people waving
    goodbye. Empty speech shapes over the two people cue "now someone speaks", without any words to read.
  - A "this is my friend" card shows three people, so a pair can add the introducing-a-friend move.

  Hand one set to each same-gender pair as a memory aid for running the meeting themselves. The pictures
  carry the order; the words stay in the ear. No reading is required to use them.

  It is incorporated into the downloadable Student My Voice book (workbook), as the "Meeting people" prompt cards.
learnerContent: |
  ## Your meeting people prompt cards

  These cards help you and your partner practise meeting someone, without reading anything.

  - Follow the pictures. A little row of pictures shows the meeting in order — waving hello, saying your
    name, showing where you are from, waving goodbye. The empty speech shapes over the two people mean
    "now you speak".
  - Say it out loud. Take turns being each person, and say the words you have practised as you point along
    the pictures. There are no words on the cards to read — the pictures just remind you what comes next.
  - Add a friend. One card shows three people. Use it to introduce your friend — "this is my friend ___".

  You keep these cards in your My Voice book.
