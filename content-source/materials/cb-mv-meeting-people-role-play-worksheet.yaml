# Student worksheet for cb-mv-meeting-people-role-play. A thin, visual-first resource — the "Meeting
# people" prompt cards from the downloadable Student My Voice book (workbook). Simple picture prompt
# cards for a greeting role-play (two people, speech shapes) to support an oral activity; no reading
# required. Objective 2.
