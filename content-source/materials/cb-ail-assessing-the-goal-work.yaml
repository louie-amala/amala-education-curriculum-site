summary: >-
  The educator's guide to judging each learner's proficiency in Set and pursue goals (FSL2) - the anchor
  competency and one of the two certificated Learning Bridge+ competencies: what the competency looks
  like across the cycle, where the evidence lives, why Week 6 will look low, and how to judge.
