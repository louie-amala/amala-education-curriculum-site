id: pathways-producing-cover-letters
slug: pathways-producing-cover-letters
access: public
type: activity
title: Producing cover letters
summary: Learners write a high-impact cover letter tailored to one real opportunity, matching their
  strengths to what it asks for, structuring the argument, then sharpening it through feedback.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners draft in pairs so they can prompt each other for strengths worth naming and
    read each other's letters against the opportunity, then reflect as a group. Build in a short
    one-to-one feedback slot, since a cover letter improves most from specific comment on the actual
    text against the actual opportunity.
- context: one-to-one-mentoring
  how: >-
    A strong fit for the tailoring and feedback. A mentor works through the learner's draft against
    the specific opportunity, testing whether each claim answers something the opportunity asks for.
    Have the learner bring both the opportunity and a first draft so the session sharpens a real
    letter rather than starting one.
- context: independent
  how: >-
    Workable for the drafting, weaker for the feedback that makes a letter land. If a learner works
    alone, give them a checklist of what a strong paragraph does and the opportunity's requirements
    side by side, and arrange at least one round of feedback from a peer, mentor or facilitator
    before they send anything.
duration: 45-60 min facilitated, plus independent drafting
grouping: Pairs for drafting, whole group for reflection; works with 10-30 learners
whatLearnersDo:
- Pick one real opportunity and read what it actually asks for.
- Work through the cover-letter guidance and draft a letter tailored to that opportunity.
- Save your cover letter into your Pathways Journal so it is easy to find and adapt.
- Get feedback on your draft from a partner, mentor or facilitator, then make at least one change.
- Reflect on how a strong cover letter helps you access the pathways you are aiming for.
materialsAndPreparation:
- The cover-letter resource (video and slides) or your own worked walkthrough if you prefer to lead it live.
- One real or realistic opportunity per learner (a course, job or programme advert) to write towards.
- A simple cover-letter structure and one strong example, adapted to your context, for learners to model.
- The Pathways Journal for each learner to store and revisit their letter.
- "[to verify] Cover-letter conventions differ by country and sector (length, how formal, whether they are even expected, how to address the reader). Check what is normal for the pathways your learners are actually applying to, and tell them plainly, since a borrowed example can carry the wrong norms."
facilitationNotes: |
  A cover letter is where a learner argues, in their own voice, why they fit one specific
  opportunity. The one thing to get right is that it must be tailored: a generic letter that could be
  sent anywhere reads as sent by no one. Keep the actual opportunity in front of learners the whole
  time so every claim answers something it asks for. Learners also undersell themselves, so help them
  see that responsibilities, volunteering, languages and programme work are legitimate evidence.
  Feedback on the real draft against the real opportunity matters more than general advice, so protect
  time for it.
steps:
- title: Read the opportunity and set what a cover letter is for
  duration: 5-10 min
  guidance: |
    Start with the purpose: a cover letter is a short, honest argument for why this learner fits this
    opportunity. Have each learner read their chosen opportunity and underline what it asks for. Show
    one strong example and draw out how it answers a specific advert, not a generic one. Flag early
    that conventions vary by place, so the example models quality, not a fixed form.
  keyPrompts:
  - What is this opportunity actually asking for, in its own words?
  - What makes this example feel written for one opportunity rather than sent to everyone?
  - Who reads this letter alongside your CV, and what do you want them to think by the end?
  watchOuts:
  - Learners skim the advert and write towards a vague idea of the role; make them underline the stated requirements first and keep the advert visible while drafting so every claim has something to answer.
  adaptation: |
    With no way to show a video or slides, a single printed or hand-copied example letter and your
    spoken walkthrough of why it fits its opportunity is enough to run this step.
- title: Draft a tailored cover letter in pairs
  duration: 20-25 min
  guidance: |
    Learners draft a letter matching their strengths to what the opportunity asks for, working in
    pairs so each can prompt the other. The pair's job is to test tailoring ("which requirement does
    this line answer?") and to pull out evidence the writer undervalues: responsibilities at home,
    volunteering, languages, programme work. Ask learners to save the draft into their Pathways
    Journal so it becomes a document they adapt per application.
  keyPrompts:
  - For each thing the opportunity asks for, what is your best piece of evidence that you can offer it?
  - Where can you show a strength through something you did, rather than just claiming it?
  - Could this exact letter be sent to a different opportunity? If so, what needs to change?
  watchOuts:
  - Learners write one generic letter they mean to reuse everywhere; have the pair check each paragraph against a stated requirement and rewrite any sentence that would fit any opportunity equally.
  adaptation: |
    No devices needed for a first draft: learners can write the letter by hand against the structure
    and type it up later. If someone cannot pair up, they draft solo and you play the prompting partner.
- title: Give and get feedback on the draft
  duration: 15-20 min
  guidance: |
    Move learners into a feedback round, ideally one-to-one with you or a mentor, or structured peer
    feedback if not. Feedback should be specific and read against the opportunity: which claim is
    unsupported, where the tailoring goes generic, what to cut. Keep it kind and concrete, and have
    learners make at least one improvement there and then so the feedback lands on the real letter.
  keyPrompts:
  - Reading this against the advert, which sentence best proves the learner fits, and which is filler?
  - Where has a strength been claimed but not backed with evidence?
  - What is the one change you will make right now based on this feedback?
  watchOuts:
  - Feedback stays vague ("reads well") and nothing changes; model one specific, usable comment against the opportunity yourself first, and ask each learner to name the single change they are making now.
  adaptation: |
    Where one-to-one time is scarce, give pairs a short checklist tied to the opportunity so they can
    give useful comment without you at every desk, and reserve your own time for the learners who need
    it most.
- title: Reflect on how the letter serves your pathways
  duration: 5 min
  guidance: |
    Close by connecting the letter back to the point of the course. Ask learners how they found the
    writing process, how happy they are with the draft, and how a strong cover letter helps them reach
    the pathways they are aiming for. Capture the reflection in the journal so the letter is understood
    as a tool they will retailor for each opportunity, not a one-off task.
  keyPrompts:
  - How happy are you with your cover letter, and what would make it stronger?
  - What did you learn about showcasing your strengths for a specific opportunity?
  - Which upcoming opportunity will you tailor a version of this letter for next?
  watchOuts:
  - Learners file the letter away as a finished template; remind them a cover letter is rewritten for each application, and the saved draft is a starting point to adapt, not a form to resend.
closing: |
  Ask a couple of learners to name one strength they matched to an opportunity that they would not
  have thought to mention. Remind everyone the letter lives in their Pathways Journal and is meant to
  be retailored: every new opportunity is a reason to come back and rewrite it for that reader.
agencyContribution:
  indicators:
  - control-of-future-pathways
  how: >-
    A cover letter is how a learner argues, in their own words, that they belong in an opportunity.
    Producing one tailored to a real advert turns applying from a hopeful long shot into a deliberate,
    evidenced case the learner controls, which keeps the pursuit of a pathway in their hands.
principlesForegrounded:
- lifeworthy-competencies
- feedback-and-data
- connect-to-futures
principleAlignment:
- principle: lifeworthy-competencies
  how: >-
    Writing a tailored cover letter is a transferable, real-world skill learners will reuse for every
    course, job and funding application for years, and the activity ends with a letter they own and
    can adapt rather than a practice exercise.
- principle: feedback-and-data
  how: >-
    The draft is deliberately improved through a round of specific feedback read against the actual
    opportunity, and learners make at least one change on the spot, so feedback drives the quality of
    the letter they send.
- principle: connect-to-futures
  how: >-
    The letter is written towards one real opportunity the learner is aiming for, so the whole task
    connects present skills to a concrete next step on a pathway rather than an abstract exercise.
competencyCodes:
- FLC3
- ASL1
- FPS1
competencyDevelopment:
- code: FLC3
  how: >-
    A cover letter is persuasive communication aimed at one specific reader, and drafting one teaches
    learners to argue their fit convincingly; the tailored letter is the evidence.
- code: ASL1
  how: >-
    The feedback round, where learners take specific comment on their draft against the opportunity
    and make a change on the spot, is direct practice in assessing and using feedback to improve an
    outcome.
- code: FPS1
  how: >-
    Rewriting the same strengths to answer what each different opportunity asks for is direct practice
    in adaptable thinking: learners tailor one case to many contexts rather than reusing a fixed template.
