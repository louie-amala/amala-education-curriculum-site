learnerContent: |
  ## Where I am as a researcher

  This page is a path in pictures, from just starting out to finding out carefully and fairly on your
  own. It is not a test. It is a way to see how you grow.

  You use this page twice:

  - Near the start of the course, you mark where you feel you are now. Near the start is a fine place to be.
  - At the end of the course, you mark again - and you can see how far you have moved.

  On the page there is room to:

  - Mark your place on the path now.
  - Mark your place on the path at the end.
  - Draw or mark one way you have grown as a researcher.

  There is no wrong answer, and no one grades this page right or wrong. Keep it in your research book so
  you can find it again on the last day.
