provenanceNote: >-
  Rewritten from the YPAR Hub's "Decision Making Processes" lesson plan, supplied to Amala in August
  2026. The structure, warm-up, small-group examples, the four forms, then a group decision about its
  own procedure, is the source's. The insistence on a written agreement, the requirement to name which
  decisions are not the group's before the choice is made, and the enforceability of the agreement
  against the facilitator are Amala's. The source's own advice, that groups using this curriculum have
  found democratic processes work best, is deliberately not carried across: it pre-empts the decision
  the session exists to hand to the group.
