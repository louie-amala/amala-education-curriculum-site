title: "Looking deeper, power, beliefs, who is helped and hurt"
summary: >-
  The learner's page for the three deeper questions: who or what has power over the problem, what beliefs
  and attitudes shape it, and who or what is helped or hurt. In words, marks, or drawings.
facilitationContext:
- group
- independent
primaryContext: independent
learnerContent: |
  ## Looking deeper

  This page has three spaces, one for each deeper question about our problem. Fill each in words,
  drawings, or marks:

  - Who or what has power? Who can make it worse or better, families, agencies, the government, the rain,
    the hills?
  - What do people believe or feel? Which beliefs make it harder, and which could help?
  - Who is helped, and who is hurt? Who suffers most, and who is helped when things get better?

  Then, at the bottom, note one thing looking deeper showed you that the plain evidence did not. Remember:
  this is about understanding, never blaming. Keep this page in your research book, it feeds our insights.
