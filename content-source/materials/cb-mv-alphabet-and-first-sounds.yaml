# Contextualised, fully offline adaptation of efi-mv-alphabet-and-first-sounds for Learning Bridge+
# (Cox's Bazar). The key shift from the source: this is EMERGENT literacy, not literacy transfer. Many
# learners are not yet reading in any language and may never have held a pencil, so the work starts from
# the ear and from the learner's own name, letters are recognised before they are formed, and nothing
# assumes prior reading. Oral and visual first, no devices. Objective 1.
id: cb-mv-alphabet-and-first-sounds
slug: cb-mv-alphabet-and-first-sounds
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "The alphabet and your first sounds"
summary: >-
  Learners meet the English alphabet by ear and through their own names, hearing and saying the first
  sounds, then learning to recognise the letters that carry them. It starts from the learner's own name,
  assumes no prior reading, and gives everyone their first sure foothold in written English.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Sounds are heard and said together, then each learner finds the first sound and letter
    of their own name. The group is a strength here: hearing a room of names read aloud, and finding
    the letters you share with a neighbour, makes the alphabet feel owned rather than imposed. Use
    same-gender pairs for the partner steps.
- context: one-to-one-mentoring
  how: >-
    A good fit for a learner who is anxious about never having read or written, or who is far behind the
    group. A mentor can go at the learner's exact pace, start and stay with their own name, and let them
    trace and recognise letters with no audience, which removes the shame that can otherwise stop a
    beginner from trying at all.
- context: independent
  how: >-
    Limited alone, because the heart of it is hearing and saying sounds with others. If a learner works
    independently, the My Voice book carries the picture of their name and the letters to trace, and the
    independent task is to say their name and its first sound to one person at home; pair it with a
    spoken check next session.
duration: "3 hours facilitated across two or three sessions, plus about 2 hours of independent practice"
grouping: "Whole group for the sounds, then same-gender pairs for names and letters; works with 10-35 learners"
whatLearnersDo:
- Hear and say the letters of the English alphabet, without being made to memorise all 26 at once.
- Hear the first sound in their own name, and find the letter that makes it.
- Learn to recognise their own name as a written shape, and begin to trace it.
- Notice which letters and sounds English shares with the languages and scripts they already know.
materialsAndPreparation:
- Each learner's name ready to show large and clear (write it big on paper or card beforehand if you can).
- A visible alphabet, the printed alphabet strip from the picture-card pack, or the letters written large on paper or on the ground.
- "Something to trace with and in - the My Voice book, or paper; and, for tracing letters, a finger in sand or dust works when pencils are scarce."
- Your own name ready to show and say first, and one or two example words that matter locally.
- "Sensitivity: a name can carry family and story. Most learners are proud to work from their name, but if a learner would rather not, let them choose another word that matters to them (a place, a colour, a thing they like) and build the same steps from that."
visuals:
- kind: example
  title: "The sound of my name"
  caption: >-
    Each first sound learners hear is tied to the letter that carries it, and to a real name in the room.
    Sound first, then the letter.
  spec:
    type: zones
    cardStyle: drawing
    flow: across
    flowLabel: "becomes"
    zones:
    - label: "First sound"
      tone: known
      cards:
      - "fff…"
      - "sss…"
      - "rrr…"
    - label: "Letter & name"
      tone: positive
      cards:
      - "F, Fatima"
      - "S, Sara"
      - "R. Rashida"
facilitationNotes: |
  This is the activity that decides whether a beginner believes written English is for them. Unlike a
  literate group transferring skills they already have, most learners here are meeting the idea that
  marks on a page carry sounds for the first time, and some have never held a pencil. So slow right
  down and lead with the ear: a sound is easier than a letter. Start everyone from their own name,
  because a learner will work hard on their own name when an abstract letter drill would defeat them,
  and recognising your name in writing is a real, dignified first win. Recognition comes before
  formation: learners should be able to point to and know a letter well before they are asked to make it
  neatly. Welcome every bridge to the languages and scripts learners already know, Rohingya,
  Chittagonian, Burmese, Arabic from the madrasa, comparing a new sound to a known one is not cheating,
  it is how adults learn fastest. Keep it warm and unhurried, and treat every sound said aloud as a win.
steps:
- title: "The alphabet, by ear"
  duration: "35-40 min"
  guidance: |
    Say the sound of a handful of letters and have the group say each back to you, pointing to the
    letter on the strip or on the paper as you go. Do not try to march through all 26 to mastery, the
    aim is the big idea that letters carry sounds, and comfort with a few. Ask learners which sounds
    they can hear in languages they already speak, and let them say so out loud; those bridges speed
    everything up and tell learners their existing knowledge counts.
  keyPrompts:
  - Can you say this sound with me? Again, a little louder.
  - Is there a sound like this in a language you already know?
  - Which sounds feel easy, and which feel strange in your mouth?
  watchOuts:
  - Rushing all 26 letters because it feels like progress; a beginner who half-learns 26 letters holds none, while one who truly owns six has a foundation. Go slow and come back over sessions.
  - Confusing the name of a letter with the sound it makes; stay with the sound for now, the sound is what unlocks words.
  adaptation: |
    No cards or board are needed. Letters written large on paper, or drawn in the dust with a stick,
    carry this step; your voice and the learners' voices do the real work.
- title: "The first sound of your name"
  duration: "45-55 min"
  guidance: |
    Show and say your own name first, and say its first sound slowly. "my name is Fatima, it starts
    with fff". Then go round: each learner says their name, and together you find its first sound. In
    same-gender pairs, learners say their names to each other and their partner listens for the first
    sound. This is the moment the alphabet stops being abstract: it is the sound my own name begins
    with. Take your time, and let learners help each other.
  keyPrompts:
  - What is the very first sound when you say your name, slowly?
  - Who else in the room has a name that starts with the same sound as yours?
  - Can you hear the first sound in your partner's name?
  watchOuts:
  - A learner whose name is hard to map to an English letter (a sound English spells unusually); reassure them, give them the nearest letter, and treat it as interesting rather than wrong. English spelling is irregular and that is not their failing.
  - Shyness about saying one's own name aloud; let the partner or the mentor hear it first, quietly, before anything is said to the group.
  adaptation: |
    If a learner would rather not use their name, build every step from another word that matters to
    them, a place, a colour, a thing they like, and find its first sound instead.
- title: "See and trace your name"
  duration: "50-60 min"
  guidance: |
    Give each learner their name written large and clear, and let them first just look at it and point:
    this is my name, this is its first letter. Recognition comes before writing. When they are ready,
    they trace over it, with a pencil in the My Voice book, or with a finger in sand or dust if pencils
    are short, as many times as they like, unhurried. For many this is the first time they have written
    their own name, and it is worth dwelling on. Circulate, kneel beside people, and praise the effort,
    not the neatness.
  keyPrompts:
  - Point to your name. Now point to its first letter. What sound does it make?
  - Which part feels hard to trace, and which is getting easier?
  watchOuts:
  - Pushing for neat, correct letter formation too soon; at this stage the win is recognising the shape and having a go, not handwriting. Neatness comes with time.
  - A learner who has never held a pencil feeling ashamed; show the grip quietly, let them trace with a finger first, and never make it a public moment.
  adaptation: |
    Where there is no paper to spare, learners trace their name in a tray of sand, in dust on the
    ground, or over a name card with a dry finger; the muscle memory forms just the same.
closing: |
  Ask a few learners to hold up their name and say it with its first sound, "Fatima, fff". Put each
  learner's name into their My Voice book as the first page, so it becomes the anchor everything else is
  built from. Name the win plainly: today you found the first sound of your name and began to write it,
  and that is the beginning of reading and writing in English. Independent task: say your name and its
  first sound to one person at home, and, if you can, make a mark or trace your name once in your book.
agencyContribution:
  indicators:
  - control-of-future-pathways
  how: >-
    Turning sounds into letters and recognising your own name in writing is the first turn of the key
    that unlocks reading and writing, and reading and writing are the gateway to further study, work,
    and dealing with the written world on your own terms. For a learner who has never read, holding that
    key for the first time is a real widening of the futures open to them.
principlesForegrounded:
- builds-on-identities
- safe-spaces
- lifeworthy-competencies
principleAlignment:
- principle: builds-on-identities
  how: >-
    Every learner starts from their own name and their own languages: the first sound they learn is the
    one their name begins with, and bridges to Rohingya, Chittagonian, Burmese, or Arabic are invited in,
    so new letters are hung on knowledge the learner already owns.
- principle: safe-spaces
  how: >-
    The activity is built for people who may never have read or written, so shame is the real risk it
    guards against: recognition before formation, tracing with no audience, a mentor route for those
    far behind, and praise for effort not neatness all make it safe to try aloud and on the page.
- principle: lifeworthy-competencies
  how: >-
    Knowing that letters carry sounds, and being able to recognise and write your own name, are
    foundational literacy skills a learner reuses in every later session, every form, and every sign for
    the rest of their life.
competencyCodes:
- FLC3
competencyDevelopment:
- code: FLC3
  how: >-
    Beginning to link the sounds of English to its letters, and recognising and forming the letters of
    one's own name, is the ground floor of reading and writing. The very start of being able to
    communicate in written English.
