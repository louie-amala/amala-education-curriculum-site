agencyContribution:
  indicators:
  - control-of-future-pathways
  - power-over-wellbeing-and-self-direction
  how: >-
    Seeing research as a growth path they can move along — and judging honestly where they are now —
    gives learners ownership of their own progress, rather than waiting to be marked right or wrong by
    someone else.
principlesForegrounded: [feedback-and-data, safe-spaces, recognise-communicate-growth]
principleAlignment:
- principle: feedback-and-data
  how: Learners set an honest baseline for themselves that they will revisit, so their own growth becomes visible evidence they can read.
- principle: safe-spaces
  how: The self-check is framed as a growth path, not a test; marking "near the start" is named as normal, so no one is exposed or judged.
- principle: recognise-communicate-growth
  how: Learners judge their own place on the path and own their progress across the course, rather than receiving a mark from outside.
competencyCodes: [FSI1, FSL1]
competencyDevelopment:
- code: FSI1
  how: Learners meet the anchor competency — investigating real-world issues — as a concrete, pictorial picture of what a researcher does, setting the direction for the whole course.
- code: FSL1
  how: Learners reflect honestly on where they are as a researcher now, and set a baseline they will return to at the end to see how they have grown.
