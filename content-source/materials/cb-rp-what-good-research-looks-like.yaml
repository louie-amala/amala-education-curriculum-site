facilitationNotes: >-
  The one thing to get right: this is a growth path, not a test. Say clearly, and more than once, that
  marking "near the start" is not failing. It is exactly where a researcher begins, and the point is to
  look back at the end and see how far we came. Keep it short, warm, and pictorial. Model your own honest
  mark first so learners see it is safe. This page comes back out at the very end of the course (Showcase
  and reflect), so keep it in the research book where it can be found.
steps:
- title: "What does a researcher do?"
  duration: "15 min"
  guidance: >-
    In pictures and plain words, show what a researcher does: they ask people, they look closely, they
    keep a record of what they find, and they check whether something is really true instead of just
    guessing or repeating what people say. Keep it concrete and warm, a researcher is a person who
    wants to find out, carefully and fairly.
  keyPrompts:
  - "What is the difference between guessing and finding out?"
  - "What does a person do when they really want to know if something is true?"
- title: "Where am I now?"
  duration: "15 min"
  guidance: >-
    Show the simple picture scale of where a person can be on the path, from just starting out to
    finding out carefully and fairly on their own. Mark your own place honestly first, out loud, so
    learners see there is no wrong answer. Then each learner marks where they feel they are now, in
    their research book, and you remind them: we will look at this again at the end and see how we grew.
  keyPrompts:
  - "Where do you feel you are on this path today? There is no wrong answer."
  - "Marking near the start is not failing. It is where every researcher begins."
closing: >-
  Remind learners this mark is a beginning, not a judgement. We will come back to it on the last day of
  the course and see, together, how far we have moved from guessing to finding out.
learnerContent: |
  ## What good research looks like

  A researcher is a person who wants to find out, carefully and fairly, instead of guessing or just
  repeating what people say.

  A researcher:

  - Asks people, and looks closely at what is around us.
  - Keeps a record of what they find.
  - Checks whether something is really true before believing it.

  This is a path we all walk along over the course. No one starts at the end. Today you will mark where
  you feel you are now, near the start is a fine place to be. At the end of the course we will look at
  your mark again, and see together how far you have grown.

educatorContent: |
  ## What you need to know before you teach this

  Short block, and a map rather than a test. It shows learners the competency the whole course grows,
  so they can mark where they are now and again at the end and see the distance.

  ### It is the same ladder you assess against

  The five steps are the learner-facing reading of Amala's proficiency scale for FSI1, in the first
  person with the level names removed. Do not show learners the level names, the GPA values, or where
  the readiness bar sits. A learner who knows which rung counts will mark that one.

  ### Nobody starts high, and say so first

  Mark it yourself, out loud, honestly, before you ask anyone else to. A learner near the bottom is at
  the beginning, which is where a course like this expects them to be. Do not correct a learner who
  marks themselves high; note it, and let the final marking do the work.

  ### The distance is the point

  Run it again in the final block with a different mark, so both are visible on one page. For learners
  whose schooling has stopped and started for years, a visible distance they can point to may be the
  first evidence they have had that effort produces change.

  ## Before they leave this block

  - Every learner has marked one rung, honestly, in their own book.
  - They know it is not a test and that they will mark it again at the end.
  - They can say what a researcher does, in their own words.
learnerTeaching:
  title: "What a researcher does, and where I am now"
  readAloud: |
    ## What a researcher does

    This whole course grows one skill: **finding things out properly, instead of guessing.**

    A researcher does four things:

    - **Asks a clear question**, small enough to actually answer.
    - **Goes and finds out**, asks people, looks carefully, reads what others found. Fairly and
      safely.
    - **Weighs what they find**, how much can we trust this? Does anything else agree?
    - **Says what it means**, and shares it with people who need to know.

    ### The path

    Like any skill, you can be a beginner and get better. Here is the path. Read it from the bottom.

    1. **I am not sure how to find out about something. I would just guess.**
    2. **I can say how I would find out, who I would ask, or where I would look, but I have not done
       it.**
    3. **I went and found out. I asked people or looked at sources, and I kept a record.**
    4. **I found out, and I can say what it means, and which of my sources I trust more, and why.**
    5. **I have done this more than once, and the second time I did it better because of the first.**

    ### Mark where you are today

    Not where you want to be. Today.

    Almost everyone is near the bottom at the start, and that is exactly right. It is the beginning of
    the course. If you were already at the top there would be nothing here for you.

    This is not a test. Nobody is marking it.

    ### You will mark it again at the end

    With a different mark, on this same page, so you can see both.

    That is why we do it now. The distance between the two marks is yours.
  words:
    - term: researcher
      meaning: someone who finds things out carefully and fairly, instead of guessing
    - term: proof
      meaning: something that shows a thing is true, not just that we believe it
