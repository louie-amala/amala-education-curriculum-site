id: cf-plan-your-questions
slug: cf-plan-your-questions
access: public
type: educator-move
title: "Plan your questions"
summary: >-
  Most questions get invented on the spot. Plan the key ones in advance — aimed at the learning,
  short and clear — and sidestep the common traps.
tags:
  - id: learning-design
    how: >-
      When designing, write your key questions in advance, aimed squarely at the learning intention and
      short enough to understand — and design out the common errors (too many at once, only the
      confident, answering your own question).
  - id: learning-facilitation
    how: >-
      When facilitating, lean on your planned questions rather than improvising; interpret the answers (a
      wrong one shows you where to go next) and ask learners to justify what they say.
  - id: questioning
  - id: making-thinking-visible
facilitationContext:
  - group
primaryContext: group
educatorContent: |
  Questions are one of the best ways to find out what learners know — yet most are made up on the spot.
  Taking a little time to plan your key questions, so they are focused on the learning intention and
  short and clear enough to understand, pays off out of all proportion. Planning also lets you design out
  the common questioning errors: asking too many questions at once, answering your own question, only
  asking the confident learners, pitching a hard question too early, or asking in a way that feels
  threatening. In the moment, interpret rather than evaluate — a wrong answer is information about where
  to teach next — and ask learners to justify their answers, right or wrong, to surface their reasoning.
steps:
  - title: "Tie each question to the learning"
    guidance: >-
      Aim your key questions at the learning intention, not just the activity — what do you actually
      want this question to reveal?
  - title: "Keep them short and clear"
    guidance: >-
      Write a few good questions, not a long list. Each should be understandable at once.
  - title: "Plan follow-ups and who you'll ask"
    guidance: >-
      Decide how you'll probe further and how you'll bring in more than the confident few (pair with
      "Choose who answers"). Design out the common traps — too many at once, answering your own
      question, only asking the sure.
  - title: "Interpret the answers"
    guidance: >-
      In the moment, treat a wrong answer as information about where to teach next, and ask learners to
      justify what they say.
downloads:
  - label: "Question planner"
    file: /downloads/cf-question-planner.docx
    format: Word
    role: template
    note: >-
      A planning sheet for your key questions — the question, what a good answer reveals, and your
      follow-up / who you'll ask — with a worked example and blank rows.
agencyContribution:
  indicators:
    - power-over-wellbeing-and-self-direction
  how: >-
    Well-aimed questions, and being asked to justify their thinking, push learners to reason for
    themselves rather than guess at what the educator wants.
principleAlignment:
  - principle: feedback-and-data
    how: >-
      Planned, well-aimed questions generate better information about what learners understand, and
      treat wrong answers as data rather than failure.
