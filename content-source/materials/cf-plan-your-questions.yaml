sourceRefs:
  - "AMALA Global Secondary Diploma (GSD) Educator Guide / Handbook — Course Facilitator Playbook"
provenanceNote: >-
  Generalised from the Playbook's "Plan the questions you want to ask", "Avoid these common errors in
  questioning" (Brown & Wragg, 1993), and interpret/justify guidance in Making Learning and Thinking
  Visible.
