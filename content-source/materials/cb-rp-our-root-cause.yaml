title: "Dig for the root cause"
summary: >-
  The learner's page for the Five Whys: a problem at the top, and a chain of "why?" going down to the
  root cause underneath — drawn, marked, or written.
facilitationContext:
- group
- independent
primaryContext: independent
learnerContent: |
  ## Dig for the root cause

  At the top of this page, write or draw one problem our evidence shows. Then dig down: under it, answer
  "why does this happen?" — and under that answer, ask "why?" again, and again, about five times.

  The page has a chain of spaces going down:

  - The problem (at the top)
  - Why? …
  - Why? …
  - Why? …
  - Why? …
  - The root cause (at the bottom — the reason we cannot easily push past)

  You can draw each step instead of writing it. When you reach the bottom, mark whether our evidence
  supports this root cause. Keep this page in your research book — it feeds our insights.
agencyContribution:
  indicators:
  - control-of-future-pathways
  how: >-
    Recording the chain from a surface problem down to its root cause builds the habit of asking "why?"
    past the easy answer — a thinking tool learners keep for any problem they meet.
