provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, adaptations and
  delivery modes) from the Design Challenge activity guide, which supplied the purpose, the example
  stories of change and the reflection questions. The source Design Challenge investigates the mental
  health and wellbeing of Afghan females; this material is written to generalise to any design
  challenge, with problem-relevant stories as the worked example. Linked to Social Entrepreneurship
  objective 2 (developing a solution concept).
