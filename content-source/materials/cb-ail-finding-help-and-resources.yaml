    - label: "Harder to reach"
      tone: neutral
      cards: []
- kind: example
  title: "My helpers, sorted"
  caption: >-
    Sorted, then one real ask chosen and rehearsed — ‘please can you help me with…’.
  spec:
    type: zones
    cardStyle: drawing
    zones:
    - label: "Can reach now"
      tone: positive
      cards:
      - "a friend down the path"
      - "an older sibling"
      - "the facility worker"
    - label: "Harder to reach"
      tone: neutral
      cards:
      - "a teacher in another block"
facilitationNotes: |
  Learners often treat a goal as something they must reach alone, and so stall. The one thing to get
  right is the shift from what do I know to who and what could help me, and then the courage to ask.
  Reframe asking for help as a strength, not a weakness: reaching out is itself an act of agency, and the
  strongest learners are the ones who know when and who to ask.
  Keep the focus on help that is genuinely reachable in the camp, not an ideal list they can never use,
  and keep every suggested helper safe and appropriate for the learner. The most valuable help in the
  room is usually the room itself, so protect the pooling step. Your job is to help learners find and
  approach help, not to supply it for them.
steps:
- title: "Name the goal help has to move forward"
  duration: "8-10 min"
  guidance: |
    Have each learner choose one real goal they are working towards and draw or place it at the top of
    the page. Everything that follows is tied to this goal, so the map stays useful rather than vague.
    Give a quick spoken example of your own, then let them choose. Keep it brief: the point is to anchor
    the search for help in a specific aim, not to set a new goal.
  keyPrompts:
  - Which goal do you most want help moving forward right now?
  - What has made this goal hard to progress on your own?
  - What would getting help with this actually change for you?
  watchOuts:
  - A learner picks a goal so vague that no helper fits it; steer them to a concrete, current goal, or borrow one from their earlier goal work so the mapping has something real to grip.
  adaptation: |
    No device or writing is needed. A single goal-picture, or even the goal spoken aloud and held in
    mind, is enough to anchor the rest of the activity.
- title: "Map who and what could help"
  duration: "14-16 min"
  guidance: |
    Give learners quiet time to map every possible source of help for that goal. Offer the people-
    pictures and say the types aloud so thinking goes wider than a teacher: mentors, peers, family,
    facility workers, neighbours, a local place, a tool, a printed book. Circulate and ask rather than
    tell. Push for many first; judging usefulness comes next. The aim is to break the belief that the
    learner is the only help they have.
  keyPrompts:
  - Who do you know, or know of, who has done something like this?
  - What places, workers, books or tools in the camp could help with this?
  - Where might you find help you have not thought to look for yet?
  watchOuts:
  - A learner names only people they already know well; prompt them gently towards facility workers, safe community members and places too, since useful help is often just outside their existing circle.
  adaptation: |
    Lay a stone or a people-picture for each helper around the goal-picture, and scribe a name under it
    only if the learner asks. Focus the map on people, places and printed help reachable offline.
- title: "Sort your map by what is within reach"
  duration: "12-14 min"
  guidance: |
    Have learners move the helpers into two groups: those they can genuinely reach now, and those they
    cannot. Say aloud that a far-off helper who will never answer is worth less than a friend down the
    path. Then pool in same-gender pairs or small groups: each learner shows their goal, and the others
    name helpers for it. This peer harvest is the engine of the activity, since someone almost always
    knows an option the learner missed.
  keyPrompts:
  - Which of these could you actually reach in the next week or two?
  - What is stopping you reaching the ones you set aside, and is that real or only assumed?
  - "As you listen to each other: what helper comes to mind for their goal?"
  watchOuts:
  - Learners dismiss reachable help as not for someone like me; name this gently and remind them that most people and workers here are more willing to help than we expect, and asking costs little.
  adaptation: |
    Moving stones into a near pile and a far pile shows the sort with no writing, and the group can add
    a stone to a partner's near pile as they name new help.
- title: "Practise the ask and commit to one"
  duration: "12-14 min"
  guidance: |
    Move from a map to an action. Reaching out is where most learners freeze, so have each learner say
    aloud how they would actually approach one helper: the words they would use to a person, or the
    first step to reach a place or worker. Let a same-gender pair rehearse one ask aloud. Close by
    having each learner commit to one specific, safe request they will make before the next session.
  keyPrompts:
  - What exactly would you say to ask this person, or to reach this place?
  - Which one request will you make before we next meet?
  - What is the smallest first step that gets you started today?
  watchOuts:
  - A learner leaves with a long map but no committed action; insist on one concrete, safe request with a name and a first line, so the map turns into an approach made rather than a plan admired.
  adaptation: |
    With no paper, the ask is simply rehearsed aloud between partners, twice, until the words come
    easily; the facilitator can play the helper for a learner with no partner.
closing: |
  Ask two or three learners to say the one helper they will reach out to and how they will do it. Draw
  out how much help the room surfaced together that no one held alone. Remind learners that finding and
  asking for help is a skill they will use for every goal ahead, not just this one, and that the map
  lives in their workbook to add to as they go. Independent task: make your one request, then mark in
  the workbook what happened and how it felt to ask.

educatorContent: |
  ## What you need to know before you teach this

  Learners stall on goals because they treat them as things to be reached alone. The shift this block
  makes is from *what do I know* to *who and what could help me* — and then the harder part, actually
  asking.

  ### Reframe asking as a strategy, not a confession

  Many learners read asking for help as admitting they cannot do it. Say the opposite plainly and early:
  the researcher, the good student and the successful adult all ask constantly. Not asking is the
  weakness.

  It is worth naming why this bites here. A young person who has had to be self-sufficient — running a
  household, translating, earning — has learned that asking is risky or shameful. That is a rational
  adaptation, and it works against them in learning.

  ### Widen "resources" beyond people

  Learners will list people and stop. Push wider: a place (somewhere quiet, somewhere with light), a
  thing (a book, a pencil, a radio, someone's phone), a time, and other learners in the group — who are
  the most under-used resource in the room.

  ### Sort by what is within reach

  A map with the head of an agency on it is not useful. Sort the map: who could I actually speak to,
  this week, without anyone's permission? That column is the one that matters, and it is usually
  shorter and closer to home than learners expect — a sibling, a neighbour, the learner sitting beside
  them, their mentor.

  ### Practise the ask out loud, because that is what actually stops them

  Knowing who to ask and not asking is the commonest failure. So rehearse the sentence: **what you
  want, why you are asking them, and how small it is.** "Can you show me how to write these three
  letters? It would take a few minutes." Small asks get said and get answered.

  Have them practise on each other until it sounds normal, then commit to one real ask before the next
  session.

  ### The empty map

  Some learners' maps will be nearly empty, and that is a real thing rather than a failure of
  imagination — someone who would have helped is not here. Have entries ready to offer: you, their
  mentor, another learner. Do it privately.

  ## Before they leave this block

  - A map with people AND things AND places on it.
  - It has been sorted, and the learner can point to who is genuinely within reach this week.
  - The ask has been said out loud, in practice, at least twice.
  - One real ask committed to, with a name attached.
learnerTeaching:
  title: "How to find help, and how to ask for it"
  readAloud: |
    ## How to find help, and how to ask for it

    Nobody reaches a goal alone. Not researchers, not teachers, not anyone.

    So the question is not "can I do this by myself?" The question is **who and what could help me?**

    ### Asking is not weakness — it is the skill

    Some of us have learned to manage on our own, because we had to. That is something to be proud of.
    But in learning it works against you.

    People who learn fast are people who ask a lot. Not asking is what slows you down.

    ### Help is not only people

    Learners always list people and stop. Think wider:

    - **A person** — someone who can already do the thing.
    - **A place** — somewhere quiet, somewhere with light.
    - **A thing** — a book, a pencil, a radio, a paper with words on it.
    - **A time** — a moment when someone is free to show you.
    - **The people in this room** — the most forgotten help of all. Someone here can already do the
      thing you are trying to do.

    ### Then sort it: who can I actually reach?

    A long list is not useful if none of it is reachable.

    Ask: **who could I actually speak to this week, without needing anyone's permission?**

    That list is usually shorter and closer to home than you expect — a brother or sister, a neighbour,
    the person sitting next to you, your mentor. Those are the ones that matter.

    ### Now the hard part — the ask itself

    Most people find who to ask and then never ask. So practise the words.

    A good ask has three parts:

    1. **What you want** — one small thing.
    2. **Why them** — because they can already do it.
    3. **How small it is** — so it is easy to say yes.

    "Can you show me how to write these three letters? It would only take a few minutes."

    ### Keep it small

    Small asks get said, and small asks get answered. A big ask sits in your mouth for three weeks.

    Ask for one thing. Then ask again another day.
  words:
    - term: resource
      meaning: anything that could help you — a person, a place, a thing, or time
    - term: within reach
      meaning: something or someone you could actually get to this week
    - term: the ask
      meaning: the words you use when you ask someone for help
worksheet:
  slug: cb-ail-who-can-help-page
  note: "In the learner's book (My Learning Book): the 'Who and what can help me' page. Print one per learner."
agencyContribution:
  indicators:
  - control-of-future-pathways
  - contribution-to-community
  how: >-
    Knowing how to find and reach the help that already exists in the camp means a learner is no longer
    limited by what they alone know or can do. Being able to open doors to mentors, workers and
    community is what keeps the routes to their own future open and in their own hands. It also runs the
    other way: a learner who has mapped who can help them can see where they are the help for someone
    else, which is where an individual goal starts to touch the community around it.
principlesForegrounded:
- lifeworthy-competencies
- collaboration
- connect-to-futures
principleAlignment:
- principle: lifeworthy-competencies
  how: >-
    Finding, judging and reaching out to the help around you is a self-direction habit these learners
    will reuse for every goal in life, well beyond this activity, and one that needs no literacy or
    connectivity to keep using in the camp.
- principle: collaboration
  how: >-
    The pooling step is built on the fact that peers know helpers for each other that no one sees alone,
    so a learner's set of options is expanded by the group, and asking others for help is practised as
    a strength rather than a weakness.
- principle: connect-to-futures
  how: >-
    Every helper is mapped against a real goal the learner is working towards, so the search for help is
    explicitly in service of the future they are building rather than an abstract exercise in listing
    what exists.
competencyCodes:
- FSL3
- FR1
competencyDevelopment:
- code: FSL3
  how: >-
    Seeking out helpers, workers, books, community and mentors to move a goal forward is the core of
    engaging in continuous learning; the resource map and the committed ask are the evidence a learner
    looks beyond the session for their own growth.
- code: FR1
  how: >-
    The whole activity is identifying the resources (people, places and things) available to reach a
    goal, judging which are within reach, and working out how to access them, which is direct practice
    in identifying and mobilising resources.
