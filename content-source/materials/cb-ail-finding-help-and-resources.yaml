# Contextualised, fully offline adaptation of ail-finding-help-and-resources for Learning Bridge+ (Cox's Bazar).
# Oral and visual first, ~60 min facilitated.
id: cb-ail-finding-help-and-resources
slug: cb-ail-finding-help-and-resources
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "Who and what can help me"
summary: >-
  Learners map the people and things in the camp that could help them reach a goal, sort them by what
  is truly within reach, then practise asking, so they never carry a goal alone.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners map their own help first, then pool it in same-gender groups so the room's
    shared knowledge surfaces options no one had alone. The pooling step matters, because a peer almost
    always knows a person or place the learner does not, so keep it even if you shorten the individual
    mapping.
- context: one-to-one-mentoring
  how: >-
    A strong fit, and the mentor is itself one of the helpers being mapped. The mentor helps the learner
    see help they are overlooking and can open a door directly. Resist simply handing over contacts: the
    aim is for the learner to learn to find and ask, not to be supplied.
- context: independent
  how: >-
    Workable but weaker, because a learner alone misses the peer pooling that surfaces unfamiliar help.
    The workbook prompts and the reachability sort carry it, but ask them to check their map with at
    least one other person, who will usually name a helper they had not thought of.
duration: "About 1.5 hours in the unit plan (generous for this oral/visual, translated cohort — the step timings below are the active teaching core; the rest is warm check-in, drawing, and translation), plus a 30 min independent task"
grouping: "Individual mapping, then same-gender pairs or small groups; works with 10-35 learners"
whatLearnersDo:
- Hold one goal you are working towards in mind as the thing help must move forward.
- Map the people, places and things in the camp that could help you reach it.
- Sort your map by what is actually within reach, and pool ideas with peers.
- Practise how you would ask for help, then commit to one request to make before the next session.
materialsAndPreparation:
- The student workbook (one goal-picture at the top and space to draw or place helpers around it).
- Small stones or caps and simple people-pictures (a friend, a teacher, a family member, a facility worker) to lay out and sort.
- Your own honest example of a helper you sought out for a goal, and what you said to reach them, to model first.
- "Sensitivity: a goal, and who a learner can safely ask, can touch on family, gender and safety. Keep help within safe, same-gender or trusted reach, let learners keep details private, and never push anyone towards a contact that feels unsafe."
visuals:
