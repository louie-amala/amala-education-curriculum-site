id: cf-make-thinking-visible
slug: cf-make-thinking-visible
access: public
type: educator-move
title: "Make learning and thinking visible"
summary: >-
  You can't support learning you can't see. The overarching move — surface what every learner knows
  and thinks — with a family of specific techniques underneath it.
tags:
  - id: learning-facilitation
    how: >-
      When facilitating, keep asking yourself "how do I know what they're thinking right now?" and reach
      for a specific technique — no hands up, think-pair-share, wait time, a quick check — to find out.
  - id: learning-design
    how: >-
      When designing, build moments to surface thinking into the plan rather than hoping it happens:
      plan the questions, the checks, and the tasks that make learning visible.
  - id: making-thinking-visible
  - id: checking-for-understanding
  - id: questioning
facilitationContext:
  - group
primaryContext: group
educatorContent: |
  You cannot see inside learners' heads, so you have to engineer situations that surface their
  thinking — and make sharing half-formed ideas safe and normal. This is the overarching move; a family
  of specific techniques sits underneath it, each its own move:

  - Choose who answers (no hands up) — so you hear the whole group, not just the confident.
  - Think, pair, share — everyone thinks and rehearses before anyone speaks.
  - Build in wait time — a few seconds of silence lifts the quality and spread of answers.
  - Examples and non-examples — a fast sort that reveals what learners really grasp.
  - Quick checks: exit tickets and hinge questions — a whole-group read in seconds.
  - Plan your questions — aimed at the learning, and free of the common traps.

  Two habits run through all of them: interpret rather than evaluate (a wrong answer shows you where to
  go next), and ask learners to justify their thinking. Other quick tools help too — sentence starters,
  getting thinking down on paper, concept sorts.
agencyContribution:
  indicators:
    - power-over-wellbeing-and-self-direction
  how: >-
    When every learner's thinking is surfaced and valued — not just the confident few — each learner
    is positioned as an active participant in, and owner of, their own learning.
principleAlignment:
  - principle: feedback-and-data
    how: >-
      Techniques that surface what learners really know generate the data an educator needs to adapt,
      and treat a wrong answer as information rather than failure.
  - principle: safe-spaces
    how: >-
      Normalising half-formed thinking, and not letting "I don't know" end the exchange, makes it safe
      to think out loud.
