id: pathways-interview-questions-for-them
slug: pathways-interview-questions-for-them
access: public
type: activity
title: "Preparing for interviews: answering 'Do you have any questions for us?'"
summary: >-
  Learners draft, sort and practise questions to ask at the end of an interview, treating it as a
  two-way conversation and a chance to judge whether the opportunity actually fits them.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    As designed. Learners draft questions alone, then swap and give feedback in small breakout groups.
    The peer feedback is where the value sits, since hearing which questions others rate, and why,
    quickly separates a genuinely useful question from one that sounds impressive but tells the learner
    nothing. Keep the sharing step even if you shorten the drafting.
- context: one-to-one-mentoring
  how: >-
    A strong fit. The mentor plays the interviewer and answers the learner's questions, then reflects
    on which ones drew out something useful and which fell flat. Push the learner to react to the
    answers, since deciding whether the opportunity fits them is the point, not just performing interest.
- context: independent
  how: >-
    Workable for drafting and sorting, weaker for practice, because the learner loses the live back and
    forth that shows whether a question actually works. If a learner works alone, ask them to say each
    question aloud and to arrange at least one mock exchange with a peer, mentor or facilitator.
duration: 40-50 min facilitated, plus the journal task
grouping: Individual drafting, then breakout groups of 3-5; works with 10-30 learners
whatLearnersDo:
- Draft a set of questions you could ask at the end of an interview in your Pathways Journal.
- Sort your questions, keeping the ones that show genuine interest or help you judge the opportunity.
- Swap questions with your group and give each other feedback on which are strong and which to sharpen.
- Practise asking two or three of your questions aloud and notice how they land.
- Record what the activity taught you about the interview as a two-way conversation.
materialsAndPreparation:
- The Pathways Journal, one per learner, open at the interview-questions task (printed or digital).
- A short video or your own worked list of strong end-of-interview questions to prompt ideas; a spoken walkthrough works if video is not available.
- A way for each breakout group to keep notes, and a nominated scribe per group.
- Two or three of your own example questions, one weak and one strong, to model the difference before learners draft.
facilitationNotes: |
  Learners often treat "Do you have any questions for us?" as a formality and answer "no", which reads
  as low interest and wastes their one chance to interview the interviewer. The one thing to get right
  is that this is a two-way conversation: good questions both signal genuine interest and help the
  learner judge whether the opportunity fits them. Push past questions that only flatter the employer
  towards ones that surface real information the learner needs. There is no single best question, so
  reward fit and honesty over a polished script.
steps:
- title: Frame the closing question as a two-way conversation
  duration: 5-10 min
  guidance: |
    Open by reframing "Do you have any questions for us?" as an invitation, not a test. Explain that
    it does two jobs at once: it shows genuine interest, and it lets the learner find out whether the
    role, team or course is right for them. Contrast one weak question with one strong one, drawing on the [video](/materials/video-questions-to-ask-at-interview) or your
    own examples, so the difference is concrete before learners write anything.
  keyPrompts:
  - Why might answering "no, I'm fine" here work against you?
  - What do you actually want to know before you accept an offer?
  - What could a question tell an interviewer about how interested you are?
  watchOuts:
  - Learners think the question is only about impressing the employer; make room for questions that help them decide whether the opportunity suits them, so it stays a genuine two-way exchange.
  adaptation: |
    With no way to show a video, your two spoken examples, one weak and one strong, and the two jobs
    written on a board are enough to run this step. No device is needed.
- title: Draft your questions in the Pathways Journal
  duration: 10-15 min
  guidance: |
    Give learners quiet, individual time to draft a range of questions in their Pathways Journal.
    Encourage quantity first: questions about the day-to-day, the team, expectations, progression and
    what success looks like. Circulate quietly, and where a learner is stuck, ask what they would need
    to know to feel confident saying yes, rather than handing them a question.
  keyPrompts:
  - What would a normal week in this role or course actually look like?
  - What would tell you whether you would be supported and able to grow here?
  - What are you genuinely unsure about that only they can answer?
  watchOuts:
  - Learners copy generic questions off a list without meaning them; ask them to tie each question to something they personally want to know, so it survives a follow-up in the real interview.
  adaptation: |
    If the journal is not available digitally, the same prompts can be answered on paper and copied in
    later. The drafting needs no connectivity.
- title: Sort your questions and keep the strongest
  duration: 5-10 min
  guidance: |
    Have learners review their own list and sort it: which questions show genuine interest, which help
    them judge the opportunity, and which could be answered by a quick look at the website and so waste
    the moment. Ask each learner to keep a shortlist of three or four they would actually ask, and to
    note why each one earns its place.
  keyPrompts:
  - Which of these could you already answer from their website or the job advert?
  - Which questions would give you information you cannot get any other way?
  - If you could only ask two, which would they be, and why?
  watchOuts:
  - Learners keep questions that are easily answered elsewhere and look unprepared; have them cut anything a quick search would cover and keep only questions that need an insider's answer.
  adaptation: |
    Sorting works fully on paper: learners number or tick their shortlist by hand. No device is needed.
- title: Swap, give feedback and practise aloud
  duration: 15-20 min
  guidance: |
    Put learners in groups of three to five with a scribe. Each learner reads out a question or two and
    the group gives specific feedback: which they liked and why, and which could be sharper and how.
    Then have learners practise asking two or three aloud so the wording feels natural under pressure.
    The scribe captures at least one strengthened question for each member.
  keyPrompts:
  - Which of your partner's questions did you like, and what made it strong?
  - Which question could be sharper, and how would you reword it?
  - How did it feel to ask that aloud, and would you change the wording?
  watchOuts:
  - Feedback stays vague ("they're all good") and nothing improves; model one specific comment yourself first, and ask each learner to name the single change they are making to a question.
  adaptation: |
    With thin attendance or in a mentoring setting, the facilitator or mentor plays the interviewer,
    answers the questions and gives the feedback. Asynchronously, learners post their shortlist and
    reply to two peers with one thing to keep and one to sharpen.
- title: Capture what the activity taught you
  duration: 5 min
  guidance: |
    Close the loop individually. Ask each learner to write, in their journal, what the activity taught
    them about the interview process and how they will use this in a real interview. This turns practice
    into a portable habit and gives you a quick read on who now sees the interview as a two-way
    conversation and who still treats it as a one-way test.
  keyPrompts:
  - What did completing this activity teach you about the interview process?
  - How will you use this the next time you are interviewed?
  - Which one question will you make sure you are ready to ask?
  watchOuts:
  - Learners write a vague "ask questions" with nothing concrete; push for one specific question they will carry into their next interview so the learning is usable.
closing: |
  Ask two or three learners to share the strongest question they will take with them, so the group hears
  a range of good options. Remind everyone that their shortlist lives in the Pathways Journal and can be
  adapted for any interview: the point is not a fixed script but the habit of turning the closing
  question into information they can use.
agencyContribution:
  indicators:
  - control-of-future-pathways
  how: >-
    Asking questions at interview turns the learner from someone being judged into someone also doing
    the judging. Preparing questions that test whether an opportunity fits them means the learner helps
    decide which pathway they take, rather than accepting whatever is offered.
principlesForegrounded:
- lifeworthy-competencies
- collaboration
- connect-to-futures
principleAlignment:
- principle: lifeworthy-competencies
  how: >-
    Knowing how to interview the interviewer is a transferable skill a learner reuses for every job,
    course and opportunity for years, and the activity ends with a real shortlist they own rather than
    a one-off exercise.
- principle: collaboration
  how: >-
    The breakout round is built on peers giving each other specific feedback on their questions, so each
    learner's shortlist is sharpened by the group spotting weak or strong questions the writer could not
    judge alone.
- principle: connect-to-futures
  how: >-
    The whole activity rehearses a real gateway to a learner's next pathway, and the questions they draft
    are aimed at deciding whether a specific future opportunity is right for them.
competencyCodes:
- FLC3
- FPS1
competencyDevelopment:
- code: FLC3
  how: >-
    Framing a question that both signals genuine interest and draws out the information a learner needs,
    then practising it aloud, is direct practice in influential communication; the shortlist and the
    mock exchange are the evidence.
- code: FPS1
  how: >-
    Sorting questions by what fits the specific role and adapting them to what an interviewer's answers
    reveal, rather than reciting a fixed script, develops adaptable thinking under the pressure of a live
    conversation.
