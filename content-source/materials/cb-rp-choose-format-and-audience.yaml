principlesForegrounded: [recognise-communicate-growth, responsible-action, authentic-challenges]
principleAlignment:
- principle: recognise-communicate-growth
  how: The whole activity is about communicating what learners found in a form an audience can receive and use.
- principle: responsible-action
  how: Learners choose an audience who could act, and plan to represent the evidence and its limits honestly rather than overclaim.
- principle: authentic-challenges
  how: The findings being shared are about a real, shared challenge — the trees on the hills the learners live on.
competencyCodes: [FSI1, FLC3, FPS1]
competencyDevelopment:
- code: FSI1
  how: Communicating findings so others can use them is the final stage of investigating a real-world issue.
- code: FLC3
  how: Learners choose an audience and a format so the message lands — the core of communicating with influence.
- code: FPS1
  how: Matching the format to the purpose and the audience, rather than defaulting to one output, is adaptable thinking.
