facilitationNotes: >-
  The one thing to get right: match format to purpose and audience — there is no single required output.
  Start from who we want to reach and what we want them to understand, then let the format follow from
  that, not the other way round. Keep it oral and visual: whatever they choose must work when spoken and
  shown, not only when read. Hold the honesty line early — the plan should show what we found AND its
  limits, so no one plans to overclaim. And make it safe: no learner is pushed toward a way of presenting
  that is unsafe for them, and no names of the people they spoke to go into any output.
steps:
- title: "Who most needs to hear this?"
  duration: "30 min"
  guidance: >-
    Bring back our insight statements. Ask who most needs to hear what we found — our peers, our
    families, the wider community, a camp committee — and why it should matter to them. Let learners
    argue for different audiences; the choice shapes everything after it.
  keyPrompts:
  - "Who could do something with what we found?"
  - "Why should this audience care about our hills?"
  - "What is the one thing we most want them to understand?"
- title: "Choose a format that fits"
  duration: "30 min"
  guidance: >-
    Show a few formats and talk through which fits the message and the audience — a poster, a spoken
    talk with pictures, a role-play or story, a simple infographic. Remind them it must work spoken and
    shown, not only read. There is no single right answer; a good fit is one the audience will follow and
    that lets us show our evidence.
  keyPrompts:
  - "Which format will this audience actually follow?"
  - "Can we show our evidence in this format, not just say it?"
  watchOuts:
  - "Steer away from a format that hides the evidence or that only works on paper for readers."
- title: "Plan what it says and shows"
  duration: "30 min"
  guidance: >-
    In teams, learners plan what their output will say and show, and mark against the evidence log where
    each part comes from. Ask them to plan how they will show the limits honestly too — for example, that
    we only spoke to a few people. They agree a safe way to present and check no names go in.
  keyPrompts:
  - "For each thing we say, where is our evidence for it?"
  - "How will we show what our evidence does NOT tell us?"
learnerContent: |
  ## Choosing how to tell what we found

  We have found things out about our question: what happens to our hills without trees, and what changes
  when trees and plants grow back. Now we decide how to tell people.

  First, who most needs to hear it? Our friends, our families, the wider community, a camp committee?
  Choose the people who could care and could act.

  Then choose how to tell them. There is no single right way. Pick what fits your message and your
  people, and what works when you speak it and show it:

  - a poster
  - a talk with pictures
  - a role-play or a story
  - a simple infographic

  Then plan it. For each thing you want to say, ask: where is our evidence for this? And be honest about
  what we do NOT know — for example, "we only spoke to a few people". Never use the names of the people
  we spoke to.
