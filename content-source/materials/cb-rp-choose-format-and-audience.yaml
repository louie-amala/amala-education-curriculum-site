# Contextualised, fully offline ACTIVITY for the Research Project component of Learning Bridge+ (Cox's
# Bazar). Phase 5 "Communicate findings". Learners decide who most needs to hear what they found, and
# choose a format that fits both the message and an oral, visual context — then plan what their output
# will say and show and how it stands on the evidence. Oral and visual first; no single required output.
id: cb-rp-choose-format-and-audience
slug: cb-rp-choose-format-and-audience
access: public
edition: learning-bridge-coxs-bazar
type: activity
title: "Choose our format and our audience"
summary: >-
  Learners decide who most needs to hear what they found — peers, families, the wider community, a camp
  committee — and choose a format that fits both the message and an oral, visual context. They plan what
  their output will say and show, and how it will stand on the evidence.
facilitationContext:
- group
- independent
primaryContext: group
duration: "1.5 hours facilitated + 1 hour independent"
grouping: "Whole group to think it through, then small teams by audience or format"
whatLearnersDo:
- Decide who most needs to hear what we found, and why it should matter to them.
- Choose a format that fits the message and works when spoken and shown — a poster, a talk with pictures, a role-play or story, a simple infographic.
- Plan what the output will say and what it will show, and how each part stands on the evidence we gathered.
- Agree a way to present that is safe for everyone, using no names of the people we spoke to.
materialsAndPreparation:
- The cohort's insight statements from the analysis phase, written or drawn big to see.
- The evidence log, to check each part of the plan against what we actually found.
- A few example formats to point to — a poster, a picture story, a short spoken talk with drawings.
- The planning page from the research book (one per learner or per team).
