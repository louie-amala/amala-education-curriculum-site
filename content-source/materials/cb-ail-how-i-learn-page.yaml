learnerContent: |
  ## How I learn best

  This page is yours. You can draw, write, or say your answer - someone will write it for you if you
  ask - and nobody marks it right or wrong.

  - Mark when you learn best, and who helps you.
  - Draw or write where you learn best.
  - Say what helps you learn, and what gets in your way.
