rights:
  status: own-expression
  holder: "UC Berkeley YPAR Hub; the source plan credits Education World and Teacher Scholastic"
  basis: >-
    A two-column stereotype-listing exercise is a widely used method with no single traceable author.
    Every word here is written from scratch, including all of the example words in the diagram; none of
    the YPAR Hub's, Education World's or Scholastic's wording is reproduced.
  note: >-
    The source supplies its own list of typical responses. Do not copy it in; the point of the activity
    is that the list comes from the room.
sourceRefs:
  - "YPAR Hub (UC Berkeley), Get Started > Understanding Oppression > Busting Stereotypes lesson plan"
  - "Credited in that plan as adapted from Education World and Teacher Scholastic"
provenanceNote: >-
  Rewritten from the YPAR Hub's "Busting Stereotypes", supplied to Amala in August 2026. The two-column
  structure, the reflection questions and the stereotype-threat teaching point are the source's. The
  guidance on choosing categories other than man and woman, the sensitivity handling, the answer to a
  learner who defends an item with a real case, and the closing gesture of erasing the board are
  Amala's. Stereotype threat is given its own page rather than delivered from a paragraph, because the
  source's account of it states the effect more confidently than the evidence supports.
