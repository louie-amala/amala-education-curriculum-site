id: cb-ail-feedback-page
slug: cb-ail-feedback-page
access: partner
edition: learning-bridge-coxs-bazar
type: resource
title: "Feedback I got"
summary: >-
  What one person said when asked what could be better, and what the learner decides to do with it. Keep it, hold it, or let it go.
facilitationContext:
- group
- independent
primaryContext: independent
learnerContent: |
  ## Feedback I got

  This page is yours. You can draw, write, or say your answer, someone will write it for you if you
  ask, and nobody marks it right or wrong.

  - Say who you asked.
  - Write or draw what they said.
  - Decide what to do with it: keep it, hold it, or let it go.
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  how: >-
    Keeping their own record of what they decided, and why, is what lets a learner carry a goal
    between sessions without an adult holding it for them.
