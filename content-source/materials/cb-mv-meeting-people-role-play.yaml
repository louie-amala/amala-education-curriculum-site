provenanceNote: >-
  Contextualised, fully offline adaptation of efi-mv-role-play-meeting-people for the Learning Bridge+
  (Cox's Bazar) edition. The source leans on a written model dialogue and situation cards and assumes
  learners can read the frames; this version is rebuilt for emergent literacy — the exchange is modelled
  and learned entirely by ear, built on the spoken frames from cb-mv-i-am-sentences, practised as
  repeated low-stakes speaking in same-gender pairs to build fluency and confidence, with no reading or
