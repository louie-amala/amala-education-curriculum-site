# Contextualised, fully offline adaptation of efi-mv-role-play-meeting-people for Learning Bridge+
# (Cox's Bazar). The key shift from the source: the source leans on a written model dialogue and situation
# cards; here the whole exchange is oral, learned by ear from the facilitator's modelling and built on the
# spoken frames from cb-mv-i-am-sentences. No reading or writing needed — just repeated, low-stakes
# speaking in same-gender pairs to build fluency and confidence. Oral first, no devices. Objective 2.
id: cb-mv-meeting-people-role-play
slug: cb-mv-meeting-people-role-play
access: public
edition: learning-bridge-coxs-bazar
type: activity
title: "Meeting someone new"
summary: >-
  Learners rehearse real first meetings out loud — greeting someone, introducing themselves, and
  introducing a friend — using the spoken frames they already know. Lots of low-stakes practice in
  same-gender pairs turns the language into something they can really use, and builds the confidence to
  use it.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    The natural home for role-play. Learners meet the little exchange by ear, practise it in same-gender
    pairs, then swap partners so they meet several people. The group gives the repetition and the real
    partners the task needs, and a warm, invitation-only chance for a willing pair to greet each other in
    front of everyone gives the practice a purpose without piling on pressure.
- context: one-to-one-mentoring
  how: >-
    A safe first rehearsal for a learner who dreads speaking. The mentor plays the other person, going as
    slowly as needed and letting the learner run the greeting again and again until it is comfortable —
    then, when they are ready, hand them into a same-gender pair in a group session so the exchange
    becomes real with a peer.
- context: independent
  how: >-
    Role-play needs a partner, so this is weak alone. A learner can rehearse both parts aloud at home, or
    practise a real greeting with someone they trust, but arrange a paired rehearsal in a group session so
    the meeting is a genuine exchange. The independent task is to greet and introduce themselves to one
    person before the next session.
duration: "2 hours facilitated across two sessions"
grouping: "Same-gender pairs, rotating partners; works with 10-35 learners"
whatLearnersDo:
- Greet someone and answer a greeting out loud.
- Introduce themselves using the spoken frames they already know.
- Introduce another person — "this is my friend ___" — to a third person.
- Meet several partners, so greeting and introducing become easy and unforced.
materialsAndPreparation:
- Your own greeting ready to model first — hello, your name, where you are from, one thing you like, goodbye — said warmly and slowly.
- The frames from cb-mv-i-am-sentences fresh in mind (I am ___, I am from ___, I like ___), as the language learners bring to the meeting.
- A trusted volunteer or a mentor to be your partner when you model the exchange, so learners see a real two-person meeting.
- "Sensitivity: introducing yourself can invite questions about home and family. Keep the exchange short and light, and make clear a learner can share only their name and one small thing they like; nothing more is ever required."
facilitationNotes: |
  Role-play is where the unit's language becomes something a learner can actually use — meeting a
  neighbour, a new classmate, a health worker — which is exactly what makes it worth the effort to them.
  Unlike a literate group that can read a model dialogue off the page, here the exchange is learned by
  ear: you model it, warmly and more than once, and learners copy the shape before they make it their
  own. Keep the meeting short — a greeting, a name, one thing about yourself, a goodbye — because a
  beginner needs the safety of a small, known shape before improvising. The heart of the activity is
  repetition in same-gender pairs with different partners: that is where the fluency and the confidence
  grow, not in performing for the group. Value the meeting over the accuracy: if the two people
  understood each other, it worked. Any sharing to the whole room is invitation-only, always.
steps:
- title: "Watch a meeting, then copy it"
  duration: "30-35 min"
  guidance: |
    With a volunteer or mentor as your partner, act out a short first meeting so learners see and hear
    the whole shape: "Hello. — Hello. What is your name? — I am ___. Where are you from? — I am from ___.
    Nice to meet you. — Nice to meet you too." Do it two or three times. Then the whole group says it
    with you as a chorus, and learners try the whole little exchange in same-gender pairs, copying the
    shape before changing anything. Let them run it all the way through for flow, not perfectly.
  keyPrompts:
  - How do we start? How do we ask someone's name?
  - Try the whole meeting with your partner, from hello to goodbye.
  watchOuts:
  - Getting stuck polishing one line; let pairs run the whole exchange for flow first, because the shape matters more than any single word.
  - A learner anxious they cannot remember it all; a short, fixed shape said many times is exactly the support they need, so keep it the same and let repetition carry them.
  adaptation: |
    No dialogue on paper is needed at all. You and a partner acting it out, then the group echoing it, is
    the whole material; the exchange lives in the ear.
- title: "Make it your own meeting"
  duration: "35-40 min"
  guidance: |
    Now learners fill the meeting with their own true information — their own name, their own "I am from"
    and "I like" — and practise it with a new same-gender partner, then swap roles so each plays both
    people. Encourage a warm greeting and goodbye around it. Rotate partners two or three times so the
    same short meeting is repeated with fresh faces and starts to feel easy.
  keyPrompts:
  - Use your own name and your own words this time.
  - Now swap — you be the person being greeted.
  watchOuts:
  - Slipping back into reciting the model word for word; nudge learners to use their real answers so the meeting is genuine, not a recitation.
  - "A partner pressing with questions a learner does not want — \"why did you leave?\", \"where is your family?\"; remind pairs that a meeting is short and friendly, and no one has to answer more than their name and one thing they like."
  adaptation: |
    No situation cards are needed; the plain "meeting a new classmate" scene works with nothing but two
    people and the words they already have.
- title: "This is my friend"
  duration: "30-40 min"
  guidance: |
    Add one new move: introducing another person. In same-gender threes, one learner introduces their
    partner to the third — "Hello. This is my friend Ayesha. She is from ___." — using the "she is / he
    is" they met in cb-mv-i-am-sentences. This is a real, useful thing to be able to do, and it recycles
    the pronouns in a live exchange. Rotate so each learner both introduces and is introduced.
  keyPrompts:
  - Introduce your friend to someone new — "This is my friend ___. She is from ___."
  - Now let your friend introduce you.
  watchOuts:
  - He/she mixing up when introducing a friend; treat it as ordinary and let the repetition steady it, rather than stopping the meeting to correct.
  - Shyness at being spoken about; keep the introduction to a name and one light thing, and let the person being introduced choose what their friend may say.
  adaptation: |
    Where a full three is hard to arrange, two learners take turns being an imagined new person; the
    "this is my friend" move works just as well with a mimed third person.
closing: |
  Recap the shape of a first meeting out loud together: greet, introduce yourself, introduce your friend,
  say goodbye. Name what they can now do — meet someone new in English, something they will really use
  outside the class — and note how much easier it felt by the last partner than the first. Independent
  task: before the next session, greet one person and introduce yourself to them in English, even if it
  is just "Hello, I am ___", and be ready to tell the group how it went.
agencyContribution:
  indicators:
  - contribution-to-community
  - power-over-wellbeing-and-self-direction
  how: >-
    Meeting people and making yourself known is how a person joins a community rather than stands outside
    it. Rehearsing first meetings, again and again in a safe pair, gives learners both the language and
    the confidence to greet a neighbour, a classmate, or a health worker and connect, on their own terms,
    in the real situations they face.
principlesForegrounded:
- safe-spaces
- builds-on-identities
- lifeworthy-competencies
principleAlignment:
- principle: safe-spaces
  how: >-
    A short, known shape to lean on, pair rehearsal before any performance, same-gender pairs, and
    invitation-only sharing to the group all keep speaking safe for beginners, so the risk of trying
    aloud is small and the success is frequent.
- principle: builds-on-identities
  how: >-
    Learners meet each other as themselves — their own name, their own place, their own likes — and
    introduce real friends to real people, so the practice is built on who is actually in the room.
- principle: lifeworthy-competencies
  how: >-
    Greeting someone, introducing yourself, and introducing another person are everyday communication
    skills a learner will use for the rest of their life, in every new place and every first meeting.
competencyCodes:
- FLC3
competencyDevelopment:
- code: FLC3
  how: >-
    Greeting, introducing oneself, and introducing a friend in a real spoken exchange — repeated with
    several partners until it flows — is direct practice in communicating clearly and confidently in
    real time.
