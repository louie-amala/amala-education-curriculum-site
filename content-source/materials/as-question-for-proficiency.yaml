id: as-question-for-proficiency
slug: as-question-for-proficiency
access: public
type: educator-move
title: "Ask questions that reveal proficiency"
summary: >-
  Questioning is one of the surest ways to see what a learner really understands. Probe, follow up,
  and ask them to justify, so you assess the person, not a rehearsed answer.
tags:
  - id: seeking-evidence
educatorContent: |
  You cannot see a competency directly, so you engineer situations that reveal it, and questioning is
  one of the most reliable. Both informally, in conversation, and formally (a viva-style verbal
  assessment), well-aimed questions surface what a learner genuinely understands and can do.

  Interpret rather than evaluate: a hesitant or wrong answer often tells you more than a fluent one,
  because it shows the edge of what they can do. Ask them to justify and explain, "how did you work
  that out?", "what would you do if…?", and follow up to probe depth rather than accepting the first
  answer. Where questioning is formal, agree the criteria and share questions in advance, and keep it
  proportionate. Questioning is also harder to fake than a product, which is part of why it is such
  good evidence of the person behind the work.
agencyContribution:
  indicators:
    - power-over-wellbeing-and-self-direction
  how: >-
    Being asked to explain and justify their thinking helps a learner articulate what they know and
    can do, which both evidences proficiency and strengthens their ownership of it.
principleAlignment:
  - principle: feedback-and-data
    how: >-
      Probing questions generate direct evidence of understanding, and treat a wrong answer as
      information about where the learner is rather than a mark against them.
  - principle: recognise-communicate-growth
    how: >-
      Asking learners to explain their evidence helps them name and communicate their own proficiency.
relatedSlugs:
