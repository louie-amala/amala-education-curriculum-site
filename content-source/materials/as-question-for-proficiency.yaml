sourceRefs:
  - "AMALA Global Secondary Diploma (GSD) Educator Guide / Handbook. Course Facilitator Playbook (Assessment)"
provenanceNote: >-
  Generalised from the Playbook's assessment methods (Viva Voce; the questioning stance in "Making
  Learning and Thinking Visible", interpret don't evaluate, ask learners to justify).
