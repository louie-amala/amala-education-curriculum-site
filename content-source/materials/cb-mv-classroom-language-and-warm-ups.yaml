# Contextualised, fully offline adaptation of efi-mv-classroom-language-and-warm-ups for Learning Bridge+
# (Cox's Bazar). The key shift from the source: the source displays classroom phrases in writing for
# learners to read. Here almost no one reads yet, so the everyday spoken English of the room is taught
# entirely by ear, gesture, and repetition, and the warm-ups are oral talking-out-loud games with no
# reading demand. The point is to build the habit and safety of speaking English aloud before any
# literacy is asked for. Oral and visual first, no devices. Objective 1.
id: cb-mv-classroom-language-and-warm-ups
slug: cb-mv-classroom-language-and-warm-ups
access: partner
edition: learning-bridge-coxs-bazar
type: activity
title: "The language of our room, and warming up our voices"
summary: >-
  The everyday spoken English of the classroom - hello, thank you, sorry, again please, I don't
  understand, can I - taught by ear and gesture, plus quick oral warm-up games that build a safe, lively
  space for talking out loud. Learners meet the habit and safety of speaking English before any reading or
  writing is asked of them.
facilitationContext:
- group
- one-to-one-mentoring
- independent
primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    The natural home for this. The everyday phrases are learned together through use and gesture, and the
    warm-up games run on the energy of a room - everyone saying a word, a whole group waving hello. Hearing
    others speak imperfectly and safely is what makes a learner brave enough to try. Use same-gender pairs
    for anything said to a partner.
- context: one-to-one-mentoring
  how: >-
    A gentle way in for a learner too shy to speak in front of a group. A mentor can practise the phrases
    and one or two warm-ups quietly, one to one, until the learner can say hello, thank you, and I don't
    understand with ease, then bring them into the group already holding a few sure phrases.
- context: independent
  how: >-
    Limited alone, because these phrases and games are made of talking with others. If a learner works
    independently, the My Voice book can hold a picture for each phrase (a waving hand for hello, a raised
    hand for can I) to jog memory, and the independent task is to use two of the phrases with someone at
    home; the speaking is then picked up again next session.
duration: "About 2 hours facilitated, spread across early sessions, plus the phrases reused in every session after"
grouping: "Whole group for the phrases and games, then same-gender pairs; works with 10-35 learners"
whatLearnersDo:
- Learn the everyday spoken English of the room - hello, thank you, sorry, again please, I don't understand, can I - by ear and gesture, not by reading.
- Pair each phrase with a clear action so its meaning is felt and remembered without any writing.
- Play short, repeatable oral warm-up games that get every voice speaking English out loud, safely and for fun.
- Build the habit of asking for help in English - "again, please", "I don't understand" - so no one has to sit lost.
materialsAndPreparation:
- Your own clear gesture for each phrase decided in advance (a wave for hello, hand on chest for sorry, a raised hand for can I) so the same action always carries the same words.
- A few simple pictures for the phrases to keep in the My Voice book if you have them - optional, since the phrases live in voice and gesture, not on paper.
- Two or three warm-up games chosen to run regularly, so learners come to know and expect them.
- "Sensitivity: speaking a new language aloud in front of others is exposing, and some learners will have been shamed for mistakes before. Never put a single learner on the spot or correct harshly in front of the group; let the shy speak first to a partner or quietly to you, and treat every attempt, however imperfect, as a win. Being understood matters more than being perfect."
visuals:
- kind: example
  title: "Say it, with the action"
  caption: >-
    Each classroom phrase is tied to a gesture, so meaning is carried by the body as well as the word. It
    is always okay to ask.
  spec:
    type: zones
    cardStyle: drawing
    flow: across
    flowLabel: "with"
    zones:
    - label: "Say"
      tone: known
      cards:
      - "hello"
      - "thank you"
      - "again, please"
      - "I don't understand"
    - label: "Do"
      tone: positive
      cards:
      - "wave"
      - "hand on heart"
      - "circling hand"
      - "open hands, shrug"
facilitationNotes: |
  The source displays the classroom phrases in writing for learners to read from a wall. Here almost no one
  reads yet, so this is rebuilt to run entirely by ear, gesture, and repetition - and it does a bigger job
  than vocabulary. Before a beginner will risk a whole English sentence, they need to believe this room is a
  safe place to open their mouth and get it wrong. That safety is built here, early, through two things:
  everyday phrases everyone shares, so the room can run in English without anyone feeling lost, and short
  oral warm-ups that get every voice speaking, out loud, for fun, with the stakes near zero. Teach each
  phrase by using it and showing it - pair the words with a fixed gesture every time, so meaning is felt in
  the body, not read. Use the phrases yourself, consistently, from the very first session, so learners meet
  them in real use. Make the games truly low-stakes: they are for confidence and for building the habit of
  speaking, never for testing, and never for exposing who has not understood. Above all, protect the
  phrases for asking for help - a learner who can say "again, please" and "I don't understand" can take
  charge of their own learning instead of sitting silently lost.
steps:
- title: "Hello and thank you - the phrases we share, by ear and gesture"
  duration: "30-35 min"
  guidance: |
    Introduce a small handful of everyday phrases, one at a time, each with a fixed gesture: hello (wave),
    thank you (small bow or hand on chest), sorry, goodbye. Say the phrase, do the gesture, and have the
    whole group say and do it back, several times, warmly. Do not try to cover many at once - a few, truly
    owned, are worth more than a long list half-heard. Then use them for real: greet learners with hello,
    thank them with thank you, so the phrases live in use rather than as a lesson. Invite bridges to the
    languages they already speak - what is hello in Rohingya, in Burmese, in Arabic? - so the new words hang
    on words they own.
  keyPrompts:
  - Say it with me, and do the action. Again, a little louder.
  - What is this in a language you already speak? Let's hear it.
  - "(used for real) Hello! Thank you. Goodbye - see you next time."
  watchOuts:
  - Rushing through many phrases so none stick; keep to a few and bring them back every session, since it is the repeated real use that fixes them.
  - A learner mouthing silently from shyness; let them do just the gesture first, and treat the gesture alone as taking part until the voice comes.
  adaptation: |
    Nothing is needed but your voice, your hands, and the room. The gestures are the whole aid; no cards,
    board, or paper are required for any of this.
- title: "It is always okay to ask - the help phrases"
  duration: "30-35 min"
  guidance: |
    Teach, the same way, the phrases that let a learner take charge when they are lost: "again, please", "I
    don't understand", "can I…", "how do you say…?", each with a gesture (a circling hand for again, open
    hands for I don't understand, a raised hand for can I). Then make it safe to use them: deliberately say
    something too fast, and praise loudly the first learner who says "again, please". Show, out loud, that
    asking is not failing - it is exactly what a good learner does. Practise in same-gender pairs so everyone
    says each phrase several times without an audience.
  keyPrompts:
  - When you are lost, what can you say? "Again, please." "I don't understand." Try it.
  - Someone just asked me to say it again, which is exactly what the phrase is for. Asking is part of learning.
  - Ask your partner "how do you say ___?" about anything in the room.
  watchOuts:
  - Learners seeing "I don't understand" as an admission of failure; model it yourself, thank those who use it, and make it the most welcomed sentence in the room.
  - Correcting pronunciation so much that asking becomes risky; accept any recognisable attempt, since the point is the courage to ask, not perfect sounds.
  adaptation: |
    A simple picture in the My Voice book - a circling arrow for "again", a puzzled face for "I don't
    understand" - can jog memory where nothing is displayed, but the phrases work on gesture and voice
    alone if there is no paper to spare.
- title: "Warming up our voices - quick talking games"
  duration: "30-40 min"
  guidance: |
    Introduce two or three short oral warm-up games and run them so the group comes to know and expect them.
    Choose from: a greeting round, where each learner in turn says hello and their name to the next; a
    word-around, where the group names as many things as they can in a category (foods, colours, family)
    with each person adding one aloud; say-and-do, where you call quick actions (stand, point to the door,
    wave) and learners do them; and yesterday's word, where each learner recalls one English word from last
    time. Keep rounds short, keep everyone active, and keep the stakes at zero - these are for confidence and
    for making speaking English aloud an ordinary, easy thing.
  keyPrompts:
  - "Greeting round - turn to the person beside you and say: hello, my name is…"
  - Name one food in English. Now the next person. Keep it going around.
  - Yesterday's word - tell me one English word you remember from last time.
  watchOuts:
  - The same confident few carrying every game while others stay silent; use go-around formats so every learner has a turn, and let a quiet learner pass to a partner rather than be stuck alone.
  - A game tipping into a test where wrong answers are exposed; keep it playful, accept every attempt, and reward the group rather than picking winners.
  adaptation: |
    Every one of these games runs on voices and the room alone - no cards, board, power, or devices. They
    work equally well sitting in a circle on the floor of a shelter as at desks.
closing: |
  Close by using the phrases one last time together - a whole-room hello, a thank you, a goodbye - so
  learners leave having spoken English aloud and enjoyed it. Name the win plainly: you can already run part
  of this room in English, and you know how to ask when you are lost, which means you are never stuck. These
  phrases and games come back every session, so they will grow surer each week. Independent task: use two of
  today's phrases - hello, thank you, or "again, please" - with someone at home, and notice how it feels to
  speak English outside the room.
agencyContribution:
  indicators:
  - power-over-wellbeing-and-self-direction
  how: >-
    Knowing the everyday language of the room, and above all being able to say "I don't understand" or
    "again, please", lets a learner take charge of their own understanding rather than sit lost and silent.
    Building the safety and habit of speaking English aloud, in a place where mistakes are welcome, gives
    learners the security from which they can take the risks that learning a language requires.
principlesForegrounded:
- safe-spaces
- lifeworthy-competencies
- builds-on-identities
principleAlignment:
- principle: safe-spaces
  how: >-
    Predictable shared phrases and low-stakes, playful warm-ups make speaking English an ordinary, safe
    thing rather than an exposing test; the room is deliberately built so that asking for help is welcomed
    and every imperfect attempt is a win, which is what lets learners who fear getting it wrong begin to try.
- principle: lifeworthy-competencies
  how: >-
    The phrases for greeting, thanking, and asking for help and clarification are self-advocacy and everyday
    communication skills a learner reuses in every later classroom, every service, and every new setting for
    the rest of their life.
- principle: builds-on-identities
  how: >-
    Each new phrase is bridged to the languages learners already own - hello in Rohingya, Burmese, or
    Arabic sits alongside hello in English - so their existing languages are honoured as knowledge to build
    on rather than left at the door.
competencyCodes:
- FLC3
