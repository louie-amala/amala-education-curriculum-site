- code: FLC3
  how: >-
    Following the everyday spoken language of the room, greeting and thanking people, and asking for
    clarification are foundational communication skills; the warm-up games recycle this language and build
    the fluency and confidence to use it, moving learners from silence toward speaking English aloud.
