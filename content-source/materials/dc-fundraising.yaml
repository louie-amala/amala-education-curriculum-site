provenanceNote: >-
  Enriched into a structured facilitation flow (steps with prompts, watch-outs, adaptations and
  delivery modes) from the Design Challenge activity guide, which supplied the purpose and the breakout
  discussion questions on funding sources and how realistic fundraising is. The source Design Challenge
  investigates the mental health and wellbeing of Afghan females; this material is written to
  generalise to any project needing resources to start. Linked to Social Entrepreneurship objective 3
  (convincing others to invest in or adopt the concept).
