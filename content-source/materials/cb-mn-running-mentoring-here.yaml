# Facilitator start-here resource for the Mentoring and Wellbeing component of Learning Bridge+ (Cox's
# Bazar). Sibling of cb-rp-running-this-offline and cb-ail-running-this-offline.
#
# Why: the programme calls mentoring "the spine of wellbeing support" and the thing that keeps the
# Agency in Learning goal alive between sessions, and it had 343 words in a 100,000-word Educator
# Guide, no plan, no conversation shape, and no record. This is the start of the fix.
