  basis: >-
    The changemaker and changestopper pairing is a teaching device rather than an expression. Every word
    here is written from scratch, and the source's skits and situation sheets, which are set in United
    States high schools, are replaced rather than reproduced.
  note: >-
    Do not import the source's scenarios. They turn on American school discipline, policing and liquor
    laws, and they do not travel.
