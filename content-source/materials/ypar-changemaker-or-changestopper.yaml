provenanceNote: >-
  Rewritten from the YPAR Hub's "Institutional Change", supplied to Amala in August 2026. The two
  figures, the performance structure and the closing test distinguishing institutional from individual
  remedies are the source's. The scenarios are replaced entirely (see
  [changemaker scenarios](/materials/ypar-changemaker-scenarios)); the insistence that these are two
  readings rather than two kinds of person, the caution against treating any mention of individual
  choice as changestopping, and the sensitivity handling are Amala's.
