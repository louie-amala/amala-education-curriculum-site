rights:
  status: own-expression
  holder: Friedrich Glasl (the escalation model)
  basis: >-
    The nine-stage model is Glasl's and is credited as his. Glasl's own stage descriptions are not
    reproduced here: this page characterises the staircase in Amala's words and sends facilitators to
    the Swisspeace collection, which publishes the full table free of charge.
  note: >-
    Do not paste Glasl's stage descriptions onto this page. If a fuller treatment is wanted, seek
    permission or keep pointing at the source.
provenanceNote: >-
  The model is Friedrich Glasl's nine-stage conflict escalation model, reached here through the 2025
  Amala course planner and the Swisspeace conflict analysis collection.
