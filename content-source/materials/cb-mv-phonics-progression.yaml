provenanceNote: >-
  Contextualised, fully offline, emergent-literacy adaptation of efi-phonics-progression (its Unit 1
  content — Part 1 "Alphabet & High-Frequency Sounds" and Part 2 "Plosives") for the Learning Bridge+
  (Cox's Bazar) edition. The source sequences phonics for learners already literate in their Home
  Language and orders it partly by reading; this version rebuilds the order for the ear and for the
  learner's own name, assumes no prior reading or pencil skill, and keeps the source's sounds (short a,
  o, u; consonants s, t, l, m, n; hard "k" as c, k, ck; the voiceless and voiced plosive pairs). It is
  framed as the opening of the wider 10-part progression so learners who continue dovetail into it.
  Objective 1 of the My Voice unit.
