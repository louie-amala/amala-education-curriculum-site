# Contextualised, fully offline adaptation of efi-phonics-progression (its Unit 1 content) for Learning
# Bridge+ (Cox's Bazar). The key shift from the source: this is a scope-and-sequence for the SOUNDS of My
# Voice built for emergent literacy, not literacy transfer. The order is set by the ear and by the
# learner's own name, not by the alphabet or by reading; letters are recognised before they are formed,
# and nothing assumes prior reading. It is the opening of the wider 10-part English for Impact phonics
# progression, so a learner who continues dovetails straight into it. Objective 1.
id: cb-mv-phonics-progression
