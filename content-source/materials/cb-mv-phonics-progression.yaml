primaryContext: group
deliveryAdaptations:
- context: group
  how: >-
    This is a facilitator's map, not a learner worksheet, and it is written for group delivery: the
    sounds are met, sorted, and played with together across cb-mv-alphabet-and-first-sounds,
    cb-mv-key-sounds-and-games, and cb-mv-sound-and-letter-practice. Use it to decide the order to
    introduce sounds and to see why each comes when it does, so the group is never asked for a sound its
    ear is not ready for.
- context: independent
  how: >-
    A facilitator or a mentor can use this alone to plan, and a learner working independently follows its
    order through their My Voice book — the name first, then the first few sounds, then the picture-words
    that record what their ear can now catch. The sequence is what keeps stop-start attendance from
    breaking the thread: whenever a learner returns, it says plainly what comes next.
materialsAndPreparation:
- The keystone activities this sequence orders — cb-mv-alphabet-and-first-sounds, cb-mv-key-sounds-and-games, and cb-mv-sound-and-letter-practice — to hand.
- Each learner's own name ready to work from, and a few everyday example words for each sound that matter locally (a pot, a cat, a mat, rice, a goat).
- The My Voice book, where each learner keeps their name, their first sounds, and a picture-word for each sound they come to own.
- "Sensitivity: the sequence starts from the learner's own name, which can carry family and story. Most learners are proud to work from their name, but the same order works just as well built from another word that matters to them — a place, a colour, a thing they like — so a learner who would rather not use their name loses nothing."
facilitationNotes: |
  This is the map that keeps the sound work in order for a cohort meeting written English for the first
  time. The source it grows from sequences phonics for learners who can already read in their Home
  Language; here the order is rebuilt for the ear, because most learners are not yet reading in any
  language and some have never held a pencil. So the first principle is sound before letter: a learner
  hears and says a sound long before they are asked to recognise or form the letter that carries it. The
  second is that everything starts from the learner's own name — a beginner will work hard on the sounds
  of their own name when an abstract drill would defeat them. The third is that a few consonants plus one
  short vowel come early and together, on purpose, so that the very first whole words can be built and a
  learner feels the pay-off of sounds joining into meaning. Final consonants are given real weight,
  because in English "sock" and "so" are different words and dropping the end sound loses the meaning.
  The voiced and voiceless plosive pairs come last in this opening stretch, because they are the hardest
  to hear apart and some languages learners already speak do not split them. Welcome every bridge to
  Rohingya, Chittagonian, Burmese, and Arabic throughout — a new sound hung on a known one is learned
  fastest. Go slow, come back over many sessions, and treat every sound said aloud as a win. This is only
  the opening of a much longer road: it is Part 1 and the start of Part 2 of the ten-part English for
  Impact phonics progression, so a learner who carries on steps straight into the short vowels e and i,
  the fricatives, and the rest without a break.
educatorContent: |
  ## How to read this sequence

  This is the order to introduce the sounds of My Voice for learners who are not yet reading. It is an
  ear-first order, not the alphabet and not a reading order. Introduce a sound only when the ear is ready
  for it, come back over many sessions, and never rush to add more. A learner who truly owns six sounds
  has a foundation; one who half-meets twenty holds none.

  Each stage names the sounds, why they come when they do, and where in the activities they are worked.

  ### Stage 1 — Start from the ear and from your own name

  Sounds: the first sound of each learner's own name.

  The very first work is the big idea that a spoken word is made of sounds, and that the sound a name
  begins with can be caught by the ear. No letters yet as things to be read — only sounds heard and said.
  This is the heart of cb-mv-alphabet-and-first-sounds. Everything after hangs on it.

  Teaching notes:

  - Lead with the sound, not the letter name. The sound is what unlocks words.
  - Start every learner from their own name, or from another word that matters to them if they would rather.
  - Invite bridges to Rohingya, Chittagonian, Burmese, and Arabic — "is there a sound like this in a language you already know?"

  ### Stage 2 — A first handful of consonants and one short vowel

  Sounds: consonants s, t, l, m, n, and the short vowel a.

  These few consonants plus one short vowel are introduced early and together, on purpose, because they
  are enough to build the first whole words a learner can hear and say — sat, mat, man, tan. This is the
  moment sounds stop being separate and join into meaning. Worked in cb-mv-key-sounds-and-games (sorting
  and clapping) and consolidated in cb-mv-sound-and-letter-practice (build-a-word).

  Teaching notes:

  - Bring the vowel a in alongside the consonants so whole words are possible straight away.
  - Recognition of the letter comes before forming it; a learner should know a letter well by sight before being asked to make it.
  - Double consonants (tt, ll, mm, nn) make the same single sound — worth noting when it comes up, not drilling.

  ### Stage 3 — The other two short vowels

  Sounds: the short vowels o and u (reviewing a).

  With a secure, add o and u so more words open up — pot, mop, sun, mud, nut. Short vowels are easy to
  slur, so keep them slow and clear and tied to a picture-word the learner chooses. Worked across
  cb-mv-key-sounds-and-games and cb-mv-sound-and-letter-practice.

  Teaching notes:

  - Change one vowel and the word changes — sat, sit is for later, but sun and son-of-a-word play shows the idea early.
  - Keep each vowel attached to a clear example word and a picture in the My Voice book.

  ### Stage 4 — The hard "k" sound and its spellings

  Sounds: the hard "k" sound, spelled c, k, and ck.

  One sound, three ways to write it — cat, kit, sock. Teach the sound first as one thing the ear hears,
  and let the three spellings be met gently as they turn up in real words, not as a rule to memorise.

  Teaching notes:

  - The learner hears one sound; the three spellings are a later, lighter noticing, not a drill.
  - This is where final consonants start to matter hard — "sock" versus "so" are different words.

  ### Stage 5 — Final consonants carry meaning

  Sounds: the same consonants heard and made at the END of words (sat, man, mop, sock).

  In English the end sound is where much of the meaning lives, and a learner who drops it is not
  understood. Give final sounds real, patient weight — hearing them, saying them, and placing the last
  letter when building a word. Worked in cb-mv-sound-and-letter-practice (build-a-word and the emergent
  dictation).

  Teaching notes:

  - "sock" versus "so", "man" versus "ma" — make the difference audible and meaningful.
  - Check the whole word when a learner builds one; the last sound is the one most often dropped.

  ### Stage 6 — The plosive pairs: same mouth, voice on or off

  Sounds: voiceless p, t, k and voiced b, d, g.

  These come last in this opening stretch because they are the hardest to hear apart. p and b (and t/d,
  k/g) are made in the same place in the mouth; only the voice separates them. A hand on the throat lets
  a learner feel the buzz on b, d, g and the quiet on p, t, k. Minimal pairs said aloud — pat and bat,
  tan and Dan, cap and gap — carry the big idea by ear: one small change of sound makes a different word.
  This is Part 2 of the wider progression, worked in cb-mv-key-sounds-and-games and consolidated in
  cb-mv-sound-and-letter-practice.

  Teaching notes:

  - Some languages learners already speak do not split these pairs — expect mixing at first and name it as normal, not error.
  - Use the hand-on-throat check and the paper-strip breath check rather than a lecture on the mouth.
  - Keep it a physical, playful listening game tied to real words.

  ## What comes next, if learners continue

  This sequence is the opening of the ten-part English for Impact phonics progression. A learner who
  carries on moves next into the short vowels e and i and simple consonant-vowel-consonant patterns
  (Part 3), then the fricatives (Part 4), the long vowels (Part 5), and on through the rest. Because this
  version follows the same ear-first, most-useful-first logic, a learner steps into the wider progression
  without a break — the difference is only that here the road is walked by ear and by name, with reading
  and writing kept gentle and optional, for a cohort meeting written English for the first time.
agencyContribution:
  indicators:
  - control-of-future-pathways
  how: >-
    A clear, ear-first order for teaching English sounds lets a facilitator build a beginner's decoding
    step by step, so reading and writing — the gateway skills for further study, work, and dealing with
    the written world alone — develop reliably rather than by chance. For a cohort meeting written English
    for the first time, an order that never asks for a sound the ear is not ready for is what keeps that
    gateway open rather than slamming it shut on the first hard day.
principlesForegrounded:
- lifeworthy-competencies
- feedback-and-data
- safe-spaces
principleAlignment:
- principle: lifeworthy-competencies
  how: >-
    The sequence builds the foundational literacy skill of hearing and decoding English sounds — the
    ground floor a learner reuses in every later session, every form, and every sign for the rest of
    their life — and it orders that skill so it is actually learnable by a pre-literate adult.
- principle: feedback-and-data
  how: >-
    Sequencing sounds from most useful to hardest, and tying each to the activity where it is worked,
    lets a facilitator pace the sound work to what learners' ears can actually catch, and see plainly
    which sounds are secure and which need coming back to across sessions.
- principle: safe-spaces
  how: >-
    An order that leads with the ear, starts from the learner's own name, and holds the hardest contrasts
    until last is built to protect a beginner from being asked for more than they can give — so the risk
    of shame that stops a pre-literate learner from trying at all is designed out of the sequence itself.
competencyCodes:
- FLC3
competencyDevelopment:
- code: FLC3
  how: >-
    A sound order for introducing the sounds of English underpins accurate decoding and pronunciation —
    the ground floor of reading, writing, and being understood — by making sure each sound is met when the
    learner's ear is ready to hold it.
