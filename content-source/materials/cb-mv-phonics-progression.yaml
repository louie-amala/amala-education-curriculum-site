access: public
edition: learning-bridge-coxs-bazar
type: resource
title: "The order to teach the sounds of My Voice"
summary: >-
  A short, offline scope-and-sequence for the sounds of My Voice, ordered for a pre-literate cohort: ear
  before letter, starting from the learner's own name, then a few consonants and one short vowel so the
  first whole words can be built, then the final consonants that carry meaning, then the plosive pairs.
  It is the opening of the wider 10-part English for Impact phonics progression, so learners who continue
  dovetail straight into it.
