educatorContent: |
  ## Using the "My name" page

  This is the learner-facing sheet for the cb-mv-alphabet-and-first-sounds activity. The learner's name is
  written large and clear for them to trace over, with a box for the first sound or letter of their name.
  Let them first look at and point to their name and its first letter — recognition comes before
  formation — then trace it as many times as they like, with a pencil or a finger in sand or dust. Say the
  first sound aloud together as it goes in the box. For many this is the first time they write their own
  name, so give it time, help quietly, and praise the effort, not the neatness.

  This page is incorporated into the downloadable Student My Voice book (workbook), as the "My name" page.
learnerContent: |
  ## Your "My name" page

  This page is about your own name — the first word you learn to read and write in English.

  - Look at your name written large on the page. Point to it. Point to its very first letter.
  - Trace over your name with your finger or a pencil, as many times as you like. There is no rush.
  - Say the first sound of your name out loud, then put that first sound or letter in the box.
  - This page is the anchor of your My Voice book. Everything else you collect is built out from your own name.
