duration: "About 2 hours, plus about 1 hour of preparation in the sessions before it"
grouping: "Whole cohort, with same-gender grouping and seating wherever that is what lets girls take part"
learnerContent: |
  ## Our showcase

  In our last week we hold one sharing for everything we have done. It is not a test. Nobody is marked
  on it, and nobody has to do a part of it they do not want to do.

  ### The three things

  1. **Our research.** With your group, you show what we found out about our hills and trees, and what
     we think it means. You made this - a poster, a picture story, a talk, a role-play.
  2. **My voice.** You show your "My Name, My Voice" card and say your introduction in English. A few
     true words is a full success.
  3. **How I have grown.** You say or show one way you are different from the person who started this
     programme. One thing. It can be small.

  ### The person you invite

  You choose one person to invite, and you invite them yourself.

  It can be anyone: someone at home, a neighbour, a friend, a teacher, someone who helped you with your
  goal, someone you interviewed for our research. Think about who you would most like to see this - or
  who most needs to hear what we found out about the hills.

  Your facilitator will help you with what to say when you ask, and will give you something to hand
  them with the day and the time on it. If the person you want cannot come, invite someone else - and
  if you would rather not invite anyone, that is allowed too, and nobody will ask you why.

  ### What to say when you invite someone

  Practise it once with a partner first. Something like:

  > "I have been learning for twelve weeks. On ____ we are showing what we did. I would like you to
  > come. It takes about two hours."

  ### If sharing in front of everyone is too much

  It still counts if you:

  - present to a small group instead of the whole room,
  - present with your group and let someone else do the talking,
  - show your card to your mentor and the person you invited, and no one else,
  - or ask your facilitator to read your words for you while you hold your work.
educatorContent: |
  ## Why one showcase and not three

  Your three unit plans each end with a sharing, and the week map lands all three in the last week.
  Running them separately is three occasions to organise, three audiences to gather, and three chances
  for a learner to be absent for their own ending. Run once, together, they reinforce each other: the
  same person shows what their group found out, says who they are in English, and names how they have
  grown. It is the only time anyone sees the whole programme in one learner.

  The hours are already in your plans. Take the Research Project's "Share our findings" block as the
  spine, and fold in the My Voice sharing and the Agency in Learning celebration rather than adding
  time. Preparation happens in the sessions of the week before, which the three plans already allow for.

  ## The invitation is the point

  The Research Project already requires learners to share with an audience they chose. What this adds
  is that each learner chooses and invites at least one person THEMSELVES, and does the asking.

  Do not do this for them. A facilitator who quietly invites everyone's families has organised a nice
  event and removed the only part of it that builds agency. The learner decides who, the learner asks,
  and the learner hands over the invitation. Give them a slip of paper with the date and time on it -
  they can draw on it, and it lets someone who cannot read still be told correctly by someone else.

  Practise the asking in a session beforehand, in pairs, the same way the English component practises
  any other real-world use of language. Learners who are shy about it usually settle once they have
  said the words aloud twice.

  ## A shape that works, if you want one

  This is a suggestion, not a timetable. You know your group, your space and how long your learners
  can sit, so change it freely.

  - **Group research presentations, about 10 minutes each.** Each group shows what they found about
    the hills and what they think it means, and takes a question or two.
  - **Individual presentations, about 5 minutes each.** The learner opens with their "My Name, My
    Voice" card, which is how they introduce themselves, then says one way they have grown.

  Two practical notes. With a large cohort, five minutes each adds up fast: twenty learners is over
  an hour and a half of individual turns on top of the group ones. Split into parallel groups in
  different corners, or let some learners show their card to their own guest rather than to the whole
  room. Both count fully.

  And keep the individual slot genuinely optional in shape: presenting to a small group, or to a
  partner and the person they invited, is a full success. Nobody is required to stand in front of
  everyone.

  ## Running it

  - **Invite community figures as well, and do this yourself.** The learners' own guests are the part
    that matters most to them, but the audience should not be only families. Ask your coordinator
    about inviting camp committee members, majhis, imams, teachers from the learning facilities, NRC
    staff, and anyone working on the hills the research is about. Two reasons: the research is about
    a shared problem and the people who could act on it should hear it, and a young person presenting
    to someone who matters in the community is recognised in a way a family audience alone cannot
    manage. Clear the guest list with your coordinator against NRC's Code of Conduct before anyone is
    invited.
  - **Set the room so the work is on the walls before anyone arrives.** Guests who walk into a room of
    posters understand what happened here before a word is said.
  - **Open by saying what the programme was for** - in one sentence, in the language everyone shares -
    so the guests know what they are looking at.
  - **Groups first, then individuals.** The research presentations warm the room up; the personal
    cards are easier after that.
  - **No correction during sharing**, of English or of anything else. Applaud everything.
  - **One kind response from a listener after each piece.** "One thing I will remember" is enough, and
    it stops the room going quiet on a nervous learner.
  - **Take the register of who came.** You will want it for the mentoring conversations afterwards,
    and NRC will want it.

  ## Safeguarding and protection

  - Same-gender grouping and seating wherever girls' participation depends on it. Confirm the plan with
    your coordinator before invitations go out, not after.
  - No learner is ever required to present, to be looked at, or to invite anyone. All four fallbacks on
    the learner page are full successes, and say so out loud before the day.
  - Think about who is being invited into the learning space, and clear it with your coordinator against
    NRC's Code of Conduct. Guests are not left alone with learners.
  - The research touches landslides and lost shelters. Some guests will have lost more than the
    learners have. Keep the tone hopeful - the land is greening again - and be ready to step a
    conversation back.
  - A learner with nobody to invite must never be visible as the learner with nobody to invite. Talk to
    them privately beforehand, and offer a mentor, another facilitator, or a member of NRC staff as the
    person who came for them.

  ## What it gives you as an assessor

  This is dense evidence and it is your last chance to gather it. In one afternoon you see how a
  learner talks about their research and answers a question about it (FSI1), how they use their English
  with someone outside the learning space, and how they account for their own growth (FSL2). Take notes
  the same day - not from memory a week later.
agencyContribution:
  indicators:
  - contribution-to-community
  - control-of-future-pathways
  - power-over-wellbeing-and-self-direction
  how: >-
    A learner who chooses their audience and does the inviting has exercised agency over the event
    itself, not just performed inside one someone else arranged. Showing a community what you found out
    about a problem that affects them is an impactful contribution at exactly the scale a young person
    can manage - and being seen doing it, by someone whose opinion matters to you, is often the first
    time a learner's own family understands what they are capable of. That recognition is what makes a
    next step feel available rather than presumptuous.
