principleAlignment:
- principle: recognise-communicate-growth
  how: >-
    The whole event is learners narrating their own growth with evidence in their hands, to an audience
    that did not see them learn it.
- principle: authentic-challenges
  how: >-
    The research is shown to the community the research is about, which is what makes it a contribution
    rather than an exercise.
- principle: collaboration
  how: >-
    It brings families, neighbours and community members into the programme as an audience with a
    stake, not as spectators of a school event.
- principle: connect-to-futures
  how: >-
    A learner who has been seen to do something by the person they chose has a different conversation
    about what they do next - with that person, and with themselves.
