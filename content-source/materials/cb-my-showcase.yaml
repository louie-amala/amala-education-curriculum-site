# Programme-level resource for the Learning Bridge+ (Cox's Bazar) edition: ONE shared showcase, in the
# last week, instead of three separate closings.
#
# Why this exists. Each of the three taught components ended with its own sharing, and the week-by-week
# map put all three in Week 10 - the Research Project showcase, the "My Name, My Voice" card sharing,
# and the Agency in Learning celebration. Three audiences, three occasions, in one week, for a cohort
# whose attendance is stop-start. Folding them into one event costs no extra hours (they already exist
# in the three unit plans), evidences all three components at once, and is the only moment in the
# programme where a learner's whole twelve weeks is visible in one place.
#
# The second reason is agency. The Research Project sharing is already required - learners must
# communicate their findings to an audience they chose. What this adds is that the learner chooses and
# invites at least ONE person themselves. That is a small thing to organise and a large thing to
# experience: it is the difference between being shown to an audience and having an audience.
