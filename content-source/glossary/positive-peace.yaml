id: positive-peace
slug: positive-peace
access: public
term: Positive peace
category: content
matchPhrases:
- positive peace framework
- positive peace
definition: >-
  The presence of the attitudes, institutions, and structures that create and sustain peaceful
  societies - not just the absence of violence, but the conditions that prevent it.
explainer: |
  Where [negative peace](/glossary/negative-peace) is the absence of violence, positive peace is
  the presence of what makes peace last: fair institutions, good relationships between groups,
  the equitable sharing of resources, and acceptance of others' rights. It targets the conditions
  underneath conflict rather than only its visible outbreaks.

  The Institute for Economics & Peace turned this idea into a practical, measurable framework -
  the eight *Pillars of Positive Peace* (for example, a well-functioning government, a sound
  business environment, equitable distribution of resources, and acceptance of the rights of
  others). These are the systemic factors most strongly associated with societies that stay
  peaceful over time.

  Positive peace is the natural counterpart to [structural violence](/glossary/structural-violence):
  building it means dismantling the structures that harm people and replacing them with ones that
  let people flourish. In planning, it gives learners a constructive question - *what conditions
  would make violence less likely here?* - rather than only *how do we stop the fighting?*
