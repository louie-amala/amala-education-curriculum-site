id: effort-impact-matrix
slug: effort-impact-matrix
access: public
term: Effort/impact matrix
category: content
matchPhrases:
- effort-impact matrix
- impact-effort matrix
- effort/impact matrix
- impact/effort matrix
definition: >-
  A simple grid for comparing ideas by how much effort they take against how much impact they could have, so a team can choose which to take forward, often favouring high-impact, lower-effort ideas first.
examples:
- Plotting each idea into one of four quadrants of the grid
nonExamples:
- Choosing an idea just because it was suggested first
useInContext: >-
  Learners use an effort/impact matrix to narrow many ideas down to a promising few.
relatedTermIds: [actionable-insights]
