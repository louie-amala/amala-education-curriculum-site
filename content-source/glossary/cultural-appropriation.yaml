id: cultural-appropriation
slug: cultural-appropriation
access: public
term: Cultural appropriation
category: content
matchPhrases:
- cultural appropriation
definition: >-
  Taking elements of a culture that is not your own — especially a marginalised one — and using them
  without understanding, permission, or credit, in a way that can distort or exploit their meaning.
explainer: |
  Cultures have always borrowed from one another, and most art grows out of
  [cultural interaction](/glossary/cultural-interaction). Appropriation is the borrowing that goes
  wrong: when someone lifts a symbol, style, or practice from another culture and uses it with no
  regard for its meaning, no acknowledgement of where it came from, or in a way that mocks or profits
  from it.

  What usually makes the difference is power and respect. Borrowing between equals, done with
  understanding and credit, is exchange. Taking from a culture with less power — a colonised,
  minority, or displaced group — and stripping a meaningful thing down to decoration is appropriation.
  Sacred or identity-bearing elements are the most sensitive, because their loss of meaning is felt as
  disrespect.

  This concept matters most when learners make work that draws on cultures other than their own.
  Handling it well means asking about authorship, attribution, and representation, and it connects to
  [stereotype](/glossary/stereotype) and [othering](/glossary/othering) when borrowed elements flatten
  a whole people into a single image.
furtherReading:
- title: Appropriation
  url: https://www.tate.org.uk/art/art-terms/a/appropriation
  source: Tate
  note: Defines appropriation in art; cultural appropriation is the related ethical question of taking from another culture.
examples:
- Using a sacred symbol from another culture as a decorative fashion print with no regard for its meaning
nonExamples:
- Learning an art form from its community with their guidance and crediting where it comes from — that is exchange, not appropriation
useInContext: >-
  Learners weigh appropriation, authorship, and representation when drawing on cultures other than
  their own in their own work.
relatedTermIds: [cultural-interaction, stereotype, othering]
