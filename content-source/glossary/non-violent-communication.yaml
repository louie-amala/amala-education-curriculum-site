  note: The organisation Rosenberg founded — an introduction to the model and free resources.
examples:
- Saying "When the meeting started late I felt frustrated, because I need us to use our time well — could we begin on time?"
nonExamples:
- Blame and generalisation that escalate conflict, such as "you're always late and you don't care about anyone"
useInContext: >-
  Learners practise non-violent communication to present and refine ideas in ways that build trust
  across differences.
