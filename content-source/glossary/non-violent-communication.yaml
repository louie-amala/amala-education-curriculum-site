term: Non-Violent Communication (NVC)
category: content
matchPhrases:
- non-violent communication
- nonviolent communication
- non violent communication
- nvc
definition: >-
  A structured approach, developed by Marshall Rosenberg, for communicating in ways that build
  understanding rather than blame — through observations, feelings, needs, and requests.
explainer: |
  Non-Violent Communication (NVC) is a practical method for handling [conflict](/glossary/conflict)
  through dialogue instead of escalation. Rosenberg framed it as four moves: state the
  **observation** (what happened, without judgement), name the **feeling** it produced, identify
  the underlying **need**, and make a clear, doable **request**. The aim is to surface needs on all
  sides so people can meet them without blame or coercion.

  In peacebuilding, NVC is a concrete way to work against
  [cultural violence](/glossary/cultural-violence) at the level of everyday interaction: it
  replaces the language of enemies and blame with the language of shared human needs. It is also
  broadly reusable — the same skills support collaboration, facilitation, and wellbeing work well
  beyond a single course.
furtherReading:
