id: conflict
slug: conflict
access: public
term: Conflict
category: content
matchPhrases:
- conflict
definition: >-
  A clash between people or groups whose needs, interests, or values appear incompatible.
  Conflict is not the same as violence - it can be handled constructively or destructively.
explainer: |
  Conflict is a normal, unavoidable part of human life: wherever people have different needs
  or limited resources, tensions arise. What matters for [peace](/glossary/peace) is not whether
  conflict exists but how it is handled. Handled well, conflict surfaces real problems and drives
  change; handled badly, it escalates into [direct violence](/glossary/direct-violence).

  Separating conflict from violence is an important move for educators. It lets learners treat
  conflict as something to understand and work with - through dialogue, negotiation, and
  [non-violent communication](/glossary/non-violent-communication) - rather than something to
  suppress or fear. It also reframes the goal of peacebuilding as transforming how conflict plays
  out, not pretending disagreement away.
examples:
- Two community groups disagreeing over how a shared space should be used, and negotiating a plan
nonExamples:
- Physical fighting or intimidation (that is violence, an outcome conflict can lead to - not conflict itself)
useInContext: >-
  Learners explore the causes of conflict in a real context and consider how it can be
  transformed without violence.
relatedTermIds: [peace, direct-violence, non-violent-communication]
