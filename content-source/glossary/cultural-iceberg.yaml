id: cultural-iceberg
slug: cultural-iceberg
access: public
term: Cultural iceberg
category: content
matchPhrases:
- cultural iceberg
- iceberg model of culture
definition: >-
  A model that pictures culture as an iceberg: a small visible part above the water (food, dress,
  art, greetings) resting on a much larger hidden part below (values, beliefs, norms).
explainer: |
  The cultural iceberg, a metaphor often attributed to anthropologist Edward T. Hall, makes one point
  vividly: the culture we can see is only the tip. Above the waterline are the observable things, 
  food, clothing, festivals, art, ways of greeting. Below it, and far larger, are the parts we cannot
  directly see: values, assumptions, beliefs about time, gender, authority, and what counts as
  beautiful or normal.

  For this course the key move is that many of the visible elements are art forms, and they express
  the invisible values beneath them. Reading art becomes a way of reaching below the waterline of a
  culture, your own or someone else's. Learners build a shared iceberg, then a personal one, to see
  where their individual identity matches the wider culture and where it differs.

  This is a different model from the systems-thinking iceberg used to analyse the causes of a problem;
  they share only the image. The cultural iceberg connects closely to
  [cultural heritage](/glossary/cultural-heritage) (what a group chooses to keep) and to
  [symbolism](/glossary/symbolism) (how hidden meaning is signalled).
examples:
- Placing "greetings" above the waterline and "ideas about personal space or who holds authority" below it
nonExamples:
- A list of a country's foods and festivals alone, with no attention to the values beneath them
useInContext: >-
  Learners create a class cultural iceberg and then a personal one, separating visible cultural
  expression from the beliefs underneath.
relatedTermIds: [cultural-heritage, cultural-interaction, symbolism]
