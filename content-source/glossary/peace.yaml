id: peace
slug: peace
access: public
term: Peace
category: content
matchPhrases:
- peace
definition: >-
  More than the absence of war or fighting: a condition in which people can meet their
  needs, resolve differences without violence, and live with dignity and security.
explainer: |
  In everyday use "peace" often means simply that no one is fighting. Peace studies treats
  that as only the starting point. The field distinguishes two levels: [negative peace](/glossary/negative-peace),
  the absence of direct violence, and [positive peace](/glossary/positive-peace), the presence
  of the relationships, institutions, and attitudes that let a society stay peaceful over time.

  This distinction matters for planning. A course, activity, or community initiative can end
  visible violence while leaving the conditions that produce it untouched - meaning peace does
  not last. Framing peace as something built, not just an absence, points learners towards the
  underlying causes and towards actions that make violence less likely in the first place.

  Peace is also not the same as the absence of [conflict](/glossary/conflict). Disagreement over
  needs and interests is normal and can be productive; peacebuilding is about handling conflict
  without violence, not eliminating it.
furtherReading:
