examples:
- A community that has both stopped fighting and built fair ways to share water and resolve disputes
nonExamples:
- A ceasefire that holds only because one group fears the other's weapons
useInContext: >-
  Learners work towards peace not by avoiding all conflict, but by reducing violence and
  strengthening the conditions that make it less likely.
relatedTermIds: [negative-peace, positive-peace, conflict, violence-triangle]
