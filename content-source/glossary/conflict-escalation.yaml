examples:
- A dispute moving from argument to public accusation to each side recruiting allies
nonExamples:
- Two parties disagreeing sharply but still expecting to settle it in conversation (stage 1, not yet escalated)
useInContext: >-
  Learners place case studies on the nine stages and identify what could have stopped each one
  moving further down.
