id: conflict-escalation
slug: conflict-escalation
access: public
term: Conflict escalation
category: content
matchPhrases:
- conflict escalation
- escalation of conflict
- glasl
definition: >-
  The stepwise intensification of a conflict. Friedrich Glasl's model describes nine stages,
  from hardened positions through dehumanisation to mutual destruction.
explainer: |
  Glasl's nine-stage model is the most useful single diagnostic in a peacebuilding course, because it
  turns "this is getting worse" into a position on a scale, and a position implies a response.

  The nine stages run: **1 Hardening** (positions firm up, but people still believe discussion will
  work) · **2 Debate and polemics** (black-and-white thinking, felt superiority) · **3 Actions not
  words** (talking is abandoned, empathy is lost) · **4 Images and coalitions** (each side casts the
  other in a role and recruits supporters) · **5 Loss of face** (public attacks on the opponent's
  moral integrity) · **6 Strategies of threat** (ultimatums and counter-threats) · **7 Limited
  destructive blows** (the opponent stops being seen as human, so harming them becomes legitimate)
  · **8 Fragmentation** (destroying the other side's system is the goal) · **9 Together into the
  abyss** (one's own destruction is an acceptable price).

  Two teaching points carry the model. The first is the **threshold at stage 7**: dehumanisation is
  what makes serious violence thinkable, which links the model directly to
  [cultural violence](/glossary/cultural-violence). The second is that the **stages are asymmetric**, 
  one party, or one individual within a group, can be several stages further along than the other,
  and identifying that gap is often where an intervention finds its opening.

  The practical use is prevention. Naming the stage a conflict has reached tells a peacebuilder which
  responses are still available, because the responses that work at stage 2 are useless at stage 7.
