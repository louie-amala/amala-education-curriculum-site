id: dehumanisation
slug: dehumanisation
access: public
term: Dehumanisation
category: content
matchPhrases:
- dehumanisation
- dehumanization
- dehumanise
definition: >-
  Presenting a group as less than fully human, which removes the normal restraint against
  harming them.
explainer: |
  Dehumanisation is the mechanism that converts hostility into permission. Once a group is described
  as vermin, disease, or cargo, the ordinary human reluctance to harm people stops applying to them,
  because the category "people" has been withdrawn.

  It sits at the far end of a continuum learners have already met.
  [Stereotype](/glossary/stereotype) simplifies a group, [prejudice](/glossary/prejudice) attaches
  hostile feeling to it, [othering](/glossary/othering) makes it alien, and dehumanisation removes it
  from the moral circle altogether. In Glasl's model of
  [conflict escalation](/glossary/conflict-escalation) this is precisely stage 7, where limited
  destructive blows become legitimate because the opponent is no longer seen as a human being.

  Two facts are worth putting in front of learners. Dehumanisation is **deliberate and taught**:
  militaries train it, propaganda manufactures it, and both use repetition and imagery rather than
  argument. And because it is taught, it can be untaught. If a society can deliberately train people
  to kill, it can deliberately train them to build peace, which is the hopeful reading of an
  otherwise grim mechanism.
