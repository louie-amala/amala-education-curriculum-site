examples:
- Being read as a refugee before anything else is known about you
nonExamples:
- Describing yourself as someone who loves cooking (that is personal identity, chosen)
useInContext: >-
  Learners complete a personal and a social identity wheel side by side, then discuss which parts
  they chose and which were assigned.
relatedTermIds: [identity, othering, structural-violence, prejudice]
