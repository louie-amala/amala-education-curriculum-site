id: cultural-interaction
slug: cultural-interaction
access: public
term: Cultural interaction
category: content
matchPhrases:
- cultural interaction
- cultural interactions
- intercultural interaction
definition: >-
  What happens when two or more cultures come into contact through the movement of people, goods, or
  ideas. Often reshaping both, including their art.
explainer: |
  Cultures are not sealed boxes. They meet and mix whenever people migrate, goods are traded, or ideas
  spread. Through religion, conquest, commerce, or the internet. This course groups these encounters
  into the mixing of people, goods, and ideas, and treats them as the normal condition of
  culture rather than the exception.

  Interaction is rarely neutral. There is usually a power dynamic, one culture may dominate, borrow
  from, or suppress another, and outcomes range from peaceful exchange and new creativity to conflict
  and loss. Art is one of the clearest records of this: existing forms adapt and blend, and entirely
  new forms emerge from the meeting. Gandhara sculpture, where Greek style met Buddhist subject
  matter, is a case in point.

  Because of this, claiming an art form as the pure product of a single culture rarely holds up.
  Interaction continually reshapes [cultural heritage](/glossary/cultural-heritage), and how it is done,
   with respect and credit, or without, is the line between exchange and
  [cultural appropriation](/glossary/cultural-appropriation).
examples:
- Gandhara sculpture, where Greek artistic style met Buddhist subject matter to make something new
nonExamples:
- Treating an art form as the pure product of a single, sealed-off culture with no outside influence
useInContext: >-
  Learners trace the cross-cultural interactions behind an art form and present a case study of one.
relatedTermIds: [cultural-heritage, cultural-appropriation, artistic-context]
