id: symbolism
slug: symbolism
access: public
term: Symbolism
category: content
matchPhrases:
- symbolism
- symbolic
definition: >-
  The use of an image, object, colour, or action to stand for an idea or feeling beyond its literal
  meaning.
explainer: |
  A symbol is something that means more than itself. A dove is a bird, but it also stands for peace;
  a colour can carry mourning in one place and celebration in another. Symbolism is how art packs
  large ideas into small signs, and reading it is a core skill in interpreting a work's
  [content](/glossary/form-and-content).

  Symbols run from the religious (a cross, a crescent) through the cultural (a flower, an animal, a
  gesture) to the everyday and modern (emoji). Some feel almost universal, but most are learned
  inside a culture and do not travel intact - which is exactly why a symbol's meaning depends on
  [artistic context](/glossary/artistic-context). Much of a symbol's power sits below the waterline
  of the [cultural iceberg](/glossary/cultural-iceberg): you only recognise it if you share the
  culture that assigned it.

  The study of the symbols and subjects in a work, and what they conventionally mean, is called
  iconography.
