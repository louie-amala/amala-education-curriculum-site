  url: https://www.tate.org.uk/art/art-terms/f/formalism
  source: Tate
  note: Short glossary entry on analysing art through its form; useful background for formal analysis.
examples:
- Noticing that a painting's jagged lines and dark palette (form) create the unease that matches its subject of war (content)
nonExamples:
- Judging only whether you like an artwork, without looking at how its form carries its meaning
useInContext: >-
