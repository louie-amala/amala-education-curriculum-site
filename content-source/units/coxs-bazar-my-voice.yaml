  - label: Session Slides
    file: /downloads/my-voice-slides.pptx
    format: PowerPoint
    note: Optional, for the minority of sites with a screen. One idea per slide. Editable.
sourceNotes:
  - Contextualises the "My Voice" course (English for Impact Unit 1; see courses/efi-my-voice.yaml) for the Learning Bridge+ (Cox's Bazar) edition, delivered through the cb-mv-* materials.
  - The central adaptation is emergent literacy, not literacy transfer - the source assumes Home-Language literacy, while this unit assumes no prior reading in any language and leads with listening, speaking, and the learner's own name.
  - Set out in hours, not weeks, as a standalone 50-hour component (30 in-person + 20 independent). Educators fit it to their own weekly schedule over a minimum of 10 weeks.
  - Activity times are generous (roughly 1.5 to 2 times a literate-group estimate) to reflect oral and visual delivery, drawing, translation, and a pre-literate starting point.
  - English Language Development is compulsory in this edition but is not one of the two formally graded Learning Bridge+ competencies; its assessment is formative, against the A1- Can-Do outcomes and each learner's own growth.
  - Two facilitator-facing resources underpin the unit. cb-mv-facilitator-playbook is the how-to for teaching beginner English to pre-literate learners, grounded in the English for Impact pedagogy plus LESLLA and SLA research. cb-mv-practice-everywhere builds English practice into Agency in Learning, mentoring, the Research Project, and daily life. The facilitator plan carries the playbook and the practice guidance at the front; the student workbook has a Practice everywhere page and practice log.
  - The phonics and grammar scaffolding from the source PDF is carried by dedicated materials — two reference resources (cb-mv-phonics-progression and cb-mv-phonics-table) and two practice activities (cb-mv-sound-and-letter-practice and cb-mv-sentence-practice, the latter an offline adaptation of the source's Unit 1 grammar exercises).
  - The offline resource pack (facilitator unit plan, visual My Voice book/workbook, picture and letter cards, optional slides) is produced as editable files under public/downloads, mirroring the Agency in Learning pack.
