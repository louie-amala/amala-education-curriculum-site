# Unit plan (scheme of work) for the Agency in Learning component of Learning Bridge+ (Cox's Bazar).
# HOURS-BASED, not weeks: it sets out the full 50 hours (30 in-person + 20 independent) so an educator
# can fit them into their own weekly schedule (minimum 10 weeks). Treated as a standalone component.
# Times are generous for this oral/visual, translated, largely pre-literate cohort: activities take
# roughly 1.5 to 2 times longer than they would with a literate group. The facilitator guidance lives
# on the referenced cb-ail-* materials and is rendered inline; connective blocks carry a description.
id: coxs-bazar-agency-in-learning
slug: coxs-bazar-agency-in-learning
access: public
title: "Agency in Learning — Cox's Bazar unit plan"
programmeSlug: learning-bridge-coxs-bazar
componentTitle: Agency in Learning
courseSlug: agency-in-learning
summary: >-
  The full 50-hour plan for delivering the Agency in Learning component fully offline in the Cox's
  Bazar camps, as a standalone course. It is set out in hours, not weeks, so you can fit it into your
  own timetable over a minimum of 10 weeks. Learners run one full cycle of self-directed learning on a
  real goal of their own: understanding themselves, setting a goal, planning and taking steps, and
  tracking, using feedback, and reflecting on their growth. Times are deliberately generous, because
  oral and visual delivery with drawing and translation takes longer than it first appears.
totalFacilitatedHours: 30
totalIndependentHours: 20
phases:
  - title: "Getting started"
    summary: >-
      Build a safe, warm learning space and set up the learning book that runs through the whole
      course. Learners meet the big idea: here, a lot is chosen for you, but your own learning is
      yours to direct.
    blocks:
      - title: "Welcome and our learning space"
        kind: orientation
        facilitatedHours: 1
        independentHours: 0
        description: >-
          Open the course. Build a safe, welcoming space: names, a simple agreement about how the group
          treats each other, and reassurance that no one has to read, write, or share anything they
          would rather keep private. Introduce the big idea in your own words: many things here are
          decided by others, but what you learn is something you can choose, and this course is about
          taking hold of your own learning. Keep it warm, oral, and unhurried.
      - title: "What we will learn, and why"
        kind: activity
        materialSlug: cb-ail-exploring-our-objectives
        facilitatedHours: 2
        independentHours: 0.5
        independentTask: "Tell one person at home the one of the four things you most want to get better at, and why."
        flexNote: >-
          Listen closely in the second half: how learners say they would approach each objective
          surfaces what they already know, so you can adjust how long each later phase needs. This same
          orientation activity works for the Research Project too (see exploring-your-objectives).
      - title: "Set up your learning book"
        kind: activity
        materialSlug: cb-ail-keeping-a-learning-journal
        facilitatedHours: 1.5
        independentHours: 0.5
        independentTask: "Make one small mark or drawing in your learning book before the next session."
        flexNote: >-
          Set up early so the book runs through the whole course: learners draw and mark into it in
          every phase, and it becomes the record of their growth.
      - title: "Getting better at setting and pursuing goals"
        kind: activity
        materialSlug: cb-ail-getting-better-at-goals
        facilitatedHours: 0.5
        independentHours: 0
        flexNote: >-
          A development resource, not a test. Learners meet the competency this whole course grows,
          setting and pursuing goals, and mark honestly where they are now on Amala's growth path, then
          revisit it in the final phase to see how they have moved.
  - title: "Understand yourself as a learner"
    objectiveId: agency-in-learning--o1
    summary: >-
      Learners build a Learner Profile: proof that their ability can grow, a picture of their strengths
      and the areas they want to grow, and an honest sense of how they learn best. It is the starting
      point their goal is built from.
    blocks:
      - title: "You can grow"
        kind: activity
        materialSlug: cb-ail-growth-mindset
        facilitatedHours: 2
        independentHours: 1
        independentTask: "Tell one person at home about a time you got better at something hard, and what helped."
      - title: "What I am good at, what I want to grow"
        kind: activity
        materialSlug: cb-ail-strengths-and-areas-to-grow
        facilitatedHours: 2
        independentHours: 1
        independentTask: "Ask one or two people who know you well what you are good at as a learner, and mark it in your book."
      - title: "How I learn best"
        kind: activity
        materialSlug: cb-ail-how-you-learn-best
        facilitatedHours: 2
        independentHours: 1
        independentTask: "Over the next few days, notice when and where you focus best, and mark it on your workbook picture-clock."
  - title: "Set clear, meaningful learning goals"
    objectiveId: agency-in-learning--o2
    summary: >-
      Learners turn their Learner Profile into one small, clear learning goal they care about, broken
      into a short ladder of steps, and take a first step.
    blocks:
      - title: "What makes a good goal"
        kind: activity
        materialSlug: cb-ail-what-makes-a-good-goal
        facilitatedHours: 1.5
        independentHours: 0.5
        independentTask: "Think of one goal you might set, and check it against the four tests, or ask someone at home to hear it and help."
      - title: "Choose and draw your goal"
        kind: activity
        materialSlug: cb-ail-setting-your-goals
        facilitatedHours: 2
        independentHours: 1
        independentTask: "Tell one person at home your learning goal, and why it matters to you."
      - title: "Your steps, and your first step"
        kind: activity
        materialSlug: cb-ail-your-goal-steps
        facilitatedHours: 2
        independentHours: 1.5
        independentTask: "Take your first step, and be ready to say what happened."
  - title: "Plan and take deliberate steps"
    objectiveId: agency-in-learning--o3
    summary: >-
      Learners turn their goal into a small action plan, protect a little time for it, and find the
      help and resources they need, then begin pursuing the goal for real between sessions.
    blocks:
      - title: "Make an action plan"
        kind: activity
        materialSlug: cb-ail-making-an-action-plan
        facilitatedHours: 2
        independentHours: 1
        independentTask: "Take one step from your plan, and notice what helped or got in the way."
      - title: "Manage your time and what matters"
        kind: activity
        materialSlug: cb-ail-managing-time-and-priorities
        facilitatedHours: 1.5
        independentHours: 1
        independentTask: "For a few days, do your most important learning thing first, before the easier things."
      - title: "Find help and resources"
        kind: activity
        materialSlug: cb-ail-finding-help-and-resources
        facilitatedHours: 1.5
        independentHours: 1
        independentTask: "Ask one person for the help or resource you named, and use it towards your goal."
      - title: "Pursue your goal, and mark your learning book"
        kind: practice
        facilitatedHours: 1
        independentHours: 3
        description: >-
          The heart of independent learning. Between sessions, learners take real steps towards their
          goal and make one small mark or drawing in their learning book each time. Open each session
          with a short, warm check-in in same-gender pairs or the group: what step did you take, what
          happened, what is next? A step taken, however small, is celebrated. This block is where the
          20 independent hours mostly live, so protect it and keep the check-ins going.
        independentTask: "Keep taking small steps towards your goal, and mark each one in your learning book."
  - title: "Track progress, use feedback, and reflect"
    objectiveId: agency-in-learning--o4
    summary: >-
      Learners use their learning book to see their progress, seek and use feedback, and reflect on how
      they have grown against their original goal, completing the self-directed learning cycle.
    blocks:
      - title: "Ask for and use feedback"
        kind: activity
        materialSlug: cb-ail-seeking-and-using-feedback
        facilitatedHours: 2
        independentHours: 1
        independentTask: "Ask one person for feedback: what is one thing I could do better? Then try it."
      - title: "Look back at how you have grown"
        kind: activity
        materialSlug: cb-ail-reflecting-on-your-growth
        facilitatedHours: 2
        independentHours: 1.5
        independentTask: "Look through your learning book and notice one way you have grown; be ready to share it."
      - title: "Pursue your goal, and mark your learning book"
        kind: practice
        facilitatedHours: 1
        independentHours: 2.5
        description: >-
          Learners keep pursuing their goal and marking their book, now using the feedback they gathered
          and adjusting their steps when something is not working. Keep the short warm check-ins that
          open each session. By the end of this block most learners have taken real, tracked steps
          towards a goal they set themselves, which is the evidence of self-directed learning.
        independentTask: "Keep taking steps and marking your book, and change your plan if a step is not working."
  - title: "Celebrate and look ahead"
    summary: >-
      Learners look back over the whole course, celebrate and share their growth, and set one goal to
      keep going with. On Learning Bridge+ this is where the educator gathers the evidence to judge the
      learner's progress in setting and pursuing goals.
    blocks:
      - title: "Celebrate and share my growth"
        kind: consolidation
        facilitatedHours: 3
        independentHours: 2
        description: >-
          Close the course. Learners look back through their learning book from the first page, and
          prepare one way they have grown to share, by drawing and speaking, not writing. Hold a warm,
          celebratory sharing in same-gender groups, with no one forced to share. Each learner sets one
          goal to keep going with after the course. Learners also look again at the "Getting better at
          setting and pursuing goals" growth path they marked at the start, mark where they are now, and
          name the movement, so they see their own growth. On Learning Bridge+, this is the point to
          gather and record the evidence of each learner's growth in setting and pursuing goals, from
          their book, their steps taken, the growth path, and what they say, to inform the assessment
          judgement, which is made by educator judgement against Amala's proficiency scale.
        independentTask: "Choose one way you have grown to share, and one goal you will keep working on after the course."
