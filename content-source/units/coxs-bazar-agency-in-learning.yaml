      week-6 supported and week-12 final points, from evidence across the whole component. Make one copy
      per learner. Editable.
sourceNotes:
  - Sequences the cb-ail-* contextualised activities (adaptations of the generic ail-* materials) for the Learning Bridge+ (Cox's Bazar) edition.
  - Set out in hours, not weeks, as a standalone 50-hour component (30 in-person + 20 independent). Educators fit it to their own weekly schedule over a minimum of 10 weeks.
  - Activity times are generous (roughly 1.5 to 2 times a literate-group estimate) to reflect oral and visual delivery with drawing and translation.
  - Learners run one full self-directed learning cycle on a real goal of their own; the goal-pursuit practice blocks carry most of the independent hours.
