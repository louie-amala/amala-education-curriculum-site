# Unit plan (scheme of work) for the Agency in Learning component of Learning Bridge+ (Cox's Bazar).
# Sequences the contextualised, offline cb-ail-* activities into weeks, with the facilitated /
# independent split per session. The facilitator guidance lives on the referenced materials and is
# rendered inline on the unit page. Cadence: 3h in-person + 2h independent per week, over 10 weeks.
# Being authored week by week; Week 1 (objective 1) is authored first.
id: coxs-bazar-agency-in-learning
slug: coxs-bazar-agency-in-learning
access: public
title: "Agency in Learning — Cox's Bazar unit plan"
programmeSlug: learning-bridge-coxs-bazar
componentTitle: Agency in Learning
courseSlug: agency-in-learning
summary: >-
  The week-by-week plan for delivering the Agency in Learning component fully offline in the Cox's
  Bazar camps. Each week develops one course objective through oral and visual first activities, at a
  cadence of 3 hours in-person plus 2 hours independent. This document carries the facilitator
  guidance inline, so there is nothing to cross-reference during a session.
weeklyFacilitatedMin: 180
weeklyIndependentMin: 120
weeks:
  - number: 1
    title: "Understand yourself as a learner"
    objectiveId: agency-in-learning--o1
    outcome: >-
      Each learner starts their Learner Profile: proof that their ability can grow, a picture of their
      strengths and the areas they want to grow, and an honest sense of how they learn best. This is
      the starting point their first learning goals (Week 2) will be held up against.
    sessions:
      - title: "You can grow"
        materialSlug: cb-ail-growth-mindset
        facilitatedMin: 60
        independentMin: 30
        independentTask: "Tell one person at home about a time you got better at something hard, and what helped."
        flexNote: >-
          If contact time is short, the drawing (remembering a time you grew) and the "not yet" step can
          be set as independent work from the workbook; keep the opening frame and the closing share
          in-person.
      - title: "What I am good at, what I want to grow"
        materialSlug: cb-ail-strengths-and-areas-to-grow
        facilitatedMin: 60
        independentMin: 30
        independentTask: "Ask one or two people who know you well what you are good at as a learner, and mark it on your workbook page."
        flexNote: >-
          The peer round must stay in-person, it is the engine of the activity; the private mapping of
          strengths and areas can move to independent work if needed.
      - title: "How I learn best"
        materialSlug: cb-ail-how-you-learn-best
        facilitatedMin: 60
        independentMin: 60
        independentTask: "Over the next two days, notice when and where you focus best, and mark it on your workbook picture-clock."
        flexNote: >-
          The two-day noticing task is independent by design and doubles as the week's independent
          learning practice; the reflection and the compare-with-a-partner step stay in-person.
  - number: 2
    title: "Set clear, meaningful learning goals"
    objectiveId: agency-in-learning--o2
    outcome: >-
      Each learner leaves with one small, clear learning goal they care about, broken into a short
      ladder of steps, and a first step taken during the week. This goal, built from Week 1's Learner
      Profile, is what the planning work in Week 3 will move forward.
    sessions:
      - title: "What makes a good goal"
        materialSlug: cb-ail-what-makes-a-good-goal
        facilitatedMin: 60
        independentMin: 30
        independentTask: "Think of one goal you might set, and check it against the four tests, or ask someone at home to hear it and help."
        flexNote: >-
          The judging and fixing of example goals is best done in-person, where disagreement sharpens
          the tests; testing your own goal can move to independent work if contact time is short.
      - title: "Choose and draw your goal"
        materialSlug: cb-ail-setting-your-goals
        facilitatedMin: 60
        independentMin: 30
        independentTask: "Tell one person at home your learning goal, and why it matters to you."
        flexNote: >-
          The saying-it-to-a-partner step must stay in-person; choosing and drawing the goal can be set
          as independent work from the workbook goal page.
      - title: "Your steps, and your first step"
        materialSlug: cb-ail-your-goal-steps
        facilitatedMin: 60
        independentMin: 60
        independentTask: "Take your first step this week, and be ready to say what happened next session."
        flexNote: >-
          Taking the first step is independent by design and is the week's core independent practice;
          building the ladder and committing aloud stay in-person.
  - number: 3
    title: "Plan and take deliberate steps"
    objectiveId: agency-in-learning--o3
    outcome: >-
      Each learner turns their goal into a small action plan, protects a little time to work on it, and
      knows where to find the help and resources they need, so a goal becomes deliberate, sustained
      steps rather than intention alone.
    sessions:
      - title: "Make an action plan"
        materialSlug: cb-ail-making-an-action-plan
        facilitatedMin: 60
        independentMin: 30
        independentTask: "Take one step from your plan this week, and notice what helped or got in the way."
        flexNote: >-
          Drawing the plan can be set as independent work from the workbook; the modelling and the
          partner check stay in-person.
      - title: "Manage your time and what matters"
        materialSlug: cb-ail-managing-time-and-priorities
        facilitatedMin: 60
        independentMin: 30
        independentTask: "For a few days, do your most important learning thing first, before the easier things."
        flexNote: >-
          The sorting of what matters most is best done in-person; trying the routine is the independent
          practice.
      - title: "Find help and resources"
        materialSlug: cb-ail-finding-help-and-resources
        facilitatedMin: 60
        independentMin: 60
        independentTask: "Ask one person for the help or resource you named, and use it towards your goal."
        flexNote: >-
          Naming who and what can help stays in-person; actually reaching out and using the help is the
          independent task.
  - number: 4
    title: "Track progress, use feedback, and reflect"
    objectiveId: agency-in-learning--o4
    outcome: >-
      Each learner keeps a simple record of their progress, seeks and uses feedback, and reflects on how
      they have grown against their original goal. This completes the goal cycle and produces the
      evidence of self-directed learning the programme assesses.
    sessions:
      - title: "Keep your learning book"
        materialSlug: cb-ail-keeping-a-learning-journal
        facilitatedMin: 60
        independentMin: 30
        independentTask: "Make one small mark or drawing in your learning book after each session this week."
        flexNote: >-
          Setting up the book and the first mark stay in-person; keeping the routine going is the
          independent practice, and the spine the whole component marks into.
      - title: "Ask for and use feedback"
        materialSlug: cb-ail-seeking-and-using-feedback
        facilitatedMin: 60
        independentMin: 30
        independentTask: "Ask one person for feedback: what is one thing I could do better? Then try it."
        flexNote: >-
          Practising how to ask for and receive feedback stays in-person; asking someone for real is the
          independent task.
      - title: "Look back at how you have grown"
        materialSlug: cb-ail-reflecting-on-your-growth
        facilitatedMin: 60
        independentMin: 60
        independentTask: "Look through your learning book and notice one way you have grown; be ready to share it."
        flexNote: >-
          The guided look back through the workbook stays in-person; noticing and preparing to share a
          growth is the independent reflection.
downloads:
  - label: Facilitator Unit Plan & Guide
    file: /downloads/agency-in-learning-facilitator-unit-plan.docx
    format: Word
    note: The week-by-week plan with all session guidance inline. Editable.
  - label: Student Workbook
    file: /downloads/agency-in-learning-student-workbook.docx
    format: Word
    note: Visual-first Learner Profile and goal pages. Print one per learner. Editable.
  - label: Session Slides
    file: /downloads/agency-in-learning-slides.pptx
    format: PowerPoint
    note: Optional, for sites with a screen. One idea per slide. Editable.

sourceNotes:
  - Sequences the cb-ail-* contextualised activities (adaptations of the generic ail-* materials) for the Learning Bridge+ (Cox's Bazar) edition.
  - Week 1 develops objective 1 (Understand yourself as a learner); the three sessions build the Learner Profile that Week 2's goal-setting is held up against.
  - Weeks 2 to 10 (objectives 2 to 4) are authored in subsequent passes.
