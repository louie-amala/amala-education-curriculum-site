# Unit plan (scheme of work) for the Research Project component of Learning Bridge+ (Cox's Bazar).
# HOURS-BASED, not weeks: it sets out the full 50 hours (30 in-person + 20 independent) so an educator
# can fit them into their own weekly schedule (minimum 10 weeks). Treated as a standalone component.
# The 50 hours match the figure the programme bills this component at (learning-bridge-coxs-bazar.yaml).
#
# CHALLENGE SET (2026-08-04): the whole cohort investigates ONE shared challenge - what is happening to
# the trees on the hills where they live (deforestation → bare slopes → landslides, heat, floods → the
# land greening again). The research is about the ISSUE ITSELF and what is being done about it, judged at
# the community/observable level - not an audit of any one NGO's programme - so it stays valid wherever in
# Cox's Bazar the cohort turns out to be and whatever agencies work there. The research question is GIVEN,
# not invented by the cohort (realistic for an A1-English, oral group): "What happens to our hills without
# trees, and what changes when trees and plants grow back?", with four sub-questions carried into primary
# research (before/now; a bare hill in rain and hot sun; what roots, grass, and trees do; and what people
# are doing to help, and whether it is working).
#
# AUTHORED AND OFFLINE-READY. Every block references a cb-rp-* material, and the secondary source pack
# (cb-rp-secondary-source-pack: 11 sources, each at three reading levels) is written and wired. The
# offline pack - facilitator plan, learner research book, assessment record, picture-word cards - is
# generated by scripts/downloads/generate-rp.js.
# A waste / composting challenge is the planned second example if trees does not land.
#
# Times are generous for this oral/visual, translated, largely pre-literate cohort: activities take
# roughly 1.5 to 2 times longer than they would with a literate group. Sibling of
# coxs-bazar-agency-in-learning.yaml; same shape and same deliberate release of control.
id: coxs-bazar-research-project
slug: coxs-bazar-research-project
access: partner
title: "Research Project - Cox's Bazar unit plan"
programmeSlug: learning-bridge-coxs-bazar
componentTitle: Research Project
courseSlug: research-project
summary: >-
  The full 50-hour plan for delivering the Research Project component fully offline in the Cox's Bazar
  camps, as a standalone course. It is set out in hours, not weeks, so you can fit it into your own
  timetable over a minimum of 10 weeks. The whole cohort investigates one shared, local challenge -
  what is happening to the trees on the hills where they live - working from a research question they
  are given: "What happens to our hills without trees, and what changes when trees and plants grow
  back?" Learners make that question their own, gather evidence through primary research in their
  community and through a supplied pack of secondary sources about how trees, soil, rain, and heat
  work, weigh what they find, and turn it into insights they share. Because there is no internet, all
  secondary sources are supplied ready-made. Times are deliberately generous, because oral and visual
  delivery with drawing and translation takes longer than it first appears.
totalFacilitatedHours: 30
totalIndependentHours: 20
deliveryApproach: |-
  This unit runs one real cycle of investigation on a single challenge the whole cohort shares. The aim
  is to move learners from doing research to being researchers - and the way we get there is to keep the
  SUPPORT constant while shifting who OWNS the work, from the facilitator's example to the learner's own.

  We do not withdraw the scaffold as the work gets harder. If anything, the hardest steps - weighing
  evidence, reaching an insight, reflecting on how we have grown - need the most support, so that is
  where the workbook scaffolds hardest. Early on you model each move first: introduce the challenge and
  the given question, show how to take a question apart, read a source aloud. Then learners take each
  move on themselves - designing their questions, gathering, sorting, reaching insights, sharing - but
  always with the same scaffolds beside them. Some learners keep more support for longer, and that is
  exactly right.

  Crucially, the scaffold lives in the learner's research book, not only in you. Every step is taught
  before it is done: a "Learn it" page carries the method, then a worked example, then frames, sentence
  stems and labelled slots to fill. A repeating weekly spread carries the between-session work. So a
  learner who is alone, or who returns after a missed session, still has both the teaching and a
  structure to work from.

  Three cautions are specific to research in this context.

  **Protection comes first.** Primary research means learners talking to real people. The challenge must
  be safe to research here, consent is always asked, no one is pressed to answer, and girls gather in
  same-gender pairs where that is what keeps them safe.

  **Offline does not mean thin.** Secondary research here is real research, done on a supplied, curated
  pack of sources rather than by searching the internet.

  **Language is a scaffold, never a gate.** This cohort works in English at around A1, growing towards
  B1 across the programme. Build every activity on pictures, drawing and translation, introduce research
  words a few at a time on a shared word wall, and give learners simple sentence frames ("Before, …;
  now, …") to lean on. English is something learners grow into - it is never what decides whether they
  can show that they can investigate.
assessmentNote: >-
  On Learning Bridge+, a learner's proficiency in the anchor competency, investigating real-world
  issues (FSI1), is judged by the educator against Amala's proficiency scale at two points: midway
  (formative) and at the end (summative). It is not marked from the final output alone. Gather evidence
  from across the whole investigation: the research question and plan they framed, the interview and
  survey questions they designed, how they weighed their sources (their evidence log), how they moved
  from raw findings to insight, and the final research output and how they answer questions about it.
  A learner who gathered evidence but could not turn it into an insight, and one who reached a
  defensible insight, are showing different proficiency, even with a similar-looking poster. Do not
  over-assess: two considered judgements, built from evidence gathered over time, are worth more than
  repeated testing. This is one of the two certificated competencies for the readiness decision.
phases:
  - title: "Getting started"
    lead: facilitator-led
    summary: >-
      Build a safe, warm space and set up the research book that runs through the whole course.
      Learners meet the shared challenge and the big idea: a researcher does not guess or argue from
      opinion, they find out.
    blocks:
      - title: "Welcome, and our research book"
        kind: orientation
        materialSlug: cb-rp-set-up-research-book
        facilitatedHours: 2
        independentHours: 0.5
        description: >-
          Open the course and set up the book in one session - in practice they are the same session, and
          the book is the best possible way to welcome people into it. Build a safe, welcoming space:
          names, a simple agreement about how the group treats each other and each other's ideas, and
          reassurance that no one has to read, write, or share anything they would rather keep private.
          Introduce the big idea in your own words: this course is about finding things out for
          ourselves, carefully and fairly, instead of guessing or repeating what people say. Then set up
          the research book each learner keeps through the whole course - it holds their question, their
          evidence, and their thinking, mostly as drawings, marks, and a few words - and model making the
          first pages together. It runs through every phase and becomes the record the educator draws on
          for assessment, so set it up early and keep coming back to it. Keep the whole session warm,
          oral, and unhurried.
        independentTask: "Put your name, or your own mark, on the front of your research book, and show it to one person at home."
        flexNote: >-
          The research book is to the Research Project what the learning book is to Agency in Learning:
          the visual-first spine that carries evidence across a stop-start attendance pattern.
      - title: "Meet our challenge"
        kind: activity
        materialSlug: cb-rp-meet-our-challenge
        facilitatedHours: 2
        independentHours: 0.5
        description: >-
          Introduce the challenge the whole cohort will investigate together - what is happening to the
          trees on the hills where we live - in a warm, concrete, oral way, using a picture or short
          story of the hills before and now rather than a definition. Draw out what learners already
          feel and notice about the trees, the bare slopes, the rain and the heat, and let them react
          and ask questions. Then walk through what the course will do with it, using the same shared
          orientation as the other components (see exploring-your-objectives): we will make our question
          our own, gather evidence, work out what it means, and share it. Be clear about WHY we do this:
          these hills are the learners' own, and what happens to them touches their safety, homes, and
          health; understanding a real challenge with evidence lets us think clearly about it; and because
          people are already working to help the hills, we can also find out whether it is working - a
          researcher's skill they can use for any challenge in their lives. Keep the tone one of curiosity
          and hope - the land is greening again - not disaster. Handle it with the safeguarding care it
          needs: the trees are a safe subject, but they touch landslides and lost shelters, so no learner
          has to speak from their own life, and you have step-back and referral guidance to hand.
        independentTask: "Tell one person at home what our group is going to investigate, and one thing you already wonder about our hills and trees."
        flexNote: >-
          Listen closely to how learners talk about the hills: what they already believe, and how
          personal the flooding or landslides are for them, tells you how much to lead in the framing
          phase and where the protection risks are. This same orientation shape works for Agency in
          Learning too.
      - title: "What good research looks like"
        kind: activity
        materialSlug: cb-rp-what-good-research-looks-like
        facilitatedHours: 0.5
        independentHours: 0
        description: >-
          A short, warm introduction to the competency this whole course grows, investigating
          real-world issues (FSI1), as a growth path, not a test. Learners meet, in plain and pictorial
          terms, what a researcher does, and mark honestly where they feel they are now, so they can
          revisit it at the end and see how they have moved.
  - title: "Frame the challenge"
    lead: shared
    objectiveId: research-project--o1
    summary: >-
      Learners take the research question they have been given and make it their own: they surface what
      is already known about the trees and hills, map who and what is connected to the challenge, and
      turn the big question into the specific things they will go and find out.
    blocks:
      - title: "Why this challenge matters, and what we already know"
        kind: activity
        materialSlug: cb-rp-what-we-already-know
        facilitatedHours: 1.5
        independentHours: 1
        description: >-
          Learners explore why the trees and hills matter to them and their community, and pool what
          they already know - the hills before, the clearing, the mud when it rains, the heat - treating
          their own knowledge and lived experience as real evidence to start from. Draw a shared "what
          we already know / what we still need to find out" picture on the wall, in marks and drawings,
          that the cohort adds to as the course goes. This is where you separate what is genuinely known
          from what is assumed, gently and without singling anyone out.
        independentTask: "Ask one older person at home what they remember about how our hills used to look, and bring back one thing to add to our wall."
      - title: "Who and what is connected to our challenge"
        kind: activity
        materialSlug: cb-rp-community-mapping
        facilitatedHours: 1.5
        independentHours: 1
        description: >-
          A community-mapping activity: learners map the people, groups, and things connected to the
          trees and hills - who remembers the forest, who lives on the slopes, what strips the hills and
          what helps them recover, where it floods or slides. Done as a big shared drawing, it surfaces
          contributing factors and, crucially for the next phase, shows who in the community the cohort
          could learn from and speak to. Flag early which of those people it is appropriate and safe for
          learners to approach, and which are better reached another way.
        independentTask: "Notice one person or place connected to our hills and trees on your way home, and be ready to add it to our map."
        flexNote: >-
          The map does double duty: it develops the "identify contributing factors" strand of the
          objective and it becomes the sampling frame for the primary research in the next phase.
      - title: "Make our research question our own"
        kind: activity
        materialSlug: cb-rp-our-research-question
        facilitatedHours: 2
        independentHours: 0.5
        description: >-
          The cohort is given its research question - "What happens to our hills without trees, and what
          changes when trees and plants grow back?" - rather than inventing one from nothing, which
          keeps a single shared focus and is realistic for this cohort. The work here is to make it
          theirs: unpack it in plain, pictorial terms so everyone understands what it is really asking,
          and break it into the things they will actually go and find out. Guide them to four
          sub-questions - what were our hills like before, and what are they like now; what happens to a
          bare hill when it rains and in the hot sun; what do trees, grass, and roots do for the soil and
          for us; and what are people doing to help our hills, and is it working. Talk through which parts
          they can answer by asking and looking here (primary) and which the supplied source pack will
          help with (the last one they do both ways). Capture the question and its four sub-questions in
          words and pictures, big on the wall and in every research book.
        independentTask: "Say our research question out loud to one person at home, and check they understand what we are trying to find out."
        flexNote: >-
          The question is given, but the framing work is real: unpacking it, deciding what is already
          known, mapping who to ask, and turning it into sub-questions is how learners show the first
          objective (framing a researchable focus). Some cohorts will add a sub-question of their own -
          welcome it if it stays answerable here.
  - title: "Plan and conduct research"
    lead: shared
    objectiveId: research-project--o2
    summary: >-
      Learners learn the two ways a researcher finds things out, how to do so fairly and safely, and
      then do it: they design their own questions, work through the supplied pack of secondary sources,
      and gather primary evidence from their community.
    blocks:
      - title: "Two ways to find out, and being a fair and safe researcher"
        kind: activity
        materialSlug: cb-rp-two-ways-and-ethics
        facilitatedHours: 1.5
        independentHours: 0.5
        description: >-
          Introduce, in plain terms with pictures, the two ways a researcher finds things out: asking
          people and looking around us here (primary), and studying what others have already found out
          (secondary, which for us lives in the supplied source pack). Then teach research ethics as
          the heart of the work, not a footnote: ask before you ask ("may I ask you some questions?"),
          explain why, let people say no or stop, do not use names, and never put anyone - including
          yourself - at risk to get an answer. Practise the consent request aloud in pairs until it is
          natural. This ethics ground is carried into every gathering activity that follows.
        independentTask: "Practise asking someone at home for their permission before asking them a question, in our own words."
      - title: "Design our interview and survey questions"
        kind: activity
        materialSlug: cb-rp-design-our-questions
        facilitatedHours: 3
        independentHours: 1
        description: >-
          Teach, then design. The quality of every piece of primary evidence this investigation will
          have is decided in this block, so it opens with real teaching, not with drafting: the four
          kinds of question (open, closed, leading, two-in-one), how to repair a leading question with
          the six starter words, why we ask what a person SAW rather than what they think in general,
          and the three follow-ups - "tell me more", "why do you think that?", and waiting quietly for
          five seconds. Model it with a fishbowl: interview one learner in front of the group for three
          minutes, then do a minute badly on purpose and let the group name every fault. Only then do
          learners design - one or two open interview questions for each of our four sub-questions, each
          with the follow-up they will use and a four-point check (open, one thing, short, safe). They
          then shape a very short survey of closed questions that can be recorded with a tally or a
          three-face scale rather than writing, and decide who to ask: five DIFFERENT kinds of people,
          because a group who only asks people like themselves learns only one thing. They finish by
          trying their questions on each other and fixing what confused or led.
        independentTask: "Try one of your interview questions on a family member, use a follow-up afterwards, and notice what came out that you would have missed."
        flexNote: >-
          If time is short, protect the teaching and the fishbowl and shorten the drafting - a group with
          four good questions they understand gathers better evidence than a group with twelve they do
          not. The survey is the part to drop first if the group is struggling; the interviews carry the
          investigation.
      - title: "Practise being an interviewer, and get ready to go"
        kind: practice
        materialSlug: cb-rp-practise-interviewing
        facilitatedHours: 1.5
        independentHours: 0
        description: >-
          A rehearsal, not a briefing. Learners have good questions now; what they do not have is the
          experience of being the person asking. They run the whole arc of an interview on each other,
          in order - greet, ask permission, ask, follow up, record on the real gathering page while the
          person is still speaking, thank - then do it again with one named improvement each. Then the
          three hard moments, played by their partner: the person who says no (which the group learns to
          treat as a good outcome, not a failure), the person in a hurry (choose your one most important
          question), and the person who answers in one word (use a follow-up, or wait). They close by
          filling the readiness page with their gathering partner and saying aloud, pair by pair, one
          open question, its follow-up, who they will ask, where, when, and who they will ask instead if
          that person is not there. Confirm the gender-responsive gathering plan and the safeguarding
          and referral pathway out loud with the whole group before anyone leaves.
        flexNote: >-
          This block absorbs the briefing that used to sit inside "Go and gather", so gathering itself is
          now purely independent work with a check-in afterwards. Do not let it slide back into
          question-drafting: fix a weak question in the moment if you must, but the point of the block is
          that learners have physically done the thing before they do it for real. A pair who cannot say
          all six readiness answers is not ready - keep them back and rehearse again.
      - title: "Work the source pack"
        kind: activity
        materialSlug: cb-rp-work-the-source-pack
        facilitatedHours: 1.5
        independentHours: 2
        description: >-
          Learners work through the supplied source pack - the ready-made, translated, level-appropriate
          set of secondary sources about how trees, soil, rain, and heat work, supplied on USB or in
          print because there is no internet here. It is about the issue, not about any programme: what
          roots do for soil, why a bare slope slides or floods, why shade is cooler, how a hillside
          recovers. Model how a researcher reads a source: what is this, who made it, what does it tell
          us about our question, and what does it not tell us. Learners pull out, in marks and a few
          words, what each source says that bears on the question, and begin an evidence log in their
          research book. This is real secondary research; the curation is what makes it possible offline.
        independentTask: "Choose one source from the pack, and draw or mark the one most important thing it tells us about our question."
        flexNote: >-
          Every source comes at three reading levels - the real original (in the facilitator guide), a B1
          version, and a simplest A1/A2 version - so you differentiate the ACCESS, not the content: read
          aloud, let a learner take the level they can hold, and let the pictures carry meaning for anyone
          not yet reading fluently. Never hand a learner the simplest version and stop there if they can
          stretch. The pack does double duty as English development, so it is deliberately pitched a step
          above the group and climbs towards a B1 source at the end; gloss the new words onto the word
          wall as they come up. If time is short, groups can take one sub-question and its sources each,
          then teach the rest of the cohort what they found.
        authoringNote: >-
          Scope, for anyone extending the pack: sources about the ISSUE itself (roots and soil, bare
          slopes, rain and landslides, heat and shade, a hillside recovering) - NOT about NGO programmes -
          so it stays valid wherever in Cox's Bazar the cohort is placed, and so learners can triangulate
          their primary findings against what is already known. Keep the credibility spread (Source D is
          the deliberately weak one) and keep the A1/A2 → B1 climb.
      - title: "Go and gather"
        kind: practice
        materialSlug: cb-rp-go-and-gather
        facilitatedHours: 0.5
        independentHours: 3
        description: >-
          The heart of primary research, and where almost all of the independent time lives. The briefing
          for this block now happens in the rehearsal that precedes it, so the half hour here is the
          check-in AFTER gathering, not a send-off before it. Between sessions, in the pairs and with the
          whole interview already rehearsed, learners gather primary evidence
          about the research question from the people and places on their community map, and record it in
          their research book with marks, drawings, and a few words. Open each following session with a
          short, warm check-in in same-gender pairs or the group: who did you speak to, what did you
          find, what got in the way, and what will you do differently next time? Protect this block and
          keep the check-ins going - they are where a pair who is stuck gets unstuck, and where you see
          the evidence accumulating. Hold the ethics line throughout:
          consent every time, no names, no pressure, and no learner sent anywhere unsafe to get evidence.
          Plan gathering so girls can take part safely - in their own home and from women in their close
          networks, or with a female facilitator - not the same way as boys, so no learner is left out of
          the investigation because of how gathering is arranged; and have an agreed safeguarding and
          referral pathway in place before this block. When gathering is disrupted - by a fire, illness, a
          week kept indoors - adapting the plan and picking it up again is part of the skill, not a failure.
        independentTask: "Gather evidence from one or two people or places from our map, ask permission first, and record what you find in your research book."
  - title: "Evaluate evidence and develop insights"
    lead: shared
    objectiveId: research-project--o3
    summary: >-
      Learners move from a pile of evidence to a small number of clear, actionable insights: they weigh
      how far each source can be trusted, sort and theme what they gathered, and work out what it all
      means for the challenge.
    blocks:
      - title: "Can we trust it? Weighing our sources"
        kind: activity
        materialSlug: cb-rp-weighing-our-sources
        facilitatedHours: 2
        independentHours: 1
        description: >-
          Learners meet, in plain terms, how a researcher decides how far to trust a source: who said
          it, how do they know, does other evidence agree, and could they be mistaken or have a reason
          to shape the story. They apply this to both their primary evidence (one person's strong
          opinion is not the same as a pattern across many) and the source pack, marking in their
          evidence log how much weight each piece can bear. This is the "evaluating sources"
          strand, and it protects learners from building an insight on a single shaky claim.
        independentTask: "Think of something you were told about our challenge, and ask yourself: how does that person know it is true?"
      - title: "Sort and theme what we found"
        kind: activity
        materialSlug: cb-rp-sort-and-theme
        facilitatedHours: 1.5
        independentHours: 1
        description: >-
          Learners organise all the evidence - primary and secondary - so that patterns can be seen:
          physically grouping cards, drawings, or marks into themes on the floor or wall, and naming
          each cluster. Out of this come the patterns, trends, and contributing factors in the evidence:
          what many people said, where sources agree or disagree, what keeps coming up. Keep it hands-on
          and visual; the sorting is the analysis.
        independentTask: "Look at what you gathered and find two pieces of evidence that say a similar thing; be ready to explain the pattern."
      - title: "Dig for the root cause"
        kind: activity
        materialSlug: cb-rp-root-cause
        facilitatedHours: 1
        independentHours: 0.5
        description: >-
          One way to analyse what we found: dig past the surface problem to its root cause, using the Five
          Whys (or a problem tree). Take a problem the evidence shows - the soil slides when it rains - and
          ask "why?" again and again, drawing the chain down until you reach a cause you cannot easily push
          past. Each "why" rests on our evidence, and it stays about the hills, never about blaming anyone.
          Getting to the root means our insights deal with the real cause, not just the symptom.
        independentTask: "Take one problem about our hills and ask 'why?' three times, to see what is underneath it."
      - title: "Who, what, and why - looking deeper"
        kind: activity
        materialSlug: cb-rp-looking-deeper
        facilitatedHours: 1
        independentHours: 0.5
        description: >-
          A second way to analyse: see the problem as a human system, through three questions - who or what
          has the power to make it worse or better (families, agencies, the government, the monsoon, the
          hills); what beliefs and attitudes shape it ("the trees are not ours to plant" versus "we can
          care for our hills"); and who or what is helped or hurt by it. Build the three up on the wall.
          This makes insights deeper and fairer - and it stays about understanding, never blaming.
        independentTask: "Notice one person or group who is hurt by the bare hills, and one who could help make them green again."
        flexNote: >-
          Root cause and looking deeper are two ways to analyse the evidence - do one or both, depending on
          your cohort and the time you have. Both feed the next block, where findings become insights.
      - title: "From findings to insights"
        kind: activity
        materialSlug: cb-rp-findings-to-insights
        facilitatedHours: 2
        independentHours: 1
        description: >-
          The analytical heart of the course: learners move from findings (what the evidence says) to
          insights (what it means and why it matters for the hills and the people who live on them, and
          what could be done about it).
          Model the difference between a finding and an actionable insight. The cohort drafts a small
          number of clear insight statements, each one they can point to the evidence for, and separates
          those evidence-backed claims from opinion or assumption. These insights are the defining
          outcome of the whole investigation.
        independentTask: "Think about what we found and finish this out loud for someone at home: 'What surprised me is…'."
  - title: "Communicate findings"
    lead: learner-led
    objectiveId: research-project--o4
    summary: >-
      Learners make their insights usable by others: they choose a format that suits their message and
      audience, and build a research output that shares what they found and what it means, backed by
      their evidence.
    blocks:
      - title: "Choose our format and our audience"
        kind: activity
        materialSlug: cb-rp-choose-format-and-audience
        facilitatedHours: 1
        independentHours: 1
        description: >-
          Learners decide who most needs to hear what they found - peers, families, the wider community,
          a camp committee - and choose a format that fits both the message and an oral, visual context:
          a poster, a spoken presentation with pictures, a role-play or story, a simple infographic.
          Match format to purpose and audience is the idea; there is no single required output. Learners
          plan what their output will say and show, and how it will stand on the evidence.
        independentTask: "Decide who you most want to tell about what we found, and why they should care."
      - title: "Build our research output"
        kind: practice
        materialSlug: cb-rp-build-our-output
        facilitatedHours: 2
        independentHours: 2.5
        description: >-
          Learners build their chosen output, structuring their findings and insights into a clear,
          honest, evidence-based account a non-expert can follow, and rehearsing how they will present it
          and answer questions. Support them to represent the evidence honestly, including its limits
          ("we only spoke to a few people"), rather than overclaiming. Much of the making happens in the
          independent hours; use session time to give and act on feedback. What learners build here, and
          how they talk about it, is central evidence for the FSI1 assessment.
        independentTask: "Work on your part of our research output, and practise saying the one thing you most want people to understand."
  - title: "Showcase and reflect"
    lead: learner-led
    summary: >-
      Learners share their findings with a real audience, reflect on how they have grown as
      researchers, and - on Learning Bridge+ - the educator gathers the evidence to judge each learner's
      proficiency in investigating real-world issues.
    blocks:
      - title: "Share our findings, and look back"
        kind: consolidation
        materialSlug: cb-rp-share-and-reflect
        facilitatedHours: 2
        independentHours: 2.5
        description: >-
          Close the course - and, in this edition, close the whole programme. This block is the spine of
          the one shared showcase (see cb-my-showcase): rather than three separate closings in the same
          week, learners present their research here, show their "My Name, My Voice" card, and name one
          way they have grown, all in one event. Each learner chooses and invites at least one person
          themselves, and does the asking - that choice is as much the point as the presenting is.
          Hold a warm, celebratory sharing where learners present their research
          output to the audience they chose, and answer questions about it, with no one forced to
          present in a way that is unsafe for them. Then learners look back: through their research book
          from the first page, and at the "what good research looks like" growth path they marked at the
          start, marking where they are now and naming how they have moved from guessing to finding out.
          Each learner names one way they have grown as a researcher, by drawing and speaking. On
          Learning Bridge+, this is the point to gather and record the evidence of each learner's growth
          in investigating real-world issues - their question and plan, evidence log, analysis, output,
          and how they answer questions - to inform the assessment judgement, made by educator judgement
          against Amala's proficiency scale.
        independentTask: "Choose one way you have grown as a researcher to share, and one thing about our challenge you would still like to find out."
