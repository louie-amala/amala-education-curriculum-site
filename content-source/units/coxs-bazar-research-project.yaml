sourceNotes:
  - Sequences the cb-rp-* contextualised activities for the Research Project component of Learning Bridge+ (Cox's Bazar); sibling of the coxs-bazar-agency-in-learning unit.
  - >-
      CHALLENGE SET (2026-08-04): the shared challenge is what is happening to the trees on the hills
      where the cohort lives (deforestation → bare slopes → landslides, heat, floods → the land greening
      again). The research is about the issue itself, NOT about any NGO programme, so it holds wherever
      in Cox's Bazar the cohort is placed. A waste / composting challenge is the planned second example
      if trees does not land.
  - >-
      The research question is GIVEN, not invented by the cohort: "What happens to our hills without
      trees, and what changes when trees and plants grow back?", with four sub-questions (before/now; a
      bare hill in rain and hot sun; what roots, grass, and trees do; and what people are doing to help
      and whether it is working - the last researched at the community/observable level, not as an NGO
      audit). Phase 2 is therefore about learners owning and unpacking the given question, not generating one - this
      still evidences the first objective (framing a researchable focus) and suits an A1-English, oral
      cohort.
  - >-
      The source pack is a supplied artefact, not an internet search: a ready-made set of 11 secondary
      sources about the issue (roots and soil, bare slopes, rain and landslides, heat and shade, a
      hillside recovering), each at three reading levels, distributed offline (USB or print). See
      cb-rp-secondary-source-pack.
  - >-
      Language: the cohort works in English at around A1, scaffolded towards B1 across the programme.
      Because developing English is itself a programme goal, written resources use graded English with
      picture support (not picture-first): they carry real, level-appropriate text that stretches
      learners, supported by images, a shared research word wall, and simple sentence frames. English is
      a scaffold learners grow into, never the gate on whether a learner can demonstrate FSI1.
  - Set out in hours, not weeks, as a standalone 50-hour component (30 in-person + 20 independent). Educators fit it to their own weekly schedule over a minimum of 10 weeks.
  - Activity times are generous (roughly 1.5 to 2 times a literate-group estimate) to reflect oral and visual delivery with drawing and translation.
  - >-
      The offline pack is generated by scripts/downloads/generate-rp.js and wired into the downloads
      above - facilitator plan (with the source pack as Appendix A and the full originals as Appendix
      B), learner research book, FSI1 assessment record, and picture-word cards. Re-run that script
      after editing this unit or any cb-rp-* material.
  - >-
      Safeguarding: primary research means learners speaking with community members, so consent is
      always sought, participants are not named, and same-gender gathering is used where girls' safety
      depends on it. The trees are a deliberately safe, hopeful subject, but they touch landslides and
      lost shelters, so no learner speaks from their own life unless they choose to. Delivery follows
      NRC's Code of Conduct and protection principles.
