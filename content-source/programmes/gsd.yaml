# Global Secondary Diploma (GSD) - programme structure (spec §4.1 Programme).
# Sources: GSD Handbook (Requirements + Criteria for Award); GSD Explainer (overview,
# accreditation, target learners, the stream diagram on p.6).
# This programme OWNS the course→stream→role relationships. Courses do not hardcode their
# stream; the site derives stream membership by reverse index from here (spec's approach).
id: gsd
slug: gsd
access: public
title: Global Secondary Diploma
shortName: GSD
tagline: >-
  The world's first secondary education programme and qualification designed with and for
  refugee and conflict-affected youth.
summary: >-
  The Amala Global Secondary Diploma is a pioneering, competency-based programme equivalent to
  the final two years of secondary education. It gives refugee and conflict-affected youth, and
  members of their host communities, the opportunity to complete their secondary education and
  build agency for positive change. More than a programme, it is a transformative learning
  experience that serves as a bridge to higher education, entrepreneurship, and employment.
accreditation: >-
  Internationally accredited by NEASC (New England Association of Schools and Colleges) and
  CIS (Council of International Schools).
targetContext: >-
  Conflict-affected youth, refugees, and host-community members aged 16–25 who are not enrolled
  in, or have not completed, secondary or higher education. Eligible learners can handle
  upper/senior secondary (ISCED Level 3) subject matter and are proficient in English to
  intermediate (B1) level.
structure: >-
  A flexible, modular programme typically delivered over about 15 months. Learners engage in
  roughly 20 hours of facilitated and independent work per week. The programme comprises a
  minimum of 1100 hours of structured learning - of which at least 660 hours are facilitated
  live (in person or online) - across 10 Amala Changemaker Courses (two per subject stream),
  the Personal Interest Project, and the Pathways Programme.
durationMonthsTypical: 15
totalStructuredHoursMin: 1100
liveFacilitatedHoursMin: 660

# 10 Changemaker Courses = 5 streams x 2 courses. Positions (course-1/course-2) from the
# Explainer diagram; treat as layout position unless a delivery sequence is confirmed.
# exampleProductTask = an EXAMPLE end-of-course demonstration task from the Handbook. These are
# illustrative, NOT a GSD requirement - educators may use other tasks. null = "under construction".
streams:
  - id: leadership-for-social-innovation
    title: Leadership for Social Innovation
    courses:
      - { courseId: social-entrepreneurship, position: course-1, exampleProductTask: "Final Pitch: Share Your Social Enterprise" }
      - { courseId: ethical-leadership,       position: course-2, exampleProductTask: "Final Reflection: Ethical Leadership in Action" }
  - id: towards-sustainable-peace
    title: Towards Sustainable Peace
    courses:
      - { courseId: peacebuilding,     position: course-1, exampleProductTask: "Peacebuilding Proposal" }
      - { courseId: living-peacefully, position: course-2, exampleProductTask: "Living Peacefully Reflection" }
  - id: active-participation-in-societies
    title: Active Participation in Societies
    courses:
      - { courseId: making-societal-change,        position: course-1, exampleProductTask: null }   # "under construction"
      - { courseId: economics-for-positive-change, position: course-2, exampleProductTask: "Regenerative Economics Proposal" }
  - id: self-and-cultural-expression
    title: Self and Cultural Expression
    courses:
      - { courseId: powerful-narratives,              position: course-1, exampleProductTask: null }
      - { courseId: artistic-and-cultural-expression, position: course-2, exampleProductTask: null }
  - id: using-evidence-to-make-change
    title: Using Evidence to Make Change
    courses:
      - { courseId: maths-for-change,          position: course-1, exampleProductTask: null }
      - { courseId: science-informed-action,   position: course-2, exampleProductTask: null }

ongoingComponents:
  - courseId: pip
    role: personal-interest-project
    structuredHours: 50
    graduationRequirement: true
  - courseId: pathways
    role: pathways
    structuredHours: 50
    graduationRequirement: true

graduationCriteria:
  - Complete two courses per subject stream - 10 Changemaker Courses total, equivalent to 1000 hours of structured learning.
  - Complete a Personal Interest Project, equivalent to 50 hours of structured learning.
  - Complete a Pathways course, equivalent to 50 hours of structured learning.
  - Achieve a minimum of Practitioner level in each of the Foundational competencies in the Amala Competency Framework and Proficiency Scale.

assessment:
  note: >-
    Foundational competencies are required for graduation (breadth); Advanced competencies are
    optional and let learners explore areas in more depth. Proficiency is demonstrated through a
    portfolio of evidence drawn from inside and outside the curriculum.
  evidenceSources:            # aligns with FacilitationMaterial / AssessmentExample evidence model
    - Products (e.g. reports, slide decks, written reflections)
    - Performances (e.g. live demonstrations, presentations, community interactions)
    - Educator insights (based on the educator's understanding of a learner's progress)
  transcript: >-
    Each demonstrated competency earns credit toward the GSD, recorded in a digital, skills-based
    transcript (in partnership with the Mastery Transcript Consortium), with an optional
    GPA-equivalent view.

sourceNotes:
  - The Handbook table and the Explainer diagram order the two courses within a stream differently; positions above follow the Explainer diagram.
  - exampleProductTask values are illustrative example demonstration tasks, NOT GSD requirements. Seven are "under construction" in the Handbook (null above); five are named.
  - Learning Bridge is a separate programme (not the GSD) and is not yet sourced.

# Programme-level downloads, rendered near the top of the programme page.
downloads:
  - label: Case-based moderation template
    file: /downloads/gsd-moderation-template.docx
    format: DOCX
    note: >-
      One per case - one educator, one learner, one competency. The educator bringing the case fills in
      Part A before the session; colleagues read it, then ask questions. Parts B and C are filled in
      during the session. Type straight into the boxes, or print.

# The case-based moderation template. Not rendered on the page (the schema ignores it); generated into
# /downloads/gsd-moderation-template.docx by scripts/downloads/generate-gsd-moderation.js. `kind`:
# text (a box to type in), level (tick a level, then a box), choice (tick one of `options`, then a box).
moderationTemplate:
  title: Case-based moderation template
  about:
    heading: What case-based moderation is
    paras:
      - >-
        Case-based moderation is how GSD educators build a shared understanding of what each level of
        the Proficiency Scale looks like. It is developmental: it exists to grow educators' judgement,
        not to check whether a decision was right.
      - >-
        In each session, an educator brings a case: their judgement of one learner's level in one
        competency, with the evidence and reasoning behind it, written up in Part A of this template.
        Colleagues read it first, then ask questions to understand how the judgement was reached, and
        the discussion tests that reasoning against the words of the level descriptors. The level stays
        the judgement of the educator who knows the learner.
      - >-
        A case is not a piece of work to be marked. Proficiency lives in the learner, not the artefact,
        so a case brings everything the educator knows: what the learner demonstrated, where, how the
        educator knows, and who the learner is.
      - >-
        Over time, this makes decisions more consistent across educators and sites. That consistency is
        what lets learners, partners and anyone recognising the GSD trust our assessment model.
      - >-
        A good case is one there is something to learn from: a judgement near a boundary, one the
        educator was unsure of, one that surprised them, or one the site wants to look at.
  howTo:
    heading: How to use it
    items:
      - The educator bringing the case fills in Part A before the session. Write it so that a colleague who does not know the learner can follow it - Part A is all they will have to go on.
      - In the session, everyone reads Part A first. The educator does not present it; the session moves straight to questions.
      - The facilitator fills in Parts B and C during the session, with the educator.
      - Moderation is case-based, not consensus-based. The level is the judgement of the educator who knows the learner; the room asks questions and gives advice, it does not decide.
      - Identify the learner by their Toddle/MTC ID, never by name.
      - Educators can share links to the learner's work if it helps the discussion.
      - The completed template goes into the site's moderation record and to Amala.
  header:
    - Site / partner
    - Date
    - Educator bringing the case
    - Facilitator of the case-based moderation
    - Educators attending
    - Learner ID
    - Competency (code and title)
    - Competency goal
  parts:
    - title: "Part A: prepared by the educator bringing the case"
      fields:
        - label: Why this case?
          prompt: >-
            Why is it being moderated? You may have been asked to bring it. Or you may have chosen it
            because you were unsure, it sits on a boundary (especially Theorist/Practitioner, where
            credit is decided), it surprised you, or it would be useful for everyone to see.
          guidance: If you were asked to bring it, say so, and add anything about it you think the room should notice.
          kind: text
          lines: 3
        - label: The learner
          prompt: >-
            Help the room get to know the learner: their interests, what motivates them, what they find
            hard and what they are good at, who supports them, and anything about their life and
            circumstances that helps explain where they are.
          guidance: This is not evidence for the level. It is so everyone discussing the case understands the learner and their context.
          kind: text
          lines: 5
        - label: What level?
          kind: level
        - label: Your rationale
          prompt: >-
            Why this level? Tie your reasons to the words of the level descriptor, and be specific about
            where and how the learner demonstrated the competency. For example, if you say they achieved
            the goal described by the competency, say:
          bullets:
            - "Where: which course, PIP, Pathways, a mentoring conversation, or outside the curriculum."
            - "What they were doing: the task or situation, and what they actually did, said or made."
            - "How you know: whether you saw or heard it yourself, or the learner reported it."
          after: >-
            Then say what from the next level up you have not yet seen the learner demonstrate. Share
            links to their work if it helps the room.
          guidance: >-
            Write what happened, not a verdict: "drafted a goal with three milestones in the PIP planning
            phase", not "strong plan". If you are claiming Expert Practitioner, name each scenario.
          kind: text
          lines: 10
        - label: Your confidence
          prompt: How sure are you that this level reflects what the learner can really do?
          kind: choice
          options: [Not very, Reasonably, Very]
          boxLabel: Why?
          lines: 2
        - label: The learner's own view (optional)
          prompt: From a self-assessment or a conversation - where do they place themselves, and what did they say?
          kind: text
          lines: 3
    - title: "Part B: in the session"
      fields:
        - label: Questions and answers
          prompt: Once everyone has read Part A - the main questions the room asked, and the educator's answers.
          guidance: >-
            The aim is to understand the judgement and the evidence behind it, not to second-guess it.
            The educator knows the learner; the room only has what they read.
          kind: text
          lines: 6
        - label: What the discussion brought out
          prompt: >-
            Did the rationale hold up against the words of the level descriptor? Where questions came up,
            were they about:
          bullets:
            - "The evidence: what the learner demonstrated, and whether it was seen or reported."
            - "The context: whether the learner had a real chance to demonstrate the competency."
            - "The reading of the descriptor: whether people understood the same words differently."
          after: Which words of the descriptor turned out to decide it?
          guidance: >-
            Watch for levels set to motivate, effort read as competency, a polished artefact read as
            proficiency, and how well the educator knows the learner.
          kind: text
          lines: 6
    - title: "Part C: outcome and learning"
      fields:
        - label: The decision
          kind: choice
          options: [The level stands, The educator chose to revise it]
          guidance: >-
            The level is the educator's judgement, because they know the learner. The room asks questions
            and gives advice; it does not decide.
          boxLabel: "If revised: the new level, and why. Any other notes on the decision."
          lines: 2
        - label: Toddle and MTC updated?
          kind: choice
          options: [Yes, Not needed, Pending]
          boxLabel: "If pending: who will do it, and by when"
          lines: 1
        - label: Improvements
          prompt: Name who acts on each.
          boxes:
            - label: "The educator's assessing"
              prompt: What they will do differently in gathering evidence or making judgements.
              lines: 2
            - label: The site
              prompt: Anything that would make assessing easier or more consistent, such as recording practice, guidance, or how cases are chosen.
              lines: 2
            - label: Learning design and facilitation
              prompt: Anything to think about when designing and facilitating future learning, such as opportunities to demonstrate this competency, how tasks are set up, or where evidence could be gathered more naturally.
              lines: 2
        - label: For every educator
          prompt: One thing from this case every GSD educator should hear, written as you would say it.
          kind: text
          lines: 2
        - label: For Amala
          prompt: A question, a descriptor that needs clarifying, or a pattern. "Nothing" is a fine answer.
          kind: text
          lines: 2
