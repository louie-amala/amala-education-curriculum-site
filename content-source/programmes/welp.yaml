# Women's Entrepreneurship & Leadership Programme (WELP) - programme structure (spec §4.1 Programme).
# Source: "WELP Programme Overview" slides (Amala, 2026).
#
# The slides describe ONE funded instance - a 30-learner cohort in Kakuma Refugee Camp and Kalobeyei
# Settlement, with an all-female team of a coordinator and two educators, and a set of instance M&E
# targets (participation and income percentages, number of ventures funded, community members reached).
# This entry models the REPEATABLE programme, so cohort size, specific location, team size, and
# instance-specific targets are deliberately generalised out; what remains is the durable programme
# model. WELP is component/pillar-based (like Learning Bridge), not a course-based GSD programme, so it
# uses the component-based programme fields and leaves streams/ongoingComponents empty.
id: welp
slug: welp
access: public
title: Women's Entrepreneurship & Leadership Programme
shortName: WELP
tagline: >-
  Tailored education, entrepreneurial training, and mentorship that equip young women to build
  sustainable livelihoods and lead change in their communities.
summary: >-
  The Women's Entrepreneurship & Leadership Programme empowers female adolescents and young women
  through tailored education, entrepreneurial training, and mentorship. It addresses the barriers to
  education and employment that young women face in refugee and displacement-affected contexts,
  equipping them with the skills, confidence, and resources to build sustainable livelihoods and
  transform their communities. At its heart is a social entrepreneurship course, wrapped in seed
  funding for the most promising ventures, mentorship from local female entrepreneurs, and the
  practical support - a female-led learning space, childcare and transport stipends, and dignity kits -
  that makes participation possible. It is delivered in partnership with a local refugee-led
  organisation, strengthening that organisation's own capacity as the programme runs.
targetContext: >-
  Female adolescents and young women, typically aged 16 to 25, who face barriers to education and
  employment in refugee and displacement-affected contexts. Many are mothers balancing childcare
  responsibilities with their aspirations for a better future. Delivery is designed around these
  realities, removing the practical barriers that most often exclude young women from education.
ageRange: "16–25"
minDurationWeeks: 10

studentGains:
  - Essential entrepreneurial skills - financial literacy, leadership, problem-solving, and business development.
  - The confidence, resources, and networks to start and sustain an income-generating business that meets a local need.
  - Connection to female role models and a mentorship network that inspires confidence and ambition.
  - Greater wellbeing, purpose, and readiness to take on leadership roles in their communities.

# The programme's building blocks (pillars). Hours are set per instance and are not fixed here.
components:
  - title: Social Entrepreneurship Course
    summary: >-
      A social entrepreneurship course, delivered over a minimum of 10 weeks, that equips participants
      with financial literacy, leadership, problem-solving, and business development skills.
    courseSlug: social-entrepreneurship
    deliveryOptions:
      - Female-led, in-person delivery
  - title: Seed Funding
    summary: >-
      Seed funding grants awarded to the most promising ventures, enabling participants to launch small
      businesses that meet local needs. The number of grants and their value are set per instance.
  - title: Mentorship and Role Models
    summary: >-
      Guest speaker sessions from local female entrepreneurs and a mentorship network that connect
      participants with role models who inspire confidence and ambition.
  - title: Wraparound Support
    summary: >-
      A supportive learning environment paired with the practical support that removes barriers to
      participation - transportation and childcare stipends, and dignity kits - so young women, including
      mothers, can attend and stay engaged.

# What it takes to deliver, and the design decisions that make the programme reach young women.
delivery:
  - title: An all-female delivery team
    detail: >-
      The programme must be delivered by an all-female team - a female programme coordinator and female
      educators. This is essential to reaching and retaining young women, particularly in contexts where
      mixed-gender delivery would limit their participation.
  - title: Delivered in partnership with a refugee-led organisation
    detail: >-
      WELP is delivered in partnership with a local refugee-led organisation (RLO). Running the programme
      builds the RLO's own capacity to deliver education and livelihoods programming, which is one of the
      programme's intended outcomes rather than only a means of delivery.
  - title: Removing barriers to participation
    detail: >-
      Delivery is built around the barriers that exclude young women from education. Transportation and
      childcare stipends, dignity kits, and a supportive, female-led learning environment are treated as
      core to the model, not as optional extras.

# Intended outcomes / theory of change. Generalised from the slides' five key outcomes: instance M&E
# targets (percentages, counts) are omitted; the outcome areas the programme works toward remain.
outcomes:
  - title: Empowerment and poverty alleviation through education
    points:
      - Participants launch their own income-generating businesses.
      - Household incomes rise as new livelihoods take hold.
      - Graduates take on leadership roles in local social-impact initiatives, driving improvements in education, healthcare, and social welfare.
  - title: Improved wellbeing and reduced barriers
    points:
      - Transport support, childcare, and dignity kits address the barriers that exclude young women from education, keeping participants engaged through to completion.
      - Participants report increased wellbeing - more confidence, purpose, and readiness to engage in community development.
  - title: Reduced poverty and strengthened communities through employment and business creation
    points:
      - New businesses are established through the programme.
      - Jobs are created, and the wider community benefits indirectly from new employment opportunities, goods, and services.
      - Communities become less reliant on external aid as local livelihoods grow.
  - title: Capacity strengthening for refugee-led organisations
    points:
      - Delivering the programme strengthens the capacity of the partner refugee-led organisation.
  - title: Establishing a model to scale impact
    points:
      - Lessons learned inform the expansion of Amala's partnership model to other refugee contexts, giving more young women access to transformative education.

sourceNotes:
  - Authored from the "WELP Programme Overview" slides (Amala, 2026), which are a limited overview.
  - >-
    The slides describe one funded instance (a 30-learner cohort in Kakuma Refugee Camp and Kalobeyei
    Settlement, an all-female team of one coordinator and two educators, and instance M&E targets). This
    entry generalises to the repeatable programme, so cohort size, specific location, team size, and
    instance-specific targets - participation and income percentages, the number of ventures funded, and
    the count of community members reached - are deliberately omitted.
  - >-
    Structure below the pillar level (session plans, an hours breakdown, and assessment or certification)
    is not yet sourced. The 10-week duration is the length of the social entrepreneurship course as stated
    in the source.
  - >-
    Seed funding, mentorship, and wraparound support are described in the source as programme features;
    exact grant counts and stipend values are set per instance and are intentionally not fixed here.
