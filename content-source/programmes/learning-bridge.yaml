# Learning Bridge - programme structure (spec §4.1 Programme).
# Source: "Learning Bridge Programme Overview for Delivery Partners" (Amala).
# Unlike the GSD, Learning Bridge is COMPONENT-based, not course-based: its structure is a set of
# bespoke components (Research Project, Agency in Learning, Mentoring and Wellbeing, English Language
# Development), none of which are GSD Changemaker Courses. It therefore uses the component-based
# programme fields (components/versions/…) rather than streams/ongoingComponents, which stay empty.
id: learning-bridge
slug: learning-bridge
access: public
title: Learning Bridge
shortName: Learning Bridge
tagline: >-
  A preparatory programme that builds the foundational competencies, habits, and confidence young
  people need to enter upper secondary transformative education.
summary: >-
  Learning Bridge is a preparatory programme designed for young people aged 14 to 16 who are
  preparing to enter upper secondary transformative education. It develops the foundational
  competencies, habits, and confidence that learners need to participate fully in Amala programmes.
  The programme is built around three core components - a structured Research Project in which
  students investigate a real-world challenge together, an Agency in Learning component that develops
  self-directed learning habits, and Mentoring and Wellbeing support to ensure each learner makes
  sustained progress. For learners below B1 English proficiency, an optional English Language
  Development component of 50 hours is available.
targetContext: >-
  Young people aged 14 to 16 preparing to enter upper secondary transformative education. There is
  no minimum English proficiency requirement for entry; the optional English Language Development
  component is the mechanism for supporting learners who need it.
structure: >-
  The core programme is around 100 hours across two taught components (Research Project and Agency in
  Learning), each 50 hours, plus a Mentoring and Wellbeing component that runs throughout as ongoing,
  regular 1:1 or group mentoring rather than a fixed block of hours. With the optional English Language
  Development component (50 hours), the taught total is around 150 hours. The programme must run for a
  minimum of 10 weeks; partners may extend this to suit their context, and assessment points on
  Learning Bridge+ typically extend it further.
ageRange: "14–16"
minDurationWeeks: 10
# Taught components only (Research Project + Agency in Learning, 50h each). Mentoring and Wellbeing is
# ongoing, not a fixed block of hours, so it is not counted here.
totalStructuredHoursMin: 100

# Two versions of the same programme; the components are identical across both.
versions:
  - name: Learning Bridge
    summary: >-
      The base programme. Learners complete all components and develop the competencies, but there
      is no formal assessment or certification requirement. Suitable for partners where certification
      infrastructure is not yet in place or is not a priority.
  - name: Learning Bridge+
    summary: >-
      The base programme with the addition of formal competency assessment, Amala moderation, and a
      certificated outcome for students. This requires additional educator training and Amala
      moderation infrastructure, and involves a higher cost to partners.

studentGains:
  - The ability to investigate a real-world challenge using primary and secondary research, and to develop evidence-based insights.
  - Self-directed learning habits including goal-setting, planning, tracking progress, and reflecting on growth.
  - Stronger English language skills for learning, research, and communication (if the English Language Development component is included).
  - A foundation of confidence and competence that prepares them for the demands of upper secondary education.

# The Research Project is deliberately a single shared challenge for the whole cohort: working on a
# shared inquiry builds collective knowledge, enables peer support, and is developmentally
# appropriate for this age group. The challenge should be relevant, safe to research locally, and
# connected to students' lives.
components:
  - title: Research Project
    summary: All students investigate the same shared real-world challenge.
    structuredHours: 50
    facilitatedHours: 30
    independentHours: 20
    courseSlug: research-project
    deliveryOptions:
      - Standard (ready-made guide and resources)
      - Co-designed with Amala (additional cost)
  - title: Agency in Learning
    summary: Students develop self-directed learning habits.
    structuredHours: 50
    facilitatedHours: 30
    independentHours: 20
    courseSlug: agency-in-learning
    deliveryOptions:
      - Standard (ready-made guide and resources)
      - Co-designed with Amala (additional cost)
  - title: Mentoring and Wellbeing
    summary: >-
      Ongoing 1:1 and small-group support for progress and wellbeing. Not a fixed block of hours: it
      runs throughout the programme as regular mentoring conversations.
    cadence: Ongoing · regular 1:1 or group sessions
    deliveryOptions:
      - Standard
  - title: English Language Development
    summary: >-
      Optional, for learners below B1 proficiency. Delivered through the My Voice course guide - the
      first, foundational unit (A1-) of Amala's English for Impact programme - which builds the
      sounds, letters, and first sentences of English around each learner's own identity and voice,
      and culminates in a personal identity artifact shared with an audience. Its 50 hours are the
      starting point; learners who need to keep progressing toward the B1 level required for upper
      secondary study continue through the later English for Impact units.
    structuredHours: 50
    facilitatedHours: 30
    independentHours: 20
    courseSlug: efi-my-voice
    deliveryOptions:
      - Standard (ready-made My Voice course guide and resources)
    optional: true

versionComparison:
  - aspect: Programme components
    detail: Identical across both versions.
  - aspect: Formal assessment
    detail: >-
      Not required on Learning Bridge. Required on Learning Bridge+ at two points: midway
      (formative) and end of programme (summative).
  - aspect: Moderation
    detail: >-
      Not applicable on Learning Bridge. Learning Bridge+ includes three case-based moderation
      sessions, facilitated by Amala staff, to which every educator brings one case.
  - aspect: Educator training
    detail: >-
      20 hours on Learning Bridge (10 live, 10 independent). 28 hours on Learning Bridge+ (14 live,
      14 independent), including assessment and moderation training.
  - aspect: Certificated outcome
    detail: >-
      No formal certificate on Learning Bridge. Learning Bridge+ awards Pass, Merit, or Distinction
      based on assessed proficiency levels.
  - aspect: Cost to partner
    detail: >-
      Learning Bridge is the lower-cost option. Learning Bridge+ involves additional Amala staff
      time for training and moderation, and is priced accordingly.

delivery:
  - title: Staffing
    detail: >-
      Plan for approximately 1.5 educators per 25 students. This reflects the combined teaching and
      mentoring load. Partners may allocate mentoring responsibilities across their team in whatever
      way works best for their context, as long as each student has a designated mentor.
  - title: The Programme Coordinator
    detail: >-
      Every delivery requires a designated Programme Coordinator: a dedicated point person
      responsible for ensuring the programme runs smoothly and that Amala's requirements are met. The
      coordinator does not need to be an educator, but must be reliable, organised, and available
      throughout the programme. Indicative time commitment: approximately 20 hours across the
      programme for Learning Bridge, and 30 hours for Learning Bridge+.
    items:
      - Liaising with Amala before, during, and after the programme
      - Managing the programme timetable and ensuring scheduled hours are delivered
      - Coordinating access to Amala resources and ensuring educators have what they need
      - Tracking student participation and flagging concerns to Amala
      - "On Learning Bridge+: coordinating the logistics of assessment points, moderation sessions, and results processes"
  - title: Educator Training
    detail: >-
      All educators new to the programme must complete Amala's initial educator training before
      delivery begins, delivered by an Amala Trainer. This is 20 hours total on Learning Bridge (10
      live, 10 independent) and 28 hours on Learning Bridge+ (14 live, 14 independent, including
      assessment and moderation training).
  - title: Assessment Time (Learning Bridge+ only)
    detail: >-
      On Learning Bridge+, formal assessment takes place at two points: midway through the programme
      (formative) and at the end (summative). At each point, educators need a minimum of 30 minutes
      off timetable per student they teach or mentor to complete the assessment process - for
      example, an educator teaching 25 students and mentoring 10 of them assesses 35 students, or
      about 17.5 hours off timetable per assessment point. Partners must build this time into their
      schedule; it often means the programme runs for longer than 10 weeks in practice.

support:
  - title: Ongoing Support
    detail: >-
      All partners have access to a named Amala contact throughout delivery, available to respond to
      queries and provide guidance. Partners who want more hands-on support may opt to work with a
      Learning Bridge Coach - an additional paid service scoped to the partner's needs.
  - title: Resources
    detail: >-
      Amala provides ready-made, contextually adaptable course guides and resources for the Research
      Project, Agency in Learning, and English Language Development components, available to all
      partners. For a higher degree of contextualisation, Amala offers a co-design service for the
      Research Project and Agency in Learning components, working with key stakeholders from the
      partner context - an additional paid service scoped per partner.
  - title: Moderation (Learning Bridge+ only)
    detail: >-
      Learning Bridge+ includes three moderation sessions: two formative sessions facilitated by an
      Amala Trainer (early calibration feedback, then preparation for summative assessment), and one
      summative session conducted by two Amala-trained moderators, who reach a formal decision on the
      validity of the assessment process and, where necessary, moderate decisions up or down before
      results are released to students. Every session is case-based: each educator brings one case,
      and the group judges it blind against the Proficiency Scale. See "How moderation works" below.

# Grading applies to Learning Bridge+ only. Students are assessed against Amala's Proficiency Scale.
grading:
  intro: >-
    On Learning Bridge+, students are formally assessed in two competencies against Amala's
    Proficiency Scale. The grade awarded is based on the proficiency level achieved in each.
  assessedCompetencies:
    - title: Investigate Real World Issues
      description: >-
        The ability to conduct primary and secondary research into challenges affecting people and
        the planet to develop actionable insights.
    - title: Set and Pursue Goals
      description: >-
        The ability to establish clear objectives for learning and growth and take deliberate steps
        to make progress towards them.
  scale:
    - grade: Pass
      requirement: Practitioner in both competencies.
    - grade: Merit
      requirement: Reflective Practitioner in one competency, Practitioner in the other.
    - grade: Distinction
      requirement: Reflective Practitioner in both competencies.
  note: >-
    Students who do not reach Practitioner level in both competencies do not receive a certificate.
    Educators receive feedback to support these students in continuing to develop. Formal assessment
    also introduces students and educators to Amala's competency-based assessment model, building
    familiarity with the approach they will encounter throughout upper secondary programmes.


# How moderation works on Learning Bridge+. The GENERAL model: an Amala staff member facilitates, the
# educators are the assessors, and every assessor brings one case. Editions contextualise it by
# filling the same fields for their own context (see learning-bridge-coxs-bazar.yaml, where NRC's
# master educators facilitate and bring a case of their own up to Amala). Rendered on the programme
# page and into the Moderation Guide by scripts/downloads/generate-moderation.js.
moderation:
  intro: >-
    A judgement is only fair if it is consistent: the same evidence should earn the same level
    whoever assessed it. Moderation is how Learning Bridge+ makes that true. It is case-based. A
    moderation facilitator runs the session, and every educator who assesses brings one case - one
    learner, one competency, one judgement, with the evidence behind it. The group judges each case
    blind against the Proficiency Scale before hearing the assessor's level, argues out any
    difference against the descriptors, and decides. What the group learns from one case is then
    carried back across every judgement it touches.
  roles:
    - role: Moderation facilitator
      who: Usually an Amala Trainer. At the summative session, an Amala-trained moderator, with a second moderator alongside.
      does: >-
        Runs the session and holds the protocol: keeps each assessor's level hidden until everyone
        has judged, makes every disagreement resolve against the descriptors rather than against
        anyone's seniority, and keeps the moderation record. Judges blind alongside everyone else.
        At the summative session, the two moderators also decide whether the assessment process was
        valid and results can be released.
    - role: Assessors
      who: The educators who made the judgements - facilitators and mentors who assess.
      does: >-
        Each brings one case and presents its evidence. Judges every other case blind, argues for
        their reading, and changes their mind when the scale says they should. Afterwards, rechecks
        their own judgements wherever a case was changed.
    - role: Programme coordinator
      who: The partner's coordinator.
      does: >-
        Schedules the sessions inside the assessment windows, makes sure every assessor arrives with
        a case, and holds results until every recheck is in.
  sessions:
    - when: After the midpoint (formative) assessment
      title: Early calibration
      facilitatedBy: An Amala Trainer
      purpose: >-
        The first time the group compares judgements. Expect wide spreads and treat them as the
        point: this is where a shared reading of the scale is built, early enough for it to change how
        evidence is gathered in the second block.
    - when: Before the summative assessment
      title: Preparing for the final judgement
      facilitatedBy: An Amala Trainer
      purpose: >-
        Each educator brings a learner they are unsure how they will judge at the end. The session
        sharpens the boundaries that decide grades - Theorist or Practitioner, Practitioner or
        Reflective Practitioner - and names any evidence still worth gathering while there is time.
    - when: After the summative assessment, before results are released
      title: Summative moderation
      facilitatedBy: Two Amala-trained moderators
      purpose: >-
        The formal session. Cases are judged as before; the moderators then decide whether the
        assessment process was valid, and, where necessary, moderate decisions up or down. No result
        is released until this session and every recheck it produces are complete.
  theCase:
    intro: >-
      One learner, one competency, one judgement. One case each is enough, because the session is
      not checking every judgement - it is checking how each assessor reads the scale, and the
      recheck carries that back across everything else they judged.
    choose:
      - The judgement you were least sure of - not the one you are proudest of. A case everyone agrees on in a minute teaches the group nothing.
      - Where you can, one that sits near a boundary that changes a grade - Theorist or Practitioner, Practitioner or Reflective Practitioner.
      - A different learner from the case you brought last time, and where you can, the other competency.
    bring:
      - "The evidence, as it is: workbook pages, what the learner made, notes of what they said and did. Oral and visual evidence counts exactly as it would in the room."
      - The assessment record, with your level and the reason you gave for it, tied to the descriptor.
      - One sentence on where you were least sure, and what would have moved you up or down.
      - The learner identified by first name or a code only. The case is about the judgement, not the person.
  running:
    - step: Set up
      time: 10 min
      detail: >-
        The Proficiency Scale in front of everyone. Two rules said out loud: disagreements are settled
        against the descriptors, not by who is most senior; and changing your mind is the system
        working, not a failure.
    - step: Present the evidence
      time: 3 min per case
      detail: >-
        The assessor shows what the learner did, said and made - the evidence only. Not their level,
        and not how they feel about the learner.
    - step: Judge blind
      time: 2 min
      detail: >-
        Everyone, the facilitator included, privately decides a level. Then everyone shows at once -
        written on a card, or held up on fingers. Nobody can wait to see where the others land.
    - step: Argue it out
      time: 7 min
      detail: >-
        If the levels spread, the people at either end argue first, each pointing to the descriptor
        and the piece of evidence that puts it there. The assessor speaks last: their level, and their
        reason.
    - step: Decide and record
      time: 3 min
      detail: >-
        The group decides - confirmed, changed, or more evidence needed - and the facilitator writes
        the decision and a one-line reason tied to the descriptor. If it changed, a recheck is
        flagged for the assessor.
    - step: Close
      time: 10 min
      detail: >-
        What showed up across the cases: a descriptor the group was reading differently, a kind of
        evidence being over- or under-weighted. The agreed reading is written down, and every recheck
        gets a date.
  facilitatorRules:
    - Hold the protocol, not the verdict. Your level goes on the table blind with everyone else's, and gets argued with like everyone else's.
    - Never resolve a disagreement with your own authority. Resolve it against the descriptor, and make the group say which words in it decide the case.
    - Keep each assessor's level hidden until everyone has judged. Once a level is spoken, the room anchors to it.
    - Ask the quiet ones first. People who always agree have usually not yet disagreed out loud.
    - "Watch for the three slips: being swayed by presentation rather than proficiency, by knowing the learner, or by effort rather than what the learner can now do."
    - Write it down as you go. The record is the evidence the session happened and what it decided.
  outcomes:
    - outcome: Confirmed
      meaning: The group places the evidence where the assessor did.
      then: The judgement stands. Nothing more to do.
    - outcome: Changed
      meaning: The group places it at a different level, and can say which descriptor puts it there.
      then: >-
        The level on the record changes, with the reason. The assessor then rechecks every other
        judgement they made in that competency that rested on the same reading.
    - outcome: More evidence needed
      meaning: The evidence cannot support any level with confidence.
      then: >-
        At a formative session, the assessor gathers it in the next block of learning. At the
        summative session, the assessor looks for evidence that already exists - no new tasks - and
        if it is not there, the judgement is made on the evidence as it stands.
  recheck: >-
    One case each is a sample, not the whole cohort. What makes it count is the recheck. When a case
    is changed, the assessor goes back through their other judgements in that competency and asks
    whether they applied the reading the group just corrected. Anything that moves is recorded with a
    reason, and the facilitator sees the list before results are confirmed.
  records:
    - name: Case sheet
      who: Each assessor, one per session
      what: The case they are bringing - learner, competency, their level and reason, where they were least sure.
    - name: Moderation record
      who: The facilitator, one per session
      what: Every case taken, the levels shown blind, the decision and its reason, and the rechecks flagged.
    - name: Recheck list
      who: Each assessor whose case was changed
      what: Every judgement they rechecked, what moved, and why. Returned to the facilitator by the agreed date.
  trap: >-
    The session turns into the facilitator marking the cases while the educators watch. It feels
    efficient, and it teaches nobody anything: the next round of judgements will be no more
    consistent than the last. The moderation is in the blind judging and the argument. If the
    educators are not doing both, it is not happening.
  guide:
    label: Moderation Guide
    file: /downloads/lb-moderation-guide.docx
    format: Word
    note: >-
      How Learning Bridge+ moderation runs: who does what, the three sessions, choosing and preparing
      your case, a running order for the session, what a session can decide, and the recheck. With
      the case sheet, the moderation record and the recheck list to print. Editable.

sourceNotes:
  - Source is the "Learning Bridge Programme Overview for Delivery Partners" document.
  - Learning Bridge is component-based, not course-based; its components are not GSD Changemaker Courses, so streams and ongoingComponents are intentionally empty.
  - Grading, moderation, and formal assessment apply to Learning Bridge+ only.
  - The two assessed competencies (Investigate Real World Issues, Set and Pursue Goals) are named in the source but not yet cross-linked to framework competency codes.
  - >-
    The optional English Language Development component is delivered through the My Voice course guide
    (Unit 1 of the English for Impact programme; see courses/efi-my-voice.yaml), which is the ready-made
    resource for these 50 foundational hours. English for Impact is the onward pathway for learners who
    need to continue past this component toward B1. This mapping does not apply to the Cox's Bazar
    edition, whose low-literacy, oral/visual-first context needs a bespoke English adaptation instead.
