# Learning Bridge+ (Cox's Bazar) — a contextualised, fully offline edition of the Learning Bridge
# programme (spec §4.1 Programme; component-based shape, like learning-bridge.yaml).
#
# Context: authored for Amala's consultancy to the Norwegian Refugee Council (NRC) Bangladesh
# (Consultancy 8201056), adapting Learning Bridge+ as a READINESS / bridging programme for Rohingya
# youth in the Cox's Bazar refugee camps, preparing them to enter an accredited secondary pathway.
# Amala is the remote technical consultant; NRC leads implementation. Delivery is fully offline in
# Community Based Learning Facilities (CBLFs): assume no internet, and often no power or devices.
#
# This edition reuses the same competency framework and course objectives as Learning Bridge (the
# contextualisation is in delivery, sequencing, and materials, not in the objectives). It is being
# built component by component; the Agency in Learning component is authored first.
id: learning-bridge-coxs-bazar
slug: learning-bridge-coxs-bazar
access: public
title: "Learning Bridge+ (Cox's Bazar)"
shortName: "Learning Bridge+ Cox's Bazar"
tagline: >-
  A fully offline, contextualised edition of Learning Bridge+, preparing Rohingya youth in the
  Cox's Bazar refugee camps for entry into accredited secondary education.
summary: >-
  Learning Bridge+ (Cox's Bazar) is a contextualised edition of Amala's Learning Bridge programme,
  designed as a readiness bridge for Rohingya refugee youth preparing to enter an accredited
  secondary education pathway. It is delivered fully offline in Community Based Learning Facilities,
  with all resources supplied ready-made so facilitators need no internet to run it. The programme
  is authored for Amala's consultancy to the Norwegian Refugee Council (NRC), who lead delivery in
  the camps while Amala provides remote technical support. It keeps the components and competencies
  of Learning Bridge but rebuilds delivery for an offline setting, a largely pre-literate cohort,
  and the protection realities of the camps. The Agency in Learning component is authored first.
targetContext: >-
  Rohingya refugee youth in the Cox's Bazar camps, typically aged 14 to 24, who have completed
  non-formal education at around Grade 6 of the Myanmar curriculum and show the potential to
  progress to accredited secondary education but lack some of the competencies to do so. Most are
  below B1 English proficiency, many are not yet literate in any language, and schooling has been
  repeatedly interrupted. A proportion of places are for out-of-school adolescents facing
  intersecting barriers, with priority to the most marginalised. Delivery conditions are severe:
  Community Based Learning Facilities (often a room in a teacher's shelter), no internet, and often
  no reliable power or learner devices.
structure: >-
  The programme keeps the Learning Bridge components. The taught components — Research Project, Agency
  in Learning, and English Language Development — are each around 50 hours; in this edition English is
  compulsory, because the whole cohort enters below B1. Mentoring and Wellbeing runs alongside them as
  ongoing, regular 1:1 or small-group mentoring rather than a fixed block of hours. Each taught
  component runs at a cadence of 3 hours in-person plus 2 hours independent per week across a minimum
  of 10 weeks, with mentoring folded into that weekly in-person time. As the certificated (Learning Bridge+) tier, it includes diagnostic intake,
  a midpoint formative assessment, a summative exit assessment, and Amala moderation. The Agency in
  Learning component is authored and offline-ready first, followed by the English Language Development
  component (a Cox's Bazar contextualisation of the My Voice course); the Research Project is deferred
  until the shared local challenge is agreed with NRC and the community. All artefacts are supplied as
  editable files for facilitators, distributed offline.
ageRange: "14–24"
minDurationWeeks: 10
# Three taught components at ~50h each: Agency in Learning, Research Project, and English Language
# Development (compulsory in this edition). Mentoring and Wellbeing is ongoing, not a fixed block of
# hours, so it is not counted here.
totalStructuredHoursMin: 150

# Programme-level guides for the two roles that run it in the camps: the NRC coordinator and the
# facilitator/educator. Rendered as downloads near the top of the programme page; generated by
# scripts/downloads/generate-lb-guides.js. Fully offline, editable Word files.
downloads:
  - label: Coordinator Guide
    file: /downloads/lb-coxs-bazar-coordinator-guide.docx
    format: Word
    note: >-
      For the NRC programme coordinator. How to set up sites and facilitators, run the 12-week rhythm,
      schedule the week-6 supported and week-12 final assessments, and coordinate safeguarding and Amala
      moderation. Editable.
  - label: Educator Guide
    file: /downloads/lb-coxs-bazar-educator-guide.docx
    format: Word
    note: >-
      For facilitators. Your three roles — facilitate, mentor, assess — delivering offline and oral- and
      visual-first, and how the supported (week 6) and final (week 12) assessments of the two
      competencies work. Editable.

studentGains:
  - Self-directed learning habits, goal-setting, planning, tracking progress, and reflecting on growth, built to work for learners who are not yet reading fluently.
  - The foundational learning skills, including independent learning and study habits, needed to enter and sustain accredited secondary education.
  - A start on stronger English for learning and communication, dovetailed with the English Language Development component.
  - Confidence and a sense of agency over their own learning in a context where much else is outside their control.

# Components. Agency in Learning is authored and offline-ready; the others are noted with status.
components:
  - title: Agency in Learning
    summary: >-
      Authored and offline-ready. Students develop self-directed learning habits, reframed around
      learning goals within the learner's own control. Delivered oral and visual first, with a
      week-by-week unit plan, facilitator guide, and student workbook.
    structuredHours: 50
    facilitatedHours: 30
    independentHours: 20
    courseSlug: agency-in-learning
    deliveryOptions:
      - Fully offline (printed materials and editable files, distributed via USB or hard drive)
  - title: Research Project
    summary: >-
      Deferred. The Research Project is a single shared challenge for the whole cohort; the challenge
      will be agreed with NRC and the community before this component is contextualised and authored.
    structuredHours: 50
    facilitatedHours: 30
    independentHours: 20
    courseSlug: research-project
    deliveryOptions:
      - Fully offline (to be authored once the shared challenge is agreed)
  - title: Mentoring and Wellbeing
    summary: >-
      Ongoing 1:1 and small-group support for progress and wellbeing, with embedded psychosocial
      support and referral pathways appropriate to the camp context. Not a fixed block of hours: it
      runs throughout the programme as regular mentoring conversations, folded into the weekly
      in-person time.
    cadence: Ongoing · regular 1:1 or small-group sessions
    deliveryOptions:
      - Fully offline
  - title: English Language Development
    summary: >-
      Authored and offline-ready. A compulsory component in this edition — the whole cohort enters
      below B1, so every learner takes it. Delivered through a Cox's Bazar contextualisation of the My
      Voice course (English for Impact Unit 1), rebuilt as an oral and visual first, emergent-literacy
      course for a largely pre-literate cohort: learners begin from the sound of their own name, meet
      the alphabet and the first sounds and words of English, learn to say who they are in simple
      sentences, and make and share a personal "My Name, My Voice" card. Comes with a full week-by-week
      unit plan, and dovetails with the learning goals set in Agency in Learning. English progress is
      assessed formatively, against A1- Can-Do outcomes, not as one of the two formally graded
      competencies.
    structuredHours: 50
    facilitatedHours: 30
    independentHours: 20
    courseSlug: efi-my-voice
    deliveryOptions:
      - Fully offline (printed materials and editable files, distributed via USB or hard drive)

# Mentoring and Wellbeing component, contextualised. The shared practice lives in the mentor moves
# on /educators/mentoring; this block says how those moves are held in the camp context, and points
# to them by role area rather than duplicating them.
mentoring:
  intro: >-
    In this programme, 1:1 mentoring is the spine of wellbeing support: it is where a learner is known
    as a person, where distress is noticed early, and where the learning goals set in Agency in
    Learning are kept alive between sessions. Mentors here are not counsellors — they build the
    relationship, notice concerns, and refer along NRC's pathways. The shared practice is the mentor
    moves on the Educators pages; the notes below say how those moves are held in the Cox's Bazar
    context, where displacement, protection risks, and interrupted schooling shape every conversation.
  context:
    - title: Who mentors, and how learners are paired
      detail: >-
        NRC-recruited facilitators also hold the mentor role, with small caseloads so each learner is
        genuinely known. Plan for female mentors and same-gender pairing wherever girls' participation
        depends on it, and match language so a learner can speak freely in the language they use at home.
    - title: Cadence and format, fully offline
      detail: >-
        Mentoring is folded into the weekly in-person time as short 1:1 or very small-group
        conversations, with no devices and no internet. Mentors keep a light paper record of what they
        notice so each conversation builds on the last, and the rhythm is designed to survive stop-start
        attendance — you pick up where the learner is, not where the schedule says they should be.
    - title: Psychosocial support and referral
      detail: >-
        Mentoring is the first line when a learner is struggling, but the mentor's job is to notice,
        steady, and refer — not to counsel. Know NRC's MHPSS and protection referral pathway before you
        take a caseload, so that when something surfaces you already know who to hand it to and how.
    - title: Safeguarding and protection
      detail: >-
        All mentoring follows NRC's Code of Conduct and protection principles. No learner ever has to
        share; mentors are given clear step-back guidance for sensitive ground — loss, family, marriage,
        displacement — and the safeguarding moves never replace NRC's own policy and referral pathways.
  areas:
    - area: wellbeing
      contextNote: >-
        Belonging carries extra weight when so much else is precarious. Make a genuine check-in the
        start of every meeting, delivered orally in the learner's own language rather than as a written
        survey, and watch for withdrawal or a change in how "fine" sounds over the weeks.
    - area: safeguarding
      contextNote: >-
        Know NRC's safeguarding policy and the camp referral pathway before you mentor anyone.
        Disclosures here may involve protection risks common in displacement — child marriage, family
        separation, gender-based violence — so respond calmly, never promise secrecy, and refer.
    - area: progress
      contextNote: >-
        Mentoring keeps the learning goals set in Agency in Learning alive between sessions. Coach
        rather than rescue, but adapt to interrupted attendance: re-anchor the goal, break the next
        step down small, and treat a return after absence as progress, not a fresh start.
    - area: recognising-growth
      contextNote: >-
        Surface the skills learners are already using in camp life — caring for siblings, translating,
        running a stall, resolving disputes — and capture that growth orally and visually, since many
        learners are not yet literate. This evidence feeds the Set and Pursue Goals assessment.
    - area: pathways
      contextNote: >-
        Reframe "futures" around what is in reach: the near-term pathway is readiness for the accredited
        secondary programme, not futures that are currently blocked. Keep pathways conversations honest
        and hopeful, focused on the next controllable step.

# What it takes to deliver, and how this edition differs from generic Learning Bridge.
delivery:
  - title: How this edition is contextualised
    detail: >-
      Three things are rebuilt for this context. Delivery is oral and visual first, because most
      learners are not yet literate in any language: facilitators deliver in the language they use
      with learners, from materials written in plain English, and learners draw, colour, and speak
      rather than read and write. Goal-setting is reframed around near-term learning goals within the
      learner's own control, rather than futures that are currently blocked, and sensitive ground is
      handled with explicit safeguarding guidance. Sessions are modular and self-contained, so
      stop-start attendance never breaks the sequence.
  - title: Fully offline delivery
    detail: >-
      No part of delivery assumes the internet. All resources are supplied ready-made and distributed
      physically (USB or hard drive), including any secondary resources. Materials are supplied as
      editable files so facilitators can adapt them to their group.
  - title: Facilitators and learning spaces
    detail: >-
      Delivery is in Community Based Learning Facilities, often a room in a teacher's shelter, by
      NRC-recruited facilitators trained by Amala (remotely, plus a pre-rollout session). Materials
      are designed to be run by facilitators with limited training, carried by strong say-aloud
      guidance rather than assumed subject expertise. Plan for female facilitators and same-gender
      grouping where girls' participation depends on it.
  - title: Safeguarding and protection
    detail: >-
      Safeguarding is built into every activity that could surface loss, family, marriage, or
      displacement: no learner has to share, and facilitators are given clear step-back and referral
      guidance. Delivery follows NRC's Code of Conduct and protection principles.

support:
  - title: Amala's role
    detail: >-
      Amala is the remote technical consultant to NRC: it contextualises the curriculum, supplies
      ready-made offline resources, trains facilitators and the programme coordinator, and moderates
      assessment. NRC leads implementation, recruits and manages facilitators, and delivers in the
      camps.
  - title: Resources
    detail: >-
      Ready-made, editable, fully offline resources for each authored component: a week-by-week unit
      plan that carries the facilitator guidance inline, a student workbook, and optional slides for
      the minority of sites with a screen.

# Grading applies as the certificated Learning Bridge+ tier.
grading:
  intro: >-
    As the Learning Bridge+ tier, students are formally assessed in two competencies against Amala's
    Proficiency Scale, supporting the readiness decision for transition to accredited secondary
    education. Assessment rests on educator judgement across varied evidence, with case-based
    moderation.
  assessedCompetencies:
    - title: Set and Pursue Goals
      description: >-
        The ability to establish clear objectives for learning and growth and take deliberate steps
        to make progress towards them. Developed and demonstrated through the Agency in Learning
        component.
    - title: Investigate Real World Issues
      description: >-
        The ability to conduct primary and secondary research into challenges affecting people and
        the planet to develop actionable insights. Developed through the Research Project component
        (deferred in this edition until the shared challenge is agreed).
  scale:
    - grade: Pass
      requirement: Practitioner in both competencies.
    - grade: Merit
      requirement: Reflective Practitioner in one competency, Practitioner in the other.
    - grade: Distinction
      requirement: Reflective Practitioner in both competencies.
  note: >-
    The programme's headline success measure, agreed with NRC, is that at least 70% of learners who
    complete the programme demonstrate the competencies required to enrol in the accredited secondary
    education pathway, as measured by the summative exit assessment.

sourceNotes:
  - Contextualised edition of the Learning Bridge programme (see programmes/learning-bridge.yaml); components and competencies are shared, delivery and sequencing are rebuilt for the Cox's Bazar context.
  - Authored for Amala's consultancy to the Norwegian Refugee Council (NRC) Bangladesh, Consultancy 8201056 (Aug–Dec 2026). Amala is the remote technical consultant; NRC leads implementation.
  - Context and delivery constraints are drawn from the NRC Terms of Reference and a commissioned context briefing on Rohingya youth in Cox's Bazar (literacy, language, protection, and funding realities).
  - Being built component by component; the Agency in Learning component is authored first, then the English Language Development component (a fully offline, emergent-literacy contextualisation of the My Voice course; see units/coxs-bazar-my-voice.yaml and the cb-mv-* materials). Research Project is deferred until the shared local challenge is agreed.
  - My Voice is contextualised for this edition as emergent literacy, not literacy transfer - it assumes no prior reading in any language and is delivered oral and visual first - because the source English for Impact course assumes strong Home-Language literacy and is unsuitable as-is for this cohort.
