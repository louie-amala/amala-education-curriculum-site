# Learning Bridge+ (Cox's Bazar) - a contextualised, fully offline edition of the Learning Bridge
# programme (spec §4.1 Programme; component-based shape, like learning-bridge.yaml).
#
# Context: authored for Amala's consultancy to the Norwegian Refugee Council (NRC) Bangladesh
# (Consultancy 8201056), adapting Learning Bridge+ as a READINESS / bridging programme for Rohingya
# youth in the Cox's Bazar refugee camps, preparing them to enter an accredited secondary pathway.
# Amala is the remote technical consultant; NRC leads implementation. Delivery is fully offline in
# Community Based Learning Facilities (CBLFs): assume no internet, and often no power or devices.
#
# This edition reuses the same competency framework and course objectives as Learning Bridge (the
# contextualisation is in delivery, sequencing, and materials, not in the objectives). It is being
# built component by component; the Agency in Learning component is authored first.
id: learning-bridge-coxs-bazar
slug: learning-bridge-coxs-bazar
access: partner
title: "Learning Bridge+ (Cox's Bazar)"
shortName: "Learning Bridge+ Cox's Bazar"
tagline: >-
  A fully offline, contextualised edition of Learning Bridge+, preparing Rohingya youth in the
  Cox's Bazar refugee camps for entry into accredited secondary education.
summary: >-
  Learning Bridge+ (Cox's Bazar) is a contextualised edition of Amala's Learning Bridge programme,
  designed as a readiness bridge for Rohingya refugee youth preparing to enter an accredited
  secondary education pathway. It is delivered fully offline in Community Based Learning Facilities,
  with all resources supplied ready-made so facilitators need no internet to run it. The programme
  is authored for Amala's consultancy to the Norwegian Refugee Council (NRC), who lead delivery in
  the camps while Amala provides remote technical support. It keeps the components and competencies
  of Learning Bridge but rebuilds delivery for an offline setting, a largely pre-literate cohort,
  and the protection realities of the camps. The Agency in Learning component is authored first.
targetContext: >-
  Rohingya refugee youth in the Cox's Bazar camps, typically aged 14 to 24, who have completed
  non-formal education at around Grade 6 of the Myanmar curriculum and show the potential to
  progress to accredited secondary education but lack some of the competencies to do so. Most are
  below B1 English proficiency, many are not yet literate in any language, and schooling has been
  repeatedly interrupted. A proportion of places are for out-of-school adolescents facing
  intersecting barriers, with priority to the most marginalised. Delivery conditions are severe:
  Community Based Learning Facilities (often a room in a teacher's shelter), no internet, and often
  no reliable power or learner devices.
structure: >-
  The programme keeps the Learning Bridge components. The taught components - Research Project, Agency
  in Learning, and English Language Development - are each around 50 hours; in this edition English is
  compulsory, because the whole cohort enters below B1. Mentoring and Wellbeing runs alongside them as
  ongoing 1:1 mentoring rather than a fixed block of hours, and has its own unit plan and offline pack. Each taught
  component runs at a cadence of 3 hours in-person plus 2 hours independent per week across a minimum
  of 10 weeks, with mentoring folded into that weekly in-person time. As the certificated (Learning Bridge+) tier, it includes diagnostic intake,
  a midpoint formative assessment, a summative exit assessment, and Amala moderation. The Agency in
  Learning component is authored and offline-ready first, followed by the English Language Development
  component (a Cox's Bazar contextualisation of the My Voice course) and the Research Project, whose
  shared local challenge - the trees on the hills where learners live - is now set. All artefacts are
  supplied as editable files for facilitators, distributed offline.
ageRange: "14–24"
minDurationWeeks: 10
# Three taught components at ~50h each: Agency in Learning, Research Project, and English Language
# Development (compulsory in this edition). Mentoring and Wellbeing is ongoing, not a fixed block of
# hours, so it is not counted here.
totalStructuredHoursMin: 150

# Programme-level guides for the two roles that run it in the camps: the NRC coordinator and the
# facilitator/educator. Rendered as downloads near the top of the programme page; generated by
# scripts/downloads/generate-lb-guides.js. Fully offline, editable Word files.
downloads:
  - label: Coordinator Guide
    file: /downloads/lb-coxs-bazar-coordinator-guide.docx
    format: Word
    note: >-
      For the NRC programme coordinator. How to set up sites and facilitators, run the 12-week rhythm,
      schedule the week-6 supported and week-12 final assessments, and coordinate safeguarding and Amala
      moderation. Editable.
  - label: Trainer Guide - inducting the facilitators
    file: /downloads/lb-coxs-bazar-trainer-guide.docx
    format: Word
    note: >-
      For NRC's master educators, who induct the facilitators before a cohort starts. What induction
      covers and what it deliberately does not, a shape for each of the two inductions, how you know a
      facilitator is ready, the record, and what to do when someone joins mid-cohort. Editable.
  - label: Educator Guide - the complete manual
    file: /downloads/lb-coxs-bazar-educator-guide.docx
    format: Word
    note: >-
      Everything a facilitator needs, in one document. Part 1–3: your three roles, how to deliver offline
      and oral- and visual-first, what a week could look like, the week-by-week map, mentoring and
      safeguarding, and how the supported (week 6) and final (week 12) assessments work. Parts 4–6: the
      full facilitator unit plan for all three taught components. Parts 7–9: the three learner books, the
      printable cards, and the two assessment records. The component packs below are the same content
      split into separate files, for when you only need one piece. Editable.
  - label: My Learning Book - the Agency in Learning learner book
    file: /downloads/agency-in-learning-student-workbook.docx
    format: Word
    note: >-
      The learner book for Agency in Learning on its own, if you are printing the three components
      separately rather than as one book. Opens with a numbered list of its sheets - the facilitator
      plan points into it by sheet number. Print one per learner. Editable.
  - label: My Voice book - the English learner book
    file: /downloads/my-voice-student-workbook.docx
    format: Word
    note: >-
      The learner book for English on its own. Opens with a numbered list of its sheets, which is how
      the facilitator plan refers to them. Print one per learner. Editable.
  - label: Our Research Book - the Research Project learner book
    file: /downloads/research-project-student-workbook.docx
    format: Word
    note: >-
      The learner book for the Research Project on its own - the Learn it pages, the source cards, the
      evidence log and the analysis pages. Opens with a numbered list of its sheets. Print one per
      learner. Editable.
  - label: English assessment - the BASELINE paper
    file: /downloads/cb-en-check-baseline.docx
    format: Word
    note: >-
      The English assessment itself, sat in the first session before any teaching. One paper for the
      whole class in three parts - Reading, Writing, and an optional Speaking section. Print one per
      learner and write each learner's own name into it beforehand; three tasks depend on it. Contains
      no answers. Editable.
  - label: English assessment - the ENDLINE paper
    file: /downloads/cb-en-check-endline.docx
    format: Word
    note: >-
      The same assessment sat in the final week - the same tasks in the same order with different
      content, so nobody sits the same questions twice. Comparing the two is what shows whether English
      improved. Print one per learner. Contains no answers. Editable.
  - label: English assessment - marking pack (answers)
    file: /downloads/cb-en-check-marking-pack.docx
    format: Word
    note: >-
      The answer keys and tick-box schemes for both papers. For the facilitator only - never print it
      into a learner's paper and never leave it where learners can read it, because they sit the same
      tasks again at the end. Editable.
  - label: English assessment - the complete guide
    file: /downloads/cb-en-check-guide.docx
    format: Word
    note: >-
      How to run the baseline and endline. Part A is the coordinator's - what to print, the record
      spreadsheet, and how to read and report the results; Part B is the facilitator's - running it,
      marking it, and what to do with what it shows. Written for someone who does not know the CEFR.
      Editable.
  - label: English assessment - class record spreadsheet
    file: /downloads/cb-en-check-record-sheet.csv
    format: Spreadsheet
    note: >-
      Open in Excel or Google Sheets. Enter the raw scores only; the CEFR level and the change between
      the two sittings calculate themselves. Reading, writing and speaking have their own columns and
      are never averaged.
  - label: English assessment - learner profile sheet
    file: /downloads/cb-en-check-learner-profile.docx
    format: Word
    note: >-
      One per learner, given to them at the end of the course and read through together. "I can"
      statements in plain language, and four lines for the learner to name their own growth. Editable.
  - label: Student Workbook - one book per learner
    file: /downloads/lb-coxs-bazar-student-workbook.docx
    format: Word
    note: >-
      Everything a learner needs for the whole twelve weeks, in one book to print and bind - so a site
      runs one print job per learner instead of three. Parts 1–3 are the three component learner books
      (My Learning Book, the My Voice book, Our Research Book); Part 4 is the learner's mentoring page and
      the growth self-check they fill at week 6 and again at week 12. Oral- and visual-first throughout:
      drawing, marking and speaking are full answers. The group cards are not in it - they are one set per
      group, printed and cut up, so they stay in the Educator Guide and the component packs. Editable.


# ---- Who is qualified to deliver this ------------------------------------------------------------
# Two different things, deliberately kept apart. The modules are PORTABLE - held by the person and
# carried to whatever they deliver next. The inductions are PROGRAMME-SPECIFIC - this programme's
# tools, records, cadence and rules - and transfer nowhere. Together they are what an NRC facilitator
# needs before they run a cohort.
#
# The inductions are being planned now, one owner each, by NRC's master educators. Until each one is
# authored, this block is the brief they plan from - see docs/NRC-MASTER-EDUCATOR-WORKSHOP-PLAN.md.
qualification:
  intro: >-
    A facilitator is ready to deliver Learning Bridge+ in Cox's Bazar when they hold the training
    modules below and have completed the programme inductions. The modules are portable: an educator
    who holds Being a mentor holds it wherever they go next. The inductions are specific to this
    programme and this context, and do not transfer.
  requiredModules:
    - introduction-to-tem
    - safeguarding
    - designing-facilitating-group-learning
    - being-a-mentor
    - teaching-english-second-language
    - conducting-assessments
  inductionSummary: >-
    Two inductions, delivered by NRC's master educators, who are qualified to train through Amala's
    train-the-trainer module. Each has one named owner planning it. They are deliberately short: the
    craft of facilitating, mentoring and assessing is carried by the portable modules above, which a
    facilitator holds before induction begins, and the Educator Guide carries the component detail -
    so induction covers only what does not transfer. Two things sit outside it and belong to the
    coordinator: NRC's Code of Conduct, and the camp MHPSS and protection referral pathway, made
    concrete at each site before any facilitator takes a mentoring caseload.
  inductions:
    - id: IND-1
      title: The programme, your three roles, and the Educator Guide
      hours: "3-4 hrs"
      reviews: "The Educator Guide, all nine parts - read in the room, not beforehand"
      note: >-
        What the programme is for, the agency thread, the four components, the two assessed
        competencies, and the weekly rhythm - 3 hours in person plus 2 independent, across at least
        10 weeks. Then the Educator Guide itself: what is in each of its nine parts, protected time to
        read it, and the questions that come out of reading it.
      purpose: >-
        A facilitator can say what Learning Bridge+ is for, name what it is ultimately building, run
        the weekly rhythm without asking anyone, and find anything they need in the Educator Guide.
      able:
        - >-
          Say what the programme is for in their own words - a young person leaves with more agency
          than they came with - and name the four components.
        - "Name the two formally assessed competencies: Set and Pursue Goals, and Investigate Real World Issues."
        - >-
          Describe the week: 3 hours in person plus 2 independent, across a minimum of 10 weeks, with
          mentoring folded into the in-person time.
        - Say what is in each of the nine parts of the Educator Guide, and find anything in it inside a minute.
        - Run a block straight from the facilitator unit plan, using only what is printed.
        - Use the learner book by sheet number - the plan points into it that way.
        - Say what NRC does and what Amala does, including what moderation is and when it happens.
      drawsOn:
        - The Educator Guide - Part 1 for the agency thread and the three roles, Parts 4-6 for the unit plans, Parts 7-8 for the learner books and cards
        - The programme page on the Amala site
      trap: >-
        The easy version of this is a briefing about Amala, followed by "read the guide at home".
        Nobody reads it at home. The reading happens in the room, on the clock, and every block ends
        with something the facilitator can do on their first Monday.
    - id: IND-2
      title: Assessment on Learning Bridge+
      hours: "3-4 hrs"
      reviews: "Educator Guide Part 9 - the two assessment records - and the Proficiency Scale"
      note: >-
        Judging the two assessed competencies against the Proficiency Scale at the week-6 supported
        and week-12 final points, completing the records, the Pass / Merit / Distinction boundaries,
        and bringing a case to Amala moderation.
      purpose: >-
        A facilitator can judge the two assessed competencies against the Proficiency Scale at week 6
        and week 12, complete the records, and bring a case to moderation.
      able:
        - Name the two assessed competencies and say where the evidence for each actually comes from in the programme.
        - Place a real piece of learner evidence on the Proficiency Scale, and say why it sits there rather than one step up.
        - Say what is different about the week-6 supported assessment and the week-12 final one.
        - Complete the assessment record for a learner.
        - Explain the grade boundaries - Pass, Merit, Distinction - and what a learner has to show for each.
        - Bring a case to Amala moderation and defend a judgement, or change it.
      drawsOn:
        - Educator Guide Part 9 (the two assessment records)
        - The Proficiency Scale
        - "The programme's grading block: Pass / Merit / Distinction"
        - MOD-C, Conducting assessments of competence, for the underlying craft
      trap: >-
        Teaching the scale as vocabulary. Facilitators have to judge real or realistic evidence in the
        room, and disagree with each other about it. The disagreement is the training - not the slide
        that resolves it.

agencyThread:
  statement: >-
    Everything in this programme serves one outcome: that a young person leaves it with more agency
    for positive change than they arrived with - more ability and will to make informed, intentional
    decisions that improve their own life and contribute to their community. Readiness for accredited
    secondary education is the near-term form that agency takes here. It is the door this programme is trying to open, not the whole of what it is for.
  inThisProgramme: >-
    Agency is hard-won in a camp, because so much of a young person's life is decided by other people.
    That is why this edition reframes goal-setting around what is genuinely within a learner's
    control, and why it never asks a learner to plan for futures that are currently blocked. The three
    taught components each take one part of the work - deciding and pursuing (Agency in Learning),
    being understood and being heard (English), and understanding a real challenge well enough to act
    on it (Research Project) - and mentoring is what holds the three together in one person's life
    across the twelve weeks. None of the four builds agency on its own; the programme is designed so
    that the same learner does all four at once.
  byComponent:
    - component: Agency in Learning
      indicators:
        - power-over-wellbeing-and-self-direction
        - control-of-future-pathways
      how: >-
        This is where a learner discovers that at least one thing - what they learn - is theirs to
        direct. They run a full cycle on a goal they chose: understanding themselves as a learner,
        setting the goal, planning and taking real steps, using feedback, and seeing how far they came.
        That is self-direction made concrete. It reaches into pathways because the learner leaves with
        a method they can point at any next step, and with evidence that their effort changed something -
        which is what makes a future feel actionable rather than assigned.
    - component: English Language Development
      indicators:
        - control-of-future-pathways
        - power-over-wellbeing-and-self-direction
        - contribution-to-community
      how: >-
        Voice is the precondition for agency: you cannot act on a world you cannot be understood in.
        Starting from the sound of their own name, learners gain the English to say who they are, and
        the confidence to say it to someone new. That is pathways in the most literal sense - English
        below B1 is the specific barrier standing between this cohort and an accredited secondary
        place. It is self-direction because learners choose who to practise with and what to say about
        themselves, and it reaches into community because a learner who can introduce themselves and
        others can speak for people who cannot yet.
    - component: Research Project
      indicators:
        - contribution-to-community
        - control-of-future-pathways
        - power-over-wellbeing-and-self-direction
      how: >-
        You cannot act well on a challenge you do not understand. Learners investigate something real
        about the place they live, and produce evidence-based insight they share with an audience they
        chose - which is itself a contribution to their community, not a rehearsal for one. It builds
        self-direction because it replaces "what people say" with "what we found out", and pathways
        because investigating is a transferable move: a learner who has done it once on the hills can
        do it on anything that matters to them next.
    - component: Mentoring and Wellbeing
      indicators:
        - power-over-wellbeing-and-self-direction
        - control-of-future-pathways
        - contribution-to-community
      how: >-
        Mentoring is the only place all three indicators are held together, in one learner's life,
        across the whole twelve weeks. It is where the goal set in Agency in Learning stays alive
        between sessions, where a learner is helped to notice and name their own state rather than
        only endure it, where the skills they already use in camp life - caring for siblings,
        translating, resolving disputes - are surfaced and recognised as capability, and where the
        next step towards a pathway is kept honest and near-term. Without it the three taught
        components are three courses; with it they are one person's development.
  # FSL2 and FSI1 only: these are the two competencies formally graded on Learning Bridge+. English
  # develops FUS1 and is assessed formatively, so it is deliberately not listed here - a third row
  # reads as a third thing to assess. Rendered in the guides beside the assessment guidance rather
  # than in the "what this is for" section, where competency codes arrive before they mean anything.
  byCompetency:
    - code: FSL2
      indicators:
        - power-over-wellbeing-and-self-direction
        - control-of-future-pathways
      how: >-
        Set and pursue goals is the engine of agency: agency is only real when a learner can decide
        what they want to grow towards and take deliberate steps to get there. Developing it moves a
        learner from having things decided for them to deciding one thing and following it through -
        the smallest complete unit of self-direction there is. Because the method transfers, it is also
        how a learner takes hold of a pathway rather than waiting to be placed on one.
    - code: FSI1
      indicators:
        - contribution-to-community
        - power-over-wellbeing-and-self-direction
      how: >-
        Investigate real-world issues turns concern into understanding you can act on: it replaces
        assumption with evidence. Developing it gives a learner a way to find out for themselves
        instead of accepting what they are told - and when they produce evidence-based insight about a
        challenge in their own community and share it, they have already made an impactful
        contribution, at whatever scale they could manage.
  howWeSeeIt:
    - >-
      The two graded competencies are the formal measure, but they are not the whole of it. Agency
      shows in things a scale does not capture: a learner who asks for help without being prompted, who
      picks a plan back up after a week indoors, who chooses to share when they were not going to, who
      speaks English to someone outside the learning space.
    - >-
      The learner's own growth self-check, marked once in the middle and once at the end, carries one
      plain question per indicator, answerable by drawing, marking or speaking. That is the record that
      works for a cohort that is largely not yet literate.
    - >-
      Mentors notice it first and notice it earliest, because they see the same learner across all
      three components. A light paper note of what a mentor saw is legitimate evidence, and it is often
      the strongest evidence there is.
    - >-
      Do not turn this into another thing to assess. Agency is what the programme is FOR; the two
      competency judgements are how it is graded. Recording movement in agency informs the readiness
      picture and NRC's reporting - it is not a third grade.

studentGains:
  - Self-directed learning habits, goal-setting, planning, tracking progress, and reflecting on growth, built to work for learners who are not yet reading fluently.
  - The foundational learning skills, including independent learning and study habits, needed to enter and sustain accredited secondary education.
  - A start on stronger English for learning and communication, dovetailed with the English Language Development component.
  - Confidence and a sense of agency over their own learning in a context where much else is outside their control.

# Components. Agency in Learning is authored and offline-ready; the others are noted with status.
components:
  - title: Agency in Learning
    summary: >-
      Authored and offline-ready. Students develop self-directed learning habits, reframed around
      learning goals within the learner's own control. Delivered oral and visual first, with a
      week-by-week unit plan, facilitator guide, and student workbook.
    structuredHours: 50
    facilitatedHours: 30
    independentHours: 20
    courseSlug: agency-in-learning
    deliveryOptions:
      - Fully offline (printed materials and editable files, distributed via USB or hard drive)
  - title: Research Project
    summary: >-
      Authored and offline-ready. The whole cohort investigates one shared local challenge - what is
      happening to the trees on the hills where they live - from a research question they are given, and
      turns the evidence they gather into insights they share. Secondary research is done from a supplied,
      graded source pack because there is no internet. Each step is taught before it is done: the learner's
      research book carries a "Learn it" page ahead of every working page, and the facilitator unit plan
      carries the subject knowledge to teach it.
    structuredHours: 50
    facilitatedHours: 30
    independentHours: 20
    courseSlug: research-project
    deliveryOptions:
      - Fully offline (printed materials and editable files, distributed via USB or hard drive)
  - title: Mentoring and Wellbeing
    summary: >-
      Authored and offline-ready. Ongoing 1:1 support for progress and wellbeing, with embedded
      psychosocial support and referral pathways appropriate to the camp context. Not a fixed block of
      hours: about ten minutes per learner most weeks, folded into the in-person time the taught
      components already use, so it adds nothing to the timetable. It comes with a full unit plan built
      as an arc rather than a sequence - getting known, keeping the goal alive, the week-6 checkpoint,
      surfacing growth, and an honest closing conversation - plus a fixed ten-minute conversation shape,
      safeguarding and referral guidance, a mentor's record, and an optional three-way meeting between a
      mentor, a learner and an adult the learner chooses.
    cadence: Ongoing · about 10 minutes per learner, most weeks
    deliveryOptions:
      - Fully offline (printed materials and editable files, distributed via USB or hard drive)
  - title: English Language Development
    summary: >-
      Authored and offline-ready. A compulsory component in this edition - the whole cohort enters
      below B1, so every learner takes it. Delivered through a Cox's Bazar contextualisation of the My
      Voice course (English for Impact Unit 1), rebuilt as an oral and visual first, emergent-literacy
      course for a largely pre-literate cohort: learners begin from the sound of their own name, meet
      the alphabet and the first sounds and words of English, learn to say who they are in simple
      sentences, and make and share a personal "My Name, My Voice" card. Comes with a full week-by-week
      unit plan, and dovetails with the learning goals set in Agency in Learning. English progress is
      assessed formatively, against A1- Can-Do outcomes, not as one of the two formally graded
      competencies. Alongside that, the English Check (materials/cb-en-check) measures proficiency
      itself - a 45-minute offline reading, writing and speaking check taken once before teaching
      starts and once in the final week, reported as three separate steps on a scale running from
      below-A1 to B1, so a site can show whether English measurably improved.
    structuredHours: 50
    facilitatedHours: 30
    independentHours: 20
    courseSlug: efi-my-voice
    deliveryOptions:
      - Fully offline (printed materials and editable files, distributed via USB or hard drive)

# Mentoring and Wellbeing component, contextualised. The shared practice lives in the mentor moves
# on /educators/mentoring; this block says how those moves are held in the camp context, and points
# to them by role area rather than duplicating them.
mentoring:
  intro: >-
    In this programme, 1:1 mentoring is the spine of wellbeing support: it is where a learner is known
    as a person, where distress is noticed early, and where the learning goals set in Agency in
    Learning are kept alive between sessions. Mentors here are not counsellors - they build the
    relationship, notice concerns, and refer along NRC's pathways. The shared practice is Amala's mentor moves, carried in full in the mentoring guide that ships
    with this programme; the notes below say how those moves are held in the Cox's Bazar context, where displacement, protection risks, and interrupted schooling shape every conversation.
  context:
    - title: Who mentors, and how learners are paired
      detail: >-
        NRC-recruited facilitators also hold the mentor role, with small caseloads so each learner is
        genuinely known. Plan for female mentors and same-gender pairing wherever girls' participation
        depends on it, and match language so a learner can speak freely in the language they use at home.
    - title: Cadence and format, fully offline
      detail: >-
        Mentoring is folded into the weekly in-person time as short 1:1 or very small-group
        conversations, with no devices and no internet. Mentors keep a light paper record of what they
        notice so each conversation builds on the last, and the rhythm is designed to survive stop-start
        attendance - you pick up where the learner is, not where the schedule says they should be.
    - title: Psychosocial support and referral
      detail: >-
        Mentoring is the first line when a learner is struggling, but the mentor's job is to notice,
        steady, and refer - not to counsel. Know NRC's MHPSS and protection referral pathway before you
        take a caseload, so that when something surfaces you already know who to hand it to and how.
    - title: Safeguarding and protection
      detail: >-
        All mentoring follows NRC's Code of Conduct and protection principles. No learner ever has to
        share; mentors are given clear step-back guidance for sensitive ground - loss, family, marriage,
        displacement - and the safeguarding moves never replace NRC's own policy and referral pathways.
  areas:
    - area: wellbeing
      contextNote: >-
        Belonging carries extra weight when so much else is precarious. Make a genuine check-in the
        start of every meeting, delivered orally in the learner's own language rather than as a written
        survey, and watch for withdrawal or a change in how "fine" sounds over the weeks.
    - area: safeguarding
      contextNote: >-
        Know NRC's safeguarding policy and the camp referral pathway before you mentor anyone.
        Disclosures here may involve protection risks common in displacement - child marriage, family
        separation, gender-based violence - so respond calmly, never promise secrecy, and refer.
    - area: progress
      contextNote: >-
        Mentoring keeps the learning goals set in Agency in Learning alive between sessions. Coach
        rather than rescue, but adapt to interrupted attendance: re-anchor the goal, break the next
        step down small, and treat a return after absence as progress, not a fresh start.
    - area: recognising-growth
      contextNote: >-
        Surface the skills learners are already using in camp life - caring for siblings, translating,
        running a stall, resolving disputes - and capture that growth orally and visually, since many
        learners are not yet literate. This evidence feeds the Set and Pursue Goals assessment.
    - area: pathways
      contextNote: >-
        Reframe "futures" around what is in reach: the near-term pathway is readiness for the accredited
        secondary programme, not futures that are currently blocked. Keep pathways conversations honest
        and hopeful, focused on the next controllable step.

# What it takes to deliver, and how this edition differs from generic Learning Bridge.
delivery:
  - title: How this edition is contextualised
    detail: >-
      Three things are rebuilt for this context. Delivery leads with speaking and pictures, because many learners are at an early stage of
      literacy in any language and a group will hold a range: facilitators deliver in the
      language they use with learners, from materials written in plain English, and learners
      can answer by drawing, marking or speaking as well as by writing. How far to lean on
      that is the facilitator's judgement, made on the group in front of them rather than on
      an assumption about the cohort. Goal-setting is reframed around near-term learning goals within the
      learner's own control, rather than futures that are currently blocked, and sensitive ground is
      handled with explicit safeguarding guidance. Sessions are modular and self-contained, so
      stop-start attendance never breaks the sequence.
  - title: Fully offline delivery
    detail: >-
      No part of delivery assumes the internet. All resources are supplied ready-made and distributed
      physically (USB or hard drive), including any secondary resources. Materials are supplied as
      editable files so facilitators can adapt them to their group.
  - title: Facilitators and learning spaces
    detail: >-
      Delivery is in Community Based Learning Facilities, often a room in a teacher's shelter, by
      NRC-recruited facilitators, inducted by NRC's own master educators. Materials
      are designed to be run by facilitators with limited training, carried by strong say-aloud
      guidance rather than assumed subject expertise. Plan for female facilitators and same-gender
      grouping where girls' participation depends on it.
  - title: Safeguarding and protection
    detail: >-
      Safeguarding is built into every activity that could surface loss, family, marriage, or
      displacement: no learner has to share, and facilitators are given clear step-back and referral
      guidance. Delivery follows NRC's Code of Conduct and protection principles.

support:
  - title: Amala's role
    detail: >-
      Amala is the remote technical consultant to NRC: it contextualises the curriculum, supplies
      ready-made offline resources, trains NRC's master educators and the programme coordinator, and
      moderates assessment. Amala does not train facilitators directly and does not deliver in the
      camps: NRC's master educators induct the facilitators, and NRC leads implementation, recruits and
      manages facilitators, and delivers.
  - title: Resources
    detail: >-
      Ready-made, editable, fully offline resources. The Educator Guide is the single document a
      facilitator delivers from: it carries the full unit plan for every component, the learner books,
      the printable cards, and the assessment records inside it. The same content is also supplied as
      separate per-component files. There are no slides: the pack assumes no screen, and every activity
      is written to run from paper, a wall, and your voice.

# Grading applies as the certificated Learning Bridge+ tier.
grading:
  intro: >-
    As the Learning Bridge+ tier, students are formally assessed in two competencies against Amala's
    Proficiency Scale, supporting the readiness decision for transition to accredited secondary
    education. Assessment rests on educator judgement across varied evidence, with case-based
    moderation.
  assessedCompetencies:
    - title: Set and Pursue Goals
      description: >-
        The ability to establish clear objectives for learning and growth and take deliberate steps
        to make progress towards them. Developed and demonstrated through the Agency in Learning
        component.
    - title: Investigate Real World Issues
      description: >-
        The ability to conduct primary and secondary research into challenges affecting people and
        the planet to develop actionable insights. Developed through the Research Project component
        (authored in this edition around the shared challenge of the trees on the hills where
        learners live).
  scale:
    - grade: Pass
      requirement: Practitioner in both competencies.
    - grade: Merit
      requirement: Reflective Practitioner in one competency, Practitioner in the other.
    - grade: Distinction
      requirement: Reflective Practitioner in both competencies.
  note: >-
    The programme's headline success measure, agreed with NRC, is that at least 70% of learners who
    complete the programme demonstrate the competencies required to enrol in the accredited secondary
    education pathway, as measured by the summative exit assessment.

sourceNotes:
  - Contextualised edition of the Learning Bridge programme (see programmes/learning-bridge.yaml); components and competencies are shared, delivery and sequencing are rebuilt for the Cox's Bazar context.
  - Authored for Amala's consultancy to the Norwegian Refugee Council (NRC) Bangladesh, Consultancy 8201056 (Aug–Dec 2026). Amala is the remote technical consultant; NRC leads implementation.
  - Context and delivery constraints are drawn from the NRC Terms of Reference and a commissioned context briefing on Rohingya youth in Cox's Bazar (literacy, language, protection, and funding realities).
  - Being built component by component; the Agency in Learning component is authored first, then the English Language Development component (a fully offline, emergent-literacy contextualisation of the My Voice course; see units/coxs-bazar-my-voice.yaml and the cb-mv-* materials), then the Research Project (see units/coxs-bazar-research-project.yaml and the cb-rp-* materials), built around the shared challenge of the trees on the hills where learners live.
  - My Voice is contextualised for this edition as emergent literacy, not literacy transfer - it assumes no prior reading in any language and is delivered oral and visual first - because the source English for Impact course assumes strong Home-Language literacy and is unsuitable as-is for this cohort.
