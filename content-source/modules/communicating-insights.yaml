# Skill module 5 of the "Investigating real-world issues" competency module.
id: mod-communicating-insights
slug: communicating-insights
access: public
grain: skill
title: Communicating insights
competencyCode: FSI1
parentModuleSlug: investigating-real-world-issues
skill:
  label: Communicate actionable insights to an audience
  description: >-
    Make insight usable by others — structuring findings into a clear, evidence-based account,
    choosing a format that fits the audience, and presenting so people can act on what was found.
summary: >-
  Closing the loop: turning an investigation into something an audience can understand and act on — a
  report, poster, presentation, or short video — and standing behind it.
agencyNote: >-
  Insight only becomes change when others can act on it. Communicating findings to peers and
  community members is how a learner's research contributes back to the community it came from.
anchorContribution:
  develops: >-
    Learners develop the communicative dimension of FSI1 — making insight usable by others — by
    structuring findings into a clear, evidence-based account and tailoring it to a specific audience.
  demonstrates: >-
    Assess this from a finished research output — a report, poster, infographic, presentation, or
    short video — shared with a real audience, plus how the learner fields questions about it. Look
    for findings structured as a clear, evidence-based account, a format and language matched to the
    audience, and answers that stand behind the method and evidence when questioned.
# Other competencies (from Research Project objective 4).
competencyDevelopment:
  - code: FLC3
    how: >-
      Communicating findings in a way that generates interest and understanding builds and shows
      influential communication.
  - code: FPS1
    how: >-
      Adapting how the findings are presented to suit different audiences builds and shows adaptable
      thinking.
  - code: FSL1
    how: >-
      Reflecting on the research process — naming what went well and what to do differently — builds
      and shows self-reflection.
materialSlugs:
  - rp-writing-a-research-report
  - challenge-research-report-and-presentation

plan:
  summary: >-
    Make the insights usable by others: structure them into an evidence-based account, turn that into
    a format that fits the audience, and share it — standing behind the method and evidence.
  steps:
    - title: Who needs to hear this
      kind: orientation
      facilitatedHours: 0.25
      guidance: >-
        Decide the real audience for the insights and what you want them to understand or do. Format
        follows audience, so settle this before choosing how to present.
    - title: Write up the findings
      kind: activity
      materialSlug: rp-writing-a-research-report
      facilitatedHours: 1.5
      guidance: >-
        Structure the insights into a clear, evidence-based account. Even if the final output is not a
        written report, this organises the argument that every format will carry.
      independentTask: Draft your findings as a structured, evidence-based account.
    - title: Build and share the output
      kind: activity
      materialSlug: challenge-research-report-and-presentation
      facilitatedHours: 1.5
      guidance: >-
        Turn the account into the chosen output — report, poster, infographic, presentation or short
        video — and present it to the audience. Rehearse fielding questions about the method and
        evidence.
      independentTask: Prepare your final output and practise presenting it.
    - title: Share, field questions, reflect
      kind: consolidation
      facilitatedHours: 0.5
      guidance: >-
        Learners present to peers or community members, take questions, and reflect on how their
        understanding of the challenge — and their skill as researchers — has grown. The shared output
        plus their responses are the assessable evidence for this skill.
