# Skill module 1 of the "Investigating real-world issues" competency module.
id: mod-framing-a-researchable-question
slug: framing-a-researchable-question
access: public
grain: skill
title: Framing a researchable question
competencyCode: FSI1
parentModuleSlug: investigating-real-world-issues
skill:
  label: Frame a real-world challenge into a researchable question
  description: >-
    Turn a broad concern into a focused question research can actually answer, defining the
    challenge, mapping who and what is involved, and separating what is already known from what still
    needs finding out.
summary: >-
  Where every investigation starts: scoping a broad, real-world concern down to a specific question
  the cohort can research, and mapping the people and factors connected to it.
agencyNote: >-
  A sharp question is the first act of agency in research, it decides what a learner will come to
  understand, and keeps a big, overwhelming issue small enough to act on.
# How this skill develops and demonstrates the module's main competency, FSI1.
anchorContribution:
  develops: >-
    Learners develop the starting move of FSI1, turning a broad, real-world concern into a focused
    question research can actually answer, by defining the shared challenge, surfacing what is already
    known, and mapping who and what is involved.
  demonstrates: >-
    Assess this from what the learner produces: a written research question, a completed "what we
    already know / what we need to find out" audit, and a stakeholder or community map (or a set of
    personas). Look for a learner who narrows a broad challenge to a question that is specific and
    answerable with the evidence and time available, can explain why it is researchable rather than
    too broad, and whose map names real people and factors connected to the challenge.
# Other competencies this skill also develops and demonstrates (from Research Project objective 1).
competencyDevelopment:
  - code: FPS3
    how: >-
      Mapping the people, groups, and systems connected to the challenge, and backing the map with
      early evidence, builds and shows the ability to identify contributing factors.
materialSlugs:
  - dc-importance-of-research
  - dc-defining-the-problem
  - rp-choosing-a-research-question
  - stakeholder-community-mapping
  - dc-creating-personas

# Mini scheme of work: how to run the materials above as one sequence. Each activity narrows the
# focus; the connective steps make sure the question the cohort lands on is genuinely their own.
plan:
  summary: >-
    Move the cohort from a shared concern to one researchable question and a first map of who and what
    is involved. Run it top to bottom; the bridge and consolidation steps carry no material. They are
    where you tie the activities together.
  steps:
    - title: Meet the shared challenge
      kind: orientation
      facilitatedHours: 0.5
      guidance: >-
        Introduce the challenge the whole cohort will investigate and co-create group agreements so it
        feels safe to explore. Learners share what they already notice about it, this rough sense is
        the raw material the sequence will sharpen into a question.
    - title: Make the case for research
      kind: activity
      materialSlug: dc-importance-of-research
      facilitatedHours: 1
      guidance: >-
        Open with WHY research matters before handing over any tool, so learners buy into investigating
        rather than guessing. Draw out that evidence beats assumption, the motivation for everything
        that follows.
    - title: Define the problem
      kind: activity
      materialSlug: dc-defining-the-problem
      facilitatedHours: 1
      guidance: >-
        Turn the broad concern into a sharp problem statement. This is the raw material the research
        question will focus, so keep the statements visible. You will come straight back to them.
      independentTask: Write a one-sentence problem statement about the challenge, in your own words.
    - title: From problem to question
      kind: bridge
      facilitatedHours: 0.5
      guidance: >-
        Run a quick question-storm off the problem statements, then sort the questions from broad to
        researchable. This primes the next activity and lets learners feel the difference between a
        topic and a question before they are asked to write one.
    - title: Choose the research question
      kind: activity
      materialSlug: rp-choosing-a-research-question
      facilitatedHours: 1
      guidance: >-
        Narrow to one specific, researchable question the cohort can answer with the time and access
        they have. This question is the spine of every later skill, do not rush it.
    - title: Map who and what is involved
      kind: activity
      materialSlug: stakeholder-community-mapping
      facilitatedHours: 1
      guidance: >-
        Map the people, groups and systems connected to the challenge. This surfaces whom to approach
        in primary research and the early contributing factors (your FPS3 evidence), so it bridges
        straight into the next skill.
    - title: Build evidence-based personas
      kind: activity
      materialSlug: dc-creating-personas
      facilitatedHours: 1
      guidance: >-
        Turn the map into believable personas of the people most affected, so learners frame their
        research around real human needs rather than their own assumptions. Optional if time is short.
    - title: Lock the question and map
      kind: consolidation
      facilitatedHours: 0.5
      guidance: >-
        The cohort agrees its research question and a first stakeholder map. Capture both. They are
        the assessable evidence for this skill and the starting point for planning primary research.
