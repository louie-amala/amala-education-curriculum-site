# Skill module 3 of the "Investigating real-world issues" competency module.
id: mod-conducting-secondary-research
slug: conducting-secondary-research
access: public
grain: skill
title: Conducting secondary research
competencyCode: FSI1
parentModuleSlug: investigating-real-world-issues
skill:
  label: Find and use credible secondary sources
  description: >-
    Locate what others have already found out about the challenge, searching for and selecting
    secondary sources, and recording them systematically so they can be weighed and cited later.
summary: >-
  Standing on what is already known: finding secondary sources on the challenge and logging them so
  the evidence can be evaluated and drawn on.
agencyNote: >-
  Secondary research lets learners connect their local challenge to wider knowledge, so their
  insights are informed by more than what they can see from where they stand.
anchorContribution:
  develops: >-
    Learners develop the secondary-research side of FSI1, building on what is already known, by
    finding relevant sources on the challenge and recording them systematically for later evaluation.
  demonstrates: >-
    Assess this from an evidence log or annotated bibliography of secondary sources, with each
    source's origin and key points recorded. Look for a learner who finds sources genuinely relevant
    to their question (not just the first results), records them systematically enough to cite and
    weigh later, and can say in a sentence what each source contributes to the challenge.
# Other competencies (from Research Project objective 2).
competencyDevelopment:
  - code: FTS3
    how: >-
      Recording secondary sources systematically in an evidence log builds and shows the ability to
      gather and organise data.
  - code: FPS2
    how: >-
      Deciding which secondary sources are worth relying on begins the work of judging source
      credibility and reliability.
materialSlugs:
  - dc-secondary-research-methods

plan:
  summary: >-
    Build on what others already know: find credible secondary sources on the challenge and log them
    so they can be weighed alongside the primary data. A short skill, one core activity, framed and
    consolidated so the evidence log is genuinely usable.
  steps:
    - title: Why go secondary
      kind: orientation
      facilitatedHours: 0.25
      guidance: >-
        Frame secondary research as connecting the local challenge to wider knowledge, it
        contextualises the primary data learners are gathering and stops them relying only on what they
        can see from where they stand.
    - title: Find and log secondary sources
      kind: activity
      materialSlug: dc-secondary-research-methods
      facilitatedHours: 1.5
      guidance: >-
        Learn where and how to find relevant secondary sources, and start an evidence log. Emphasise
        relevance to the research question over sheer volume, and record enough about each source to
        cite and evaluate it later.
      independentTask: Add three relevant secondary sources to your evidence log, with a note on what each contributes.
    - title: An evidence log worth weighing
      kind: consolidation
      facilitatedHours: 0.25
      guidance: >-
        Learners have a logged set of relevant secondary sources, recorded well enough to cite and
        evaluate. This log is carried straight into the next skill, where its credibility is judged.
