# Skill module 2 of the "Investigating real-world issues" competency module.
# This is the user's worked example of a Skill Module.
id: mod-conducting-primary-research
slug: conducting-primary-research
access: public
grain: skill
title: Conducting primary research
competencyCode: FSI1
parentModuleSlug: investigating-real-world-issues
skill:
  label: Plan and conduct ethical primary research
  description: >-
    Gather first-hand evidence from people and places, choosing a method, designing simple
    instruments (interviews, surveys, observation), and collecting data ethically, with consent,
    privacy, and the safety of participants front of mind.
summary: >-
  Getting evidence straight from the community: planning the research, designing interview and survey
  instruments, and gathering data ethically from the people closest to the challenge.
agencyNote: >-
  Primary research puts learners in direct, respectful contact with their community. Listening to
  people affected by the challenge and treating their perspectives as legitimate evidence.
anchorContribution:
  develops: >-
    Learners develop the core of FSI1, actually conducting research, by choosing methods suited to
    their question, designing simple instruments, and gathering data ethically from community members.
  demonstrates: >-
    Assess this from a drafted and piloted interview guide or survey, a set of completed interviews,
    surveys, or observations with the data recorded, and evidence that consent was sought. Look for a
    learner who chooses a method that fits their question, asks clear, non-leading questions, gathers
    data respectfully and systematically, and can show the primary evidence they collected about the
    challenge.
# Other competencies (from Research Project objective 2).
competencyDevelopment:
  - code: FTS3
    how: >-
      Collecting and systematically recording primary data, interview notes, survey responses,
      observations, builds and shows the ability to gather and organise data.
  - code: FLC1
    how: >-
      Planning and running the research with informed consent, privacy, and participant safety in mind
      builds and shows ethical action.
materialSlugs:
  - rp-planning-your-research
  - dc-being-an-ethical-researcher
  - community-mapping-and-empathy-interviews
  - dc-designing-survey-questions
  - dc-expert-interview-preparation

plan:
  summary: >-
    Turn the research question into a plan and gather first-hand evidence, ethically. Learners plan,
    commit to ethical practice, then build and use the specific instruments (community interviews,
    surveys, expert interviews) their question needs.
  steps:
    - title: Recap the question and map
      kind: orientation
      facilitatedHours: 0.25
      guidance: >-
        Briefly restate the research question and stakeholder map from the previous skill. The plan
        must serve this question, so keep both in view throughout.
    - title: Plan the research
      kind: activity
      materialSlug: rp-planning-your-research
      facilitatedHours: 1
      guidance: >-
        Decide what evidence the question needs and which methods will get it. The plan is the backbone
        of this skill; every instrument below should trace back to a line in it.
    - title: Commit to ethical practice
      kind: activity
      materialSlug: dc-being-an-ethical-researcher
      facilitatedHours: 1
      guidance: >-
        Before designing any instrument, establish consent, privacy and do-no-harm. Doing this now
        means ethics shapes the instruments rather than being bolted on afterwards. This is your FLC1
        evidence.
    - title: Interview the community
      kind: activity
      materialSlug: community-mapping-and-empathy-interviews
      facilitatedHours: 1.5
      guidance: >-
        Use the stakeholder map to choose whom to interview, and run empathy interviews to hear from
        people affected. This is learners' first real primary data, model good listening before they
        go solo.
      independentTask: Conduct one short interview with someone connected to the challenge.
    - title: Design a survey
      kind: activity
      materialSlug: dc-designing-survey-questions
      facilitatedHours: 1
      guidance: >-
        Where the question needs breadth as well as depth, add a short survey. Draft and pilot the
        questions so they are clear and non-leading before going wide.
    - title: Prepare for expert interviews
      kind: activity
      materialSlug: dc-expert-interview-preparation
      facilitatedHours: 1
      guidance: >-
        For depth on causes or context, prepare focused questions for an expert. Contrast this with the
        empathy interviews so learners choose the right tool for each sub-question.
    - title: Gather and organise the data
      kind: consolidation
      facilitatedHours: 0.5
      guidance: >-
        Learners run their instruments and bring the data together in one place. The organised primary
        data set is the assessable evidence for this skill and the input to evaluating evidence next.
      independentTask: Complete your interviews and surveys, and record every response in one place.
