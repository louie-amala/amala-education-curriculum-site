# Skill module 4 of the "Investigating real-world issues" competency module.
id: mod-evaluating-evidence-and-building-insights
slug: evaluating-evidence-and-building-insights
access: public
grain: skill
title: Evaluating evidence and building insights
competencyCode: FSI1
parentModuleSlug: investigating-real-world-issues
skill:
  label: Weigh evidence and turn it into actionable insight
  description: >-
    Move from raw findings to insight — judging the credibility of sources, organising data so
    patterns show, and distilling a small number of clear, evidence-based, actionable insights.
summary: >-
  The analytical heart of the cycle: evaluating how much to trust each source, then turning a pile of
  findings into a few actionable insights rather than just a summary of what was found.
agencyNote: >-
  Judging evidence and naming what it means is where a learner stops being a collector of information
  and becomes someone whose conclusions can guide action.
anchorContribution:
  develops: >-
    Learners develop the analytical heart of FSI1 — moving from raw data to insight — by weighing
    source credibility, organising evidence so patterns show, and distilling actionable insights.
  demonstrates: >-
    Assess this from an evidence log annotated with credibility judgements, data sorted into themes or
    patterns, and a written insights statement. Look for a learner who gives reasons why a source is
    or is not reliable, separates evidence-based claims from opinion, names the patterns and
    contributing factors in the evidence, and states a small number of actionable insights that follow
    from the evidence rather than simply restating what was found.
# Other competencies (from Research Project objective 3). ATS1/APS3 are Advanced stretch for a
# preparatory cohort; the required spine is the Foundational competencies, led by FSI1.
competencyDevelopment:
  - code: FPS2
    how: >-
      Judging the credibility, reliability, and relevance of each source before relying on it builds
      and shows source evaluation.
  - code: FPS3
    how: >-
      Establishing, with evidence, the factors contributing to the challenge builds and shows the
      ability to identify contributing factors.
  - code: ATS1
    how: >-
      Analysing and interpreting the gathered data to uncover what it means builds and shows data
      analysis (an Advanced stretch).
  - code: APS3
    how: >-
      Spotting trends and relationships across the evidence builds and shows pattern identification
      (an Advanced stretch).
