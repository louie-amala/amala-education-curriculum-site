title: DAFI Tertiary Scholarship Programme
provider:
  name: UNHCR
  type: un-agency
summary: >-
  UNHCR's scholarship for refugees to study an undergraduate degree in their
  country of asylum. It runs in around 50 countries, and each country office sets
  its own deadline and application route.
whoItIsFor: >-
  Refugees who have finished secondary school and want to study for a degree in
  the country they are living in now. Ask your local UNHCR office when the call
  opens where you are.
applicant:
  appliedBy: learner
requirements:
  qualifications:
    - "Completed secondary school with results meeting the university's entry requirements"
  documents:
    required: ["Proof of registration with UNHCR", "Secondary school certificate"]
    passportRequired: false
    alternativesAccepted: "[to verify] Practice on lost certificates varies by country office."
    note: "Requirements are set per country. Confirm locally."
  deadline:
    type: annual-cycle
    date: null
    opensAround: "mid-year — the date varies by country"
    note: >-
      There is no single global deadline. See the country instances below, and
      confirm with your local UNHCR office.
  language:
    ofDelivery: []
    required: []
    note: "Depends on the university and country."
  cost:
    toApply: free
    toParticipate: funded
    fundingIncludes: ["Tuition", "Study materials", "Living allowance", "Transport"]
    fundingExcludes:
      - "[to verify] Confirm locally — coverage varies by country office"
    estimatedUnfundedCost:
      status: needs-research
      note: >-
        Coverage varies by country. Ask the local UNHCR education focal point
        what a student is still expected to pay for.
