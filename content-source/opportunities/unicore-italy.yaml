  gender: any
delivery:
  mode: in-person
  location: { country: italy, place: "37 participating universities" }
  relocation: third-country
  visaSupport: true
  visaNote: "A study visa is part of the pathway. The final decision rests with the Italian authorities."
  duration: "Two years"
  timeCommitment: full-time
