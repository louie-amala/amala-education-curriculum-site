id: wusc-student-refugee-program
slug: wusc-student-refugee-program
access: public
kind: funding
subKind: scholarship
title: WUSC Student Refugee Program — study and settle in Canada
provider: { name: World University Service of Canada, type: ngo }
summary: >-
  A programme that combines a scholarship with permanent residence in Canada:
  students arrive as permanent residents and study at a Canadian campus.
whoItIsFor: >-
  Refugee students in the countries where WUSC recruits, who have completed
  secondary school. Selection is competitive and the places are few.
applicant: { appliedBy: learner }
requirements:
  qualifications: ["Completed secondary school with strong results"]
  documents:
    required: ["Secondary certificate", "UNHCR registration"]
    passportRequired: false
    note: "Travel documents are arranged as part of the resettlement process."
  deadline:
    type: annual-cycle
    date: null
    opensAround: "announced locally, often early in the year"
    note: "Recruitment happens in specific camps and countries. Ask locally."
  language:
    ofDelivery: [en, fr]
    required: [{ language: en, level: B2, reason: "Canadian university study" }]
  cost:
    toApply: free
    toParticipate: funded
    fundingIncludes: ["Tuition", "Living costs in the first year", "Travel to Canada", "Permanent residence on arrival"]
    fundingExcludes: ["Living costs after the first year, which taper", "Costs for family members, who are not included"]
    estimatedUnfundedCost:
      status: needs-research
      note: >-
        Support tapers after year one. Understand what you will be expected to
        cover in years two and three before you accept.
