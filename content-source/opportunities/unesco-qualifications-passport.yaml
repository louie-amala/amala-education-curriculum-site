title: UNESCO Qualifications Passport
provider:
  name: UNESCO
  type: un-agency
summary: >-
  An assessment that recognises what you have studied even when your certificates
  are lost or incomplete, based on a questionnaire and an interview. Valid for
  five years.
whoItIsFor: >-
  Anyone who finished, or partly finished, upper secondary school or above and
  cannot prove it because the documents are gone. This exists precisely for
  people whose papers were left behind.
applicant:
  appliedBy: referral
  note: "You are assessed through a participating country's process rather than applying to a deadline."
requirements:
  qualifications: ["Completed or partly completed study at upper secondary level or above"]
  documents:
    required: []
    passportRequired: false
    alternativesAccepted: >-
      Designed for people with insufficient or missing documents. Bring whatever
      you have; the assessment does not depend on it.
  deadline:
    type: rolling
    date: null
    note: "No deadline. Availability depends on whether your country runs the scheme."
  language:
    ofDelivery: []
    required: []
    note: "The interview is conducted with interpretation where needed."
  cost:
    toApply: free
    toParticipate: free
    fundingIncludes: []
    fundingExcludes: ["Travel to the interview location"]
