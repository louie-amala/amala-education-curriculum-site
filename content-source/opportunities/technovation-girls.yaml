title: Technovation Girls
provider:
  name: Technovation
  type: ngo
summary: >-
  A global technology competition where teams of girls build an app or AI project
  to solve a problem in their own community, supported by a mentor. There is no
  selection process — every team that registers takes part.
whoItIsFor: >-
  Girls, and young people who are transgender, non-binary or gender
  non-conforming, aged 8 to 18. You work in a team with a mentor. Nobody is
  turned away at the start.
