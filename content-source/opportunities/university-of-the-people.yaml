title: University of the People — tuition-free online degrees
provider: { name: University of the People, type: university }
summary: >-
  An accredited, non-profit online university with no tuition fees. You pay only
  an assessment fee per course, and refugee students can apply to have it waived.
whoItIsFor: >-
  Anyone who has finished secondary school, has a computer and internet, and can
  study in English. You do not need to leave where you live.
