    required: ["Secondary school certificate or equivalent"]
    passportRequired: false
    note: "[to verify] Confirm what is accepted where the original certificate is lost."
  deadline: { type: rolling, note: "Several intakes a year — check current start dates." }
  language:
    ofDelivery: [en]
    required: [{ language: en, level: B2, reason: "Degree study is in English" }]
  cost:
    toApply: free
    toParticipate: fee
    fundingIncludes: ["No tuition fees"]
    fundingExcludes: ["Per-course assessment fees", "Your own device and internet"]
    estimatedUnfundedCost:
      status: needs-research
      note: >-
        Tuition-free is not cost-free: assessment fees are charged per course.
        Confirm the current fee and whether the refugee waiver applies to you.
