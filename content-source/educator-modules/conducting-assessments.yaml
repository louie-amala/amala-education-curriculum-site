sourceNotes:
  - Extracted from the Conducting Assessments of Competence module pack.
  - Open item — the case decisions are drafted and calibrated but have not had a human moderation pass; ratify before using the bank for live sign-off.
  - Open item — dedicated practice cases and a reconciled Sign-off Guide (the drawn-ten-from-fifteen design) are still to be finalised.
