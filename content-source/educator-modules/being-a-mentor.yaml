    audience: trainer
    note: Facilitation for the two sessions — agendas, prompts, and how to run the scenarios.
  - label: Mentoring scenarios — facilitator set
    file: /downloads/mentor-scenarios-facilitator-set.docx
    format: DOCX
    audience: trainer
    note: The scenarios with facilitation notes, for working through in the sessions.
  - label: Module sign-off guide
    file: /downloads/mentor-sign-off-guide.docx
    format: DOCX
    audience: trainer
    note: How to assess the plan and scenario responses against the three criteria, with the sign-off record to file.
  - label: Participant guide
    file: /downloads/mentor-participant-guide.docx
    format: DOCX
    audience: participant
    note: The participant's guide to the module — the arc, what to do at each stage, and how sign-off works.
  - label: Mentoring Plan and Record
    file: /downloads/mentor-plan-and-record.docx
    format: DOCX
    audience: participant
    note: The document participants plan in, and the deliverable they submit for sign-off.
  - label: Mentoring scenarios — response sheet
    file: /downloads/mentor-scenarios-response-sheet.docx
    format: DOCX
    audience: participant
    note: Where participants write their scenario responses.

