# Educator training module — "Teaching English as a Second Language". Content extracted from the
# module pack (participant, trainer & sign-off guides, session slides, Language Development Planning
# Guide, and Language Development Workbook).
id: edmod-teaching-esl
slug: teaching-english-second-language
access: public
title: Teaching English as a second language
category: component
requirement: Required when a programme has English language development.
status: available

summary: >-
  Developing your learners' English inside the learning they are already doing, at and around CEFR A1.
  Across three live sessions and independent planning, you produce a short scheme that builds English
  into a piece of learning — then keep the planner to extend across your whole course.

forWho: >-
  Educators developing their learners' English within a course, for learners at and around CEFR A1.
  It is programme-agnostic — about how to develop English, whatever course you teach.

outcome: >-
  By the end you will have produced a short scheme (three to six steps for a single piece of learning)
  that develops your learners' English at and around CEFR A1, drawn from the learning they are already
  doing.

format: >-
  Three live sessions of 2 hours, with pre-work and independent work in three phases. You plan in the
  Language Development Planning Guide, with the Language Development Workbook as your reference. Default
  tools are Google Classroom, Chat, and Meet/Zoom.

hours:
  synchronous: 6
  independent: 6
  total: 12
  note: ~1 hr pre-work, three 2-hr live sessions, and ~5 hrs of independent work across three phases.

deliverable:
  title: A short language-development scheme
  detail: >-
    You complete one short scheme in Section 4 of the Planning Guide — three to six steps for a single
    piece of learning, showing the English developing inside it. That scheme, with Sections 1, 2 and 5,
    is what you submit for sign-off. Afterwards the planner is yours to extend across your whole course.

# The Language Development Planning Guide's sections.
workbookSections:
  - n: 1
    title: Your learners and their English
    detail: Who your learners are and their English, with the A1 baseline.
  - n: 2
    title: Language development aims
    detail: The English learners need to take part in the learning, written as things they will be able to do.
  - n: 3
    title: Approaches
    detail: The six approaches to developing English, applied to your context.
  - n: 4
    title: Your scheme
    detail: Three to six steps for a piece of learning — what learners do, the English it builds, and the scaffold.
  - n: 5
    title: Knowing it's working
    detail: What you will look and listen for as evidence the English is developing, and what to do if it isn't yet.
  - n: 6
    title: Readiness checklist
    detail: A self-check against the three sign-off criteria before you submit.

sessions:
  - n: 1
    title: Orientation and the lens
    focus: What A1 looks like · content vs language objectives · building English into learning
    durationHours: 2
    blocks:
      - title: The lens for the module
        detail: What A1 looks like, the difference between a content objective and a language objective, and building English into the learning rather than teaching it apart.
      - title: Share your learners' English
        detail: Share your learners' English with the group — hearing each other's contexts is one of the most useful parts of the training.
      - title: Work through Section 2
        detail: With a partner, name the English learners need to take part in your course and write one or two aims, realistic for A1. You leave with a brief for Independent Work 1.
  - n: 2
    title: Approaches and peer feedback
    focus: Sharing approaches · structured feedback on your draft scheme
    durationHours: 2
    blocks:
      - title: Share your approaches
        detail: Share the approaches from Section 3 you found most useful for your context.
      - title: Peer feedback on your draft scheme
        detail: Give and receive structured peer feedback on your draft scheme, using the protocol, then take time to revise.
  - n: 3
    title: Full scheme feedback and close
    focus: Feedback on your full scheme · readiness checklist · next steps
    durationHours: 2
    blocks:
      - title: Peer feedback on your full scheme
        detail: Structured peer feedback on your complete scheme, using the protocol.
      - title: Section 6 checklist and next steps
        detail: Work through the readiness checklist, set next steps for extending the planner across your whole course, then close and submit for sign-off.

independentWork:
  - label: Pre-work
    afterSession: 0
    hours: "~1 hour"
    when: Before Session 1
    tasks:
      - title: Read Workbook Sections 1–3
        hours: "~30 min"
        detail: How English fits your teaching, what A1 looks like, and writing a language objective as distinct from a content objective.
      - title: Complete Section 1 of the Planning Guide
        hours: "~30 min"
        detail: Your learners and their English, including the A1 baseline — what they can already do and what the learning will ask of them.
  - label: Independent Work 1
    afterSession: 1
    hours: "~2 hours"
    when: Before Session 2
    tasks:
      - title: Complete Section 3 (approaches)
        hours: "~45 min"
        detail: For each of the six approaches, note ideas for your context, bringing the English back into your aims as ideas develop.
      - title: Begin Section 4 (draft your scheme)
        hours: "~1 hr 15 min"
        detail: Using the six-step move, draft three to six steps — for each, what learners do, the English it builds, and the scaffold.
  - label: Independent Work 2
    afterSession: 2
    hours: "~3 hours"
    when: Before Session 3
    tasks:
      - title: Finish Section 4 (your scheme)
        hours: "~1 hr 30 min"
        detail: Complete your scheme, revising against the Session 2 feedback. Keep it to three to six steps for a single piece of learning.
      - title: Complete Section 5 (knowing it's working)
        hours: "~1 hr 30 min"
        detail: Decide what you will look and listen for as evidence the English is developing, and what you will do if learners are not yet getting there.

signOff:
  intro: >-
    Sign-off is based on the language-development scheme you produce during the training. There is no
    observed teaching and no separate sign-off conversation at this stage. A pass means you hold the
    module, which travels with you across Amala programmes.
  submits:
    - A short language-development scheme (three to six steps for a single piece of learning) at and around CEFR A1, showing explicit language development drawn from the learning learners are already doing.
    - Sections 1, 2 and 5 of the Planning Guide.
  criteria:
    - title: Pitched to the level
      met: The English is realistic and scaffolded for learners at and around CEFR A1.
    - title: Sound language-development approach
      met: Clear language aims, developed through real use and meaningful communication.
    - title: Purposeful and connected
      met: The English is drawn from learning that matters and connects to the wider learning rather than sitting apart.
  threshold: >-
    All three criteria Met is a pass. If any is Not yet, the trainer gives specific written feedback
    and the educator has one resit — a revised submission, with no follow-up call. If the resit is
    still Not yet, the educator re-enrols on a future cohort.

