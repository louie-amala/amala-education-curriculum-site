<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430" role="img" aria-label="Effort/impact matrix: a two-by-two grid with effort on the horizontal axis and impact on the vertical axis. High impact and low effort is 'Do first'; high impact and high effort is 'Plan for these'; low impact and low effort is 'Fill-ins'; low impact and high effort is 'Avoid for now'.">
  <style>
    .qt { font: 700 18px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #041E42; }
    .qs { font: 400 12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #4b5563; }
    .ax { font: 700 13px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #004976; letter-spacing: .06em; }
    .lo { font: 400 12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #97999B; }
  </style>
  <!-- quadrants: plot area x 90..470, y 40..340, mid x 280, mid y 190 -->
  <rect x="90" y="40" width="190" height="150" fill="#8F993E" fill-opacity="0.16"/>
  <rect x="280" y="40" width="190" height="150" fill="#4797A8" fill-opacity="0.16"/>
  <rect x="90" y="190" width="190" height="150" fill="#97999B" fill-opacity="0.13"/>
  <rect x="280" y="190" width="190" height="150" fill="#BD472A" fill-opacity="0.13"/>
  <!-- grid outline + divider lines -->
  <rect x="90" y="40" width="380" height="300" fill="none" stroke="#004976" stroke-width="1.5"/>
  <line x1="280" y1="40" x2="280" y2="340" stroke="#004976" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="90" y1="190" x2="470" y2="190" stroke="#004976" stroke-width="1" stroke-opacity="0.5"/>
  <!-- quadrant labels -->
  <text class="qt" x="185" y="105" text-anchor="middle">Do first</text>
  <text class="qs" x="185" y="126" text-anchor="middle">high impact, low effort</text>
  <text class="qt" x="375" y="105" text-anchor="middle">Plan for these</text>
  <text class="qs" x="375" y="126" text-anchor="middle">high impact, high effort</text>
  <text class="qt" x="185" y="255" text-anchor="middle">Fill-ins</text>
  <text class="qs" x="185" y="276" text-anchor="middle">low impact, low effort</text>
  <text class="qt" x="375" y="255" text-anchor="middle">Avoid for now</text>
  <text class="qs" x="375" y="276" text-anchor="middle">low impact, high effort</text>
  <!-- Y axis: Impact -->
  <text class="ax" x="34" y="190" text-anchor="middle" transform="rotate(-90 34 190)">IMPACT</text>
  <text class="lo" x="62" y="52" text-anchor="middle" transform="rotate(-90 62 52)">high</text>
  <text class="lo" x="62" y="330" text-anchor="middle" transform="rotate(-90 62 330)">low</text>
  <!-- X axis: Effort -->
  <text class="ax" x="280" y="392" text-anchor="middle">EFFORT</text>
  <text class="lo" x="120" y="362" text-anchor="middle">low</text>
  <text class="lo" x="440" y="362" text-anchor="middle">high</text>
</svg>
